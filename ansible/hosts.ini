# One entry per shoggoth instance. `inventory_hostname` IS the instance
# name — it is what the deployment passes as `INSTANCE` — and `--limit`
# selects on it. Deploying one instance is
#
#     ansible-playbook ansible/deploy.yml --limit shoggoth-test
#
# Both entries point at the same machine today. That is not a placeholder:
# shoggoth and shoggoth-test are two instances on one host, and only
# `identity.domain` is deliberately shared between the two config files
# (see shoggoth/shoggoth-test.yaml).
#
# THERE IS NO ADDRESS HERE, deliberately. There used to be one —
# `ansible_host=host.s.local` — and it resolved for nothing: the client
# setup writes <ip> <domain> and <ip> <service>.<domain>
# (setup-client.sh's update_hosts) but never host.<domain>, and .local is
# the mDNS TLD. A plausible-looking name that never connects is worse than
# none, and so is none at all: with no `ansible_host` declared, Ansible
# falls back to `inventory_hostname`, and `shoggoth` DOES resolve in a
# cluster DNS — a hand-run play would reach a live server that is not the
# one asked for.
#
# So the connection host lives in group_vars/instances.yml as
# `{{ lookup('env', 'HOST_IP') }}`, which fails the connection step outright
# when unset instead of reaching anything. The deployment passes the same
# value as `-e ansible_host`, which outranks it. A hand-run playbook needs
# `HOST_IP=<ip>` in its environment.
#
# When host-OS configuration migrates out of shoggoth.nix, add a group of
# REAL machines and give the instances an address to point at:
#
#     [shoggoth_hosts]
#     host_s_local
#
#     [instances]
#     shoggoth      ansible_host=host_s_local
#     shoggoth-test ansible_host=host_s_local
#
# That is the moment an address belongs in this file — when there is a machine
# with a name that resolves to point at. An instance is a deployable unit, not
# a machine, and one machine can carry several.
[instances]
shoggoth
shoggoth-test
