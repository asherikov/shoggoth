---
# Fetch the cluster admin kubeconfig from the host and write it to
# ${KUBECONFIG}.
#
# `slurp` reads /etc/rancher/k3s/k3s.yaml as root on the host and returns it
# base64-encoded; the delegated `copy` below decodes it into ${KUBECONFIG}.
# Both run over the same SSH connection every other playbook uses, with no
# tunnel in the path.
- name: Fetch the kubeconfig from the host
  hosts: instances
  gather_facts: false

  tasks:
    - name: Ensure the local private directory exists
      ansible.builtin.file:
        path: "{{ shoggoth_kubeconfig | dirname }}"
        state: directory
        # `mkdir -p private`. shoggoth/data/private is 0700, and the
        # kubeconfig is a cluster credential, so the directory is too.
        mode: "0700"
      delegate_to: localhost
      become: false

    - name: Fetch the kubeconfig
      block:
        - name: Read the kubeconfig from the host
          become: true
          ansible.builtin.slurp:
            src: /etc/rancher/k3s/k3s.yaml
          register: shoggoth_k3s_kubeconfig
          # The kubeconfig is a cluster admin credential. no_log on the READ
          # keeps it out of the task output: the registered fact holds the
          # whole file, and without this flag `-v` — or any stdout callback,
          # including the json one ansible.posix ships — prints the base64
          # credential. The write below needs the same flag for the same
          # reason, and a fact with no_log stays consumable by the tasks that
          # read it.
          no_log: true

        - name: Write the kubeconfig locally
          ansible.builtin.copy:
            content: "{{ shoggoth_k3s_kubeconfig.content | b64decode }}"
            dest: "{{ shoggoth_kubeconfig }}"
            # `chmod 600`.
            mode: "0600"
          delegate_to: localhost
          become: false
          no_log: true
          # The kubeconfig is a cluster admin credential. no_log keeps it out
          # of the task output and out of any log aggregation.

      rescue:
        # no_log masks the failing task's OWN output, which is why a failure
        # here used to report nothing at all: the reader got "the output has
        # been hidden due to the fact that 'no_log: true' was specified for
        # this result" and no way to tell a missing file from a full disk.
        # The masking is a display-time flag on the result, not a mutation of
        # it, so `ansible_failed_result` still carries the module's own `msg`
        # — and `msg` is the error text, never the file content, so
        # re-printing it from a task with no_log off leaks nothing.
        - name: Say why the kubeconfig could not be written
          ansible.builtin.debug:
            msg: >-
              FAILED {{ ansible_failed_task.name | default('a step of the kubeconfig fetch') }}:
              {{ ansible_failed_result.msg | default('no reason was given') }}
          delegate_to: localhost
          become: false

        - name: Stop, leaving any existing kubeconfig in place
          ansible.builtin.fail:
            msg: >-
              The kubeconfig could not be fetched from {{ inventory_hostname }},
              so {{ shoggoth_kubeconfig }} was not written. Nothing was changed.
          delegate_to: localhost
          become: false
