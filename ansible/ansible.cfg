[defaults]
# Every playbook lives beside this file, and the inventory does too, so
# `inventory_dir` is the ansible tree root. group_vars/instances.yml derives
# every path from it — see the note there.
inventory = hosts.ini

# `host_key_checking = False` makes Ansible pass
# `-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null` down to the
# rsync `--rsh` it builds (verified — the command is recorded in
# ansible/README.md). There is nothing further to configure.
host_key_checking = False

# Whatever python3 is first on each host's PATH is the interpreter used.
# auto_silent takes it without the discovery warning.
interpreter_python = auto_silent

# A failed play leaves .retry files next to the inventory. They are noise in
# a repo that is committed.
retry_files_enabled = False

[ssh_connection]
# Connections are not shared. If the many small kubectl/helm invocations in
# deploy.yml turn out to be slow, this is the knob — uncomment and the deploy
# reuses one SSH session.
#ssh_args = -o ControlMaster=auto -o ControlPersist=60s
