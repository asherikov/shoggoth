[defaults]
# Every playbook lives beside this file, and the inventory does too, so
# `inventory_dir` is the ansible tree root. group_vars/instances.yml derives
# every path from it — see the note there.
inventory = hosts.ini

# `host_key_checking = False` makes Ansible pass
# `-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null` down to the
# rsync `--rsh` it builds (verified — the command is recorded in
# ansible/README.md). There is nothing further to configure.
host_key_checking = False

# Whatever python3 is first on each host's PATH is the interpreter used.
# auto_silent takes it without the discovery warning.
interpreter_python = auto_silent

# Ansible stages every module in a directory on the target, and the default
# `~/.ansible/tmp` cannot be used here: the tilde is resolved by the target's
# SHELL, not by ansible. `_make_tmp_path` rewrites a leading `~` into
# `~<remote_user>` and runs `echo` through the connection to expand it
# (plugins/action/__init__.py:519-532 and 960-1017). The remote user of a
# `local` connection is `getpass.getuser()` — the plugin declares no
# `remote_user` option, so `_get_remote_user` falls back to the connection's
# `default_user` — and `getpass` reads $LOGNAME/$USER before it looks at the
# passwd database. The Makefile passes `-e USER=<host user>` because the
# client image has no passwd entry for the invoking uid, so the shell is
# asked to expand a user that does not exist in the container, prints the
# string back unchanged, and the tmp path stays RELATIVE: `mkdir -p` then
# creates a directory literally named `~<host user>` in the working
# directory — for a hand-run play that is this directory, i.e. junk in the
# repo — and any later run by a different uid fails the mkdir and reports
# its task UNREACHABLE with "Failed to create temporary directory".
#
# An absolute path short-circuits the whole path: `_remote_expand_user`
# returns anything that does not start with `~` untouched. /tmp is the
# right root because the client container is `docker run --rm`, so its /tmp
# is fresh for every play and no directory from an earlier run can survive
# with the wrong ownership.
#
# `local_tmp`, the controller-side staging dir, is pinned to the same /tmp
# path so staging does not depend on whatever HOME a call site passes: the
# image bakes HOME=/tmp, but a call site that overrides it — or a future
# image that drops the ENV — would otherwise move the controller's staging
# with it. /tmp is the right root for the same reason it is right for
# remote_tmp: the container is `docker run --rm`, so the path is fresh for
# every play and nothing from an earlier run survives it with the wrong
# ownership.
remote_tmp = /tmp/.ansible/tmp
local_tmp = /tmp/.ansible/tmp

# A failed play leaves .retry files next to the inventory. They are noise in
# a repo that is committed.
retry_files_enabled = False

[ssh_connection]
# Every ssh the plays open — the connection plugin's own and the
# synchronize task's `rsync --rsh ssh` alike — reads NO config file:
# `-F /dev/null` replaces both the default `~/.ssh/config` and the system
# one. The default's `~` is the passwd entry's home, a path that does not
# exist in the image, and relying on that absence is what this replaces:
# the day a home IS visible to the container, the operator's own config
# would silently reach every play. The host-key hygiene such a config
# would otherwise carry comes from `host_key_checking = False` above,
# which ansible passes to its own ssh and to the rsync `--rsh` alike. This
# does not retire the /etc/passwd mount: ssh resolves
# its uid unconditionally — `ssh -F <file> -G host` still dies with "No
# user exists for uid <uid>" when the entry is missing.
ssh_common_args = -F /dev/null

# Connections are not shared. If the many small kubectl/helm invocations in
# deploy.yml turn out to be slow, this is the knob — uncomment and the deploy
# reuses one SSH session.
#ssh_args = -o ControlMaster=auto -o ControlPersist=60s
