apiVersion: 1

datasources:
    - name: VictoriaMetrics
      type: prometheus
      access: proxy
      uid: vm
      url: http://victoria-metrics:80
      isDefault: true
      editable: false
    - name: Loki
      type: loki
      access: proxy
      uid: loki
      url: http://loki:3100
      editable: false
    - name: Tempo
      type: tempo
      access: proxy
      uid: tempo
      url: http://tempo:3200
      editable: false
      jsonData:
          search:
              hide: false
          tracesToMetrics:
              datasourceUid: vm
              tags:
                  - key: service
                    value: service
                  - key: span_name
                    value: span_name
          tracesToLogs:
              datasourceUid: loki
              filterByTraceID: true
              filterBySpanID: true
              tags:
                  - key: service
                    value: service