stream_over_http_enabled: true

server:
    http_listen_port: 3200
    log_level: warn

memory:
    automemlimit_enabled: true
    automemlimit_ratio: 0.8

distributor:
    receivers:
        otlp:
            protocols:
                http:
                    endpoint: 0.0.0.0:4318

storage:
    trace:
        backend: local
        local:
            path: /var/tempo/traces
        wal:
            path: /var/tempo/wal

live_store:
    wal:
        path: /var/tempo/live-store/traces
    max_live_traces_bytes: 100000000
    complete_block_timeout: 10m
    shutdown_marker_dir: /var/tempo/live-store/shutdown-marker

backend_scheduler:
    provider:
        retention:
            interval: 1h
        compaction:
            compaction:
                block_retention: 168h
                compacted_block_retention: 1h

metrics_generator:
    registry:
        external_labels:
            source: tempo
    storage:
        path: /var/tempo/generator/wal
        remote_write:
            - url: http://victoria-metrics:80/api/v1/write
              send_exemplars: true
    processor:
        span_metrics:
            dimensions:
                # Intrinsic dimensions (service, span_name, span_kind, status_code) are always present.
                # Only list additional span attributes here that should become labels.
                # span_name multiplies series per service — safe only while span names are low-cardinality.
                # Remove if any service emits unbounded span names (e.g. URL paths, request IDs).
                - span_name

overrides:
    defaults:
        global:
            max_bytes_per_trace: 1000000
        metrics_generator:
            processors: [span-metrics]
            processor:
                span_metrics:
                    dimensions:
                        - span_name
