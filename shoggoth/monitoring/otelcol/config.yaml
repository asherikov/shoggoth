extensions:
    docker_observer:
        endpoint: unix:///var/run/docker.sock
        excluded_images:
            - 'otel/opentelemetry-collector-contrib*'
        timeout: 5s
        cache_sync_interval: 60m

receivers:
    otlp:
        protocols:
            grpc:
                endpoint: 0.0.0.0:4317
            http:
                endpoint: 0.0.0.0:4318

    receiver_creator/docker-logs:
        watch_observers: [docker_observer]
        receivers:
            filelog/per-container:
                rule: type == "container"
                resource_attributes:
                    container.id: '`container_id`'
                    container.name: '`name`'
                    container.image.name: '`image`'
                    compose.service: '`labels["com.docker.compose.service"]`'
                config:
                    include:
                        - /var/lib/docker/containers/`container_id`/`container_id`-json.log
                    include_file_path: false
                    include_file_name: false
                    start_at: end
                    poll_interval: 200ms
                    operators:
                        - id: container-parser
                          type: container
                          format: docker
                          add_metadata_from_filepath: false

    docker_stats:
        collection_interval: 15s
        container_labels_to_metric_labels:
            com.docker.compose.service: compose_service
        env_vars_to_metric_labels:
            SHOGGOTH_DOMAIN: shoggoth_domain
        metrics:
            container.restarts:
                enabled: true
            container.uptime:
                enabled: true
            container.memory.rss:
                enabled: true
            container.memory.cache:
                enabled: true

    hostmetrics:
        root_path: /host
        collection_interval: 15s
        scrapers:
            cpu:
            load:
            memory:
                metrics:
                    system.linux.memory.available:
                        enabled: true
                    system.memory.limit:
                        enabled: true
            disk:
            filesystem:
                metrics:
                    system.filesystem.utilization:
                        enabled: true
            network:
            processes:

    prometheus:
        config:
            scrape_configs:
                - job_name: git-pages
                  scrape_interval: 15s
                  static_configs:
                      - targets:
                            - git-pages:9253
                  metric_relabel_configs:
                      - source_labels: [instance]
                        target_label: instance_name
                        regex: "(.+)"
                      - source_labels: [instance]
                        target_label: hostname
                        regex: "([^:]+):.*"
                      - source_labels: [job]
                        target_label: job_name
                        regex: "(.+)"
                - job_name: otelcol
                  scrape_interval: 15s
                  static_configs:
                      - targets:
                            - otelcol:8888
                  metric_relabel_configs:
                      - source_labels: [job]
                        target_label: job_name
                        regex: "(.+)"
                - job_name: litellm
                  scrape_interval: 15s
                  metrics_path: /metrics/
                  static_configs:
                      - targets:
                            - litellm:80
                  metric_relabel_configs:
                      - source_labels: [job]
                        target_label: job_name
                        regex: "(.+)"

processors:
    memory_limiter:
        check_interval: 1s
        limit_mib: 4000
        spike_limit_mib: 800
    resourcedetection:
        detectors: [env, system]
        timeout: 5s
        system:
            hostname_sources: [os]
    transform/docker-meta:
        log_statements:
            - context: resource
              statements:
                  - set(attributes["container.runtime"], "docker")
                  - set(attributes["service.name"], attributes["container.name"]) where attributes["container.name"] != nil
    batch:
        send_batch_size: 1024
        send_batch_max_size: 2048
        timeout: 10s

exporters:
    prometheusremotewrite:
        endpoint: http://victoria-metrics:80/api/v1/write
        tls:
            insecure: true
        resource_to_telemetry_conversion:
            enabled: true
    otlp_http/tempo:
        endpoint: http://tempo:4318
        tls:
            insecure: true
    otlp_http/loki:
        endpoint: http://loki:3100/otlp
        tls:
            insecure: true

service:
    extensions: [docker_observer]
    telemetry:
        logs:
            level: warn
        metrics:
            level: detailed
            readers:
                - pull:
                    exporter:
                        prometheus:
                            host: '0.0.0.0'
                            port: 8888
    pipelines:
        traces:
            receivers:
                - otlp
            processors:
                - memory_limiter
                - batch
            exporters:
                - otlp_http/tempo
        logs:
            receivers:
                - receiver_creator/docker-logs
                - otlp
            processors:
                - memory_limiter
                - resourcedetection
                - transform/docker-meta
                - batch
            exporters:
                - otlp_http/loki
        metrics:
            receivers:
                - docker_stats
                - hostmetrics
                - otlp
                - prometheus
            processors:
                - memory_limiter
                - resourcedetection
                - batch
            exporters:
                - prometheusremotewrite
