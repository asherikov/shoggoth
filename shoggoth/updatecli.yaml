# Bump every pinned version in this tree.
#
# Updatecli's designed flow is "read a version from a registry, write it into a
# file": there is no clone, no branch, no commit and no pull request. The scm is
# disabled and the apply flags below belt-and-brace it, so a run only ever edits
# the working tree and leaves the commit to the developer. See docs/alternatives.md.
#
# This file lives in shoggoth/ but every path below is REPO-ROOT-relative, so
# `options.relativepaths` is deliberately left unset: the default
# "workingdirectory" resolves them against the process working directory, which
# the make target pins to the repo root with `-w`. Setting "manifest" would
# anchor them next to this file instead and every path would need a `../`.
#
# `sources` and `targets` are maps keyed by resource id, not lists: that is what
# Config.Sources / Config.Targets are (map[string]source.Config). The key is the
# id a target's `sourceid` points at.
#
# Targets that write the same file are chained with `dependson`. Updatecli runs
# each DAG vertex in its own goroutine and the file target is an unsynchronised
# read-modify-write, so without the chain two targets on one file would race and
# one of the two updates would be lost. The chains always run from a lower id to
# a higher one in the order below, so they cannot form a loop.
#
# The last two targets are the exception to "one target, one pinned image": the
# CRD submodules under shoggoth/crd/ have no version in any file to rewrite — a
# submodule pointer is a gitlink in the superproject's index — so they are pinned
# in shoggoth/crd/versions.yaml and checked out by the `update` target in
# make/chore.mk. See docs/alternatives.md.
name: Bump pinned versions

scms:
  local:
    disabled: true

sources:
  postgres:
    kind: dockerimage
    spec:
      image: postgres
      tagfilter: '^\d+(\.\d+)*-alpine$'
      versionfilter:
        kind: regex/semver
        regex: '^(\d+(?:\.\d+)*)-alpine$'
  redmine:
    kind: dockerimage
    spec:
      image: redmine
      tagfilter: '^\d+(\.\d+)*-alpine3\.24$'
      versionfilter:
        kind: regex/semver
        regex: '^(\d+(?:\.\d+)*)-alpine3\.24$'
  docker-dind:
    kind: dockerimage
    spec:
      image: docker
      tagfilter: '^\d+(\.\d+)*-dind$'
      versionfilter:
        kind: regex/semver
        regex: '^(\d+(?:\.\d+)*)-dind$'
  silverbullet:
    kind: dockerimage
    spec:
      image: zefhemel/silverbullet
      tagfilter: '^\d+(\.\d+)*-slim$'
      versionfilter:
        kind: regex/semver
        regex: '^(\d+(?:\.\d+)*)-slim$'
  apt-cacher-ng:
    kind: dockerimage
    spec:
      image: sameersbn/apt-cacher-ng
      tagfilter: '^\d+(\.\d+)*-\d{8}$'
      versionfilter:
        kind: regex/semver
        regex: '^(\d+(?:\.\d+)*)-'
  it-tools:
    kind: dockerimage
    spec:
      image: corentinth/it-tools
      tagfilter: '^\d{4}\.\d+\.\d+-[0-9a-f]{7,}$'
      versionfilter:
        kind: regex/time
        regex: '^(\d{4}\.\d+\.\d+)-'
        pattern: '2006.1.2'
