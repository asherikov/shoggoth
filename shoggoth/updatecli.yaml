targets:
  postgres:
    kind: file
    sourceid: postgres
    spec:
      files:
        - shoggoth/chart/templates/cdash.yaml
        - shoggoth/chart/templates/redmine.yaml
      matchpattern: 'image: postgres:([A-Za-z0-9][A-Za-z0-9._-]*)'
      replacepattern: 'image: postgres:{{ source "postgres" }}'
  redmine:
    kind: file
    sourceid: redmine
    dependson:
      - target#postgres
    spec:
      file: shoggoth/chart/templates/redmine.yaml
      matchpattern: 'image: redmine:([A-Za-z0-9][A-Za-z0-9._-]*)'
      replacepattern: 'image: redmine:{{ source "redmine" }}'
