# Per-instance shoggoth configuration.
#
# THIS FILE IS THE SOURCE OF TRUTH. The install passes it to Helm with
# --values; the chart derives every SHOGGOTT_* pod environment variable from
# it (see e.g. chart/templates/git-pages.yaml, wireguard.yaml, openldap.yaml).
#
# There is no variable injection: nothing is passed with --set, and the
# installer reads values out of this file rather than defining them separately.
#
# `shoggoth/chart/values.yaml` documents every key and its default; anything
# omitted here falls back to that default. Ports are quoted strings to match
# the chart's own types.
#
# The pre-chart `shoggoth.env` remains only for host-install rendering
# (shoggoth.nix, ports.nix via envsubst at install time). It is no longer a
# source for anything Helm reads.

identity:
  # Also SHOGGOTH_DOMAIN for pods; the domain every service is reachable at.
  domain: s.local
  # SHOGGOTT_GITHUB_ORG
  githubOrg: asherikov
  # SHOGGOTT_DNS_IP — the CoreDNS service IP. See chart/templates/dns.yaml.
  dnsIp: 10.43.0.53
  # Release/instance name. Drives the host paths under
  # /var/lib/rancher/k3s/storage/<instanceDir>/. Normally $(INSTANCE).
  instanceDir: shoggoth

network:
  webExternal:
    # Port for the wireguard-over-HTTPS endpoint (SHOGGOTT_WEB_EXT_PORT).
    hostPort: "51443"
  wireguard:
    udpPort: "51820"
    uiPort: "51821"
  registry:
    # In-cluster registry Service port (SHOGGOTT_REGISTRY_PORT). Rendered
    # unquoted into `port:`, so it must be a positive integer — a non-numeric
    # or empty value renders as 0 and the API server rejects the Service.
    hostPort: "80"

ai:
  defaultModel: openai/MiniMax-M3
  defaultApi: https://api.minimax.io/v1
  # Path to the token FILE inside the openbao-init Job container, not to a K8s
  # Secret. The Job mounts the host's synced copy of shoggoth/data/private at
  # /shoggoth/private (chart/templates/openbao.yaml), and openbao-bootstrap
  # reads this file on every run and mirrors it into OpenBao's
  # ai/default-token, which the ai-default-token ExternalSecret then projects.
  defaultTokenFileRef: /shoggoth/private/ai-default-token.txt

gitea:
  serverTokenFileRef: /shoggoth/private/gitea-server-token.txt
