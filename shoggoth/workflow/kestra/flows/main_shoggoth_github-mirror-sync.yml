id: github-mirror-sync
namespace: shoggoth
disabled: false

concurrency:
  limit: 1
  behavior: CANCEL

tasks:
  - id: sync
    type: io.kestra.plugin.scripts.shell.Commands
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      #pullPolicy: ALWAYS
      networkMode: host
    containerImage: registry.s.local/slave_noble:dind
    commands:
      - 'python3 /shoggoth/workflow/scripts/shoggoth_gitea.py github-mirror-sync $(echo "{{ envs.shoggoth_github_org }}" | tr "," " ")'
    env:
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otelcol:4318"
      GITEA_SERVER_URL: "http://git.{{ envs.shoggoth_domain }}"
      GITEA_ADMIN_TOKEN: "{{ envs.gitea_admin_token }}"
      SHOGGOTH_DOMAIN: "{{ envs.shoggoth_domain }}"
