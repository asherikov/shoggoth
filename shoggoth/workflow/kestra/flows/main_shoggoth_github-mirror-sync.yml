id: github-mirror-sync
namespace: shoggoth
disabled: false

concurrency:
  limit: 1
  behavior: CANCEL

tasks:
  - id: sync
    type: io.kestra.plugin.scripts.shell.Commands
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      #pullPolicy: ALWAYS
      networkMode: host
      volumes:
        - "/shoggoth/git-cred:/shoggoth/git-cred"
        - "/shoggoth/ci_cache:/cache"
        - "/host_volumes/workflow-scripts:/shoggoth/workflow/scripts:ro"
    containerImage: registry.s.local/slave_noble:latest
    commands:
      - 'python3 /shoggoth/workflow/scripts/shoggoth_maintenance.py --verbose github-mirror-sync $(echo "{{ envs.shoggoth_github_org }}" | tr "," " ") 2>&1'
    env:
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otelcol:4318"
      GITEA_SERVER_URL: "http://git.{{ envs.shoggoth_domain }}"
      GITEA_ADMIN_TOKEN: "{{ envs.gitea_admin_token }}"
      SHOGGOTH_DOMAIN: "{{ envs.shoggoth_domain }}"
