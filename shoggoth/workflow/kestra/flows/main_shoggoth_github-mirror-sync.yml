id: github-mirror-sync
namespace: shoggoth
disabled: false

concurrency:
  limit: 1
  behavior: CANCEL

tasks:
  - id: sync
    type: io.kestra.plugin.scripts.shell.Commands
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      #pullPolicy: ALWAYS
      networkMode: host
    containerImage: docker-registry.s.local/slave_noble:dind
    commands:
      - 'export PATH="/shoggoth/workflow/scripts:${PATH}" && rc=0; for org in $(echo "{{ envs.shoggoth_github_org }}" | tr "," " "); do github_mirror_sync.sh "$org" || rc=1; done; exit ${rc}'
    env:
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otelcol:4318"