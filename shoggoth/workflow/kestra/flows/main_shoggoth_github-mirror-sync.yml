id: github-mirror-sync
namespace: shoggoth
disabled: false

concurrency:
  limit: 1
  behavior: CANCEL

tasks:
  - id: sync
    type: io.kestra.plugin.scripts.shell.Commands
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      #pullPolicy: ALWAYS
      networkMode: host
      volumes:
        - "/shoggoth/git-cred:/shoggoth/git-cred"
        - "/cache:/cache"
        - "/host_volumes/workflow-scripts:/shoggoth/workflow/scripts:ro"
    containerImage: registry.s.local/slave:noble
    commands:
      - 'python3 /shoggoth/workflow/scripts/shoggoth_maintenance.py --verbose github-mirror-sync $(echo "{{ envs.shoggoth_github_org }}" | tr "," " ") 2>&1'
    env:
      GITEA_ADMIN_TOKEN: "{{ envs.gitea_admin_token }}"
      # Override the slave image's baked-in `GITEA_SERVER_URL=http://api/gitea`
      # (which would send Host=`api` and miss Angie `server_name api.${SHOGGOTH_DOMAIN}`).
      # Bypass Angie and hit the gitea Service directly — same pattern
      # `main_shoggoth_maintenance.yml` uses for `setup_*` tasks; matches
      # the script's expectation of an admin-token-authenticated direct call.
      GITEA_SERVER_URL: "http://git.{{ envs.shoggoth_domain }}"
      SHOGGOTH_DOMAIN: "{{ envs.shoggoth_domain }}"
