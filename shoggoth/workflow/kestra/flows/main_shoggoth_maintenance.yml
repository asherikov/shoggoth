id: maintenance
namespace: shoggoth
disabled: false

concurrency:
  limit: 1
  behavior: CANCEL

#triggers:
#  - id: schedule
#    type: io.kestra.plugin.core.trigger.Schedule
#    cron: "0 3 * * *"
#    allowConcurrent: false

tasks:
  - id: setup_kestra_webhooks
    type: io.kestra.plugin.scripts.shell.Commands
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      #pullPolicy: ALWAYS
      networkMode: host
      volumes:
        - /host_volumes/workflow-scripts:/shoggoth/workflow/scripts:ro
    containerImage: asherikov/shoggoth_tools:alpine
    commands:
      - python3 /shoggoth/workflow/scripts/shoggoth_maintenance.py --verbose kestra-webhooks 2>&1
    env:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otelcol:4318
      GITEA_SERVER_URL: 'http://git.{{ envs.shoggoth_domain }}'
      GITEA_ADMIN_TOKEN: '{{ envs.gitea_admin_token }}'
      SHOGGOTH_DOMAIN: '{{ envs.shoggoth_domain }}'

  - id: setup_redmine_webhooks
    type: io.kestra.plugin.scripts.shell.Commands
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      #pullPolicy: ALWAYS
      networkMode: host
      volumes:
        - /host_volumes/workflow-scripts:/shoggoth/workflow/scripts:ro
    containerImage: asherikov/shoggoth_tools:alpine
    commands:
      - python3 /shoggoth/workflow/scripts/shoggoth_maintenance.py --verbose redmine-webhooks 2>&1
    env:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otelcol:4318
      GITEA_SERVER_URL: 'http://git.{{ envs.shoggoth_domain }}'
      GITEA_ADMIN_TOKEN: '{{ envs.gitea_admin_token }}'
      SHOGGOTH_DOMAIN: '{{ envs.shoggoth_domain }}'

  - id: setup_redmine_kestra_webhook
    type: io.kestra.plugin.scripts.shell.Commands
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      #pullPolicy: ALWAYS
      networkMode: host
      volumes:
        - /host_volumes/workflow-scripts:/shoggoth/workflow/scripts:ro
    containerImage: asherikov/shoggoth_tools:alpine
    commands:
      - python3 /shoggoth/workflow/scripts/shoggoth_maintenance.py --verbose redmine-kestra-webhooks 2>&1
    env:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otelcol:4318
      REDMINE_SERVER: 'http://redmine.{{ envs.shoggoth_domain }}'
      SHOGGOTH_DOMAIN: '{{ envs.shoggoth_domain }}'
      SHOGGOTH_VAULT_TOKEN: '{{ envs.shoggoth_vault_token }}'
      OPENBAO_ADDR: http://openbao:80

  - id: gitea_ldap_sync
    type: io.kestra.plugin.scripts.shell.Commands
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      #pullPolicy: ALWAYS
      networkMode: host
      volumes:
        - /host_volumes/workflow-scripts:/shoggoth/workflow/scripts:ro
    containerImage: asherikov/shoggoth_tools:alpine
    commands:
      - python3 /shoggoth/workflow/scripts/shoggoth_maintenance.py --verbose gitea-ldap-sync 2>&1
    env:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otelcol:4318
      GITEA_SERVER_URL: 'http://git.{{ envs.shoggoth_domain }}'
      GITEA_ADMIN_TOKEN: '{{ envs.gitea_admin_token }}'
      SHOGGOTH_DOMAIN: '{{ envs.shoggoth_domain }}'

  - id: slave_access
    type: io.kestra.plugin.scripts.shell.Commands
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      #pullPolicy: ALWAYS
      networkMode: host
      volumes:
        - /host_volumes/workflow-scripts:/shoggoth/workflow/scripts:ro
    containerImage: asherikov/shoggoth_tools:alpine
    commands:
      - python3 /shoggoth/workflow/scripts/shoggoth_maintenance.py --verbose slave-access 2>&1
    env:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otelcol:4318
      GITEA_SERVER_URL: 'http://git.{{ envs.shoggoth_domain }}'
      GITEA_ADMIN_TOKEN: '{{ envs.gitea_admin_token }}'
      SHOGGOTH_DOMAIN: '{{ envs.shoggoth_domain }}'

  - id: slave_token
    type: io.kestra.plugin.scripts.shell.Commands
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      #pullPolicy: ALWAYS
      networkMode: host
      volumes:
        # Kestra's Docker task runner binds `volumes:` against the
        # Docker DAEMON's filesystem (here: slave-dind), not the Kestra
        # worker's pod. slave-dind mounts workflow-scripts at
        # /host_volumes/workflow-scripts — that is the correct source
        # path. /shoggoth/workflow/scripts does NOT exist on slave-dind
        # and would silently stall the spawn container in Kestra.
        # The SA token path is identical on every pod's filesystem
        # (auto-mounted by the kubelet), so the source path can match.
        - /var/run/secrets/kubernetes.io/serviceaccount:/var/run/secrets/kubernetes.io/serviceaccount:ro
        - /host_volumes/workflow-scripts:/shoggoth/workflow/scripts:ro
    containerImage: asherikov/shoggoth_tools:alpine
    commands:
      - python3 /shoggoth/workflow/scripts/shoggoth_maintenance.py --verbose slave-token 2>&1
    env:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otelcol:4318
      GITEA_SERVER_URL: 'http://git.{{ envs.shoggoth_domain }}'
      GITEA_ADMIN_TOKEN: '{{ envs.gitea_admin_token }}'
      SHOGGOTH_DOMAIN: '{{ envs.shoggoth_domain }}'
      SHOGGOTH_NAMESPACE: '{{ envs.shoggoth_namespace }}'
      SHOGGOTH_GITHUB_ORG: '{{ envs.shoggoth_github_org }}'
      SHOGGOTH_VAULT_TOKEN: '{{ envs.shoggoth_vault_token }}'
      OPENBAO_ADDR: http://openbao:80
      KUBERNETES_SERVICE_HOST: kubernetes.default.svc
      KUBERNETES_SERVICE_PORT: '443'

  - id: runner_token
    type: io.kestra.plugin.scripts.shell.Commands
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      #pullPolicy: ALWAYS
      networkMode: host
      volumes:
        # Kestra's Docker task runner binds `volumes:` against the
        # Docker DAEMON's filesystem (here: slave-dind), not the Kestra
        # worker's pod. slave-dind mounts workflow-scripts at
        # /host_volumes/workflow-scripts — that is the correct source
        # path. /shoggoth/workflow/scripts does NOT exist on slave-dind
        # and would silently stall the spawn container in Kestra.
        # The SA token path is identical on every pod's filesystem
        # (auto-mounted by the kubelet), so the source path can match.
        - /var/run/secrets/kubernetes.io/serviceaccount:/var/run/secrets/kubernetes.io/serviceaccount:ro
        - /host_volumes/workflow-scripts:/shoggoth/workflow/scripts:ro
    containerImage: asherikov/shoggoth_tools:alpine
    commands:
      - python3 /shoggoth/workflow/scripts/shoggoth_maintenance.py --verbose runner-token 2>&1
    env:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otelcol:4318
      GITEA_SERVER_URL: 'http://git.{{ envs.shoggoth_domain }}'
      GITEA_ADMIN_TOKEN: '{{ envs.gitea_admin_token }}'
      SHOGGOTH_DOMAIN: '{{ envs.shoggoth_domain }}'
      SHOGGOTH_NAMESPACE: '{{ envs.shoggoth_namespace }}'
      SHOGGOTH_GITHUB_ORG: '{{ envs.shoggoth_github_org }}'
      KUBERNETES_SERVICE_HOST: kubernetes.default.svc
      KUBERNETES_SERVICE_PORT: 443

  - id: ssh_key
    type: io.kestra.plugin.scripts.shell.Commands
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      #pullPolicy: ALWAYS
      networkMode: host
      volumes:
        - /host_volumes/workflow-scripts:/shoggoth/workflow/scripts:ro
    containerImage: asherikov/shoggoth_tools:alpine
    commands:
      - python3 /shoggoth/workflow/scripts/shoggoth_maintenance.py --verbose ssh-key 2>&1
    env:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otelcol:4318
      GITEA_SERVER_URL: 'http://git.{{ envs.shoggoth_domain }}'
      GITEA_ADMIN_TOKEN: '{{ envs.gitea_admin_token }}'
      SHOGGOTH_DOMAIN: '{{ envs.shoggoth_domain }}'
      SHOGGOTH_VAULT_TOKEN: '{{ envs.shoggoth_vault_token }}'
      OPENBAO_ADDR: http://openbao:80

  - id: redmine_ldap_sync
    type: io.kestra.plugin.scripts.shell.Commands
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      #pullPolicy: ALWAYS
      networkMode: host
      volumes:
        - /host_volumes/workflow-scripts:/shoggoth/workflow/scripts:ro
    containerImage: asherikov/shoggoth_tools:alpine
    commands:
      - python3 /shoggoth/workflow/scripts/shoggoth_maintenance.py --verbose redmine-ldap-sync 2>&1
    env:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otelcol:4318
      SHOGGOTH_DOMAIN: '{{ envs.shoggoth_domain }}'
      SHOGGOTH_VAULT_TOKEN: '{{ envs.shoggoth_vault_token }}'
      OPENBAO_ADDR: http://openbao:80

