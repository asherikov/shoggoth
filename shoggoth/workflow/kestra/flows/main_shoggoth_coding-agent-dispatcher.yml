id: coding-agent-dispatcher
namespace: shoggoth

inputs:
  - id: script
    type: STRING
  - id: payload
    type: STRING
    defaults: ""
  - id: task_id
    type: STRING
    defaults: ""

outputs:
  - id: exitCode
    type: INT
    value: "{{ outputs.run_script.exitCode }}"
  - id: vars
    type: JSON
    value: "{{ outputs.run_script.vars }}"

concurrency:
  limit: 1
  behavior: QUEUE

tasks:
  - id: log_start
    type: io.kestra.plugin.core.log.Log
    message: "Dispatching coding-agent: script={{ inputs.script }} task_id={{ inputs.task_id }}"

  - id: run_script
    type: io.kestra.plugin.scripts.shell.Commands
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      volumes:
        - "/shoggoth/git-cred:/shoggoth/git-cred"
        - "/shoggoth/ci_cache:/cache"
      #pullPolicy: ALWAYS
      networkMode: host
    containerImage: docker-registry.s.local/slave_noble:dind
    commands:
      - "export PATH=\"/shoggoth/workflow/scripts:${PATH}\" && {{ inputs.script }} --verbose {{ inputs.task_id }}"
    env:
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otelcol:4318"
      GITEA_SERVER_URL: "http://git.{{ envs.shoggoth_domain }}"
      SHOGGOTH_DOMAIN: "{{ envs.shoggoth_domain }}"
      SHOGGOTH_SLAVE_USER: "sslave"
      GITEA_SLAVE_TOKEN: "{{ envs.gitea_slave_token }}"
      GITEA_PAYLOAD: "{{ inputs.payload }}"
