id: coding-agent-dispatcher
namespace: shoggoth

inputs:
  - id: script
    type: STRING
  - id: payload
    type: STRING
    defaults: ""
  - id: task_id
    type: STRING
    defaults: ""

outputs:
  - id: exitCode
    type: INT
    value: "{{ outputs.run_script.exitCode }}"
  - id: vars
    type: JSON
    value: "{{ outputs.run_script.vars }}"

concurrency:
  limit: 1
  behavior: QUEUE

tasks:
  - id: log_start
    type: io.kestra.plugin.core.log.Log
    message: "Dispatching coding-agent: script={{ inputs.script }} task_id={{ inputs.task_id }}"

  - id: run_script
    type: io.kestra.plugin.scripts.shell.Commands
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      volumes:
        - "/shoggoth/git-cred:/shoggoth/git-cred"
        - "/cache:/cache"
        - "/host_volumes/workflow-scripts:/shoggoth/workflow/scripts:ro"
      #pullPolicy: ALWAYS
      networkMode: host
    containerImage: registry.s.local/slave:noble
    commands:
      - "export PATH=\"/shoggoth/workflow/scripts:${PATH}\" && {{ inputs.script }} --verbose {{ inputs.task_id }} 2>&1"
    env:
      SHOGGOTH_DOMAIN: "{{ envs.shoggoth_domain }}"
      SHOGGOTH_GITHUB_ORG: "{{ envs.shoggoth_github_org }}"
      # Override the slave image's baked-in `GITEA_SERVER_URL=http://api/gitea`
      # so the request's Host header matches the Angie `server_name api.${SHOGGOTH_DOMAIN}`
      # in shoggoth/k3s/web-internal.yaml. Without this override the dispatcher
      # hits Angie's default server (404) instead of the `location /gitea/`
      # block, even though the path is correct.
      GITEA_SERVER_URL: "http://api.{{ envs.shoggoth_domain }}/gitea"
      GITEA_PAYLOAD: "{{ inputs.payload }}"
      SHOGGOTH_KESTRA_RUN_URL: "http://kestra.{{ envs.shoggoth_domain }}/ui/{{ flow.namespace }}/executions/{{ flow.id }}/{{ execution.id }}"
