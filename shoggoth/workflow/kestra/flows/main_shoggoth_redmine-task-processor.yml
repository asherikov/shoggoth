id: redmine-task-processor
namespace: shoggoth
#disabled: true

#triggers:
#  - id: schedule
#    type: io.kestra.plugin.core.trigger.Schedule
#    cron: "0 * * * *"
#    allowConcurrent: false

tasks:
  - id: list_tasks
    type: io.kestra.plugin.scripts.shell.Commands
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      #pullPolicy: ALWAYS
      networkMode: host
    containerImage: docker-registry.s.local/slave_noble:dind
    commands:
      - /shoggoth/workflow/scripts/redmine_task_list.sh

  - id: print
    type: io.kestra.plugin.core.log.Log
    message: "{{ outputs.list_tasks }}"

  - id: process_tasks
    type: io.kestra.plugin.core.flow.ForEach
    values: "{{ outputs.list_tasks.exitCode == 0 ? outputs.list_tasks.vars.task_ids : [] }}"
    tasks:
      - id: process_task
        type: io.kestra.plugin.core.flow.Subflow
        namespace: shoggoth
        flowId: coding-agent-dispatcher
        wait: true
        transmitFailed: true
        inputs:
          script: "shoggoth_workflow.py"
          task_id: "task {{ taskrun.value }}"
