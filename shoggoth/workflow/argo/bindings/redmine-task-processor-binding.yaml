---
# redmine-task-processor — webhook entry from Redmine's issue.updated /
# issue.created events. Equivalent to kestra's
# main_shoggoth_redmine-task-processor.yml.
#
# Webhook endpoint (set up by shoggoth.py redmine-argo-webhooks):
#   POST http://api.{domain}/argo/api/v1/events/shoggoth/redmine-task-processor
#
# v4 syntax notes (vs v3.7.0):
#   - spec.event.selector is now an expr-lang boolean expression evaluated
#     against {namespace, discriminator, payload, metadata} in
#     server/event/dispatch/operation.go. v3 treated it as a literal
#     discriminator match — bare "redmine-task-processor" now parses as
#     the expression "redmine - task - processor" and fails with
#     "unknown name redmine". Use `discriminator == "<name>"` to match.
#   - parameters[].value (literal) has been replaced by parameters[].valueFrom.event
#     (also an expr-lang expression). Bare strings inside the expression must be
#     quoted (`"shoggoth.py"`), and Go-template `{{...}}` wrapping (v3) is
#     gone — the entire expression is the value of that field.
#   - The v3 `{{.payload.data.issue.id | squote}}` (Go-template + sprig)
#     becomes a plain expr-lang expression. The dispatcher's args split
#     the action into two env-driven argv slots (SHOGGOTH_COMMAND="task",
#     SHOGGOTH_TASK_ID=<id>) so argparse sees `task` and `<id>` as
#     separate positionals instead of one malformed `task '<id>'` string.
#
# Selector filtering (the drop-list):
#   The hook subscribes to issue.created and issue.updated on every
#   project the slave is a member of. Most of those events are no-ops
#   from the dispatcher's point of view — the dispatcher only wants
#   events that signal "the slave is being asked to start work", which
#   is a strict subset: status == "In Progress" AND the slave is the
#   assignee. The selector drops both cases before any pod is created.
#
#   Dropped at the selector:
#     payload.data.issue.status.name != "In Progress"
#         Status transitions away from "In Progress" (back to
#         "Feedback", "Resolved", "Closed", etc.) and updates that
#         don't change status at all (description edits, label
#         changes, comment additions while already in-progress) are
#         all dropped here. The Redmine webhook fires for every
#         `issue.updated` event regardless of whether the change
#         is status-relevant; this filter cuts the bulk of them.
#     payload.data.issue.assigned_to == nil
#         Unassigned issues are dropped before any pod is
#         created. ``assigned_to`` is ``null`` in the JSON
#         body when no one is assigned; the explicit ``!= nil``
#         check is a fast path that saves a Redmine API round-
#         trip in the dispatcher's ``_check_task_actionable``
#         (shoggoth/runner.py:48-78) — the dispatcher
#         re-validates assignee in any case, but the selector
#         drop is free (one expr-lang evaluation in argo-server
#         vs a full workflow pod spin-up).
#
#   NOT dropped at the selector (left to the dispatcher pod):
#     payload.data.issue.assigned_to.name / assigned_to.id
#         The "is the assignee the slave" check is delegated to
#         the dispatcher's ``_check_task_actionable``, which
#         re-validates the assignee via the Redmine API and
#         exits 0 on mismatch. The earlier in-selector check
#         (either by display-name literal or by resolved
#         Redmine ID) was dropped because both require either
#         a magic-string coupling to redmine-init or runtime
#         ID plumbing that the selector environment (restricted
#         to {payload, metadata, discriminator}) cannot access
#         — see the conversation log for the trade-off.
#
#   Notes:
#     - The `status.name` and `assigned_to` access assumes the
#       standard Redmine issue API response shape — see
#       https://www.redmine.org/projects/redmine/wiki/Rest_Issues
#       for the field set. The `Webhookable` concern that
#       builds the native webhook body (Redmine 5+ core,
#       shoggoth uses 7.0.1) renders issues via the same
#       JSON builder, so the shape is identical.
#     - The selector runs inside argo-server BEFORE the
#       workflow is created, so the cost of a dropped event
#       is one expr-lang evaluation — no pod, no K8s API
#       call, no ConfigMap lookup.
apiVersion: argoproj.io/v1alpha1
kind: WorkflowEventBinding
metadata:
  name: redmine-task-processor
  namespace: shoggoth
  labels:
    app.kubernetes.io/part-of: shoggoth-argo
spec:
  event:
    selector: |
      discriminator == "redmine-task-processor" &&
      payload.data.issue.status.name == "In Progress" &&
      payload.data.issue.assigned_to != nil
  submit:
    workflowTemplateRef:
      name: coding-agent-dispatcher
    arguments:
      parameters:
      - name: command
        valueFrom:
          event: '"task"'
      - name: task_id
        valueFrom:
          event: string(payload.data.issue.id)
      - name: payload
        valueFrom:
          event: 'payload'
