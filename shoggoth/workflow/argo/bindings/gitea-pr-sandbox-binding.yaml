---
# gitea-pr-sandbox -- /sandbox slash command webhook entry.
#
# Webhook endpoint (set up by shoggoth.py argo-webhooks):
#   POST http://api.{domain}/argo/api/v1/events/shoggoth/gitea-pr-sandbox
#
# Submits the `command-handler` DAG with `command: sandbox` so
# the dispatcher's `_handle_sandbox` runs: kubectl-apply a unique
# `sandbox-<id>` Pod (git-cred sidecar + ttyd main container + init
# container that clones the PR's repo) + matching Service, wait
# for Ready, post the URL as a PR comment. The worker step is
# skipped (dispatcher emits `should_run_worker=false`); the
# dispatcher is the entire sandbox lifecycle.
#
# Selector filtering (mirrors gitea-pr-update-binding.yaml where
# possible):
#
#   * `pull_request_comment` event with `action == "created"` --
#     edits/deletions don't re-fire the command (a deleted /sandbox
#     comment has nothing to act on; an edited comment is just a
#     re-post of the same intent).
#   * `comment.body == "/sandbox"` exactly -- SLASH_DO_RE for the
#     general /do pattern, but /sandbox is its own self-contained
#     command with no trailing arguments. A `/sandbox foo` body
#     does NOT match and falls through to the regular review-
#     comments path.
#   * Drop slave-authored comments (the slave is a bot that
#     occasionally posts status comments; trusting the slave to
#     spawn sandboxes would let it spawn itself). Same guard as
#     gitea-pr-update-binding.yaml: literal "slave" or
#     `startsWith "slave@"`.
#
# Notes:
#   * The binding does NOT enforce a trusted-user gate here -- the
#     dispatcher SA is namespaced (pods/services CRUD only) and a
#     sandbox pod only consumes the slave user's git-cred secrets;
#     even an untrusted user can only spin up terminals under
#     their own PR. If a future tightening is needed, add a
#     `payload.sender.login` membership check against
#     `params.shoggoth_trusted_users` (split on `,`).
#   * No `ttlSecondsAfterFinished` for the dispatcher pod
#     itself (the dispatch template controls pod-level
#     lifecycle). The SANDBOX pod created by the dispatcher
#     uses a `cleanup` sidecar container (see the `cleanup`
#     subcommand in
#     `shoggoth/workflow/scripts/sandbox.py`) instead
#     of `spec.ttlSecondsAfterFinished` -- the latter was
#     rejected by the cluster's API server with "unknown field
#     spec.ttlSecondsAfterFinished" (the field was added to
#     `PodSpec` in K8s 1.23 and is GA since 1.29). The
#     sidecar polls for `status.phase == Succeeded|Failed`
#     (which happens once `ttyd` exits with `restartPolicy:
#     Never`) and `kubectl delete pod --grace-period=0`.
apiVersion: argoproj.io/v1alpha1
kind: WorkflowEventBinding
metadata:
  name: gitea-pr-sandbox
  namespace: shoggoth
  labels:
    app.kubernetes.io/part-of: shoggoth-argo
spec:
  event:
    # Note on the parenthesised ``!(payload.sender.login
    # startsWith "slave@")``: expr-lang parses unary ``!``
    # at a higher precedence than infix operators, so an
    # unparenthesised ``!x startsWith y`` becomes
    # ``(!x) startsWith y`` — a type error (bool has no
    # startsWith method) that silently drops the event.
    # Mirrors the same trap documented in
    # gitea-pr-update-binding.yaml.
    selector: |
      discriminator == "gitea-pr-sandbox" &&
      payload.action == "created" &&
      payload.comment.body == "/sandbox" &&
      (payload.comment == nil || (payload.sender.login != "slave" && !(payload.sender.login startsWith "slave@")))
  submit:
    workflowTemplateRef:
      name: command-handler
    arguments:
      parameters:
      - name: command
        valueFrom:
          event: '"sandbox"'
      - name: task_id
        valueFrom:
          event: '""'
      - name: payload
        valueFrom:
          event: 'payload'