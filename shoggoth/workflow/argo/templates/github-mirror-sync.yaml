---
# github-mirror-sync — equivalent to kestra's main_shoggoth_github-mirror-sync.yml.
# Invoked manually via `argo submit` from a developer shell.
#
# Replaces the old concurrency:limit:1 / behavior:CANCEL with Argo's
# SynchronizationType. Note the semantic difference: Kestra's
# `behavior: CANCEL` cancelled the running execution when a new one
# arrived; Argo's `synchronization.mutex` queues the new submission
# in Pending until the holder completes. This is intentional — the
# maintainer prefers the holder to finish rather than be aborted.
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: github-mirror-sync
  namespace: shoggoth
  labels:
    app.kubernetes.io/part-of: shoggoth-argo
spec:
  entrypoint: sync
  synchronization:
    mutexes:
      - name: github-mirror-sync-mutex
  arguments:
    parameters:
    # Required by the submit-time validator (workflow/validate/validate.go):
    # templates referencing {{workflow.parameters.SHOGGOTH_*}} must resolve
    # to a declared parameter here. Values are fetched from the
    # shoggoth-workflow-config ConfigMap at admission time.
    - name: SHOGGOTH_DOMAIN
      valueFrom:
        configMapKeyRef:
          name: shoggoth-workflow-config
          key: SHOGGOTH_DOMAIN
    - name: SHOGGOTH_GITHUB_ORG
      valueFrom:
        configMapKeyRef:
          name: shoggoth-workflow-config
          key: SHOGGOTH_GITHUB_ORG
    - name: SHOGGOTH_INSTANCE_DIR
      valueFrom:
        configMapKeyRef:
          name: shoggoth-workflow-config
          key: SHOGGOTH_INSTANCE_DIR
  templates:
  - name: sync
    container:
      image: asherikov/shoggoth_tools:alpine
      imagePullPolicy: IfNotPresent
      command:
      - bash
      - -lc
      args:
      # shoggoth.py reads the org list from the SHOGGOTH_GITHUB_ORG env
      # var (set below from the ConfigMap). Override the org at submit
      # time with `-e SHOGGOTH_GITHUB_ORG="otherOrg"` etc.
      - python3 /shoggoth/workflow/scripts/shoggoth.py github-mirror-sync 2>&1
      env:
      - name: OTEL_EXPORTER_OTLP_ENDPOINT
        value: "http://otelcol:4318"
      - name: GITEA_SERVER_URL
        value: "http://git.{{workflow.parameters.SHOGGOTH_DOMAIN}}"
      - name: GITEA_ADMIN_TOKEN
        valueFrom:
          secretKeyRef:
            name: gitea-slave-token
            key: token
      - name: SHOGGOTH_DOMAIN
        value: "{{workflow.parameters.SHOGGOTH_DOMAIN}}"
      - name: SHOGGOTH_GITHUB_ORG
        value: "{{workflow.parameters.SHOGGOTH_GITHUB_ORG}}"
      volumeMounts:
      - name: workflow-scripts
        mountPath: /shoggoth/workflow/scripts
        readOnly: true
    volumes:
    - name: workflow-scripts
      hostPath:
        path: /var/lib/rancher/k3s/storage/{{workflow.parameters.SHOGGOTH_INSTANCE_DIR}}/workflow-scripts
        type: DirectoryOrCreate
    activeDeadlineSeconds: 1800