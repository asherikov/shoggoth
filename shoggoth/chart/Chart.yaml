apiVersion: v2
name: shoggoth
description: Shoggoth self-hosted agentic development multitool (single-node K3s).
type: application
# Chart version. Bump it on any change to what the chart renders.
version: 0.2.0
appVersion: "0.1.1"
home: https://github.com/asherikov/shoggoth
sources:
  - https://github.com/asherikov/shoggoth
keywords:
  - shoggoth
  - agentic
  - k3s
  - self-hosted
maintainers:
  - name: asherikov
# We deliberately keep CRD directories versioned instead of declaring Helm
# `dependencies:` for argo-workflows / external-secrets charts, to preserve
# offline-first deploys: `helm install` on an air-gapped host must not require
# network egress.
dependencies: []
# Minimum Kubernetes version.
#
#   * container-level `restartPolicy: Always` (native sidecar ordering):
#     openbao.yaml (the unseal sidecar) and slave-term.yaml (git-cred).
#     Added 1.28, GA 1.33.
#   * pod-level `spec.ttlSecondsAfterFinished`: zz-crd-ready-wait.yaml.
#     Added 1.23, GA 1.29.
kubeVersion: ">=1.34.0-0"
icon: https://raw.githubusercontent.com/asherikov/shoggoth/main/docs/shoggoth.svg
