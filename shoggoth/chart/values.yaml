# Shoggoth chart values. Generated by shoggoth/scripts/values_generate.py
# from shoggoth/<instance>.env per docs/helm-migration-plan.md §6.
#
# Override per instance by passing --values values-<instance>.yaml.
#
# Template comments cite the pre-chart manifest tree as
# `legacy shoggoth/k3s/<name>.yaml`. That directory was removed once every file
# in it was superseded here; recover one with
# `git show e43fd56:shoggoth/k3s/<name>.yaml`.

# Chart naming. templates/_helpers.tpl dereferences .Values.shoggoth.* in
# `shoggoth.name` and `shoggoth.fullname`, so this map MUST exist even when
# every override is empty — with it absent, `.Values.shoggoth` is nil and Helm
# fails with "nil pointer evaluating interface {}.nameOverride" the moment any
# template calls the helper (zz-crd-ready-wait.yaml does, on every render).
#
# Left empty, fullname resolves to .Release.Name, which is what the Makefile
# wants: the release is named shoggoth-<INSTANCE>.
shoggoth:
  nameOverride: ""
  fullnameOverride: ""

# Identity (replaces SHOGGOTH_DOMAIN, SHOGGOTH_GITHUB_ORG, SHOGGOTH_DNS_IP).
# identity.instanceDir comes from the per-instance shoggoth/<instance>.yaml,
# which `make up` passes with --values (matches the former
# `SHOGGOTH_INSTANCE_DIR=${INSTANCE}` semantics in make/k3s.mk).
identity:
  domain: ""
  githubOrg: ""
  dnsIp: ""
  instanceDir: ""

# Network ports (replaces SHOGGOTH_WEB_EXT_PORT, SHOGGOTH_WG_PORT,
# SHOGGOTH_WG_UI_PORT, SHOGGOTH_REGISTRY_PORT).
network:
  webExternal:
    hostPort: ""
  wireguard:
    udpPort: ""
    uiPort: ""
  registry:
    hostPort: ""

# AI defaults (replace SHOGGOTH_AI_DEFAULT_*).
ai:
  defaultModel: ""
  defaultApi: ""
  defaultTokenFileRef: ""

# Gitea (replaces SHOGGOTH_GITEA_SERVER_TOKEN_FILE).
gitea:
  serverTokenFileRef: ""

# LDAP base DN. Derived from identity.domain if left empty
# (handled by templates/_helpers.tpl:shoggoth.ldapBaseDn).
ldap:
  baseDn: ""

# Per-service enable flags. mirrors make/k3s.mk K3S_APP_LABELS.
# A "false" flag emits *no* resources for that service.
#
# Seven services carry a second `app:` label inside another service's template
# (argo-server, argo-workflow-controller, basic-memory-ui, cdash-db,
# gitea-runner, openbao-bootstrap, redmine-db). Legacy served each pair from
# one manifest file, so they had no per-label toggle; Phase 4 gave them one so
# `make stop SERVICE=redmine-db` has something to switch off.
#
# Every key here matches the legacy `app:` label verbatim — operators pass
# `make start|stop SERVICE=<label>` and the value key under .services.* is
# spelled the same way. Templates do not access keys via the dot path
# (`services.<key>.enabled`) because Go templates parse `-` as subtraction;
# instead, _helpers.tpl:shoggoth.isServiceEnabled walks the map and reports
# the boolean for the named key, so this list can stay lowercase-hyphenated
# uniformly.
services:
  argo-server:                { enabled: true }
  argo-workflows:             { enabled: true }
  argo-workflow-controller:   { enabled: true }
  argo-webhook-receiver:      { enabled: true }
  apt-cache:                  { enabled: true }
  basic-memory:               { enabled: true }
  basic-memory-ui:            { enabled: true }
  cdash:                      { enabled: true }
  cdash-db:                   { enabled: true }
  dns:                        { enabled: true }
  external-secrets:           { enabled: true }
  git-pages:                  { enabled: true }
  gitea:                      { enabled: true }
  gitea-runner:               { enabled: true }
  grafana:                    { enabled: true }
  headroom:                   { enabled: true }
  headroom-proxy-token:       { enabled: true }
  litellm:                    { enabled: true }
  localai:                    { enabled: true }
  loki:                       { enabled: true }
  maintenance-secret-writer:  { enabled: true }
  mcp-gitea:                  { enabled: true }
  openbao:                    { enabled: true }
  openbao-bootstrap:          { enabled: true }
  openldap:                   { enabled: true }
  otelcol:                    { enabled: true }
  phpldapadmin:               { enabled: true }
  redmine:                    { enabled: true }
  redmine-db:                 { enabled: true }
  registry:                   { enabled: true }
  reloader:                   { enabled: true }
  render-config:              { enabled: true }
  sandbox-spawner:            { enabled: true }
  secret-store:               { enabled: true }
  secret-store-write:         { enabled: true }
  shared-cache:               { enabled: true }
  slave-dind:                 { enabled: true }
  slave-term:                 { enabled: true }
  tempo:                      { enabled: true }
  victoria-metrics:           { enabled: true }
  web-external:               { enabled: true }
  web-internal:               { enabled: true }
  wireguard:                  { enabled: true }

# Optional image-override surface (replaces hard-coded tags inside service
# manifests; defaults currently leave each manifest's existing tag in place).
image: {}
