# Shoggoth chart values — the chart's defaults, hand-maintained.
#
# Per-instance overrides live outside the chart, in `shoggoth/<instance>.yaml`
# (e.g. shoggoth/shoggoth.yaml, shoggoth/shoggoth-test.yaml), and reach Helm via
# the `--values` flag the installer passes on every call:
# SHOGGOTH_CONFIG?=shoggoth/${INSTANCE}.yaml. Values set there layer over this
# file, and a `--set services.<key>.enabled=false` layers over those.
#
# Template comments say only what is specific to the file they open: what it
# renders, who consumes it, what gate it follows. The shared house rules live
# in README "Chart template conventions".

# Chart naming. templates/_helpers.tpl dereferences .Values.shoggoth.* in
# `shoggoth.name` and `shoggoth.fullname`, so this map MUST exist even when
# every override is empty — with it absent, `.Values.shoggoth` is nil and Helm
# fails with "nil pointer evaluating interface {}.nameOverride" the moment any
# template calls the helper (zz-crd-ready-wait.yaml does, on every render).
#
# Left empty, fullname resolves to .Release.Name, which is what the release
# naming wants: the release is named shoggoth-<INSTANCE>.
shoggoth:
  nameOverride: ""
  fullnameOverride: ""

# Identity (replaces SHOGGOTH_DOMAIN, SHOGGOTH_GITHUB_ORG, SHOGGOTH_DNS_IP).
# identity.instanceDir comes from the per-instance shoggoth/<instance>.yaml,
# which the installer passes with --values (matches the former
# `SHOGGOTH_INSTANCE_DIR=${INSTANCE}` semantics).
identity:
  domain: ""
  githubOrg: ""
  dnsIp: ""
  instanceDir: ""

# Network ports (replaces SHOGGOTH_WEB_EXT_PORT, SHOGGOTH_WG_PORT,
# SHOGGOTH_WG_UI_PORT, SHOGGOTH_REGISTRY_PORT).
network:
  webExternal:
    hostPort: ""
  wireguard:
    udpPort: ""
    uiPort: ""
  registry:
    hostPort: ""

# AI defaults (replace SHOGGOTH_AI_DEFAULT_*).
ai:
  defaultModel: ""
  defaultApi: ""
  defaultTokenFileRef: ""

# Gitea (replaces SHOGGOTH_GITEA_SERVER_TOKEN_FILE).
gitea:
  serverTokenFileRef: ""

# LDAP base DN. Derived from identity.domain if left empty
# (handled by templates/_helpers.tpl:shoggoth.ldapBaseDn).
#
# This may only restate the derived value, never replace it: the openldap
# container bootstraps its suffix from identity.domain, so the directory that
# actually gets created is always the derived DN. Setting anything else makes
# every DN in the chart point at a suffix that does not exist, and the failure
# is silent at runtime. A value that disagrees fails `helm template`.
ldap:
  baseDn: ""

# Per-service enable flags. Each key is spelled the same as the `app:` label of
# the workload it gates, so a `--set services.<key>.enabled=false` maps
# one-to-one. A "false" flag emits *no* resources for that service.
#
# Seven services carry a second `app:` label inside another service's template
# (argo-server, argo-workflow-controller, basic-memory-ui, cdash-db,
# gitea-runner, openbao-bootstrap, redmine-db). Each pair had no per-label
# toggle, so Phase 4 gave them one — `redmine-db` now has
# something to switch off on its own.
#
# Every key here matches the `app:` label verbatim — the value key under
# .services.* is spelled the same way. Templates do not access keys via the dot
# path (`services.<key>.enabled`) because Go templates parse `-` as subtraction;
# instead, _helpers.tpl:shoggoth.isServiceEnabled walks the map and reports
# the boolean for the named key, so this list can stay lowercase-hyphenated
# uniformly.
services:
  argo-server:                { enabled: true }
  argo-workflows:             { enabled: true }
  argo-workflow-controller:   { enabled: true }
  argo-webhook-receiver:      { enabled: true }
  apt-cache:                  { enabled: true }
  basic-memory:               { enabled: true }
  basic-memory-ui:            { enabled: true }
  cdash:                      { enabled: true }
  cdash-db:                   { enabled: true }
  crawl4ai:                   { enabled: true }
  dns:                        { enabled: true }
  external-secrets:           { enabled: true }
  fusion:                     { enabled: true }
  gadget:                     { enabled: true }
  git-pages:                  { enabled: true }
  gitea:                      { enabled: true }
  gitea-runner:               { enabled: true }
  grafana:                    { enabled: true }
  headroom:                   { enabled: true }
  headroom-proxy-token:       { enabled: true }
  it-tools:                   { enabled: true }
  litellm:                    { enabled: true }
  localai:                    { enabled: true }
  loki:                       { enabled: true }
  maintenance-secret-writer:  { enabled: true }
  mcp-gitea:                  { enabled: true }
  openbao:                    { enabled: true }
  openbao-bootstrap:          { enabled: true }
  openldap:                   { enabled: true }
  otelcol:                    { enabled: true }
  phpldapadmin:               { enabled: true }
  redmine:                    { enabled: true }
  redmine-db:                 { enabled: true }
  registry:                   { enabled: true }
  reloader:                   { enabled: true }
  render-config:              { enabled: true }
  sandbox-spawner:            { enabled: true }
  secret-store:               { enabled: true }
  secret-store-write:         { enabled: true }
  shared-cache:               { enabled: true }
  slave-dind:                 { enabled: true }
  slave-term:                 { enabled: true }
  tempo:                      { enabled: true }
  victoria-metrics:           { enabled: true }
  web-external:               { enabled: true }
  web-internal:               { enabled: true }
  wireguard:                  { enabled: true }

# Inspektor Gadget — the eBPF service-map collector behind the per-instance
# traffic series. Rendered by templates/gadget.yaml and gated on
# `services.gadget.enabled`, so an instance opts out the chart's way
# (`--set services.gadget.enabled=false`) rather than by deleting a file.
#
# ONE DAEMON PER INSTANCE, in the instance's own namespace. The upstream chart
# cannot do this: it hardcodes `gadget.fullname` to the literal string
# "gadget", so its cluster-scoped ClusterRole/ClusterRoleBinding would collide
# between two releases. This template renames exactly those two objects per
# instance, which is what makes a per-instance daemon possible — the cost is
# in the template's header.
gadget:
  # The daemon image. ghcr.io is in the containerd mirror list
  # (shoggoth/shoggoth.nix), so containerd pulls this through the local zot
  # mirror and only falls back to upstream when the mirror misses; IfNotPresent
  # keeps a daemon restart from re-pulling.
  image: ghcr.io/inspektor-gadget/inspektor-gadget
  tag: v0.58.0
  pullPolicy: IfNotPresent
  # The gadget OCI image the daemon pulls for this instance's collector. NOT
  # covered by that mirror: the daemon pulls it itself, through its own `oci`
  # operator into the `oci` emptyDir, and containerd's registries.yaml
  # configures containerd rather than the daemon's registry client. This image
  # needs a direct path to ghcr.io from the pod network.
  gadgetImage: ghcr.io/inspektor-gadget/gadget/top_tcp:v0.58.0
  # The otel-metrics endpoint. ONE spelling, consumed by the daemon's listen
  # address, the Service below and the otelcol scrape job in
  # templates/otelcol.yaml, so the three cannot drift apart. It is also IG's
  # own default, which is why it is not a per-instance value.
  metricsPort: "2224"
  # top_tcp ships with no metrics annotations, so everything the otel-metrics
  # operator needs is passed here. The comma-separated form is required: the
  # chart renders this into a ConfigMap data key, and params.AsStringSlice()
  # splits on commas.
  #
  #   tcp:metrics.collect=true                    export this data source
  #   tcp:metrics.snapshot=true                   tcp is an array data
  #                                                source, so gauges must
  #                                                be observable snapshots
  #   tcp.sent_raw / tcp.received_raw: gauge      the map-iterator fetch
  #                                                drains the map on every
  #                                                map-fetch-interval, so
  #                                                these are per-interval
  #                                                deltas; a counter would
  #                                                re-accumulate them
  #   ...:metrics.type=key                        everything that is either
  #                                                a service-map label or
  #                                                part of the map key
  #
  # The key set is the eBPF map key (mntns_id, pid, tid, src, dst) plus the
  # kubeipresolver labels. Snapshot mode rejects an array whose rows share a
  # key set — without addr_raw/port two connections from one process to
  # different external IPs would collide and freeze the snapshot at its last
  # good value. comm is also in the eBPF key but is not a datasource field, so
  # it cannot join the set. The README's Service Map section carries the full
  # rationale.
  #
  # Sum sent_raw alone: a link between two pods in the same namespace is
  # recorded once per socket direction, so sent_raw + received_raw would count
  # it twice.
  annotate: "tcp:metrics.collect=true,tcp:metrics.snapshot=true,tcp.sent_raw:metrics.type=gauge,tcp.received_raw:metrics.type=gauge,tcp.mntns_id:metrics.type=key,tcp.pid:metrics.type=key,tcp.tid:metrics.type=key,tcp.src.addr_raw:metrics.type=key,tcp.src.port:metrics.type=key,tcp.dst.addr_raw:metrics.type=key,tcp.dst.port:metrics.type=key,tcp.src.k8s.kind:metrics.type=key,tcp.src.k8s.namespace:metrics.type=key,tcp.src.k8s.name:metrics.type=key,tcp.dst.k8s.kind:metrics.type=key,tcp.dst.k8s.namespace:metrics.type=key,tcp.dst.k8s.name:metrics.type=key"

# Optional image-override surface (replaces hard-coded tags inside service
# manifests; defaults currently leave each manifest's existing tag in place).
image: {}
