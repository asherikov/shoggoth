{{- /*
  templates/otelcol.yaml — OpenTelemetry Collector (DaemonSet).

  Carries the metrics/logs/trace Service, the DaemonSet itself, and the
  cluster-scoped RBAC it needs for kubelet_stats + k8s_cluster receivers and
  the k8s_attributes processor. The collector pipeline ConfigMap lives in
  otelcol-config.yaml so this DaemonSet can checksum it and roll when it
  changes; see the annotation on spec.template.metadata.annotations below.

  Note on cluster-scoped names: ClusterRole/ClusterRoleBinding are named
  `{{ include "shoggoth.fullname" . }}-otelcol`, NOT bare `otelcol`. A
  cluster-scoped object has no namespace to separate two shoggoth instances
  on one cluster, so a bare name would make both instances render the SAME
  ClusterRole. A second install run with `--take-ownership`
  silently re-labels the first instance's ClusterRole to its own release and
  rewrites the ClusterRoleBinding's `subjects` list — `rbac/v1.Subjects` is
  an atomic list with no merge key, so the first instance's ServiceAccount is
  dropped from it and its collector loses every permission in the rules
  block. The binding has to be renamed too: `ClusterRoleBinding.roleRef` is
  immutable server-side, so a binding cannot be repointed in place.
*/}}
{{- if (include "shoggoth.isServiceEnabled" (list . "otelcol")) }}
apiVersion: v1
kind: Service
metadata:
  name: otelcol
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shoggoth.labels" . | nindent 4 }}
    app: otelcol
    app.kubernetes.io/component: otelcol
spec:
  selector:
    app: otelcol
  ports:
  - name: otlp-grpc
    port: 4317
    targetPort: 4317
  - name: otlp-http
    port: 4318
    targetPort: 4318
  - name: metrics
    port: 8888
    targetPort: 8888
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: otelcol
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shoggoth.labels" . | nindent 4 }}
    app: otelcol
    app.kubernetes.io/component: otelcol
spec:
  selector:
    matchLabels:
      app: otelcol
  template:
    metadata:
      annotations:
        # Roll the pod when the mounted collector config changes. Most of the
        # values in otelcol-config.yaml appear nowhere else in this DaemonSet
        # — the receivers, processors and pipelines are defined only there —
        # so editing the file left the pod template byte-identical and Helm
        # started no rollout. Reloader cannot cover this: reloader.yaml passes
        # --resources-to-ignore=configmaps, so ConfigMap edits are invisible
        # to it by design. The checksum must cover the whole file, not just
        # the values that happen to be rendered, or the next value added to
        # the pipeline config reintroduces the same silent no-rollout.
        checksum/config: {{ include (print $.Template.BasePath "/otelcol-config.yaml") . | sha256sum }}
      labels:
        {{- include "shoggoth.selectorLabels" . | nindent 8 }}
        app: otelcol
        app.kubernetes.io/component: otelcol
    spec:
      {{- include "shoggoth.podDnsConfig" . | nindent 6 }}
      serviceAccountName: otelcol
      initContainers: []
      containers:
      - name: otelcol
        image: otel/opentelemetry-collector-contrib:0.161.0
        imagePullPolicy: IfNotPresent
        securityContext:
          runAsUser: 0
        env:
        - name: NODE_IP
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
        ports:
        - containerPort: 4317
          name: otlp-grpc
        - containerPort: 4318
          name: otlp-http
        - containerPort: 8888
          name: metrics
        volumeMounts:
        - name: config
          mountPath: /etc/otelcol-contrib/config.yaml
          subPath: config.yaml
          readOnly: true
        - name: host
          mountPath: /host
          readOnly: true
        - name: hostproc
          mountPath: /host/proc
          readOnly: true
        - name: hostsys
          mountPath: /host/sys
          readOnly: true
        - name: podlogs
          mountPath: /var/log/pods
          readOnly: true
        # Shared bearer token for scraping the headroom proxy's
        # /metrics endpoint. The Secret is created by
        # templates/headroom-proxy-token.yaml; the headroom
        # Deployment reads the same Secret via env:HEADROOM_PROXY_TOKEN.
        # bearer_token_file in the prometheus receiver points at the
        # `token` key projected here so the value never appears in
        # the otelcol-config ConfigMap.
        - name: headroom-proxy-token
          mountPath: /etc/otelcol-contrib/secrets/headroom-proxy-token
          readOnly: true
        resources:
          requests:
            memory: 256Mi
            cpu: 100m
          limits:
            memory: 512Mi
            cpu: 1000m
        readinessProbe:
          httpGet:
            path: /metrics
            port: 8888
          initialDelaySeconds: 5
          periodSeconds: 5
          failureThreshold: 30
        livenessProbe:
          httpGet:
            path: /metrics
            port: 8888
          initialDelaySeconds: 10
          periodSeconds: 10
          failureThreshold: 6
      volumes:
      - name: config
        configMap:
          name: otelcol-config
      - name: host
        hostPath:
          path: /
          type: ''
      - name: hostproc
        hostPath:
          path: /proc
          type: ''
      - name: hostsys
        hostPath:
          path: /sys
          type: ''
      - name: podlogs
        hostPath:
          path: /var/log/pods
          type: ''
      # Projected Secret volume for the headroom proxy's bearer
      # token. Same Secret consumed via env:HEADROOM_PROXY_TOKEN by
      # templates/headroom.yaml. The Secret itself is created
      # by templates/headroom-proxy-token.yaml.
      - name: headroom-proxy-token
        secret:
          secretName: headroom-proxy-token
          items:
            - key: token
              path: token
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: otelcol
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shoggoth.labels" . | nindent 4 }}
    app: otelcol
    app.kubernetes.io/component: otelcol
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "shoggoth.fullname" . }}-otelcol
  labels:
    {{- include "shoggoth.labels" . | nindent 4 }}
    app: otelcol
    app.kubernetes.io/component: otelcol
rules:
- apiGroups:
  - ''
  resources:
  - pods
  - nodes
  - namespaces
  - nodes/stats
  - replicationcontrollers
  - services
  - resourcequotas
  verbs:
  - get
  - watch
  - list
- apiGroups:
  - apps
  resources:
  - replicasets
  - deployments
  - daemonsets
  - statefulsets
  verbs:
  - get
  - watch
  - list
- apiGroups:
  - batch
  resources:
  - jobs
  - cronjobs
  verbs:
  - get
  - watch
  - list
- apiGroups:
  - autoscaling
  resources:
  - horizontalpodautoscalers
  verbs:
  - get
  - watch
  - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "shoggoth.fullname" . }}-otelcol
  labels:
    {{- include "shoggoth.labels" . | nindent 4 }}
    app: otelcol
    app.kubernetes.io/component: otelcol
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "shoggoth.fullname" . }}-otelcol
subjects:
- kind: ServiceAccount
  name: otelcol
  namespace: {{ .Release.Namespace }}
{{- end }}