{{- /*
  templates/external-secrets-webhooks.yaml — ConfigMap carrying the ESO
  ValidatingWebhookConfiguration manifests. Replaces

  The register-vwc init container in templates/external-secrets.yaml reads
  this ConfigMap and applies the VWC into the cluster. Until the ESO
  webhook Pod is Ready (about 20s after deploy start), the VWC's
  `failurePolicy: Ignore` lets SecretStore/ExternalSecret applies succeed;
  subsequent operations get full validation once the Service has endpoints.
*/}}
{{- if (include "shoggoth.isServiceEnabled" (list . "external-secrets")) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: external-secrets-webhooks-vwc
  namespace: {{ .Release.Namespace }}
  labels:
    {{- /* Legacy part-of=external-secrets (not shoggoth); overrides via
         shoggoth.labelsWithMap so the rendered YAML has no duplicate keys. */ -}}
    {{- include "shoggoth.labelsWithMap" (list . (dict "partOf" "external-secrets")) | nindent 4 }}
    external-secrets.io/component: webhook
    app.kubernetes.io/component: external-secrets-webhooks
data:
  vwc.yaml: |
    apiVersion: admissionregistration.k8s.io/v1
    kind: ValidatingWebhookConfiguration
    metadata:
      name: secretstore-validate
      labels:
        external-secrets.io/component: webhook
    webhooks:
      - name: validate.secretstore.external-secrets.io
        rules:
          - apiGroups: ["external-secrets.io"]
            apiVersions: ["v1"]
            operations: ["CREATE", "UPDATE", "DELETE"]
            resources: ["secretstores"]
            scope: Namespaced
        clientConfig:
          service:
            namespace: {{ .Release.Namespace }}
            name: external-secrets-webhook
            path: /validate-external-secrets-io-v1-secretstore
        admissionReviewVersions: ["v1", "v1beta1"]
        sideEffects: None
        timeoutSeconds: 5
        # failurePolicy: Ignore — the webhook Pod takes ~20s for the readiness
        # probe to pass after the register-vvc init container applies this VWC.
        # During that window the Service has no endpoints, so any
        # SecretStore/ExternalSecret apply (from Pass 2 of `make up` or any
        # restart) would otherwise fail with "no endpoints available". Ignore
        # lets those applies succeed; once the webhook is Ready, validation
        # resumes normally for subsequent operations. Acceptable because ESO's
        # validating webhook only checks the resource spec — actual secret
        # reconciliation happens at the controller level.
        failurePolicy: Ignore
      - name: validate.clustersecretstore.external-secrets.io
        rules:
          - apiGroups: ["external-secrets.io"]
            apiVersions: ["v1"]
            operations: ["CREATE", "UPDATE", "DELETE"]
            resources: ["clustersecretstores"]
            scope: Cluster
        clientConfig:
          service:
            namespace: {{ .Release.Namespace }}
            name: external-secrets-webhook
            path: /validate-external-secrets-io-v1-clustersecretstore
        admissionReviewVersions: ["v1", "v1beta1"]
        sideEffects: None
        timeoutSeconds: 5
        failurePolicy: Ignore
    ---
    apiVersion: admissionregistration.k8s.io/v1
    kind: ValidatingWebhookConfiguration
    metadata:
      name: externalsecret-validate
      labels:
        external-secrets.io/component: webhook
    webhooks:
      - name: validate.externalsecret.external-secrets.io
        rules:
          - apiGroups: ["external-secrets.io"]
            apiVersions: ["v1"]
            operations: ["CREATE", "UPDATE", "DELETE"]
            resources: ["externalsecrets"]
            scope: Namespaced
        clientConfig:
          service:
            namespace: {{ .Release.Namespace }}
            name: external-secrets-webhook
            path: /validate-external-secrets-io-v1-externalsecret
        admissionReviewVersions: ["v1", "v1beta1"]
        sideEffects: None
        timeoutSeconds: 5
        failurePolicy: Ignore
{{- end }}
