{{- /*
  templates/localai.yaml — LocalAI inference server (CPU/GPU/vulkan).
*/}}
{{- if (include "shoggoth.isServiceEnabled" (list . "localai")) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: localai-models
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shoggoth.labels" . | nindent 4 }}
    app: localai
    app.kubernetes.io/component: localai
  annotations:
    # Kept across `helm uninstall` so `make down` stops workloads but
    # preserves data, matching the legacy envsubst path. Reinstall adopts
    # it: shoggoth.labels survives uninstall, so Helm's ownership check
    # still passes.
    helm.sh/resource-policy: keep
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
  storageClassName: local-path
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: localai-backends
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shoggoth.labels" . | nindent 4 }}
    app: localai
    app.kubernetes.io/component: localai
  annotations:
    # Kept across `helm uninstall` so `make down` stops workloads but
    # preserves data, matching the legacy envsubst path. Reinstall adopts
    # it: shoggoth.labels survives uninstall, so Helm's ownership check
    # still passes.
    helm.sh/resource-policy: keep
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: local-path
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: localai-data
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shoggoth.labels" . | nindent 4 }}
    app: localai
    app.kubernetes.io/component: localai
  annotations:
    # Kept across `helm uninstall` so `make down` stops workloads but
    # preserves data, matching the legacy envsubst path. Reinstall adopts
    # it: shoggoth.labels survives uninstall, so Helm's ownership check
    # still passes.
    helm.sh/resource-policy: keep
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: local-path
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: localai-preload
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shoggoth.labels" . | nindent 4 }}
    app: localai
    app.kubernetes.io/component: localai
data:
  # Use the `url:` form (no gallery `id`) so preload works with
  # AUTOLOAD_GALLERIES=false. The URL is `file://` (not http://) because
  # LocalAI's `validateGalleryConfigURL` (core/gallery/gallery.go) refuses
  # any `http(s)://` URL whose hostname ends in `.local` — which blocks
  # all in-cluster service DNS. The file is mounted from the
  # localai-model-configs ConfigMap into `/models/` (the trusted root for
  # `file://` URLs, controlled by `MODELS_PATH`); files mounted outside
  # `/models/` trigger `InTrustedRoot` (pkg/utils/path.go) and fail.
  # The `files:` entry downloads the GGUF from HuggingFace into the
  # localai-models PVC; the file persists across restarts.
  preload-models.yaml: |
    - name: "nomic-embed-text-v1.5"
      description: |
          Nomic Embed v1.5 embedding model in GGUF format.
      license: "Apache 2.0"
      url: "file:///models/nomic-embed-text-v1.5.yaml"
      files:
          - filename: "nomic-embed-text-v1.5.f16.gguf"
            uri: "https://huggingface.co/nomic-ai/nomic-embed-text-v1.5-GGUF/resolve/main/nomic-embed-text-v1.5.f16.gguf"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: localai-model-configs
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shoggoth.labels" . | nindent 4 }}
    app: localai
    app.kubernetes.io/component: localai
data:
  # The model descriptor preload-models.yaml points at via
  # `url: file:///models/nomic-embed-text-v1.5.yaml`. It lives here rather
  # than in web-internal-html because this ConfigMap is mounted as a
  # required volume below: a ConfigMap owned by another service is deleted
  # by `make stop SERVICE=<that-service>`, which would leave this pod in
  # ContainerCreating and take LocalAI (and the litellm routes that proxy
  # to it) down as a side effect of stopping an unrelated service.
  nomic-embed-text-v1.5.yaml: |
    name: "nomic-embed-text-v1.5"
    description: |
        Nomic Embed v1.5 embedding model in GGUF format.
    license: "Apache 2.0"
    backend: llama-cpp
    embeddings: true
    context_size: 2048
    parameters:
        model: nomic-embed-text-v1.5.f16.gguf
    gpu_layers: 99999999
    options:
        - gpu
---
apiVersion: v1
kind: Service
metadata:
  name: localai
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shoggoth.labels" . | nindent 4 }}
    app: localai
    app.kubernetes.io/component: localai
spec:
  selector:
    app: localai
  ports:
  - name: http
    port: 80
    targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: localai
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shoggoth.labels" . | nindent 4 }}
    app: localai
    app.kubernetes.io/component: localai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: localai
  template:
    metadata:
      labels:
        {{- include "shoggoth.selectorLabels" . | nindent 8 }}
        app: localai
        app.kubernetes.io/component: localai
    spec:
      dnsPolicy: None
      dnsConfig:
        nameservers:
        - {{ .Values.identity.dnsIp }}
        searches:
        - {{ .Release.Namespace }}.svc.cluster.local
        - svc.cluster.local
        - cluster.local
      initContainers: []
      containers:
      - name: localai
        image: localai/localai:sha-36d800e-gpu-vulkan
        imagePullPolicy: IfNotPresent
        env:
        - name: ADDRESS
          value: 0.0.0.0:80
        - name: MODELS_PATH
          value: /models
        - name: THREADS
          value: '4'
        - name: MAX_ACTIVE_BACKENDS
          value: '2'
        - name: SINGLE_ACTIVE_BACKEND
          value: 'false'
        - name: PRELOAD_MODELS_CONFIG
          value: /etc/localai/preload-models.yaml
        - name: AUTOLOAD_GALLERIES
          value: 'false'
        - name: AUTOLOAD_BACKEND_GALLERIES
          value: 'false'
        - name: AUTO_UPGRADE_BACKENDS
          value: 'false'
        - name: OTEL_TRACES_EXPORTER
          value: otlp
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://otelcol:4318
        - name: SHOGGOTH_DOMAIN
          value: {{ .Values.identity.domain }}
        volumeMounts:
        - name: models
          mountPath: /models
        - name: backends
          mountPath: /backends
        - name: data
          mountPath: /data
        - name: preload-config
          mountPath: /etc/localai/preload-models.yaml
          subPath: preload-models.yaml
          readOnly: true
        - name: model-configs
          mountPath: /models/nomic-embed-text-v1.5.yaml
          subPath: nomic-embed-text-v1.5.yaml
          readOnly: true
        - name: dri
          mountPath: /dev/dri
        - name: kfd
          mountPath: /dev/kfd
        securityContext:
          privileged: true
        ports:
        - containerPort: 80
          name: http
        lifecycle:
          postStart:
            exec:
              command:
              - chown
              - -R
              - ubuntu:users
              - /backends
        resources:
          requests:
            memory: 1Gi
            cpu: 500m
          limits:
            memory: 16Gi
            cpu: 8000m
        readinessProbe:
          httpGet:
            path: /v1/models
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
          failureThreshold: 60
        livenessProbe:
          exec:
            command: ["true"]
          periodSeconds: 30
          failureThreshold: 2147483647
        startupProbe:
          exec:
            command: ["true"]
          periodSeconds: 30
          failureThreshold: 2147483647
      volumes:
      - name: models
        persistentVolumeClaim:
          claimName: localai-models
      - name: backends
        persistentVolumeClaim:
          claimName: localai-backends
      - name: data
        persistentVolumeClaim:
          claimName: localai-data
      - name: preload-config
        configMap:
          name: localai-preload
      - name: model-configs
        configMap:
          name: localai-model-configs
          items:
            - key: nomic-embed-text-v1.5.yaml
              path: nomic-embed-text-v1.5.yaml
      - name: dri
        hostPath:
          path: /dev/dri
          type: Directory
      - name: kfd
        hostPath:
          path: /dev/kfd
          type: CharDevice
{{- end }}
