{{- /*
  templates/openldap-ldapauth-password.yaml — ExternalSecret projecting
  the OpenLDAP LDAP-auth bind password into a K8s Secret.

  Restores shoggoth/k3s/external-secrets/openldap-ldapauth-password.yaml,
  which the chart migration dropped. openbao-bootstrap Phase B seeds
  ``openldap/ldapauth-password`` on a fresh install. The resulting
  Secret is consumed by:
    - phpldapadmin.yaml, which authenticates against the directory
      using this credential to manage entries via the web UI;
    - openldap.yaml's own pre-flight bind hook, which probes the
      directory with this credential before declaring the pod Ready;
    - any workflow script that authenticates to LDAP at startup.

  Gated on ``openldap``: openldap is the only true producer; phpldapadmin
  is a downstream consumer whose ``make stop SERVICE=phpldapadmin``
  is independent.
*/}}
{{- if (include "shoggoth.isServiceEnabled" (list . "openldap")) }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openldap-ldapauth-password
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shoggoth.labels" . | nindent 4 }}
    app.kubernetes.io/component: openldap-ldapauth-password
spec:
  secretStoreRef:
    name: shoggoth-openbao
    kind: SecretStore
  target:
    name: openldap-ldapauth-password
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: openldap/ldapauth-password
        property: value
  refreshInterval: 5m
{{- end }}
