{{- /*
  templates/01-rbac.yaml — bootstrap ServiceAccount + Role + RoleBinding
  used by maintenance-secret-writer (and bringup jobs). Replaces
*/}}
{{- if (include "shoggoth.isServiceEnabled" (list . "maintenance-secret-writer")) }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bringup
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shoggoth.labels" . | nindent 4 }}
    app.kubernetes.io/component: bringup
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: bringup-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shoggoth.labels" . | nindent 4 }}
    app.kubernetes.io/component: bringup-secrets
rules:
- apiGroups:
  - ''
  resources:
  - secrets
  verbs:
  - create
  - update
  - patch
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bringup-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shoggoth.labels" . | nindent 4 }}
    app.kubernetes.io/component: bringup-secrets
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: bringup-secrets
subjects:
- kind: ServiceAccount
  name: bringup
  namespace: {{ .Release.Namespace }}
{{- end }}
