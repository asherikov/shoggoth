{{- /*
  templates/ca-passphrase.yaml — ExternalSecret projecting the OpenLDAP
  private-CA passphrase into a K8s Secret.

  Restores shoggoth/k3s/external-secrets/ca-passphrase.yaml, which the
  chart migration dropped. openbao-bootstrap Phase B seeds
  ``ca/passphrase`` with a random value on a fresh install, so this
  only has to project it. The initContainer in openldap.yaml waits on
  ``externalsecret/ca-passphrase`` and the resulting Secret is mounted
  into the openldap pod to unlock the private CA key during TLS
  certificate generation.

  Gated on ``openldap``: the only consumer is openldap.
*/}}
{{- if (include "shoggoth.isServiceEnabled" (list . "openldap")) }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ca-passphrase
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shoggoth.labels" . | nindent 4 }}
    app.kubernetes.io/component: ca-passphrase
spec:
  secretStoreRef:
    name: shoggoth-openbao
    kind: SecretStore
  target:
    name: ca-passphrase
    creationPolicy: Owner
  data:
    - secretKey: passphrase
      remoteRef:
        key: ca/passphrase
        property: value
  refreshInterval: 5m
{{- end }}
