{{- /*
  templates/fusion.yaml — Fusion RSS feed reader (0x2E/fusion): a single Go
  binary with an embedded web UI and a local file database.
  ServiceAccount + Service + PersistentVolumeClaim + Deployment.

  Reached at fusion.<domain> through the namespace CoreDNS suffix rewrite
  (*.{domain} -> {namespace}.svc.cluster.local, see templates/dns.yaml): the
  Service below is the whole ingress, no web-internal proxy entry needed.
  FUSION_PORT is pinned to 80 so the Service needs no port remapping, the
  same way basic-memory.yaml passes --port 80.

  Authentication is deliberately DISABLED: FUSION_ALLOW_EMPTY_PASSWORD=true
  with no FUSION_PASSWORD and no OIDC opens the web UI, the REST API and the
  Fever endpoint to anyone who can reach the pod. That is the exposure class
  it-tools already carries — every shoggoth service answers only inside the
  VPN (web-external fronts wireguard alone) — and shoggoth is a single-user,
  personal-use system. Fusion's own docs label the mode "not recommended",
  hence this note.

  Enabling auth later is an env-only change with no data migration: set
  FUSION_PASSWORD (projected from OpenBao the way every other credential in
  the chart is) and drop FUSION_ALLOW_EMPTY_PASSWORD. The feed database
  lives on the PVC and is independent of credentials.
*/}}
{{- if (include "shoggoth.isServiceEnabled" (list . "fusion")) }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fusion
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shoggoth.labels" . | nindent 4 }}
    app: fusion
    app.kubernetes.io/component: fusion
---
apiVersion: v1
kind: Service
metadata:
  name: fusion
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shoggoth.labels" . | nindent 4 }}
    app: fusion
    app.kubernetes.io/component: fusion
spec:
  selector:
    app: fusion
  ports:
  - name: http
    port: 80
    targetPort: 80
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: fusion-data
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shoggoth.labels" . | nindent 4 }}
    app: fusion
    app.kubernetes.io/component: fusion
  annotations:
    # Kept across `helm uninstall` so `make down` stops the workload but
    # preserves the feed database. Reinstall adopts it: shoggoth.labels
    # survives uninstall, so Helm's ownership check still passes.
    helm.sh/resource-policy: keep
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: local-path
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fusion
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shoggoth.labels" . | nindent 4 }}
    app: fusion
    app.kubernetes.io/component: fusion
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fusion
  template:
    metadata:
      labels:
        {{- include "shoggoth.selectorLabels" . | nindent 8 }}
        app: fusion
        app.kubernetes.io/component: fusion
    spec:
      serviceAccountName: fusion
      # Fusion fetches feeds and serves its own UI; it talks to no
      # Kubernetes API.
      automountServiceAccountToken: false
      containers:
      - name: fusion
        image: ghcr.io/0x2e/fusion:1.3.0
        imagePullPolicy: IfNotPresent
        env:
        # Pinned to 80 so the Service needs no port remapping — the same
        # trick basic-memory.yaml uses with --port 80.
        - name: FUSION_PORT
          value: "80"
        # The feed database lives on the PVC. The upstream default is a
        # relative path, which would resolve inside the container's
        # WORKDIR and be lost on every restart.
        - name: FUSION_DB_PATH
          value: /data/fusion.db
        # Auth off — see the header for the reasoning and the revert path.
        - name: FUSION_ALLOW_EMPTY_PASSWORD
          value: "true"
        ports:
        - containerPort: 80
          name: http
        volumeMounts:
        - name: fusion-data
          mountPath: /data
        resources:
          requests:
            memory: 64Mi
            cpu: 100m
          limits:
            memory: 256Mi
            cpu: 500m
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
          failureThreshold: 30
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 15
          periodSeconds: 30
          failureThreshold: 3
      volumes:
      - name: fusion-data
        persistentVolumeClaim:
          claimName: fusion-data
{{- end }}
