{{- /*
  templates/authelia-secrets.yaml — ExternalSecret projecting every Authelia
  secret into one K8s Secret.

  Consumers: the Deployment in authelia.yaml mounts it at /config/secrets
  (the four `_FILE` env vars and the template-filter reads in
  authelia-config.yaml); the grafana Deployment mounts the same
  Secret's client-grafana-secret as its OAuth client secret; the gitea
  Deployment passes client-gitea-secret to the `add-oauth` call in its
  postStart init script; the redmine Deployment passes
  client-redmine-secret to the redmine_sso_suite plugin as an environment
  variable; and the cdash Deployment passes client-cdash-secret to the
  bundled PingIdentity Socialite driver as PINGIDENTITY_CLIENT_SECRET. The
  openbao client secret is read by the openbao-bootstrap Job, which writes it
  into the auth/oidc mount config.

  Gated on ``authelia``: the only consumers. Disabling the flag deletes the
  Secret, which is what makes the grafana/gitea/cdash gating on the same
  flag load-bearing rather than cosmetic — a client Deployment that kept its
  secretKeyRef would sit in CreateContainerConfigError.

  ONE ExternalSecret, NOT NINE
  The values are seeded together, rotate together, and are consumed by
  one pod plus five clients. Splitting them would give nine near-identical
  files, nine ESO reconciliations per refresh, and five consumers that
  wait on Secrets whose names encode one key of the group.

  The client half of this Secret is why the reloader annotations in
  grafana.yaml, gitea.yaml and cdash.yaml list authelia-secrets: when ESO
  re-projects a rotated client secret, those pods' env and init script have
  to be re-read, and only reloader can restart a pod for a Secret change.

  THE PURGE HOOK NEEDS NO EDIT
  ESO labels every Secret it projects, whatever the creationPolicy, so
  the label selector in zz-secret-purge.yaml covers this one as it
  stands.
*/}}
{{- if (include "shoggoth.isServiceEnabled" (list . "authelia")) }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authelia-secrets-pull
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shoggoth.labels" . | nindent 4 }}
    app.kubernetes.io/component: authelia-secrets
    shoggoth.io/group: auth
    shoggoth.io/exposure: internal
spec:
  secretStoreRef:
    name: shoggoth-openbao
    kind: SecretStore
  target:
    name: authelia-secrets
    creationPolicy: Owner
  data:
    # AUTHELIA_SESSION_SECRET_FILE — signs the session cookie. Without it
    # the portal cannot issue a session at all.
    - secretKey: session-secret
      remoteRef:
        key: authelia/session-secret
        property: value
    # AUTHELIA_STORAGE_ENCRYPTION_KEY_FILE — the local SQLite provider's
    # row encryption key. Required; Authelia refuses to start without it.
    # Rotating it makes every stored row unreadable, so it is seeded once
    # and never regenerated (see the openbao.yaml seed loop).
    - secretKey: storage-encryption-key
      remoteRef:
        key: authelia/storage-encryption-key
        property: value
    # AUTHELIA_IDENTITY_PROVIDERS_OIDC_HMAC_SECRET_FILE — the provider's
    # HMAC secret for the nonce claim. Required by the OIDC provider.
    - secretKey: oidc-hmac-secret
      remoteRef:
        key: authelia/oidc-hmac-secret
        property: value
    # The RSA private key that signs ID tokens, read by the template filter
    # in authelia-config.yaml (jwks is a list, so no `_FILE` form exists).
    # A PEM, so it is a multi-line value: ESO stores it verbatim and the
    # subPath mount hands the file to `fileContent` as-is.
    - secretKey: oidc-jwks-key
      remoteRef:
        key: authelia/oidc-jwks-key
        property: value
    # The Grafana client secret. Two readers, deliberately one key: the
    # template filter in authelia-config.yaml and the grafana Deployment's
    # GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET env. A second copy would be a
    # second value to keep in sync for no benefit.
    - secretKey: grafana-client-secret
      remoteRef:
        key: authelia/client-grafana-secret
        property: value
    # The Gitea client secret. Two readers: the template filter in
    # authelia-config.yaml and the gitea-init.sh `add-oauth`/`update-oauth`
    # call, which passes it to gitea's OAuth2 auth source (stored in
    # gitea's own DB, not read back from this Secret).
    - secretKey: gitea-client-secret
      remoteRef:
        key: authelia/client-gitea-secret
        property: value
    # The Redmine client secret. Two readers: the template filter in
    # authelia-config.yaml and the redmine Deployment's SSO_CLIENT_SECRET
    # env, which the redmine_sso_suite plugin's env-var auto-configuration
    # writes into Redmine's settings table on boot (DemoEnvConfig, init.rb's
    # after_initialize). Unlike gitea there is no CLI call to re-apply it:
    # the plugin re-reads the env on every boot, so a rotated secret only
    # needs a pod restart — which is what the reloader annotation on the
    # redmine Deployment is for.
    - secretKey: redmine-client-secret
      remoteRef:
        key: authelia/client-redmine-secret
        property: value
    # The CDash client secret. Two readers: the template filter in
    # authelia-config.yaml and the cdash Deployment's
    # PINGIDENTITY_CLIENT_SECRET env, which the bundled PingIdentity
    # Socialite driver reads straight from config (config/services.php) on
    # every request — no settings table, no CLI call — so a rotated secret
    # only needs a pod restart, which is what the reloader annotation on the
    # cdash Deployment is for.
    - secretKey: cdash-client-secret
      remoteRef:
        key: authelia/client-cdash-secret
        property: value
    # The OpenBao client secret. Two readers, and neither is a pod env: the
    # template filter in authelia-config.yaml writes it into the provider's
    # client table, and the openbao-bootstrap Job reads it back out of OpenBao
    # to configure the auth/oidc mount. There is no reloader annotation to add
    # because rotating it means re-running the Job, which rewrites the mount
    # config — the same idempotent POST that created it.
    - secretKey: openbao-client-secret
      remoteRef:
        key: authelia/client-openbao-secret
        property: value
  refreshInterval: 5m
{{- end }}
