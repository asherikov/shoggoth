{{- /*
  templates/phpldapadmin.yaml — phpLDAPadmin web UI for the OpenLDAP directory.
  ConfigMap entrypoint derives
  LDAP_BASE_DN from SHOGGOTH_DOMAIN at container start.
*/}}
{{- if (include "shoggoth.isServiceEnabled" (list . "phpldapadmin")) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: phpldapadmin-entrypoint
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shoggoth.labels" . | nindent 4 }}
    app: phpldapadmin
    app.kubernetes.io/component: phpldapadmin
data:
  entrypoint.sh: |
    #!/usr/bin/env bash
    set -euo pipefail

    : "${LDAP_BASE_DN:=dc=$(printf '%s' "{{ .Values.identity.domain }}" | sed 's/\./,dc=/g')}"

    export LDAP_BASE_DN

    exec /sbin/init-docker --config /etc/caddy/Caddyfile --adapter caddyfile
---
apiVersion: v1
kind: Service
metadata:
  name: phpldapadmin
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shoggoth.labels" . | nindent 4 }}
    app: phpldapadmin
    app.kubernetes.io/component: phpldapadmin
spec:
  selector:
    app: phpldapadmin
  ports:
  - name: http
    port: 80
    targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: phpldapadmin
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shoggoth.labels" . | nindent 4 }}
    app: phpldapadmin
    app.kubernetes.io/component: phpldapadmin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: phpldapadmin
  template:
    metadata:
      labels:
        {{- include "shoggoth.selectorLabels" . | nindent 8 }}
        app: phpldapadmin
        app.kubernetes.io/component: phpldapadmin
      annotations:
        secret.reloader.stakater.com/reload: openldap-ldapauth-password
    spec:
      {{- include "shoggoth.podDnsConfig" . | nindent 6 }}
      containers:
      - name: phpldapadmin
        image: phpldapadmin/phpldapadmin:2.3.11
        imagePullPolicy: IfNotPresent
        command:
        - /bin/bash
        - /shoggoth/entrypoint.sh
        ports:
        - containerPort: 80
          name: http
        env:
        - name: SERVER_NAME
          value: :80
        - name: LDAP_HOST
          value: openldap
        - name: LDAP_PORT
          value: '389'
        - name: LDAP_USERNAME
          value: uid=ldapauth,ou=people,{{ include "shoggoth.ldapBaseDn" . }}
        - name: LDAP_PASSWORD
          valueFrom:
            secretKeyRef:
              name: openldap-ldapauth-password
              key: password
        - name: OTEL_TRACES_EXPORTER
          value: otlp
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://otelcol:4318
        - name: SHOGGOTH_DOMAIN
          value: {{ .Values.identity.domain }}
        - name: LDAP_BASE_DN
          value: {{ include "shoggoth.ldapBaseDn" . }}
        volumeMounts:
        - name: entrypoint
          mountPath: /shoggoth/entrypoint.sh
          subPath: entrypoint.sh
          readOnly: true
        resources:
          requests:
            memory: 64Mi
            cpu: 50m
          limits:
            memory: 128Mi
            cpu: 500m
        readinessProbe:
          httpGet:
            path: /up
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
          failureThreshold: 30
        livenessProbe:
          httpGet:
            path: /up
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 30
          failureThreshold: 3
          timeoutSeconds: 5
      volumes:
      - name: entrypoint
        configMap:
          name: phpldapadmin-entrypoint
      serviceAccountName: phpldapadmin
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: phpldapadmin
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shoggoth.labels" . | nindent 4 }}
    app: phpldapadmin
    app.kubernetes.io/component: phpldapadmin
{{- end }}
