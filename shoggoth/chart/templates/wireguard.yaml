{{- /*
  templates/wireguard.yaml — WireGuard VPN server with web management UI
  (wg-easy).
*/}}
{{- if (include "shoggoth.isServiceEnabled" (list . "wireguard")) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: wireguard-entrypoint
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shoggoth.labels" . | nindent 4 }}
data:
  entrypoint.sh: |
    #!/usr/bin/env bash

    set -euo pipefail

    ln -sf /usr/sbin/iptables-nft /etc/alternatives/iptables
    ln -sf /usr/sbin/iptables-nft-restore /etc/alternatives/iptables-restore
    ln -sf /usr/sbin/iptables-nft-save /etc/alternatives/iptables-save
    ln -sf /usr/sbin/ip6tables-nft /etc/alternatives/ip6tables
    ln -sf /usr/sbin/ip6tables-nft-restore /etc/alternatives/ip6tables-restore
    ln -sf /usr/sbin/ip6tables-nft-save /etc/alternatives/ip6tables-save

    sysctl -w net.ipv4.ip_forward=1
    sysctl -w net.ipv4.conf.all.src_valid_mark=1

    exec "$@"
---
apiVersion: v1
kind: Service
metadata:
  name: wireguard
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shoggoth.labels" . | nindent 4 }}
    app: wireguard
    app.kubernetes.io/component: wireguard
spec:
  selector:
    app: wireguard
  ports:
  - name: http
    port: {{ .Values.network.wireguard.uiPort }}
    targetPort: {{ .Values.network.wireguard.uiPort }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wireguard
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shoggoth.labels" . | nindent 4 }}
    app: wireguard
    app.kubernetes.io/component: wireguard
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: wireguard
  template:
    metadata:
      labels:
        {{- include "shoggoth.selectorLabels" . | nindent 8 }}
        app: wireguard
        app.kubernetes.io/component: wireguard
      annotations:
        secret.reloader.stakater.com/reload: wireguard-admin-password
    spec:
      hostNetwork: true
      dnsPolicy: None
      dnsConfig:
        nameservers:
        - {{ .Values.identity.dnsIp }}
        searches:
        - {{ .Release.Namespace }}.svc.cluster.local
        - svc.cluster.local
        - cluster.local
      initContainers:
      - name: wait-bootstrap
        image: asherikov/shoggoth_tools:alpine
        imagePullPolicy: IfNotPresent
        command:
        - bash
        - -c
        args:
        - |
          set -euo pipefail
          NS="{{ .Release.Namespace }}"
          wait_for_externalsecret() {
            local name="$1"
            echo "wait-bootstrap: waiting for externalsecret/${name} Ready in namespace ${NS}..."
            for i in $(seq 1 60); do
              if kubectl get externalsecret "${name}" -n "${NS}" -o json 2>/dev/null | jq -e '.status.conditions // [] | map(select(.type=="Ready" and .status=="True")) | length > 0' >/dev/null 2>&1; then
                echo "wait-bootstrap: externalsecret/${name} Ready (after $((i*10))s)"
                return 0
              fi
              sleep 10
            done
            echo "FAIL: externalsecret/${name} not Ready after 10m"
            echo "      Hint: check status from outside the pod:"
            echo "            kubectl get externalsecret -n ${NS} ${name} -o yaml"
            echo "            kubectl describe externalsecret -n ${NS} ${name}"
            echo "      Most common causes: OpenBao unavailable, SecretStore reference broken,"
            echo "      or remote secret missing (Orphan policies require a value in the source store)."
            return 1
          }
          wait_for_externalsecret wireguard-admin-password || exit 1
          echo "wait-bootstrap: all K8s Secrets Ready"
        resources:
          requests:
            memory: 32Mi
            cpu: 50m
          limits:
            memory: 64Mi
            cpu: 200m
        volumeMounts: []
      containers:
      - name: wireguard
        image: ghcr.io/wg-easy/wg-easy:15.4.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: {{ .Values.network.wireguard.udpPort }}
          hostPort: {{ .Values.network.wireguard.udpPort }}
          protocol: UDP
          name: wireguard
        - containerPort: {{ .Values.network.wireguard.uiPort }}
          name: http
        env:
        - name: INIT_ENABLED
          value: 'true'
        - name: INIT_USERNAME
          value: admin
        - name: INIT_HOST
          value: {{ .Values.identity.domain }}
        - name: INIT_PORT
          value: '{{ .Values.network.wireguard.udpPort }}'
        - name: INIT_PASSWORD
          value: shoggoth1234
        - name: INIT_ALLOWED_IPS
          value: 10.43.0.0/16
        - name: WG_PERSISTENT_KEEPALIVE
          value: '25'
        - name: INIT_DNS
          value: {{ .Values.identity.dnsIp }}
        - name: INSECURE
          value: 'true'
        - name: DISABLE_IPV6
          value: 'true'
        - name: PORT
          value: '{{ .Values.network.wireguard.uiPort }}'
        - name: OTEL_TRACES_EXPORTER
          value: otlp
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://otelcol:4318
        - name: SHOGGOTH_DOMAIN
          value: {{ .Values.identity.domain }}
        securityContext:
          capabilities:
            add:
            - NET_ADMIN
            - SYS_MODULE
          privileged: true
        volumeMounts:
        - name: data
          mountPath: /etc/wireguard
        - name: entrypoint
          mountPath: /entrypoint.sh
          subPath: entrypoint.sh
          readOnly: true
        - name: modules
          mountPath: /lib/modules
          readOnly: true
        - name: admin-password
          mountPath: /run/secrets/admin_password
          subPath: admin-password
          readOnly: true
        readinessProbe:
          httpGet:
            path: /
            port: {{ .Values.network.wireguard.uiPort }}
          initialDelaySeconds: 5
          periodSeconds: 5
          failureThreshold: 30
        livenessProbe:
          httpGet:
            path: /
            port: {{ .Values.network.wireguard.uiPort }}
          initialDelaySeconds: 10
          periodSeconds: 10
          failureThreshold: 6
        resources:
          requests:
            memory: 64Mi
            cpu: 50m
          limits:
            memory: 256Mi
            cpu: 500m
        command:
        - /entrypoint.sh
        args:
        - /usr/bin/dumb-init
        - node
        - server/index.mjs
      volumes:
      - name: data
        hostPath:
          path: /var/lib/rancher/k3s/storage/{{ .Values.identity.instanceDir }}/wireguard-data
          type: DirectoryOrCreate
      - name: entrypoint
        configMap:
          name: wireguard-entrypoint
          defaultMode: 493
      - name: modules
        hostPath:
          path: /lib/modules
          type: Directory
      - name: admin-password
        secret:
          secretName: wireguard-admin-password
      serviceAccountName: wireguard
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: wireguard
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shoggoth.labels" . | nindent 4 }}
    app: wireguard
    app.kubernetes.io/component: wireguard
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: wireguard-bootstrap-wait
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shoggoth.labels" . | nindent 4 }}
    app: wireguard
    app.kubernetes.io/component: wireguard
rules:
- apiGroups:
  - ''
  resources:
  - secrets
  resourceNames:
  - wireguard-admin-password
  verbs:
  - get
- apiGroups:
  - external-secrets.io
  resources:
  - externalsecrets
  resourceNames:
  - wireguard-admin-password
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: wireguard-bootstrap-wait
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shoggoth.labels" . | nindent 4 }}
    app: wireguard
    app.kubernetes.io/component: wireguard
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: wireguard-bootstrap-wait
subjects:
- kind: ServiceAccount
  name: wireguard
  namespace: {{ .Release.Namespace }}
{{- end }}
