{{- /*
  templates/dns.yaml — CoreDNS-based split-horizon DNS for the shoggoth
  namespace. One ConfigMap (Corefile), one Service (clusterIP pinned to
  identity.dnsIp), one Deployment (coredns 1.14.7 with mounted config +
  blacklist hostPath).

  The blacklists hostPath
  (/var/lib/rancher/k3s/storage/${SHOGGOTH_INSTANCE_DIR}/coredns-blacklists)
  is mounted read-only from the host; it is populated by `make sync`
  in make/k3s.mk:43-46.

  Original env-var placeholders are mapped as:
    ${SHOGGOTH_NAMESPACE}      -> {{ .Release.Namespace }}
    ${SHOGGOTH_DOMAIN}         -> {{ .Values.identity.domain }}
    ${SHOGGOTH_DNS_IP}         -> {{ .Values.identity.dnsIp }}
    ${SHOGGOTH_INSTANCE_DIR}   -> {{ .Values.identity.instanceDir }}

  The `app: dns` label is preserved verbatim so `kubectl get pods -l app=dns`
  and `make start|stop SERVICE=dns` continue to work without changes.
*/}}
{{- if (include "shoggoth.isServiceEnabled" (list . "dns")) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: dns-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shoggoth.labels" . | nindent 4 }}
    app: dns
    app.kubernetes.io/component: dns
data:
  Corefile: |
    .:53 {
        errors
        ready

        hosts /etc/coredns/blacklist/blocklist.hosts {
            ttl 60
            no_reverse
            reload 1h
            fallthrough
        }

        rewrite stop name exact {{ .Values.identity.domain }} web-internal.{{ .Release.Namespace }}.svc.cluster.local
        rewrite stop {
            name suffix {{ .Values.identity.domain }} {{ .Release.Namespace }}.svc.cluster.local
            answer auto
        }

        forward . 10.43.0.10
        cache 30
    }
---
apiVersion: v1
kind: Service
metadata:
  name: dns
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shoggoth.labels" . | nindent 4 }}
    app: dns
    app.kubernetes.io/component: dns
spec:
  clusterIP: {{ .Values.identity.dnsIp }}
  selector:
    app: dns
  ports:
  - name: dns-udp
    port: 53
    targetPort: 53
    protocol: UDP
  - name: dns-tcp
    port: 53
    targetPort: 53
    protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dns
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shoggoth.labels" . | nindent 4 }}
    app: dns
    app.kubernetes.io/component: dns
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: dns
  template:
    metadata:
      labels:
        {{- include "shoggoth.selectorLabels" . | nindent 8 }}
        app: dns
        app.kubernetes.io/component: dns
    spec:
      dnsPolicy: None
      dnsConfig:
        nameservers:
        - {{ .Values.identity.dnsIp }}
        searches:
        - {{ .Release.Namespace }}.svc.cluster.local
        - svc.cluster.local
        - cluster.local
      containers:
      - name: coredns
        image: rancher/mirrored-coredns-coredns:1.14.7
        args:
        - -conf
        - /etc/coredns/Corefile
        ports:
        - containerPort: 53
          protocol: UDP
          name: dns-udp
        - containerPort: 53
          protocol: TCP
          name: dns-tcp
        volumeMounts:
        - name: config
          mountPath: /etc/coredns
          readOnly: true
        - name: blacklist
          mountPath: /etc/coredns/blacklist
          readOnly: true
        resources:
          requests:
            memory: 32Mi
            cpu: 25m
          limits:
            memory: 128Mi
            cpu: 200m
        readinessProbe:
          httpGet:
            path: /ready
            port: 8181
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /ready
            port: 8181
          initialDelaySeconds: 10
          periodSeconds: 10
      volumes:
      - name: config
        configMap:
          name: dns-config
      - name: blacklist
        hostPath:
          path: /var/lib/rancher/k3s/storage/{{ .Values.identity.instanceDir }}/coredns-blacklists
          type: DirectoryOrCreate
{{- end }}
