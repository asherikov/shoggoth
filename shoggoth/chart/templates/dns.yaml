{{- /*
  templates/dns.yaml — CoreDNS-based split-horizon DNS for the shoggoth
  namespace. One ConfigMap (Corefile), one Service (clusterIP pinned to
  identity.dnsIp), one Deployment (coredns with mounted config +
  blacklist hostPath).

  The blacklists hostPath
  (/var/lib/rancher/k3s/storage/${SHOGGOTH_INSTANCE_DIR}/coredns-blacklists)
  is mounted read-only from the host; it is populated outside the release,
  by the host-state step that runs before the install.

  The env-var placeholder names correspond to chart values as:
    ${SHOGGOTH_NAMESPACE}      -> {{ .Release.Namespace }}
    ${SHOGGOTH_DOMAIN}         -> {{ .Values.identity.domain }}
    ${SHOGGOTH_DNS_IP}         -> {{ .Values.identity.dnsIp }}
    ${SHOGGOTH_INSTANCE_DIR}   -> {{ .Values.identity.instanceDir }}

  The `app: dns` label is what `kubectl get pods -l app=dns` selects on.
*/}}
{{- if (include "shoggoth.isServiceEnabled" (list . "dns")) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: dns-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shoggoth.labels" . | nindent 4 }}
    app: dns
    app.kubernetes.io/component: dns
    shoggoth.io/exposure: internal
data:
  Corefile: |
    .:53 {
        errors
        ready

        # Answer AAAA (IPv6) queries with empty NOERROR — shoggoth is
        # IPv4-only, so clients fall back to A instead of trying IPv6.
        template ANY AAAA {
            rcode NOERROR
        }

        hosts /etc/coredns/blacklist/blocklist.hosts {
            ttl 60
            no_reverse
            reload 1h
            fallthrough
        }

        rewrite stop name exact {{ .Values.identity.domain }} web-internal.{{ .Release.Namespace }}.svc.cluster.local
        rewrite stop {
            name suffix {{ .Values.identity.domain }} {{ .Release.Namespace }}.svc.cluster.local
            answer auto
        }

        forward . 10.43.0.10
        cache 30
    }
---
apiVersion: v1
kind: Service
metadata:
  name: dns
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shoggoth.labels" . | nindent 4 }}
    app: dns
    app.kubernetes.io/component: dns
    shoggoth.io/exposure: internal
spec:
  clusterIP: {{ .Values.identity.dnsIp }}
  selector:
    app: dns
  ports:
  - name: dns-udp
    port: 53
    targetPort: 53
    protocol: UDP
  - name: dns-tcp
    port: 53
    targetPort: 53
    protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dns
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shoggoth.labels" . | nindent 4 }}
    app: dns
    kube-diagrams.io/icon: diagrams.alibabacloud.web.Dns
    app.kubernetes.io/component: dns
    shoggoth.io/exposure: internal
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: dns
  template:
    metadata:
      labels:
        {{- include "shoggoth.selectorLabels" . | nindent 8 }}
        app: dns
        app.kubernetes.io/component: dns
        shoggoth.io/exposure: internal
    spec:
      {{- include "shoggoth.podDnsConfig" . | nindent 6 }}
      containers:
      - name: coredns
        image: rancher/mirrored-coredns-coredns:1.15.0
        imagePullPolicy: IfNotPresent
        args:
        - -conf
        - /etc/coredns/Corefile
        ports:
        - containerPort: 53
          protocol: UDP
          name: dns-udp
        - containerPort: 53
          protocol: TCP
          name: dns-tcp
        # Both probes below hit 8181, CoreDNS's readiness endpoint. The port
        # is declared here for the same reason external-secrets.yaml declares
        # its own health port: kube-linter's readiness-port and
        # liveness-port checks compare a probe's port against the declared
        # containerPorts, and an undeclared one is reported whether or not
        # the process is listening. CoreDNS does listen on 8181, so this is
        # a declaration, not a fix.
        - containerPort: 8181
          protocol: TCP
          name: health
        volumeMounts:
        - name: config
          mountPath: /etc/coredns
          readOnly: true
        - name: blacklist
          mountPath: /etc/coredns/blacklist
          readOnly: true
        resources:
          requests:
            memory: 32Mi
            cpu: 25m
          limits:
            memory: 128Mi
            cpu: 200m
        readinessProbe:
          httpGet:
            path: /ready
            port: 8181
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /ready
            port: 8181
          initialDelaySeconds: 10
          periodSeconds: 10
      volumes:
      - name: config
        configMap:
          name: dns-config
      - name: blacklist
        hostPath:
          path: /var/lib/rancher/k3s/storage/{{ .Values.identity.instanceDir }}/coredns-blacklists
          type: DirectoryOrCreate
{{- end }}
