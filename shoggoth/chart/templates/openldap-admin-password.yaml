{{- /*
  templates/openldap-admin-password.yaml — ExternalSecret projecting the
  OpenLDAP ``cn=admin`` password into a K8s Secret.

  Restores shoggoth/k3s/external-secrets/openldap-admin-password.yaml,
  which the chart migration dropped. openbao-bootstrap Phase B seeds
  ``openldap/admin-password`` with a random value on a fresh install
  (or with the contents of ``$INSTANCE/private/admin-password.txt`` if
  the file exists), so this only has to project it. The initContainer
  in openldap.yaml waits on
  ``externalsecret/openldap-admin-password`` and the resulting Secret
  feeds the slapd ``-config`` and DB initialisation.

  Gated on ``openldap``: the only consumer.
*/}}
{{- if (include "shoggoth.isServiceEnabled" (list . "openldap")) }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openldap-admin-password
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shoggoth.labels" . | nindent 4 }}
    app.kubernetes.io/component: openldap-admin-password
spec:
  secretStoreRef:
    name: shoggoth-openbao
    kind: SecretStore
  target:
    name: openldap-admin-password
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: openldap/admin-password
        property: value
  refreshInterval: 5m
{{- end }}
