{{- /*
  templates/grafana-admin-password.yaml — ExternalSecret projecting the
  Grafana admin password into a K8s Secret.

  Consumers: the Deployment in grafana.yaml mounts the resulting Secret at
  ``/run/secrets/admin_password`` (subPath ``admin-password``), which feeds
  GF_SECURITY_ADMIN_PASSWORD — set to ``$__file{...}``, because the
  ``__FILE`` env suffix is not a thing Grafana implements, see the env block
  in grafana.yaml — and the postStart
  ``grafana cli admin reset-admin-password``. There is no initContainer:
  the mount is the only gate, and the kubelet holds the container in
  ContainerCreating until the Secret exists.

  THE VALUE IS THE DIRECTORY ADMIN'S PASSWORD, NOT A SECOND RANDOM ONE.
  README's Accounts table documents ``admin`` as both the OpenLDAP
  administrator and Grafana's local admin login, and that is only true if
  the two are the same secret. A dedicated ``grafana/admin-password`` path
  with its own ``openssl rand`` made it false: the operator knew the LDAP
  password — it is the one shoggoth/data/private/admin-password.txt
  overrides and the one every other service binds with — while Grafana
  wanted a 44-character value they had never seen, and the local login
  then failed with nothing to trace, because Grafana reports a wrong
  password exactly as it reports a right one.

  Reading the directory's own path also inherits the rotation story that
  already exists: the openldap ``post_start`` script re-applies
  ``openldap/admin-password`` on every container start and Grafana's
  postStart hook re-applies it on every pod start, so a rotated value
  reaches both without a second mechanism.

  Gated on ``grafana``: the only consumer.
*/}}
{{- if (include "shoggoth.isServiceEnabled" (list . "grafana")) }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin-password
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shoggoth.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana-admin-password
spec:
  secretStoreRef:
    name: shoggoth-openbao
    kind: SecretStore
  target:
    name: grafana-admin-password
    creationPolicy: Owner
  data:
    - secretKey: admin-password
      remoteRef:
        key: openldap/admin-password
        property: value
  refreshInterval: 5m
{{- end }}
