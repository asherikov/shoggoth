{{- /*
  templates/grafana-admin-password.yaml — ExternalSecret projecting the
  Grafana admin password into a K8s Secret.

  Consumers: the initContainer in grafana.yaml waits on
  ``externalsecret/grafana-admin-password``; the resulting Secret is
  mounted by the Deployment at ``/run/secrets/admin_password``.

  Gated on ``grafana``: the only consumer.
*/}}
{{- if (include "shoggoth.isServiceEnabled" (list . "grafana")) }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin-password
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shoggoth.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana-admin-password
spec:
  secretStoreRef:
    name: shoggoth-openbao
    kind: SecretStore
  target:
    name: grafana-admin-password
    creationPolicy: Owner
  data:
    - secretKey: admin-password
      remoteRef:
        key: grafana/admin-password
        property: value
  refreshInterval: 5m
{{- end }}
