{{- /*
  templates/gitea.yaml — Gitea server + its act_runner.

  `gitea` (the server Deployment) and `gitea-runner` (act_runner) carry
  their own `app:` labels and their own values keys (`services.gitea.enabled`
  and `services.gitea-runner.enabled`), so either can be toggled independently
  via its own values key.

  Each service's resources are gated on its OWN key. An earlier version gated
  the whole file on the union of the two, on the stated grounds that the two
  Deployments share a PVC and ConfigMap. They do not: gitea-runner mounts only
  `gitea-runner-templates`, `shoggoth-render-config` and `shoggoth-shared-cache`
  — never `gitea-data` nor `gitea-init`. The union therefore meant nothing ever
  read `services.gitea.enabled`, so disabling that key printed success
  while Deployment/gitea and Service/git kept serving (the gitea
  ExternalSecrets live in their own templates, gated on `gitea` alone, so they
  did disappear — a half-stopped release). The runner reaches the server over
  the network via GITEA_INSTANCE_URL, not through a shared mount, so the two
  Deployments have no storage coupling to preserve.

  BOOTSTRAP: THE POSTSTART HOOK, NOT A SEPARATE WORKLOAD. There is no
  `gitea-bootstrap` and no `gitea-render-config` in this chart — those names
  survived from an earlier layout and match nothing that exists. Everything
  the gitea Deployment needs beyond its GITEA__* env is done by the
  `gitea-init` ConfigMap's init.sh, run as the gitea container's own
  postStart hook (see `lifecycle` below), which:
    - waits for `gitea admin auth list` to answer,
    - registers the LDAP source (`add-ldap`, or `update-ldap` on later
      starts) — the "plain login" path,
    - registers the Authelia source (`add-oauth`, or `update-oauth`), gated
      on services.authelia,
    - seeds the `admin` account and applies its password.
  Credentials reach it as container env from ExternalSecrets, never inline.

  The install lock is set through GITEA__security__INSTALL_LOCK on the
  Deployment rather than in init.sh, because `gitea admin` cannot run at all
  while it is false — the hook and the lock are therefore ordered by
  necessity, not by choice.

  THIRD AUTH SOURCE: AUTHELIA. The same init.sh also registers an
  `openidConnect` auth source named `authelia` (`gitea admin auth add-oauth`,
  updated idempotently on every pod start), gated on services.authelia. The
  source lives in gitea's own database, so it is a CLI call and not a
  GITEA__* setting, and it needs two things the LDAP source does not: the
  client secret from the authelia-secrets ExternalSecret, and the in-cluster
  CA in the pod's trust store (goth's openidConnect discovery has no
  insecure option — see the volumeMounts at the bottom of this file).

  ${SHOGGOTH_ADMIN_PASSWORD}, ${SHOGGOTH_DOMAIN}, ${LDAP_BIND_DN},
  ${LDAP_BIND_PASSWORD}, ${LDAP_HOST}, ${USER_FILTER} and the bare shell vars
  are resolved at pod start by that script, so they stay literal here —
  nothing expands them on the way through Helm.

  Deployment/gitea and Service/git share the `services.gitea` gate and so move
  together: the Service selects `app: gitea`, so one without the other is
  unreachable or point-less. Stopping `gitea` while `gitea-runner` stays on
  leaves the runner without a server to register with — that is the honest
  consequence of two independently-toggleable, mutually-dependent services, and
  is the same coupling the gitea ExternalSecrets already had.
*/}}
{{- if (include "shoggoth.isServiceEnabled" (list . "gitea")) }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gitea-data
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shoggoth.labels" . | nindent 4 }}
    app.kubernetes.io/component: gitea
  annotations:
    # Kept across `helm uninstall` so uninstalling stops the workloads but
    # preserves data. Reinstall adopts it: shoggoth.labels survives
    # uninstall, so Helm's ownership check still passes.
    helm.sh/resource-policy: keep
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: local-path
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gitea-init
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shoggoth.labels" . | nindent 4 }}
    app.kubernetes.io/component: gitea
data:
  init.sh: |
    #!/bin/sh
    set -eu
    echo "shoggoth: Waiting for Gitea to be ready..."
    for i in $(seq 1 30); do
        if su-exec git gitea admin auth list > /dev/null 2>&1; then
            break
        fi
        sleep 2
    done
    if ! AUTH_CHECK="$(su-exec git gitea admin auth list 2>&1)"; then
        echo "shoggoth: ERROR: Gitea not ready after 60s: ${AUTH_CHECK}" >&2
        exit 1
    fi
    EXISTING="$(su-exec git gitea admin auth list 2>/dev/null \
        | awk -v name="openldap" '$2 == name {print $1; exit}')"
    # The user_filter must exclude the three infrastructure accounts
    # (``admin``, ``ldapauth``, ``config-admin``) — the workflow
    # script's ``Ldap.EXCLUDED_LOGINS`` tuple. Gitea 1.x does not
    # expose the LDAP source list/patch endpoints over its v1 API
    # (verified against ``routers/api/v1/api.go`` v1.21/v1.22/v1.27),
    # so this static filter is the authoritative source: it is
    # applied at first install (``add-ldap``) and re-applied on
    # every gitea pod start (``update-ldap``). The workflow's
    # ``gitea-ldap-sync`` step does not maintain this filter (it
    # only triggers ``sync_external_users``); to re-apply after
    # editing ``Ldap.EXCLUDED_LOGINS`` the operator must
    # ``kubectl rollout restart deployment/gitea -n shoggoth``.
    USER_FILTER="(&(objectClass=inetOrgPerson)(!(uid=admin))(!(uid=ldapauth))(!(uid=config-admin))(|(uid=%[1]s)(mail=%[1]s)))"
    if [ -z "${EXISTING}" ]; then
        su-exec git gitea admin auth add-ldap \
            -name openldap \
            -security-protocol unencrypted \
            -host "${LDAP_HOST}" \
            -port 389 \
            -bind-dn "${LDAP_BIND_DN}" \
            -bind-password "${LDAP_BIND_PASSWORD}" \
            -user-search-base "ou=people,{{ include "shoggoth.ldapBaseDn" . }}" \
            -user-filter "${USER_FILTER}" \
            -admin-filter "(memberOf=cn=admins,ou=groups,{{ include "shoggoth.ldapBaseDn" . }})" \
            -username-attribute uid \
            -firstname-attribute cn \
            -surname-attribute sn \
            -email-attribute mail \
            -synchronize-users
    else
        su-exec git gitea admin auth update-ldap --id "${EXISTING}" \
            -name openldap \
            -security-protocol unencrypted \
            -host "${LDAP_HOST}" \
            -port 389 \
            -bind-dn "${LDAP_BIND_DN}" \
            -bind-password "${LDAP_BIND_PASSWORD}" \
            -user-search-base "ou=people,{{ include "shoggoth.ldapBaseDn" . }}" \
            -user-filter "${USER_FILTER}" \
            -admin-filter "(memberOf=cn=admins,ou=groups,{{ include "shoggoth.ldapBaseDn" . }})" \
            -username-attribute uid \
            -firstname-attribute cn \
            -surname-attribute sn \
            -email-attribute mail \
            -synchronize-users
    fi
    echo "shoggoth: === gitea ldap init complete ==="
{{- if (include "shoggoth.isServiceEnabled" (list . "authelia")) }}
    echo "shoggoth: Registering Authelia as an OIDC authentication source"
    # The discovery URL is HTTPS, and Authelia's certificate is issued by the
    # in-cluster CA. goth's openidConnect provider fetches the discovery
    # document with the default HTTP client
    # (providers/openidConnect: getOpenIDConfig -> p.Client() ->
    # goth.HTTPClientWithFallBack(nil) -> http.DefaultClient) and has no
    # insecure option, so the CA has to be in this pod's system trust store:
    # the shoggoth-ca Secret is mounted by subPath at
    # /etc/ssl/certs/shoggoth-ca.crt, which crypto/x509 scans. Reaching
    # Authelia over plaintext instead is not an option — the portal has no
    # plaintext listener (see authelia.yaml).
    AUTHELIA_DISCOVERY="https://authelia.{{ .Values.identity.domain }}/.well-known/openid-configuration"
    # `-name authelia` is not cosmetic: gitea builds the callback URL as
    # setting.AppURL + "user/oauth2/" + <source name> + "/callback"
    # (services/auth/source/oauth2/providers.go, createProvider), so the name
    # has to match the redirect_uri registered in authelia-config.yaml.
    # `-admin-group admins` maps the directory's `admins` group (the LDAP
    # group the README documents, and the one grafana's role attribute path
    # uses) onto gitea's site-admin flag; everyone else is a normal user.
    # `-skip-local-2fa` is right because the login the user just completed at
    # Authelia is the only authentication this deployment has: Authelia's
    # authorization_policy for this client is one_factor and totp/webauthn/
    # duo_api are disabled outright, so there is no second factor for gitea
    # to fall back on, and a local prompt would be a prompt nothing can
    # satisfy.
    # `add-oauth` is not a database write. models/auth/source.go CreateSource
    # inserts the row and then immediately calls Source.RegisterSource() ->
    # RegisterProviderWithGothic -> CreateGothProvider -> openidConnect.New,
    # which fetches the discovery document above over the same default HTTP
    # client. A failed fetch deletes the row it just inserted ("remove the
    # AuthSource in case of errors while registering configuration",
    # models/auth/source.go) and exits non-zero, so under `set -eu` this
    # script aborts before the admin account is seeded at the bottom — and the
    # postStart wrapper has no `set -e`, so the container keeps running and
    # the failure is invisible: a Gitea that looks healthy with no Authelia
    # source and no SSO button. The readiness gate above only proves gitea can
    # read its own config and database, so it says nothing about Authelia
    # being up yet, and nothing retries until the pod restarts. A `helm
    # upgrade` restarts every pod in the release, which makes that race the
    # normal case rather than the exception, so the registration is retried
    # here instead of being attempted exactly once. Re-reading the source list
    # each attempt is what makes the retry safe in both directions: a row that
    # survived from an earlier start is updated, and one that the rollback
    # deleted is added again.
    OAUTH_REGISTERED=0
    for OAUTH_ATTEMPT in $(seq 1 30); do
        OAUTH_EXISTING="$(su-exec git gitea admin auth list 2>/dev/null \
            | awk -v name="authelia" '$2 == name {print $1; exit}')"
        if [ -n "${OAUTH_EXISTING}" ]; then
            if su-exec git gitea admin auth update-oauth --id "${OAUTH_EXISTING}" \
                -name authelia \
                -provider openidConnect \
                -key gitea \
                -secret "${GITEA_OAUTH_CLIENT_SECRET}" \
                -auto-discover-url "${AUTHELIA_DISCOVERY}" \
                -scopes openid,groups,profile,email \
                -group-claim-name groups \
                -admin-group admins \
                -skip-local-2fa; then
                OAUTH_REGISTERED=1
            fi
        else
            if su-exec git gitea admin auth add-oauth \
                -name authelia \
                -provider openidConnect \
                -key gitea \
                -secret "${GITEA_OAUTH_CLIENT_SECRET}" \
                -auto-discover-url "${AUTHELIA_DISCOVERY}" \
                -scopes openid,groups,profile,email \
                -group-claim-name groups \
                -admin-group admins \
                -skip-local-2fa; then
                OAUTH_REGISTERED=1
            fi
        fi
        if [ "${OAUTH_REGISTERED}" -eq 1 ]; then
            break
        fi
        if [ "${OAUTH_ATTEMPT}" -lt 30 ]; then
            echo "shoggoth: authelia unreachable, attempt ${OAUTH_ATTEMPT}" >&2
            sleep 2
        fi
    done
    if [ "${OAUTH_REGISTERED}" -ne 1 ]; then
        echo "shoggoth: ERROR: authelia source not registered" >&2
        exit 1
    fi
    echo "shoggoth: === gitea authelia oauth init complete ==="
{{- end }}
    echo "shoggoth: Setting local admin password"
    # The admin account is seeded here rather than by the installer page:
    # GITEA__security__INSTALL_LOCK=true (see the Deployment env) means Gitea
    # never serves /install, so there is no web path that creates the first
    # account, and a lock without an account would leave nobody able to log
    # in at all. `create` is made idempotent by falling back to
    # `change-password`: on the first pod start the account does not exist, on
    # every later start it does and the password is re-applied from the Secret
    # (which is also how a rotated openldap-admin-password propagates).
    #
    # The email is the same address the directory seeds for `admin`
    # (openldap.yaml), which is what keeps an LDAP-synchronised account from
    # ever claiming it — and `admin` is excluded from the source's
    # user_filter, so the local account and the directory entry never collide.
    #
    # A failure here is fatal, and deliberately so: the old `|| echo` fallback
    # hid it, which is how the "admin user not found yet" case survived into a
    # deployment where the password was never applied at all.
    if su-exec git gitea admin user create \
        --username admin \
        --email "admin@${SHOGGOTH_DOMAIN}" \
        --password "${SHOGGOTH_ADMIN_PASSWORD}" \
        --admin \
        --must-change-password=false 2>/dev/null; then
        echo "shoggoth: admin user created"
    else
        su-exec git gitea admin user change-password \
            --username admin \
            --password "${SHOGGOTH_ADMIN_PASSWORD}" \
            --must-change-password=false
        echo "shoggoth: admin password updated"
    fi

---
apiVersion: v1
kind: Service
metadata:
  name: git
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shoggoth.labels" . | nindent 4 }}
    app.kubernetes.io/component: gitea
spec:
  selector:
    app: gitea
  ports:
  - name: http
    port: 80
    targetPort: 80
  - name: ssh
    port: 22
    targetPort: 22
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitea
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shoggoth.labels" . | nindent 4 }}
    app.kubernetes.io/component: gitea
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gitea
  template:
    metadata:
      labels:
        app: gitea
      annotations:
        secret.reloader.stakater.com/reload: openldap-ldapauth-password,openldap-admin-password,authelia-secrets
    spec:
      {{- include "shoggoth.podDnsConfig" . | nindent 6 }}
      containers:
      - name: gitea
        image: gitea/gitea:28.3.0
        imagePullPolicy: IfNotPresent
        env:
        - name: SHOGGOTH_DOMAIN
          value: {{ .Values.identity.domain }}
        - name: LDAP_BASE_DN
          value: {{ include "shoggoth.ldapBaseDn" . }}
        - name: LDAP_HOST
          value: openldap
        - name: LDAP_BIND_DN
          value: uid=ldapauth,ou=people,{{ include "shoggoth.ldapBaseDn" . }}
        - name: LDAP_BIND_PASSWORD
          valueFrom:
            secretKeyRef:
              name: openldap-ldapauth-password
              key: password
        - name: SHOGGOTH_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: openldap-admin-password
              key: password
        {{- if (include "shoggoth.isServiceEnabled" (list . "authelia")) }}
        # The OIDC client secret init.sh passes to `add-oauth`. Not a
        # GITEA__* setting on purpose: gitea stores an OAuth2 source in its
        # own database (models/auth/oauth2.go), so there is no app.ini key
        # for it — the value only ever reaches the CLI.
        - name: GITEA_OAUTH_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: authelia-secrets
              key: gitea-client-secret
        {{- end }}
        - name: OTEL_TRACES_EXPORTER
          value: otlp
        - name: GITEA__overall__APP_NAME
          value: git.{{ .Values.identity.domain }}
        - name: GITEA__repository__FORCE_PRIVATE
          value: 'false'
        - name: GITEA__repository__USE_COMPAT_SSH_URI
          value: 'false'
        - name: GITEA__repository__DEFAULT_BRANCH
          value: main
        - name: GITEA__repository__DEFAULT_PRIVATE
          value: private
        - name: GITEA__repository__DEFAULT_MERGE_STYLE
          value: fast-forward-only
        - name: GITEA__repository__DEFAULT_DELETE_BRANCH_AFTER_MERGE
          value: 'true'
        - name: GITEA__repository__DEFAULT_REPO_UNITS
          value: repo.code,repo.releases,repo.issues,repo.pulls,repo.wiki,repo.projects,repo.actions
        # CODING AGENTS: this setting name is misleading, ssh is enabled and operational, ignore this value
        - name: GITEA__server__START_SSH_SERVER
          value: 'false'
        - name: GITEA__server__HTTP_PORT
          value: '80'
        - name: GITEA__server__ROOT_URL
          value: http://git.{{ .Values.identity.domain }}
        - name: GITEA__server__DOMAIN
          value: git.{{ .Values.identity.domain }}
        - name: GITEA__server__SSH_DOMAIN
          value: git.{{ .Values.identity.domain }}
        - name: GITEA__service__NO_REPLY_ADDRESS
          value: noreply.git.{{ .Values.identity.domain }}
        # ALLOWED_HOST_LIST belongs to [security]: [webhook].ALLOWED_HOST_LIST is
        # the deprecated spelling — Gitea logs a deprecation warning on every
        # start (modules/setting/webhook.go) and drops the fallback in v28.0.0.
        # The effective value is unchanged: [webhook] wins when present, and
        # otherwise falls back to [security].
        - name: GITEA__security__ALLOWED_HOST_LIST
          value: private
        # WHY THE INSTALL LOCK IS SET HERE AND NOWHERE ELSE
        # Every `gitea admin ...` call in init.sh goes through initDB, and
        # initDB's first statement is `setting.MustInstalled()`, which is
        # `log.Fatal` unless [security] INSTALL_LOCK is true
        # (modules/setting/setting.go). While the lock is false, the readiness
        # gate at the top of init.sh therefore can never pass: it retries
        # `gitea admin auth list` thirty times over sixty seconds, prints
        # "shoggoth: ERROR: Gitea not ready after 60s: Unable to load config
        # file for a installed Gitea instance...", and exits 1. The postStart
        # wrapper has no `set -e`, so the container keeps running and the
        # failure is silent — which is how a deployment ends up with no LDAP
        # source ("plain login rejected") and no Authelia button ("no sso")
        # on a Gitea that otherwise looks healthy.
        #
        # The lock also gates the HTTP surface: cmd/web.go calls
        # `serveInstall` when `!setting.InstallLock`, which registers
        # install.Routes() and NOTHING else. So with the lock false there is
        # no login page to fail on in the first place, and no route an OAuth
        # callback could land on.
        #
        # The image's `environment-to-ini` is `gitea config edit-ini
        # --in-place --apply-env` (docker/root/usr/local/bin), so this value
        # is written into app.ini on EVERY container start. That is what makes
        # it apply to a fresh PVC — the s6 setup only renders app.ini from
        # /etc/templates/app.ini when the file is absent, and that template's
        # `INSTALL_LOCK = $INSTALL_LOCK` resolves to false — and what repairs
        # an existing volume where the installer page was never completed.
        #
        # The consequence is that /install is never served, so the first
        # account has to come from somewhere else: init.sh seeds it (see the
        # `gitea admin user create` at the bottom of that script).
        #
        # SECRET_KEY is deliberately absent. An empty value is not fatal —
        # loadSecurityFrom substitutes gitea's documented default
        # (modules/setting/security.go) — and inventing a per-install value
        # here would invalidate every session on each pod restart.
        - name: GITEA__security__INSTALL_LOCK
          value: 'true'
        # WHY OPENID SIGN-IN IS OFF, AND WHY IT IS SET RATHER THAN LEFT ALONE
        # The "Sign in with OpenID" button is the one thing the sign-in page
        # offers besides the password form and the Authelia OAuth2 source:
        # templates/user/auth/external_auth_methods.tmpl renders it under
        # `{{`{{if .EnableOpenIDSignIn}}`}}` and links it to /user/login/openid,
        # the page that asks the user to type an OpenID URI. That flag is
        # `[openid] ENABLE_OPENID_SIGNIN` (modules/setting/service.go,
        # MustBool(false)) and nothing in this deployment has ever written
        # it — the chart, the image's app.ini template and Gitea's installer
        # are all silent on [openid] — so the default is false and the button
        # should not exist here.
        #
        # Setting it explicitly rather than trusting that default is what
        # makes the value survive an app.ini that already carries
        # ENABLE_OPENID_SIGNIN = true. The s6 setup renders app.ini from
        # /etc/templates/app.ini only when the file is absent, so a volume
        # created before this key was pinned keeps whatever it had, and
        # `environment-to-ini` (`gitea config edit-ini --in-place
        # --apply-env`, docker/root/usr/local/bin) is the only thing that
        # rewrites it on every container start —
        # modules/setting/config_env.go EnvironmentToConfig maps
        # GITEA__<section>__<key> onto `[section] key = value`, which is the
        # same mechanism GITEA__security__INSTALL_LOCK above relies on.
        #
        # There is no admin-UI equivalent: templates/admin/config.tmpl only
        # prints a check or a cross for this setting, and no route saves the
        # config file outside the installer, so an env var is the only lever.
        #
        # The scope is deliberately narrow. ENABLE_OPENID_SIGNUP is a
        # separate key that already defaults to false and is left alone, and
        # /user/login/openid itself stays registered
        # (routers/web/web.go) — only the link to it goes away, so the route
        # becomes unreachable through the UI rather than being removed.
        # Dropping the flag also removes the OpenID panel from user settings
        # (templates/user/settings/security/security.tmpl).
        - name: GITEA__openid__ENABLE_OPENID_SIGNIN
          value: 'false'
        - name: GITEA__admin__USER_DISABLED_FEATURES
          value: deletion
        - name: GITEA__actions__DEFAULT_ACTIONS_URL
          value: github
        - name: GITEA__opentelemetry__ENABLED
          value: 'true'
        - name: GITEA__opentelemetry__ENDPOINT
          value: http://otelcol:4317
        - name: GITEA__log__LEVEL
          value: warn
        ports:
        - containerPort: 80
          name: http
        - containerPort: 22
          name: ssh
        resources:
          requests:
            memory: 256Mi
            cpu: 200m
          limits:
            memory: 512Mi
            cpu: '1'
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
          failureThreshold: 30
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 30
          failureThreshold: 3
        lifecycle:
          postStart:
            exec:
              command:
              - /bin/bash
              - -c
              - |
                set -o pipefail
                LOG=/data/gitea/gitea-init.log
                exec > >(tee -a "${LOG}" > /proc/1/fd/1) 2>&1
                echo "=== gitea-init start $(date -Iseconds) ==="
                /bin/sh /shoggoth/git/gitea/init.sh
                echo "=== gitea-init exit $? $(date -Iseconds) ==="
        volumeMounts:
        - name: data
          mountPath: /data
        - name: gitea-init
          mountPath: /shoggoth/git/gitea
          readOnly: true
        {{- if (include "shoggoth.isServiceEnabled" (list . "authelia")) }}
        # The in-cluster CA, added to this pod's trust store so goth's
        # openidConnect discovery of Authelia's HTTPS endpoint validates.
        # subPath rather than a directory mount: a whole-directory mount of
        # shoggoth-ca would replace /etc/ssl/certs and take the system
        # bundle with it. crypto/x509 reads every non-directory file in
        # /etc/ssl/certs, so one file dropped in by subPath is additive.
        # SSL_CERT_FILE would be the alternative and is wrong for the same
        # reason — it replaces the roots instead of extending them.
        - name: ca-cert
          mountPath: /etc/ssl/certs/shoggoth-ca.crt
          subPath: shoggoth-ca.crt
          readOnly: true
        {{- end }}
      volumes:
      - name: gitea-init
        configMap:
          name: gitea-init
          defaultMode: 493
      - name: data
        persistentVolumeClaim:
          claimName: gitea-data
      {{- if (include "shoggoth.isServiceEnabled" (list . "authelia")) }}
      - name: ca-cert
        secret:
          secretName: shoggoth-ca
          items:
          - key: ca.crt
            path: shoggoth-ca.crt
      {{- end }}
      serviceAccountName: gitea
{{- end }}
{{- if (include "shoggoth.isServiceEnabled" (list . "gitea-runner")) }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitea-runner
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shoggoth.labels" . | nindent 4 }}
    app.kubernetes.io/component: gitea
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gitea-runner
  template:
    metadata:
      labels:
        app: gitea-runner
      annotations:
        secret.reloader.stakater.com/reload: gitea-runner-token
    spec:
      {{- include "shoggoth.podDnsConfig" . | nindent 6 }}
      initContainers:
      - name: render-config
        image: asherikov/shoggoth_tools:alpine
        imagePullPolicy: IfNotPresent
        env:
        - name: SHOGGOTH_DOMAIN
          value: {{ .Values.identity.domain }}
        - name: RENDER_VARS
          value: {{ .Values.identity.domain }}
        command:
        - bash
        - -c
        - exec /tmpl/render.sh
        resources:
          requests:
            memory: 32Mi
            cpu: 50m
          limits:
            memory: 64Mi
            cpu: 200m
        volumeMounts:
        - name: templates
          mountPath: /templates
          readOnly: true
        - name: rendered-config
          mountPath: /rendered
        - name: render-script
          mountPath: /tmpl
          readOnly: true
      containers:
      - name: runner
        image: gitea/runner:6.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - name: cache
          containerPort: 8088
        env:
        - name: SHOGGOTH_DOMAIN
          value: {{ .Values.identity.domain }}
        - name: OTEL_TRACES_EXPORTER
          value: otlp
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://otelcol:4318
        - name: GITEA_INSTANCE_URL
          value: http://git.{{ .Release.Namespace }}.svc.cluster.local
        - name: GITEA_RUNNER_NAME
          value: shoggoth-runner
        # GITEA_RUNNER_LABELS overrides config file, should not be set
        # - name: GITEA_RUNNER_LABELS
        #   value: ""
        - name: GITEA_RUNNER_REGISTRATION_TOKEN_FILE
          value: /run/secrets/gitea_runner_token
        - name: CONFIG_FILE
          value: /shoggoth/rendered/config.yaml
        # Slave-dind's dockerd socket. The runner talks to slave-dind's
        # dockerd via this path; the runner config's `container.docker_host`
        # is set to the same value, so the two stay in lock-step. The
        # hostPath is the SAME one slave-dind's dind container writes the
        # socket to (the slave-dind chart template's volumes/dind-socket),
        # so the runner pod and the dind container share one socket.
        - name: DOCKER_HOST
          value: unix:///dind/docker.sock
        volumeMounts:
        - name: data
          mountPath: /data
        - name: rendered-config
          mountPath: /shoggoth/rendered
          readOnly: true
        - name: runner-token
          mountPath: /run/secrets/gitea_runner_token
          subPath: token
          readOnly: true
        # Slave-dind's dockerd socket (same hostPath the dind container
        # mounts at /dind). Without this mount the runner can't reach the
        # daemon and every workflow run fails with "Cannot connect to the
        # Docker daemon".
        - name: dind-socket
          mountPath: /dind
        # Shared build cache (ccache / pip / npm / apt-cached debs etc.).
        # The runner's actions/cache backend stores its files under
        # /cache/gitea/actcache/ — without this mount the cache backend
        # would land on the runner pod's empty root filesystem and be lost
        # on pod reschedule. Slave-dind and slave-term mount the same PVC
        # so the cache survives across consumers.
        - name: shared-cache
          mountPath: /cache
      volumes:
      - name: rendered-config
        emptyDir: {}
      - name: data
        hostPath:
          path: /var/lib/rancher/k3s/storage/{{ .Values.identity.instanceDir }}/gitea-runner-data
          type: DirectoryOrCreate
      - name: runner-token
        secret:
          secretName: gitea-runner-token
      - name: templates
        configMap:
          name: gitea-runner-templates
      - name: render-script
        configMap:
          name: shoggoth-render-config
          defaultMode: 493
      # Same hostPath slave-dind's dind container writes the daemon socket
      # to (see the slave-dind chart template). DirectoryOrCreate so the
      # first start on a fresh node does not fail.
      - name: dind-socket
        hostPath:
          path: /var/lib/rancher/k3s/storage/{{ .Values.identity.instanceDir }}/dind-socket
          type: DirectoryOrCreate
      - name: shared-cache
        persistentVolumeClaim:
          claimName: shoggoth-shared-cache
      serviceAccountName: gitea-runner
{{- end }}
{{- if (include "shoggoth.isServiceEnabled" (list . "gitea")) }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gitea
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shoggoth.labels" . | nindent 4 }}
    app.kubernetes.io/component: gitea
{{- end }}
{{- if (include "shoggoth.isServiceEnabled" (list . "gitea-runner")) }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gitea-runner
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shoggoth.labels" . | nindent 4 }}
    app.kubernetes.io/component: gitea
{{- end }}
---
{{- if (include "shoggoth.isServiceEnabled" (list . "gitea-runner")) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: gitea-runner-templates
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shoggoth.labels" . | nindent 4 }}
    app.kubernetes.io/component: gitea
data:
  config.yaml: |
    log:
      level: debug
    runner:
      file: .runner
      capacity: 1
      # envs passed to every spawned job container. GITEA_SSH_HOST lets
      # workflow steps use the ssh-agent + git-credential-cache that
      # slave-dind's git-cred sidecar initialises; the matching bind mount
      # of /shoggoth/git-cred into the container is what `container.valid_volumes`
      # (below) authorises. SSH_AUTH_SOCK is set in the slave Dockerfile ENV
      # block. GITEA_INSTANCE_SSH_HOST was dropped (unused — same value as
      # GITEA_SSH_HOST).
      envs:
        RUNNER_TOOL_CACHE: /toolcache
        GITEA_SSH_HOST: git.{{ .Values.identity.domain }}
        # GITEA_SERVER_URL is the direct service form, not the gateway
        # path. Baking `http://api/gitea` into the slave image's ENV block
        # broke every workflow step that calls the Gitea API: Angie has
        # `server_name api.${DOMAIN}` (not `server_name api`), so
        # Host=`api` fell through to the default_server 404. The direct
        # form matches what the argo maintenance template wires
        # (chart/files/argo/templates/maintenance.yaml), so spawned job
        # containers that import shoggoth.py can build `api_url` without
        # raising KeyError. Auth on direct calls still needs
        # `GITEA_SLAVE_TOKEN`; the runner container doesn't have that env
        # wired today, so workflows that hit the gitea API either succeed
        # without auth (public endpoints) or set their own token in step
        # env.
        GITEA_SERVER_URL: "http://git.{{ .Values.identity.domain }}"
      timeout: 3h
      shutdown_timeout: 0s
      insecure: false
      fetch_timeout: 5s
      fetch_interval: 2s
      fetch_interval_max: 30s
      github_mirror: ''
      default_image: ""
      labels:
        - "ubuntu-latest:docker://registry.{{ .Values.identity.domain }}/slave:noble"
        - "ubuntu-24.04:docker://registry.{{ .Values.identity.domain }}/slave:noble"
        - "ubuntu-22.04:docker://registry.{{ .Values.identity.domain }}/slave:jammy"
    cache:
      enabled: true
      # Actions output cache backend — the gitea-runner process listens on
      # this port and serves the actions/cache@v3+ cache API to job pods.
      # Reachable from job pods via the headless Service `gitea-runner` in
      # this namespace; the runner pod itself binds 0.0.0.0:8088, the Service
      # exposes that port, and job pods resolve `cache.host` through cluster
      # DNS. See the `gitea-runner` Service manifest at the bottom of this
      # file.
      dir: "/cache/gitea/actcache/"
      host: "gitea-runner.{{ .Release.Namespace }}.svc.cluster.local"
      port: 8088
      # offline_mode reuses a cached action checkout instead of
      # git-cloning actions from github.com every run.
      offline_mode: true
    container:
      # Workflow jobs are spawned as docker containers on slave-dind's
      # dockerd (the existing slave-dind pod — its dind container exposes
      # --host unix:///dind/docker.sock over a
      # hostPath-mounted directory). The gitea-runner Deployment mounts the
      # SAME hostPath and sets DOCKER_HOST to the in-pod path, so the runner
      # talks to slave-dind's daemon as if it were local.
      #
      # Bind-mount sources come from slave-dind's filesystem: the docker
      # daemon sees /shoggoth/git-cred (ssh-agent + git-credential-cache
      # sockets, known_hosts) and /cache (the shared build cache PVC) and
      # bind-mounts them into spawned job containers. The runner refuses any
      # bind mount that is not in `valid_volumes`, so these two paths have to
      # be listed explicitly.
      docker_host: unix:///dind/docker.sock
      valid_volumes:
        - /shoggoth/git-cred
        - /cache
      # default docker bridge network is correct: spawned containers reach
      # the cluster DNS through the daemon (which itself runs with the
      # shoggoth.podDnsConfig DNS block, so
      # git.{{ .Values.identity.domain }} resolves correctly inside spawned containers)
      # and reach the gitea-runner cache server via the cluster Service IP.
      network_mode: bridge
      # Workflow steps do not need privileged mode. CI actions that build
      # images via docker-in-docker go through slave-dind's dedicated DinD
      # path, not through the runner.
      privileged: false
{{- end }}
---
{{- if (include "shoggoth.isServiceEnabled" (list . "gitea-runner")) }}
apiVersion: v1
kind: Service
metadata:
  name: gitea-runner
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shoggoth.labels" . | nindent 4 }}
    app.kubernetes.io/component: gitea
spec:
  # Headless: job pods need to reach the runner's cache server by DNS name
  # (gitea-runner.{{ .Release.Namespace }}.svc.cluster.local). A headless Service
  # gives a stable cluster DNS record per pod IP without load-balancing —
  # exactly what a single-replica cache-server needs.
  clusterIP: None
  selector:
    app: gitea-runner
  ports:
  - name: cache
    port: 8088
    targetPort: cache
{{- end }}
