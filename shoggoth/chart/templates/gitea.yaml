{{- /*
  templates/gitea.yaml — Gitea server + its act_runner.

  `gitea` (the server Deployment) and `gitea-runner` (act_runner) carry
  their own `app:` labels and their own values keys (`services.gitea.enabled`
  and `services.gitea-runner.enabled`), so either can be toggled independently
  via `make start|stop SERVICE=<label>`.

  Each service's resources are gated on its OWN key. An earlier version gated
  the whole file on the union of the two, on the stated grounds that the two
  Deployments share a PVC and ConfigMap. They do not: gitea-runner mounts only
  `gitea-runner-templates`, `shoggoth-render-config` and `shoggoth-shared-cache`
  — never `gitea-data` nor `gitea-init`. The union therefore meant nothing ever
  read `services.gitea.enabled`, so `make stop SERVICE=gitea` printed success
  while Deployment/gitea and Service/git kept serving (the gitea
  ExternalSecrets live in their own templates, gated on `gitea` alone, so they
  did disappear — a half-stopped release). The runner reaches the server over
  the network via GITEA_INSTANCE_URL, not through a shared mount, so the two
  Deployments have no storage coupling to preserve.

  `gitea-bootstrap` seeds the admin user and writes the install lock over
  LDAP; `gitea-render-config` renders app.ini from a template. Both receive
  credentials from ExternalSecrets, never inline.

  ${SHOGGOTH_ADMIN_PASSWORD}, ${LDAP_BIND_DN}, ${LDAP_BIND_PASSWORD},
  ${LDAP_HOST}, ${USER_FILTER} and the bare shell vars are resolved at pod
  start by those scripts, not at deploy time, so they stay literal here —
  exactly as envsubst's $ENV_VARS whitelist left them.

  Deployment/gitea and Service/git share the `services.gitea` gate and so move
  together: the Service selects `app: gitea`, so one without the other is
  unreachable or point-less. Stopping `gitea` while `gitea-runner` stays on
  leaves the runner without a server to register with — that is the honest
  consequence of two independently-toggleable, mutually-dependent services, and
  is the same coupling the gitea ExternalSecrets already had.
*/}}
{{- if (include "shoggoth.isServiceEnabled" (list . "gitea")) }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gitea-data
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shoggoth.labels" . | nindent 4 }}
    app.kubernetes.io/component: gitea
  annotations:
    # Kept across `helm uninstall` so `make down` stops workloads but
    # preserves data. Reinstall adopts it: shoggoth.labels survives
    # uninstall, so Helm's ownership check still passes.
    helm.sh/resource-policy: keep
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: local-path
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gitea-init
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shoggoth.labels" . | nindent 4 }}
    app.kubernetes.io/component: gitea
data:
  init.sh: |
    #!/bin/sh
    set -eu
    echo "shoggoth: Waiting for Gitea to be ready..."
    for i in $(seq 1 30); do
        if su-exec git gitea admin auth list > /dev/null 2>&1; then
            break
        fi
        sleep 2
    done
    if ! AUTH_CHECK="$(su-exec git gitea admin auth list 2>&1)"; then
        echo "shoggoth: ERROR: Gitea not ready after 60s: ${AUTH_CHECK}" >&2
        exit 1
    fi
    EXISTING="$(su-exec git gitea admin auth list 2>/dev/null \
        | awk -v name="openldap" '$2 == name {print $1; exit}')"
    # The user_filter must exclude the three infrastructure accounts
    # (``admin``, ``ldapauth``, ``config-admin``) — the workflow
    # script's ``Ldap.EXCLUDED_LOGINS`` tuple. Gitea 1.x does not
    # expose the LDAP source list/patch endpoints over its v1 API
    # (verified against ``routers/api/v1/api.go`` v1.21/v1.22/v1.27),
    # so this static filter is the authoritative source: it is
    # applied at first install (``add-ldap``) and re-applied on
    # every gitea pod start (``update-ldap``). The workflow's
    # ``gitea-ldap-sync`` step does not maintain this filter (it
    # only triggers ``sync_external_users``); to re-apply after
    # editing ``Ldap.EXCLUDED_LOGINS`` the operator must
    # ``kubectl rollout restart deployment/gitea -n shoggoth``.
    USER_FILTER="(&(objectClass=inetOrgPerson)(!(uid=admin))(!(uid=ldapauth))(!(uid=config-admin))(|(uid=%[1]s)(mail=%[1]s)))"
    if [ -z "${EXISTING}" ]; then
        su-exec git gitea admin auth add-ldap \
            -name openldap \
            -security-protocol unencrypted \
            -host "${LDAP_HOST}" \
            -port 389 \
            -bind-dn "${LDAP_BIND_DN}" \
            -bind-password "${LDAP_BIND_PASSWORD}" \
            -user-search-base "ou=people,{{ include "shoggoth.ldapBaseDn" . }}" \
            -user-filter "${USER_FILTER}" \
            -admin-filter "(memberOf=cn=admins,ou=groups,{{ include "shoggoth.ldapBaseDn" . }})" \
            -username-attribute uid \
            -firstname-attribute cn \
            -surname-attribute sn \
            -email-attribute mail \
            -synchronize-users
    else
        su-exec git gitea admin auth update-ldap --id "${EXISTING}" \
            -name openldap \
            -security-protocol unencrypted \
            -host "${LDAP_HOST}" \
            -port 389 \
            -bind-dn "${LDAP_BIND_DN}" \
            -bind-password "${LDAP_BIND_PASSWORD}" \
            -user-search-base "ou=people,{{ include "shoggoth.ldapBaseDn" . }}" \
            -user-filter "${USER_FILTER}" \
            -admin-filter "(memberOf=cn=admins,ou=groups,{{ include "shoggoth.ldapBaseDn" . }})" \
            -username-attribute uid \
            -firstname-attribute cn \
            -surname-attribute sn \
            -email-attribute mail \
            -synchronize-users
    fi
    echo "shoggoth: === gitea ldap init complete ==="
    echo "shoggoth: Setting local admin password"
    su-exec git gitea admin user change-password --username admin --password "${SHOGGOTH_ADMIN_PASSWORD}" --must-change-password=false 2>/dev/null \
        || echo "shoggoth: admin user not found yet (will be created on first web login)"

---
apiVersion: v1
kind: Service
metadata:
  name: git
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shoggoth.labels" . | nindent 4 }}
    app.kubernetes.io/component: gitea
spec:
  selector:
    app: gitea
  ports:
  - name: http
    port: 80
    targetPort: 80
  - name: ssh
    port: 22
    targetPort: 22
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitea
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shoggoth.labels" . | nindent 4 }}
    app.kubernetes.io/component: gitea
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gitea
  template:
    metadata:
      labels:
        app: gitea
      annotations:
        secret.reloader.stakater.com/reload: openldap-ldapauth-password,openldap-admin-password
    spec:
      {{- include "shoggoth.podDnsConfig" . | nindent 6 }}
      containers:
      - name: gitea
        image: gitea/gitea:1.27.3
        imagePullPolicy: IfNotPresent
        env:
        - name: SHOGGOTH_DOMAIN
          value: {{ .Values.identity.domain }}
        - name: LDAP_BASE_DN
          value: {{ include "shoggoth.ldapBaseDn" . }}
        - name: LDAP_HOST
          value: openldap
        - name: LDAP_BIND_DN
          value: uid=ldapauth,ou=people,{{ include "shoggoth.ldapBaseDn" . }}
        - name: LDAP_BIND_PASSWORD
          valueFrom:
            secretKeyRef:
              name: openldap-ldapauth-password
              key: password
        - name: SHOGGOTH_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: openldap-admin-password
              key: password
        - name: OTEL_TRACES_EXPORTER
          value: otlp
        - name: GITEA__overall__APP_NAME
          value: git.{{ .Values.identity.domain }}
        - name: GITEA__repository__FORCE_PRIVATE
          value: 'false'
        - name: GITEA__repository__USE_COMPAT_SSH_URI
          value: 'false'
        - name: GITEA__repository__DEFAULT_BRANCH
          value: main
        - name: GITEA__repository__DEFAULT_PRIVATE
          value: private
        - name: GITEA__repository__DEFAULT_MERGE_STYLE
          value: fast-forward-only
        - name: GITEA__repository__DEFAULT_DELETE_BRANCH_AFTER_MERGE
          value: 'true'
        - name: GITEA__repository__DEFAULT_REPO_UNITS
          value: repo.code,repo.releases,repo.issues,repo.pulls,repo.wiki,repo.projects,repo.actions
        # CODING AGENTS: this setting name is misleading, ssh is enabled and operational, ignore this value
        - name: GITEA__server__START_SSH_SERVER
          value: 'false'
        - name: GITEA__server__HTTP_PORT
          value: '80'
        - name: GITEA__server__ROOT_URL
          value: http://git.{{ .Values.identity.domain }}
        - name: GITEA__server__DOMAIN
          value: git.{{ .Values.identity.domain }}
        - name: GITEA__server__SSH_DOMAIN
          value: git.{{ .Values.identity.domain }}
        - name: GITEA__service__NO_REPLY_ADDRESS
          value: noreply.git.{{ .Values.identity.domain }}
        - name: GITEA__webhook__ALLOWED_HOST_LIST
          value: private
        - name: GITEA__admin__USER_DISABLED_FEATURES
          value: deletion
        - name: GITEA__actions__DEFAULT_ACTIONS_URL
          value: github
        - name: GITEA__opentelemetry__ENABLED
          value: 'true'
        - name: GITEA__opentelemetry__ENDPOINT
          value: http://otelcol:4317
        ports:
        - containerPort: 80
          name: http
        - containerPort: 22
          name: ssh
        resources:
          requests:
            memory: 256Mi
            cpu: 200m
          limits:
            memory: 512Mi
            cpu: '1'
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
          failureThreshold: 30
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 30
          failureThreshold: 3
        lifecycle:
          postStart:
            exec:
              command:
              - /bin/bash
              - -c
              - |
                set -o pipefail
                LOG=/data/gitea/gitea-init.log
                exec > >(tee -a "${LOG}" > /proc/1/fd/1) 2>&1
                echo "=== gitea-init start $(date -Iseconds) ==="
                /bin/sh /shoggoth/git/gitea/init.sh
                echo "=== gitea-init exit $? $(date -Iseconds) ==="
        volumeMounts:
        - name: data
          mountPath: /data
        - name: gitea-init
          mountPath: /shoggoth/git/gitea
          readOnly: true
      volumes:
      - name: gitea-init
        configMap:
          name: gitea-init
          defaultMode: 493
      - name: data
        persistentVolumeClaim:
          claimName: gitea-data
      serviceAccountName: gitea
{{- end }}
{{- if (include "shoggoth.isServiceEnabled" (list . "gitea-runner")) }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitea-runner
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shoggoth.labels" . | nindent 4 }}
    app.kubernetes.io/component: gitea
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gitea-runner
  template:
    metadata:
      labels:
        app: gitea-runner
      annotations:
        secret.reloader.stakater.com/reload: gitea-runner-token
    spec:
      {{- include "shoggoth.podDnsConfig" . | nindent 6 }}
      initContainers:
      - name: render-config
        image: asherikov/shoggoth_tools:alpine
        imagePullPolicy: IfNotPresent
        env:
        - name: SHOGGOTH_DOMAIN
          value: {{ .Values.identity.domain }}
        - name: RENDER_VARS
          value: {{ .Values.identity.domain }}
        command:
        - bash
        - -c
        - exec /tmpl/render.sh
        resources:
          requests:
            memory: 32Mi
            cpu: 50m
          limits:
            memory: 64Mi
            cpu: 200m
        volumeMounts:
        - name: templates
          mountPath: /templates
          readOnly: true
        - name: rendered-config
          mountPath: /rendered
        - name: render-script
          mountPath: /tmpl
          readOnly: true
      containers:
      - name: runner
        image: gitea/runner:4.1.0
        imagePullPolicy: IfNotPresent
        ports:
        - name: cache
          containerPort: 8088
        env:
        - name: SHOGGOTH_DOMAIN
          value: {{ .Values.identity.domain }}
        - name: OTEL_TRACES_EXPORTER
          value: otlp
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://otelcol:4318
        - name: GITEA_INSTANCE_URL
          value: http://git.{{ .Release.Namespace }}.svc.cluster.local
        - name: GITEA_RUNNER_NAME
          value: shoggoth-runner
        # GITEA_RUNNER_LABELS overrides config file, should not be set
        # - name: GITEA_RUNNER_LABELS
        #   value: ""
        - name: GITEA_RUNNER_REGISTRATION_TOKEN_FILE
          value: /run/secrets/gitea_runner_token
        - name: CONFIG_FILE
          value: /shoggoth/rendered/config.yaml
        # Slave-dind's dockerd socket. The runner talks to slave-dind's
        # dockerd via this path; the runner config's `container.docker_host`
        # is set to the same value, so the two stay in lock-step. The
        # hostPath is the SAME one slave-dind's dind container writes the
        # socket to (the slave-dind chart template's volumes/dind-socket),
        # so the runner pod and the dind container share one socket.
        - name: DOCKER_HOST
          value: unix:///dind/docker.sock
        volumeMounts:
        - name: data
          mountPath: /data
        - name: rendered-config
          mountPath: /shoggoth/rendered
          readOnly: true
        - name: runner-token
          mountPath: /run/secrets/gitea_runner_token
          subPath: token
          readOnly: true
        # Slave-dind's dockerd socket (same hostPath the dind container
        # mounts at /dind). Without this mount the runner can't reach the
        # daemon and every workflow run fails with "Cannot connect to the
        # Docker daemon".
        - name: dind-socket
          mountPath: /dind
        # Shared build cache (ccache / pip / npm / apt-cached debs etc.).
        # The runner's actions/cache backend stores its files under
        # /cache/gitea/actcache/ — without this mount the cache backend
        # would land on the runner pod's empty root filesystem and be lost
        # on pod reschedule. Slave-dind and slave-term mount the same PVC
        # so the cache survives across consumers.
        - name: shared-cache
          mountPath: /cache
      volumes:
      - name: rendered-config
        emptyDir: {}
      - name: data
        hostPath:
          path: /var/lib/rancher/k3s/storage/{{ .Values.identity.instanceDir }}/gitea-runner-data
          type: DirectoryOrCreate
      - name: runner-token
        secret:
          secretName: gitea-runner-token
      - name: templates
        configMap:
          name: gitea-runner-templates
      - name: render-script
        configMap:
          name: shoggoth-render-config
          defaultMode: 493
      # Same hostPath slave-dind's dind container writes the daemon socket
      # to (see the slave-dind chart template). DirectoryOrCreate so the
      # first start on a fresh node does not fail.
      - name: dind-socket
        hostPath:
          path: /var/lib/rancher/k3s/storage/{{ .Values.identity.instanceDir }}/dind-socket
          type: DirectoryOrCreate
      - name: shared-cache
        persistentVolumeClaim:
          claimName: shoggoth-shared-cache
      serviceAccountName: gitea-runner
{{- end }}
{{- if (include "shoggoth.isServiceEnabled" (list . "gitea")) }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gitea
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shoggoth.labels" . | nindent 4 }}
    app.kubernetes.io/component: gitea
{{- end }}
{{- if (include "shoggoth.isServiceEnabled" (list . "gitea-runner")) }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gitea-runner
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shoggoth.labels" . | nindent 4 }}
    app.kubernetes.io/component: gitea
{{- end }}
---
{{- if (include "shoggoth.isServiceEnabled" (list . "gitea-runner")) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: gitea-runner-templates
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shoggoth.labels" . | nindent 4 }}
    app.kubernetes.io/component: gitea
data:
  config.yaml: |
    log:
      level: debug
    runner:
      file: .runner
      capacity: 1
      # envs passed to every spawned job container. GITEA_SSH_HOST lets
      # workflow steps use the ssh-agent + git-credential-cache that
      # slave-dind's git-cred sidecar initialises; the matching bind mount
      # of /shoggoth/git-cred into the container is what `container.valid_volumes`
      # (below) authorises. SSH_AUTH_SOCK is set in the slave Dockerfile ENV
      # block. GITEA_INSTANCE_SSH_HOST was dropped (unused — same value as
      # GITEA_SSH_HOST).
      envs:
        RUNNER_TOOL_CACHE: /toolcache
        GITEA_SSH_HOST: git.{{ .Values.identity.domain }}
        # GITEA_SERVER_URL was previously baked into the slave image's ENV
        # block as `http://api/gitea`; that broke every workflow step that
        # calls the Gitea API because Angie has `server_name api.${DOMAIN}`
        # (not `server_name api`) so Host=`api` fell through to the
        # default_server 404. Defined here — direct service form, matching
        # the pattern `main_shoggoth_maintenance.yml` already uses — so
        # spawned job containers that import shoggoth.py can build
        # `api_url` without raising
        # KeyError. Auth on direct calls still needs `GITEA_SLAVE_TOKEN`;
        # the runner container doesn't have that env wired today, so
        # workflows that hit gitea API today either succeed without auth
        # (public endpoints) or set their own token in step env.
        GITEA_SERVER_URL: "http://git.{{ .Values.identity.domain }}"
      timeout: 3h
      shutdown_timeout: 0s
      insecure: false
      fetch_timeout: 5s
      fetch_interval: 2s
      fetch_interval_max: 30s
      github_mirror: ''
      default_image: ""
      labels:
        - "ubuntu-latest:docker://registry.{{ .Values.identity.domain }}/slave:noble"
        - "ubuntu-24.04:docker://registry.{{ .Values.identity.domain }}/slave:noble"
        - "ubuntu-22.04:docker://registry.{{ .Values.identity.domain }}/slave:jammy"
    cache:
      enabled: true
      # Actions output cache backend — the gitea-runner process listens on
      # this port and serves the actions/cache@v3+ cache API to job pods.
      # Reachable from job pods via the headless Service `gitea-runner` in
      # this namespace; the runner pod itself binds 0.0.0.0:8088, the Service
      # exposes that port, and job pods resolve `cache.host` through cluster
      # DNS. See the `gitea-runner` Service manifest at the bottom of this
      # file.
      dir: "/cache/gitea/actcache/"
      host: "gitea-runner.{{ .Release.Namespace }}.svc.cluster.local"
      port: 8088
      # offline_mode reuses a cached action checkout instead of
      # git-cloning actions from github.com every run.
      offline_mode: true
    container:
      # Workflow jobs are spawned as docker containers on slave-dind's
      # dockerd (the existing slave-dind pod — its dind container exposes
      # --host unix:///dind/docker.sock over a
      # hostPath-mounted directory). The gitea-runner Deployment mounts the
      # SAME hostPath and sets DOCKER_HOST to the in-pod path, so the runner
      # talks to slave-dind's daemon as if it were local.
      #
      # Bind-mount sources come from slave-dind's filesystem: the docker
      # daemon sees /shoggoth/git-cred (ssh-agent + git-credential-cache
      # sockets, known_hosts) and /cache (the shared build cache PVC) and
      # bind-mounts them into spawned job containers. The runner refuses any
      # bind mount that is not in `valid_volumes`, so these two paths have to
      # be listed explicitly.
      docker_host: unix:///dind/docker.sock
      valid_volumes:
        - /shoggoth/git-cred
        - /cache
      # default docker bridge network is correct: spawned containers reach
      # the cluster DNS through the daemon (which itself runs with the
      # shoggoth.podDnsConfig DNS block, so
      # git.{{ .Values.identity.domain }} resolves correctly inside spawned containers)
      # and reach the gitea-runner cache server via the cluster Service IP.
      network_mode: bridge
      # Workflow steps do not need privileged mode. CI actions that build
      # images via docker-in-docker go through slave-dind's dedicated DinD
      # path, not through the runner.
      privileged: false
{{- end }}
---
{{- if (include "shoggoth.isServiceEnabled" (list . "gitea-runner")) }}
apiVersion: v1
kind: Service
metadata:
  name: gitea-runner
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shoggoth.labels" . | nindent 4 }}
    app.kubernetes.io/component: gitea
spec:
  # Headless: job pods need to reach the runner's cache server by DNS name
  # (gitea-runner.{{ .Release.Namespace }}.svc.cluster.local). A headless Service
  # gives a stable cluster DNS record per pod IP without load-balancing —
  # exactly what a single-replica cache-server needs.
  clusterIP: None
  selector:
    app: gitea-runner
  ports:
  - name: cache
    port: 8088
    targetPort: cache
{{- end }}
