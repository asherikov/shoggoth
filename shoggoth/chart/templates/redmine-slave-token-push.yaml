{{- /*
  templates/redmine-slave-token-push.yaml — PushSecret synchronizing
  the K8s ``Secret/redmine-slave-token`` *back* into OpenBao at
  ``redmine/slave-token``.

  Restores shoggoth/k3s/external-secrets/redmine-slave-token-push.yaml,
  which the chart migration dropped. Paired with
  ``redmine-slave-token.yaml``: the ``slave_token_init.rb`` post-deploy
  hook writes a fresh token into the K8s Secret, this PushSecret
  mirrors it to OpenBao. The corresponding ``ExternalSecret`` has
  ``creationPolicy: Orphan`` + ``refreshInterval: 0s`` so it does not
  race the script's write.

  Uses the write-scoped ``SecretStore/shoggoth-openbao-write``
  (``templates/secret-store-write.yaml``).

  Gated on ``secret-store-write``: the PushSecret itself requires the
  write SecretStore to be enabled.
*/}}
{{- if (include "shoggoth.isServiceEnabled" (list . "secret-store-write")) }}
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: redmine-slave-token
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shoggoth.labels" . | nindent 4 }}
    app.kubernetes.io/component: redmine-slave-token
spec:
  secretStoreRefs:
    - name: shoggoth-openbao-write
      kind: SecretStore
  selector:
    secret:
      name: redmine-slave-token
  data:
    - match:
        secretKey: token
        remoteRef:
          remoteKey: redmine/slave-token
          property: value
  refreshInterval: 5m
  updatePolicy: Replace
{{- end }}
