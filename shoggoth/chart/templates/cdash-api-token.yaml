{{- /*
  templates/cdash-api-token.yaml — ExternalSecret projecting the CDash
  API token into a K8s Secret.

  Consumers: web-internal.yaml, which proxies a webhook to cdash and
  reads the token via ``secretKeyRef``.

  ``creationPolicy: Orphan`` + ``refreshInterval: 0s``: the cdash
  container's ``init.sh`` is the authority on this Secret's value — it
  mints a fresh token and writes it to Secret/cdash-api-token through the
  Kubernetes API. ESO seeds the Secret once from OpenBao's bootstrap
  value and then stays out of the way: Orphan stops it overwriting the
  pod's write, and 0s stops it re-reading OpenBao on a timer and racing
  the next one. cdash-api-token-push.yaml carries the value the other
  way, pod -> OpenBao.

  Gated on ``cdash``: the only consumer.
*/}}
{{- if (include "shoggoth.isServiceEnabled" (list . "cdash")) }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cdash-api-token
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shoggoth.labels" . | nindent 4 }}
    app.kubernetes.io/component: cdash-api-token
spec:
  secretStoreRef:
    name: shoggoth-openbao
    kind: SecretStore
  target:
    name: cdash-api-token
    creationPolicy: Orphan
  data:
    - secretKey: token
      remoteRef:
        key: cdash/api-token
        property: value
  refreshInterval: 0s
{{- end }}
