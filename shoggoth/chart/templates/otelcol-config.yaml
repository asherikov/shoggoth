{{- /*
  templates/otelcol-config.yaml — the collector pipeline ConfigMap for otelcol.

  Split out of otelcol.yaml so the DaemonSet can checksum it with
  `include (print $.Template.BasePath "/otelcol-config.yaml") . | sha256sum`.
  A workload cannot checksum the file that defines it: `include` on the
  containing template re-enters it and the render recurses until Helm errors
  out. Both files must therefore carry the same service gate — see README
  "Chart template conventions".
*/}}
{{- if (include "shoggoth.isServiceEnabled" (list . "otelcol")) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: otelcol-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shoggoth.labels" . | nindent 4 }}
    app: otelcol
    app.kubernetes.io/component: otelcol
data:
  config.yaml: |
    receivers:
        otlp:
            protocols:
                grpc:
                    endpoint: 0.0.0.0:4317
                http:
                    endpoint: 0.0.0.0:4318

        kubelet_stats:
            collection_interval: 15s
            auth_type: serviceAccount
            endpoint: https://${env:NODE_IP}:10250
            insecure_skip_verify: true
            metrics:
                container.cpu.time:
                    enabled: true
                container.cpu.usage:
                    enabled: true
                container.uptime:
                    enabled: true
                container.memory.rss:
                    enabled: true
                container.memory.usage:
                    enabled: true
                container.memory.available:
                    enabled: true
                container.memory.working_set:
                    enabled: true
                k8s.pod.network.io:
                    enabled: true
                k8s.pod.cpu.usage:
                    enabled: true
                k8s.pod.memory.usage:
                    enabled: true

        k8s_cluster:
            collection_interval: 15s
            node_conditions_to_report:
                - Ready
                - MemoryPressure
                - DiskPressure
                - PIDPressure
                - NetworkUnavailable
            allocatable_types_to_report:
                - cpu
                - memory
                - pods

        host_metrics:
            root_path: /host
            collection_interval: 15s
            scrapers:
                cpu:
                load:
                memory:
                    metrics:
                        system.linux.memory.available:
                            enabled: true
                        system.memory.limit:
                            enabled: true
                disk:
                filesystem:
                    metrics:
                        system.filesystem.utilization:
                            enabled: true
                network:
                processes:

        file_log/k8s:
            include:
                - /var/log/pods/*/*/*.log
            include_file_path: true
            include_file_name: false
            start_at: end
            poll_interval: 200ms
            operators:
                - id: extract-metadata
                  type: regex_parser
                  regex: '^/var/log/pods/(?P<namespace>[^_]+)_(?P<pod>[^_]+)_(?P<uid>[a-f0-9\-]+)/(?P<container>[^/]+)/'
                  parse_from: attributes["log.file.path"]
                  if: 'attributes["log.file.path"] != nil'
                  on_error: send
                - id: set-pod-name
                  type: move
                  from: attributes.pod
                  to: resource["k8s.pod.name"]
                - id: set-namespace
                  type: move
                  from: attributes.namespace
                  to: resource["k8s.namespace.name"]
                - id: set-pod-uid
                  type: move
                  from: attributes.uid
                  to: resource["k8s.pod.uid"]
                - id: set-container-name
                  type: move
                  from: attributes.container
                  to: resource["k8s.container.name"]
                - id: container-parser
                  type: container

        prometheus:
            config:
                scrape_configs:
                    - job_name: otelcol
                      scrape_interval: 15s
                      static_configs:
                          - targets:
                                - otelcol:8888
                      metric_relabel_configs:
                          - source_labels: [job]
                            target_label: job_name
                            regex: "(.+)"
                    - job_name: litellm
                      scrape_interval: 15s
                      metrics_path: /metrics/
                      static_configs:
                          - targets:
                                - litellm:80
                      metric_relabel_configs:
                          - source_labels: [job]
                            target_label: job_name
                            regex: "(.+)"
                    - job_name: git-pages
                      scrape_interval: 15s
                      static_configs:
                          - targets:
                                - git-pages:9253
                      metric_relabel_configs:
                          - source_labels: [instance]
                            target_label: instance_name
                            regex: "(.+)"
                          - source_labels: [instance]
                            target_label: hostname
                            regex: "([^:]+):.*"
                          - source_labels: [job]
                            target_label: job_name
                            regex: "(.+)"
                    # headroom exposes /metrics in Prometheus format,
                    # but the upstream bind_policy enforces
                    # token-or-loopback on every non-loopback caller
                    # (see headroom/proxy/bind_policy.py). otelcol is
                    # a DaemonSet running in its own pods, so the
                    # token is required. The Secret is mounted from
                    # templates/headroom-proxy-token.yaml below;
                    # `bearer_token_file` keeps the token out of
                    # this ConfigMap. Headroom-side config
                    # (HEADROOM_TELEMETRY=on and HEADROOM_PROXY_TOKEN)
                    # lives in templates/headroom.yaml.
                    - job_name: headroom
                      scrape_interval: 15s
                      metrics_path: /metrics
                      bearer_token_file: /etc/otelcol-contrib/secrets/headroom-proxy-token/token
                      static_configs:
                          - targets:
                                - headroom:8787
                      metric_relabel_configs:
                          - source_labels: [instance]
                            target_label: hostname
                            regex: "([^:]+):.*"
                          - source_labels: [job]
                            target_label: job_name
                            regex: "(.+)"
                    # The inspektor gadget daemon (templates/gadget.yaml) is
                    # one DaemonSet in THIS release's namespace running one
                    # namespace-scoped top_tcp gadget instance, so this
                    # endpoint carries only this instance's series. What makes
                    # that true is the scope name: `otel-metrics-name` sets it
                    # to top-tcp-<namespace>, and the daemon watches only its
                    # own namespace's gadget-instance ConfigMaps
                    # (`gadget-namespace` in its config), so the other
                    # instance's daemon never discovers this instance's
                    # collector. The keep filter below is belt-and-braces on
                    # top of that — and the counterpart filter runs inside the
                    # eBPF program, so the other instance's sockets are never
                    # recorded in the first place.
                    #
                    # Series are sent_raw / received_raw gauges, and both are
                    # per-interval deltas — the gadget's map-iterator fetch
                    # drains the eBPF map on every map-fetch-interval. Sum
                    # sent_raw alone: an intra-namespace link appears once per
                    # socket direction, and summing sent_raw + received_raw
                    # would count it twice.
                    {{- if include "shoggoth.isServiceEnabled" (list . "gadget") }}
                    - job_name: inspektor
                      scrape_interval: 1s
                      static_configs:
                          - targets:
                                - gadget.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.gadget.metricsPort }}
                      metric_relabel_configs:
                          - source_labels: [otel_scope_name]
                            # Anchored, and the anchors are the point: a
                            # Prometheus relabelling regex is a FULL match
                            # against the whole label value, but `top-tcp-shoggoth`
                            # is a prefix of `top-tcp-shoggoth-test`, so the
                            # unanchored spelling would keep BOTH scopes. With
                            # one daemon per instance only this instance's
                            # scope is ever scraped, so the filter no longer
                            # carries the separation on its own — it is kept
                            # because it is the one thing that still holds if
                            # the topology ever goes back to a shared daemon.
                            # The scope name is the mapped name from
                            # `tcp:<name>` in the gadget instance's
                            # `otel-metrics-name` param, with the datasource
                            # prefix stripped
                            # (GetStringValuesPerDataSource, then Meter(mappedName)).
                            regex: "^top-tcp-{{ .Release.Namespace }}$"
                            action: keep
                          - source_labels: [job]
                            target_label: job_name
                            regex: "(.+)"
                    {{- end }}

    processors:
        memory_limiter:
            check_interval: 1s
            limit_percentage: 75
            spike_limit_percentage: 15
        resourcedetection:
            detectors: [env, system]
            timeout: 5s
            system:
                hostname_sources: [os]
        k8s_attributes:
            auth_type: serviceAccount
            pod_association:
                - sources:
                    - from: resource_attribute
                      name: k8s.pod.uid
                - sources:
                    - from: resource_attribute
                      name: k8s.pod.name
                    - from: resource_attribute
                      name: k8s.namespace.name
            extract:
                metadata:
                    - k8s.pod.name
                    - k8s.pod.uid
                    - k8s.pod.start_time
                    - k8s.deployment.name
                    - k8s.daemonset.name
                    - k8s.statefulset.name
                    - k8s.namespace.name
                    - k8s.node.name
                    - k8s.container.name
                labels:
                    - tag_name: service
                      key: app
                      from: pod
        transform/service:
            metric_statements:
                - context: resource
                  statements:
                      - set(attributes["service"], attributes["k8s.deployment.name"]) where attributes["service"] == nil and attributes["k8s.deployment.name"] != nil
                      - set(attributes["service"], attributes["k8s.daemonset.name"]) where attributes["service"] == nil and attributes["k8s.daemonset.name"] != nil
                      - set(attributes["service"], attributes["k8s.statefulset.name"]) where attributes["service"] == nil and attributes["k8s.statefulset.name"] != nil
                      - set(attributes["service"], attributes["k8s.pod.name"]) where attributes["service"] == nil and attributes["k8s.pod.name"] != nil
                      - replace_pattern(attributes["service"], "(?:-[a-z0-9]{5,}-[a-z0-9]{5,}|-[a-z0-9]{5}|-[0-9]+)$", "") where attributes["service"] != nil
            log_statements:
                - context: resource
                  statements:
                      - set(attributes["service"], attributes["k8s.deployment.name"]) where attributes["service"] == nil and attributes["k8s.deployment.name"] != nil
                      - set(attributes["service"], attributes["k8s.daemonset.name"]) where attributes["service"] == nil and attributes["k8s.daemonset.name"] != nil
                      - set(attributes["service"], attributes["k8s.statefulset.name"]) where attributes["service"] == nil and attributes["k8s.statefulset.name"] != nil
                      - set(attributes["service"], attributes["k8s.pod.name"]) where attributes["service"] == nil and attributes["k8s.pod.name"] != nil
                      - replace_pattern(attributes["service"], "(?:-[a-z0-9]{5,}-[a-z0-9]{5,}|-[a-z0-9]{5}|-[0-9]+)$", "") where attributes["service"] != nil
            trace_statements:
                - context: resource
                  statements:
                      - set(attributes["service"], attributes["k8s.deployment.name"]) where attributes["service"] == nil and attributes["k8s.deployment.name"] != nil
                      - set(attributes["service"], attributes["k8s.daemonset.name"]) where attributes["service"] == nil and attributes["k8s.daemonset.name"] != nil
                      - set(attributes["service"], attributes["k8s.statefulset.name"]) where attributes["service"] == nil and attributes["k8s.statefulset.name"] != nil
                      - set(attributes["service"], attributes["k8s.pod.name"]) where attributes["service"] == nil and attributes["k8s.pod.name"] != nil
                      - replace_pattern(attributes["service"], "(?:-[a-z0-9]{5,}-[a-z0-9]{5,}|-[a-z0-9]{5}|-[0-9]+)$", "") where attributes["service"] != nil
        batch:
            send_batch_size: 1024
            send_batch_max_size: 2048
            timeout: 10s

    exporters:
        prometheusremotewrite:
            endpoint: http://victoria-metrics:80/api/v1/write
            tls:
                insecure: true
            resource_to_telemetry_conversion:
                enabled: true
        otlp_http/tempo:
            endpoint: http://tempo:4318
            tls:
                insecure: true
        otlp_http/loki:
            endpoint: http://loki:3100/otlp
            tls:
                insecure: true

    service:
        telemetry:
            logs:
                level: warn
            metrics:
                level: detailed
                readers:
                    - pull:
                        exporter:
                            prometheus:
                                host: '0.0.0.0'
                                port: 8888
        pipelines:
            traces:
                receivers:
                    - otlp
                processors:
                    - memory_limiter
                    - k8s_attributes
                    - transform/service
                    - batch
                exporters:
                    - otlp_http/tempo
            logs:
                receivers:
                    - file_log/k8s
                    - otlp
                processors:
                    - memory_limiter
                    - resourcedetection
                    - k8s_attributes
                    - transform/service
                    - batch
                exporters:
                    - otlp_http/loki
            metrics:
                receivers:
                    - kubelet_stats
                    - k8s_cluster
                    - host_metrics
                    - otlp
                    - prometheus
                processors:
                    - memory_limiter
                    - k8s_attributes
                    - transform/service
                    - resourcedetection
                    - batch
                exporters:
                    - prometheusremotewrite
{{- end }}
