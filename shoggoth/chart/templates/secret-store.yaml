{{- /*
  templates/secret-store.yaml — read-scoped OpenBao SecretStore used by
  ExternalSecrets.

  Authenticates with a dedicated read-only token (shoggoth-eso-read policy:
  read on secret/data/*) minted by openbao-bootstrap Phase B.5 and stored at
  shoggoth-openbao-eso-read-token. The scoped policy is what keeps a K8s
  actor holding secrets/get from pivoting to sys/policies/acl/* and other
  admin paths, which an unscoped root token would allow.
*/}}
{{- if (include "shoggoth.isServiceEnabled" (list . "secret-store")) }}
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: shoggoth-openbao
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shoggoth.labels" . | nindent 4 }}
    app.kubernetes.io/component: secret-store
spec:
  provider:
    vault:
      server: http://openbao:80
      path: secret
      version: v2
      auth:
        tokenSecretRef:
          name: shoggoth-openbao-eso-read-token
          key: token
{{- end }}
