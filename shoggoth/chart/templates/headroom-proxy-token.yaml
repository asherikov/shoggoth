{{- /*
  templates/headroom-proxy-token.yaml — shared secret for scraping headroom's
  /metrics endpoint from otelcol.

  Token rotation: regenerate via `openssl rand -hex 32`, base64-encode (no wrap),
  and replace the data.token value below. Both consumers pick the new value up
  on the next pod restart.

  No `helm.sh/resource-policy: keep`, and nothing is lost by not having it:
  the value is a literal in this file, so the next install renders it again
  byte for byte — keeping the Secret across an uninstall preserved nothing
  that a re-render would not. (The "reinstall adopts it" argument does not
  apply either: a Secret that no longer exists is created, not adopted, so
  there is no ownership metadata to survive.)

  What the annotation DID change was the service toggle. Helm honours
  `keep` on the upgrade path too (pkg/kube/client.go skips the deletion of
  a resource that left the manifest when it carries the annotation), so
  `make stop SERVICE=headroom-proxy-token` left the Secret in place — a
  toggle that reported success and stopped nothing. Without the annotation
  the toggle really deletes it, and with it the consumers that mount it
  (otelcol, litellm, headroom) lose their Secret and cannot start. Which
  of those two is right depends on what the toggle is FOR: stopping the
  token alone cannot stop the services that need it.
*/}}
{{- if (include "shoggoth.isServiceEnabled" (list . "headroom-proxy-token")) }}
apiVersion: v1
kind: Secret
metadata:
  name: headroom-proxy-token
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shoggoth.labels" . | nindent 4 }}
    app.kubernetes.io/component: headroom-proxy-token
type: Opaque
data:
  # base64("3cb595958ee9985fa8670eadaf892042547c2931ef72d511cf4375b6039aca6c")
  token: M2NiNTk1OTU4ZWU5OTg1ZmE4NjcwZWFkYWY4OTIwNDI1NDdjMjkzMWVmNzJkNTExY2Y0Mzc1YjYwMzlhY2E2Yw==
{{- end }}
