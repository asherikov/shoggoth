{{- /*
  templates/redmine-db-password.yaml — ExternalSecret projecting the
  Redmine PostgreSQL user password into a K8s Secret.

  Restores shoggoth/k3s/external-secrets/redmine-db-password.yaml,
  which the chart migration dropped. openbao-bootstrap Phase B seeds
  ``redmine/db-password`` with a random value on a fresh install, so
  this only has to project it. The ``redmine-db`` sub-deployment sets
  ``POSTGRES_PASSWORD`` from the resulting Secret, and redmine.yaml
  reads the same Secret as the application database password.

  Gated on ``redmine-db``: matches the legacy ApplyConfiguration so
  ``make stop SERVICE=redmine-db`` cleanly retires the credential
  along with the database pod.
*/}}
{{- if (include "shoggoth.isServiceEnabled" (list . "redmine-db")) }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: redmine-db-password
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shoggoth.labels" . | nindent 4 }}
    app.kubernetes.io/component: redmine-db-password
spec:
  secretStoreRef:
    name: shoggoth-openbao
    kind: SecretStore
  target:
    name: redmine-db-password
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: redmine/db-password
        property: value
  refreshInterval: 5m
{{- end }}
