{{- /*
  templates/litellm.yaml — LiteLLM proxy + its rendered-config pipeline.

  The `litellm-templates` ConfigMap ships the *template* form of config.yaml.
  `${OLLAMA_CLOUD_TOKEN}` and `${GITEA_SLAVE_TOKEN}` stay literal:
  make/k3s.mk restricts envsubst to the $ENV_VARS whitelist, so those two
  are expanded at *pod* runtime by the render-config initContainer
  (templates/render-config.yaml) instead. Only the SHOGGOTH_AI_DEFAULT_* vars
  are deploy-time substitutions, so they become .Values.ai.*.
*/}}
{{- if (include "shoggoth.isServiceEnabled" (list . "litellm")) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: litellm-data
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shoggoth.labels" . | nindent 4 }}
    app: litellm
    app.kubernetes.io/component: litellm
  annotations:
    # Kept across `helm uninstall` so `make down` stops workloads but
    # preserves data. Reinstall adopts it: shoggoth.labels survives
    # uninstall, so Helm's ownership check still passes.
    helm.sh/resource-policy: keep
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: local-path
---
apiVersion: v1
kind: Service
metadata:
  name: litellm
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shoggoth.labels" . | nindent 4 }}
    app: litellm
    app.kubernetes.io/component: litellm
spec:
  selector:
    app: litellm
  ports:
  - name: http
    port: 80
    targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shoggoth.labels" . | nindent 4 }}
    app: litellm
    app.kubernetes.io/component: litellm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: litellm
  template:
    metadata:
      labels:
        {{- include "shoggoth.selectorLabels" . | nindent 8 }}
        app: litellm
        app.kubernetes.io/component: litellm
      annotations:
        secret.reloader.stakater.com/reload: gitea-slave-token,ai-default-token
    spec:
      {{- include "shoggoth.podDnsConfig" . | nindent 6 }}
      initContainers:
      - name: render-config
        image: asherikov/shoggoth_tools:alpine
        imagePullPolicy: IfNotPresent
        env:
        - name: OLLAMA_CLOUD_TOKEN
          valueFrom:
            secretKeyRef:
              name: ai-default-token
              key: token
        - name: GITEA_SLAVE_TOKEN
          valueFrom:
            secretKeyRef:
              name: gitea-slave-token
              key: token
        - name: RENDER_VARS
          value: ${OLLAMA_CLOUD_TOKEN}${GITEA_SLAVE_TOKEN}
        command:
        - bash
        - -c
        - exec /tmpl/render.sh
        resources:
          requests:
            memory: 32Mi
            cpu: 50m
          limits:
            memory: 64Mi
            cpu: 200m
        volumeMounts:
        - name: templates
          mountPath: /templates
          readOnly: true
        - name: rendered-config
          mountPath: /rendered
        - name: render-script
          mountPath: /tmpl
          readOnly: true
      - name: wait-bootstrap
        image: asherikov/shoggoth_tools:alpine
        imagePullPolicy: IfNotPresent
        command:
        - bash
        - -c
        args:
        - |
          set -euo pipefail
          NS="{{ .Release.Namespace }}"
          # The K8s Secrets this pod needs (ai-default-token,
          # gitea-slave-token) are mounted natively — the render-config
          # init container resolves both through secretKeyRef, so the
          # kubelet holds that container until they exist. Only the
          # headroom Service readiness below has no native equivalent,
          # so it is the only thing left to poll for.
          # Block until the headroom Service has at least one
          # ready endpoint subset (i.e. the headroom pod's
          # readinessProbe is passing). Without this the
          # litellm pod would race headroom's cold start and
          # the first 1-2 minutes of pre_call guardrail calls
          # would fail (the proxy is busy downloading
          # Kompress-v2-base + the ONNX runtime on a fresh
          # PVC). Budget: 5 minutes — on a brand-new cluster
          # the Service object appears within seconds; the
          # 5-minute ceiling covers a slow image pull.
          wait_for_service_endpoints() {
                      local svc="$1"
                      local budget_seconds="${2:-300}"
                      local step_seconds=5
                      echo "wait-bootstrap: waiting for service/${svc} ready endpoints in namespace ${NS}..."
                      for i in $(seq 1 $((budget_seconds / step_seconds))); do
                        if ! kubectl get service "${svc}" -n "${NS}" -o name >/dev/null 2>&1; then
                          sleep "${step_seconds}"
                          continue
                        fi
                        if kubectl get endpoints "${svc}" -n "${NS}" -o json 2>/dev/null \
                            | jq -e '.subsets // [] | map(.addresses // []) | add // [] | length > 0' >/dev/null; then
                          echo "wait-bootstrap: service/${svc} has ready endpoints (after $((i*step_seconds))s)"
                          return 0
                        fi
                        sleep "${step_seconds}"
                      done
                      echo "FAIL: service/${svc} has no ready endpoints after ${budget_seconds}s"
                      echo "      Diagnostics:"
                      kubectl -n "${NS}" get svc "${svc}" -o yaml 2>&1 | sed 's/^/      svc: /' | head -40
                      kubectl -n "${NS}" get endpoints "${svc}" -o yaml 2>&1 | sed 's/^/      ep:  /' | head -40
                      kubectl -n "${NS}" get pods -l app="${svc}" -o wide 2>&1 | sed 's/^/      pod: /' | head -10
                      return 1
                    }
          wait_for_service_endpoints headroom 300 || exit 1
          echo "wait-bootstrap: headroom reachable"

        resources:
          requests:
            memory: 32Mi
            cpu: 50m
          limits:
            memory: 64Mi
            cpu: 200m
        volumeMounts: []
      containers:
      - name: litellm
        image: ghcr.io/berriai/litellm:v1.102.0
        imagePullPolicy: IfNotPresent
        args:
        - --config
        - /shoggoth/litellm/config.yaml
        - --port
        - '80'
        env:
        - name: OTEL_SERVICE_NAME
          value: litellm
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://otelcol:4318
        - name: OTEL_EXPORTER_OTLP_PROTOCOL
          value: http/protobuf
        - name: OTEL_TRACES_EXPORTER
          value: otlp
        - name: SHOGGOTH_DOMAIN
          value: {{ .Values.identity.domain }}
        # Headroom guardrail endpoint. Mirrors the `api_base` value
        # in the guardrails section of the rendered config.yaml so
        # the URL is also visible from `kubectl exec ... env`
        # without grepping the rendered file. The headroom guardrail
        # implementation reads `api_base` from the YAML; the env
        # var is only the documented fallback for the same field.
        - name: HEADROOM_API_BASE
          value: http://headroom:8787
        # Bearer token for the headroom guardrail. The litellm
        # headroom guardrail
        # (litellm/proxy/guardrails/guardrail_hooks/headroom/headroom.py)
        # reads `api_key` from litellm_params and falls back to this
        # env var, then sets `Authorization: Bearer <key>` on every
        # /v1/compress request. Without this the headroom proxy's
        # bind_policy rejects the call with 401 and the guardrail
        # surfaces as a 502 to the LLM caller
        # ("Headroom compression service returned an error").
        # Same Secret as the otelcol bearer_token_file scrape —
        # defined in templates/headroom-proxy-token.yaml.
        - name: HEADROOM_API_KEY
          valueFrom:
            secretKeyRef:
              name: headroom-proxy-token
              key: token
        volumeMounts:
        - name: rendered-config
          mountPath: /shoggoth/litellm
          readOnly: true
        - name: data
          mountPath: /app/litellm
        ports:
        - containerPort: 80
          name: http
        resources:
          requests:
            memory: 512Mi
            cpu: 200m
          limits:
            memory: 2Gi
            cpu: 1000m
        readinessProbe:
          httpGet:
            path: /health/liveliness
            port: 80
          initialDelaySeconds: 15
          periodSeconds: 10
          failureThreshold: 30
        livenessProbe:
          httpGet:
            path: /health/liveliness
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 30
          failureThreshold: 6
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: litellm-data
      - name: templates
        configMap:
          name: litellm-templates
      - name: render-script
        configMap:
          name: shoggoth-render-config
          defaultMode: 493
      - name: rendered-config
        emptyDir: {}
      serviceAccountName: litellm
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: litellm
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shoggoth.labels" . | nindent 4 }}
    app: litellm
    app.kubernetes.io/component: litellm
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: litellm-bootstrap-wait
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shoggoth.labels" . | nindent 4 }}
    app: litellm
    app.kubernetes.io/component: litellm
rules:
# No `secrets` rule and no `externalsecrets` rule: the wait loop used to
# poll the ExternalSecret CRs (`kubectl get externalsecret <name>` →
# their Ready condition) before the headroom poll. Those two secrets
# (ai-default-token, gitea-slave-token) are now resolved by the kubelet
# itself — render-config declares non-optional `secretKeyRef`s, so the
# kubelet refuses to start that init container until the Secrets and
# their keys exist, with no API read and therefore no RBAC needed.
# `wait_for_service_endpoints` (see the wait-bootstrap init container
# in this Deployment) polls `kubectl get services/endpoints` to block
# the main litellm container until the headroom Service has at least
# one ready endpoint subset. The pods `list` is used only by the same
# function's diagnostic dump on the failure path
# (`kubectl get pods -l app=${svc}`) — leaving it in place keeps the
# diagnostic useful when readiness genuinely fails. Scope is
# namespace-local (Role, not ClusterRole) and read-only.
- apiGroups:
  - ''
  resources:
  - services
  verbs:
  - get
- apiGroups:
  - ''
  resources:
  - endpoints
  verbs:
  - get
- apiGroups:
  - ''
  resources:
  - pods
  verbs:
  - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: litellm-bootstrap-wait
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shoggoth.labels" . | nindent 4 }}
    app: litellm
    app.kubernetes.io/component: litellm
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: litellm-bootstrap-wait
subjects:
- kind: ServiceAccount
  name: litellm
  namespace: {{ .Release.Namespace }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-templates
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shoggoth.labels" . | nindent 4 }}
    app: litellm
    app.kubernetes.io/component: litellm
data:
  config.yaml: |
    model_list:
        - model_name: nomic-embed-text
          litellm_params:
              model: "openai/nomic-embed-text-v1.5"
              api_base: http://localai:80/v1
              api_key: "localai"
        - model_name: "localai/*"
          litellm_params:
              model: "openai/*"
              api_base: http://localai:80/v1
              api_key: "localai"
          model_info:
              supports_function_calling: true
        - model_name: "shoggoth-default"
          litellm_params:
              model: "{{ .Values.ai.defaultModel }}"
              api_base: {{ .Values.ai.defaultApi }}
              api_key: "${OLLAMA_CLOUD_TOKEN}"
          model_info:
              supports_function_calling: true
        - model_name: "*"
          litellm_params:
              model: "openai/*"
              api_base: {{ .Values.ai.defaultApi }}
              api_key: "${OLLAMA_CLOUD_TOKEN}"
          model_info:
              supports_function_calling: true
    litellm_settings:
        callbacks:
            - prometheus
            - otel
        drop_params: true
    general_settings:
        store_model_in_db: true
    # Headroom compression guardrail. Compresses tool output, logs, and
    # RAG chunks in `pre_call` before the request is forwarded to the
    # upstream model. The proxy is deployed in templates/headroom.yaml
    # and reached in-cluster at http://headroom:8787.
    #
    # default_on: true — every virtual key and every request goes
    # through headroom unless the caller passes `x-headroom-bypass: true`.
    # Was false (LiteLLM's recommended opt-in posture) so an
    # accidentally-enrolled key couldn't get tripped up by a content
    # type headroom refuses; flipped to true so the savings show up
    # on the shoggoth_ai Grafana dashboard without per-key wiring. To
    # exclude a single caller, send `x-headroom-bypass: true`. To
    # exclude specific keys, regenerate via `POST /key/generate` with
    # `"guardrails": []`. Per upstream behaviour:
    #   - Anthropic `cache_control` messages: NEVER compressed
    #     (CacheAligner refuses; preserve prompt-cache byte matching)
    #   - `user`/`system` messages: not compressed by default; opt in
    #     with `HEADROOM_COMPRESS_USER_MESSAGES=1` on the headroom pod
    #   - responses: never (pre_call hook only)
    guardrails:
        - guardrail_name: headroom-compression
          litellm_params:
              guardrail: headroom
              mode: pre_call
              api_base: http://headroom:8787
              default_on: true
    mcp_servers:
        mcp_gitea:
            url: "http://mcp-gitea:80/mcp"
            transport: "http"
            description: "Gitea MCP server"
            auth_type: "bearer_token"
            auth_value: "${GITEA_SLAVE_TOKEN}"
            allow_all_keys: true
        basic_memory:
            url: "http://basic-memory:80/mcp"
            transport: "http"
            description: "Basic Memory MCP server"
            allow_all_keys: true
{{- end }}
