{{- /*
  templates/external-secrets.yaml — External Secrets Operator (ESO) install.

  Bundles the upstream `external-secrets` chart's contents as flat manifests:
  3 ServiceAccounts, 4 ClusterRoles + 4 ClusterRoleBindings, a namespace-scoped
  Role/RoleBinding for leader election, the empty webhook-cert Secret, the
  webhook Service, and 3 Deployments (cert-controller, controller, webhook).

  THE RELEASE NAMESPACE — owned by the chart as an OBJECT, but not created by
  it. `make up` creates the namespace with kubectl before it calls Helm, and
  the chart declares it in templates/namespace.yaml so its labels and
  annotations are chart-owned. The namespace has to exist before the helm
  call either way: Helm stores the release record — a Secret — in the
  release namespace before it applies any manifest. The `--create-namespace`
  flag on the helm command line is a no-op safety net here (the namespace is
  already there when helm runs) and is NOT what creates it: with that flag
  alone Helm would create the namespace after its install-time ownership
  check and then POST the chart's Namespace object into the namespace it
  just created — `namespaces "shoggoth" already exists`.

  What makes `make down` (= `helm uninstall`) safe is that Namespace object
  carrying `helm.sh/resource-policy: keep`, so Helm skips it: deleting the
  namespace would cascade to every PVC and Secret in it, which is exactly
  the data `make down` is required to preserve. Parity runs for this service
  pass `--ignore-resource Namespace:<ns>`.

  Toggleable as `make start|stop SERVICE=external-secrets` (the values key
  is `services.external-secrets.enabled`). The workload selectors are
  `app.kubernetes.io/name` + `part-of: external-secrets`, not `app:`, so any
  post-toggle `kubectl get` / `kubectl wait` needs `-l app.kubernetes.io/name=external-secrets`
  instead.

  Note the labels here are deliberately NOT the shoggoth.labels helper output:
  the upstream selector is `app.kubernetes.io/name` + `part-of: external-secrets`,
  and changing it would break `spec.selector` on the three Deployments (which
  is immutable in Kubernetes). shoggoth.labels is therefore not used anywhere
  in this template.

  Note on cluster-scoped names: the 4 ClusterRoles and 4 ClusterRoleBindings
  here are named `{{ include "shoggoth.fullname" . }}-<base>`, NOT bare
  `<base>`. A cluster-scoped object has no namespace to separate two shoggoth
  instances on one cluster, so a bare name would make both instances render
  the SAME ClusterRole. `make up` passes `--take-ownership`, so the second
  install silently re-labels the first instance's ClusterRole to its own
  release and rewrites the ClusterRoleBinding's `subjects` list —
  `rbac/v1.Subjects` is an atomic list with no merge key, so the first
  instance's ServiceAccount is dropped from it and its operator loses access
  to the SecretStores it manages. Bindings are renamed alongside their
  ClusterRole because `ClusterRoleBinding.roleRef` is immutable server-side.

  The 8 cluster-scoped objects here carry only the upstream selector
  labels (`app.kubernetes.io/name` + `part-of`) plus
  `app.kubernetes.io/instance: {{ .Release.Name }}`. That instance label
  is what lets `make purge` select exactly one instance's cluster-scoped
  RBAC for deletion — a cluster-scoped object is not garbage-collected
  with its namespace, so leaving them behind would leak them.
*/}}
{{- if (include "shoggoth.isServiceEnabled" (list . "external-secrets")) }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets-cert-controller
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: external-secrets-cert-controller
    app.kubernetes.io/part-of: external-secrets
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: external-secrets
    app.kubernetes.io/part-of: external-secrets
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets-webhook
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: external-secrets-webhook
    app.kubernetes.io/part-of: external-secrets
---
# Init containers in the cert-controller and webhook Deployments share each
# Pod's serviceAccountName (K8s does not allow per-container SAs). The upgrade
# cleanup runs under the cert-controller SA, and the VWC register runs under
# the webhook SA. The ClusterRoles below grant the additional verbs each
# needs, scoped to ESO resources only.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "shoggoth.fullname" . }}-external-secrets-cert-controller-upgrade
  labels:
    app.kubernetes.io/name: external-secrets
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: external-secrets
rules:
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    resourceNames:
      - "clusterexternalsecrets.external-secrets.io"
      - "clusterpushsecrets.external-secrets.io"
      - "clustersecretstores.external-secrets.io"
      - "externalsecrets.external-secrets.io"
      - "pushsecrets.external-secrets.io"
      - "secretstores.external-secrets.io"
      - "acraccesstokens.generators.external-secrets.io"
      - "beyondtrustworkloadcredentialsdynamicsecrets.generators.external-secrets.io"
      - "cloudsmithaccesstokens.generators.external-secrets.io"
      - "clustergenerators.generators.external-secrets.io"
      - "ecrauthorizationtokens.generators.external-secrets.io"
      - "fakes.generators.external-secrets.io"
      - "gcraccesstokens.generators.external-secrets.io"
      - "generatorstates.generators.external-secrets.io"
      - "githubaccesstokens.generators.external-secrets.io"
      - "gitlabdeploytokens.generators.external-secrets.io"
      - "grafanas.generators.external-secrets.io"
      - "mfas.generators.external-secrets.io"
      - "passwords.generators.external-secrets.io"
      - "quayaccesstokens.generators.external-secrets.io"
      - "sshkeys.generators.external-secrets.io"
      - "stssessiontokens.generators.external-secrets.io"
      - "uuids.generators.external-secrets.io"
      - "vaultdynamicsecrets.generators.external-secrets.io"
      - "webhooks.generators.external-secrets.io"
    verbs: ["get", "list", "delete", "patch"]
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: ["validatingwebhookconfigurations"]
    resourceNames:
      - "secretstore-validate"
      - "externalsecret-validate"
    verbs: ["get", "list", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames:
      - "external-secrets"
      - "external-secrets-webhook"
      - "external-secrets-cert-controller"
    verbs: ["get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "shoggoth.fullname" . }}-external-secrets-cert-controller-upgrade
  labels:
    app.kubernetes.io/name: external-secrets
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: external-secrets
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "shoggoth.fullname" . }}-external-secrets-cert-controller-upgrade
subjects:
  - kind: ServiceAccount
    name: external-secrets-cert-controller
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "shoggoth.fullname" . }}-external-secrets-webhook-vwc-register
  labels:
    app.kubernetes.io/name: external-secrets
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: external-secrets
rules:
  # create: NO `resourceNames` restriction. Per K8s RBAC design
  # (kubernetes/kubernetes#80295, docs/reference/access-authn-authz/rbac),
  # `resourceNames` is IGNORED for the `create` verb because the object
  # name is not part of the authorization path — the SAR for create
  # is evaluated without a name, so a name-restricted rule never matches.
  # The webhook SA only runs in the register-vwc init container of the
  # external-secrets-webhook Deployment, so the broader create scope is
  # acceptable.
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: ["validatingwebhookconfigurations"]
    verbs: ["create"]
  # get: scoped to the two named VWCs we own.
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: ["validatingwebhookconfigurations"]
    resourceNames:
      - "secretstore-validate"
      - "externalsecret-validate"
    verbs: ["get"]
  # patch/update: the same two names, and for the same reason. `kubectl apply`
  # on an object that already exists computes a diff and issues a PATCH rather
  # than a CREATE. The VWCs are created by this init container and not by Helm,
  # so they are already present on every Pod start after the first — without
  # this rule `set -eu` aborts on a 403, the webhook Deployment
  # CrashLoopBackOffs, and the webhook Service loses its endpoints, taking ESO
  # admission validation down cluster-wide. `resourceNames` is honoured for
  # patch/update (only `create` ignores it, per the note above).
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: ["validatingwebhookconfigurations"]
    resourceNames:
      - "secretstore-validate"
      - "externalsecret-validate"
    verbs: ["patch", "update"]
  - apiGroups: [""]
    resources: ["endpoints", "pods", "services"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "shoggoth.fullname" . }}-external-secrets-webhook-vwc-register
  labels:
    app.kubernetes.io/name: external-secrets
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: external-secrets
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "shoggoth.fullname" . }}-external-secrets-webhook-vwc-register
subjects:
  - kind: ServiceAccount
    name: external-secrets-webhook
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "shoggoth.fullname" . }}-external-secrets-cert-controller
  labels:
    app.kubernetes.io/name: external-secrets
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: external-secrets
rules:
  - apiGroups: ["apiextensions.k8s.io"]
