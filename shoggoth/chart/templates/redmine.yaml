{{- /*
  templates/redmine.yaml — Redmine (Rails) + its PostgreSQL backend.

  Emits two literal `app:` labels, `redmine` (the web Deployment) and
  `redmine-db` (the PostgreSQL StatefulSet), on top of the standard set from
  `shoggoth.labels` — the convention that helper preserves from the k3s
  manifests, so a per-service selector (`kubectl get pods -l app=redmine`)
  keeps working. The whole file is gated on `services.redmine.enabled`; the
  redmine-db Service, StatefulSet and ServiceAccount each carry their own
  `services.redmine-db.enabled` guard, so either workload can be toggled on
  its own.

  The redmine-db `app:` label sits on the pods and nowhere else: that label is
  what gives a workload its `Application:` box in the applications view
  (make/clusterviz-views.yaml), and the database is plumbing that view
  hides — it keeps its place in the cluster view. The Service and StatefulSet
  selectors read the pod template labels, not the controller's own metadata,
  so dropping the label from the three metadata blocks moves nothing
  functional, and the pods stay selectable by `kubectl get pods -l
  app=redmine-db`.

  Secrets arrive via ExternalSecrets, never inline, and the pods depend on
  them natively — no init container waits for them (README, "Secret
  dependencies are native"):

    redmine-db-password         secret volume + REDMINE_DB_PASSWORD_FILE
    redmine-secret-key-base     secret volume + REDMINE_SECRET_KEY_BASE_FILE
    openldap-ldapauth-password  secretKeyRef -> LDAP_BIND_PASSWORD
    openldap-admin-password     secretKeyRef -> SHOGGOTH_ADMIN_PASSWORD

  The two `*_FILE` variables are resolved by the image's own entrypoint
  (`file_env`), which reads the mounted file before it execs `rails server`.
  The volumes pin the key with a `subPath`, so the kubelet holds the pod in
  `ContainerCreating` until the Secret exists. redmine-db consumes the same
  password through `POSTGRES_PASSWORD_FILE`.

  The LDAP auth-source configuration, the admin-password seeding and the
  slave-token minting run in a `postStart` hook (`/shoggoth/redmine/init.sh`
  from the `redmine-init` ConfigMap), not in an init container. That hook
  reads the mounted secret file itself rather than relying on an inherited
  `SECRET_KEY_BASE`, so the `secret-key-base` volume has to be mounted for
  the hook as well as for the image entrypoint.

  A third key in that same ConfigMap, `sso_suite_zeitwerk.rb`, is not run by
  that hook and is not mounted where it ends up either: a `redmine-zeitwerk-fix`
  initContainer copies it into a writable emptyDir and the app container mounts
  it from there at `config/initializers/`, because it has to exist before the
  boot it repairs and the image's entrypoint chowns `config/` before it execs
  rails. The key's own comment and the initContainer's give the mechanism in
  full; the short form is that the `plugins` volume is mounted unconditionally,
  so the vendored `redmine_sso_suite` plugin is always present and always eager
  loaded, and the workaround therefore cannot be gated on anything.

  ${SHOGGOTH_ADMIN_PASSWORD}, ${SECRET_KEY_BASE}, ${REDMINE_SECRET_KEY_BASE_FILE},
  ${LDAP_BIND_DN}, ${LDAP_BIND_PASSWORD}, ${LDAP_HOST} and the bare shell vars
  are resolved at pod start by those scripts — they stay literal here, because
  nothing expands them on the way through Helm.
*/}}
{{- if (include "shoggoth.isServiceEnabled" (list . "redmine")) }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redmine-db
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shoggoth.labels" . | nindent 4 }}
    app: redmine
    app.kubernetes.io/component: redmine
    shoggoth.io/group: workflow
    shoggoth.io/exposure: internal
  annotations:
    # Kept across `helm uninstall` so uninstalling stops the workloads but
    # preserves data. Reinstall adopts it: shoggoth.labels survives
    # uninstall, so Helm's ownership check still passes.
    helm.sh/resource-policy: keep
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: local-path
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redmine-files
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shoggoth.labels" . | nindent 4 }}
    app: redmine
    app.kubernetes.io/component: redmine
    shoggoth.io/group: workflow
    shoggoth.io/exposure: internal
  annotations:
    # Kept across `helm uninstall` so uninstalling stops the workloads but
    # preserves data. Reinstall adopts it: shoggoth.labels survives
    # uninstall, so Helm's ownership check still passes.
    helm.sh/resource-policy: keep
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: local-path
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redmine-bundle-cache
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shoggoth.labels" . | nindent 4 }}
    app: redmine
    app.kubernetes.io/component: redmine
    shoggoth.io/group: workflow
    shoggoth.io/exposure: internal
  annotations:
    # Kept across `helm uninstall` so uninstalling stops the workloads but
    # preserves data. Reinstall adopts it: shoggoth.labels survives
    # uninstall, so Helm's ownership check still passes.
    helm.sh/resource-policy: keep
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
  storageClassName: local-path
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: redmine-init
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shoggoth.labels" . | nindent 4 }}
    app: redmine
    app.kubernetes.io/component: redmine
    shoggoth.io/group: workflow
    shoggoth.io/exposure: internal
data:
  init.sh: |
    #!/bin/sh
    set -eu
    if [ -n "${REDMINE_SECRET_KEY_BASE_FILE:-}" ] && [ -z "${SECRET_KEY_BASE:-}" ]; then
        export SECRET_KEY_BASE="$(cat "${REDMINE_SECRET_KEY_BASE_FILE}")"
    fi
    echo "shoggoth: Waiting for Redmine to be ready..."
    for i in $(seq 1 30); do
        if bundle exec rails runner 'puts "ready"' > /dev/null 2>&1; then
            break
        fi
        sleep 2
    done
    if ! READY_CHECK="$(bundle exec rails runner 'puts "ready"' 2>&1)"; then
        echo "shoggoth: FATAL: Redmine not ready after 60s: ${READY_CHECK}" >&2
        exit 1
    fi
    echo "shoggoth: Redmine is ready for LDAP configuration"
    echo "shoggoth: Configuring LDAP auth source"
    for VAR in LDAP_HOST LDAP_BIND_DN LDAP_BIND_PASSWORD LDAP_BASE_DN; do
        if [ -z "$(eval "echo \"\${${VAR}:-}\"")" ]; then
            echo "shoggoth: ERROR: ${VAR} not set" >&2
            exit 1
        fi
    done
    LDAP_HOST="${LDAP_HOST}" LDAP_BIND_DN="${LDAP_BIND_DN}" LDAP_BIND_PASSWORD="${LDAP_BIND_PASSWORD}" LDAP_BASE_DN="{{ include "shoggoth.ldapBaseDn" . }}" \
        bundle exec rails runner '
        auth = AuthSourceLdap.find_or_initialize_by(name: "openldap")
        auth.host = ENV["LDAP_HOST"]
        auth.port = 389
        auth.account = ENV["LDAP_BIND_DN"]
        auth.account_password = ENV["LDAP_BIND_PASSWORD"]
        auth.base_dn = ENV["LDAP_BASE_DN"]
        auth.attr_login = "uid"
        auth.attr_firstname = "cn"
        auth.attr_lastname = "sn"
        auth.attr_mail = "mail"
        auth.onthefly_register = true
        auth.tls = false
        auth.save!
    ' && echo "shoggoth: === redmine ldap init complete ===" \
        || { echo "shoggoth: FATAL: LDAP auth source configuration failed" >&2; exit 1; }
    echo "shoggoth: Setting local admin password"
    if [ -z "${SHOGGOTH_ADMIN_PASSWORD:-}" ]; then
        echo "shoggoth: ERROR: SHOGGOTH_ADMIN_PASSWORD not set" >&2
        exit 1
    fi
    RESULT="$(SHOGGOTH_ADMIN_PASSWORD="${SHOGGOTH_ADMIN_PASSWORD}" bundle exec rails runner '
        user = User.find_by_login("admin")
        if user
          user.password = ENV["SHOGGOTH_ADMIN_PASSWORD"]
          user.password_confirmation = ENV["SHOGGOTH_ADMIN_PASSWORD"]
          user.must_change_passwd = false
          user.save!
          puts "updated"
        else
          puts "not_found"
        end
    ')" || { echo "shoggoth: ERROR: admin password update failed" >&2; exit 1; }
    case "${RESULT}" in
        updated)    echo "shoggoth: admin password updated" ;;
        not_found)  echo "shoggoth: admin user not found, skipping password update" ;;
    esac
    echo "shoggoth: Ensuring slave user and api_key"
    SLAVE_KEY="$(bundle exec rails runner /shoggoth/redmine/slave_token_init.rb)" || { echo "shoggoth: ERROR: slave api_key init failed" >&2; exit 1; }
    if [ -z "${SLAVE_KEY}" ]; then
        echo "shoggoth: ERROR: slave token empty; cannot mark ready" >&2
        exit 1
    fi
    echo "shoggoth: slave api_key stored in K8s Secret redmine-slave-token (len=${#SLAVE_KEY})"
    echo "shoggoth: Marking token init as ready"
    touch /tmp/slave-token-ready
    echo "shoggoth: Syncing slave project memberships"
    bundle exec rails runner '
        User.current = User.find_by_login("admin")
        slave = User.find_by_login("slave")
        developer_role = Role.find_by(name: "Developer")
        if slave && developer_role
            added = 0
            Project.where(status: Project::STATUS_ACTIVE).each do |project|
                unless Member.exists?(project_id: project.id, user_id: slave.id)
                    Member.create!(project_id: project.id, user_id: slave.id, role_ids: [developer_role.id])
                    added += 1
                end
            end
            puts "added=#{added} total=#{Project.where(status: Project::STATUS_ACTIVE).count}"
        else
            puts "skipped"
        end
    ' && echo "shoggoth: === redmine slave init complete ===" \
        || echo "shoggoth: WARNING: membership sync failed"

  slave_token_init.rb: |
    require 'net/http'
    require 'uri'
    require 'json'
    require 'base64'
    require 'openssl'
    User.current = User.find_by_login("admin")
    ldap_auth = AuthSourceLdap.find_by(name: "openldap")
    slave = User.find_by_login("slave")
    if slave.nil? && ldap_auth
        slave = User.new
        slave.login = "slave"
        slave.firstname = "Slave"
        slave.lastname = "User"
        slave.mail = "slave@localhost"
        slave.auth_source = ldap_auth
        slave.language = "en"
        slave.must_change_passwd = false
        slave.save!
    end
    if slave.nil?
        STDERR.puts "slave user unavailable"
        exit 1
    end
    namespace = ENV['SHOGGOTH_NAMESPACE'].to_s
    if namespace.empty?
        STDERR.puts "SHOGGOTH_NAMESPACE not set"
        exit 1
    end
    secret_name = 'redmine-slave-token'
    sa_token_path = '/var/run/secrets/kubernetes.io/serviceaccount/token'
    ca_cert_path = '/var/run/secrets/kubernetes.io/serviceaccount/ca.crt'
    api_host = ENV['KUBERNETES_SERVICE_HOST'].to_s
    api_port = ENV['KUBERNETES_SERVICE_PORT'].to_s
    if api_host.empty? || api_port.empty?
        STDERR.puts "KUBERNETES_SERVICE_HOST or KUBERNETES_SERVICE_PORT not set"
        exit 1
    end
    unless File.exist?(sa_token_path)
        STDERR.puts "service account token not mounted at #{sa_token_path}"
        exit 1
    end
    unless File.exist?(ca_cert_path)
        STDERR.puts "CA certificate not mounted at #{ca_cert_path}"
        exit 1
    end
    sa_token = File.read(sa_token_path).strip
    http = Net::HTTP.new(api_host, api_port.to_i)
    http.use_ssl = true
    http.ca_file = ca_cert_path
    http.verify_mode = OpenSSL::SSL::VERIFY_PEER
    http.open_timeout = 10
    http.read_timeout = 15
    def k8s_url_for(http, namespace, secret_name)
        base = http.address.to_s
        port = http.port
        ns_enc = URI.encode_www_form_component(namespace)
        sn_enc = URI.encode_www_form_component(secret_name)
        URI("https://#{base}:#{port}/api/v1/namespaces/#{ns_enc}/secrets/#{sn_enc}")
    end
    def k8s_post_url_for(http, namespace)
        base = http.address.to_s
        port = http.port
        ns_enc = URI.encode_www_form_component(namespace)
        URI("https://#{base}:#{port}/api/v1/namespaces/#{ns_enc}/secrets")
    end
    get_url = k8s_url_for(http, namespace, secret_name)
    get_req = Net::HTTP::Get.new(get_url.request_uri)
    get_req['Authorization'] = "Bearer #{sa_token}"
    get_req['Accept'] = 'application/json'
    begin
        get_res = http.request(get_req)
    rescue => e
        STDERR.puts "K8s GET secret exception: #{e.class}: #{e.message}"
        exit 1
    end
    case get_res
    when Net::HTTPSuccess
        body = JSON.parse(get_res.body) rescue {}
        token_b64 = body['data'] && body['data']['token']
        if token_b64 && !token_b64.empty?
            print Base64.decode64(token_b64)
            exit 0
        end
    when Net::HTTPNotFound
        # fall through to create
    else
        STDERR.puts "K8s GET secret failed: HTTP #{get_res.code}: #{get_res.body[0, 200]}"
        exit 1
    end
    token = Token.create(user: slave, action: 'api')
    new_key = token.value
    manifest = JSON.generate(
        'apiVersion' => 'v1',
        'kind' => 'Secret',
        'metadata' => { 'name' => secret_name, 'namespace' => namespace },
        'type' => 'Opaque',
        'data' => { 'token' => Base64.strict_encode64(new_key) }
    )
    post_url = k8s_post_url_for(http, namespace)
    post_req = Net::HTTP::Post.new(post_url.request_uri)
    post_req['Authorization'] = "Bearer #{sa_token}"
    post_req['Content-Type'] = 'application/json'
    post_req['Accept'] = 'application/json'
    post_req.body = manifest
    begin
        post_res = http.request(post_req)
    rescue => e
        STDERR.puts "K8s POST secret exception: #{e.class}: #{e.message}"
        exit 1
    end
    unless post_res.is_a?(Net::HTTPSuccess)
        STDERR.puts "K8s POST secret failed: HTTP #{post_res.code}: #{post_res.body[0, 200]}"
        exit 1
    end
    print new_key

  sso_suite_zeitwerk.rb: |
    # WHY THIS FILE EXISTS
    #
    # Redmine loads every plugin's lib/ into the main Zeitwerk
    # autoloader with eager loading enabled (lib/redmine/plugin_loader.rb,
    # add_autoload_paths: it builds a Rails::Engine::Configuration, adds
    # 'lib' with eager_load: true, and pushes each all_eager_load_paths entry
    # into Rails.autoloaders.main). Zeitwerk therefore expects
    # plugins/redmine_sso_suite/lib/redmine_sso_suite/version.rb to define
    # RedmineSsoSuite::Version.
    #
    # It defines VERSION instead — the gem convention — and the plugin's own
    # init.rb uses it as RedmineSsoSuite::VERSION. In development and test
    # that mismatch is invisible, because Zeitwerk only reads the file when
    # the constant is first referenced or when the tree is eager loaded, and
    # the test environment does not eager load. Production does
    # (config.eager_load = true), so the boot reaches
    # Zeitwerk::Loader::EagerLoad#actual_eager_load_dir, asks for
    # RedmineSsoSuite::Version, and dies:
    #
    #   uninitialized constant RedmineSsoSuite::Version (NameError)
    #   Did you mean?  RedmineSsoSuite::VERSION
    #
    # raised out of bin/rails before the server ever listens. That is the
    # whole crash — nothing is wrong with the plugin's behaviour, only with
    # the file name Zeitwerk derived a constant from.
    #
    # init.rb already require_relative's version.rb itself, so the constant
    # is defined before anything can reference it and the autoload Zeitwerk
    # sets for Version is never triggered. do_not_eager_load is Zeitwerk's
    # documented opt-out for exactly this case — a file whose constant name
    # does not match its path. It is consulted when the eager load walks the
    # tree rather than at autoloader setup, so it works from an initializer
    # and does not care about the order initializers run in.
    #
    # The plugins hostPath volume is mounted unconditionally — the SSO_* env
    # vars are the only authelia-gated part of this plugin — so this
    # workaround is deliberately ungated too: the plugin is always there,
    # and with it the crash. The other two vendored plugins need no entry:
    # kanban's lib/kanban/constants.rb defines Kanban::Constants, and
    # redmine_forgejo_webhook has no lib/ at all.
    #
    # HOW THIS FILE REACHES config/initializers/: it is not mounted there.
    # A ConfigMap volume is read-only at the kubelet
    # (configMapVolume.GetAttributes().ReadOnly, ORed into every mount of the
    # volume in pkg/kubelet/kubelet_pods.go), and the image's
    # docker-entrypoint.sh chowns config/ before it execs rails. The chown
    # fails on a read-only file, find exits non-zero, and `set -Eeo pipefail`
    # ends the entrypoint before `exec gosu redmine … rails server` — the pod
    # logs "chown: config/initializers/sso_suite_zeitwerk.rb: Read-only file
    # system" and never boots. So the redmine-zeitwerk-fix initContainer
    # copies this key into a writable emptyDir, and the app container mounts
    # that file from there.
    Rails.autoloaders.main.do_not_eager_load(
        Rails.root.join('plugins/redmine_sso_suite/lib/redmine_sso_suite/version.rb')
    )

---
{{- if (include "shoggoth.isServiceEnabled" (list . "redmine-db")) }}
apiVersion: v1
kind: Service
metadata:
  name: redmine-db
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shoggoth.labels" . | nindent 4 }}
    app.kubernetes.io/component: redmine
    shoggoth.io/group: workflow
    shoggoth.io/exposure: internal
spec:
  selector:
    app: redmine-db
  ports:
  - name: postgres
    port: 5432
    targetPort: 5432
{{- end }}
---
{{- if (include "shoggoth.isServiceEnabled" (list . "redmine-db")) }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redmine-db
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shoggoth.labels" . | nindent 4 }}
    app.kubernetes.io/component: redmine
    shoggoth.io/group: workflow
    shoggoth.io/exposure: internal
spec:
  serviceName: redmine-db
  replicas: 1
  selector:
    matchLabels:
      app: redmine-db
  template:
    metadata:
      labels:
        app: redmine-db
        shoggoth.io/group: workflow
        shoggoth.io/exposure: internal
    spec:
      {{- include "shoggoth.podDnsConfig" . | nindent 6 }}
      containers:
      - name: postgres
        image: postgres:18.7-alpine
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5432
          name: postgres
        env:
        - name: POSTGRES_DB
          value: redmine
        - name: POSTGRES_USER
          value: redmine
        - name: POSTGRES_PASSWORD_FILE
          value: /run/secrets/redmine_db_password
        - name: OTEL_TRACES_EXPORTER
          value: otlp
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://otelcol:4318
        - name: SHOGGOTH_DOMAIN
          value: {{ .Values.identity.domain }}
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql
        - name: db-password
          mountPath: /run/secrets/redmine_db_password
          subPath: password
          readOnly: true
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - redmine
          initialDelaySeconds: 5
          periodSeconds: 5
          failureThreshold: 60
        livenessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - redmine
          initialDelaySeconds: 30
          periodSeconds: 10
        resources:
          requests:
            memory: 256Mi
            cpu: 100m
          limits:
            memory: 512Mi
            cpu: 500m
      volumes:
      - name: db-password
        secret:
          secretName: redmine-db-password
      - name: data
        persistentVolumeClaim:
          claimName: redmine-db
      serviceAccountName: redmine-db
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: redmine
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shoggoth.labels" . | nindent 4 }}
    app: redmine
    app.kubernetes.io/component: redmine
    shoggoth.io/group: workflow
    shoggoth.io/exposure: internal
spec:
  selector:
    app: redmine
  ports:
  - name: http
    port: 80
    targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redmine
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shoggoth.labels" . | nindent 4 }}
    app: redmine
    kube-diagrams.io/icon: diagrams.azure.devops.Boards
    app.kubernetes.io/component: redmine
    shoggoth.io/group: workflow
    shoggoth.io/exposure: internal
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redmine
  template:
    metadata:
      labels:
        app: redmine
        shoggoth.io/group: workflow
        shoggoth.io/exposure: internal
      annotations:
        secret.reloader.stakater.com/reload: redmine-db-password,redmine-secret-key-base,openldap-ldapauth-password,authelia-secrets
    spec:
      {{- include "shoggoth.podDnsConfig" . | nindent 6 }}
      # Installs the Zeitwerk workaround from the redmine-init ConfigMap into a
      # writable volume, because a ConfigMap mount cannot serve as the file
      # itself: configMapVolume.GetAttributes() reports ReadOnly, and the
      # kubelet ORs that into every mount of the volume
      # (pkg/kubelet/kubelet_pods.go: mount.ReadOnly || mustMountRO), so
      # readOnly: false on the volumeMount changes nothing. The image's
      # docker-entrypoint.sh runs _fix_permissions() — find config log
      # public/*assets tmp … '!' -user redmine -exec chown redmine:redmine {}
      # + — and that chown is the one action in there with no error guard (the
      # chmod next to it is 'chmod 644 "$@" 2>/dev/null || :'). On a read-only
      # mount it fails, find exits non-zero, `set -Eeo pipefail` takes the
      # entrypoint down, and `exec gosu redmine … rails server` never runs:
      # the pod logs the chown error and nothing else. Hence a copy into an
      # emptyDir, owned and moded here so the find has nothing left to do.
      #
      # Ungated, like the mount: the plugins volume is unconditional, so the
      # Zeitwerk crash exists with or without authelia.
      #
      # Same image as the app container on purpose: the layer is already on
      # the node, so this costs no pull and no second image to track.
      initContainers:
      - name: redmine-zeitwerk-fix
        image: redmine:7.0.3-alpine3.24
        imagePullPolicy: IfNotPresent
        command:
        - /bin/sh
        - -c
        - |
          set -eu
          cp /shoggoth/redmine/sso_suite_zeitwerk.rb /zeitwerk-fix/sso_suite_zeitwerk.rb
          chown redmine:redmine /zeitwerk-fix/sso_suite_zeitwerk.rb
          chmod 0644 /zeitwerk-fix/sso_suite_zeitwerk.rb
        volumeMounts:
        - name: init-script
          mountPath: /shoggoth/redmine/sso_suite_zeitwerk.rb
          subPath: sso_suite_zeitwerk.rb
          readOnly: true
        - name: zeitwerk-fix
          mountPath: /zeitwerk-fix
        resources:
          requests:
            memory: 32Mi
            cpu: 50m
          limits:
            memory: 64Mi
            cpu: 200m
      {{- if (include "shoggoth.isServiceEnabled" (list . "authelia")) }}
      # Builds the trust store the redmine_sso_suite plugin needs. Ruby's
      # OpenSSL does not scan /etc/ssl/certs the way Go's crypto/x509 does:
      # X509_STORE_set_default_paths loads the default cert FILE
      # (/etc/ssl/cert.pem, or $SSL_CERT_FILE) as one PEM bundle, and the
      # default cert DIR only as a hash-dir lookup whose filenames are
      # <subject_hash>.N — so the gitea-style subPath mount of a single
      # shoggoth-ca.crt is invisible here. Appending the CA to the image's
      # own bundle instead keeps the public roots, which is what the
      # entrypoint's `bundle check || bundle install` needs the day this
      # plugin grows a gem dependency.
      #
      # Same image as the app container on purpose: the layer is already on
      # the node, so this costs no pull and no second image to track.
      - name: redmine-ca-bundle
        image: redmine:7.0.3-alpine3.24
        imagePullPolicy: IfNotPresent
        command:
        - /bin/sh
        - -c
        - |
          set -eu
          cat /etc/ssl/certs/ca-certificates.crt /shoggoth-ca/ca.crt > /etc/shoggoth-ca/ca-certificates.crt
        volumeMounts:
        - name: shoggoth-ca
          mountPath: /shoggoth-ca/ca.crt
          subPath: ca.crt
          readOnly: true
        - name: ca-bundle
          mountPath: /etc/shoggoth-ca
        resources:
          requests:
            memory: 32Mi
            cpu: 50m
          limits:
            memory: 64Mi
            cpu: 200m
      {{- end }}
      containers:
      - name: redmine
        image: redmine:7.0.3-alpine3.24
        imagePullPolicy: IfNotPresent
        args:
        - rails
        - server
        - -b
        - 0.0.0.0
        - -p
        - '80'
        ports:
        - containerPort: 80
          name: http
        env:
        - name: REDMINE_DB_POSTGRES
          value: redmine-db
        - name: REDMINE_DB_PORT
          value: '5432'
        - name: REDMINE_DB_DATABASE
          value: redmine
        - name: REDMINE_DB_USERNAME
          value: redmine
        - name: REDMINE_DB_PASSWORD_FILE
          value: /run/secrets/redmine_db_password
        - name: REDMINE_SECRET_KEY_BASE_FILE
          value: /run/secrets/redmine_secret_key_base
        - name: REDMINE_PLUGINS_MIGRATE
          value: 'true'
        - name: LDAP_BASE_DN
          value: {{ include "shoggoth.ldapBaseDn" . }}
        - name: LDAP_HOST
          value: openldap
        - name: LDAP_BIND_DN
          value: uid=ldapauth,ou=people,{{ include "shoggoth.ldapBaseDn" . }}
        - name: LDAP_BIND_PASSWORD
          valueFrom:
            secretKeyRef:
              name: openldap-ldapauth-password
              key: password
        - name: SHOGGOTH_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: openldap-admin-password
              key: password
        - name: OTEL_TRACES_EXPORTER
          value: otlp
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://otelcol:4318
        - name: SHOGGOTH_DOMAIN
          value: {{ .Values.identity.domain }}
        - name: SHOGGOTH_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        {{- if (include "shoggoth.isServiceEnabled" (list . "authelia")) }}
        # redmine_sso_suite plugin (submodule
        # shoggoth/data/redmine/plugins/redmine_sso_suite). The plugin reads
        # these in an after_initialize hook (DemoEnvConfig.apply_if_needed!)
        # and writes them into Redmine's settings table, so the "Sign in with
        # SSO" button appears without anyone clicking through
        # Administration → Plugins, and the values are re-applied from the
        # env on every boot.
        #
        # REDMINE_PUBLIC_HOST/PROTOCOL also set Setting.host_name and
        # Setting.protocol, which nothing in this chart set before. That is
        # not incidental: the plugin builds its callback URL as
        # "#{Setting.protocol}://#{Setting.host_name}/sso/oauth/callback"
        # (Settings.callback_url), so without them the redirect_uri
        # registered in authelia-config.yaml would not match what the plugin
        # sends, and Redmine would build its links from the request Host.
        #
        # SSO_PUBLIC_ISSUER_URL is deliberately unset: the browser and the
        # pod reach the portal at the same https://authelia.<domain> (dns.yaml
        # rewrites the subdomain to the Service), so the split-issuer
        # fallback would only add a second value to keep in sync.
        #
        # enforce_sso_for_non_admin stays at its '0' default: the SSO button
        # is additive to the LDAP password login, and the local admin account
        # keeps working as the break-glass path.
        - name: SSO_AUTO_CONFIGURE
          value: '1'
        - name: SSO_ISSUER_URL
          value: 'https://authelia.{{ .Values.identity.domain }}'
        - name: SSO_CLIENT_ID
          value: 'redmine'
        - name: SSO_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: authelia-secrets
              key: redmine-client-secret
        - name: REDMINE_PUBLIC_HOST
          value: 'redmine.{{ .Values.identity.domain }}'
        - name: REDMINE_PUBLIC_PROTOCOL
          value: 'http'
        # The CA trust for the plugin's HTTPS calls to Authelia — discovery,
        # token, userinfo and JWKS, all with default verification and no
        # bypass option. Points at the bundle the redmine-ca-bundle
        # initContainer builds, for the reason described there.
        - name: SSL_CERT_FILE
          value: '/etc/shoggoth-ca/ca-certificates.crt'
        {{- end }}
        volumeMounts:
        - name: files
          mountPath: /usr/src/redmine/files
        - name: bundle-cache
          mountPath: /usr/local/bundle/cache/
        - name: plugins
          mountPath: /usr/src/redmine/plugins
        - name: init-script
          mountPath: /shoggoth/redmine/init.sh
          subPath: init.sh
          readOnly: true
        - name: init-script
          mountPath: /shoggoth/redmine/slave_token_init.rb
          subPath: slave_token_init.rb
          readOnly: true
        # Ungated on authelia, unlike the SSO_* env vars: the plugins volume
        # above mounts all three vendored plugins regardless, so
        # redmine_sso_suite is present and breaks the eager load either way.
        #
        # From the zeitwerk-fix emptyDir, NOT from the ConfigMap key the Ruby
        # lives in: a ConfigMap volume is mounted read-only by the kubelet no
        # matter what the volumeMount says, and the image's entrypoint chowns
        # config/ before it execs rails — the chown fails on a read-only file
        # and kills the boot before it starts. See the initContainer. The file
        # is therefore deliberately not readOnly here either: it has to be
        # chown-able, and the initContainer has already put the right owner
        # and mode on it.
        - name: zeitwerk-fix
          mountPath: /usr/src/redmine/config/initializers/sso_suite_zeitwerk.rb
          subPath: sso_suite_zeitwerk.rb
        - name: db-password
          mountPath: /run/secrets/redmine_db_password
          subPath: password
          readOnly: true
        - name: secret-key-base
          mountPath: /run/secrets/redmine_secret_key_base
          subPath: secret-key-base
          readOnly: true
        {{- if (include "shoggoth.isServiceEnabled" (list . "authelia")) }}
        # The bundle, not the CA: see the redmine-ca-bundle initContainer.
        # Read-only because only the initContainer writes it.
        - name: ca-bundle
          mountPath: /etc/shoggoth-ca
          readOnly: true
        {{- end }}
        lifecycle:
          postStart:
            exec:
              command:
              - /bin/bash
              - -c
              - |
                set -o pipefail
                LOG=/usr/src/redmine/files/redmine-init.log
                exec > >(tee -a "${LOG}" > /proc/1/fd/1) 2>&1
                echo "=== redmine-init start $(date -Iseconds) ==="
                /bin/sh /shoggoth/redmine/init.sh
                echo "=== redmine-init exit $? $(date -Iseconds) ==="
        resources:
          requests:
            memory: 256Mi
            cpu: 200m
          limits:
            memory: 512Mi
            cpu: 1000m
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - '[ -f /tmp/slave-token-ready ]'
          initialDelaySeconds: 15
          periodSeconds: 10
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
          failureThreshold: 6
      volumes:
      - name: init-script
        configMap:
          name: redmine-init
          defaultMode: 493
      - name: files
        persistentVolumeClaim:
          claimName: redmine-files
      - name: bundle-cache
        persistentVolumeClaim:
          claimName: redmine-bundle-cache
      - name: plugins
        hostPath:
          path: /var/lib/rancher/k3s/storage/{{ .Values.identity.instanceDir }}/redmine-plugins
          type: DirectoryOrCreate
      # Where the redmine-zeitwerk-fix initContainer installs the initializer
      # the app container mounts at config/initializers/. Writable, because
      # the image's entrypoint chowns config/ before it execs rails and the
      # chown has to succeed; see the initContainer's comment.
      - name: zeitwerk-fix
        emptyDir: {}
      - name: db-password
        secret:
          secretName: redmine-db-password
      - name: secret-key-base
        secret:
          secretName: redmine-secret-key-base
      {{- if (include "shoggoth.isServiceEnabled" (list . "authelia")) }}
      # The CA the initContainer appends, and the emptyDir the combined
      # bundle is written to. The app container mounts only the emptyDir —
      # it has no use for the bare CA.
      - name: shoggoth-ca
        secret:
          secretName: shoggoth-ca
          items:
          - key: ca.crt
            path: ca.crt
      - name: ca-bundle
        emptyDir: {}
      {{- end }}
      serviceAccountName: redmine
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: redmine
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shoggoth.labels" . | nindent 4 }}
    app: redmine
    app.kubernetes.io/component: redmine
    shoggoth.io/group: workflow
    shoggoth.io/exposure: internal
---
{{- if (include "shoggoth.isServiceEnabled" (list . "redmine-db")) }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: redmine-db
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shoggoth.labels" . | nindent 4 }}
    app.kubernetes.io/component: redmine
    shoggoth.io/group: workflow
    shoggoth.io/exposure: internal
{{- end }}
{{- end }}
