{{- /*
  templates/shared-cache.yaml — single PVC shared across CI consumers.

  Consumers: everything that runs the ccws tooling mounts /cache from
  this PVC -- the slave:noble image's CCWS_CACHE=/cache/ccws/ +
  PIP_CACHE_DIR=/cache/ccws/pip expect it. That is the gitea-runner
  job pods, the slave-term interactive web terminal, slave-dind, the
  Argo workflow pods (command-handler's worker step, slave-test) and
  the dispatch sandbox pods. github-mirror-sync is deliberately not
  one: it runs the shoggoth_tools host image and has no ccws cache
  to share.

  Capacity: 30Gi (covers pip wheels + ccws cache state with headroom);
  the request is a literal in this file, so a project that outgrows it
  bumps it here. Do not re-create per-consumer PVCs.

  No `app:` label — this is an internal artifact, not a service. It is
  always-on as long as services.shared-cache.enabled is true.
*/}}
{{- if (include "shoggoth.isServiceEnabled" (list . "shared-cache")) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: shoggoth-shared-cache
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shoggoth.labels" . | nindent 4 }}
    app.kubernetes.io/component: shared-cache
  annotations:
    # Kept across `helm uninstall` so uninstalling stops the workloads but
    # preserves data. Reinstall adopts it: shoggoth.labels survives
    # uninstall, so Helm's ownership check still passes.
    helm.sh/resource-policy: keep
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 30Gi
  storageClassName: local-path
{{- end }}
