{{- /*
  templates/web-internal.yaml — TLS-terminating internal reverse proxy (Angie)
  fronting every shoggoth service.

  Four Services (the apex plus api/git/redmine) front one Deployment, which
  terminates TLS for *.${SHOGGOTH_DOMAIN} and proxies to the in-cluster
  Services. Its vhost config is large and mostly static; only the domain and
  the namespace are substituted at deploy time.

  The agent-plugin source (plugin.json plus the memory-* / caveman skill
  files) is mounted verbatim from files/web-internal/plugin/ through the
  shoggoth.filesData helper — plain text, no Helm rendering, so adding or
  editing a skill is a file edit, not a template edit.

  Unlike grafana and argo-workflows, this file contains no literal `{{ ... }}`
  from another engine, so nothing here needs the Helm literal-brace escape.
*/}}
{{- if (include "shoggoth.isServiceEnabled" (list . "web-internal")) }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: web-internal-config-template
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shoggoth.labels" . | nindent 4 }}
    app.kubernetes.io/component: web-internal
data:
  angie.conf.tmpl: |
    load_module modules/ngx_otel_module.so;
    events {
        worker_connections 1024;
    }
    http {
        resolver {{ .Values.identity.dnsIp }} valid=30s;
        map $http_upgrade $connection_upgrade {
            default upgrade;
            ''      close;
        }
        otel_exporter {
            endpoint http://otelcol:4317;
        }
        otel_service_name angie;
        # --- python-cache (PyPI caching proxy) ---
        proxy_cache_path /data/python_cache/cache
            levels=1:2
            keys_zone=pypi_cache:10m
            max_size=10g
            inactive=120d
            use_temp_path=off;
        server {
            listen 80;
            server_name python-cache.{{ .Values.identity.domain }} python-cache;
            location = / {
                return 302 /index/;
            }
            location /index/ {
                proxy_pass https://pypi.org/simple/;
                proxy_ssl_server_name on;
                proxy_set_header Host pypi.org;
                proxy_set_header Accept-Encoding "";
                sub_filter_once off;
                sub_filter 'https://files.pythonhosted.org/' '/files/';
                sub_filter_types text/html application/vnd.pypi.simple.v1+json application/vnd.pypi.simple.latest+json application/vnd.pypi.simple.v1+html;
                proxy_cache pypi_cache;
                proxy_cache_valid 200 10m;
                proxy_cache_valid 301 302 1h;
            }
            location /files/ {
                proxy_pass https://files.pythonhosted.org/;
                proxy_ssl_server_name on;
                proxy_set_header Host files.pythonhosted.org;
                proxy_read_timeout 300s;
                proxy_connect_timeout 30s;
                proxy_cache pypi_cache;
                proxy_cache_valid 200 30d;
                proxy_cache_key $uri;
            }
        }
        # --- static site ---
        server {
            listen 80 default_server;
            server_name {{ .Values.identity.domain }};
            root /data/html;
            index index.html;
            location / {
                try_files $uri $uri/ =404;
            }
            location = /plugin.tar.gz {
                alias /data/plugin/plugin.tar.gz;
                default_type application/gzip;
            }
            location = /setup-client.sh {
                alias /data/scripts/setup-client.sh;
                default_type application/x-sh;
            }
        }
        # --- build-cache (webdav) ---
        # The short form is listed alongside the domain form: the slave
        # image bakes CCACHE_REMOTE_STORAGE=http://build-cache, and the
        # bare name resolves to this Service through dnsConfig.searches.
        # Angie routes on the Host header, so a name that is not listed
        # here falls through to the default_server (the static site) and
        # a ccache PUT gets a 404 instead of the webdav backend.
        server {
            listen 80;
            server_name build-cache.{{ .Values.identity.domain }} build-cache;
            location / {
                alias /data/build_cache/;
                log_not_found off;
                dav_methods PUT DELETE;
                create_full_put_path on;
                client_max_body_size 100M;
            }
        }
        # --- api (gitea + redmine + cdash unified) ---
        upstream git {
            zone git 1m;
            server git.{{ .Release.Namespace }}.svc.cluster.local resolve;
        }
        upstream redmine {
            zone redmine 1m;
            server redmine.{{ .Release.Namespace }}.svc.cluster.local resolve;
        }
        upstream cdash {
            zone cdash 1m;
            server cdash.{{ .Release.Namespace }}.svc.cluster.local resolve;
        }
        server {
            listen 80;
            server_name api.{{ .Values.identity.domain }};
            proxy_read_timeout 30m;
            proxy_send_timeout 30m;
            proxy_connect_timeout 360m;
            location = /gitea {
                return 301 /gitea/;
            }
            location /gitea/ {
                proxy_pass http://git/;
                proxy_set_header Host git.{{ .Values.identity.domain }};
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_set_header Authorization "Bearer ${GITEA_SLAVE_TOKEN}";
            }
            location = /redmine {
                return 301 /redmine/;
            }
            location /redmine/ {
                proxy_pass http://redmine/;
                proxy_set_header Host redmine.{{ .Values.identity.domain }};
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_set_header X-Redmine-API-Key "${REDMINE_TOKEN}";
            }
            location = /cdash {
                return 301 /cdash/;
            }
            location /cdash/ {
                proxy_pass http://cdash/;
                proxy_set_header Host cdash.{{ .Values.identity.domain }};
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_set_header Authorization "Bearer ${CDASH_API_TOKEN}";
            }
            # argo webhook ingress. Gitea/Redmine POST to
            #   http://api.{{ .Values.identity.domain }}/argo/api/v1/events/{ns}/{discriminator}
            # and web-internal injects the argo-webhook-receiver SA token
            # before forwarding to argo:80 (plain HTTP, --secure=false;
            # see argo-workflows.yaml). The interceptor at
            # server/auth/webhook/interceptor.go short-circuits when an
            # Authorization header is already present, so v4's missing
            # `gitea` parser and missing argo-workflows-webhook-clients
            # Secret both become irrelevant — the gatekeeper does bearer
            # validation against k8s, and the event controller runs with
            # that SA's RBAC (see the argo-webhook-receiver template).
            location = /argo {
                return 301 /argo/;
            }
            location /argo/ {
                proxy_pass http://argo:80/;
                proxy_set_header Host argo.{{ .Values.identity.domain }};
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_set_header Authorization "Bearer ${ARGO_WEBHOOK_TOKEN}";
            }
        }
        # --- slave-term: served directly via coreDNS rewrite
        # *.{SHOGGOTH_DOMAIN} -> {{ .Release.Namespace }}.svc.cluster.local
        # (see dns.yaml: rewrite stop name suffix {{ .Values.identity.domain }} {{ .Release.Namespace }}.svc.cluster.local)
        # so slave-term.{{ .Values.identity.domain }} resolves straight to the slave-term Service ClusterIP.
        # nginx intentionally does NOT proxy websocket here: long-lived ttyd sessions should
        # not be gated by nginx read_timeout, and bypassing angie removes a hop from the path.
        # Clients on the VPN connect directly to the pod's port 80.
        # --- grafana ---
        upstream grafana {
            zone grafana 1m;
            server grafana.{{ .Release.Namespace }}.svc.cluster.local resolve;
        }
        server {
            listen 80;
            server_name grafana.{{ .Values.identity.domain }};
            location / {
                proxy_pass http://grafana;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection $connection_upgrade;
            }
        }
    }

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: web-internal-html
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shoggoth.labels" . | nindent 4 }}
    app.kubernetes.io/component: web-internal
data:
  index.html: |
    <!DOCTYPE html>
    <html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Shoggoth</title>
        <style>
            body {
                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
                max-width: 800px;
                margin: 0 auto;
                padding: 40px 20px;
                background: #1a1a2e;
                color: #eee;
            }
            h1 { color: #00d9ff; }
            a { color: #00d9ff; }
            .services { margin: 30px 0; }
            .services li { margin: 10px 0; }
            .download {
                background: #16213e;
                padding: 20px;
                border-radius: 8px;
                margin-top: 30px;
            }
        </style>
    </head>
    <body>
        <h1>Shoggoth</h1>
        <p>A self-hosted development multitool intended for personal use.</p>
        <h2>Service web pages</h2>
        <ul class="services">
            <li><a href="http://git.{{ .Values.identity.domain }}/">git</a> - Gitea git service</li>
            <li><a href="http://redmine.{{ .Values.identity.domain }}/">redmine</a> - Redmine issue tracker</li>
            <li><a href="http://argo.{{ .Values.identity.domain }}/">argo</a> - Argo Workflows (workflow orchestration)</li>
            <li><a href="http://registry.{{ .Values.identity.domain }}/v2/_catalog">registry</a> - Container image registry (zot)</li>
            <li><a href="http://python-cache.{{ .Values.identity.domain }}/">python-cache</a> - PyPI cache proxy</li>
            <li><a href="http://apt-cache.{{ .Values.identity.domain }}/">apt-cache</a> - APT package cache
                <a href="http://apt-cache.{{ .Values.identity.domain }}/acng-report.html">Usage statistics.</a></li>
            <li><a href="http://litellm.{{ .Values.identity.domain }}/">ai</a> - LLM proxy (LiteLLM → LocalAI)</li>
            <li><a href="http://git-pages.{{ .Values.identity.domain }}/">git-pages</a> - Static site hosting</li>
            <li><a href="http://grafana.{{ .Values.identity.domain }}/">grafana</a> - Observability dashboard (traces, metrics, logs)</li>
            <li><a href="http://slave-term.{{ .Values.identity.domain }}/">slave-term</a> - Interactive web terminal (ttyd + tmux + Qwen Code)</li>
            <li><a href="http://phpldapadmin.{{ .Values.identity.domain }}/">phpldapadmin</a> - LDAP directory web UI</li>
        </ul>
        <div class="download">
            <h2>Client Setup</h2>
            <p>Download and run the setup script to configure your client:</p>
            <pre><code>curl -kO https://{{ .Values.identity.domain }}/setup-client.sh
    chmod +x setup-client.sh
    ./setup-client.sh --all</code></pre>
            <p>Or download directly: <a href="https://{{ .Values.identity.domain }}/setup-client.sh">setup-client.sh</a> (use <code>-k</code> if CA certificate is not installed yet)</p>
        </div>
    </body>
    </html>

---
apiVersion: v1
kind: Service
metadata:
  name: web-internal
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shoggoth.labels" . | nindent 4 }}
    app.kubernetes.io/component: web-internal
spec:
  selector:
    app: web-internal
  ports:
  - name: http
    port: 80
    targetPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: python-cache
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shoggoth.labels" . | nindent 4 }}
    app.kubernetes.io/component: web-internal
spec:
  selector:
    app: web-internal
  ports:
  - name: http
    port: 80
    targetPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: build-cache
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shoggoth.labels" . | nindent 4 }}
    app.kubernetes.io/component: web-internal
spec:
  selector:
    app: web-internal
  ports:
  - name: http
    port: 80
    targetPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shoggoth.labels" . | nindent 4 }}
    app.kubernetes.io/component: web-internal
spec:
  selector:
    app: web-internal
  ports:
  - name: http
    port: 80
    targetPort: 80
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: angie-build-cache
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shoggoth.labels" . | nindent 4 }}
    app.kubernetes.io/component: web-internal
  annotations:
    # Kept across `helm uninstall` so `make down` stops workloads but
    # preserves data. Reinstall adopts it: shoggoth.labels survives
    # uninstall, so Helm's ownership check still passes.
    helm.sh/resource-policy: keep
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
  storageClassName: local-path
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: python-cache
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shoggoth.labels" . | nindent 4 }}
    app.kubernetes.io/component: web-internal
  annotations:
    # Kept across `helm uninstall` so `make down` stops workloads but
    # preserves data. Reinstall adopts it: shoggoth.labels survives
    # uninstall, so Helm's ownership check still passes.
    helm.sh/resource-policy: keep
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: local-path
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: web-internal-plugin-source
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shoggoth.labels" . | nindent 4 }}
    app.kubernetes.io/component: web-internal
data:
  {{- include "shoggoth.filesData" (list . "files/web-internal/plugin/*" false) | nindent 2 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-internal
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shoggoth.labels" . | nindent 4 }}
    app.kubernetes.io/component: web-internal
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web-internal
  template:
    metadata:
      labels:
        app: web-internal
      annotations:
        secret.reloader.stakater.com/reload: gitea-slave-token,redmine-slave-token,cdash-api-token,argo-webhook-receiver-token
    spec:
      {{- include "shoggoth.podDnsConfig" . | nindent 6 }}
      initContainers:
      - name: build-plugin
        image: asherikov/shoggoth_tools:alpine
        imagePullPolicy: IfNotPresent
        command:
        - sh
        - -c
        - "set -eu\nmkdir -p /data/plugin/skills\nfor src in /src/plugin/*-skill.md; do\n    base=\"$(basename \"${src}\" -skill.md)\"\n    mkdir -p \"/data/plugin/skills/${base}\"\n    cp \"${src}\" \"/data/plugin/skills/${base}/SKILL.md\"\ndone\ncp /src/plugin/plugin.json /data/plugin/plugin.json\ntar czhf /data/plugin/plugin.tar.gz -C /data/plugin .\n"
        resources:
          requests:
            memory: 32Mi
            cpu: 50m
          limits:
            memory: 64Mi
            cpu: 200m
        volumeMounts:
        - name: plugin-source
          mountPath: /src/plugin
          readOnly: true
        - name: plugin-data
          mountPath: /data/plugin
      - name: render-config
        image: asherikov/shoggoth_tools:alpine
        imagePullPolicy: IfNotPresent
        command:
        - bash
        - -c
        args:
        - "VARS=\"$(printf '${%s}' SHOGGOTH_DOMAIN)\"\nenvsubst \"$VARS\" < /tmpl/angie.conf.tmpl > /rendered/angie.conf\nenvsubst \"$VARS\" < /tmpl-html/index.html > /rendered/index.html\nsed -e \"s|\\${GITEA_SLAVE_TOKEN}|${GITEA_SLAVE_TOKEN}|g\" \\\n    -e \"s|\\${REDMINE_TOKEN}|${REDMINE_TOKEN}|g\" \\\n    -e \"s|\\${CDASH_API_TOKEN}|${CDASH_API_TOKEN}|g\" \\\n    -e \"s|\\${ARGO_WEBHOOK_TOKEN}|${ARGO_WEBHOOK_TOKEN}|g\" \\\n    -i /rendered/angie.conf\n"
        env:
        - name: SHOGGOTH_DOMAIN
          value: {{ .Values.identity.domain }}
        - name: GITEA_SLAVE_TOKEN
          valueFrom:
            secretKeyRef:
              name: gitea-slave-token
              key: token
        - name: REDMINE_TOKEN
          valueFrom:
            secretKeyRef:
              name: redmine-slave-token
              key: token
        - name: CDASH_API_TOKEN
          valueFrom:
            secretKeyRef:
              name: cdash-api-token
              key: token
        # Long-lived SA token for argo-webhook-receiver. Injected on every
        # request to /argo/ in angie.conf so the v4 webhook interceptor
        # skips signature verification (interceptor.go:49-52 short-circuits
        # when an Authorization header is already present) and argo-server's
        # gatekeeper validates the bearer token instead.
        - name: ARGO_WEBHOOK_TOKEN
          valueFrom:
            secretKeyRef:
              name: argo-webhook-receiver-token
              key: token
        resources:
          requests:
            memory: 32Mi
            cpu: 50m
          limits:
            memory: 128Mi
            cpu: 200m
        volumeMounts:
        - name: config-template
          mountPath: /tmpl
          readOnly: true
        - name: html-template
          mountPath: /tmpl-html
          readOnly: true
        - name: rendered-config
          mountPath: /rendered
      - name: fix-permissions
        image: asherikov/shoggoth_tools:alpine
        imagePullPolicy: IfNotPresent
        command:
        - bash
        - -c
        - chown -R 100:101 /data/build_cache /data/python_cache
        securityContext:
          runAsUser: 0
        resources:
          requests:
            memory: 32Mi
            cpu: 50m
          limits:
            memory: 64Mi
            cpu: 200m
        volumeMounts:
        - name: build-cache
          mountPath: /data/build_cache
        - name: python-cache
          mountPath: /data/python_cache
      containers:
      - name: angie
        image: docker.angie.software/angie:1.11.6
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
          name: http
        volumeMounts:
        - name: rendered-config
          mountPath: /etc/angie/angie.conf
          subPath: angie.conf
          readOnly: true
        - name: rendered-config
          mountPath: /data/html
          readOnly: true
        - name: build-cache
          mountPath: /data/build_cache
        - name: python-cache
          mountPath: /data/python_cache
        - name: plugin-data
          mountPath: /data/plugin
          readOnly: true
        - name: setup-client
          mountPath: /data/scripts
          readOnly: true
        resources:
          requests:
            memory: 64Mi
            cpu: 50m
          limits:
            memory: 128Mi
            cpu: 500m
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
          failureThreshold: 30
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
          failureThreshold: 6
      volumes:
      - name: config-template
        configMap:
          name: web-internal-config-template
      - name: rendered-config
        emptyDir: {}
      - name: html-template
        configMap:
          name: web-internal-html
      - name: build-cache
        persistentVolumeClaim:
          claimName: angie-build-cache
      - name: python-cache
        persistentVolumeClaim:
          claimName: python-cache
      - name: plugin-source
        configMap:
          name: web-internal-plugin-source
          defaultMode: 493
      - name: plugin-data
        emptyDir: {}
      - name: setup-client
        hostPath:
          path: /var/lib/rancher/k3s/storage/{{ .Values.identity.instanceDir }}/scripts
          type: DirectoryOrCreate
      serviceAccountName: web-internal
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: web-internal
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shoggoth.labels" . | nindent 4 }}
    app.kubernetes.io/component: web-internal
{{- end }}
