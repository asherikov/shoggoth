{{- /*
  zz-secret-purge.yaml — a POST-DELETE hook that removes the Secrets this
  release leaves behind at runtime.

  WHY THIS EXISTS
  A Helm release is the manifest it renders, and this chart's manifest
  does not describe every Secret that ends up in the namespace. Three
  groups of Secrets outlive `helm uninstall` as it stands:

    1. The Secrets the External Secrets Operator projects. The ESO
       controller creates them at runtime, not from the manifest, so
       Helm does not know they exist. The `creationPolicy: Owner` ones
       carry a controller ownerReference to their ExternalSecret CR and
       normally follow the CR into the garbage collector — but that
       collection is ASYNCHRONOUS, and `helm uninstall --wait` waits
       for the objects Helm deleted, not for the objects the garbage
       collector has not collected yet. The `creationPolicy: Orphan`
       ones (the gitea, redmine and cdash tokens) carry no
       ownerReference at all: ESO explicitly REMOVES it
       (external-secrets v2.11.0,
       pkg/controllers/externalsecret/externalsecret_controller.go:
       `applyOwnership` calls `RemoveControllerReference` for every
       policy that is not `Owner`), so they are never collected and
       survive the uninstall outright.

    2. The Secrets the openbao-bootstrap Job writes. It talks to the
       API server directly (k8s_put_secret), so they are in no
       manifest and carry no ownerReference: the unseal-key backup,
       the two ESO store tokens, and the CA and server TLS pairs.

    3. The Secrets the workflow scripts write at runtime
       (shoggoth/workflow/scripts/shoggoth/k8s.py: upsert_secret),
       which target the same names as the ESO projections.

  The consequences are not cosmetic. The ESO store token is the
  credential the SecretStore authenticates with, and it is minted
  against ONE OpenBao instance: if the Secret outlives the instance
  (a re-init, or `make wipe_openbao`), the token is gone from the new
  instance's token store and the ESO controller reports "unable to
  validate store" while OpenBao itself is healthy. The unseal-key
  backup is a copy of the only key that can unseal the vault.

  WHY A POST-DELETE HOOK AND NOT A MAKEFILE STEP
  `make down` runs `helm uninstall`, and a secret purge that lives in the
  Makefile only ever runs when someone runs the Makefile. A bare
  `helm uninstall` — the path an operator reaches for when the release is
  in the way — would leave every Secret below behind. A hook is part of
  the release itself, so it runs for every uninstall of this release, with
  or without the Makefile.

  THE ORDERING IS WHAT MAKES IT WORK
  helm v3.18.4 (pkg/action/uninstall.go, Uninstall.Run) runs:
      pre-delete hooks -> deleteRelease -> WaitForDelete ->
      post-delete hooks -> purgeReleases
  So this hook runs AFTER the release's own resources are gone and
  AFTER the ESO controller Deployment is deleted — the controller
  cannot re-project anything while the hook runs, which is what makes
  the deletion final. It runs BEFORE `purgeReleases`, which is the
  step that deletes the Helm release record.

  WHICH MEANS: THE RELEASE RECORD MUST NOT BE DELETED HERE
  The release record is a Secret named
  `sh.helm.release.v1.<release>.v<n>`, labelled `owner=helm`
  (helm v3.18.4, pkg/storage/driver/secrets.go: `lbs.set("owner",
  owner)` with `owner = "helm"`). `purgeReleases` deletes it AFTER this
  hook, and the storage driver does a Get before its Delete
  (pkg/storage/driver/secrets.go: `secrets.getRelease(key)`), so a
  record this hook had already removed turns the uninstall into
  "uninstall: Failed to purge the release: release: not found" — an
  uninstall that reports a failure for a release that is gone.

  Neither of the two selectors below can match it: the release record
  carries `owner=helm` and no ESO label, and its name is not one of
  the runtime names. That is the whole reason this hook deletes by
  LABEL and by NAME instead of by "everything that is not the release
  record".

  A POST-DELETE HOOK MUST NEVER FAIL THE UNINSTALL
  Unlike a pre-delete hook, a post-delete hook cannot abort the
  uninstall: helm v3.18.4 appends its error to the error list
  (`errs = append(errs, err)`) and goes on to purge the release, so
  the uninstall ends with "uninstallation completed with 1 error(s)"
  and a non-zero exit status. The teardown still happened, but the
  command reports failure — which is a lie about the state of the
  cluster, and it sends `make down` into its escalation path for a
  release that is already gone. So the script below checks every step
  explicitly, reports what it could not delete, and exits 0.

  ONE INSTALLATION IS REQUIRED BEFORE THIS HELPS
  Helm runs the hooks stored in the RELEASE RECORD, not the ones in the
  chart on disk. A release installed before this template existed
  carries no post-delete hook, so its uninstall still leaves the
  Secrets behind; the hook takes effect from the next `helm upgrade
  --install` (`make up`) onwards.

  THE RBAC TRIO BELOW IS PART OF THE HOOK, NOT AN ORDINARY RESOURCE
  Helm creates hook resources when it runs the hook, and the Job below
  needs a ServiceAccount and a RoleBinding to delete anything at all.
  They carry a LOWER weight than the Job (-10 vs -5) so the binding
  is in place before the Job's pod makes its first API call. The
  grant is a namespaced Role on secrets — `get`, `list` and `delete`
  — because the Secrets are namespaced and the hook must not be able
  to touch anything outside its own namespace.

  `kubectl delete secrets -l <selector>` is a LIST followed by one
  DELETE per object, not a deletecollection, so it needs `delete` and
  not `deletecollection`; `get` is what `kubectl delete <name>` does
  before it deletes.

  The trio is deleted when the hook finishes, on success and on
  failure: hook resources are not part of the release manifest, so
  `helm uninstall` does not reclaim them, and a Role left behind by a
  failed uninstall would outlive the release. The Job itself is kept
  on failure (no `hook-failed` in its policy) because its pod log is
  where the failure is explained, and its ttlSecondsAfterFinished
  reaps it ten minutes later.
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "shoggoth.fullname" . }}-secret-purge
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shoggoth.labels" . | nindent 4 }}
    app.kubernetes.io/component: secret-purge
  annotations:
    "helm.sh/hook": post-delete
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded,hook-failed
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "shoggoth.fullname" . }}-secret-purge
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shoggoth.labels" . | nindent 4 }}
    app.kubernetes.io/component: secret-purge
  annotations:
    "helm.sh/hook": post-delete
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded,hook-failed
rules:
# `list` + `delete` for the label-selected ESO projections, `get` for the
# named runtime Secrets (kubectl fetches the object before deleting it).
# Nothing else: this pod exists to delete Secrets in its own namespace.
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "shoggoth.fullname" . }}-secret-purge
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shoggoth.labels" . | nindent 4 }}
    app.kubernetes.io/component: secret-purge
  annotations:
    "helm.sh/hook": post-delete
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded,hook-failed
subjects:
  - kind: ServiceAccount
    name: {{ include "shoggoth.fullname" . }}-secret-purge
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "shoggoth.fullname" . }}-secret-purge
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "shoggoth.fullname" . }}-secret-purge-{{ .Release.Revision }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shoggoth.labels" . | nindent 4 }}
    app.kubernetes.io/component: secret-purge
  annotations:
    "helm.sh/hook": post-delete
    "helm.sh/hook-weight": "-5"
    # No `hook-failed` here, unlike the RBAC trio above: this Job's pod log
    # is the only place this hook's diagnostics are printed, so a failed Job
    # is kept for inspection and reaped by ttlSecondsAfterFinished instead.
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
    # ...and this annotation is what makes Helm print that log itself.
    "helm.sh/hook-output-log-policy": hook-failed
spec:
  # The script always exits 0, so a Job failure is an infrastructure
  # problem — the image did not pull, the pod did not schedule — and one
  # retry is worth its seconds there.
  backoffLimit: 1
  ttlSecondsAfterFinished: 600
  # Backstop for the pod itself. It has to stay below the uninstall
  # --timeout, because Helm aborts the uninstall when a hook outlives it.
  activeDeadlineSeconds: 90
  template:
    metadata:
      labels:
        {{- include "shoggoth.labels" . | nindent 8 }}
        app.kubernetes.io/component: secret-purge
    spec:
      serviceAccountName: {{ include "shoggoth.fullname" . }}-secret-purge
      restartPolicy: Never
      # The pod runs under whatever PodSecurity profile the namespace
      # carries, and the release namespace is `privileged` — the chart's
      # own workloads need it (see _helpers.tpl: shoggoth.podSecurityProfile).
      # The context below still satisfies `restricted`, so the hook also
      # works in a namespace that was tightened by hand.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        # The kubelet creates an emptyDir 0750 root-owned, so the non-root
        # user above could not write to it; fsGroup is what makes the
        # scratch directory below usable by this pod.
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.image.registries }}
      imagePullSecrets:
      {{- range . }}
        - name: {{ . }}
      {{- end }}
      {{- end }}
      containers:
        - name: purge
          # Same tools image as every other kubectl-using container in this
          # chart. It must NOT be registry.k8s.io/*: that registry is not in
          # the k3s mirror list (shoggoth/shoggoth.nix) and the cluster is
          # offline-first, so such a pod never pulls and the Job dies with
          # BackoffLimitExceeded — which fails the uninstall.
          image: asherikov/shoggoth_tools:alpine
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            # kubectl writes its discovery cache under $HOME, and the root
            # filesystem is read-only, so HOME points at the writable
            # emptyDir below.
            - name: HOME
              value: /tmp
            - name: KUBECTL_NAMESPACE
              value: {{ .Release.Namespace }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          # No `-e`: the script checks every step itself and MUST exit 0 —
          # a failing post-delete hook turns a completed uninstall into
          # "uninstallation completed with 1 error(s)".
          command:
            - /bin/bash
            - -c
            - |
              set -uo pipefail

              NS="${KUBECTL_NAMESPACE:?}"

              log() { echo "[secret-purge] $*"; }

              # The Secrets the External Secrets Operator projected.
              #
              # The label is set by ESO on every Secret it manages
              # (external-secrets v2.11.0, pkg/controllers/externalsecret:
              # `secret.Labels[esv1.LabelManaged] = esv1.LabelManagedValue`),
              # and it is applied AFTER ApplyTemplate, so a target template
              # that rewrites the labels cannot strip it. The label covers
              # every creationPolicy, which is what makes it the right
              # selector: the Owner ones are still waiting for the garbage
              # collector, and the Orphan ones were never going to be
              # collected at all.
              #
              # The Helm release record is not in this set: it carries
              # `owner=helm` and no ESO label.
              if out=$(kubectl delete secrets -n "${NS}" \
                      -l 'reconcile.external-secrets.io/managed=true' \
                      --ignore-not-found=true 2>&1); then
                  log "ESO-managed Secrets: ${out:-nothing to delete}"
              else
                  log "WARN: could not delete the ESO-managed Secrets: ${out}"
              fi

              # The Secrets the openbao-bootstrap Job writes at runtime:
              # the unseal-key backup, the two ESO store tokens, and the CA
              # and server TLS pairs. They carry no ownerReference and no
              # label, so nothing reclaims them — Helm does not know they
              # exist and the garbage collector has nothing to follow.
              #
              # None of these names is the Helm release record.
              for name in openbao-unseal-key \
                          shoggoth-openbao-eso-read-token \
                          shoggoth-openbao-eso-write-token \
                          shoggoth-ca \
                          shoggoth-server; do
                  if out=$(kubectl delete secret "${name}" -n "${NS}" \
                          --ignore-not-found=true 2>&1); then
                      log "runtime Secret ${name}: ${out:-nothing to delete}"
                  else
                      log "WARN: could not delete secret/${name}: ${out}"
                  fi
              done

              # Deliberately NOT deleted: the Helm release record
              # (sh.helm.release.v1.<release>.v<n>, labelled owner=helm).
              # `helm uninstall` purges it right after this hook, and the
              # storage driver Gets before it Deletes — a record this hook
              # had already removed turns the uninstall into "Failed to
              # purge the release: release: not found".
              exit 0
      volumes:
        - name: tmp
          emptyDir: {}
