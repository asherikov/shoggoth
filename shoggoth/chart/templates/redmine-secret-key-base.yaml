{{- /*
  templates/redmine-secret-key-base.yaml — ExternalSecret projecting
  the Redmine ``secret_key_base`` value into a K8s Secret.

  The Redmine pod consumes it natively: the ``secret-key-base`` volume pins
  the key with a ``subPath`` and the container hands the mounted path to the
  image as ``REDMINE_SECRET_KEY_BASE_FILE``. The image's entrypoint resolves
  that file into ``SECRET_KEY_BASE`` before it execs ``rails server``, and
  Rails uses it for cookie signing. Nothing writes the value into
  ``config/configuration.yml`` — it stays a plain environment variable for
  the app.

  The volume is non-optional, so the kubelet holds the pod in
  ``ContainerCreating`` until the Secret exists. Without it the image would
  generate its own key into the container's (non-persisted) filesystem, so
  ``secret_key_base`` would change on every pod restart.

  The value comes from OpenBao: openbao-bootstrap Phase B seeds
  ``redmine/secret-key-base`` with a random base64 value on a fresh install,
  and the ExternalSecret below projects it into the K8s Secret.

  Gated on ``redmine``: the only consumer.
*/}}
{{- if (include "shoggoth.isServiceEnabled" (list . "redmine")) }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: redmine-secret-key-base
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shoggoth.labels" . | nindent 4 }}
    app.kubernetes.io/component: redmine-secret-key-base
spec:
  secretStoreRef:
    name: shoggoth-openbao
    kind: SecretStore
  target:
    name: redmine-secret-key-base
    creationPolicy: Owner
  data:
    - secretKey: secret-key-base
      remoteRef:
        key: redmine/secret-key-base
        property: value
  refreshInterval: 5m
{{- end }}
