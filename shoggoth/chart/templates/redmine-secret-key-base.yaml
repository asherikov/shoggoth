{{- /*
  templates/redmine-secret-key-base.yaml — ExternalSecret projecting
  the Redmine ``config.secret_key_base`` value into a K8s Secret.

  Restores shoggoth/k3s/external-secrets/redmine-secret-key-base.yaml,
  which the chart migration dropped. openbao-bootstrap Phase B seeds
  ``redmine/secret-key-base`` with a random 64-byte hex value on a
  fresh install. The Redmine pod reads the resulting Secret and writes
  it into ``config/configuration.yml`` as ``secret_key_base``, used by
  Rails for cookie signing — without it the pod cannot start because
  Redmine refuses to come up with an empty key.

  Gated on ``redmine``: the only consumer.
*/}}
{{- if (include "shoggoth.isServiceEnabled" (list . "redmine")) }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: redmine-secret-key-base
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shoggoth.labels" . | nindent 4 }}
    app.kubernetes.io/component: redmine-secret-key-base
spec:
  secretStoreRef:
    name: shoggoth-openbao
    kind: SecretStore
  target:
    name: redmine-secret-key-base
    creationPolicy: Owner
  data:
    - secretKey: secret-key-base
      remoteRef:
        key: redmine/secret-key-base
        property: value
  refreshInterval: 5m
{{- end }}
