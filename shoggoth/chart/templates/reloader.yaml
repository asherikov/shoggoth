{{- /*
  templates/reloader.yaml — Stakater Reloader for ExternalSecrets
  (ConfigMap / Secret change-driven restarts).

  Used by ESO to drive pod-restart events on secret/configmap data
  changes without reload-state from a custom controller.
*/}}
{{- if (include "shoggoth.isServiceEnabled" (list . "reloader")) }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: reloader
  namespace: {{ .Release.Namespace }}
  labels:
    {{- /* part-of=external-secrets (not shoggoth) — see shoggoth.labelsWithMap. */ -}}
    {{- include "shoggoth.labelsWithMap" (list . (dict "partOf" "external-secrets")) | nindent 4 }}
    app: reloader
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: reloader
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shoggoth.labels" . | nindent 4 }}
rules:
- apiGroups:
  - ''
  resources:
  - secrets
  - configmaps
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - apps
  resources:
  - deployments
  - statefulsets
  - daemonsets
  verbs:
  - get
  - list
  - watch
  - update
  - patch
- apiGroups:
  - ''
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - create
  - get
  - list
  - watch
  - update
  - patch
  - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: reloader
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shoggoth.labels" . | nindent 4 }}
subjects:
- kind: ServiceAccount
  name: reloader
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: reloader
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reloader
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shoggoth.labelsWithMap" (list . (dict "partOf" "external-secrets")) | nindent 4 }}
    app: reloader
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: reloader
      app.kubernetes.io/part-of: external-secrets
  template:
    metadata:
      labels:
        app: reloader
        app.kubernetes.io/part-of: external-secrets
        {{- include "shoggoth.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: reloader
      automountServiceAccountToken: true
      {{- include "shoggoth.podDnsConfig" . | nindent 6 }}
      containers:
      - name: reloader
        image: ghcr.io/stakater/reloader:v1.4.22
        imagePullPolicy: IfNotPresent
        args:
        - --namespaces={{ .Release.Namespace }}
        - --resources-to-ignore=configmaps
        ports:
        - containerPort: 9090
          name: http
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1000
          seccompProfile:
            type: RuntimeDefault
        resources:
          requests:
            memory: 64Mi
            cpu: 50m
          limits:
            memory: 128Mi
            cpu: 200m
        readinessProbe:
          httpGet:
            path: /metrics
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
          failureThreshold: 30
        livenessProbe:
          httpGet:
            path: /live
            port: http
          initialDelaySeconds: 15
          periodSeconds: 30
          failureThreshold: 6
{{- end }}
