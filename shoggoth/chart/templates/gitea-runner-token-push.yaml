{{- /*
  templates/gitea-runner-token-push.yaml — PushSecret synchronizing
  the K8s ``Secret/gitea-runner-token`` *back* into OpenBao at
  ``gitea/runner-token``.

  Paired with ``gitea-runner-token.yaml``: the runner registration
  script writes a fresh token into the K8s Secret, this PushSecret
  mirrors it to OpenBao so the corresponding ``ExternalSecret`` (and any
  second cluster using the same OpenBao backend) can project the same
  value. Read it as a one-way K8s → OpenBao write: the pod holds no
  OpenBao credential, and the ``Orphan`` ExternalSecret in
  gitea-runner-token.yaml keeps the script's write authoritative. The
  credential shape is documented in README.md, "Chart template
  conventions".

  Gated on ``secret-store-write``: the PushSecret itself requires the
  write SecretStore to be enabled. Default-on, so a default install is
  unaffected.
*/}}
{{- if (include "shoggoth.isServiceEnabled" (list . "secret-store-write")) }}
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: gitea-runner-token-push
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shoggoth.labels" . | nindent 4 }}
    app.kubernetes.io/component: gitea-runner-token
    shoggoth.io/group: workflow
    shoggoth.io/exposure: internal
spec:
  secretStoreRefs:
    - name: shoggoth-openbao-write
      kind: SecretStore
  selector:
    secret:
      name: gitea-runner-token
  data:
    - match:
        secretKey: token
        remoteRef:
          remoteKey: gitea/runner-token
          property: value
  refreshInterval: 5m
  updatePolicy: Replace
{{- end }}
