{{- /*
  zz-crd-ready-wait.yaml — Waits for CRDs to become Established before any
  resource that depends on them is created.

  A PRE-INSTALL / PRE-UPGRADE hook, and it has to be one. It used to be a
  post-install hook, which made it useless for the case it exists for: Helm
  creates the release's resources BEFORE a post-install hook runs, so on a
  cluster without the CRDs the install already died on the first CR
  ("no matches for kind \"ExternalSecret\" in version \"external-secrets.io\"")
  and a failed install never runs its post-install hooks — the Job's own
  "run 'make crds_apply'" diagnostic could not fire on exactly the case it
  was written for. As a pre-install hook the Job runs FIRST, fails loudly
  with that diagnostic, and the release never reaches the CRs.

  It cannot promise to run before a template is "interpreted" — Helm renders
  every template into the release manifest before it executes any hook, so
  the only guarantee a hook can give is about resources being CREATED. That
  is what this one gives.

  The wait is not a `kubectl wait` on named CRDs: the chart owns none of
  them, so it waits for every CRD in the groups the chart depends on. The
  chart creates no argoproj.io objects of its own (the Argo CRs are written
  at runtime by the controller's apply-workflows init container), but the
  Argo controller IS deployed by this chart and needs its CRDs, so that
  group stays in the list.

  The CRDs themselves are NOT in the chart — they live in the upstream
  submodules (shoggoth/argo-workflows/manifests/base/crds/full/ and
  shoggoth/external-secrets/deploy/crds/bundle.yaml) and are applied by
  `make crds_apply` before Helm runs, because a chart's crds/ tree is
  embedded in the release Secret (see make/k3s.mk crds_apply, where the
  byte-budget math lives). This hook is the safety net for a
  `helm upgrade --install` run outside `make up`.

  The RBAC trio below is part of the hook, not an ordinary resource. Helm
  applies hook resources before the rest of the release, so a Job that needs
  a ServiceAccount and a ClusterRoleBinding cannot have them as ordinary
  resources: they would not exist yet when the hook runs. They carry a
  LOWER weight than the Job (-10 vs -5) so the binding is in place before
  the Job's pod makes its first API call. At an equal weight Helm's kind
  order happens to put them first (ServiceAccount -> ClusterRole ->
  ClusterRoleBinding -> Job), but the Job's pod can still be admitted and
  start before the binding exists, and the script deliberately does not
  swallow a 403.

  The trio is deleted when the hook finishes, on success and on failure:
  hook resources are not part of the release manifest, so `helm uninstall`
  does not reclaim them, and a cluster-scoped ClusterRole left behind by a
  failed install would outlive the release. The Job itself is kept on
  failure (no `hook-failed` in its policy) because its pod logs are the
  only place the "run 'make crds_apply'" text appears — Helm prints no pod
  output for a failed hook — and its ttlSecondsAfterFinished reaps it ten
  minutes later.

  Cluster-scoped RBAC: CRDs are not namespaced, so this needs a ClusterRole.
  A namespaced Role cannot authorize them at all.
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "shoggoth.fullname" . }}-crd-ready-wait
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shoggoth.labels" . | nindent 4 }}
    app.kubernetes.io/component: crd-ready-wait
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded,hook-failed
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "shoggoth.fullname" . }}-crd-ready-wait
  labels:
    {{- include "shoggoth.labels" . | nindent 4 }}
    app.kubernetes.io/component: crd-ready-wait
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded,hook-failed
rules:
# `kubectl wait` does an internal LIST + WATCH, not just GET — without
# list + watch the wait fails with "cannot list resource
# customresourcedefinitions". Same trap as the wait-bootstrap Role in
# argo-workflows.yaml.
- apiGroups: ["apiextensions.k8s.io"]
  resources: ["customresourcedefinitions"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "shoggoth.fullname" . }}-crd-ready-wait
  labels:
    {{- include "shoggoth.labels" . | nindent 4 }}
    app.kubernetes.io/component: crd-ready-wait
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded,hook-failed
subjects:
  - kind: ServiceAccount
    name: {{ include "shoggoth.fullname" . }}-crd-ready-wait
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "shoggoth.fullname" . }}-crd-ready-wait
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "shoggoth.fullname" . }}-crd-ready-wait-{{ .Release.Revision }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shoggoth.labels" . | nindent 4 }}
    app.kubernetes.io/component: crd-ready-wait
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    # No `hook-failed` here, unlike the RBAC trio above: this Job's pod log
    # is the only place the "run 'make crds_apply'" diagnostic is printed —
    # Helm prints no pod output for a failed hook — so a failed Job is kept
    # for inspection and reaped by ttlSecondsAfterFinished instead.
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
    # ...and this annotation is what makes Helm print that log itself.
    # `helm.sh/hook-output-log-policy: hook-failed` asks Helm to stream the
    # hook pod's container log to stderr when the hook fails — a failed Job,
    # or Helm's own --timeout expiring while the Job is still running.
    "helm.sh/hook-output-log-policy": "hook-failed"
spec:
  # One retry, not three. Every attempt costs the full WAIT_TIMEOUT (120s),
  # and Helm's watch on this Job has one deadline (--timeout, 10m by
  # default): four attempts of 120s plus the backoff in between land on it,
  # so a CRD that never becomes Established ends as Helm's generic "timed
  # out waiting for the condition" instead of this hook's own diagnostic.
  # Two attempts still absorb a slow API server and still fail — loudly,
  # and in time — before Helm's deadline.
  backoffLimit: 1
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        {{- include "shoggoth.labels" . | nindent 8 }}
        app.kubernetes.io/component: crd-ready-wait
    spec:
      serviceAccountName: {{ include "shoggoth.fullname" . }}-crd-ready-wait
      restartPolicy: Never
      {{- with .Values.image.registries }}
      imagePullSecrets:
      {{- range . }}
        - name: {{ . }}
      {{- end }}
      {{- end }}
      containers:
        - name: wait
          # Same tools image as every other kubectl-using container in this
          # chart. It must NOT be registry.k8s.io/*: that registry is not in
          # the k3s mirror list (shoggoth/shoggoth.nix) and the cluster is
          # offline-first, so such a pod never pulls and the Job dies with
          # BackoffLimitExceeded — which fails the whole release.
          image: asherikov/shoggoth_tools:alpine
          imagePullPolicy: IfNotPresent
          env:
            - name: KUBECTL_NAMESPACE
              value: {{ .Release.Namespace }}
            # The chart's services.cc extras can opt services out of the wait by
            # listing them here; default empty means wait for CRD existence only
            # (Established is up to API server regardless of service flag).
            - name: CRD_GROUPS
              value: "argoproj.io,external-secrets.io"
            - name: WAIT_TIMEOUT
              value: "120s"
          command:
            - /bin/bash
            - -ec
            # Single `$`, deliberately. Helm copies template text that sits
            # outside a template action verbatim and has NO `$$` escape — that
            # is a shell heredoc convention, not a Helm one. So `$${VAR}`
            # reaches bash as `$$` (the shell PID) followed by a literal
            # `{VAR}`, every expansion below resolved to garbage, and the
            # whole script fell through to the "no CRDs found -> exit 0"
            # branch. This hook has therefore never actually waited for
            # anything. Every other script in this chart uses single `$`.
            - |
              set -euo pipefail
              : "${KUBECTL_NAMESPACE:?}"
              : "${CRD_GROUPS:?}"
              : "${WAIT_TIMEOUT:?}"
              # Named CRD_GROUP_LIST, not GROUPS: GROUPS is a bash special
              # array (the caller's group IDs) and `read -a GROUPS` fails on
              # it, which under `set -e` aborted the script at this line.
              IFS=',' read -r -a CRD_GROUP_LIST <<< "${CRD_GROUPS}"

              # Retries for the two calls that can fail fast and silently.
              # A kubectl that cannot REACH the API server says nothing about
              # the CRDs, and this hook runs at the least idle moment of the
              # whole install: `make crds_apply` has just pushed ~11 MB of CRD
              # manifests into the API server server-side, and it re-runs the
              # establish step for every CRD it touched. `kubectl wait` below
              # is deliberately NOT wrapped — it carries its own --timeout and
              # the Job's backoffLimit retries the whole attempt, so wrapping
              # it would multiply the one budget that has to stay inside
              # Helm's --timeout.
              API_RETRIES="${API_RETRIES:-3}"
              API_RETRY_DELAY="${API_RETRY_DELAY:-5}"
              kctl() {
                local attempt=1 errfile rc
                errfile="${TMPDIR:-/tmp}/kctl-$$-${RANDOM}.err"
                while :; do
                  # `rc` is captured on the assignment's own line: a `cat` of
                  # the stderr file in between would overwrite `$?` and every
                  # failure would be reported as exit 0.
                  rc=0
                  "$@" 2>"${errfile}" || rc=$?
                  if [ "${rc}" = 0 ]; then
                    cat "${errfile}" >&2 || true
                    rm -f "${errfile}"
                    return 0
                  fi
                  cat "${errfile}" >&2 || true
                  if [ "${attempt}" -ge "${API_RETRIES}" ]; then
                    echo "FAIL: '$*' failed after ${API_RETRIES} attempts (exit ${rc})" >&2
                    rm -f "${errfile}"
                    return "${rc}"
                  fi
                  echo "  attempt ${attempt}/${API_RETRIES} of '$*' failed (exit ${rc}); retrying in ${API_RETRY_DELAY}s" >&2
                  attempt=$((attempt + 1))
                  sleep "${API_RETRY_DELAY}"
                done
              }

              # ONE API call for the whole inventory, not one per group.
              # `kubectl get crd -o jsonpath` fetches every CRD object in full
              # and filters client-side, so the per-group call was downloading
              # the entire inventory once per group — ~30 CRDs, several of them
              # multi-megabyte — on the least idle moment of the install.
              # Fetching once and splitting by group locally halves that
              # payload, and it is what makes the per-group check below
              # possible at all.
              if ! INVENTORY=$(kctl kubectl get crd -o jsonpath='{range .items[*]}{.spec.group}{"\t"}{.metadata.name}{"\n"}{end}'); then
                echo "FAIL: could not read the CRD inventory from the API server" >&2
                echo "      run 'make crds_apply' — the CRDs live outside the chart." >&2
                exit 1
              fi

              NAMES=()
              for g in "${CRD_GROUP_LIST[@]}"; do
                # A group with no CRDs is a hard failure, and it used to be
                # invisible. The per-group `kubectl get crd` sat in a process
                # substitution (`done < <(kubectl …)`), whose exit status
                # `set -e` never sees: an unreachable API server left that
                # group's list empty and the hook went on to wait for the
                # OTHER groups only. That is how this hook once waited for
                # eight Argo CRDs and zero external-secrets.io ones, on a
                # cluster where the ESO CRDs were installed and being queried
                # three minutes earlier — and the "no CRDs found" branch below
                # never fired, because NAMES was not empty.
                GROUP_NAMES=()
                while IFS=$'\t' read -r grp name; do
                  if [ "${grp}" = "${g}" ] && [ -n "${name}" ]; then
                    GROUP_NAMES+=("${name}")
                  fi
                done <<< "${INVENTORY}"
                if [ ${#GROUP_NAMES[@]} -eq 0 ]; then
                  echo "FAIL: no CRDs found in API group '${g}' (wanted groups: ${CRD_GROUPS})" >&2
                  echo "      run 'make crds_apply' — the CRDs live outside the chart." >&2
                  if [ -n "${INVENTORY}" ]; then
                    echo "      groups the API server does serve:" >&2
                    cut -f1 <<< "${INVENTORY}" | sort -u | sed 's/^/        /' >&2
                  fi
                  exit 1
                fi
                echo "API group '${g}': ${#GROUP_NAMES[@]} CRDs"
                NAMES+=("${GROUP_NAMES[@]}")
              done
              echo "Waiting for ${#NAMES[@]} CRDs to be Established: ${NAMES[*]}"
              if ! kubectl wait --for=condition=Established --timeout="${WAIT_TIMEOUT}" \
                      customresourcedefinition "${NAMES[@]}"; then
                # Name the stragglers. Both messages this hook used to end on
                # — "Unable to connect to the server" and "timed out waiting
                # for the condition" — leave the operator guessing which CRD
                # is at fault, and on this chart the answer is almost always
                # the two biggest Argo ones (clusterworkflowtemplates,
                # cronworkflows — 2.7 and 2.9 MB of embedded WorkflowSpec
                # schema), which the API server finishes last.
                declare -A ESTABLISHED=()
                while IFS=$'\t' read -r cname cstatus; do
                  if [ -n "${cname}" ]; then
                    ESTABLISHED["${cname}"]="${cstatus}"
                  fi
                done <<< "$(kctl kubectl get crd -o jsonpath='{range .items[*]}{.metadata.name}{"\t"}{.status.conditions[?(@.type=="Established")].status}{"\n"}{end}' || true)"
                for n in "${NAMES[@]}"; do
                  st="${ESTABLISHED[${n}]:-unknown}"
                  if [ "${st}" != "True" ]; then
                    echo "        ${n} (Established=${st})" >&2
                  fi
                done
                echo "FAIL: not every CRD became Established within ${WAIT_TIMEOUT}" >&2
                echo "      run 'make crds_apply' — the CRDs live outside the chart." >&2
                exit 1
              fi
