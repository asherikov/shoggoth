{{- /*
  zz-crd-ready-wait.yaml — Waits for CRDs to become Established before any
  resource that depends on them is created.

  A PRE-INSTALL / PRE-UPGRADE hook, and it has to be one. It used to be a
  post-install hook, which made it useless for the case it exists for: Helm
  creates the release's resources BEFORE a post-install hook runs, so on a
  cluster without the CRDs the install already died on the first CR
  ("no matches for kind \"ExternalSecret\" in version \"external-secrets.io\"")
  and a failed install never runs its post-install hooks — the Job's own
  diagnostic could not fire on exactly the case it
  was written for. As a pre-install hook the Job runs FIRST, fails loudly
  with it, and the release never reaches the CRs.

  It cannot promise to run before a template is "interpreted" — Helm renders
  every template into the release manifest before it executes any hook, so
  the only guarantee a hook can give is about resources being CREATED. That
  is what this one gives.

  The wait is not a `kubectl wait` on named CRDs: the chart owns none of
  them, so it waits for every CRD in the groups the chart depends on. The
  chart creates no argoproj.io objects of its own (the Argo CRs are written
  at runtime by the controller's apply-workflows init container), but the
  Argo controller IS deployed by this chart and needs its CRDs, so that
  group stays in the list.

  The CRDs themselves are NOT in the chart — they live in the upstream
  submodules (shoggoth/crd/argo-workflows/manifests/base/crds/full/ and
  shoggoth/crd/external-secrets/deploy/crds/bundle.yaml) and have to be
  applied before Helm runs, because a chart's crds/ tree is embedded in the
  release Secret and ~11 MB of CRD schema blows past its 1048576-byte
  Secret.data cap. This hook is the safety net for a
  `helm upgrade --install` run on a cluster that does not have them.

  The RBAC trio below is part of the hook, not an ordinary resource. Helm
  applies hook resources before the rest of the release, so a Job that needs
  a ServiceAccount and a ClusterRoleBinding cannot have them as ordinary
  resources: they would not exist yet when the hook runs. They carry a
  LOWER weight than the Job (-10 vs -5) so the binding is in place before
  the Job's pod makes its first API call. At an equal weight Helm's kind
  order happens to put them first (ServiceAccount -> ClusterRole ->
  ClusterRoleBinding -> Job), but the Job's pod can still be admitted and
  start before the binding exists, and the script deliberately does not
  swallow a 403.

  The trio is deleted when the hook finishes, on success and on failure:
  hook resources are not part of the release manifest, so `helm uninstall`
  does not reclaim them, and a cluster-scoped ClusterRole left behind by a
  failed install would outlive the release. The Job itself is kept on
  failure (no `hook-failed` in its policy) because its pod logs are the
  only place the CRD diagnostic appears — Helm prints no pod
  output for a failed hook — and its ttlSecondsAfterFinished reaps it ten
  minutes later.

  Cluster-scoped RBAC: CRDs are not namespaced, so this needs a ClusterRole.
  A namespaced Role cannot authorize them at all.
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "shoggoth.fullname" . }}-crd-ready-wait
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shoggoth.labels" . | nindent 4 }}
    app.kubernetes.io/component: crd-ready-wait
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded,hook-failed
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "shoggoth.fullname" . }}-crd-ready-wait
  labels:
    {{- include "shoggoth.labels" . | nindent 4 }}
    app.kubernetes.io/component: crd-ready-wait
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded,hook-failed
rules:
# `kubectl wait` does an internal LIST + WATCH, not just GET — without
# list + watch the wait fails with "cannot list resource
# customresourcedefinitions". Same trap as the wait-bootstrap Role in
# argo-workflows.yaml.
- apiGroups: ["apiextensions.k8s.io"]
  resources: ["customresourcedefinitions"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "shoggoth.fullname" . }}-crd-ready-wait
  labels:
    {{- include "shoggoth.labels" . | nindent 4 }}
    app.kubernetes.io/component: crd-ready-wait
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded,hook-failed
subjects:
  - kind: ServiceAccount
    name: {{ include "shoggoth.fullname" . }}-crd-ready-wait
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "shoggoth.fullname" . }}-crd-ready-wait
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "shoggoth.fullname" . }}-crd-ready-wait-{{ .Release.Revision }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shoggoth.labels" . | nindent 4 }}
    app.kubernetes.io/component: crd-ready-wait
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    # No `hook-failed` here, unlike the RBAC trio above: this Job's pod log
    # is the only place the CRD diagnostic is printed —
    # Helm prints no pod output for a failed hook — so a failed Job is kept
    # for inspection and reaped by ttlSecondsAfterFinished instead.
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
    # ...and this annotation is what makes Helm print that log itself.
    # `helm.sh/hook-output-log-policy: hook-failed` asks Helm to stream the
    # hook pod's container log to stderr when the hook fails — a failed Job,
    # or Helm's own --timeout expiring while the Job is still running.
    "helm.sh/hook-output-log-policy": "hook-failed"
spec:
  # One retry, not three. Every attempt costs the full WAIT_TIMEOUT (120s),
  # and Helm's watch on this Job has one deadline (--timeout, 10m by
  # default): four attempts of 120s plus the backoff in between land on it,
  # so a CRD that never becomes Established ends as Helm's generic "timed
  # out waiting for the condition" instead of this hook's own diagnostic.
  # Two attempts still absorb a slow API server and still fail — loudly,
  # and in time — before Helm's deadline.
  backoffLimit: 1
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        {{- include "shoggoth.labels" . | nindent 8 }}
        app.kubernetes.io/component: crd-ready-wait
    spec:
      serviceAccountName: {{ include "shoggoth.fullname" . }}-crd-ready-wait
      # Spelled out rather than left to the default, which is also true. This
      # pod has no kubeconfig of any kind, so the token and CA projected from
      # this ServiceAccount are where the script below gets its credentials: it
      # reads them straight out of the volume and writes a kubeconfig from
      # them. `false` here would not degrade the hook, it would leave it with
      # no credentials at all.
      automountServiceAccountToken: true
      restartPolicy: Never
      {{- with .Values.image.registries }}
      imagePullSecrets:
      {{- range . }}
        - name: {{ . }}
      {{- end }}
      {{- end }}
      containers:
        - name: wait
          # Same tools image as every other kubectl-using container in this
          # chart. It must NOT be registry.k8s.io/*: that registry is not in
          # the k3s mirror list (shoggoth/shoggoth.nix) and the cluster is
          # offline-first, so such a pod never pulls and the Job dies with
          # BackoffLimitExceeded — which fails the whole release.
          image: asherikov/shoggoth_tools:alpine
          imagePullPolicy: IfNotPresent
          env:
            - name: KUBECTL_NAMESPACE
              value: {{ .Release.Namespace }}
            # The chart's services.cc extras can opt services out of the wait by
            # listing them here; default empty means wait for CRD existence only
            # (Established is up to API server regardless of service flag).
            - name: CRD_GROUPS
              value: "argoproj.io,external-secrets.io"
            - name: WAIT_TIMEOUT
              value: "120s"
          command:
            - /bin/bash
            - -ec
            # Single `$`, deliberately. Helm copies template text that sits
            # outside a template action verbatim and has NO `$$` escape — that
            # is a shell heredoc convention, not a Helm one. So `$${VAR}`
            # reaches bash as `$$` (the shell PID) followed by a literal
            # `{VAR}`, every expansion below resolved to garbage, and the
            # whole script fell through to the "no CRDs found -> exit 0"
            # branch. This hook has therefore never actually waited for
            # anything. Every other script in this chart uses single `$`.
            - |
              set -euo pipefail
              : "${KUBECTL_NAMESPACE:?}"
              : "${CRD_GROUPS:?}"
              : "${WAIT_TIMEOUT:?}"

              # PREFLIGHT: hand kubectl a kubeconfig, then ask it what it
              # resolved.
              #
              # This check used to verify the two facts the in-cluster config
              # needs — KUBERNETES_SERVICE_HOST/PORT and the projected token —
              # on the theory that with them present client-go would build the
              # in-cluster config by itself. That theory is wrong, and the
              # install that carried it proved so: the pod had all of them, the
              # check passed in silence, and every call still went to
              #
              #     Get "http://localhost:8080/api?timeout=30s":
              #       dial tcp [::1]:8080: connect: connection refused
              #
              # http://localhost:8080 is not an error message. It is
              # clientcmd.ClusterDefaults — `clientcmdapi.Cluster{Server:
              # getDefaultServer()}` — merged into the cluster info by
              # DirectClientConfig.getCluster() as though it were a server
              # somebody had configured. A pod with no kubeconfig therefore
              # resolves to a VALID config pointing at loopback, and
              # DeferredLoadingClientConfig.ClientConfig() reaches the
              # in-cluster config only when the kubeconfig-derived config
              # equals that default:
              #
              #     case mergedConfig != nil:
              #         if !config.loader.IsDefaultConfig(mergedConfig) {
              #             return mergedConfig, nil
              #         }
              #     ...
              #     if config.icc.Possible() { return config.icc.ClientConfig() }
              #     return mergedConfig, err        <-- loopback, err == nil
              #
              # in-cluster is a branch there, not a fallback, and nothing about
              # a missing credential is reported when the branch is not taken.
              # Checking the facts client-go WOULD have needed cannot see that,
              # which is why the previous version of this check passed on a pod
              # whose every API call was dying.
              #
              # So the config is written here instead of discovered, from the
              # three facts the ServiceAccount admission plugin gives every
              # pod. cdash.yaml and redmine.yaml already do the equivalent —
              # they build https://${KUBERNETES_SERVICE_HOST}:${KUBERNETES_
              # SERVICE_PORT} and pass the token and CA explicitly rather than
              # letting kubectl find them. This hook needs kubectl's verbs, so
              # it gets the same three facts in kubectl's own format.
              SA_DIR=/var/run/secrets/kubernetes.io/serviceaccount

              if [ -z "${KUBERNETES_SERVICE_HOST:-}" ] || [ -z "${KUBERNETES_SERVICE_PORT:-}" ]; then
                  echo "FAIL: this pod has no in-cluster Kubernetes credentials." >&2
                  echo "      KUBERNETES_SERVICE_HOST='${KUBERNETES_SERVICE_HOST:-<unset>}'" >&2
                  echo "      KUBERNETES_SERVICE_PORT='${KUBERNETES_SERVICE_PORT:-<unset>}'" >&2
                  echo "      The kubelet injects both from the 'kubernetes' service; neither being" >&2
                  echo "      present means this pod was admitted without a ServiceAccount at all." >&2
                  echo "      Inspect what the pod was actually given:" >&2
                  echo "        kubectl -n ${KUBECTL_NAMESPACE} get pod -l app.kubernetes.io/component=crd-ready-wait -o yaml" >&2
                  exit 1
              fi
              # The CA is checked alongside the token because the kubeconfig
              # below references it by path: a projected volume that carries
              # one and not the other is a pod that cannot talk TLS, and the
              # failure would otherwise surface as a certificate error naming
              # neither the volume nor the hook.
              for cred in token ca.crt; do
                  if [ ! -r "${SA_DIR}/${cred}" ]; then
                      echo "FAIL: this pod has no ServiceAccount ${cred} at ${SA_DIR}/${cred}." >&2
                      echo "      It is projected from the ServiceAccount this Job names, so the volume" >&2
                      echo "      is absent — not unreadable, not wrong: missing." >&2
                      echo "        kubectl -n ${KUBECTL_NAMESPACE} get pod -l app.kubernetes.io/component=crd-ready-wait -o yaml" >&2
                      exit 1
                  fi
              done

              KUBECONFIG="${TMPDIR:-/tmp}/kubeconfig"
              {
                  echo "apiVersion: v1"
                  echo "kind: Config"
                  echo "clusters:"
                  echo "- name: in-cluster"
                  echo "  cluster:"
                  echo "    server: https://${KUBERNETES_SERVICE_HOST}:${KUBERNETES_SERVICE_PORT}"
                  echo "    certificate-authority: ${SA_DIR}/ca.crt"
                  echo "users:"
                  echo "- name: hook"
                  echo "  user:"
                  echo "    token: $(cat "${SA_DIR}/token")"
                  echo "contexts:"
                  echo "- name: hook"
                  echo "  context:"
                  echo "    cluster: in-cluster"
                  echo "    user: hook"
                  echo "    namespace: ${KUBECTL_NAMESPACE}"
                  echo "current-context: hook"
              } > "${KUBECONFIG}"
              chmod 600 "${KUBECONFIG}"
              export KUBECONFIG

              # The check that would have caught the failure: not the facts
              # kubectl might need, but the server it actually resolved.
              # `config view` is local — it reads KUBECONFIG and touches
              # nothing — so this cannot fail for a connectivity reason, and
              # an empty answer is itself the verdict.
              RESOLVED="$(kubectl config view --minify \
                  -o jsonpath='{.clusters[0].cluster.server}' 2>/dev/null || true)"
              if [ "${RESOLVED}" != "https://${KUBERNETES_SERVICE_HOST}:${KUBERNETES_SERVICE_PORT}" ]; then
                  echo "FAIL: kubectl resolved its API server to '${RESOLVED:-<nothing>}'," >&2
                  echo "      not https://${KUBERNETES_SERVICE_HOST}:${KUBERNETES_SERVICE_PORT}." >&2
                  echo "      With no kubeconfig resolving a cluster, client-go substitutes" >&2
                  echo "      http://localhost:8080 and reports no error at all, so every call" >&2
                  echo "      below fails on loopback in milliseconds. That is a configuration" >&2
                  echo "      verdict about this pod, not a connectivity one, and retrying it" >&2
                  echo "      changes nothing. KUBECONFIG=${KUBECONFIG} HOME=${HOME:-<unset>}." >&2
                  exit 1
              fi

              # Named CRD_GROUP_LIST, not GROUPS: GROUPS is a bash special
              # array (the caller's group IDs) and `read -a GROUPS` fails on
              # it, which under `set -e` aborted the script at this line.
              IFS=',' read -r -a CRD_GROUP_LIST <<< "${CRD_GROUPS}"

              # Retries for the two calls that can fail fast and silently.
              # A kubectl that cannot REACH the API server says nothing about
              # the CRDs, and this hook runs at the least idle moment of the
              # whole install: the install has just pushed ~11 MB of CRD
              # manifests into the API server server-side, and it re-runs the
              # establish step for every CRD it touched. `kubectl wait` below
              # is deliberately NOT wrapped — it carries its own --timeout and
              # the Job's backoffLimit retries the whole attempt, so wrapping
              # it would multiply the one budget that has to stay inside
              # Helm's --timeout.
              API_RETRIES="${API_RETRIES:-3}"
              API_RETRY_DELAY="${API_RETRY_DELAY:-5}"
              kctl() {
                local attempt=1 errfile rc
                errfile="${TMPDIR:-/tmp}/kctl-$$-${RANDOM}.err"
                while :; do
                  # `rc` is captured on the assignment's own line: a `cat` of
                  # the stderr file in between would overwrite `$?` and every
                  # failure would be reported as exit 0.
                  rc=0
                  "$@" 2>"${errfile}" || rc=$?
                  if [ "${rc}" = 0 ]; then
                    cat "${errfile}" >&2 || true
                    rm -f "${errfile}"
                    return 0
                  fi
                  cat "${errfile}" >&2 || true
                  if [ "${attempt}" -ge "${API_RETRIES}" ]; then
                    echo "FAIL: '$*' failed after ${API_RETRIES} attempts (exit ${rc})" >&2
                    rm -f "${errfile}"
                    return "${rc}"
                  fi
                  echo "  attempt ${attempt}/${API_RETRIES} of '$*' failed (exit ${rc}); retrying in ${API_RETRY_DELAY}s" >&2
                  attempt=$((attempt + 1))
                  sleep "${API_RETRY_DELAY}"
                done
              }

              # ONE API call for the whole inventory, not one per group.
              # `kubectl get crd -o jsonpath` fetches every CRD object in full
              # and filters client-side, so the per-group call was downloading
              # the entire inventory once per group — ~30 CRDs, several of them
              # multi-megabyte — on the least idle moment of the install.
              # Fetching once and splitting by group locally halves that
              # payload, and it is what makes the per-group check below
              # possible at all.
              if ! INVENTORY=$(kctl kubectl get crd -o jsonpath='{range .items[*]}{.spec.group}{"\t"}{.metadata.name}{"\n"}{end}'); then
                echo "FAIL: could not read the CRD inventory from the API server" >&2
                echo "      the CRDs live outside the chart — run 'make up' to apply them." >&2
                exit 1
              fi

              NAMES=()
              for g in "${CRD_GROUP_LIST[@]}"; do
                # A group with no CRDs is a hard failure, and it used to be
                # invisible. The per-group `kubectl get crd` sat in a process
                # substitution (`done < <(kubectl …)`), whose exit status
                # `set -e` never sees: an unreachable API server left that
                # group's list empty and the hook went on to wait for the
                # OTHER groups only. That is how this hook once waited for
                # eight Argo CRDs and zero external-secrets.io ones, on a
                # cluster where the ESO CRDs were installed and being queried
                # three minutes earlier — and the "no CRDs found" branch below
                # never fired, because NAMES was not empty.
                GROUP_NAMES=()
                while IFS=$'\t' read -r grp name; do
                  if [ "${grp}" = "${g}" ] && [ -n "${name}" ]; then
                    GROUP_NAMES+=("${name}")
                  fi
                done <<< "${INVENTORY}"
                if [ ${#GROUP_NAMES[@]} -eq 0 ]; then
                  echo "FAIL: no CRDs found in API group '${g}' (wanted groups: ${CRD_GROUPS})" >&2
                  echo "      the CRDs live outside the chart — run 'make up' to apply them." >&2
                  if [ -n "${INVENTORY}" ]; then
                    echo "      groups the API server does serve:" >&2
                    cut -f1 <<< "${INVENTORY}" | sort -u | sed 's/^/        /' >&2
                  fi
                  exit 1
                fi
                echo "API group '${g}': ${#GROUP_NAMES[@]} CRDs"
                NAMES+=("${GROUP_NAMES[@]}")
              done
              echo "Waiting for ${#NAMES[@]} CRDs to be Established: ${NAMES[*]}"
              if ! kubectl wait --for=condition=Established --timeout="${WAIT_TIMEOUT}" \
                      customresourcedefinition "${NAMES[@]}"; then
                # `kubectl wait` says only that it stopped, not why, and the
                # two reasons need opposite responses:
                #
                #   * a CRD is genuinely not Established — name it and fail;
                #   * the connection to the API server died mid-wait, which
                #     says nothing about any CRD.
                #
                # Both used to be reported the same way, and wrongly. The
                # straggler read ended in `|| true`, so a transport failure
                # left ESTABLISHED empty and every CRD in NAMES was printed
                # as `Established=unknown` — a verdict this script had not
                # obtained. That is how a run in which `kubectl wait` had
                # already printed `condition met` for twelve of the fourteen
                # CRDs still ended on "not every CRD became Established
                # within 120s" with all fourteen listed as unknown. Same
                # conflation argo-workflows.yaml's apply-workflows init
                # container was fixed for: a read that failed is not a read
                # that said no, and readability comes before judgement.
                #
                # The read is required now, and `kctl` retries it. It is one
                # inventory call against a budget that has already spent its
                # wait, so it does not touch the arithmetic the unwrapped
                # `kubectl wait` above is protected by.
                STATUSES=""
                if ! STATUSES=$(kctl kubectl get crd -o jsonpath='{range .items[*]}{.metadata.name}{"\t"}{.status.conditions[?(@.type=="Established")].status}{"\n"}{end}'); then
                  echo "FAIL: could not read the CRD statuses from the API server" >&2
                  echo "      kubectl wait failed and so did the follow-up read, so this" >&2
                  echo "      hook holds no evidence about any CRD's Established condition." >&2
                  echo "      That is a pod->API-server connectivity failure or a missing RBAC" >&2
                  echo "      grant, not a CRD problem — the same i/o timeout class this chart" >&2
                  echo "      documents elsewhere. Check the API server, not the CRDs." >&2
                  exit 1
                fi
                declare -A ESTABLISHED=()
                while IFS=$'\t' read -r cname cstatus; do
                  if [ -n "${cname}" ]; then
                    ESTABLISHED["${cname}"]="${cstatus}"
                  fi
                done <<< "${STATUSES}"
                STRAGGLERS=()
                for n in "${NAMES[@]}"; do
                  st="${ESTABLISHED[${n}]:-unknown}"
                  if [ "${st}" != "True" ]; then
                    STRAGGLERS+=("${n} (Established=${st})")
                  fi
                done
                if [ "${#STRAGGLERS[@]}" -eq 0 ]; then
                  # Every CRD is Established, so the wait's non-zero exit was
                  # a transport failure that landed after it had already
                  # observed the conditions. Failing the install here would
                  # fail it over a blip that cost nothing.
                  echo "all ${#NAMES[@]} CRDs are Established; kubectl wait's non-zero exit was a transport failure, not a CRD"
                else
                  # Real stragglers. On this chart they are almost always the
                  # two biggest Argo ones (clusterworkflowtemplates,
                  # cronworkflows — 2.7 and 2.9 MB of embedded WorkflowSpec
                  # schema), which the API server finishes last.
                  for s in "${STRAGGLERS[@]}"; do
                    echo "        ${s}" >&2
                  done
                  echo "FAIL: not every CRD became Established within ${WAIT_TIMEOUT}" >&2
                  echo "      the CRDs live outside the chart — run 'make up' to apply them." >&2
                  exit 1
                fi
              fi
