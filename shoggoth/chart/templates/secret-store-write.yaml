{{- /*
  templates/secret-store-write.yaml — write-scoped OpenBao SecretStore.

  Used by maintenance-secret-writer and similar in-cluster tooling that
  needs to push secret data into OpenBao. Authenticated via the dedicated
  shoggoth-openbao-eso-write-token, scoped to the write policy.
*/}}
{{- if (include "shoggoth.isServiceEnabled" (list . "secret-store-write")) }}
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: shoggoth-openbao-write
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shoggoth.labels" . | nindent 4 }}
    app.kubernetes.io/component: secret-store-write
spec:
  provider:
    vault:
      server: http://openbao:80
      path: secret
      version: v2
      auth:
        tokenSecretRef:
          name: shoggoth-openbao-eso-write-token
          key: token
{{- end }}
