{{- /*
  templates/cdash.yaml — CDash CI dashboard + its Postgres backend.

  Two PVCs: `cdash-db` (Postgres data, mounted by the StatefulSet) and
  `cdash-storage` (Laravel storage/uploads/logs, mounted by the cdash
  Deployment). Both use the `local-path` StorageClass.

  The `cdash-init` ConfigMap runs from the cdash container's postStart hook:
  it seeds the `slave` user and mints a FULL_ACCESS API token, then writes it
  to Secret/cdash-api-token through the Kubernetes API using the pod's own
  ServiceAccount. The PushSecret in cdash-api-token-push.yaml mirrors that
  Secret into OpenBao, so the pod never holds an OpenBao credential.
  web-internal picks the token up on its next restart.
*/}}
{{- if (include "shoggoth.isServiceEnabled" (list . "cdash")) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cdash-db
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shoggoth.labels" . | nindent 4 }}
    app: cdash
    app.kubernetes.io/component: cdash
  annotations:
    # Kept across `helm uninstall` so uninstalling stops the workloads but
    # preserves data. Reinstall adopts it: shoggoth.labels survives
    # uninstall, so Helm's ownership check still passes.
    helm.sh/resource-policy: keep
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: local-path
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cdash-storage
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shoggoth.labels" . | nindent 4 }}
    app: cdash
    app.kubernetes.io/component: cdash
  annotations:
    # Kept across `helm uninstall` so uninstalling stops the workloads but
    # preserves data. Reinstall adopts it: shoggoth.labels survives
    # uninstall, so Helm's ownership check still passes.
    helm.sh/resource-policy: keep
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: local-path
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cdash-entrypoint
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shoggoth.labels" . | nindent 4 }}
    app: cdash
    app.kubernetes.io/component: cdash
data:
  entrypoint-wrapper.sh: |
    #!/usr/bin/env bash
    set -euo pipefail

    printf 'Listen 80\n' > /etc/apache2/ports.conf
    sed -i 's/:8080/:80/g' /etc/apache2/sites-enabled/cdash-site.conf

    exec /cdash/docker/docker-entrypoint.sh "$@"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cdash-init
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shoggoth.labels" . | nindent 4 }}
    app: cdash
    app.kubernetes.io/component: cdash
data:
  init.sh: |
    #!/usr/bin/env bash
    set -euo pipefail
    cd /cdash
    echo "shoggoth: Waiting for CDash to be ready..."
    for i in $(seq 1 30); do
        if php artisan migrate:status > /dev/null 2>&1; then
            break
        fi
        sleep 2
    done
    if ! php artisan migrate:status > /dev/null 2>&1; then
        echo "shoggoth: FATAL: CDash not ready after 60s" >&2
        exit 1
    fi
    echo "shoggoth: CDash is ready"
    php artisan user:save \
        --email=slave \
        --firstname=Slave \
        --lastname=User \
        --institution=shoggoth \
        --password="${OPENLDAP_SLAVE_PASSWORD}" \
        --admin=0 \
        || echo "shoggoth: WARNING: user:save failed (may already exist or DB issue)" >&2
    CDASH_URL="http://localhost"
    COOKIE_JAR="$(mktemp)"
    trap 'rm -f "${COOKIE_JAR}"' EXIT
    echo "shoggoth: Waiting for CDash web server..."
    for i in $(seq 1 30); do
        if curl -s -o /dev/null -w '%{http_code}' "${CDASH_URL}/login" 2>/dev/null | grep -q '^200'; then
            break
        fi
        sleep 2
    done
    if ! curl -s -o /dev/null -w '%{http_code}' "${CDASH_URL}/login" 2>/dev/null | grep -q '^200'; then
        echo "shoggoth: FATAL: CDash web server not ready after 60s" >&2
        exit 1
    fi
    echo "shoggoth: CDash web server is ready"
    CSRF_PAGE="$(curl -s -c "${COOKIE_JAR}" "${CDASH_URL}/login" 2>/dev/null)" || {
        echo "shoggoth: FATAL: Could not fetch CDash login page" >&2
        exit 1
    }
    CSRF_TOKEN="$(printf '%s' "${CSRF_PAGE}" \
        | sed -n 's/.*name="_token" value="\([^"]*\)".*/\1/p' | head -1)"
    if [ -z "${CSRF_TOKEN}" ]; then
        echo "shoggoth: FATAL: Could not get CSRF token from CDash login page" >&2
        exit 1
    fi
    LOGIN_RESULT="$(curl -s -b "${COOKIE_JAR}" -c "${COOKIE_JAR}" \
        -X POST "${CDASH_URL}/login" \
        -H "Content-Type: application/x-www-form-urlencoded" \
        -d "_token=${CSRF_TOKEN}&email=slave&password=${OPENLDAP_SLAVE_PASSWORD}" \
        -o /dev/null -w '%{http_code} %{redirect_url}')"
    LOGIN_CODE="${LOGIN_RESULT%% *}"
    LOGIN_REDIRECT="${LOGIN_RESULT#* }"
    if [ "${LOGIN_CODE}" = "302" ] && printf '%s' "${LOGIN_REDIRECT}" | grep -qE '^https?://[^/]+/login'; then
        echo "shoggoth: FATAL: CDash login failed for slave (redirected back to login)" >&2
        echo "shoggoth: Check /cdash/storage/logs/laravel.log for LDAP auth errors" >&2
        exit 1
    fi
    if [ "${LOGIN_CODE}" != "200" ] && [ "${LOGIN_CODE}" != "302" ]; then
        echo "shoggoth: FATAL: CDash login failed for slave (HTTP ${LOGIN_CODE})" >&2
        exit 1
    fi
    GRAPHQL_RESPONSE="$(curl -s -b "${COOKIE_JAR}" \
        -X POST "${CDASH_URL}/graphql" \
        -H "Content-Type: application/json" \
        -H "X-Requested-With: XMLHttpRequest" \
        -d '{
            "query": "query { authenticationTokens(first: 100000) { edges { node { id description } } } }"
        }')" || {
        echo "shoggoth: FATAL: GraphQL query for existing tokens failed" >&2
        exit 1
    }
    OLD_TOKEN_IDS="$(printf '%s' "${GRAPHQL_RESPONSE}" \
        | php -r '$d=json_decode(stream_get_contents(STDIN),true);foreach(($d["data"]["authenticationTokens"]["edges"]??[]) as $e){if(($e["node"]["description"]??"")==="shoggoth-slave"){echo $e["node"]["id"]."\n";}}')"
    for TOKEN_ID in ${OLD_TOKEN_IDS}; do
        curl -s -b "${COOKIE_JAR}" \
            -X POST "${CDASH_URL}/graphql" \
            -H "Content-Type: application/json" \
            -H "X-Requested-With: XMLHttpRequest" \
            -d "{\"query\": \"mutation DeleteToken(\$input: DeleteAuthenticationTokenInput!) { deleteAuthenticationToken(input: \$input) { message } }\", \"variables\": {\"input\": {\"tokenId\": ${TOKEN_ID}}}}" \
            > /dev/null 2>&1 || true
    done
    GRAPHQL_RESPONSE="$(curl -s -b "${COOKIE_JAR}" \
        -X POST "${CDASH_URL}/graphql" \
        -H "Content-Type: application/json" \
        -H "X-Requested-With: XMLHttpRequest" \
        -d '{
            "query": "mutation CreateToken($input: CreateAuthenticationTokenInput!) { createAuthenticationToken(input: $input) { rawToken } }",
            "variables": {
                "input": {
                    "scope": "FULL_ACCESS",
                    "description": "shoggoth-slave",
                    "expiration": "2999-12-31T23:59:59Z"
                }
            }
        }')" || {
        echo "shoggoth: FATAL: GraphQL createAuthenticationToken request failed" >&2
        exit 1
    }
    RAW_TOKEN="$(printf '%s' "${GRAPHQL_RESPONSE}" \
        | php -r '$d=json_decode(stream_get_contents(STDIN),true);echo $d["data"]["createAuthenticationToken"]["rawToken"]??"";')"
    if [ -z "${RAW_TOKEN}" ]; then
        echo "shoggoth: FATAL: GraphQL did not return a raw token" >&2
        printf '%s\n' "${GRAPHQL_RESPONSE}" >&2
        exit 1
    fi
    SA_TOKEN_PATH="/var/run/secrets/kubernetes.io/serviceaccount/token"
    SA_CA_PATH="/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
    SA_TOKEN=""
    if [ -f "${SA_TOKEN_PATH}" ]; then
        SA_TOKEN="$(cat "${SA_TOKEN_PATH}")"
    fi
    if [ -z "${SA_TOKEN}" ]; then
        echo "shoggoth: FATAL: service account token not mounted at ${SA_TOKEN_PATH}" >&2
        exit 1
    fi
    if [ ! -f "${SA_CA_PATH}" ]; then
        echo "shoggoth: FATAL: CA certificate not mounted at ${SA_CA_PATH}" >&2
        exit 1
    fi
    K8S_HOST="${KUBERNETES_SERVICE_HOST:-}"
    K8S_PORT="${KUBERNETES_SERVICE_PORT:-}"
    if [ -z "${K8S_HOST}" ] || [ -z "${K8S_PORT}" ]; then
        echo "shoggoth: FATAL: KUBERNETES_SERVICE_HOST or KUBERNETES_SERVICE_PORT not set" >&2
        exit 1
    fi
    if [ -z "${SHOGGOTH_NAMESPACE:-}" ]; then
        echo "shoggoth: FATAL: SHOGGOTH_NAMESPACE not set" >&2
        exit 1
    fi
    K8S_API="https://${K8S_HOST}:${K8S_PORT}"
    SECRET_URL="${K8S_API}/api/v1/namespaces/${SHOGGOTH_NAMESPACE}/secrets/cdash-api-token"
    SECRETS_URL="${K8S_API}/api/v1/namespaces/${SHOGGOTH_NAMESPACE}/secrets"
    TOKEN_B64="$(printf '%s' "${RAW_TOKEN}" | base64 -w0)"
    SECRET_MANIFEST="{\"apiVersion\":\"v1\",\"kind\":\"Secret\",\"metadata\":{\"name\":\"cdash-api-token\",\"namespace\":\"${SHOGGOTH_NAMESPACE}\"},\"type\":\"Opaque\",\"data\":{\"token\":\"${TOKEN_B64}\"}}"
    K8S_RESP="$(mktemp)"
    K8S_CODE="$(curl -sS --cacert "${SA_CA_PATH}" -w '%{http_code}' -o "${K8S_RESP}" \
        -X PUT \
        -H "Authorization: Bearer ${SA_TOKEN}" \
        -H "Content-Type: application/json" \
        -d "${SECRET_MANIFEST}" \
        "${SECRET_URL}" 2>/dev/null)" || K8S_CODE="000"
    if [ "${K8S_CODE}" = "404" ]; then
        K8S_CODE="$(curl -sS --cacert "${SA_CA_PATH}" -w '%{http_code}' -o "${K8S_RESP}" \
            -X POST \
            -H "Authorization: Bearer ${SA_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "${SECRET_MANIFEST}" \
            "${SECRETS_URL}" 2>/dev/null)" || K8S_CODE="000"
    fi
    if [ "${K8S_CODE}" != "200" ] && [ "${K8S_CODE}" != "201" ] && [ "${K8S_CODE}" != "202" ]; then
        echo "shoggoth: FATAL: Failed to write Secret cdash-api-token (HTTP ${K8S_CODE})" >&2
        echo "shoggoth: Response: $(head -c 400 "${K8S_RESP}" 2>/dev/null)" >&2
        rm -f "${K8S_RESP}"
        exit 1
    fi
    rm -f "${K8S_RESP}"
    echo "shoggoth: CDash slave token created and stored in Secret cdash-api-token"
    echo "shoggoth: Restart web-internal to pick up the new token"
---
{{- if (include "shoggoth.isServiceEnabled" (list . "cdash-db")) }}
apiVersion: v1
kind: Service
metadata:
  name: cdash-db
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shoggoth.labels" . | nindent 4 }}
    app: cdash-db
    app.kubernetes.io/component: cdash
spec:
  selector:
    app: cdash-db
  ports:
  - name: postgres
    port: 5432
    targetPort: 5432
{{- end }}
---
{{- if (include "shoggoth.isServiceEnabled" (list . "cdash-db")) }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cdash-db
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shoggoth.labels" . | nindent 4 }}
    app: cdash-db
    app.kubernetes.io/component: cdash
spec:
  serviceName: cdash-db
  replicas: 1
  selector:
    matchLabels:
      app: cdash-db
  template:
    metadata:
      labels:
        {{- include "shoggoth.selectorLabels" . | nindent 8 }}
        app: cdash-db
        app.kubernetes.io/component: cdash
    spec:
      {{- include "shoggoth.podDnsConfig" . | nindent 6 }}
      containers:
      - name: postgres
        image: postgres:18-alpine
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5432
          name: postgres
        env:
        - name: POSTGRES_DB
          value: cdash
        - name: POSTGRES_USER
          value: cdash
        - name: POSTGRES_PASSWORD_FILE
          value: /run/secrets/cdash_db_password
        - name: OTEL_TRACES_EXPORTER
          value: otlp
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://otelcol:4318
        - name: SHOGGOTH_DOMAIN
          value: {{ .Values.identity.domain }}
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql
        - name: db-password
          mountPath: /run/secrets/cdash_db_password
          subPath: password
          readOnly: true
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - cdash
          initialDelaySeconds: 5
          periodSeconds: 5
          failureThreshold: 60
        livenessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - cdash
          initialDelaySeconds: 30
          periodSeconds: 10
        resources:
          requests:
            memory: 256Mi
            cpu: 100m
          limits:
            memory: 512Mi
            cpu: 500m
      volumes:
      - name: db-password
        secret:
          secretName: cdash-db-password
      - name: data
        persistentVolumeClaim:
          claimName: cdash-db
      serviceAccountName: cdash-db
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: cdash
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shoggoth.labels" . | nindent 4 }}
    app: cdash
    app.kubernetes.io/component: cdash
spec:
  selector:
    app: cdash
  ports:
  - name: http
    port: 80
    targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cdash
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shoggoth.labels" . | nindent 4 }}
    app: cdash
    app.kubernetes.io/component: cdash
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cdash
  template:
    metadata:
      labels:
        {{- include "shoggoth.selectorLabels" . | nindent 8 }}
        app: cdash
        app.kubernetes.io/component: cdash
      annotations:
        secret.reloader.stakater.com/reload: cdash-db-password,cdash-app-key,openldap-ldapauth-password,openldap-slave-password
    spec:
      {{- include "shoggoth.podDnsConfig" . | nindent 6 }}
      containers:
      - name: cdash
        image: kitware/cdash:v5.4.0
        imagePullPolicy: IfNotPresent
        command:
        - /cdash/entrypoint-wrapper.sh
        args:
        - start-website
        ports:
        - containerPort: 80
          name: http
        env:
        - name: APP_URL
          value: http://cdash.{{ .Values.identity.domain }}
        - name: APP_KEY
          valueFrom:
            secretKeyRef:
              name: cdash-app-key
              key: app-key
        - name: DB_HOST
          value: cdash-db
        - name: DB_PORT
          value: '5432'
        - name: DB_DATABASE
          value: cdash
        - name: DB_USERNAME
          value: cdash
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: cdash-db-password
              key: password
        - name: QUEUE_CONNECTION
          value: database
        - name: CDASH_AUTHENTICATION_PROVIDER
          value: ldap
        - name: LOGIN_FIELD
          value: Username
        - name: LDAP_HOSTS
          value: openldap
        - name: LDAP_PORT
          value: '389'
        - name: LDAP_PROVIDER
          value: openldap
        - name: LDAP_LOCATE_USERS_BY
          value: uid
        - name: LDAP_USERNAME
          value: uid=ldapauth,ou=people,{{ include "shoggoth.ldapBaseDn" . }}
        - name: LDAP_PASSWORD
          valueFrom:
            secretKeyRef:
              name: openldap-ldapauth-password
              key: password
        - name: LDAP_BASE_DN
          value: {{ include "shoggoth.ldapBaseDn" . }}
        - name: USER_CREATE_PROJECTS
          value: 'true'
        - name: TOKEN_DURATION
          value: '0'
        - name: OPENLDAP_SLAVE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: openldap-slave-password
              key: password
        - name: OTEL_TRACES_EXPORTER
          value: otlp
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://otelcol:4318
        - name: SHOGGOTH_DOMAIN
          value: {{ .Values.identity.domain }}
        - name: SHOGGOTH_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        volumeMounts:
        - name: storage
          mountPath: /cdash/storage
        - name: entrypoint-script
          mountPath: /cdash/entrypoint-wrapper.sh
          subPath: entrypoint-wrapper.sh
          readOnly: true
        - name: init-script
          mountPath: /shoggoth/cdash/init.sh
          subPath: init.sh
          readOnly: true
        - name: db-password
          mountPath: /run/secrets/cdash_db_password
          subPath: password
          readOnly: true
        lifecycle:
          postStart:
            exec:
              command:
              - /bin/bash
              - -c
              - |
                set -o pipefail
                LOG=/cdash/storage/cdash-init.log
                exec > >(tee -a "${LOG}" > /proc/1/fd/1) 2>&1
                echo "=== cdash-init start $(date -Iseconds) ==="
                /bin/bash /shoggoth/cdash/init.sh
                echo "=== cdash-init exit $? $(date -Iseconds) ==="
        resources:
          requests:
            memory: 256Mi
            cpu: 200m
          limits:
            memory: 512Mi
            cpu: 1000m
        readinessProbe:
          httpGet:
            path: /login
            port: 80
          initialDelaySeconds: 15
          periodSeconds: 10
          failureThreshold: 30
        livenessProbe:
          httpGet:
            path: /login
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
          failureThreshold: 6
      volumes:
      - name: entrypoint-script
        configMap:
          name: cdash-entrypoint
          defaultMode: 493
      - name: init-script
        configMap:
          name: cdash-init
          defaultMode: 493
      - name: storage
        persistentVolumeClaim:
          claimName: cdash-storage
      - name: db-password
        secret:
          secretName: cdash-db-password
      serviceAccountName: cdash
---
{{- if (include "shoggoth.isServiceEnabled" (list . "cdash-db")) }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cdash-db
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shoggoth.labels" . | nindent 4 }}
    app: cdash-db
    app.kubernetes.io/component: cdash
{{- end }}
---
{{- if (include "shoggoth.isServiceEnabled" (list . "cdash")) }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cdash
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shoggoth.labels" . | nindent 4 }}
    app: cdash
    app.kubernetes.io/component: cdash
{{- end }}
{{- end }}
