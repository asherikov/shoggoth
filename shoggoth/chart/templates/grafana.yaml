{{- /*
  templates/grafana.yaml — Grafana + the shoggoth_ai dashboard suite.

  The dashboards themselves live in files/grafana/dashboards/*.json and are
  mounted VERBATIM (shoggoth.filesData with render=false). Every `{{ ... }}`
  in those files is GRAFANA's own templating (`{{host_name}}`, `{{service}}`,
  `{{requested_model}}`, `{{span_name}}`, `{{.service}}`, `{{__line__}}`, ...),
  consumed by Grafana when it renders a panel — written there as plain
  `{{host_name}}`, with no Helm escape, because Helm never evaluates them.

  That is the one property to protect. Helm evaluating `{{host_name}}` emits
  `<no value>`, the YAML stays valid, the ConfigMap is accepted, and every
  dashboard legend silently goes blank — there is no error to trace back to.
  It happens if a dashboard is pasted back into this template without the
  `{{`...`}}` escape, or if the filesData call below is switched to
  render=true. Either way: render and diff the ConfigMap data before
  trusting it.

  dashboards.secureJsonData holds the DB password sourced from the
  openbao-managed Secret at pod start; nothing secret is in this file.

  The provider's `folder` is "Shoggoth", so the four dashboards land in a
  Grafana-managed folder of that name instead of the General folder, which is
  what lets their titles drop the "Shoggoth" prefix — the folder supplies the
  context. `folderUid` pins the folder's uid ("shoggoth-dashboards") so links
  to /dashboards/f/<uid> survive a folder rename; without it Grafana generates
  one. The uid must differ from every dashboard uid inside the folder: the
  browse tree matches items by uid alone, so a dashboard sharing its folder's
  uid resolves to itself as parent and the tree recurses until the browser
  dies with "RangeError: Maximum call stack size exceeded" (grafana#131927,
  fixed only in 13.3.x while this chart pins 13.2.4). Renaming a dashboard
  uid instead does not help: provisioning matches stored dashboards by uid,
  so the old one survives the rename and keeps the collision. foldersFromFilesStructure stays false: the dashboards volume is a flat
  projected volume (one source per ConfigMap, no subdirectories), and the
  structure mode would need a path prefix per source for the same result.
  Grafana creates the folder on first provision and MOVES already-provisioned
  dashboards into it on the next run — matching is by dashboard uid, and the
  folder always comes from the provider (createDashboardJSON stamps it onto
  the import; ValidateDashboardBeforeSave copies only id/uid from the stored
  dashboard), so a running instance adopts the folder at restart with no
  duplicates. A dashboard JSON must therefore not carry its own folderUid:
  a mismatch is a provisioning error, not an override.
*/}}
{{- if (include "shoggoth.isServiceEnabled" (list . "grafana")) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shoggoth.labels" . | nindent 4 }}
    app: grafana
    app.kubernetes.io/component: grafana
    shoggoth.io/group: telemetry
    shoggoth.io/exposure: internal
data:
  datasources.yaml: |
    apiVersion: 1

    datasources:
        - name: VictoriaMetrics
          type: prometheus
          access: proxy
          uid: vm
          url: http://victoria-metrics:80
          isDefault: true
          editable: false
        - name: Loki
          type: loki
          access: proxy
          uid: loki
          url: http://loki:3100
          editable: false
        - name: Tempo
          type: tempo
          access: proxy
          uid: tempo
          url: http://tempo:3200
          editable: false
          jsonData:
              search:
                  hide: false
              tracesToMetrics:
                  datasourceUid: vm
                  tags:
                      - key: service
                        value: service
                      - key: span_name
                        value: span_name
              tracesToLogs:
                  datasourceUid: loki
                  filterByTraceID: true
                  filterBySpanID: true
                  tags:
                      - key: service
                        value: service
  dashboards.yaml: |
    apiVersion: 1

    providers:
        - name: default
          orgId: 1
          folder: Shoggoth
          folderUid: shoggoth-dashboards
          type: file
          disableDeletion: true
          editable: true
          options:
              path: /etc/grafana/provisioning/dashboards
              foldersFromFilesStructure: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-shoggoth
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shoggoth.labels" . | nindent 4 }}
    app: grafana
    app.kubernetes.io/component: grafana
    shoggoth.io/group: telemetry
    shoggoth.io/exposure: internal
data:
  {{- include "shoggoth.filesData" (list . "files/grafana/dashboards/shoggoth.json" false) | nindent 2 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-shoggoth-service
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shoggoth.labels" . | nindent 4 }}
    app: grafana
    app.kubernetes.io/component: grafana
    shoggoth.io/group: telemetry
    shoggoth.io/exposure: internal
data:
  {{- include "shoggoth.filesData" (list . "files/grafana/dashboards/shoggoth_service.json" false) | nindent 2 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-shoggoth-ai
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shoggoth.labels" . | nindent 4 }}
    app: grafana
    app.kubernetes.io/component: grafana
    shoggoth.io/group: telemetry
    shoggoth.io/exposure: internal
data:
  {{- include "shoggoth.filesData" (list . "files/grafana/dashboards/shoggoth_ai.json" false) | nindent 2 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-shoggoth-service-map
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shoggoth.labels" . | nindent 4 }}
    app: grafana
    app.kubernetes.io/component: grafana
    shoggoth.io/group: telemetry
    shoggoth.io/exposure: internal
data:
  {{- include "shoggoth.filesData" (list . "files/grafana/dashboards/shoggoth_service_map.json" false) | nindent 2 }}
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shoggoth.labels" . | nindent 4 }}
    app: grafana
    app.kubernetes.io/component: grafana
    shoggoth.io/group: telemetry
    shoggoth.io/exposure: internal
spec:
  selector:
    app: grafana
  ports:
  - name: http
    port: 80
    targetPort: 80
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-data
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shoggoth.labels" . | nindent 4 }}
    app: grafana
    app.kubernetes.io/component: grafana
    shoggoth.io/group: telemetry
    shoggoth.io/exposure: internal
  annotations:
    # Kept across `helm uninstall` so uninstalling stops the workloads but
    # preserves data. Reinstall adopts it: shoggoth.labels survives
    # uninstall, so Helm's ownership check still passes.
    helm.sh/resource-policy: keep
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
  storageClassName: local-path
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shoggoth.labels" . | nindent 4 }}
    app: grafana
    kube-diagrams.io/icon: diagrams.onprem.monitoring.Grafana
    app.kubernetes.io/component: grafana
    shoggoth.io/group: telemetry
    shoggoth.io/exposure: internal
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
        shoggoth.io/group: telemetry
        shoggoth.io/exposure: internal
      annotations:
        secret.reloader.stakater.com/reload: grafana-admin-password,authelia-secrets
    spec:
      {{- include "shoggoth.podDnsConfig" . | nindent 6 }}
      containers:
      - name: grafana
        image: grafana/grafana:13.3.1
        imagePullPolicy: IfNotPresent
        securityContext:
          runAsUser: 0
        env:
        - name: GF_SECURITY_ADMIN_USER
          value: admin
        # WHY THIS IS $__file{} AND NOT A __FILE ENV SUFFIX
        # Grafana 13.3.1 has no generic "read the value from this file" env
        # convention. pkg/setting/expanders.go registers exactly one
        # fileExpander, and it fires only on the `$__file{...}` syntax inside
        # an ini VALUE: applyEnvVariableOverrides (setting.go:1082) first
        # writes the env var's literal text into [security] admin_password —
        # that key exists in conf/defaults.ini, so the first pass applies it —
        # and only then does expandConfig (setting.go:1432) run the
        # expanders. So GF_SECURITY_ADMIN_PASSWORD set to
        # `$__file{/run/secrets/admin_password}` is expanded to the file's
        # contents, TrimSpace'd, before readSecuritySettings reads
        # AdminPassword (setting.go:2144).
        #
        # The obvious `GF_SECURITY_ADMIN_PASSWORD__FILE` spelling does NOT
        # work: the second pass of applyEnvVariableOverrides creates a new
        # `admin_password__file` key in [security], nothing ever reads that
        # key, and `admin_password` keeps its defaults.ini value of `admin`.
        # The mount is therefore not wired to the password at all, and the
        # only thing that sets it is the postStart hook below — which cannot
        # fail loudly (see the hook), so a silent CLI failure leaves the
        # default `admin` password in place with nothing to trace it to.
        #
        # The consequence of the file expander is that a missing or unreadable
        # file is fatal at startup rather than silently defaulting, which is
        # the intended behaviour: the kubelet holds the container in
        # ContainerCreating until the Secret exists anyway.
        - name: GF_SECURITY_ADMIN_PASSWORD
          value: '$__file{/run/secrets/admin_password}'
        - name: GF_SERVER_HTTP_PORT
          value: '80'
        # WHY root_url IS SET HERE, AND WHY NOTHING ELSE SETS IT
        # Grafana derives the OAuth redirect_uri from [server] root_url and
        # from nothing else. pkg/login/social/connectors/common.go
        # createOAuthConfig builds it as
        #   strings.TrimSuffix(cfg.AppURL, "/") + social.SocialBaseUrl + name
        # with SocialBaseUrl = "/login/" and name = "generic_oauth"
        # (pkg/login/social/social.go), so the value sent to Authelia is
        # AppURL + "/login/generic_oauth". There is no
        # auth.generic_oauth.redirect_url in 13.3.1: no connector reads one,
        # the ini key is never populated, and setting it would change
        # nothing. root_url is the only lever, which is also what the
        # upstream docs tell you to set for the callback URL to be right.
        #
        # Left unset, conf/defaults.ini interpolates
        # root_url = %(protocol)s://%(domain)s:%(http_port)s/ out of
        # [server], and with http_port overridden to 80 by the variable
        # above that evaluates to http://localhost:80/ (go-ini expands
        # %(...)s in Key.String, gopkg.in/ini.v1 key.go transformValue).
        # Grafana would then send
        # redirect_uri=http://localhost:80/login/generic_oauth and Authelia
        # would answer invalid_request — "the 'redirect_uri' parameter does
        # not match any of the OAuth 2.0 Client's pre-registered
        # 'redirect_uris'" — because authelia-config.yaml registers
        # http://grafana.<domain>/login/generic_oauth. Authelia compares the
        # absolute URL string and rewrites nothing, so the two have to agree
        # exactly, scheme included.
        #
        # This is the same arrangement as the other three clients: gitea
        # sets GITEA__server__ROOT_URL (gitea.yaml) and CDash sets APP_URL
        # for the identical reason, because each of them appends a fixed
        # upstream callback path to its own base URL. The value has to stay
        # plain HTTP: grafana.<domain> resolves straight to the grafana
        # Service (dns.yaml rewrites the subdomain) and the pod has no TLS
        # listener, which is why the registered URI in authelia-config.yaml
        # is http as well. It is outside the authelia gate below because it
        # is a property of the deployment, not of the OIDC provider, and
        # because it references no Secret.
        - name: GF_SERVER_ROOT_URL
          value: http://grafana.{{ .Values.identity.domain }}
        - name: GF_AUTH_ANONYMOUS_ENABLED
          value: 'true'
        - name: GF_AUTH_ANONYMOUS_ORG_ROLE
          value: Viewer
        - name: GF_AUTH_LDAP_ENABLED
          value: 'false'
        {{- if (include "shoggoth.isServiceEnabled" (list . "authelia")) }}
        # Authelia is the OIDC provider. The whole block is gated on it,
        # not just the ENABLED flag: CLIENT_SECRET references the
        # authelia-secrets Secret, which only exists while Authelia is
        # deployed, and a secretKeyRef pointing at a missing Secret is a
        # CreateContainerConfigError for this pod — the one failure mode
        # that takes the dashboards down with it.
        - name: GF_AUTH_GENERIC_OAUTH_ENABLED
          value: 'true'
        - name: GF_AUTH_GENERIC_OAUTH_NAME
          value: Authelia
        - name: GF_AUTH_GENERIC_OAUTH_CLIENT_ID
          value: grafana
        - name: GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: authelia-secrets
              key: grafana-client-secret
        - name: GF_AUTH_GENERIC_OAUTH_SCOPES
          value: openid groups profile email
        - name: GF_AUTH_GENERIC_OAUTH_AUTH_URL
          value: https://authelia.{{ .Values.identity.domain }}/api/oidc/authorization
        - name: GF_AUTH_GENERIC_OAUTH_TOKEN_URL
          value: https://authelia.{{ .Values.identity.domain }}/api/oidc/token
        - name: GF_AUTH_GENERIC_OAUTH_API_URL
          value: https://authelia.{{ .Values.identity.domain }}/api/oidc/userinfo
        # Grafana evaluates this against the ID token, then UserInfo, then
        # the access token, and the first of the three to yield a non-empty
        # role wins — so the ID token has to carry `groups`, which is what
        # the `grafana` claims policy in authelia-config.yaml exists for.
        # Without it the ID token has no scoped claims at all, this
        # expression still resolves against it (`groups[*]` projects to
        # null, `contains` rejects a null subject, searchRole retries
        # against the `{"groups":[]}` it marshals itself, and
        # `false || 'Viewer'` is the string 'Viewer'), the role is pinned
        # to Viewer, and the userinfo response that does carry `groups` is
        # never consulted. authelia-config.yaml documents that chain in
        # full next to the policy.
        #
        # With the claim present, Authelia resolves the directory's groups
        # into `groups` when the groups scope is requested, and `admins`
        # is the operator group the README documents — so the expression
        # promotes exactly that group to GrafanaAdmin and leaves everyone
        # else a Viewer. A conditional expression is what makes it a role
        # mapping: this key is the one that resolves to a role, while
        # groups_attribute_path below has to resolve to the array itself.
        - name: GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH
          value: "contains(groups[*], 'admins') && 'GrafanaAdmin' || 'Viewer'"
        # The array form of the same claim, for Grafana's group sync.
        - name: GF_AUTH_GENERIC_OAUTH_GROUPS_ATTRIBUTE_PATH
          value: groups
        # Required for the GrafanaAdmin role above to mean server
        # administrator: without it the same expression only grants
        # organization administrator.
        - name: GF_AUTH_GENERIC_OAUTH_ALLOW_ASSIGN_GRAFANA_ADMIN
          value: 'true'
        # Authelia's certificate is issued by the in-cluster CA, which
        # Grafana has no reason to trust: it is a private CA whose only
        # purpose is the VPN-only <domain> namespace. Mounting the CA into
        # this pod (or populating a system trust store) is the alternative;
        # this is the smaller change and the traffic never leaves the
        # cluster network.
        - name: GF_AUTH_GENERIC_OAUTH_TLS_SKIP_VERIFY_INSECURE
          value: 'true'
        {{- end }}
        - name: GF_LOG_LEVEL
          value: warn
        - name: GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH
          value: /etc/grafana/provisioning/dashboards/shoggoth.json
        - name: OTEL_TRACES_EXPORTER
          value: otlp
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://otelcol:4318
        - name: SHOGGOTH_DOMAIN
          value: {{ .Values.identity.domain }}
        ports:
        - containerPort: 80
          name: http
        volumeMounts:
        - name: data
          mountPath: /var/lib/grafana
        - name: provisioning
          mountPath: /etc/grafana/provisioning/datasources/datasources.yaml
          subPath: datasources.yaml
          readOnly: true
        - name: dashboards
          mountPath: /etc/grafana/provisioning/dashboards
          readOnly: true
        - name: admin-password
          mountPath: /run/secrets/admin_password
          subPath: admin-password
          readOnly: true
        lifecycle:
          postStart:
            exec:
              # /bin/sh, not /bin/bash: grafana 13.3.0 removed bash from the
              # alpine image (grafana/grafana#132643), so a bash postStart
              # hook fails with FailedPostStartHook and crash-loops the pod.
              command:
              - /bin/sh
              - -c
              - |
                # WHY THIS HOOK EXISTS AT ALL
                # GF_SECURITY_ADMIN_PASSWORD above is only read when the admin
                # user is CREATED: readSecuritySettings hands AdminPassword to
                # the user service on first boot, and a data volume that
                # already has that user keeps whatever hash it has. This hook
                # is the rotation path for that case — it re-applies the
                # mounted value on every pod start, which is also how a
                # rotated openldap/admin-password reaches an existing Grafana.
                #
                # WHY ITS EXIT CODE CANNOT BE TRUSTED, AND WHY THERE IS NO
                # SUCCESS-MARKER CHECK BESIDE IT
                # resetPasswordCommand
                # (pkg/cmd/grafana-cli/commands/reset_password_command.go)
                # ends in an unconditional `return nil`, so ErrAdminCannotBe
                # Found, ErrMustBeAdmin and every "failed to update user
                # password" exit 0. And LegacyService.Update
                # (pkg/services/user/userimpl/legacy_user.go) returns
                # ErrNewPasswordSameAsOld when the hashed password is
                # unchanged, so on every restart after the first the CLI
                # errors while being a no-op. A marker file gating the exit
                # code on "the reset succeeded" would therefore crash-loop
                # the pod on its second start, which is worse than a hook
                # whose failure is silent. What the hook does guarantee is
                # that a real CLI failure is not swallowed by a pipeline —
                # see below.
                LOG=/var/log/shoggoth-grafana-init.log

                main() {
                    echo "=== grafana-init start $(date -Iseconds) ==="
                    # Captured into a variable, NOT piped into tee: with
                    # `grafana cli ... | tee -a "${LOG}"` the pipeline's exit
                    # status is tee's, and busybox ash's `set -o pipefail`
                    # support is not something to bet a password reset on.
                    # The output is echoed here and appended to the log by
                    # the caller, so `kubectl logs` still shows it.
                    OUT=$(grafana cli --homepath /usr/share/grafana admin reset-admin-password "$(tr -d '\n\r' < /run/secrets/admin_password)" 2>&1)
                    rc=$?
                    echo "${OUT}"
                    echo "=== grafana-init exit ${rc} $(date -Iseconds) ==="
                    return "${rc}"
                }

                main >"${LOG}.new" 2>&1
                rc=$?
                cat "${LOG}.new"
                cat "${LOG}.new" >>"${LOG}"
                rm -f "${LOG}.new"
                exit "${rc}"

        resources:
          requests:
            memory: 256Mi
            cpu: 50m
          limits:
            memory: 1Gi
            cpu: 500m
        readinessProbe:
          httpGet:
            path: /api/health
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 5
          failureThreshold: 30
        livenessProbe:
          httpGet:
            path: /api/health
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
          failureThreshold: 6
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: grafana-data
      - name: provisioning
        configMap:
          name: grafana-config
      - name: dashboards
        projected:
          sources:
          - configMap:
              name: grafana-config
              items:
              - key: dashboards.yaml
                path: dashboards.yaml
          - configMap:
              name: grafana-dashboard-shoggoth
          - configMap:
              name: grafana-dashboard-shoggoth-service
          - configMap:
              name: grafana-dashboard-shoggoth-ai
          - configMap:
              name: grafana-dashboard-shoggoth-service-map
      - name: admin-password
        secret:
          secretName: grafana-admin-password
      serviceAccountName: grafana
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: grafana
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shoggoth.labels" . | nindent 4 }}
    app: grafana
    app.kubernetes.io/component: grafana
    shoggoth.io/group: telemetry
    shoggoth.io/exposure: internal
{{- end }}
