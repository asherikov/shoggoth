{{- /*
  templates/grafana.yaml — Grafana + the shoggoth_ai dashboard suite.

  The dashboards themselves live in files/grafana/dashboards/*.json and are
  mounted VERBATIM (shoggoth.filesData with render=false). Every `{{ ... }}`
  in those files is GRAFANA's own templating (`{{host_name}}`, `{{service}}`,
  `{{requested_model}}`, `{{span_name}}`, `{{.service}}`, `{{__line__}}`, ...),
  consumed by Grafana when it renders a panel — written there as plain
  `{{host_name}}`, with no Helm escape, because Helm never evaluates them.

  That is the one property to protect. Helm evaluating `{{host_name}}` emits
  `<no value>`, the YAML stays valid, the ConfigMap is accepted, and every
  dashboard legend silently goes blank — there is no error to trace back to.
  It happens if a dashboard is pasted back into this template without the
  `{{`...`}}` escape, or if the filesData call below is switched to
  render=true. Either way: render and diff the ConfigMap data before
  trusting it.

  dashboards.secureJsonData holds the DB password sourced from the
  openbao-managed Secret at pod start; nothing secret is in this file.
*/}}
{{- if (include "shoggoth.isServiceEnabled" (list . "grafana")) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shoggoth.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
data:
  datasources.yaml: |
    apiVersion: 1

    datasources:
        - name: VictoriaMetrics
          type: prometheus
          access: proxy
          uid: vm
          url: http://victoria-metrics:80
          isDefault: true
          editable: false
        - name: Loki
          type: loki
          access: proxy
          uid: loki
          url: http://loki:3100
          editable: false
        - name: Tempo
          type: tempo
          access: proxy
          uid: tempo
          url: http://tempo:3200
          editable: false
          jsonData:
              search:
                  hide: false
              tracesToMetrics:
                  datasourceUid: vm
                  tags:
                      - key: service
                        value: service
                      - key: span_name
                        value: span_name
              tracesToLogs:
                  datasourceUid: loki
                  filterByTraceID: true
                  filterBySpanID: true
                  tags:
                      - key: service
                        value: service
  dashboards.yaml: |
    apiVersion: 1

    providers:
        - name: default
          orgId: 1
          folder: ""
          type: file
          disableDeletion: true
          editable: true
          options:
              path: /etc/grafana/provisioning/dashboards
              foldersFromFilesStructure: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-shoggoth
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shoggoth.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
data:
  {{- include "shoggoth.filesData" (list . "files/grafana/dashboards/shoggoth.json" false) | nindent 2 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-shoggoth-service
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shoggoth.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
data:
  {{- include "shoggoth.filesData" (list . "files/grafana/dashboards/shoggoth_service.json" false) | nindent 2 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-shoggoth-ai
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shoggoth.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
data:
  {{- include "shoggoth.filesData" (list . "files/grafana/dashboards/shoggoth_ai.json" false) | nindent 2 }}
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shoggoth.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
spec:
  selector:
    app: grafana
  ports:
  - name: http
    port: 80
    targetPort: 80
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-data
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shoggoth.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
  annotations:
    # Kept across `helm uninstall` so uninstalling stops the workloads but
    # preserves data. Reinstall adopts it: shoggoth.labels survives
    # uninstall, so Helm's ownership check still passes.
    helm.sh/resource-policy: keep
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
  storageClassName: local-path
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shoggoth.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
      annotations:
        secret.reloader.stakater.com/reload: grafana-admin-password
    spec:
      {{- include "shoggoth.podDnsConfig" . | nindent 6 }}
      containers:
      - name: grafana
        image: grafana/grafana:13.2.4
        imagePullPolicy: IfNotPresent
        securityContext:
          runAsUser: 0
        env:
        - name: GF_SECURITY_ADMIN_USER
          value: admin
        - name: GF_SECURITY_ADMIN_PASSWORD__FILE
          value: /run/secrets/admin_password
        - name: GF_SERVER_HTTP_PORT
          value: '80'
        - name: GF_AUTH_ANONYMOUS_ENABLED
          value: 'true'
        - name: GF_AUTH_ANONYMOUS_ORG_ROLE
          value: Viewer
        - name: GF_AUTH_LDAP_ENABLED
          value: 'false'
        - name: GF_LOG_LEVEL
          value: warn
        - name: GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH
          value: /etc/grafana/provisioning/dashboards/shoggoth.json
        - name: OTEL_TRACES_EXPORTER
          value: otlp
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://otelcol:4318
        - name: SHOGGOTH_DOMAIN
          value: {{ .Values.identity.domain }}
        ports:
        - containerPort: 80
          name: http
        volumeMounts:
        - name: data
          mountPath: /var/lib/grafana
        - name: provisioning
          mountPath: /etc/grafana/provisioning/datasources/datasources.yaml
          subPath: datasources.yaml
          readOnly: true
        - name: dashboards
          mountPath: /etc/grafana/provisioning/dashboards
          readOnly: true
        - name: admin-password
          mountPath: /run/secrets/admin_password
          subPath: admin-password
          readOnly: true
        lifecycle:
          postStart:
            exec:
              command:
              - /bin/bash
              - -c
              - |
                set -o pipefail

                LOG=/var/log/shoggoth-grafana-init.log

                exec > >(tee -a "${LOG}" > /proc/1/fd/1) 2>&1

                echo "=== grafana-init start $(date -Iseconds) ==="

                grafana cli --homepath /usr/share/grafana admin reset-admin-password
                "$(tr -d ''\n\r'' < /run/secrets/admin_password)"

                echo "=== grafana-init exit $? $(date -Iseconds) ==="

        resources:
          requests:
            memory: 256Mi
            cpu: 50m
          limits:
            memory: 512Mi
            cpu: 500m
        readinessProbe:
          httpGet:
            path: /api/health
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 5
          failureThreshold: 30
        livenessProbe:
          httpGet:
            path: /api/health
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
          failureThreshold: 6
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: grafana-data
      - name: provisioning
        configMap:
          name: grafana-config
      - name: dashboards
        projected:
          sources:
          - configMap:
              name: grafana-config
              items:
              - key: dashboards.yaml
                path: dashboards.yaml
          - configMap:
              name: grafana-dashboard-shoggoth
          - configMap:
              name: grafana-dashboard-shoggoth-service
          - configMap:
              name: grafana-dashboard-shoggoth-ai
      - name: admin-password
        secret:
          secretName: grafana-admin-password
      serviceAccountName: grafana
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: grafana
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shoggoth.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
{{- end }}
