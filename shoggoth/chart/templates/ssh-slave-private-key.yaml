{{- /*
  templates/ssh-slave-private-key.yaml — ExternalSecret projecting the
  ED25519 private key used by ``git-cred`` sidecars in slave-term /
  slave-dind / argo-workflow pods into a K8s Secret in the namespace.

  Consumers: the ``wait-bootstrap`` init containers in slave-term.yaml,
  slave-dind.yaml, and argo-workflows.yaml all poll
  ``externalsecret/ssh-slave-private-key`` before allowing the pod to
  start, and the ``SSH_ID_RSA`` env var is sourced from the resulting
  Secret via ``secretKeyRef``. Without the CR those loops never see
  ``Ready=True``, the pods stay in ``Init:0/2``, and the 10-minute init
  timeout kills them.

  ``ssh-slave-public-key.yaml`` is the public-key side of the same pair
  and shares the openbao seed. It is gated alongside this one.

  Gated on ``secret-store``: the Secret is read by ``slave-term``,
  ``slave-dind``, and ``argo-workflows``, none of which is a strict
  superset. ``secret-store`` is the read-side SecretStore's own gate
  and is default-on, so a default install is unaffected either way,
  while a per-service toggle (``make stop SERVICE=slave-term`` etc.)
  cleanly suspends the gating along with the deployment.
*/}}
{{- if (include "shoggoth.isServiceEnabled" (list . "secret-store")) }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ssh-slave-private-key
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shoggoth.labels" . | nindent 4 }}
    app.kubernetes.io/component: ssh-slave-private-key
spec:
  secretStoreRef:
    name: shoggoth-openbao
    kind: SecretStore
  target:
    name: ssh-slave-private-key
    creationPolicy: Owner
  data:
    - secretKey: ssh-id-rsa
      remoteRef:
        key: ssh/slave-private-key
        property: value
  refreshInterval: 5m
{{- end }}
