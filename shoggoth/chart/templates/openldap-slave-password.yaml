{{- /*
  templates/openldap-slave-password.yaml — ExternalSecret projecting
  the OpenLDAP replication bind password into a K8s Secret.

  Restores shoggoth/k3s/external-secrets/openldap-slave-password.yaml,
  which the chart migration dropped. Distinct from the regular admin
  password above because it is used by the syncrepl consumer side
  (every replica that follows the multi-master): both sides bind with
  ``rootdn=cn=admin,cn=config`` AND with this slave credential, so a
  compromise of the ``root`` does not directly leak replication auth.

  openbao-bootstrap Phase B seeds ``openldap/slave-password`` on a
  fresh install.

  Gated on ``openldap``: the only consumer.
*/}}
{{- if (include "shoggoth.isServiceEnabled" (list . "openldap")) }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openldap-slave-password
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shoggoth.labels" . | nindent 4 }}
    app.kubernetes.io/component: openldap-slave-password
spec:
  secretStoreRef:
    name: shoggoth-openbao
    kind: SecretStore
  target:
    name: openldap-slave-password
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: openldap/slave-password
        property: value
  refreshInterval: 5m
{{- end }}
