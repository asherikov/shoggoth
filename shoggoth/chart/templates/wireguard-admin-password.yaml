{{- /*
  templates/wireguard-admin-password.yaml — ExternalSecret projecting the
  WireGuard admin UI credential into the namespace.

  Restores shoggoth/k3s/external-secrets/wireguard-admin-password.yaml, which
  the chart migration dropped. Every consumer side survived the port — the
  initContainer in wireguard.yaml waits on externalsecret/wireguard-admin-password,
  the Role grants externalsecrets get on that name, and the Deployment mounts the
  resulting Secret at /run/secrets/admin_password — but the CR that creates it
  did not. Nothing in the chart emitted one, so the wait loop burned its 10m
  timeout and the Deployment never left init. Restoring the manifest is the whole
  fix; no other template changes.

  The Vault side never regressed: openbao-bootstrap Phase B seeds
  wireguard/admin-password as a random value on a fresh install, so this only
  has to project it. Legacy used the same remoteRef, and a legacy install
  therefore reuses the credential already sitting in Vault rather than rotating
  it on upgrade.

  Gated on `wireguard`, not `secret-store`: the Deployment is the only consumer,
  so `make start|stop SERVICE=wireguard` carries the credential with it. Both
  keys default to enabled, so a default install is unaffected either way.
*/}}
{{- if (include "shoggoth.isServiceEnabled" (list . "wireguard")) }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: wireguard-admin-password
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shoggoth.labels" . | nindent 4 }}
    app.kubernetes.io/component: wireguard-admin-password
spec:
  secretStoreRef:
    name: shoggoth-openbao
    kind: SecretStore
  target:
    name: wireguard-admin-password
    creationPolicy: Owner
  data:
    - secretKey: admin-password
      remoteRef:
        key: wireguard/admin-password
        property: value
  refreshInterval: 5m
{{- end }}