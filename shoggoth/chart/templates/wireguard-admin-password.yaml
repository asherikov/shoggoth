{{- /*
  templates/wireguard-admin-password.yaml — ExternalSecret projecting the
  WireGuard admin UI credential into the namespace.

  Consumers: the initContainer in wireguard.yaml waits on
  ``externalsecret/wireguard-admin-password``, the Role grants
  ``externalsecrets get`` on that name, and the Deployment mounts the
  resulting Secret at ``/run/secrets/admin_password``. The ExternalSecret
  must exist for that wait to succeed: without it the wait loop burns
  its 10m timeout and the Deployment never leaves init.

  Gated on ``wireguard``, not ``secret-store``: the Deployment is the
  only consumer, so ``make start|stop SERVICE=wireguard`` carries the
  credential with it. Both keys default to enabled, so a default
  install is unaffected either way.
*/}}
{{- if (include "shoggoth.isServiceEnabled" (list . "wireguard")) }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: wireguard-admin-password
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shoggoth.labels" . | nindent 4 }}
    app.kubernetes.io/component: wireguard-admin-password
spec:
  secretStoreRef:
    name: shoggoth-openbao
    kind: SecretStore
  target:
    name: wireguard-admin-password
    creationPolicy: Owner
  data:
    - secretKey: admin-password
      remoteRef:
        key: wireguard/admin-password
        property: value
  refreshInterval: 5m
{{- end }}