{{- /*
  templates/web-external.yaml — TLS-terminating reverse proxy (Angie) that
  exposes wireguard over HTTPS.

  The angie.conf ConfigMap lives in web-external-config.yaml so this
  Deployment can checksum it and roll when it changes; see the annotation on
  spec.template.metadata.annotations below.
*/}}
{{- if (include "shoggoth.isServiceEnabled" (list . "web-external")) }}
apiVersion: v1
kind: Service
metadata:
  name: web-external
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shoggoth.labels" . | nindent 4 }}
    app: web-external
    app.kubernetes.io/component: web-external
spec:
  selector:
    app: web-external
  ports:
  - name: https
    port: {{ .Values.network.webExternal.hostPort }}
    targetPort: {{ .Values.network.webExternal.hostPort }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-external
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shoggoth.labels" . | nindent 4 }}
    app: web-external
    app.kubernetes.io/component: web-external
spec:
  replicas: 1
  strategy:
    type: Recreate
  progressDeadlineSeconds: 120
  selector:
    matchLabels:
      app: web-external
  template:
    metadata:
      annotations:
        # Roll the pod when the mounted angie.conf changes. Two of the values
        # in that file appear nowhere else in this Deployment —
        # network.wireguard.uiPort (the upstream port, line 39) and
        # identity.dnsIp (the resolver, line 24) — so changing either left the
        # pod template byte-identical and Helm started no rollout. The file is
        # mounted with subPath, so kubelet does not even reproject it onto the
        # running pod: angie keeps serving the port it parsed at startup and
        # returns 502 while `helm upgrade --wait` reports success.
        # Reloader cannot cover this: reloader.yaml passes
        # --resources-to-ignore=configmaps, so ConfigMap edits are invisible
        # to it by design. The checksum must cover the whole file, not just
        # the two values above, or the next value added to angie.conf
        # reintroduces the same silent no-rollout.
        checksum/config: {{ include (print $.Template.BasePath "/web-external-config.yaml") . | sha256sum }}
      labels:
        {{- include "shoggoth.selectorLabels" . | nindent 8 }}
        app: web-external
        app.kubernetes.io/component: web-external
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      serviceAccountName: web-external
      initContainers:
      - name: wait-bootstrap
        image: asherikov/shoggoth_tools:alpine
        imagePullPolicy: IfNotPresent
        command:
        - bash
        - -c
        args:
        - |
          set -euo pipefail
          NS="{{ .Release.Namespace }}"
          wait_for_secret_key() {
            local name="$1" key="$2"
            echo "wait-bootstrap: waiting for secret/${name}.${key} in namespace ${NS}..."
            local ok=0
            for i in $(seq 1 60); do
              if kubectl get secret "${name}" -n "${NS}" -o json 2>/dev/null | jq -e --arg k "${key}" '(.data[$k] // "") | length > 0' >/dev/null 2>&1; then
                echo "wait-bootstrap: secret/${name}.${key} populated (after $((i*10))s)"
                ok=1
                break
              fi
              sleep 10
            done
            if [ "${ok}" != "1" ]; then
              echo "FAIL: secret/${name}.${key} not populated after 10m"
              echo "      Hint: openbao-bootstrap Job may have failed to write the Secret; check:"
              echo "            kubectl logs -n ${NS} -l app=openbao -c openbao-bootstrap"
              return 1
            fi
            return 0
          }
          for s in shoggoth-server shoggoth-ca; do
            k="tls.crt"
            [ "${s}" = "shoggoth-ca" ] && k="ca.crt"
            wait_for_secret_key "${s}" "${k}" || exit 1
          done
          echo "wait-bootstrap: all K8s Secrets Ready"
        resources:
          requests:
            memory: 32Mi
            cpu: 50m
          limits:
            memory: 64Mi
            cpu: 200m
      containers:
      - name: angie
        image: docker.angie.software/angie:1.11.6
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: {{ .Values.network.webExternal.hostPort }}
          name: https
        env:
        - name: SHOGGOTH_DOMAIN
          value: {{ .Values.identity.domain }}
        volumeMounts:
        - name: config
          mountPath: /etc/angie/angie.conf
          subPath: angie.conf
          readOnly: true
        - name: server-cert
          mountPath: /data/certs/shoggoth.crt
          subPath: shoggoth.crt
          readOnly: true
        - name: server-cert
          mountPath: /data/certs/shoggoth.key
          subPath: shoggoth.key
          readOnly: true
        - name: ca-cert
          mountPath: /data/certs/shoggoth-ca.crt
          subPath: shoggoth-ca.crt
          readOnly: true
        - name: setup-client
          mountPath: /data/scripts
          readOnly: true
        resources:
          requests:
            memory: 64Mi
            cpu: 50m
          limits:
            memory: 128Mi
            cpu: 500m
        startupProbe:
          tcpSocket:
            port: {{ .Values.network.webExternal.hostPort }}
          periodSeconds: 5
          failureThreshold: 24
        readinessProbe:
          tcpSocket:
            port: {{ .Values.network.webExternal.hostPort }}
          periodSeconds: 5
          failureThreshold: 3
        livenessProbe:
          tcpSocket:
            port: {{ .Values.network.webExternal.hostPort }}
          periodSeconds: 10
          failureThreshold: 3
      volumes:
      - name: config
        configMap:
          name: web-external-config
      - name: server-cert
        secret:
          secretName: shoggoth-server
          items:
          - key: tls.crt
            path: shoggoth.crt
          - key: tls.key
            path: shoggoth.key
      - name: ca-cert
        secret:
          secretName: shoggoth-ca
          items:
          - key: ca.crt
            path: shoggoth-ca.crt
      - name: setup-client
        hostPath:
          path: /var/lib/rancher/k3s/storage/{{ .Values.identity.instanceDir }}/scripts
          type: DirectoryOrCreate
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: web-external
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shoggoth.labels" . | nindent 4 }}
    app: web-external
    app.kubernetes.io/component: web-external
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: web-external-bootstrap-wait
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shoggoth.labels" . | nindent 4 }}
    app: web-external
    app.kubernetes.io/component: web-external
rules:
- apiGroups:
  - ''
  resources:
  - secrets
  resourceNames:
  - shoggoth-server
  - shoggoth-ca
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: web-external-bootstrap-wait
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shoggoth.labels" . | nindent 4 }}
    app: web-external
    app.kubernetes.io/component: web-external
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: web-external-bootstrap-wait
subjects:
- kind: ServiceAccount
  name: web-external
  namespace: {{ .Release.Namespace }}
{{- end }}
