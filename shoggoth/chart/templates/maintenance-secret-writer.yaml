  - secrets
  resourceNames:
  - redmine-slave-token
  verbs:
  - get
  - update
  - patch
- apiGroups:
  - ''
  resources:
  - secrets
  verbs:
  - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: shoggoth-maintenance-secret-writer-gitea
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shoggoth.labels" . | nindent 4 }}
    app.kubernetes.io/component: shoggoth-maintenance-secret-writer
subjects:
- kind: ServiceAccount
  name: shoggoth-maintenance-secret-writer
  namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: shoggoth-maintenance-secret-writer-gitea
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: shoggoth-maintenance-secret-writer-redmine
  namespace: {{ .Release.Namespace }}
