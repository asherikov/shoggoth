{{- /*
  templates/maintenance-secret-writer.yaml — SA + 4 Roles + 5 RoleBindings
  for the maintenance workflow. Replaces
*/}}
{{- if (include "shoggoth.isServiceEnabled" (list . "maintenance-secret-writer")) }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: shoggoth-maintenance-secret-writer
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shoggoth.labels" . | nindent 4 }}
    app.kubernetes.io/component: shoggoth-maintenance-secret-writer
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: shoggoth-maintenance-secret-writer-gitea
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shoggoth.labels" . | nindent 4 }}
    app.kubernetes.io/component: shoggoth-maintenance-secret-writer
rules:
- apiGroups:
  - ''
  resources:
  - secrets
  resourceNames:
  - gitea-slave-token
  - gitea-runner-token
  verbs:
  - get
  - update
  - patch
- apiGroups:
  - ''
  resources:
  - secrets
  verbs:
  - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: shoggoth-maintenance-secret-writer-redmine
  namespace: {{ .Release.Namespace }}
