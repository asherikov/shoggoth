{{- /*
  templates/cdash-db-password.yaml — ExternalSecret projecting the
  CDash database user password into a K8s Secret.

  Restores shoggoth/k3s/external-secrets/cdash-db-password.yaml, which
  the chart migration dropped. openbao-bootstrap Phase B seeds
  ``cdash/db-password`` with a random value on a fresh install, so this
  only has to project it. The ``cdash-db`` sub-deployment and the
  ``cdash`` web pod both consume the Secret (cdash-db at
  ``secretKeyRef`` for ``POSTGRES_PASSWORD``; cdash via the application
  config).

  Gated on ``cdash-db``: gating on the database sub-label rather than
  ``cdash`` itself matches the legacy ApplyConfiguration, so
  ``make stop SERVICE=cdash-db`` cleanly retires the credential along
  with the database pod.
*/}}
{{- if (include "shoggoth.isServiceEnabled" (list . "cdash-db")) }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cdash-db-password
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shoggoth.labels" . | nindent 4 }}
    app.kubernetes.io/component: cdash-db-password
spec:
  secretStoreRef:
    name: shoggoth-openbao
    kind: SecretStore
  target:
    name: cdash-db-password
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: cdash/db-password
        property: value
  refreshInterval: 5m
{{- end }}
