{{- /*
  templates/openldap-config-admin-password.yaml — ExternalSecret
  projecting the OpenLDAP ``cn=admin,cn=config`` password into a K8s
  Secret.

  Restores shoggoth/k3s/external-secrets/openldap-config-admin-password.yaml,
  which the chart migration dropped. Distinct from the regular admin
  password above: this one governs ``cn=config``-DSA-PT bind, used by
  openldap itself (and phpldapadmin) when modifying global config
  such as ``olcDatabase=...``. openbao-bootstrap Phase B seeds
  ``openldap/config-admin-password`` on a fresh install.

  Gated on ``openldap``: same consumer set as the regular admin
  password.
*/}}
{{- if (include "shoggoth.isServiceEnabled" (list . "openldap")) }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openldap-config-admin-password
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shoggoth.labels" . | nindent 4 }}
    app.kubernetes.io/component: openldap-config-admin-password
spec:
  secretStoreRef:
    name: shoggoth-openbao
    kind: SecretStore
  target:
    name: openldap-config-admin-password
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: openldap/config-admin-password
        property: value
  refreshInterval: 5m
{{- end }}
