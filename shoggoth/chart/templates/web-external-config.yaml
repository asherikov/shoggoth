{{- /*
  templates/web-external-config.yaml — the angie.conf reverse-proxy config for
  web-external.

  Split out of web-external.yaml so the Deployment can checksum it with
  `include (print $.Template.BasePath "/web-external-config.yaml") . | sha256sum`.
  A Deployment cannot checksum the file that defines it: `include` on the
  containing template re-enters it and the render recurses until Helm errors
  out. Both files must therefore carry the same service gate — see README
  "Chart template conventions".
*/}}
{{- if (include "shoggoth.isServiceEnabled" (list . "web-external")) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: web-external-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shoggoth.labels" . | nindent 4 }}
data:
  angie.conf: |
    load_module modules/ngx_otel_module.so;

    events {
        worker_connections 1024;
    }

    error_log /dev/stderr debug;

    http {
        resolver {{ .Values.identity.dnsIp }} valid=30s;
        access_log /dev/stdout;

        map $http_upgrade $connection_upgrade {
            default upgrade;
            ''      close;
        }

        otel_exporter {
            endpoint http://otelcol:4317;
        }
        otel_service_name web-external;

        upstream wireguard {
            zone wireguard 1m;
            server wireguard.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.network.wireguard.uiPort }} resolve;
        }

        server {
            listen {{ .Values.network.webExternal.hostPort }} ssl default_server;

            ssl_certificate /data/certs/shoggoth.crt;
            ssl_certificate_key /data/certs/shoggoth.key;
            ssl_protocols TLSv1.2 TLSv1.3;
            ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
            ssl_prefer_server_ciphers off;

            add_header Strict-Transport-Security "max-age=31536000" always;

            proxy_read_timeout 30m;
            proxy_send_timeout 30m;
            proxy_connect_timeout 60s;

            location = /ca.crt {
                alias /data/certs/shoggoth-ca.crt;
                default_type application/x-x509-ca-cert;
            }

            location = /setup-client.sh {
                default_type application/x-sh;
                alias /data/scripts/setup-client.sh;
            }

            location / {
                proxy_pass http://wireguard;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto https;

                proxy_buffering off;
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection $connection_upgrade;
            }
        }
    }
{{- end }}