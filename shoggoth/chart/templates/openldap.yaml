{{- /*
  templates/openldap.yaml — OpenLDAP server + LDIF rendering pipeline.

  Three ConfigMaps carry a two-stage substitution chain, and it matters which
  stage each placeholder belongs to:

    stage 1 (deploy time) — `make up` runs `envsubst "$ENV_VARS"`, whose
      whitelist is make/k3s.mk:240. Only SHOGGOTH_DOMAIN, SHOGGOTH_NAMESPACE,
      SHOGGOTH_DNS_IP and LDAP_BASE_DN are expanded. Those become Go-templates
      here.

    stage 2 (pod start) — `openldap-render-ldif`'s render.sh runs
      `envsubst "$VARS"` over the LDIF templates with LDAP_BASE_DN,
      SHOGGOTH_DOMAIN, MDB_DN and the three password hashes in scope. Stage 1
      already baked the first two, so only MDB_DN and the hashes still do work
      at that point. The VARS list below is reproduced exactly as legacy left
      it, including the already-substituted entries — it is not "tidied up".

  Every other ${...} in this file (MDB_DN, ADMIN_PW, CONFIG_ADMIN_PW,
  CONFIG_ADMIN_DN, LDAP_URL, LDAP_DIR, SENTINEL, ADMIN_HASH,
  LDAPAUTH_HASH, SLAVE_HASH, ACTUAL_BASE_DN, TEMPLATES_DIR, RENDERED_DIR, NS)
  is a plain shell variable and stays literal. LDAP_DOMAIN is set on the
  openldap container (it is what the osixia image bootstraps its suffix
  from) but is not referenced by these scripts — every DN here comes from
  shoggoth.ldapBaseDn, which refuses to render a base DN that disagrees
  with identity.domain.
*/}}
{{- if (include "shoggoth.isServiceEnabled" (list . "openldap")) }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: openldap-data
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shoggoth.labels" . | nindent 4 }}
    app.kubernetes.io/component: openldap
  annotations:
    # Kept across `helm uninstall` so `make down` stops workloads but
    # preserves data, matching the legacy envsubst path. Reinstall adopts
    # it: shoggoth.labels survives uninstall, so Helm's ownership check
    # still passes.
    helm.sh/resource-policy: keep
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: local-path
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: openldap-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shoggoth.labels" . | nindent 4 }}
    app.kubernetes.io/component: openldap
  annotations:
    # Kept across `helm uninstall` so `make down` stops workloads but
    # preserves data, matching the legacy envsubst path. Reinstall adopts
    # it: shoggoth.labels survives uninstall, so Helm's ownership check
    # still passes.
    helm.sh/resource-policy: keep
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: local-path
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: openldap-init
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shoggoth.labels" . | nindent 4 }}
    app.kubernetes.io/component: openldap
data:
  init.sh: |
    #!/usr/bin/env bash
    set -euo pipefail
    # No base-DN is computed here from ${LDAP_DOMAIN}: every DN below comes
    # from the chart's shoggoth.ldapBaseDn helper, which fails the render if
    # ldap.baseDn disagrees with identity.domain — the suffix the osixia
    # container actually bootstraps. Deriving it again from LDAP_DOMAIN here
    # would produce a value that disagrees with every DN it sits next to.
    ADMIN_DN="cn=admin,{{ include "shoggoth.ldapBaseDn" . }}"
    CONFIG_ADMIN_DN="cn=admin,cn=config"
    LDAP_URL="ldap://localhost:389"
    LDAP_DIR="/shoggoth/openldap"
    clean_pw_file() {
        local src="${1}"
        local dst
        dst="$(mktemp)"
        tr -d '\n\r' < "${src}" > "${dst}"
        printf '%s' "${dst}"
    }
    get_actual_base_dn() {
        ldapsearch -x -H "${LDAP_URL}" \
            -D "${CONFIG_ADMIN_DN}" -y "${CONFIG_ADMIN_PW}" \
            -b "cn=config" -s sub '(olcSuffix=*)' olcSuffix 2>/dev/null \
            | grep '^olcSuffix:' | awk '{print $2}' | head -1 || true
    }
    ADMIN_PW="$(clean_pw_file /run/secrets/openldap_admin_password)"
    CONFIG_ADMIN_PW="$(clean_pw_file /run/secrets/openldap_config_admin_password)"
    trap 'rm -f "${ADMIN_PW}" "${CONFIG_ADMIN_PW}"' EXIT
    SENTINEL="/var/lib/ldap/shoggoth-init-done"
    if [ -f "${SENTINEL}" ]; then
        echo "shoggoth: LDAP already initialized, re-applying passwords for rotation"
        echo "shoggoth: Waiting for slapd to accept connections..."
        for i in $(seq 1 30); do
            if ldapsearch -x -H "${LDAP_URL}" -b "" -s base namingContexts >/dev/null 2>&1; then
                break
            fi
            sleep 1
        done
        if ! ldapsearch -x -H "${LDAP_URL}" -b "" -s base namingContexts >/dev/null 2>&1; then
            echo "shoggoth: FATAL: slapd not accepting connections after 30s" >&2
            exit 1
        fi
        if ! ldapsearch -x -H "${LDAP_URL}" \
            -D "${ADMIN_DN}" -y "${ADMIN_PW}" \
            -b "{{ include "shoggoth.ldapBaseDn" . }}" -s base '(objectClass=*)' dn > /dev/null 2>&1; then
            ACTUAL_BASE_DN="$(get_actual_base_dn)"
            if [ -n "${ACTUAL_BASE_DN}" ] && [ "${ACTUAL_BASE_DN}" != "{{ include "shoggoth.ldapBaseDn" . }}" ]; then
                echo "shoggoth: LDAP domain changed: ${ACTUAL_BASE_DN} -> {{ include "shoggoth.ldapBaseDn" . }}, using actual DB suffix for auth"
                ADMIN_DN="cn=admin,${ACTUAL_BASE_DN}"
                if ! ldapsearch -x -H "${LDAP_URL}" \
                    -D "${ADMIN_DN}" -y "${ADMIN_PW}" \
                    -b "${ACTUAL_BASE_DN}" -s base '(objectClass=*)' dn > /dev/null 2>&1; then
                    echo "shoggoth: FATAL: slapd not ready (admin=${ADMIN_DN}, base=${ACTUAL_BASE_DN})" >&2
                    exit 1
                fi
            else
                echo "shoggoth: FATAL: slapd not ready (admin=${ADMIN_DN}, base={{ include "shoggoth.ldapBaseDn" . }})" >&2
                exit 1
            fi
        fi
        if [ -f "${LDAP_DIR}/passwords.ldif" ]; then
            if [ "${ADMIN_DN}" = "cn=admin,{{ include "shoggoth.ldapBaseDn" . }}" ]; then
                ldapmodify -x -H "${LDAP_URL}" \
                    -D "${ADMIN_DN}" -y "${ADMIN_PW}" \
                    -f "${LDAP_DIR}/passwords.ldif" || {
                    echo "shoggoth: ERROR: password rotation failed" >&2
                    exit 1
                }
            else
                echo "shoggoth: skipping password rotation (domain changed, LDIF DNs would not match)"
            fi
        fi
        touch /run/shoggoth-ldap-init-done
        exit 0
    fi
    echo "shoggoth: === openldap: checking slapd ==="
    echo "shoggoth: Waiting for slapd to accept connections..."
    for i in $(seq 1 30); do
        if ldapsearch -x -H "${LDAP_URL}" -b "" -s base namingContexts >/dev/null 2>&1; then
            break
        fi
        sleep 1
    done
    if ! ldapsearch -x -H "${LDAP_URL}" \
        -D "${ADMIN_DN}" -y "${ADMIN_PW}" \
        -b "{{ include "shoggoth.ldapBaseDn" . }}" -s base '(objectClass=*)' dn > /dev/null 2>&1; then
        echo "shoggoth: FATAL: slapd not ready (admin=${ADMIN_DN}, base={{ include "shoggoth.ldapBaseDn" . }})" >&2
        exit 1
    fi
    echo "shoggoth: slapd is ready."
    MDB_DN="olcDatabase={1}mdb,cn=config"
    echo "shoggoth: === configuring memberof overlay ==="
    MEMBEROF_EXISTS="$(ldapsearch -x -H "${LDAP_URL}" \
        -D "${CONFIG_ADMIN_DN}" -y "${CONFIG_ADMIN_PW}" \
        -b "olcOverlay=memberof,${MDB_DN}" -s base '(objectClass=*)' \
        olcMemberOfGroupOC 2>/dev/null || true)"
    if printf '%s\n' "${MEMBEROF_EXISTS}" | grep -q "^olcMemberOfGroupOC:"; then
        echo "shoggoth: memberof overlay already configured"
    else
        MEMBEROF_MODULE_EXISTS="$(ldapsearch -x -H "${LDAP_URL}" \
            -D "${CONFIG_ADMIN_DN}" -y "${CONFIG_ADMIN_PW}" \
            -b "cn=module{0},cn=config" -s base '(objectClass=*)' olcModuleLoad 2>/dev/null || true)"
        if ! printf '%s\n' "${MEMBEROF_MODULE_EXISTS}" | grep -q "memberof"; then
            if [ -f "${LDAP_DIR}/memberof_module.ldif" ]; then
                ldapmodify -x -H "${LDAP_URL}" \
                    -D "${CONFIG_ADMIN_DN}" -y "${CONFIG_ADMIN_PW}" \
                    -f "${LDAP_DIR}/memberof_module.ldif" || true
            fi
        fi
        if [ -f "${LDAP_DIR}/memberof_overlay.ldif" ]; then
            ldapadd -x -H "${LDAP_URL}" \
                -D "${CONFIG_ADMIN_DN}" -y "${CONFIG_ADMIN_PW}" \
                -f "${LDAP_DIR}/memberof_overlay.ldif" || true
        fi
        echo "shoggoth: memberof overlay enabled"
    fi
    if [ -f "${LDAP_DIR}/config.ldif" ]; then
        echo "shoggoth: === configuring ACLs ==="
        ldapmodify -x -H "${LDAP_URL}" \
            -D "${CONFIG_ADMIN_DN}" -y "${CONFIG_ADMIN_PW}" \
            -f "${LDAP_DIR}/config.ldif" || true
    fi
    if [ -f "${LDAP_DIR}/data.ldif" ]; then
        echo "shoggoth: === provisioning LDAP data ==="
        ldapadd -c -x -H "${LDAP_URL}" \
            -D "${ADMIN_DN}" -y "${ADMIN_PW}" \
            -f "${LDAP_DIR}/data.ldif" 2>&1 | grep -v 'Already exists' || true
    fi
    if [ -f "${LDAP_DIR}/passwords.ldif" ]; then
        echo "shoggoth: setting passwords"
        ldapmodify -c -x -H "${LDAP_URL}" \
            -D "${ADMIN_DN}" -y "${ADMIN_PW}" \
            -f "${LDAP_DIR}/passwords.ldif" || {
            echo "shoggoth: FATAL: passwords.ldif apply failed" >&2
            exit 1
        }
    fi
    touch "${SENTINEL}"
    touch /run/shoggoth-ldap-init-done
    echo "shoggoth: OpenLDAP initialization complete."

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: openldap-ldif-templates
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shoggoth.labels" . | nindent 4 }}
    app.kubernetes.io/component: openldap
data:
  config.ldif: |
    dn: olcDatabase={1}mdb,cn=config
    changetype: modify
    replace: olcAccess
    olcAccess: {0}to attrs=userPassword by self write by anonymous auth by * none
    olcAccess: {1}to attrs=shadowLastChange by self write by users read
    olcAccess: {2}to * by users read by * none

  data.ldif: |
    dn: ou=people,{{ include "shoggoth.ldapBaseDn" . }}
    changetype: add
    objectClass: organizationalUnit
    ou: people

    dn: ou=groups,{{ include "shoggoth.ldapBaseDn" . }}
    changetype: add
    objectClass: organizationalUnit
    ou: groups

    dn: uid=admin,ou=people,{{ include "shoggoth.ldapBaseDn" . }}
    changetype: add
    objectClass: inetOrgPerson
    objectClass: posixAccount
    uid: admin
    cn: Admin
    sn: Shoggoth
    uidNumber: 10000
    gidNumber: 10000
    homeDirectory: /home/admin
    mail: admin@{{ .Values.identity.domain }}

    dn: uid=ldapauth,ou=people,{{ include "shoggoth.ldapBaseDn" . }}
    changetype: add
    objectClass: inetOrgPerson
    objectClass: posixAccount
    uid: ldapauth
    cn: LDAP Auth
    sn: Shoogoth
    uidNumber: 10001
    gidNumber: 10001
    homeDirectory: /home/ldapauth
    mail: ldapauth@{{ .Values.identity.domain }}

    dn: uid=slave,ou=people,{{ include "shoggoth.ldapBaseDn" . }}
    changetype: add
    objectClass: inetOrgPerson
    objectClass: posixAccount
    uid: slave
    cn: Slave
    sn: Shoggoth
    uidNumber: 10002
    gidNumber: 10002
    homeDirectory: /home/slave
    mail: slave@{{ .Values.identity.domain }}

    dn: cn=admins,ou=groups,{{ include "shoggoth.ldapBaseDn" . }}
    changetype: add
    objectClass: groupOfNames
    cn: admins
    member: uid=admin,ou=people,{{ include "shoggoth.ldapBaseDn" . }}

    dn: cn=shoggoth-auth,ou=groups,{{ include "shoggoth.ldapBaseDn" . }}
    changetype: add
    objectClass: groupOfNames
    cn: shoggoth-auth
    member: uid=ldapauth,ou=people,{{ include "shoggoth.ldapBaseDn" . }}

  memberof_module.ldif: |
    dn: cn=module{0},cn=config
    changetype: modify
    add: olcModuleLoad
    olcModuleLoad: memberof

  memberof_overlay.ldif: |
    dn: olcOverlay=memberof,${MDB_DN}
    objectClass: olcOverlayConfig
    objectClass: olcMemberOf
    olcOverlay: memberof
    olcMemberOfDangling: ignore
    olcMemberOfRefInt: FALSE
    olcMemberOfGroupOC: groupOfNames
    olcMemberOfMemberAD: member
    olcMemberOfMemberOfAD: memberOf

  passwords.ldif: |
    dn: uid=admin,ou=people,{{ include "shoggoth.ldapBaseDn" . }}
    changetype: modify
    replace: userPassword
    userPassword: ${ADMIN_HASH}

    dn: uid=ldapauth,ou=people,{{ include "shoggoth.ldapBaseDn" . }}
    changetype: modify
    replace: userPassword
    userPassword: ${LDAPAUTH_HASH}

    dn: uid=slave,ou=people,{{ include "shoggoth.ldapBaseDn" . }}
    changetype: modify
    replace: userPassword
    userPassword: ${SLAVE_HASH}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: openldap-render-ldif
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shoggoth.labels" . | nindent 4 }}
    app.kubernetes.io/component: openldap
data:
  render.sh: |
    #!/usr/bin/env bash
    set -euo pipefail
    TEMPLATES_DIR="/templates"
    RENDERED_DIR="/rendered"
    read_pw() {
        local f="${1}"
        tr -d '\n\r' < "${f}"
    }
    ssha() { python3 -c 'import sys,hashlib,base64,os;salt=os.urandom(4);sys.stdout.write("{SSHA}"+base64.b64encode(hashlib.sha1(sys.argv[1].encode()+salt).digest()+salt).decode())' "$1"; }
    export ADMIN_HASH="$(ssha "$(read_pw /run/secrets/openldap_admin_password)")"
    export LDAPAUTH_HASH="$(ssha "$(read_pw /run/secrets/openldap_ldapauth_password)")"
    export SLAVE_HASH="$(ssha "$(read_pw /run/secrets/openldap_slave_password)")"
    [ -n "${ADMIN_HASH}" ] || { echo "render-ldif: FATAL: ADMIN_HASH empty" >&2; exit 1; }
    [ -n "${LDAPAUTH_HASH}" ] || { echo "render-ldif: FATAL: LDAPAUTH_HASH empty" >&2; exit 1; }
    [ -n "${SLAVE_HASH}" ] || { echo "render-ldif: FATAL: SLAVE_HASH empty" >&2; exit 1; }
    VARS='{{ include "shoggoth.ldapBaseDn" . }}{{ .Values.identity.domain }}${MDB_DN}${ADMIN_HASH}${LDAPAUTH_HASH}${SLAVE_HASH}'
    for tmpl in config.ldif data.ldif memberof_module.ldif memberof_overlay.ldif passwords.ldif; do
        if [ ! -f "${TEMPLATES_DIR}/${tmpl}" ]; then
            echo "render-ldif: FATAL: missing template ${tmpl}" >&2
            exit 1
        fi
        envsubst "${VARS}" < "${TEMPLATES_DIR}/${tmpl}" > "${RENDERED_DIR}/${tmpl}"
    done
    echo "render-ldif: rendered $(ls ${RENDERED_DIR} | wc -l) LDIF files"
    ls -la "${RENDERED_DIR}"

---
apiVersion: v1
kind: Service
metadata:
  name: openldap
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shoggoth.labels" . | nindent 4 }}
    app.kubernetes.io/component: openldap
spec:
  selector:
    app: openldap
  ports:
  - name: ldap
    port: 389
    targetPort: 389
  - name: ldaps
    port: 636
    targetPort: 636
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openldap
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shoggoth.labels" . | nindent 4 }}
    app.kubernetes.io/component: openldap
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openldap
  template:
    metadata:
      labels:
        app: openldap
      annotations:
        secret.reloader.stakater.com/reload: openldap-admin-password,openldap-config-admin-password,openldap-ldapauth-password,openldap-slave-password
    spec:
      dnsPolicy: None
      dnsConfig:
        nameservers:
        - {{ .Values.identity.dnsIp }}
        searches:
        - {{ .Release.Namespace }}.svc.cluster.local
        - svc.cluster.local
        - cluster.local
      initContainers:
      - name: render-ldif
        image: asherikov/shoggoth_tools:alpine
        imagePullPolicy: IfNotPresent
        env:
        - name: LDAP_BASE_DN
          value: {{ include "shoggoth.ldapBaseDn" . }}
        - name: SHOGGOTH_DOMAIN
          value: {{ .Values.identity.domain }}
        - name: MDB_DN
          value: olcDatabase={1}mdb,cn=config
        command:
        - bash
        - -c
        args:
        - /tmpl/render.sh
        resources:
          requests:
            memory: 32Mi
            cpu: 50m
          limits:
            memory: 64Mi
            cpu: 200m
        volumeMounts:
        - name: ldif-templates
          mountPath: /templates
          readOnly: true
        - name: rendered-ldif
          mountPath: /rendered
        - name: admin-password
          mountPath: /run/secrets/openldap_admin_password
          subPath: password
          readOnly: true
        - name: ldapauth-password
          mountPath: /run/secrets/openldap_ldapauth_password
          subPath: password
          readOnly: true
        - name: slave-password
          mountPath: /run/secrets/openldap_slave_password
          subPath: password
          readOnly: true
        - name: render-script
          mountPath: /tmpl
          readOnly: true
      - name: wait-bootstrap
        image: asherikov/shoggoth_tools:alpine
        imagePullPolicy: IfNotPresent
        command:
        - bash
        - -c
        args:
        - |
          set -euo pipefail
          NS="{{ .Release.Namespace }}"
                    wait_for_externalsecret() {
                      local name="$1"
                      echo "wait-bootstrap: waiting for externalsecret/${name} Ready in namespace ${NS}..."
                      for i in $(seq 1 60); do
                        if kubectl get externalsecret "${name}" -n "${NS}" -o json 2>/dev/null | jq -e '.status.conditions // [] | map(select(.type=="Ready" and .status=="True")) | length > 0' >/dev/null 2>&1; then
                          echo "wait-bootstrap: externalsecret/${name} Ready (after $((i*10))s)"
                          return 0
                        fi
                        sleep 10
                      done
                      echo "FAIL: externalsecret/${name} not Ready after 10m"
                      echo "      Hint: check status from outside the pod:"
                      echo "            kubectl get externalsecret -n ${NS} ${name} -o yaml"
                      echo "            kubectl describe externalsecret -n ${NS} ${name}"
                      echo "      Most common causes: OpenBao unavailable, SecretStore reference broken,"
                      echo "      or remote secret missing (Orphan policies require a value in the source store)."
                      return 1
                    }
          for pw in openldap-admin-password openldap-config-admin-password openldap-ldapauth-password openldap-slave-password; do
                    case "${pw}" in
                      openldap-admin-password) wait_for_externalsecret openldap-admin-password || exit 1 ;;
                      openldap-config-admin-password) wait_for_externalsecret openldap-config-admin-password || exit 1 ;;
                      openldap-ldapauth-password) wait_for_externalsecret openldap-ldapauth-password || exit 1 ;;
                      openldap-slave-password) wait_for_externalsecret openldap-slave-password || exit 1 ;;
                    esac
          done
          echo "wait-bootstrap: all K8s Secrets Ready"

        resources:
          requests:
            memory: 32Mi
            cpu: 50m
          limits:
            memory: 64Mi
            cpu: 200m
        volumeMounts: []
      containers:
      - name: openldap
        image: osixia/openldap:1.5.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 389
          name: ldap
        - containerPort: 636
          name: ldaps
        args:
        - --loglevel
        - debug
        env:
        - name: LDAP_DOMAIN
          value: {{ .Values.identity.domain }}
        - name: LDAP_ADMIN_PASSWORD_FILE
          value: /run/secrets/openldap_admin_password
        - name: LDAP_CONFIG_PASSWORD_FILE
          value: /run/secrets/openldap_config_admin_password
        - name: LDAP_LOG_LEVEL
          value: '256'
        - name: LDAP_TLS
          value: 'false'
        - name: CONTAINER_LOG_LEVEL
          value: '5'
        - name: LDAP_REMOVE_CONFIG_AFTER_SETUP
          value: 'false'
        - name: OTEL_TRACES_EXPORTER
          value: otlp
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://otelcol:4318
        - name: SHOGGOTH_DOMAIN
          value: {{ .Values.identity.domain }}
        volumeMounts:
        - name: data
          mountPath: /var/lib/ldap
        - name: config
          mountPath: /etc/ldap/slapd.d
        - name: rendered-ldif
          mountPath: /shoggoth/openldap
          readOnly: true
        - name: init-script
          mountPath: /shoggoth/openldap-init.sh
          subPath: init.sh
          readOnly: true
        - name: admin-password
          mountPath: /run/secrets/openldap_admin_password
          subPath: password
          readOnly: true
        - name: config-admin-password
          mountPath: /run/secrets/openldap_config_admin_password
          subPath: password
          readOnly: true
        lifecycle:
          postStart:
            exec:
              command:
              - /bin/bash
              - -c
              - |
                set -o pipefail

                echo "=== openldap-init start $(date -Iseconds) ==="

                /bin/bash /shoggoth/openldap-init.sh

                echo "=== openldap-init exit $? $(date -Iseconds) ==="

        resources:
          requests:
            memory: 256Mi
            cpu: 100m
          limits:
            memory: 512Mi
            cpu: 1000m
        readinessProbe:
          exec:
            command:
            - bash
            - -c
            - test -f /run/shoggoth-ldap-init-done
          initialDelaySeconds: 10
          periodSeconds: 5
          failureThreshold: 60
        livenessProbe:
          tcpSocket:
            port: 389
          initialDelaySeconds: 30
          periodSeconds: 10
      volumes:
      - name: init-script
        configMap:
          name: openldap-init
      - name: ldif-templates
        configMap:
          name: openldap-ldif-templates
      - name: render-script
        configMap:
          name: openldap-render-ldif
          defaultMode: 493
      - name: rendered-ldif
        emptyDir: {}
      - name: data
        persistentVolumeClaim:
          claimName: openldap-data
      - name: config
        persistentVolumeClaim:
          claimName: openldap-config
      - name: admin-password
        secret:
          secretName: openldap-admin-password
      - name: config-admin-password
        secret:
          secretName: openldap-config-admin-password
      - name: ldapauth-password
        secret:
          secretName: openldap-ldapauth-password
      - name: slave-password
        secret:
          secretName: openldap-slave-password
      serviceAccountName: openldap
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openldap
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shoggoth.labels" . | nindent 4 }}
    app.kubernetes.io/component: openldap
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: openldap-bootstrap-wait
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shoggoth.labels" . | nindent 4 }}
    app.kubernetes.io/component: openldap
rules:
- apiGroups:
  - ''
  resources:
  - secrets
  resourceNames:
  - openldap-admin-password
  - openldap-config-admin-password
  - openldap-ldapauth-password
  - openldap-slave-password
  verbs:
  - get
- apiGroups:
  - external-secrets.io
  resources:
