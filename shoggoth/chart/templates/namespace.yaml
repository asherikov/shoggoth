{{- /*
  templates/namespace.yaml — the release Namespace.

  The chart owns the Namespace OBJECT; it does not own the Namespace's
  EXISTENCE. Whoever installs the release has to create the namespace with
  kubectl before it calls helm, and it has to: Helm stores the release
  record — a Secret — in the release namespace BEFORE it applies any
  manifest (pkg/action/install.go, Helm v3.19.0: i.cfg.Releases.Create(rel)
  runs before performInstallCtx).
  A Namespace object inside the chart is applied during performInstallCtx,
  i.e. too late — without an existing namespace the release record's
  create fails with "namespaces not found" and the install aborts before
  a single chart resource is applied.

  --create-namespace ALONE IS NOT ENOUGH FOR THIS CHART, and this file
  is the reason. The manifest contains a Namespace object, and Helm's
  install path creates the namespace itself (--create-namespace) only
  AFTER its install-time ownership check (pkg/action/install.go: the
  requireAdoption/existingResourceConflict check precedes the
  `if i.CreateNamespace` block). Two consequences:
    * with --create-namespace alone, nothing exists at the ownership
      check, so Helm takes the create path for the whole manifest and
      POSTs this Namespace object into the namespace it just created:
      `namespaces "shoggoth" already exists`;
    * with the namespace created beforehand, this object IS an existing
      resource at the ownership check, so Helm takes the update path and
      does not create it a second time.
  So the namespace has to exist BEFORE the helm call, and it has to be
  adopted: created beforehand with kubectl, and the install run with
  --take-ownership (the kubectl-created namespace carries no Helm ownership
  metadata, so without adoption the same check refuses the manifest with
  "invalid ownership metadata"). The two are a pair — neither works without
  the other.

  `helm.sh/resource-policy: keep` is load-bearing. Without it, `helm
  uninstall` would delete the Namespace, and deleting a namespace cascades
  to every PVC and Secret in it — turning an uninstall into a purge and
  destroying the data the uninstall exists to preserve. Helm's
  filterManifestsToKeep honours the annotation on every resource kind,
  cluster-scoped ones included, so the Namespace survives the uninstall.
  Deleting the namespace by name is the deliberate act, and it is not one
  an uninstall performs.

  The name is .Release.Namespace, not a values key: the namespace the
  release lives in IS the namespace this object names. A values key would
  be a second source of truth that can disagree with --namespace, and the
  two would have to be kept in sync by hand.

  What the chart does own is the namespace's metadata, so it is declared
  here instead of being left to whatever the cluster happened to create —
  including the PodSecurity profile, which the install strips with
  `kubectl label namespace ... key-` BEFORE it runs, rather than after:
  stripping it after, as this chart once did, let the first Deployments
  be admitted against whatever labels the namespace already carried, and
  the chart's own privileged workloads are rejected by `baseline`.

  Helm applies resources sorted by kind (releaseutil.InstallOrder:
  PriorityClass, Namespace, NetworkPolicy, ...), so this object is applied
  before every workload in the chart — on install and on upgrade alike.

  That ordering does not mean the METADATA lands. On the first install
  the namespace was created outside the release — by a kubectl call
  beforehand, or by --create-namespace — so the reconciliation Helm
  computes for a resource that is new to the release leaves the live
  object alone: the patch is the three-way merge of the previous
  release's manifest against the new one, and for a resource that is new
  to the release that delta is empty. The PodSecurity profile below is
  therefore DECLARED but not APPLIED on a first install, and the namespace
  stays unlabelled, which PodSecurity admission reads as `privileged`.

  That is deliberate, and the installer keeps it deliberate: the step that
  creates the namespace (ansible/deploy.yml, "Strip any PodSecurity profile
  from the instance namespace") removes these three labels before the
  install, so the unlabelled state is what the install asked for rather
  than what Helm's empty patch happened to leave — and so a namespace that
  arrived already labelled `enforce=baseline` has that label gone before
  the chart's first Deployments are admitted. From the second install
  onwards the namespace is in the release manifest, the delta is no longer
  empty, and the labels below do land.

  A reinstall needs --take-ownership for the same reason. The namespace
  survives the uninstall (resource-policy: keep) and it survives it
  WITHOUT Helm's ownership metadata: the live namespace never receives
  the chart's labels on the first install, because the patch Helm
  computes for a resource that is new to the release is the three-way
  merge of the previous release's manifest against the new one, and for
  a new resource that delta is empty. Adoption is what makes the
  reinstall work, not leftover metadata.
*/}}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Release.Namespace }}
  annotations:
    # Kept across `helm uninstall` so uninstalling stops the workloads but
    # preserves the namespace — and with it the PVCs and Secrets that an
    # uninstall is required to preserve. Deleting the namespace would
    # cascade to all of them.
    helm.sh/resource-policy: keep
  labels:
    {{- include "shoggoth.labels" . | nindent 4 }}
    # PodSecurity: the chart's workloads use hostPath volumes, privileged
    # containers, hostNetwork and capabilities that violate the `baseline`
    # profile by design — a namespace labelled `enforce=baseline` makes
    # every Deployment's pods `FailedCreate` with `forbidden: violates
    # PodSecurity "baseline:latest"`.
    #
    # Kubernetes' PodSecurity admission defaults an unlabelled namespace to
    # `privileged`, so naming the profile here pins the requirement instead
    # of relying on that default. It is not a values key: the privileged
    # Deployments (slave-dind, wireguard, localai, openbao-bootstrap, dind)
    # are baked into the templates, so any stricter profile breaks the
    # install outright rather than degrading gracefully.
    #
    # The profile comes from _helpers.tpl (shoggoth.podSecurityLabels).
    # The installer's strip (ansible/deploy.yml, "Strip any PodSecurity
    # profile from the instance namespace") REMOVES these labels rather
    # than setting them, so on a first install the namespace ends up
    # unlabelled — `privileged` by cluster default — and from the second
    # install onwards these declarations land on it. Either way the
    # namespace is permissive enough for the Deployments below.
    {{- include "shoggoth.podSecurityLabels" . | nindent 4 }}
