# Per-instance shoggoth configuration — test instance.
#
# Same contract as shoggoth/shoggoth.yaml; see that file for the full
# description. Selected with `make up INSTANCE=shoggoth-test`.
#
# Every value the cluster resolves globally must differ from
# shoggoth/shoggoth.yaml, or a second instance cannot be installed beside the
# primary one:
#
#   identity.instanceDir   hostPath volumes under /var/lib/rancher/k3s/storage/
#   identity.dnsIp         Service clusterIP — cluster-scoped and globally
#                          unique, so the API server rejects a duplicate
#   network.*.hostPort     registry, web-external and wireguard are all
#                          hostNetwork, so their container ports bind the host
#                          directly and contend across instances
#
# Only identity.domain is shared, deliberately: both instances answer for
# s.local and are told apart by port. These are the values the pre-Helm
# shoggoth-test.env carried; the Helm migration dropped them and left this file
# identical to the primary apart from instanceDir.

identity:
  domain: s.local
  githubOrg: asherikov
  dnsIp: 10.43.0.54
  instanceDir: shoggoth-test

network:
  webExternal:
    hostPort: "52443"
  wireguard:
    udpPort: "52820"
    uiPort: "52821"
  registry:
    hostPort: "81"

ai:
  defaultModel: openai/MiniMax-M3
  defaultApi: https://api.minimax.io/v1
  defaultTokenFileRef: /shoggoth/private/ai-default-token.txt

gitea:
  serverTokenFileRef: /shoggoth/private/gitea-server-token.txt