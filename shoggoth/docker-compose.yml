networks:
    shoggoth:
        name: shoggoth
        external: false
        ipam:
            config:
                - subnet: 172.20.0.0/24

volumes:
    shoggoth_slave-dind_socket:
        name: "shoggoth_slave-dind_socket"
    shoggoth_redmine_db:
        name: "shoggoth_redmine_db"
    shoggoth_angie_build_cache:
        name: "shoggoth_angie_build_cache"
    shoggoth_apt_cache:
        name: "shoggoth_apt_cache"
    shoggoth_python_cache:
        name: "shoggoth_python_cache"
    shoggoth_docker_cache:
        name: "shoggoth_docker_cache"
    shoggoth_docker_registry:
        name: "shoggoth_docker_registry"
    shoggoth_redmine_files:
        name: "shoggoth_redmine_files"
    shoggoth_redmine_bundle_cache:
        name: "shoggoth_redmine_bundle_cache"
    shoggoth_cdash_db:
        name: "shoggoth_cdash_db"
    shoggoth_cdash_storage:
        name: "shoggoth_cdash_storage"
    shoggoth_openldap_data:
        name: "shoggoth_openldap_data"
    shoggoth_openldap_config:
        name: "shoggoth_openldap_config"
    shoggoth_openbao_data:
        name: "shoggoth_openbao_data"
    shoggoth_localai_models:
        name: "shoggoth_localai_models"
    shoggoth_localai_backends:
        name: "shoggoth_localai_backends"
    shoggoth_localai_data:
        name: "shoggoth_localai_data"

secrets:
    gitea_server_token:
        file: ./private/gitea-server-token.txt
    redmine_token:
        file: ./private/redmine-token.txt
    ssh_id_rsa:
        file: ./private/ssh/id_rsa
    gitea_user:
        file: ./private/gitea-user.txt
    ollama_cloud_token:
        file: ./private/ollama-cloud-token.txt

x-service: &default_service
    networks:
        - shoggoth
    restart: unless-stopped
    # dns_search appends the domain to bare names (e.g. "git" -> "git.s.local"),
    # allowing Docker DNS (127.0.0.11) to resolve short container names via their
    # FQDN container_name values (e.g. container_name: git.s.local)
    dns_search: ${SHOGGOTH_DOMAIN}
    logging:
        driver: json-file
        options:
            max-size: "10m"
            max-file: "3"
            tag: "{{.Name}}"

x-environment: &default_environment
    SHOGGOTH_DOMAIN: ${SHOGGOTH_DOMAIN}
    OTEL_TRACES_EXPORTER: otlp
    OTEL_EXPORTER_OTLP_ENDPOINT: http://otelcol:4318


services:
    bringup:
        image: docker-registry.${SHOGGOTH_DOMAIN}/slave_noble:latest
        user: "root"
        container_name: bringup.${SHOGGOTH_DOMAIN}
        networks:
            - shoggoth
        volumes:
            # bringup scripts, templates, auto_secrets (generated), and rendered output
            - ./bringup:/shoggoth/bringup
            # private directory (user-provided tokens and config files)
            - ./private:/shoggoth/private:ro
            # openbao persistent volume (to read root token after init)
            - shoggoth_openbao_data:/shoggoth/openbao-data
            # docker-cache CA certificate directory (pre-seed shared CA)
            - ./docker/cache/certs:/shoggoth/docker/cache/certs
            # persistent data directories (mkdir + chown for correct ownership)
            - ./git/gitea/data:/shoggoth/data/gitea
            - ./git/runner/data:/shoggoth/data/gitea-runner
            - shoggoth_redmine_db:/shoggoth/data/redmine-database
            - shoggoth_redmine_files:/shoggoth/data/redmine-files
            - shoggoth_redmine_bundle_cache:/shoggoth/data/redmine-bundle-cache
            - ./ai/litellm/data:/shoggoth/data/litellm
            - ./ai/plugin:/shoggoth/ai/plugin:ro
        environment:
            !!merge <<: *default_environment
        secrets:
            - gitea_server_token
            - redmine_token
            - ollama_cloud_token
        entrypoint: /shoggoth/bringup/bringup.sh
        depends_on:
            openbao:
                condition: service_healthy

    slave-dind:
        image: docker:dind
        container_name: slave-dind.${SHOGGOTH_DOMAIN}
        privileged: true
        restart: unless-stopped
        networks:
            - shoggoth
        volumes:
            - shoggoth_slave-dind_socket:/dind
            - ./workflow/scripts:/host_volumes/workflow-scripts:ro
            - ./docker/slave-dind/entrypoint.sh:/dind_entrypoint.sh:ro
            - ./setup-client.sh:/host_volumes/setup-client.sh:ro
        environment:
            !!merge <<: *default_environment
            DOCKER_HOST: unix:///dind/docker.sock
        secrets:
            - gitea_server_token
            - ssh_id_rsa
            - gitea_user
        entrypoint: /dind_entrypoint.sh
        depends_on:
            git:
                condition: service_started
            docker-registry:
                condition: service_started
        healthcheck:
            test: ["CMD-SHELL", "docker info > /dev/null 2>&1 && docker image inspect docker-registry.s.local/slave_noble:dind > /dev/null 2>&1 && test -S /shoggoth/git-cred/ssh_auth_sock"]
            interval: 5s
            timeout: 3s
            retries: 30
            start_period: 120s

    web-internal:
        !!merge <<: *default_service
        # https://github.com/cccache/ccache/wiki/HTTP-storage
        image: docker.angie.software/angie:latest
        container_name: web-internal.${SHOGGOTH_DOMAIN}
        networks:
            shoggoth:
                aliases:
                    - api.${SHOGGOTH_DOMAIN}
                    - build-cache.${SHOGGOTH_DOMAIN}
                    - slave-term.${SHOGGOTH_DOMAIN}
                    - python-cache.${SHOGGOTH_DOMAIN}
                    - ${SHOGGOTH_DOMAIN}
        volumes:
            - ./bringup/rendered/web-internal/web-internal.conf:/etc/angie/angie.conf:ro
            - ./angie/html:/data/html:ro
            - ./bringup/rendered/plugin.tar.gz:/data/plugin.tar.gz:ro
            - shoggoth_angie_build_cache:/data/build_cache
            - shoggoth_python_cache:/data/python_cache
        depends_on:
            bringup:
                condition: service_completed_successfully
            git:
                condition: service_started
            redmine:
                condition: service_started
            slave-dind:
                condition: service_started
        post_start:
            # needs to be writable
            - command: chown -R angie:angie /data/build_cache /data/python_cache
              user: root

    web-external:
        !!merge <<: *default_service
        image: docker.angie.software/angie:latest
        container_name: web-external.${SHOGGOTH_DOMAIN}
        ports:
            - "443:443"
        volumes:
            - ./bringup/rendered/web-external/web-external.conf:/etc/angie/angie.conf:ro
            - ./bringup/rendered/certs:/data/certs:ro
            - ./setup-client.sh:/data/setup-client.sh:ro
        depends_on:
            bringup:
                condition: service_completed_successfully
            wireguard:
                condition: service_started

    apt-cache:
        !!merge <<: *default_service
        # https://hub.docker.com/r/sameersbn/apt-cacher-ng
        # https://github.com/sameersbn/docker-apt-cacher-ng
        # https://github.com/gnzsnz/apt-cacher-ng
        # https://www.dotlinux.net/blog/quick-debian-ubuntu-package-caching-proxy-setup-with-apt-cacher-ng/
        image: sameersbn/apt-cacher-ng:latest
        container_name: apt-cache.${SHOGGOTH_DOMAIN}
        volumes:
            # Cache storage directory (relative to this compose file location)
            - shoggoth_apt_cache:/var/cache/apt-cacher-ng
            # Log storage directory
            - ./apt-cacher-ng/logs:/var/log/apt-cacher-ng
        environment:
            !!merge <<: *default_environment
        post_start:
            # needs to be writable
            - command: chown -R apt-cacher-ng:apt-cacher-ng /var/cache/apt-cacher-ng /var/log/apt-cacher-ng
              user: root

    docker-cache:
        !!merge <<: *default_service
        # https://github.com/rpardini/docker-registry-proxy
        image: rpardini/docker-registry-proxy:0.6.5
        container_name: docker-cache.${SHOGGOTH_DOMAIN}
        environment:
            !!merge <<: *default_environment
            # Common registries to cache
            REGISTRIES: registry.k8s.io gcr.io quay.io ghcr.io mcr.microsoft.com docker.gitea.com docker.angie.software codeberg.org public.ecr.aws
            # Enable manifest caching to avoid rate-limiting
            ENABLE_MANIFEST_CACHE: true
            # Cache configuration
            CACHE_MAX_SIZE: 64g
            # Manifest cache tiers
            MANIFEST_CACHE_PRIMARY_REGEX: "(stable|nightly|production|test)"
            MANIFEST_CACHE_PRIMARY_TIME: 10m
            MANIFEST_CACHE_SECONDARY_REGEX: "(.*)(\\d|\\.)+(\\d|\\.)+(.*)(\\d|\\.)+"
            MANIFEST_CACHE_SECONDARY_TIME: 60d
            MANIFEST_CACHE_DEFAULT_TIME: 1h
            DISABLE_IPV6: true
            ALLOW_PUSH: true
        ports:
            - "127.0.0.1:3128:3128"
        volumes:
            # Cache storage directory (relative to this compose file location)
            - shoggoth_docker_cache:/docker_mirror_cache
            # CA certificate storage
            - ./docker/cache/certs:/ca
        depends_on:
            bringup:
                condition: service_completed_successfully

    docker-registry:
        # gitea has registry too, but there are naming contraints
        # https://github.com/distribution/distribution
        # https://distribution.github.io/distribution/
        !!merge <<: *default_service
        image: registry:latest
        container_name: docker-registry.${SHOGGOTH_DOMAIN}
        volumes:
            - shoggoth_docker_registry:/var/lib/registry
        ports:
            - "127.0.0.1:80:80"
        environment:
            !!merge <<: *default_environment
            REGISTRY_LOG_LEVEL: info
            REGISTRY_HTTP_HOST: "docker-registry.${SHOGGOTH_DOMAIN}"
            REGISTRY_HTTP_ADDR: ":80"
            REGISTRY_HTTP_DEBUG_ADDR: ""
            OTEL_SERVICE_NAME: docker-registry

    dns:
        #<<: *default_service
        # https://hub.docker.com/r/mvance/unbound/
        image: mvance/unbound:latest
        container_name: dns.${SHOGGOTH_DOMAIN}
        volumes:
            - ./bringup/rendered/unbound/unbound.conf:/opt/unbound/etc/unbound/unbound.conf:ro
            - ./unbound/dns-zone-blacklist/unbound/unbound.blacklist:/opt/unbound/etc/unbound/unbound.blacklist:ro
            - ./unbound/dns-zone-blacklist/unbound/unbound-nxdomain.blacklist:/opt/unbound/etc/unbound/unbound-nxdomain.blacklist:ro
        environment:
            !!merge <<: *default_environment
        networks:
            shoggoth:
                ipv4_address: 172.20.0.53
        restart: unless-stopped
        depends_on:
            bringup:
                condition: service_completed_successfully

    wireguard:
        # https://github.com/wg-easy/wg-easy
        # WireGuard VPN server with web management UI
        !!merge <<: *default_service
        image: ghcr.io/wg-easy/wg-easy:15
        container_name: wireguard.${SHOGGOTH_DOMAIN}
        ports:
            - "51820:51820/udp"
        cap_add:
            - NET_ADMIN
            - SYS_MODULE
        sysctls:
            - net.ipv4.ip_forward=1
            - net.ipv4.conf.all.src_valid_mark=1
        devices:
            - /dev/net/tun:/dev/net/tun
        volumes:
            - ./vpn/wireguard/data:/etc/wireguard
            - ./vpn/wireguard/entrypoint.sh:/entrypoint.sh:ro
            - /lib/modules:/lib/modules:ro
            - ./bringup/rendered/secrets/wireguard/admin-password:/run/secrets/admin_password:ro
        entrypoint: ["/entrypoint.sh"]
        command: ["/usr/bin/dumb-init", "node", "server/index.mjs"]
        environment:
            !!merge <<: *default_environment
            INIT_ENABLED: "true"
            INIT_USERNAME: admin
            INIT_HOST: ${SHOGGOTH_DOMAIN}
            INIT_PORT: "51820"
            INIT_PASSWORD: "changeme"
            INIT_ALLOWED_IPS: "172.20.0.0/24"
            INIT_DNS: "172.20.0.53"
            INSECURE: "true"
            DISABLE_IPV6: "true"
            PORT: "80"
        # TODO: re-enable admin password sync via post_start once wg-easy CLI is fixed
        #       or migrate to reset-admin.mjs approach (see vpn/wireguard/reset-admin.mjs)
        depends_on:
            bringup:
                condition: service_completed_successfully

    localai:
        !!merge <<: *default_service
        # https://github.com/mudler/LocalAI
        # Vulkan image includes CPU backends; LocalAI auto-detects GPU
        # availability and downloads matching backends from the backend gallery.
        image: localai/localai:latest-gpu-vulkan
        container_name: localai.${SHOGGOTH_DOMAIN}
        volumes:
            - shoggoth_localai_models:/models
            - shoggoth_localai_backends:/backends
            - shoggoth_localai_data:/data
            - ./ai/localai/preload-models.yaml:/models/preload-models.yaml:ro
        devices:
            - /dev/dri:/dev/dri
            - /dev/kfd:/dev/kfd
        environment:
            !!merge <<: *default_environment
            ADDRESS: "0.0.0.0:80"
            MODELS_PATH: /models
            DEBUG: "false"
            CONTEXT_SIZE: 256000
            THREADS: 4
            MAX_ACTIVE_BACKENDS: 1
            SINGLE_ACTIVE_BACKEND: "true"
            # delays startip even if backend is already installed
            #LOCALAI_EXTERNAL_BACKENDS: "llama-cpp"
            #PRELOAD_MODELS_CONFIG: "/models/preload-models.yaml"

    litellm:
        # https://github.com/BerriAI/litellm
        # LLM proxy: OpenAI-compatible gateway for LocalAI with Prometheus metrics and OTel tracing
        # Also serves as MCP gateway for observability on MCP tool calls
        !!merge <<: *default_service
        image: ghcr.io/berriai/litellm:main-stable
        container_name: litellm.${SHOGGOTH_DOMAIN}
        environment:
            !!merge <<: *default_environment
            OTEL_SERVICE_NAME: litellm
            OTEL_EXPORTER_OTLP_ENDPOINT: http://otelcol:4318
            OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
        volumes:
            - ./bringup/rendered/litellm/config.yaml:/app/config.yaml:ro
            - ./ai/litellm/data:/app/litellm
        depends_on:
            localai:
                condition: service_started
            mcp-gitea:
                condition: service_started
            bringup:
                condition: service_completed_successfully
        command: ["--config", "/app/config.yaml", "--port", "80"]

    git:
        !!merge <<: *default_service
        image: gitea/gitea:latest
        container_name: git.${SHOGGOTH_DOMAIN}
        environment:
            !!merge <<: *default_environment
            # https://docs.gitea.com/next/administration/config-cheat-sheet
            GITEA__overall__APP_NAME: 'git.${SHOGGOTH_DOMAIN}'
            GITEA__repository__FORCE_PRIVATE: 'false'
            GITEA__repository__USE_COMPAT_SSH_URI: 'false'
            #GITEA__repository__DISABLE_HTTP_GIT: 'true'
            GITEA__repository__DEFAULT_BRANCH: 'main'
            GITEA__repository__DEFAULT_PRIVATE: 'private'
            # disabled: ,repo.packages,repo.actions
            GITEA__repository__DEFAULT_REPO_UNITS: 'repo.code,repo.releases,repo.issues,repo.pulls,repo.wiki,repo.projects'
            GITEA__server__START_SSH_SERVER: 'false'
            #GITEA__server__SSH_PORT: "22"
            #GITEA__server__SSH_LISTEN_PORT: "22"
            GITEA__server__HTTP_PORT: "80"
            GITEA__server__ROOT_URL: 'http://git.${SHOGGOTH_DOMAIN}'
            GITEA__server__DOMAIN: 'git.${SHOGGOTH_DOMAIN}'
            GITEA__server__SSH_DOMAIN: 'git.${SHOGGOTH_DOMAIN}'
            GITEA__service__NO_REPLY_ADDRESS: 'noreply.git.${SHOGGOTH_DOMAIN}'
            GITEA__webhook__ALLOWED_HOST_LIST: 'private'
            # https://forum.gitea.com/t/unattended-gitea-installation-from-the-cli/3373/23
            #GITEA__security__INSTALL_LOCK: 'true' # skip installation page
            GITEA__admin__USER_DISABLED_FEATURES: 'deletion'
            GITEA__actions__DEFAULT_ACTIONS_URL: 'github'
            GITEA__opentelemetry__ENABLED: 'true'
            GITEA__opentelemetry__ENDPOINT: 'http://otelcol:4317'
        volumes:
            - ./git/gitea/data:/data
            - ./git/gitea/init.sh:/shoggoth/git/gitea/init.sh:ro
            - ./bringup/rendered/gitea/gitea.env:/shoggoth/bringup/rendered/gitea/gitea.env:ro
            - ./bringup/rendered/secrets/gitea-runner-token:/run/secrets/gitea_runner_token:ro
            - /etc/timezone:/etc/timezone:ro
            - /etc/localtime:/etc/localtime:ro
        post_start:
            - command: ["/bin/bash", "-c", "/bin/bash /shoggoth/git/gitea/init.sh 2>&1 | tee /var/log/shoggoth-gitea-init.log"]
        depends_on:
            bringup:
                condition: service_completed_successfully
            openldap:
                condition: service_healthy

    gitea-runner:
        !!merge <<: *default_service
        # https://docs.gitea.com/next/usage/actions/act-runner
        #
        # note that gitea actions anre not fully compatible with github actions,
        # you would need to install nodejs to all images that execute jobs
        # https://forum.gitea.com/t/use-actions-checkout-v3-in-a-container-without-node-installed/8406
        #
        # https://github.com/harness/harness
        image: gitea/act_runner:latest
        container_name: gitea-runner.${SHOGGOTH_DOMAIN}
        volumes:
            - ./git/runner/data:/data
            - ./bringup/rendered/gitea-runner/config.yaml:/config.yaml:ro
            - shoggoth_slave-dind_socket:/dind
            - ./bringup/rendered/secrets/gitea-runner-token:/run/secrets/gitea_runner_token:ro
        environment:
            !!merge <<: *default_environment
            GITEA_INSTANCE_URL: http://git.${SHOGGOTH_DOMAIN}
            GITEA_RUNNER_NAME: shoggoth-runner
            GITEA_RUNNER_LABELS: ubuntu-latest,ubuntu-24.04
            GITEA_RUNNER_REGISTRATION_TOKEN_FILE: '/run/secrets/gitea_runner_token'
            CONFIG_FILE: /config.yaml
        depends_on:
            slave-dind:
                condition: service_healthy

    mcp-gitea:
        !!merge <<: *default_service
        # https://gitea.com/gitea/gitea-mcp
        # https://hub.docker.com/r/gitea/gitea-mcp-server
        image: docker.gitea.com/gitea-mcp-server:latest
        container_name: mcp-gitea.${SHOGGOTH_DOMAIN}
        environment:
            !!merge <<: *default_environment
            MCP_MODE: http
            GITEA_HOST: http://git.${SHOGGOTH_DOMAIN}
            GITEA_INSECURE: true
        command: /app/gitea-mcp --port 80

    basic-memory:
        !!merge <<: *default_service
        # https://basicmemory.com
        # https://docs.basicmemory.com/reference/docker
        image: ghcr.io/basicmachines-co/basic-memory:latest
        container_name: basic-memory.${SHOGGOTH_DOMAIN}
        volumes:
            - ./ai/basic_memory/data:/app/data
        environment:
            !!merge <<: *default_environment
            BASIC_MEMORY_HOME: /app/data/basic-memory
            BASIC_MEMORY_PROJECT_ROOT: /app/data
            BASIC_MEMORY_SEMANTIC_EMBEDDING_PROVIDER: openai
            BASIC_MEMORY_SEMANTIC_EMBEDDING_MODEL: nomic-embed-text
            OPENAI_API_KEY: localai
            OPENAI_BASE_URL: http://litellm/v1
            OTEL_SERVICE_NAME: basic-memory
        command: ["basic-memory", "mcp", "--transport", "streamable-http", "--host", "0.0.0.0", "--port", "80"]

    git-pages:
        !!merge <<: *default_service
        # https://codeberg.org/git-pages/git-pages
        # https://git-pages.org/
        image: codeberg.org/git-pages/git-pages:latest
        container_name: git-pages.${SHOGGOTH_DOMAIN}
        volumes:
            - ./git/pages/data:/app/data
            - ./git/pages/config.toml:/app/config.toml:ro
        environment:
            !!merge <<: *default_environment
            PAGES_INSECURE: 1

    redmine-db:
        !!merge <<: *default_service
        # https://hub.docker.com/_/postgres
        image: postgres:18-alpine
        container_name: redmine-db.${SHOGGOTH_DOMAIN}
        environment:
            !!merge <<: *default_environment
            POSTGRES_DB: redmine
            POSTGRES_USER: redmine
            POSTGRES_PASSWORD_FILE: /run/secrets/redmine_db_password
        volumes:
            - shoggoth_redmine_db:/var/lib/postgresql
            - ./bringup/rendered/secrets/redmine-db/redmine-db/password:/run/secrets/redmine_db_password:ro
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U redmine"]
            interval: 1s
            timeout: 3s
            retries: 120
        depends_on:
            bringup:
                condition: service_completed_successfully

    redmine:
        !!merge <<: *default_service
        # https://hub.docker.com/_/redmine
        # https://www.redmine.org/
        # https://github.com/topics/redmine-plugin
        image: redmine:6.1.2-alpine
        container_name: redmine.${SHOGGOTH_DOMAIN}
        environment:
            !!merge <<: *default_environment
            REDMINE_DB_POSTGRES: redmine-db
            REDMINE_DB_DATABASE: redmine
            REDMINE_DB_USERNAME: redmine
            REDMINE_DB_PASSWORD_FILE: /run/secrets/redmine_db_password
            REDMINE_SECRET_KEY_BASE_FILE: /run/secrets/redmine_secret_key_base
            REDMINE_PLUGINS_MIGRATE: true
        volumes:
            - shoggoth_redmine_files:/usr/src/redmine/files
            - ./redmine/plugins:/usr/src/redmine/plugins
            - ./redmine/init.sh:/shoggoth/redmine/init.sh:ro
            - ./bringup/rendered/redmine/redmine.env:/shoggoth/bringup/rendered/redmine/redmine.env:ro
            - shoggoth_redmine_bundle_cache:/usr/local/bundle/cache/
            - ./bringup/rendered/secrets/redmine-db/redmine/password:/run/secrets/redmine_db_password:ro
            - ./bringup/rendered/secrets/redmine/secret-key-base:/run/secrets/redmine_secret_key_base:ro
        command: rails server -b 0.0.0.0 -p 80
        post_start:
            # docker exec redmine.s.local cat /var/log/shoggoth-redmine-init.log
            - command: ["/bin/bash", "-c", "/bin/bash /shoggoth/redmine/init.sh 2>&1 | tee /var/log/shoggoth-redmine-init.log"]
        depends_on:
            redmine-db:
                condition: service_healthy
            bringup:
                condition: service_completed_successfully
            openldap:
                condition: service_healthy

    kestra-db:
        !!merge <<: *default_service
        # https://hub.docker.com/_/postgres
        image: postgres:18-alpine
        container_name: kestra-db.${SHOGGOTH_DOMAIN}
        environment:
            !!merge <<: *default_environment
            POSTGRES_DB: kestra
            POSTGRES_USER: kestra
            POSTGRES_PASSWORD_FILE: /run/secrets/kestra_db_password
        tmpfs:
            # workaround for https://github.com/kestra-io/kestra/issues/13700
            - /var/lib/postgresql
        volumes:
            - ./bringup/rendered/secrets/kestra-db/password:/run/secrets/kestra_db_password:ro
        depends_on:
            bringup:
                condition: service_completed_successfully

    kestra-init:
        image: kestra/kestra:latest
        container_name: kestra-init.${SHOGGOTH_DOMAIN}
        user: "root"
        restart: "no"
        networks:
            - shoggoth
        volumes:
            - ./workflow/kestra/plugins:/app/plugins
        command: >
            plugins install
            io.kestra.plugin:plugin-docker:LATEST
            io.kestra.plugin:plugin-script-shell:LATEST

    kestra:
        !!merge <<: *default_service
        # https://kestra.io/docs
        # https://github.com/kestra-io/kestra
        image: kestra/kestra:latest
        container_name: kestra.${SHOGGOTH_DOMAIN}
        user: "root"
        volumes:
            - ./workflow/kestra/data:/app/storage
            - ./workflow/kestra/flows:/app/flows
            - ./workflow/kestra/plugins:/app/plugins
            - ./bringup/rendered/kestra/config.yaml:/shoggoth_kestra.yaml:ro
            - shoggoth_slave-dind_socket:/dind
        environment:
            !!merge <<: *default_environment
        command: server standalone --config /shoggoth_kestra.yaml --flow-path /app/flows
        depends_on:
            kestra-db:
                condition: service_started
            bringup:
                condition: service_completed_successfully
            kestra-init:
                condition: service_completed_successfully
            slave-dind:
                condition: service_healthy

    # https://github.com/Kitware/CDash
    # Test result aggregator: ingests CTest/GTest XML submissions, displays test dashboards
    # Grafana integration possible via Infinity datasource plugin querying CDash GraphQL API
    cdash:
        !!merge <<: *default_service
        image: kitware/cdash:latest
        container_name: cdash.${SHOGGOTH_DOMAIN}
        environment:
            !!merge <<: *default_environment
            APP_URL: http://cdash.${SHOGGOTH_DOMAIN}
            DB_HOST: cdash-db
            DB_PORT: "5432"
            DB_DATABASE: cdash
            DB_USERNAME: cdash
            QUEUE_CONNECTION: database
        volumes:
            - shoggoth_cdash_storage:/cdash/storage
            - ./cdash/entrypoint.sh:/cdash/entrypoint-wrapper.sh:ro
            - ./bringup/rendered/cdash/cdash.env:/shoggoth/bringup/rendered/cdash/cdash.env:ro
        entrypoint: [/cdash/entrypoint-wrapper.sh]
        command: ["start-website"]
        depends_on:
            cdash-db:
                condition: service_healthy
            bringup:
                condition: service_completed_successfully
            openldap:
                condition: service_healthy

    cdash-db:
        !!merge <<: *default_service
        image: postgres:18-alpine
        container_name: cdash-db.${SHOGGOTH_DOMAIN}
        environment:
            !!merge <<: *default_environment
            POSTGRES_DB: cdash
            POSTGRES_USER: cdash
            POSTGRES_PASSWORD_FILE: /run/secrets/cdash_db_password
        volumes:
            - shoggoth_cdash_db:/var/lib/postgresql
            - ./bringup/rendered/secrets/cdash-db/password:/run/secrets/cdash_db_password:ro
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U cdash"]
            interval: 1s
            timeout: 3s
            retries: 120
        depends_on:
            bringup:
                condition: service_completed_successfully

    openbao:
        # https://openbao.org/
        # Secret storage: KV v2 store for shoggoth secrets, web UI for operators
        !!merge <<: *default_service
        image: openbao/openbao:latest
        container_name: openbao.${SHOGGOTH_DOMAIN}
        volumes:
            - shoggoth_openbao_data:/openbao/file
            - ./auth/openbao/config/openbao.hcl:/shoggoth/openbao/openbao.hcl:ro
        environment:
            !!merge <<: *default_environment
            BAO_ADDR: http://openbao:80
        command: server -config=/shoggoth/openbao/openbao.hcl
        healthcheck:
            test: ["CMD-SHELL", "bao status || [ $? -eq 2 ]"]
            interval: 5s
            timeout: 3s
            retries: 30
            start_period: 10s

    openldap:
        # https://github.com/osixia/docker-openldap
        # OpenLDAP server: user/group directory for authentication
        # TODO: LDAP_TLS is currently false; all LDAP traffic is unencrypted on the Docker network.
        # TODO: migrate to v2
        # Enable StartTLS or LDAPS once PKI/cert-manager infrastructure is in place.
        !!merge <<: *default_service
        image: osixia/openldap:1.5.0
        container_name: openldap.${SHOGGOTH_DOMAIN}
        volumes:
            - shoggoth_openldap_data:/var/lib/ldap
            - shoggoth_openldap_config:/etc/ldap/slapd.d
            - ./bringup/rendered/secrets/openldap/admin-password:/run/secrets/openldap_admin_password:ro
            - ./bringup/rendered/secrets/openldap-config-admin-password:/run/secrets/openldap_config_admin_password:ro
            - ./auth/openldap/init.sh:/shoggoth/openldap-init.sh:ro
            - ./bringup/rendered/openldap:/shoggoth/openldap:ro
        environment:
            !!merge <<: *default_environment
            LDAP_DOMAIN: ${SHOGGOTH_DOMAIN}
            LDAP_ADMIN_PASSWORD_FILE: /run/secrets/openldap_admin_password
            LDAP_CONFIG_PASSWORD_FILE: /run/secrets/openldap_config_admin_password
            LDAP_LOG_LEVEL: "256"
            LDAP_TLS: "false"
            LDAP_REMOVE_CONFIG_AFTER_SETUP: "false"
        post_start:
            # docker exec openldap.s.local cat /var/log/shoggoth-openldap-init.log
            - command: ["/bin/bash", "-c", "/bin/bash /shoggoth/openldap-init.sh 2>&1 | tee /var/log/shoggoth-openldap-init.log"]
        healthcheck:
            test: ["CMD-SHELL", "test -f /run/shoggoth-ldap-init-done"]
            interval: 5s
            timeout: 3s
            retries: 30
            start_period: 30s
        depends_on:
            bringup:
                condition: service_completed_successfully

    phpldapadmin:
        # https://github.com/leenooks/phpLDAPadmin
        # Web UI for browsing/managing the OpenLDAP directory
        !!merge <<: *default_service
        image: phpldapadmin/phpldapadmin:latest
        container_name: phpldapadmin.${SHOGGOTH_DOMAIN}
        environment:
            !!merge <<: *default_environment
            SERVER_NAME: ":80"
        volumes:
            - ./bringup/rendered/phpldapadmin/phpldapadmin.env:/shoggoth/bringup/rendered/phpldapadmin/phpldapadmin.env:ro
            - ./auth/phpldapadmin/entrypoint.sh:/shoggoth/entrypoint.sh:ro
        entrypoint: ["/bin/bash", "/shoggoth/entrypoint.sh"]
        depends_on:
            openldap:
                condition: service_healthy

    grafana:
        # https://grafana.com/
        # Observability dashboard: visualization, alerting, explore (LGTM stack)
        !!merge <<: *default_service
        image: grafana/grafana:latest
        user: "0:0"
        container_name: grafana.${SHOGGOTH_DOMAIN}
        deploy:
            resources:
                limits:
                    memory: 512M
        environment:
            !!merge <<: *default_environment
            GF_SECURITY_ADMIN_USER: admin
            GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/admin_password
            GF_SERVER_HTTP_PORT: "80"
            GF_AUTH_ANONYMOUS_ENABLED: "true"
            GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
            GF_AUTH_LDAP_ENABLED: "false"
            GF_LOG_LEVEL: warn
            GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/shoggoth.json
        volumes:
            - ./monitoring/grafana/data:/var/lib/grafana
            - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
            - ./bringup/rendered/secrets/grafana/admin-password:/run/secrets/admin_password:ro
        post_start:
            # docker exec grafana.s.local cat /var/log/shoggoth-grafana-init.log
            - command: ["/bin/bash", "-c", "grafana cli --homepath /usr/share/grafana admin reset-admin-password \"$(tr -d '\\n\\r' < /run/secrets/admin_password)\" 2>&1 | tee /var/log/shoggoth-grafana-init.log"]
        depends_on:
            bringup:
                condition: service_completed_successfully

    loki:
        # https://github.com/grafana/loki
        # Log aggregation: stores and queries container logs
        !!merge <<: *default_service
        image: grafana/loki:latest
        container_name: loki.${SHOGGOTH_DOMAIN}
        user: "0:0"
        deploy:
            resources:
                limits:
                    memory: 512M
        volumes:
            - ./monitoring/loki/data:/loki
            - ./monitoring/loki/config.yaml:/etc/loki/config.yaml:ro
        command: -config.file=/etc/loki/config.yaml

    tempo:
        # https://github.com/grafana/tempo
        # Trace backend: OTLP-native distributed tracing storage
        !!merge <<: *default_service
        image: grafana/tempo:latest
        container_name: tempo.${SHOGGOTH_DOMAIN}
        user: "0:0"
        stop_grace_period: 30s
        deploy:
            resources:
                limits:
                    memory: 512M
        volumes:
            - ./monitoring/tempo/data:/var/tempo
            - ./monitoring/tempo/config.yaml:/etc/tempo/config.yaml:ro
        command: -config.file=/etc/tempo/config.yaml

    victoria-metrics:
        # https://github.com/VictoriaMetrics/VictoriaMetrics
        # Metrics backend: long-term Prometheus-compatible TSDB
        !!merge <<: *default_service
        image: victoriametrics/victoria-metrics:latest
        container_name: victoria-metrics.${SHOGGOTH_DOMAIN}
        deploy:
            resources:
                limits:
                    memory: 512M
        volumes:
            - ./monitoring/victoria-metrics/data:/victoria-metrics-data
        command:
            - "-retentionPeriod=1y"
            - "-selfScrapeInterval=15s"
            - "-httpListenAddr=:80"

    otelcol:
        # https://opentelemetry.io/docs/collector/
        # Central telemetry gateway: hostmetrics + docker_stats for metrics,
        # file_log for container logs, OTLP for traces/metrics, forwards to LGTM stack
        !!merge <<: *default_service
        image: otel/opentelemetry-collector-contrib:latest
        # runs as non-root UID 10001 by default, which cannot traverse
        # /var/lib/docker/containers/<id>/ directories (owned by root:root 0700)
        user: "0:0"
        container_name: otelcol.${SHOGGOTH_DOMAIN}
        volumes:
            - ./monitoring/otelcol/config.yaml:/etc/otelcol-contrib/config.yaml:ro
            - /var/lib/docker/containers:/var/lib/docker/containers:ro
            - /var/run/docker.sock:/var/run/docker.sock:ro
            - /:/host:ro
            - /proc:/host/proc:ro
            - /sys:/host/sys:ro
