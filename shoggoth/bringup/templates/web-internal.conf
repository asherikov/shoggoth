load_module modules/ngx_otel_module.so;

events {
    worker_connections 1024;
}

http {
    resolver 127.0.0.11 valid=30s;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    otel_exporter {
        endpoint http://otelcol:4317;
    }
    otel_service_name angie;

    # --- python-cache (PyPI caching proxy) ---

    proxy_cache_path /data/python_cache/cache
        levels=1:2
        keys_zone=pypi_cache:10m
        max_size=10g
        inactive=120d
        use_temp_path=off;

    server {
        listen 80;

        server_name python-cache.${SHOGGOTH_DOMAIN};

        location = / {
            return 302 /index/;
        }

        location /index/ {
            proxy_pass https://pypi.org/simple/;
            proxy_ssl_server_name on;
            proxy_set_header Host pypi.org;
            proxy_set_header Accept-Encoding "";
            sub_filter_once off;
            sub_filter 'https://files.pythonhosted.org/' 'http://python-cache.${SHOGGOTH_DOMAIN}/files/';
            sub_filter_types text/html application/vnd.pypi.simple.v1+json application/vnd.pypi.simple.latest+json application/vnd.pypi.simple.v1+html;
            proxy_cache pypi_cache;
            proxy_cache_valid 200 10m;
            proxy_cache_valid 301 302 1h;
        }

        location /files/ {
            proxy_pass https://files.pythonhosted.org/;
            proxy_ssl_server_name on;
            proxy_set_header Host files.pythonhosted.org;
            proxy_read_timeout 300s;
            proxy_connect_timeout 30s;
            proxy_cache pypi_cache;
            proxy_cache_valid 200 30d;
            proxy_cache_key $uri;
        }
    }

    # --- static site ---

    server {
        listen 80;

        server_name ${SHOGGOTH_DOMAIN};

        root /data/html;
        index index.html;

        location / {
            try_files $uri $uri/ =404;
        }

        location = /plugin.tar.gz {
            alias /data/plugin.tar.gz;
            default_type application/gzip;
        }
    }

    # --- build-cache (webdav) ---

    server {
        listen 80;

        server_name build-cache.${SHOGGOTH_DOMAIN};
        location / {
            alias /data/build_cache/;
            log_not_found off;
            dav_methods PUT DELETE;
            create_full_put_path on;
            client_max_body_size 100M;
        }
    }

    # --- api (gitea + redmine unified) ---

    upstream git {
        zone git 1m;
        server git resolve;
    }

    upstream redmine {
        zone redmine 1m;
        server redmine resolve;
    }

    server {
        listen 80;

        server_name api.${SHOGGOTH_DOMAIN};

        proxy_read_timeout 30m;
        proxy_send_timeout 30m;
        proxy_connect_timeout 360m;

        location = /gitea {
            return 301 /gitea/;
        }

        location /gitea/ {
            proxy_pass http://git/;
            proxy_set_header Host git.${SHOGGOTH_DOMAIN};
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization "Bearer ${GITEA_SERVER_TOKEN}";
        }

        location = /redmine {
            return 301 /redmine/;
        }

        location /redmine/ {
            proxy_pass http://redmine/;
            proxy_set_header Host redmine.${SHOGGOTH_DOMAIN};
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Redmine-API-Key "${REDMINE_TOKEN}";
        }
    }

    # --- slave-term (websocket) ---

    upstream slave-dind {
        zone slave-dind 1m;
        server slave-dind resolve;
    }

    server {
        listen 80;

        server_name slave-term.${SHOGGOTH_DOMAIN};
        location / {
            proxy_pass http://slave-dind;
            proxy_read_timeout 30m;
            proxy_send_timeout 30m;
            proxy_connect_timeout 360m;

            proxy_buffering off;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }
}
