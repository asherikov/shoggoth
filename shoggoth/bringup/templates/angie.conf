load_module modules/ngx_otel_module.so;

events {
    worker_connections 1024;
}

http {
    resolver 127.0.0.11 valid=30s;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    otel_exporter {
        endpoint http://otelcol:4317;
    }
    otel_service_name angie;

    # --- static site ---

    server {
        listen 80;

        server_name ${SHOGGOTH_DOMAIN};

        root /data/html;
        index index.html;

        location / {
            try_files $uri $uri/ =404;
        }

        location /setup-client.sh {
            alias /data/setup-client.sh;
            default_type application/x-sh;
        }
    }

    # --- apt-cache ---

    upstream apt-cache {
        zone apt-cache 1m;
        server apt-cache:3142 resolve;
    }

    server {
        listen 80;

        server_name apt-cache.${SHOGGOTH_DOMAIN};
        location / {
            proxy_pass http://apt-cache;
            include proxy-params.conf;
        }
    }

    # --- docker-registry ---

    upstream docker-registry {
        zone docker-registry 1m;
        server docker-registry resolve;
    }

    server {
        listen 80;

        client_max_body_size 10G;

        server_name docker-registry.${SHOGGOTH_DOMAIN};
        location / {
            proxy_pass http://docker-registry;
            include proxy-params.conf;
        }
    }

    # --- litellm ---

    upstream litellm {
        zone litellm 1m;
        server litellm resolve;
    }

    server {
        listen 80;

        server_name litellm.${SHOGGOTH_DOMAIN};
        location / {
            proxy_pass http://litellm;
            include proxy-params.conf;
        }
    }

    # --- git ---

    upstream git {
        zone git 1m;
        server git resolve;
    }

    server {
        listen 80;

        server_name git.${SHOGGOTH_DOMAIN};
        location / {
            proxy_pass http://git;
            include proxy-params.conf;
        }
    }

    # --- git-pages ---

    upstream git-pages {
        zone git-pages 1m;
        server git-pages resolve;
    }

    server {
        listen 80;

        server_name git-pages.${SHOGGOTH_DOMAIN};
        location / {
            proxy_pass http://git-pages;
            include proxy-params.conf;
        }
    }

    # --- redmine ---

    upstream redmine {
        zone redmine 1m;
        server redmine resolve;
    }

    server {
        listen 80;

        server_name redmine.${SHOGGOTH_DOMAIN};
        location / {
            proxy_pass http://redmine;
            include proxy-params.conf;
        }
    }

    # --- proxpi ---

    upstream proxpi {
        zone proxpi 1m;
        server proxpi resolve;
    }

    server {
        listen 80;

        server_name proxpi.${SHOGGOTH_DOMAIN};
        location / {
            proxy_pass http://proxpi;
            include proxy-params.conf;
        }
    }

    # --- kestra ---

    upstream kestra {
        zone kestra 1m;
        server kestra resolve;
    }

    server {
        listen 80;

        server_name kestra.${SHOGGOTH_DOMAIN};
        location / {
            proxy_pass http://kestra;
            include proxy-params.conf;
        }
    }

    # --- build-cache (webdav) ---

    server {
        listen 80;

        server_name build-cache.${SHOGGOTH_DOMAIN};
        location / {
            alias /data/build_cache/;
            log_not_found off;
            dav_methods PUT DELETE;
            create_full_put_path on;
            client_max_body_size 100M;
        }
    }

    # --- grafana ---

    upstream grafana {
        zone grafana 1m;
        server grafana resolve;
    }

    server {
        listen 80;

        server_name grafana.${SHOGGOTH_DOMAIN};
        location / {
            proxy_pass http://grafana;
            include proxy-params.conf;
        }
    }

    # --- wireguard (wg-easy VPN management UI) ---

    upstream wireguard {
        zone wireguard 1m;
        server wireguard:51821 resolve;
    }

    server {
        listen 80;

        server_name wireguard.${SHOGGOTH_DOMAIN};
        location / {
            proxy_pass http://wireguard;
            include proxy-params.conf;
        }
    }

    # --- api (gitea + redmine unified) ---

    server {
        listen 80;

        server_name api.${SHOGGOTH_DOMAIN};

        proxy_read_timeout 30m;
        proxy_send_timeout 30m;
        proxy_connect_timeout 360m;

        location = /gitea {
            return 301 /gitea/;
        }

        location /gitea/ {
            proxy_pass http://git/;
            proxy_set_header Host git.${SHOGGOTH_DOMAIN};
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization "Bearer ${GITEA_SERVER_TOKEN}";
        }

        location = /redmine {
            return 301 /redmine/;
        }

        location /redmine/ {
            proxy_pass http://redmine/;
            proxy_set_header Host redmine.${SHOGGOTH_DOMAIN};
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Redmine-API-Key "${REDMINE_TOKEN}";
        }
    }

    # --- slave-term (websocket) ---

    upstream slave-dind {
        zone slave-dind 1m;
        server slave-dind resolve;
    }

    server {
        listen 80;

        server_name slave-term.${SHOGGOTH_DOMAIN};
        location / {
            proxy_pass http://slave-dind;
            proxy_read_timeout 30m;
            proxy_send_timeout 30m;
            proxy_connect_timeout 360m;

            proxy_buffering off;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }
}

stream {
    resolver 127.0.0.11 valid=30s;

    upstream git-ssh {
        zone git-ssh 64k;
        server git:22 resolve;
    }

    server {
        listen 22;
        proxy_pass git-ssh;
        proxy_connect_timeout 1s;
        proxy_timeout 1h;
    }
}
