server:
  verbosity: 2
  interface: 0.0.0.0
  access-control: 0.0.0.0/0 allow
  do-ip4: yes
  do-ip6: no
  do-udp: yes
  do-tcp: yes
  do-not-query-localhost: no
  hide-identity: yes
  hide-version: yes

include: /opt/unbound/etc/unbound/unbound-nxdomain.blacklist

forward-zone:
  name: "${SHOGGOTH_DOMAIN}."
  forward-addr: 127.0.0.11
  forward-no-cache: yes
