datasources:
  postgres:
    url: jdbc:postgresql://kestra-db:5432/kestra
    driverClassName: org.postgresql.Driver
    username: kestra
    password: "${KESTRA_DATASOURCES_POSTGRES_PASSWORD}"
micronaut:
  server:
    host: 0.0.0.0
    port: 80
  application:
    name: kestra
  otel:
    enabled: true
    endpoint: http://otelcol:4317
  metrics:
    export:
      otlp:
        enabled: true
        url: http://otelcol:4318/v1/metrics
        resource-attributes:
          service.name: kestra
  io:
    watch:
      enabled: true
      paths:
        - /app/flows
kestra:
  storage:
    type: local
    local:
      basePath: /app/storage
  repository:
    type: postgres
  queue:
    type: postgres
  flows:
    paths:
      - /app/flows
  server:
    basic-auth:
      username: admin@${SHOGGOTH_DOMAIN}
      password: "${KESTRA_BASIC_AUTH_PASSWORD}"
      open-urls:
        - "/api/v1/executions/webhook/"
        - "/api/v1/main/executions/webhook/"
    termination-grace-period: 30s
  ai:
    enabled: false
  anonymous-usage-report:
    enabled: false
  ui-anonymous-usage-report:
    enabled: false
  tutorial-flows:
    enabled: false
  plugins:
    configurations:
      - type: io.kestra.plugin.scripts.runner.docker.Docker
        values:
          volume-enabled: true
  variables:
    env-vars-prefix: FLOWENV_
grpc:
  server:
    enabled: false
    health:
      enabled: false