load_module modules/ngx_otel_module.so;

events {
    worker_connections 1024;
}

http {
    resolver 127.0.0.11 valid=30s;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    otel_exporter {
        endpoint http://otelcol:4317;
    }
    otel_service_name web-external;

    upstream wireguard {
        zone wireguard 1m;
        server wireguard resolve;
    }

    server {
        listen 443 ssl default_server;

        ssl_certificate /data/certs/shoggoth.crt;
        ssl_certificate_key /data/certs/shoggoth.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;

        add_header Strict-Transport-Security "max-age=31536000" always;

        proxy_read_timeout 30m;
        proxy_send_timeout 30m;
        proxy_connect_timeout 60s;

        location = /ca.crt {
            alias /data/certs/shoggoth-ca.crt;
            default_type application/x-x509-ca-cert;
        }

        location = /setup-client.sh {
            alias /data/setup-client.sh;
            default_type application/x-sh;
        }

        location / {
            proxy_pass http://wireguard;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            proxy_buffering off;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }
}