---
apiVersion: v1
kind: ConfigMap
metadata:
  name: unbound-config
  namespace: shoggoth
data:
  unbound.conf: |
    server:
      verbosity: 2
      use-syslog: no
      interface: 0.0.0.0
      access-control: 0.0.0.0/0 allow
      do-ip4: yes
      do-ip6: no
      do-udp: yes
      do-tcp: yes
      do-not-query-localhost: no
      domain-insecure: "${SHOGGOTH_DOMAIN}."
      hide-identity: yes
      hide-version: yes

    include: "/opt/unbound/etc/unbound/*.blacklist"

    stub-zone:
      name: "${SHOGGOTH_DOMAIN}."
      stub-addr: 10.43.0.10
---
apiVersion: v1
kind: Service
metadata:
  name: unbound
  namespace: shoggoth
spec:
  clusterIP: 10.43.0.53
  selector:
    app: unbound
  ports:
    - name: dns-udp
      port: 53
      targetPort: 53
      protocol: UDP
    - name: dns-tcp
      port: 53
      targetPort: 53
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: unbound
  namespace: shoggoth
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: unbound
  template:
    metadata:
      labels:
        app: unbound
    spec:
      containers:
        - name: unbound
          image: mvance/unbound:latest
          ports:
            - containerPort: 53
              protocol: UDP
              name: dns-udp
            - containerPort: 53
              protocol: TCP
              name: dns-tcp
          env:
            - name: OTEL_TRACES_EXPORTER
              value: "otlp"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otelcol:4318"
            - name: SHOGGOTH_DOMAIN
              value: "${SHOGGOTH_DOMAIN}"
          volumeMounts:
            - name: config
              mountPath: /opt/unbound/etc/unbound/unbound.conf
              subPath: unbound.conf
              readOnly: true
            - name: blacklist
              mountPath: /opt/unbound/etc/unbound/unbound-nxdomain.blacklist
              subPath: unbound-nxdomain.blacklist
              readOnly: true
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          readinessProbe:
            tcpSocket:
              port: 53
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 53
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            name: unbound-config
        - name: blacklist
          hostPath:
            path: /var/lib/rancher/k3s/storage/shoggoth/unbound-blacklists
            type: DirectoryOrCreate