apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: basic-memory-data
  namespace: ${SHOGGOTH_NAMESPACE}
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: local-path
---
apiVersion: v1
kind: Service
metadata:
  name: basic-memory
  namespace: ${SHOGGOTH_NAMESPACE}
spec:
  selector:
    app: basic-memory
  ports:
  - name: http
    port: 80
    targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: basic-memory
  namespace: ${SHOGGOTH_NAMESPACE}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: basic-memory
  template:
    metadata:
      labels:
        app: basic-memory
    spec:
      dnsPolicy: None
      dnsConfig:
        nameservers:
        - ${SHOGGOTH_DNS_IP}
        searches:
        - ${SHOGGOTH_NAMESPACE}.svc.cluster.local
        - svc.cluster.local
        - cluster.local
      initContainers: []
      containers:
      - name: basic-memory
        image: ghcr.io/basicmachines-co/basic-memory:0.23.2
        imagePullPolicy: IfNotPresent
        command:
        - basic-memory
        - mcp
        - --transport
        - streamable-http
        - --host
        - 0.0.0.0
        - --port
        - '80'
        ports:
        - containerPort: 80
          name: http
        env:
        - name: BASIC_MEMORY_HOME
          value: /app/data/basic-memory
        - name: BASIC_MEMORY_PROJECT_ROOT
          value: /app/data
        - name: BASIC_MEMORY_SEMANTIC_EMBEDDING_PROVIDER
          value: openai
        - name: BASIC_MEMORY_SEMANTIC_EMBEDDING_MODEL
          value: nomic-embed-text
        - name: OPENAI_API_KEY
          value: localai
        - name: OPENAI_BASE_URL
          value: http://litellm:80/v1
        - name: OTEL_SERVICE_NAME
          value: basic-memory
        - name: OTEL_TRACES_EXPORTER
          value: otlp
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://otelcol:4318
        - name: SHOGGOTH_DOMAIN
          value: ${SHOGGOTH_DOMAIN}
        volumeMounts:
        - name: data
          mountPath: /app/data
        resources:
          requests:
            memory: 128Mi
            cpu: 100m
          limits:
            memory: 512Mi
            cpu: 500m
        readinessProbe:
          tcpSocket:
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
          failureThreshold: 30
        livenessProbe:
          tcpSocket:
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 30
          failureThreshold: 6
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: basic-memory-data
---
apiVersion: v1
kind: Service
metadata:
  name: basic-memory-ui
  namespace: ${SHOGGOTH_NAMESPACE}
spec:
  selector:
    app: basic-memory-ui
  ports:
  - name: http
    port: 80
    targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: basic-memory-ui
  namespace: ${SHOGGOTH_NAMESPACE}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: basic-memory-ui
  template:
    metadata:
      labels:
        app: basic-memory-ui
    spec:
      dnsPolicy: None
      dnsConfig:
        nameservers:
        - ${SHOGGOTH_DNS_IP}
        searches:
        - ${SHOGGOTH_NAMESPACE}.svc.cluster.local
        - svc.cluster.local
        - cluster.local
      initContainers: []
      containers:
      - name: silverbullet
        image: zefhemel/silverbullet:2.11.1-slim
        imagePullPolicy: IfNotPresent
        env:
        - name: SB_HOSTNAME
          value: 0.0.0.0
        - name: SB_PORT
          value: '80'
        - name: SB_READ_ONLY
          value: '1'
        - name: SB_DISABLE_SERVICE_WORKER
          value: '1'
        ports:
        - containerPort: 80
          name: http
        volumeMounts:
        - name: data
          mountPath: /data
          readOnly: true
        resources:
          requests:
            memory: 128Mi
            cpu: 50m
          limits:
            memory: 384Mi
            cpu: 250m
        readinessProbe:
          httpGet:
            path: /.instance
            port: 80
          initialDelaySeconds: 15
          periodSeconds: 10
          failureThreshold: 30
        livenessProbe:
          httpGet:
            path: /.instance
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 30
          failureThreshold: 6
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: basic-memory-data
