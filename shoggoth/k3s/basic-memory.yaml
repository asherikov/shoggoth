---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: basic-memory-data
  namespace: shoggoth
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: local-path
---
apiVersion: v1
kind: Service
metadata:
  name: basic-memory
  namespace: shoggoth
spec:
  selector:
    app: basic-memory
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: basic-memory
  namespace: shoggoth
spec:
  replicas: 1
  selector:
    matchLabels:
      app: basic-memory
  template:
    metadata:
      labels:
        app: basic-memory
    spec:
      dnsPolicy: None
      dnsConfig:
        nameservers:
          - 10.43.0.53
        searches:
          - shoggoth.svc.cluster.local
          - svc.cluster.local
          - cluster.local
      initContainers:
        - name: wait-bringup
          image: docker-registry.${SHOGGOTH_DOMAIN}/slave_noble:latest
          imagePullPolicy: IfNotPresent
          command: ["bash", "-c"]
          args:
            - |
              if [ ! -f /shoggoth/rendered/.bringup-done ]; then
                echo "ERROR: bringup sentinel not found" >&2
                exit 1
              fi
          resources:
            requests:
              memory: "32Mi"
              cpu: "50m"
            limits:
              memory: "64Mi"
              cpu: "200m"
          volumeMounts:
            - name: rendered
              mountPath: /shoggoth/rendered
              readOnly: true
      containers:
        - name: basic-memory
          image: ghcr.io/basicmachines-co/basic-memory:latest
          imagePullPolicy: IfNotPresent
          command: ["basic-memory", "mcp", "--transport", "streamable-http", "--host", "0.0.0.0", "--port", "80"]
          ports:
            - containerPort: 80
              name: http
          env:
            - name: BASIC_MEMORY_HOME
              value: /app/data/basic-memory
            - name: BASIC_MEMORY_PROJECT_ROOT
              value: /app/data
            - name: BASIC_MEMORY_SEMANTIC_EMBEDDING_PROVIDER
              value: openai
            - name: BASIC_MEMORY_SEMANTIC_EMBEDDING_MODEL
              value: nomic-embed-text
            - name: OPENAI_API_KEY
              value: localai
            - name: OPENAI_BASE_URL
              value: http://litellm:80/v1
            - name: OTEL_SERVICE_NAME
              value: basic-memory
            - name: OTEL_TRACES_EXPORTER
              value: "otlp"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otelcol:4318"
            - name: SHOGGOTH_DOMAIN
              value: "${SHOGGOTH_DOMAIN}"
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: rendered
              mountPath: /shoggoth/rendered
              readOnly: true
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 6
      volumes:
        - name: rendered
          hostPath:
            path: /var/lib/rancher/k3s/storage/shoggoth/rendered
            type: DirectoryOrCreate
        - name: data
          persistentVolumeClaim:
            claimName: basic-memory-data