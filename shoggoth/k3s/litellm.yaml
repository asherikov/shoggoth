---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: litellm-data
  namespace: ${SHOGGOTH_NAMESPACE}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: local-path
---
apiVersion: v1
kind: Service
metadata:
  name: litellm
  namespace: ${SHOGGOTH_NAMESPACE}
spec:
  selector:
    app: litellm
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
  namespace: ${SHOGGOTH_NAMESPACE}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: litellm
  template:
    metadata:
      labels:
        app: litellm
    spec:
      dnsPolicy: None
      dnsConfig:
        nameservers:
          - ${DNS_IP}
        searches:
          - ${SHOGGOTH_NAMESPACE}.svc.cluster.local
          - svc.cluster.local
          - cluster.local
      initContainers:
        - name: wait-bringup
          image: busybox:latest
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c"]
          args:
            - |
              echo "wait-bringup: checking sentinel /shoggoth/rendered/.bringup-done"
              if [ ! -f /shoggoth/rendered/.bringup-done ]; then
                echo "wait-bringup: sentinel not found, dumping diagnostics:" >&2
                echo "wait-bringup: /shoggoth/rendered/ exists: $([ -d /shoggoth/rendered ] && echo yes || echo no)" >&2
                if [ -d /shoggoth/rendered ]; then
                  echo "wait-bringup: contents:" >&2
                  ls -la /shoggoth/rendered/ >&2 || true
                fi
                if [ -f /shoggoth/rendered/bringup.log ]; then
                  echo "wait-bringup: bringup.log tail:" >&2
                  tail -20 /shoggoth/rendered/bringup.log >&2 || true
                fi
                echo "wait-bringup: exiting, bringup may still be in progress" >&2
                exit 1
              fi
              echo "wait-bringup: sentinel found"
          resources:
            requests:
              memory: "32Mi"
              cpu: "50m"
            limits:
              memory: "64Mi"
              cpu: "200m"
          volumeMounts:
            - name: rendered-ro
              mountPath: /shoggoth/rendered
              readOnly: true
      containers:
        - name: litellm
          image: ghcr.io/berriai/litellm:main-stable
          imagePullPolicy: IfNotPresent
          args:
            - "--config"
            - "/shoggoth/litellm/config.yaml"
            - "--port"
            - "80"
          env:
            - name: OTEL_SERVICE_NAME
              value: litellm
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otelcol:4318
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: http/protobuf
            - name: OTEL_TRACES_EXPORTER
              value: "otlp"
            - name: SHOGGOTH_DOMAIN
              value: "${SHOGGOTH_DOMAIN}"
          volumeMounts:
            - name: rendered-config
              mountPath: /shoggoth/litellm
              readOnly: true
            - name: data
              mountPath: /app/litellm
            - name: rendered-ro
              mountPath: /shoggoth/rendered
              readOnly: true
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              memory: "512Mi"
              cpu: "200m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
          readinessProbe:
            httpGet:
              path: /health/liveliness
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health/liveliness
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 6
      volumes:
        - name: rendered-config
          hostPath:
            path: /var/lib/rancher/k3s/storage/${SHOGGOTH_INSTANCE_DIR}/rendered/litellm
            type: DirectoryOrCreate
        - name: rendered-ro
          hostPath:
            path: /var/lib/rancher/k3s/storage/${SHOGGOTH_INSTANCE_DIR}/rendered
            type: DirectoryOrCreate
        - name: data
          persistentVolumeClaim:
            claimName: litellm-data