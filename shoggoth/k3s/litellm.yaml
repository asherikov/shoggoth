apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: litellm-data
  namespace: ${SHOGGOTH_NAMESPACE}
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: local-path
---
apiVersion: v1
kind: Service
metadata:
  name: litellm
  namespace: ${SHOGGOTH_NAMESPACE}
spec:
  selector:
    app: litellm
  ports:
  - name: http
    port: 80
    targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
  namespace: ${SHOGGOTH_NAMESPACE}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: litellm
  template:
    metadata:
      labels:
        app: litellm
    spec:
      dnsPolicy: None
      dnsConfig:
        nameservers:
        - ${SHOGGOTH_DNS_IP}
        searches:
        - ${SHOGGOTH_NAMESPACE}.svc.cluster.local
        - svc.cluster.local
        - cluster.local
      initContainers:
      - name: wait-bootstrap
        image: asherikov/shoggoth_tools:alpine
        imagePullPolicy: IfNotPresent
        command:
        - bash
        - -c
        args:
        - |
          set -euo pipefail
          K8S_API="${K8S_API:-https://kubernetes.default.svc}"
          SA_TOKEN="$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)"
          SA_CA="/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
          for i in $(seq 1 120); do
            http_code=$(curl -sS --cacert "${SA_CA}" \
              -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer ${SA_TOKEN}" \
              "${K8S_API}/api/v1/namespaces/${SHOGGOTH_NAMESPACE}/secrets/shoggoth-bootstrap-done" || true)
            if [ "${http_code}" = "200" ]; then
              echo "wait-bootstrap: shoggoth-bootstrap-done Secret found"
              exit 0
            fi
            echo "wait-bootstrap: waiting for shoggoth-bootstrap-done Secret (attempt $i/120, http=${http_code})..."
            if [ $((i % 12)) -eq 0 ] && [ "${http_code}" != "404" ]; then
              curl -sS --cacert "${SA_CA}" \
                -H "Authorization: Bearer ${SA_TOKEN}" \
                "${K8S_API}/api/v1/namespaces/${SHOGGOTH_NAMESPACE}/secrets/shoggoth-bootstrap-done" >&2 || true
            fi
            sleep 5
          done
          echo "wait-bootstrap: FATAL: shoggoth-bootstrap-done Secret not found after 600s"
          echo "wait-bootstrap: openbao-bootstrap may have failed; check:"
          echo "  kubectl logs -n ${SHOGGOTH_NAMESPACE} -l app=openbao -c openbao-bootstrap"
          exit 1
        resources:
          requests:
            memory: 32Mi
            cpu: 50m
          limits:
            memory: 64Mi
            cpu: 200m
        volumeMounts: []
      - name: render-config
        image: asherikov/shoggoth_tools:alpine
        imagePullPolicy: IfNotPresent
        env:
        - name: OLLAMA_CLOUD_TOKEN
          valueFrom:
            secretKeyRef:
              name: ai-default-token
              key: token
        - name: GITEA_SLAVE_TOKEN
          valueFrom:
            secretKeyRef:
              name: gitea-slave-token
              key: token
        - name: RENDER_VARS
          value: ${OLLAMA_CLOUD_TOKEN}${GITEA_SLAVE_TOKEN}
        command:
        - bash
        - -c
        - 'exec /tmpl/render.sh

          '
        resources:
          requests:
            memory: 32Mi
            cpu: 50m
          limits:
            memory: 64Mi
            cpu: 200m
        volumeMounts:
        - name: templates
          mountPath: /templates
          readOnly: true
        - name: rendered-config
          mountPath: /rendered
        - name: render-script
          mountPath: /tmpl
          readOnly: true
      containers:
      - name: litellm
        image: ghcr.io/berriai/litellm:main-stable
        imagePullPolicy: IfNotPresent
        args:
        - --config
        - /shoggoth/litellm/config.yaml
        - --port
        - '80'
        env:
        - name: OTEL_SERVICE_NAME
          value: litellm
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://otelcol:4318
        - name: OTEL_EXPORTER_OTLP_PROTOCOL
          value: http/protobuf
        - name: OTEL_TRACES_EXPORTER
          value: otlp
        - name: SHOGGOTH_DOMAIN
          value: ${SHOGGOTH_DOMAIN}
        volumeMounts:
        - name: rendered-config
          mountPath: /shoggoth/litellm
          readOnly: true
        - name: data
          mountPath: /app/litellm
        ports:
        - containerPort: 80
          name: http
        resources:
          requests:
            memory: 512Mi
            cpu: 200m
          limits:
            memory: 2Gi
            cpu: 1000m
        readinessProbe:
          httpGet:
            path: /health/liveliness
            port: 80
          initialDelaySeconds: 15
          periodSeconds: 10
          failureThreshold: 30
        livenessProbe:
          httpGet:
            path: /health/liveliness
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 30
          failureThreshold: 6
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: litellm-data
      - name: templates
        configMap:
          name: litellm-templates
      - name: render-script
        configMap:
          name: shoggoth-render-config
          defaultMode: 493
      - name: rendered-config
        emptyDir: {}
      serviceAccountName: litellm
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: litellm
  namespace: ${SHOGGOTH_NAMESPACE}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: litellm-bootstrap-wait
  namespace: ${SHOGGOTH_NAMESPACE}
rules:
- apiGroups:
  - ''
  resources:
  - secrets
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: litellm-bootstrap-wait
  namespace: ${SHOGGOTH_NAMESPACE}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: litellm-bootstrap-wait
subjects:
- kind: ServiceAccount
  name: litellm
  namespace: ${SHOGGOTH_NAMESPACE}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-templates
  namespace: ${SHOGGOTH_NAMESPACE}
data:
  config.yaml: |
    model_list:
        - model_name: nomic-embed-text
          litellm_params:
              model: "openai/nomic-embed-text-v1.5"
              api_base: http://localai:80/v1
              api_key: "localai"
        - model_name: "localai/*"
          litellm_params:
              model: "openai/*"
              api_base: http://localai:80/v1
              api_key: "localai"
          model_info:
              supports_function_calling: true
        - model_name: "shoggoth-default"
          litellm_params:
              model: "${SHOGGOTH_AI_DEFAULT_MODEL}"
              api_base: ${SHOGGOTH_AI_DEFAULT_API}
              api_key: "${OLLAMA_CLOUD_TOKEN}"
          model_info:
              supports_function_calling: true
        - model_name: "*"
          litellm_params:
              model: "openai/*"
              api_base: ${SHOGGOTH_AI_DEFAULT_API}
              api_key: "${OLLAMA_CLOUD_TOKEN}"
          model_info:
              supports_function_calling: true
    litellm_settings:
        callbacks:
            - prometheus
            - otel
        drop_params: true
    general_settings:
        store_model_in_db: true
    mcp_servers:
        mcp_gitea:
            url: "http://mcp-gitea:80/mcp"
            transport: "http"
            description: "Gitea MCP server"
            auth_type: "bearer_token"
            auth_value: "${GITEA_SLAVE_TOKEN}"
            allow_all_keys: true
        basic_memory:
            url: "http://basic-memory:80/mcp"
            transport: "http"
            description: "Basic Memory MCP server"
            allow_all_keys: true
