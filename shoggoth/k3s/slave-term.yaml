---
# slave-term — interactive web terminal (ttyd + tmux + Qwen Code).
#
# Replaces the privileged `slave-dind` service entirely (no dockerd, no DinD).
# Uses the shared git-cred-bootstrap sidecar (same one slave-dind mounts) so
# ssh-agent + git-credential-cache are initialized in one place and live for
# the lifetime of the pod.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: slave-term
  namespace: ${SHOGGOTH_NAMESPACE}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: slave-term-bootstrap-wait
  namespace: ${SHOGGOTH_NAMESPACE}
rules:
- apiGroups:
  - ''
  resources:
  - secrets
  resourceNames:
  - gitea-slave-token
  - ssh-slave-private-key
  verbs:
  - get
- apiGroups:
  - external-secrets.io
  resources:
  - externalsecrets
  resourceNames:
  - gitea-slave-token
  - ssh-slave-private-key
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: slave-term-bootstrap-wait
  namespace: ${SHOGGOTH_NAMESPACE}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: slave-term-bootstrap-wait
subjects:
- kind: ServiceAccount
  name: slave-term
  namespace: ${SHOGGOTH_NAMESPACE}
---
# The /cache persistent storage is shared across all CI consumers
# (gitea-runner job pods, slave-term, and Kestra workflows via slave-dind's
# DinD). See shoggoth/k3s/shared-cache.yaml for the single PVC definition.
---
apiVersion: v1
kind: Service
metadata:
  name: slave-term
  namespace: ${SHOGGOTH_NAMESPACE}
spec:
  selector:
    app: slave-term
  ports:
  - name: http
    port: 80
    targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: slave-term
  namespace: ${SHOGGOTH_NAMESPACE}
  labels:
    app: slave-term
spec:
  replicas: 1
  selector:
    matchLabels:
      app: slave-term
  template:
    metadata:
      labels:
        app: slave-term
      annotations:
        secret.reloader.stakater.com/reload: gitea-slave-token,ssh-slave-private-key
    spec:
      serviceAccountName: slave-term
      dnsPolicy: None
      dnsConfig:
        nameservers:
        - ${SHOGGOTH_DNS_IP}
        searches:
        - ${SHOGGOTH_NAMESPACE}.svc.cluster.local
        - svc.cluster.local
        - cluster.local
      initContainers:
      - name: wait-bootstrap
        image: asherikov/shoggoth_tools:alpine
        imagePullPolicy: IfNotPresent
        env:
        - name: SHOGGOTH_NAMESPACE
          value: ${SHOGGOTH_NAMESPACE}
        command:
        - bash
        - -c
        args:
        - |
          set -euo pipefail
          NS="${SHOGGOTH_NAMESPACE}"
          wait_for_externalsecret() {
            local name="$1"
            echo "wait-bootstrap: waiting for externalsecret/${name} Ready in namespace ${NS}..."
            for i in $(seq 1 60); do
              if kubectl get externalsecret "${name}" -n "${NS}" -o json 2>/dev/null | jq -e '.status.conditions // [] | map(select(.type=="Ready" and .status=="True")) | length > 0' >/dev/null 2>&1; then
                echo "wait-bootstrap: externalsecret/${name} Ready (after $((i*10))s)"
                return 0
              fi
              sleep 10
            done
            echo "FAIL: externalsecret/${name} not Ready after 10m"
            return 1
          }
          wait_for_externalsecret gitea-slave-token || exit 1
          wait_for_externalsecret ssh-slave-private-key || exit 1
          echo "wait-bootstrap: all K8s Secrets Ready"

        resources:
          requests:
            memory: 32Mi
            cpu: 50m
          limits:
            memory: 64Mi
            cpu: 200m
      - name: init-git-cred-perms
        image: asherikov/shoggoth_tools:alpine
        imagePullPolicy: IfNotPresent
        command:
        - sh
        - -c
        args:
        - |
          set -eu
          # kubelet mounts the emptyDir as root:root with default perms;
          # the git-cred sidecar runs as uid 1000 (securityContext.runAsUser)
          # and needs to chmod the mountpoint to 0700 so git-credential-cache
          # accepts the directory (it refuses any mode looser than 0700 with
          # "permissions on your socket directory are too loose"). uid 1000
          # cannot chmod a root-owned directory, so we chown+chmod here as
          # root before the sidecar starts. The sidecar re-applies chmod 0700
          # defensively, which is now a no-op (it owns the directory).
          chown 1000:1000 /shoggoth/git-cred
          chmod 0700 /shoggoth/git-cred
        volumeMounts:
        - name: git-cred
          mountPath: /shoggoth/git-cred
        resources:
          requests:
            memory: 16Mi
            cpu: 10m
          limits:
            memory: 32Mi
            cpu: 50m
      containers:
      - name: git-cred
        image: asherikov/shoggoth_tools:alpine
        imagePullPolicy: IfNotPresent
        command:
        - /bin/bash
        - /git-cred/bootstrap.sh
        env:
        - name: SHOGGOTH_DOMAIN
          value: ${SHOGGOTH_DOMAIN}
        - name: SHOGGOTH_NAMESPACE
          value: ${SHOGGOTH_NAMESPACE}
        - name: SSH_ID_RSA
          valueFrom:
            secretKeyRef:
              name: ssh-slave-private-key
              key: ssh-id-rsa
              optional: true
        - name: GITEA_SLAVE_TOKEN
          valueFrom:
            secretKeyRef:
              name: gitea-slave-token
              key: token
              optional: true
        volumeMounts:
        - name: git-cred
          mountPath: /shoggoth/git-cred
        - name: git-cred-bootstrap
          mountPath: /git-cred
          readOnly: true
        resources:
          requests:
            memory: 32Mi
            cpu: 20m
          limits:
            memory: 64Mi
            cpu: 100m
        # Sibling of `image:` and `securityContext:`, not a field inside
        # securityContext (kube-apiserver rejects the latter with "field not
        # declared in schema"). On non-zero exit kubelet normally leaves
        # containerState.Terminated.Message empty, so the FATAL stderr line
        # bootstrap.sh writes (e.g. "git-cred-bootstrap: FATAL: ssh-keyscan
        # failed on git.s.local") is invisible from `kubectl describe pod`.
        # FallbackToLogsOnError makes kubelet populate the message from the
        # last 2048 bytes / 80 lines of the container's log on exit.
        # https://kubernetes.io/docs/tasks/debug/debug-application/determine-reason-pod-failure/
        terminationMessagePolicy: FallbackToLogsOnError
        securityContext:
          runAsUser: 1000
      - name: term
        image: registry.${SHOGGOTH_DOMAIN}/slave:noble
        imagePullPolicy: IfNotPresent
        env:
        - name: SHOGGOTH_DOMAIN
          value: ${SHOGGOTH_DOMAIN}
        # Slave image's ENV hardcodes GITEA_SSH_HOST="git" so it works without
        # a templated Dockerfile. The bare service resolves in DNS via the pod's
        # `dnsConfig.searches`, but the git-cred-bootstrap sidecar keyscans
        # only `git.${SHOGGOTH_DOMAIN}` — if the user's known_hosts file is
        # populated for `git.${SHOGGOTH_DOMAIN}` but git then uses `git`,
        # StrictHostKeyChecking refuses the connection. Override here so
        # `git clone` from the terminal builds the URL against the same
        # hostname the sidecar keyscanned.
        - name: GITEA_SSH_HOST
          value: git.${SHOGGOTH_DOMAIN}
        # Direct service access (bypasses Angie `server_name api.${DOMAIN}`
        # routing). Picked over `http://api.${DOMAIN}/gitea` because the
        # maintenance flow already uses this form and the term user has
        # GITEA_SLAVE_TOKEN set above for Authorization headers. Same logic
        # for REDMINE_SERVER — the Angie proxy path would need a separate
        # REDMINE_TOKEN env var wired here, and shoggoth_maintenance.py
        # already handles the direct form by reading REDMINE_SERVER and
        # SHOGGOTH_DOMAIN separately.
        - name: GITEA_SERVER_URL
          value: http://git.${SHOGGOTH_DOMAIN}
        - name: REDMINE_SERVER
          value: http://redmine.${SHOGGOTH_DOMAIN}
        command:
        - /bin/sh
        - -c
        - |
          # User exit is expected behavior, not a fault. ttyd --once exits
          # when the browser WebSocket closes; tmux's session also ends.
          # Force exit 0 so kubelet restarts the container without
          # CrashLoopBackOff (any non-zero exit triggers exponential
          # backoff: 10s, 20s, 40s, 80s, 160s, 300s). With this wrapper
          # the pod is back to Ready in ~1s after the WebSocket closes.
          exec ttyd --max-clients 1 --port 80 --writable -t disableReconnect=true --once tmux -u new-session bash || true
          exit 0
        ports:
        - containerPort: 80
          name: http
        resources:
          requests:
            memory: 256Mi
            cpu: 200m
          limits:
            memory: 1Gi
            cpu: '1'
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
          failureThreshold: 30
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 60
          periodSeconds: 30
          failureThreshold: 6
        volumeMounts:
        - name: git-cred
          mountPath: /shoggoth/git-cred
        - name: ci-cache
          mountPath: /cache
      volumes:
      - name: git-cred
        emptyDir: {}
      - name: git-cred-bootstrap
        configMap:
          name: git-cred-bootstrap
          defaultMode: 493
      - name: ci-cache
        persistentVolumeClaim:
          claimName: shoggoth-shared-cache