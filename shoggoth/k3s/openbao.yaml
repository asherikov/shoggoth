---
apiVersion: v1
kind: ConfigMap
metadata:
  name: openbao-config
  namespace: ${SHOGGOTH_NAMESPACE}
data:
  openbao.hcl: |
    ui = true

    listener "tcp" {
      address     = "0.0.0.0:80"
      tls_disable = true
    }

    storage "raft" {
      path        = "/openbao/file"
      node_id     = "node1"
    }

    api_addr      = "http://openbao:80"
    cluster_addr  = "http://openbao:81"
    log_level     = "debug"

---
apiVersion: v1
kind: Service
metadata:
  name: openbao
  namespace: ${SHOGGOTH_NAMESPACE}
spec:
  selector:
    app: openbao
  ports:
    - name: api
      port: 80
      targetPort: 80

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: openbao-data
  namespace: ${SHOGGOTH_NAMESPACE}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: local-path

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: openbao
  namespace: ${SHOGGOTH_NAMESPACE}
spec:
  serviceName: openbao
  replicas: 1
  selector:
    matchLabels:
      app: openbao
  template:
    metadata:
      labels:
        app: openbao
    spec:
      dnsPolicy: None
      dnsConfig:
        nameservers:
          - ${DNS_IP}
        searches:
          - ${SHOGGOTH_NAMESPACE}.svc.cluster.local
          - svc.cluster.local
          - cluster.local
      securityContext:
        runAsUser: 100
        runAsGroup: 1000
        fsGroup: 1000
      initContainers:
        - name: fix-permissions
          image: busybox:latest
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c"]
          args:
            - |
                set -e
                echo "=== Fixing permissions on /openbao/file ==="
                echo "Before:"
                ls -la /openbao/file/ 2>&1 || true
                id
                chown -R 100:1000 /openbao/file
                echo "After:"
                ls -la /openbao/file/ 2>&1 || true
                echo "=== Permissions fixed ==="
          volumeMounts:
            - name: data
              mountPath: /openbao/file
          securityContext:
            runAsUser: 0
      containers:
        - name: openbao
          image: openbao/openbao:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: api
          env:
            - name: BAO_ADDR
              value: "http://127.0.0.1:80"
            - name: SKIP_CHOWN
              value: "true"
            - name: SKIP_SETCAP
              value: "true"
            - name: OTEL_TRACES_EXPORTER
              value: "otlp"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otelcol:4318"
            - name: SHOGGOTH_DOMAIN
              value: "${SHOGGOTH_DOMAIN}"
          volumeMounts:
            - name: config
              mountPath: /openbao/config
              readOnly: true
            - name: data
              mountPath: /openbao/file
            - name: home
              mountPath: /home/openbao
          command: ["docker-entrypoint.sh"]
          args:
            - "bao"
            - "server"
            - "-config=/openbao/config/openbao.hcl"
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "1000m"
          readinessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6
      volumes:
        - name: config
          configMap:
            name: openbao-config
        - name: data
          persistentVolumeClaim:
            claimName: openbao-data
        - name: home
          emptyDir: {}
