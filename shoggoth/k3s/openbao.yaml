---
apiVersion: v1
kind: ConfigMap
metadata:
  name: openbao-config
  namespace: ${SHOGGOTH_NAMESPACE}
data:
  openbao.hcl: |
    ui = true

    listener "tcp" {
      address     = "0.0.0.0:80"
      tls_disable = true
    }

    storage "raft" {
      path        = "/openbao/file"
      node_id     = "node1"
    }

    api_addr      = "http://openbao:80"
    cluster_addr  = "http://openbao:81"
    log_level     = "debug"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: openbao-bootstrap
  namespace: ${SHOGGOTH_NAMESPACE}
data:
  bootstrap.sh: |
    #!/usr/bin/env bash
    set -euo pipefail

    OPENBAO_ADDR="${OPENBAO_ADDR:-http://127.0.0.1:8200}"
    BAO_DATA="${BAO_DATA:-/openbao/file}"
    PRIVATE_DIR="${PRIVATE_DIR:-/shoggoth/private}"
    UNSEAL_KEY_FILE="${BAO_DATA}/.shoggoth-unseal-key"
    ROOT_TOKEN_FILE="${BAO_DATA}/shoggoth/root-token"
    INIT_FLAG="${BAO_DATA}/.shoggoth-initialized"
    K8S_API="${K8S_API:-https://kubernetes.default.svc}"
    NAMESPACE="${NAMESPACE}"

    BOOTSTRAP_LOG="${BAO_DATA}/bootstrap.log"
    mkdir -p "${BAO_DATA}"
    exec 4>>"${BOOTSTRAP_LOG}"

    _on_fatal() {
        local rc=$?
        if [ "${rc}" -ne 0 ]; then
            log "FATAL: shell exit code=${rc}"
            log "FATAL: full log retained at ${BOOTSTRAP_LOG}"
        fi
    }
    trap _on_fatal EXIT

    _now() { date -u +%Y-%m-%dT%H:%M:%S.%3NZ; }

    log() {
        local msg="[openbao-bootstrap] $*"
        printf '%s %s\n' "$(_now)" "${msg}" >&2
        printf '%s %s\n' "$(_now)" "${msg}" >&4
    }
    die() {
        local msg="[openbao-bootstrap] FATAL: $*"
        printf '%s %s\n' "$(_now)" "${msg}" >&2
        printf '%s %s\n' "$(_now)" "${msg}" >&4
        exit 1
    }
    phase() { log "─── $* ───"; }

    sa_token() { cat /var/run/secrets/kubernetes.io/serviceaccount/token; }
    k8s_ca()   { echo "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"; }

    k8s_put_secret() {
        local name="$1" payload="$2"
        local attempt code method
        for attempt in 1 2 3 4 5; do
            method="PUT"
            code=$(curl -sS --max-time 15 --cacert "$(k8s_ca)" \
                -o /tmp/k8s-bootstrap-resp.json \
                -w '%{http_code}' \
                -X PUT \
                -H "Authorization: Bearer $(sa_token)" \
                -H "Content-Type: application/json" \
                -d "${payload}" \
                "${K8S_API}/api/v1/namespaces/${NAMESPACE}/secrets/${name}" 2>/tmp/k8s-bootstrap-err.txt) || code="000"
            if [ "${code}" = "404" ]; then
                method="POST"
                code=$(curl -sS --max-time 15 --cacert "$(k8s_ca)" \
                    -o /tmp/k8s-bootstrap-resp.json \
                    -w '%{http_code}' \
                    -X POST \
                    -H "Authorization: Bearer $(sa_token)" \
                    -H "Content-Type: application/json" \
                    -d "${payload}" \
                    "${K8S_API}/api/v1/namespaces/${NAMESPACE}/secrets" 2>/tmp/k8s-bootstrap-err.txt) || code="000"
            fi
            if [ "${code}" = "200" ] || [ "${code}" = "201" ]; then
                log "K8s Secret ${name} ${method} (HTTP ${code})"
                return 0
            fi
            local body curl_err
            body="$(head -c 400 /tmp/k8s-bootstrap-resp.json 2>/dev/null || echo 'no body')"
            curl_err="$(head -c 200 /tmp/k8s-bootstrap-err.txt 2>/dev/null | tr '\n' ' ')"
            log "k8s ${method} secret/${name} HTTP ${code} (attempt ${attempt}/5)"
            [ -n "${body}" ]    && log "  body:    ${body}"
            [ -n "${curl_err}" ] && log "  curlerr: ${curl_err}"
            if [ "${attempt}" -lt 5 ]; then
                sleep $((attempt * 2))
            fi
        done
        log "k8s put/create secret/${name} FAILED after 5 attempts; last body: $(head -c 400 /tmp/k8s-bootstrap-resp.json 2>/dev/null || echo 'no body')"
        return 1
    }

    gen_value() {
        local format="$1" length="$2"
        case "${format}" in
            base64) openssl rand -base64 "${length}" | tr -dc 'a-zA-Z0-9' | head -c "${length}" ;;
            hex)    openssl rand -hex    "$((length / 2))" ;;
            *)      die "unknown format: ${format}" ;;
        esac
    }

    bao_get_value() {
        local path="$1"
        local response http_code
        response=$(curl -sS --max-time 10 -o /tmp/bao-get.json -w '%{http_code}' \
            -H "X-Vault-Token: ${ROOT_TOKEN}" \
            "${OPENBAO_ADDR}/v1/secret/data/${path}" 2>/dev/null) || true
        if [ "${response}" != "200" ]; then
            return 1
        fi
        jq -r '.data.data.value // empty' < /tmp/bao-get.json
    }

    bao_put_value() {
        local path="$1" value="$2"
        local payload
        payload=$(jq -c -n --arg v "${value}" '{data:{value:$v}}')
        local code curl_err
        code=$(curl -sS --max-time 10 -o /tmp/bao-put.json -w '%{http_code}' \
            -X POST \
            -H "X-Vault-Token: ${ROOT_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "${payload}" \
            "${OPENBAO_ADDR}/v1/secret/data/${path}" 2>/tmp/bao-put-err.txt) || code="000"
        if [ "${code}" != "200" ] && [ "${code}" != "204" ]; then
            curl_err="$(head -c 200 /tmp/bao-put-err.txt 2>/dev/null | tr '\n' ' ')"
            die "PUT ${path} HTTP ${code}; body=$(head -c 400 /tmp/bao-put.json 2>/dev/null); curlerr=${curl_err}"
        fi
        log "OpenBao KV ${path} PUT (HTTP ${code})"
    }

    # === Phase A: idempotent init + unseal ===
    phase "Phase A: waiting for OpenBao at ${OPENBAO_ADDR}"
    until code=$(curl -s --max-time 5 -o /dev/null -w '%{http_code}' "${OPENBAO_ADDR}/v1/sys/health" 2>/dev/null) \
              && [ "${#code}" = "3" ] && [ "${code}" != "000" ]; do
        sleep 2
    done
    log "Phase A: OpenBao is reachable (HTTP ${code})"

    mkdir -p "${BAO_DATA}/shoggoth"

    if [ -f "${UNSEAL_KEY_FILE}" ] && [ -f "${ROOT_TOKEN_FILE}" ]; then
        log "Phase A: unseal key + root token found on PVC, reusing"
        UNSEAL_KEY=$(cat "${UNSEAL_KEY_FILE}")
        ROOT_TOKEN=$(cat "${ROOT_TOKEN_FILE}")
    else
        log "Phase A: no unseal key on PVC; trying K8s Secret backup"
        local_code=$(curl -sS --max-time 10 -o /tmp/bao-backup.json -w '%{http_code}' \
            --cacert "$(k8s_ca)" \
            -H "Authorization: Bearer $(sa_token)" \
            "${K8S_API}/api/v1/namespaces/${NAMESPACE}/secrets/openbao-unseal-key" 2>/dev/null) || true
        if [ "${local_code}" = "200" ]; then
            UNSEAL_KEY=$(jq -r '.data."unseal-key"' < /tmp/bao-backup.json | base64 -d)
            ROOT_TOKEN=$(jq -r '.data."root-token"' < /tmp/bao-backup.json | base64 -d)
            printf '%s' "${UNSEAL_KEY}" > "${UNSEAL_KEY_FILE}"
            chmod 400 "${UNSEAL_KEY_FILE}"
            printf '%s' "${ROOT_TOKEN}" > "${ROOT_TOKEN_FILE}"
            chmod 400 "${ROOT_TOKEN_FILE}"
            log "Phase A: recovered from K8s Secret backup"
        else
            log "Phase A: no backup; initializing fresh OpenBao"
            init_code=$(curl -sS --max-time 10 -o /tmp/bao-init.json -w '%{http_code}' \
                -X PUT \
                -H "Content-Type: application/json" \
                -d '{"secret_shares":1,"secret_threshold":1}' \
                "${OPENBAO_ADDR}/v1/sys/init" 2>/dev/null) || true
            if [ "${init_code}" != "200" ]; then
                die "PUT /v1/sys/init HTTP ${init_code}: $(cat /tmp/bao-init.json 2>/dev/null)"
            fi
            UNSEAL_KEY=$(jq -r '.keys_base64[0]' < /tmp/bao-init.json)
            ROOT_TOKEN=$(jq -r '.root_token' < /tmp/bao-init.json)
            printf '%s' "${UNSEAL_KEY}" > "${UNSEAL_KEY_FILE}"
            chmod 400 "${UNSEAL_KEY_FILE}"
            printf '%s' "${ROOT_TOKEN}" > "${ROOT_TOKEN_FILE}"
            chmod 400 "${ROOT_TOKEN_FILE}"
            log "Phase A: fresh init complete"
        fi
    fi

    # Always (re)write the K8s Secret backup so downstream pods (kestra render-config,
    # etc.) can read root-token regardless of which branch above produced UNSEAL_KEY.
    payload=$(jq -c -n \
        --arg uk "$(printf '%s' "${UNSEAL_KEY}" | base64 -w0)" \
        --arg rt "$(printf '%s' "${ROOT_TOKEN}" | base64 -w0)" \
        --arg ns "${NAMESPACE}" \
        '{apiVersion:"v1",kind:"Secret",metadata:{name:"openbao-unseal-key",namespace:$ns},type:"Opaque",data:{"unseal-key":$uk,"root-token":$rt}}')
    k8s_put_secret openbao-unseal-key "${payload}"

    # Unseal (idempotent: returns error if already unsealed)
    unseal_code=$(curl -sS --max-time 10 -o /tmp/bao-unseal.json -w '%{http_code}' \
        -X PUT \
        -H "Content-Type: application/json" \
        -d "{\"key\":\"${UNSEAL_KEY}\"}" \
        "${OPENBAO_ADDR}/v1/sys/unseal" 2>/dev/null) || true
    if [ "${unseal_code}" != "200" ]; then
        die "PUT /v1/sys/unseal HTTP ${unseal_code}: $(cat /tmp/bao-unseal.json 2>/dev/null)"
    fi
    touch "${INIT_FLAG}"
    log "Phase A: unsealed (init flag at ${INIT_FLAG})"

    # Ensure KV-v2 mount exists (idempotent)
    mount_check=$(curl -sS --max-time 10 -o /dev/null -w '%{http_code}' \
        -H "X-Vault-Token: ${ROOT_TOKEN}" \
        "${OPENBAO_ADDR}/v1/sys/mounts/secret" 2>/dev/null) || true
    if [ "${mount_check}" != "200" ]; then
        log "Phase A: mounting KV-v2 at secret/"
        curl -sS --max-time 10 -o /dev/null -w '%{http_code}' \
            -X POST \
            -H "X-Vault-Token: ${ROOT_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"type":"kv-v2"}' \
            "${OPENBAO_ADDR}/v1/sys/mounts/secret" 2>/dev/null || true
    else
        log "Phase A: KV-v2 mount already present"
    fi

    # === Phase B: seed Owner ExternalSecret paths on a fresh install ===
    # Owner random-secret paths and one-shot placeholders for the two
    # Orphan runner/slave tokens that gate pod startup are seeded here; the
    # rest of the token paths are populated later by the maintenance flow
    # (Phase 4: Gitea-slave-token is the same — see the Phase 2 table).
    phase "Phase B: seeding random secrets for Owner ExternalSecret paths and one-shot placeholder tokens"
    SEEDED=0
    SKIPPED=0
    OVERRIDDEN=0
    for path in \
        kestra/db-password \
        redmine/db-password \
        cdash/db-password \
        redmine/secret-key-base \
        openldap/admin-password \
        openldap/config-admin-password \
        openldap/ldapauth-password \
        openldap/slave-password \
        openldap/slave-reviewer-password \
        cdash/app-key \
        ca/passphrase \
        wireguard/admin-password \
        grafana/admin-password \
        ssh/slave-private-key \
        ssh/slave-public-key \
        gitea/runner-token \
        gitea/slave-token
    do
        if bao_get_value "$path" >/dev/null 2>&1; then
            SKIPPED=$((SKIPPED + 1))
            continue
        fi
        case "$path" in
            ssh/slave-public-key)
                # Reuse /tmp/kk if the private-key branch already generated the keypair
                # in this loop iteration; otherwise generate the keypair here.
                if [ ! -f /tmp/kk ]; then
                    ssh-keygen -t ed25519 -f /tmp/kk -N "" -q
                fi
                PUB=$(ssh-keygen -y -f /tmp/kk)
                bao_put_value "$path" "$PUB"
                ;;
            ssh/slave-private-key)
                if [ ! -f /tmp/kk ]; then
                    ssh-keygen -t ed25519 -f /tmp/kk -N "" -q
                fi
                # Raw PEM with trailing newline stripped (matches slave-dind entrypoint
                # -----BEGIN first-line check); do NOT base64-encode.
                PRIV=$(cat /tmp/kk; printf x); PRIV="${PRIV%x}"
                bao_put_value "$path" "$PRIV"
                ;;
            openldap/admin-password)
                if [ -f "${PRIVATE_DIR}/admin-password.txt" ]; then
                    OVERRIDE=$(tr -d '\n\r' < "${PRIVATE_DIR}/admin-password.txt")
                    bao_put_value "$path" "${OVERRIDE}"
                    OVERRIDDEN=$((OVERRIDDEN + 1))
                else
                    bao_put_value "$path" "$(openssl rand -base64 32 | tr -d '\n\r')"
                fi
                ;;
            ai/default-token)
                if [ -f "${SHOGGOTH_AI_DEFAULT_TOKEN_FILE:-}" ] && [ -n "${SHOGGOTH_AI_DEFAULT_TOKEN_FILE:-}" ]; then
                    OVERRIDE=$(tr -d '\n' < "${SHOGGOTH_AI_DEFAULT_TOKEN_FILE}")
                    bao_put_value "$path" "${OVERRIDE}"
                    OVERRIDDEN=$((OVERRIDDEN + 1))
                else
                    bao_put_value "$path" "$(openssl rand -base64 32 | tr -d '\n')"
                fi
                ;;
            *)
                rm -f /tmp/kk /tmp/kk.pub 2>/dev/null || true
                bao_put_value "$path" "$(openssl rand -base64 32 | tr -d '\n')"
                ;;
        esac
        SEEDED=$((SEEDED + 1))
    done
    # Clean up any SSH keypair remnants before exiting the loop.
    rm -f /tmp/kk /tmp/kk.pub 2>/dev/null || true
    log "Phase B: done (seeded=${SEEDED}, skipped=${SKIPPED}, user-overridden=${OVERRIDDEN})"

    # === Phase B.5: Configure OpenBao LDAP auth (idempotent) ===
    phase "Phase B.5: configuring OpenBao LDAP auth"
    LDAP_BASE_DN="dc=$(printf '%s' "${SHOGGOTH_DOMAIN}" | sed 's/\./,dc=/g')"
    LDAP_BIND_DN="uid=ldapauth,ou=people,${LDAP_BASE_DN}"
    LDAP_BIND_PASSWORD=$(bao_get_value "openldap/ldapauth-password" 2>/dev/null) || die "openldap/ldapauth-password missing in OpenBao"
    [ -z "${LDAP_BIND_PASSWORD}" ] && die "openldap/ldapauth-password is empty in OpenBao"
    LDAP_AUTH_ENABLED="$(curl -sf --max-time 10 -H "X-Vault-Token: ${ROOT_TOKEN}" \
        "${OPENBAO_ADDR}/v1/sys/auth" 2>/dev/null \
        | grep -q '"ldap/"' && echo true || echo false)"
    if [ "${LDAP_AUTH_ENABLED}" != "true" ]; then
        log "Phase B.5: enabling auth/ldap"
        curl -sfS --max-time 10 -X POST "${OPENBAO_ADDR}/v1/sys/auth/ldap" \
            -H "X-Vault-Token: ${ROOT_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"type":"ldap"}' > /dev/null
    fi
    log "Phase B.5: configuring LDAP backend"
    # Capture body+curl-err so a misconfigured backend shows up here, not later
    # in an external consumer's "invalid bind credentials" message.
    LDAP_CONFIG_BODY=/tmp/bao-ldap-config.json
    if ! code=$(curl -sS --max-time 10 -o "${LDAP_CONFIG_BODY}" -w '%{http_code}' \
        -X POST "${OPENBAO_ADDR}/v1/auth/ldap/config" \
        -H "X-Vault-Token: ${ROOT_TOKEN}" \
        -H "Content-Type: application/json" \
        -d "{\"url\":\"ldap://openldap:389\",\"binddn\":\"${LDAP_BIND_DN}\",\"bindpass\":\"${LDAP_BIND_PASSWORD}\",\"userdn\":\"ou=people,${LDAP_BASE_DN}\",\"groupdn\":\"ou=groups,${LDAP_BASE_DN}\",\"userattr\":\"uid\",\"groupattr\":\"cn\",\"groupfilter\":\"(member={{.UserDN}})\",\"username_as_alias\":true,\"deny_null_bind\":true}" 2>/tmp/bao-ldap-config-err.txt); then
        die "POST /v1/auth/ldap/config: curl failed (rc=${code}); err=$(cat /tmp/bao-ldap-config-err.txt)"
    fi
    if [ "${code}" != "200" ] && [ "${code}" != "204" ]; then
        die "POST /v1/auth/ldap/config HTTP ${code}: $(head -c 400 ${LDAP_CONFIG_BODY})"
    fi
    log "Phase B.5: LDAP backend configured (HTTP ${code})"
    log "Phase B.5: creating shoggoth-admin ACL policy"
    POLICY_BODY=/tmp/bao-acl.json
    if ! code=$(curl -sS --max-time 10 -o "${POLICY_BODY}" -w '%{http_code}' \
        -X POST "${OPENBAO_ADDR}/v1/sys/policies/acl/shoggoth-admin" \
        -H "X-Vault-Token: ${ROOT_TOKEN}" \
        -H "Content-Type: application/json" \
        -d '{"policy":"path \"secret/data/*\" { capabilities = [\"create\",\"read\",\"update\",\"delete\",\"list\"] }\npath \"sys/*\" { capabilities = [\"read\",\"list\"] }"}' 2>/tmp/bao-acl-err.txt); then
        die "POST /v1/sys/policies/acl/shoggoth-admin: curl failed (rc=${code}); err=$(cat /tmp/bao-acl-err.txt)"
    fi
    if [ "${code}" != "200" ] && [ "${code}" != "204" ]; then
        die "POST /v1/sys/policies/acl/shoggoth-admin HTTP ${code}: $(head -c 400 ${POLICY_BODY})"
    fi
    log "Phase B.5: shoggoth-admin policy applied (HTTP ${code})"
    # Best-effort: admins group binding only resolves once the LDAP admins
    # group exists, which is created by the openldap init. Surface failures
    # for visibility but tolerate them.
    log "Phase B.5: mapping admins group to shoggoth-admin"
    if ! code=$(curl -sS --max-time 10 -o /tmp/bao-group.json -w '%{http_code}' \
        -X POST "${OPENBAO_ADDR}/v1/auth/ldap/groups/admins" \
        -H "X-Vault-Token: ${ROOT_TOKEN}" \
        -H "Content-Type: application/json" \
        -d '{"policies":"shoggoth-admin"}' 2>/tmp/bao-group-err.txt); then
        log "Phase B.5: WARN admins group binding: curl failed (rc=${code}); err=$(cat /tmp/bao-group-err.txt); openldap may not have 'admins' group yet — will retry on next bootstrap"
    elif [ "${code}" != "200" ] && [ "${code}" != "204" ]; then
        log "Phase B.5: WARN admins group binding HTTP ${code}: $(head -c 400 /tmp/bao-group.json); openldap may not have 'admins' group yet — will retry on next bootstrap"
    else
        log "Phase B.5: admins group bound (HTTP ${code})"
    fi
    log "Phase B.5: complete"

    # === Phase B.5: shoggoth-eso-read policy + token for ExternalSecret reads ===
    # The default read SecretStore authenticates with the unscoped root token
    # (openbao-unseal-key/root-token, scoped by shoggoth-admin with create/read/
    # update/delete/list on secret/data/* + sys/* read). Any K8s actor with
    # secrets/get or externalsecrets/* in the namespace can pivot to reading
    # sys/policies/acl/* (token-shape and ACL inspection) or any kv path the
    # admin policy grants. Fix: dedicated read-only policy covering exactly
    # the kv paths ExternalSecret reads.
    phase "Phase B.5: provisioning shoggoth-eso-read policy + token"
    ESO_READ_POLICY_BODY=/tmp/bao-eso-read-acl.json
    if ! code=$(curl -sS --max-time 10 -o "${ESO_READ_POLICY_BODY}" -w '%{http_code}' \
        -X POST "${OPENBAO_ADDR}/v1/sys/policies/acl/shoggoth-eso-read" \
        -H "X-Vault-Token: ${ROOT_TOKEN}" \
        -H "Content-Type: application/json" \
        -d '{"policy":"path \"secret/data/*\" { capabilities = [\"read\"] }"}' 2>/tmp/bao-eso-read-acl-err.txt); then
        die "POST /v1/sys/policies/acl/shoggoth-eso-read: curl failed (rc=${code}); err=$(cat /tmp/bao-eso-read-acl-err.txt)"
    fi
    if [ "${code}" != "200" ] && [ "${code}" != "204" ]; then
        die "POST /v1/sys/policies/acl/shoggoth-eso-read HTTP ${code}: $(head -c 400 ${ESO_READ_POLICY_BODY})"
    fi
    log "Phase B.5: shoggoth-eso-read policy applied (HTTP ${code})"

    ESO_READ_TOKEN_B64="$(kubectl get secret -n "${NAMESPACE}" shoggoth-openbao-eso-read-token -o jsonpath='{.data.token}' 2>/dev/null || true)"
    if [ -z "${ESO_READ_TOKEN_B64}" ]; then
        log "Phase B.5: minting shoggoth-eso-read token"
        ESO_READ_TOKEN_RESP=/tmp/bao-eso-read-token.json
        if ! code=$(curl -sS --max-time 10 -o "${ESO_READ_TOKEN_RESP}" -w '%{http_code}' \
            -X POST "${OPENBAO_ADDR}/v1/auth/token/create" \
            -H "X-Vault-Token: ${ROOT_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"policies":["shoggoth-eso-read"],"ttl":"87600h","renewable":true,"no_parent":true}' 2>/tmp/bao-eso-read-token-err.txt); then
            die "POST /v1/auth/token/create: curl failed (rc=${code}); err=$(cat /tmp/bao-eso-read-token-err.txt)"
        fi
        if [ "${code}" != "200" ] && [ "${code}" != "204" ]; then
            die "POST /v1/auth/token/create HTTP ${code}: $(head -c 400 ${ESO_READ_TOKEN_RESP})"
        fi
        ESO_READ_TOKEN="$(jq -r '.auth.client_token // empty' "${ESO_READ_TOKEN_RESP}" 2>/dev/null)"
        if [ -z "${ESO_READ_TOKEN}" ]; then
            die "Failed to extract client_token from /v1/auth/token/create response: $(head -c 400 ${ESO_READ_TOKEN_RESP})"
        fi
        ESO_READ_PAYLOAD=$(jq -c -n \
            --arg t "$(printf '%s' "${ESO_READ_TOKEN}" | base64 -w0)" \
            --arg ns "${NAMESPACE}" \
            '{apiVersion:"v1",kind:"Secret",metadata:{name:"shoggoth-openbao-eso-read-token",namespace:$ns},type:"Opaque",data:{"token":$t}}')
        k8s_put_secret shoggoth-openbao-eso-read-token "${ESO_READ_PAYLOAD}"
        log "Phase B.5: shoggoth-openbao-eso-read-token K8s Secret written"
    else
        log "Phase B.5: shoggoth-openbao-eso-read-token already present — skipping token mint"
    fi

    # === Phase B.5: shoggoth-eso-write policy + token for PushSecret writes ===
    # The PushSecret controller authenticates via the SecretStore it references.
    # If it shares the read SecretStore (whose tokenSecretRef is the unscoped
    # root token), any K8s actor with secrets/update or pushsecrets/create in
    # the namespace can pivot to OpenBao writes at any path. Fix: dedicated
    # write-scoped policy covering exactly the path(s) PushSecret needs.
    phase "Phase B.5: provisioning shoggoth-eso-write policy + token"
    ESO_WRITE_POLICY_BODY=/tmp/bao-eso-write-acl.json
    if ! code=$(curl -sS --max-time 10 -o "${ESO_WRITE_POLICY_BODY}" -w '%{http_code}' \
        -X POST "${OPENBAO_ADDR}/v1/sys/policies/acl/shoggoth-eso-write" \
        -H "X-Vault-Token: ${ROOT_TOKEN}" \
        -H "Content-Type: application/json" \
        -d '{"policy":"path \"secret/data/gitea/slave-token\" { capabilities = [\"create\",\"update\",\"read\"] }\npath \"secret/data/gitea/runner-token\" { capabilities = [\"create\",\"update\",\"read\"] }\npath \"secret/data/redmine/slave-token\" { capabilities = [\"create\",\"update\",\"read\"] }"}' 2>/tmp/bao-eso-write-acl-err.txt); then
        die "POST /v1/sys/policies/acl/shoggoth-eso-write: curl failed (rc=${code}); err=$(cat /tmp/bao-eso-write-acl-err.txt)"
    fi
    if [ "${code}" != "200" ] && [ "${code}" != "204" ]; then
        die "POST /v1/sys/policies/acl/shoggoth-eso-write HTTP ${code}: $(head -c 400 ${ESO_WRITE_POLICY_BODY})"
    fi
    log "Phase B.5: shoggoth-eso-write policy applied (HTTP ${code})"

    # Idempotency: skip token mint if the K8s Secret already has a token.
    # We do NOT verify the token is still valid (no live OpenBao API call to
    # /v1/auth/token/lookup-self from this init — keep bootstrap offline).
    # Token rotation is documented as: delete shoggoth-openbao-eso-write-token
    # K8s Secret and re-run openbao init.
    ESO_WRITE_TOKEN_B64="$(kubectl get secret -n "${NAMESPACE}" shoggoth-openbao-eso-write-token -o jsonpath='{.data.token}' 2>/dev/null || true)"
    if [ -z "${ESO_WRITE_TOKEN_B64}" ]; then
        log "Phase B.5: minting shoggoth-eso-write token"
        ESO_WRITE_TOKEN_RESP=/tmp/bao-eso-write-token.json
        if ! code=$(curl -sS --max-time 10 -o "${ESO_WRITE_TOKEN_RESP}" -w '%{http_code}' \
            -X POST "${OPENBAO_ADDR}/v1/auth/token/create" \
            -H "X-Vault-Token: ${ROOT_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"policies":["shoggoth-eso-write"],"ttl":"87600h","renewable":true,"no_parent":true}' 2>/tmp/bao-eso-write-token-err.txt); then
            die "POST /v1/auth/token/create: curl failed (rc=${code}); err=$(cat /tmp/bao-eso-write-token-err.txt)"
        fi
        if [ "${code}" != "200" ] && [ "${code}" != "204" ]; then
            die "POST /v1/auth/token/create HTTP ${code}: $(head -c 400 ${ESO_WRITE_TOKEN_RESP})"
        fi
        ESO_WRITE_TOKEN="$(jq -r '.auth.client_token // empty' "${ESO_WRITE_TOKEN_RESP}" 2>/dev/null)"
        if [ -z "${ESO_WRITE_TOKEN}" ]; then
            die "Failed to extract client_token from /v1/auth/token/create response: $(head -c 400 ${ESO_WRITE_TOKEN_RESP})"
        fi
        ESO_WRITE_PAYLOAD=$(jq -c -n \
            --arg t "$(printf '%s' "${ESO_WRITE_TOKEN}" | base64 -w0)" \
            --arg ns "${NAMESPACE}" \
            '{apiVersion:"v1",kind:"Secret",metadata:{name:"shoggoth-openbao-eso-write-token",namespace:$ns},type:"Opaque",data:{"token":$t}}')
        k8s_put_secret shoggoth-openbao-eso-write-token "${ESO_WRITE_PAYLOAD}"
        log "Phase B.5: shoggoth-openbao-eso-write-token K8s Secret written"
    else
        log "Phase B.5: shoggoth-openbao-eso-write-token already present — skipping token mint"
    fi

    # === Phase D: TLS certificate generation ===
    phase "Phase D: generating TLS certificates"
    CERT_DIR="${BAO_DATA}/certs"
    mkdir -p "${CERT_DIR}"
    CA_PASS=$(bao_get_value "ca/passphrase" 2>/dev/null) || die "ca/passphrase missing in OpenBao (key=ca/passphrase)"
    if [ -z "${CA_PASS}" ]; then
        die "ca/passphrase is empty in OpenBao (key=ca/passphrase)"
    fi
    SHOGGOTH_DOMAIN="${SHOGGOTH_DOMAIN:?SHOGGOTH_DOMAIN must be set}"
    log "Phase D: ca/passphrase loaded (length=${#CA_PASS} chars)"

    # Wrappers: capture stderr and surface openssl failures as fatal,
    # and validate the produced cert so we don't PUT garbage to K8s.
    run_openssl() {
        local errfile=/tmp/openssl-err.$$
        if ! openssl "$@" 2>"${errfile}"; then
            log "openssl FAILED: openssl $*"
            log "openssl stderr: $(head -c 500 "${errfile}" | tr '\n' ' ')"
            rm -f "${errfile}"
            die "openssl $* exited non-zero"
        fi
        rm -f "${errfile}"
    }
    validate_cert() {
        local file="$1" label="$2"
        if [ ! -s "${file}" ]; then
            die "${label}: file missing or empty (${file})"
        fi
        local subject issuer not_before not_after
        subject="$(openssl x509 -in "${file}" -noout -subject 2>/dev/null || echo INVALID)"
        issuer="$(openssl x509 -in "${file}" -noout -issuer  2>/dev/null || echo INVALID)"
        not_before="$(openssl x509 -in "${file}" -noout -startdate 2>/dev/null | cut -d= -f2 || echo INVALID)"
        not_after="$(openssl x509 -in "${file}" -noout -enddate   2>/dev/null | cut -d= -f2 || echo INVALID)"
        if [ "${subject}" = "INVALID" ]; then
            die "${label}: not parseable as x509 (${file})"
        fi
        log "${label}: OK (subject=${subject}, issuer=${issuer}, valid ${not_before} → ${not_after})"
    }
    # Decide whether existing CA state on PVC is reusable. Any of these force
    # a regenerate-and-PUT bundle: ca.key missing; ca.crt missing while ca.key
    # exists; passphrase mismatch (e.g. wipe_openbao without PVC wipe); server
    # cert/key incomplete. Otherwise reuse what is on the PVC.
    _regen=0
    if [ ! -f "${CERT_DIR}/ca.key" ]; then
        if [ -f "${CERT_DIR}/ca.crt" ]; then
            log "Phase D: ca.key missing but ca.crt present on PVC — regenerating"
        fi
        _regen=1
    elif [ ! -f "${CERT_DIR}/ca.crt" ]; then
        log "Phase D: ca.crt missing but ca.key present on PVC — regenerating"
        _regen=1
    elif ! openssl rsa -in "${CERT_DIR}/ca.key" -passin "pass:${CA_PASS}" -noout 2>/tmp/ca-pass.err; then
        log "Phase D: ca.key on PVC cannot be decrypted with OpenBao-stored passphrase — regenerating"
        log "Phase D: (expected after wipe_openbao that did not also wipe the PVC)"
        _regen=1
    elif [ ! -s "${CERT_DIR}/server.crt" ] || [ ! -s "${CERT_DIR}/server.key" ]; then
        log "Phase D: server.crt/server.key incomplete on PVC — regenerating"
        _regen=1
    fi

    if [ "${_regen}" = "1" ]; then
        rm -f "${CERT_DIR}/ca.crt" "${CERT_DIR}/ca.key" \
              "${CERT_DIR}/server.crt" "${CERT_DIR}/server.key" \
              "${CERT_DIR}/server.csr" "${CERT_DIR}/server.ext" "${CERT_DIR}/ca.srl"
        log "Phase D: generating fresh CA + server cert"
        run_openssl genrsa -des3 -passout "pass:${CA_PASS}" -out "${CERT_DIR}/ca.key" 4096
        run_openssl req -x509 -new -nodes -key "${CERT_DIR}/ca.key" \
            -passin "pass:${CA_PASS}" -sha256 -days 3650 \
            -subj "/CN=shoggoth-ca" -out "${CERT_DIR}/ca.crt"
        if [ ! -s "${CERT_DIR}/ca.crt" ]; then die "ca.crt generation produced empty file"; fi
        run_openssl genrsa -out "${CERT_DIR}/server.key" 2048
        run_openssl req -new -key "${CERT_DIR}/server.key" \
            -subj "/CN=*.${SHOGGOTH_DOMAIN}" -out "${CERT_DIR}/server.csr"
        printf 'authorityKeyIdentifier=keyid,issuer\nbasicConstraints=CA:FALSE\nkeyUsage=digitalSignature,keyEncipherment\nsubjectAltName=DNS:*.%s,DNS:%s\n' \
            "${SHOGGOTH_DOMAIN}" "${SHOGGOTH_DOMAIN}" > "${CERT_DIR}/server.ext"
        run_openssl x509 -req -in "${CERT_DIR}/server.csr" \
            -CA "${CERT_DIR}/ca.crt" -CAkey "${CERT_DIR}/ca.key" \
            -passin "pass:${CA_PASS}" -CAcreateserial \
            -out "${CERT_DIR}/server.crt" -days 3650 -sha256 \
            -extfile "${CERT_DIR}/server.ext"
        chmod 600 "${CERT_DIR}/ca.key" "${CERT_DIR}/server.key"
        log "Phase D: certs generated"
    else
        log "Phase D: existing CA + server cert intact and matches stored passphrase — reusing"
    fi
    validate_cert "${CERT_DIR}/ca.crt"     "ca.crt"
    validate_cert "${CERT_DIR}/server.crt" "server.crt"

    # Mirror the cert bundle to OpenBao KV path secret/data/shoggoth/tls as a
    # recovery point. Re-PUT on every regeneration so the backup stays in sync
    # with the stored passphrase.
    log "Phase D: mirroring cert bundle to OpenBao KV path shoggoth/tls"
    bao_put_value "shoggoth/tls" "$(jq -c -n \
        --arg ca_crt     "$(base64 -w0 < "${CERT_DIR}/ca.crt")" \
        --arg ca_key     "$(base64 -w0 < "${CERT_DIR}/ca.key")" \
        --arg server_crt "$(base64 -w0 < "${CERT_DIR}/server.crt")" \
        --arg server_key "$(base64 -w0 < "${CERT_DIR}/server.key")" \
        '{ca:{crt:$ca_crt,key:$ca_key},server:{crt:$server_crt,key:$server_key}}')"

    k8s_put_secret_from_file() {
        local name="$1" file="$2" key="$3"
        local b64
        b64="$(base64 -w0 < "${file}")"
        local payload
        payload=$(jq -c -n \
            --arg n "${name}" --arg ns "${NAMESPACE}" \
            --arg k "${key}" --arg v "${b64}" \
            '{apiVersion:"v1",kind:"Secret",metadata:{name:$n,namespace:$ns},type:"Opaque",data:{($k):$v}}')
        k8s_put_secret "${name}" "${payload}"
    }

    k8s_put_secret_tls_from_files() {
        local name="$1" cert_file="$2" key_file="$3"
        local b64_crt b64_key
        b64_crt="$(base64 -w0 < "${cert_file}")"
        b64_key="$(base64 -w0 < "${key_file}")"
        local payload
        payload=$(jq -c -n \
            --arg n "${name}" --arg ns "${NAMESPACE}" \
            --arg crt "${b64_crt}" --arg key "${b64_key}" \
            '{apiVersion:"v1",kind:"Secret",metadata:{name:$n,namespace:$ns},type:"kubernetes.io/tls",data:{"tls.crt":$crt,"tls.key":$key}}')
        k8s_put_secret "${name}" "${payload}"
    }

    k8s_put_secret_from_file       shoggoth-ca    "${CERT_DIR}/ca.crt"     ca.crt
    k8s_put_secret_tls_from_files shoggoth-server "${CERT_DIR}/server.crt" "${CERT_DIR}/server.key"
    log "Phase D: done (wrote shoggoth-ca + shoggoth-server K8s Secrets)"

    log "all phases complete"
---
apiVersion: v1
kind: Service
metadata:
  name: openbao
  namespace: ${SHOGGOTH_NAMESPACE}
spec:
  selector:
    app: openbao
  ports:
    - name: api
      port: 80
      targetPort: 80

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: openbao-data
  namespace: ${SHOGGOTH_NAMESPACE}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: local-path

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: openbao
  namespace: ${SHOGGOTH_NAMESPACE}
spec:
  serviceName: openbao
  replicas: 1
  selector:
    matchLabels:
      app: openbao
  template:
    metadata:
      labels:
        app: openbao
    spec:
      dnsPolicy: None
      dnsConfig:
        nameservers:
          - ${SHOGGOTH_DNS_IP}
        searches:
          - ${SHOGGOTH_NAMESPACE}.svc.cluster.local
          - svc.cluster.local
          - cluster.local
      securityContext:
        runAsUser: 100
        runAsGroup: 1000
        fsGroup: 1000
      serviceAccountName: openbao-init
      initContainers:
        - name: fix-permissions
          image: asherikov/shoggoth_tools:alpine
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c"]
          args:
            - |
                set -e
                echo "=== Fixing permissions on /openbao/file ==="
                echo "Before:"
                ls -la /openbao/file/ 2>&1 || true
                id
                chown -R 100:1000 /openbao/file
                echo "After:"
                ls -la /openbao/file/ 2>&1 || true
                echo "=== Permissions fixed ==="
          volumeMounts:
            - name: data
              mountPath: /openbao/file
          securityContext:
            runAsUser: 0
      containers:
        - name: openbao
          image: openbao/openbao:2.6.2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: api
          env:
            - name: BAO_ADDR
              value: "http://127.0.0.1:80"
            - name: SKIP_CHOWN
              value: "true"
            - name: SKIP_SETCAP
              value: "true"
            - name: OTEL_TRACES_EXPORTER
              value: "otlp"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otelcol:4318"
            - name: SHOGGOTH_DOMAIN
              value: "${SHOGGOTH_DOMAIN}"
          volumeMounts:
            - name: config
              mountPath: /openbao/config
              readOnly: true
            - name: data
              mountPath: /openbao/file
            - name: home
              mountPath: /home/openbao
          command: ["docker-entrypoint.sh"]
          args:
            - "bao"
            - "server"
            - "-config=/openbao/config/openbao.hcl"
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "1000m"
          readinessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6
      volumes:
        - name: config
          configMap:
            name: openbao-config
        - name: data
          persistentVolumeClaim:
            claimName: openbao-data
        - name: home
          emptyDir: {}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: openbao-bootstrap
  namespace: ${SHOGGOTH_NAMESPACE}
  labels:
    app: openbao-bootstrap
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app: openbao-bootstrap
    spec:
      restartPolicy: OnFailure
      serviceAccountName: openbao-init
      initContainers:
        - name: wait-for-openbao
          image: asherikov/shoggoth_tools:alpine
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c"]
          args:
            - |
                set -euo pipefail
                # Accept any HTTP response — sealed (503) and uninitialized (501)
                # are valid post-startup states that the bootstrap script handles.
                until code=$(curl -s -o /dev/null -w '%{http_code}' http://openbao:80/v1/sys/health 2>/dev/null) \
                          && [ "${#code}" = "3" ]; do
                  echo "wait-for-openbao: OpenBao not reachable yet..."
                  sleep 2
                done
                echo "wait-for-openbao: OpenBao answered (HTTP ${code})"
      containers:
        - name: bootstrap
          image: asherikov/shoggoth_tools:alpine
          imagePullPolicy: IfNotPresent
          command: ["bash", "-c"]
          args:
            - /tmpl/bootstrap.sh
          env:
            - name: OPENBAO_ADDR
              value: "http://openbao:80"
            - name: BAO_DATA
              value: "/openbao/file"
            - name: K8S_API
              value: "https://kubernetes.default.svc"
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: SHOGGOTH_DOMAIN
              value: "${SHOGGOTH_DOMAIN}"
            - name: SHOGGOTH_GITEA_SERVER_TOKEN_FILE
              value: "${SHOGGOTH_GITEA_SERVER_TOKEN_FILE}"
            - name: SHOGGOTH_AI_DEFAULT_TOKEN_FILE
              value: "${SHOGGOTH_AI_DEFAULT_TOKEN_FILE}"
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "500m"
          volumeMounts:
            - name: bootstrap
              mountPath: /tmpl
              readOnly: true
            - name: data
              mountPath: /openbao/file
            - name: private
              mountPath: /shoggoth/private
              readOnly: true
      volumes:
        - name: bootstrap
          configMap:
            name: openbao-bootstrap
            defaultMode: 0755
        - name: data
          persistentVolumeClaim:
            claimName: openbao-data
        - name: private
          hostPath:
            path: /var/lib/rancher/k3s/storage/${SHOGGOTH_INSTANCE_DIR}/private
            type: DirectoryOrCreate
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbao-init
  namespace: ${SHOGGOTH_NAMESPACE}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: openbao-init-secrets
  namespace: ${SHOGGOTH_NAMESPACE}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "update", "patch", "get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: openbao-init-secrets
  namespace: ${SHOGGOTH_NAMESPACE}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: openbao-init-secrets
subjects:
  - kind: ServiceAccount
    name: openbao-init
    namespace: ${SHOGGOTH_NAMESPACE}
