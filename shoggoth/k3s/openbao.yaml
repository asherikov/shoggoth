---
apiVersion: v1
kind: ConfigMap
metadata:
  name: openbao-config
  namespace: shoggoth
data:
  openbao.hcl: |
    ui = true

    listener "tcp" {
      address     = "0.0.0.0:80"
      tls_disable = true
    }

    storage "raft" {
      path        = "/openbao/file"
      node_id     = "node1"
    }

    disable_mlock = true
    api_addr      = "http://openbao:80"
    cluster_addr  = "http://openbao:81"
    log_level     = "debug"

---
apiVersion: v1
kind: Service
metadata:
  name: openbao
  namespace: shoggoth
spec:
  selector:
    app: openbao
  ports:
    - name: api
      port: 80
      targetPort: 80

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: openbao-data
  namespace: shoggoth
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: local-path

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: openbao
  namespace: shoggoth
spec:
  serviceName: openbao
  replicas: 1
  selector:
    matchLabels:
      app: openbao
  template:
    metadata:
      labels:
        app: openbao
    spec:
      securityContext:
        fsGroup: 0
      containers:
        - name: openbao
          image: openbao/openbao:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 0
          ports:
            - containerPort: 80
              name: api
          env:
            - name: BAO_ADDR
              value: "http://openbao:80"
          volumeMounts:
            - name: config
              mountPath: /shoggoth/openbao
              readOnly: true
            - name: data
              mountPath: /openbao/file
          command: ["bao"]
          args: ["server", "-config=/shoggoth/openbao/openbao.hcl"]
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "1000m"
          readinessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6
      volumes:
        - name: config
          configMap:
            name: openbao-config
        - name: data
          persistentVolumeClaim:
            claimName: openbao-data