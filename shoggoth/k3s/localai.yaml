apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: localai-models
  namespace: ${SHOGGOTH_NAMESPACE}
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
  storageClassName: local-path
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: localai-backends
  namespace: ${SHOGGOTH_NAMESPACE}
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: local-path
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: localai-data
  namespace: ${SHOGGOTH_NAMESPACE}
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: local-path
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: localai-preload
  namespace: ${SHOGGOTH_NAMESPACE}
data:
  # Use the LocalAI gallery `id` (reference to the canonical entry in
  # github:mudler/LocalAI/gallery/index.yaml@master) rather than an inline
  # `url:` / `files:` / `config_file:` block. The inline-block path in this
  # LocalAI binary (sha-36d800e-gpu-vulkan) calls
  # `installModelFromRemoteConfig` -> `GetGalleryConfigFromURLWithContext`
  # unconditionally, which aborts with `Get "": unsupported protocol scheme ""`
  # when no `url:` is present. The gallery-id path uses `InstallModelFromGallery`
  # which honors `overrides`, downloads the GGUF via the canonical HF URI
  # (mradermacher's mirror; sha256 verified), and persists it to the localai-models
  # PVC across restarts.
  preload-models.yaml: |
    - id: nomic-embed-text-v1.5
      overrides:
        embeddings: true
        gpu_layers: 99999999
        options:
          - gpu
---
apiVersion: v1
kind: Service
metadata:
  name: localai
  namespace: ${SHOGGOTH_NAMESPACE}
spec:
  selector:
    app: localai
  ports:
  - name: http
    port: 80
    targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: localai
  namespace: ${SHOGGOTH_NAMESPACE}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: localai
  template:
    metadata:
      labels:
        app: localai
    spec:
      dnsPolicy: None
      dnsConfig:
        nameservers:
        - ${SHOGGOTH_DNS_IP}
        searches:
        - ${SHOGGOTH_NAMESPACE}.svc.cluster.local
        - svc.cluster.local
        - cluster.local
      initContainers: []
      containers:
      - name: localai
        image: localai/localai:sha-36d800e-gpu-vulkan
        imagePullPolicy: IfNotPresent
        env:
        - name: ADDRESS
          value: 0.0.0.0:80
        - name: MODELS_PATH
          value: /models
        - name: THREADS
          value: '4'
        - name: MAX_ACTIVE_BACKENDS
          value: '1'
        - name: SINGLE_ACTIVE_BACKEND
          value: 'true'
        - name: PRELOAD_MODELS_CONFIG
          value: /models/preload-models.yaml
        - name: OTEL_TRACES_EXPORTER
          value: otlp
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://otelcol:4318
        - name: SHOGGOTH_DOMAIN
          value: ${SHOGGOTH_DOMAIN}
        volumeMounts:
        - name: models
          mountPath: /models
        - name: backends
          mountPath: /backends
        - name: data
          mountPath: /data
        - name: preload-config
          mountPath: /models/preload-models.yaml
          subPath: preload-models.yaml
          readOnly: true
        - name: dri
          mountPath: /dev/dri
        - name: kfd
          mountPath: /dev/kfd
        securityContext:
          privileged: true
        ports:
        - containerPort: 80
          name: http
        lifecycle:
          postStart:
            exec:
              command:
              - chown
              - -R
              - ubuntu:users
              - /backends
        resources:
          requests:
            memory: 1Gi
            cpu: 500m
          limits:
            memory: 8Gi
            cpu: 4000m
        # startupProbe and livenessProbe are `exec: ["true"]` so kubelet never
        # kills the container during long backend downloads — the first-run
        # vulkan-llama-cpp fetch can take well over the previous 90 min budget,
        # and any HTTP probe against /v1/models returns connection refused
        # while preload is still in flight. readinessProbe still polls
        # /v1/models so litellm only routes traffic once localai is serving.
        readinessProbe:
          httpGet:
            path: /v1/models
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
          failureThreshold: 60
        livenessProbe:
          exec:
            command: ["true"]
          periodSeconds: 30
          failureThreshold: 2147483647
        startupProbe:
          exec:
            command: ["true"]
          periodSeconds: 30
          failureThreshold: 2147483647
      volumes:
      - name: models
        persistentVolumeClaim:
          claimName: localai-models
      - name: backends
        persistentVolumeClaim:
          claimName: localai-backends
      - name: data
        persistentVolumeClaim:
          claimName: localai-data
      - name: preload-config
        configMap:
          name: localai-preload
      - name: dri
        hostPath:
          path: /dev/dri
          type: Directory
      - name: kfd
        hostPath:
          path: /dev/kfd
          type: CharDevice
