apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: localai-models
  namespace: ${SHOGGOTH_NAMESPACE}
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
  storageClassName: local-path
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: localai-backends
  namespace: ${SHOGGOTH_NAMESPACE}
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: local-path
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: localai-data
  namespace: ${SHOGGOTH_NAMESPACE}
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: local-path
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: localai-preload
  namespace: ${SHOGGOTH_NAMESPACE}
data:
  preload-models.yaml: |
    ---
    - id: "nomic-embed-text-v1.5"
      overrides:
          embeddings: true
          gpu_layers: 99999999
          options:
              - gpu
---
apiVersion: v1
kind: Service
metadata:
  name: localai
  namespace: ${SHOGGOTH_NAMESPACE}
spec:
  selector:
    app: localai
  ports:
  - name: http
    port: 80
    targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: localai
  namespace: ${SHOGGOTH_NAMESPACE}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: localai
  template:
    metadata:
      labels:
        app: localai
    spec:
      dnsPolicy: None
      dnsConfig:
        nameservers:
        - ${SHOGGOTH_DNS_IP}
        searches:
        - ${SHOGGOTH_NAMESPACE}.svc.cluster.local
        - svc.cluster.local
        - cluster.local
      initContainers:
      - name: wait-bootstrap
        image: asherikov/shoggoth_tools:alpine
        imagePullPolicy: IfNotPresent
        command:
        - bash
        - -c
        args:
        - |
          set -euo pipefail
          K8S_API="${K8S_API:-https://kubernetes.default.svc}"
          SA_TOKEN="$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)"
          SA_CA="/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
          for i in $(seq 1 120); do
            http_code=$(curl -sS --cacert "${SA_CA}" \
              -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer ${SA_TOKEN}" \
              "${K8S_API}/api/v1/namespaces/${SHOGGOTH_NAMESPACE}/secrets/shoggoth-bootstrap-done" || true)
            if [ "${http_code}" = "200" ]; then
              echo "wait-bootstrap: shoggoth-bootstrap-done Secret found"
              exit 0
            fi
            echo "wait-bootstrap: waiting for shoggoth-bootstrap-done Secret (attempt $i/120, http=${http_code})..."
            if [ $((i % 12)) -eq 0 ] && [ "${http_code}" != "404" ]; then
              curl -sS --cacert "${SA_CA}" \
                -H "Authorization: Bearer ${SA_TOKEN}" \
                "${K8S_API}/api/v1/namespaces/${SHOGGOTH_NAMESPACE}/secrets/shoggoth-bootstrap-done" >&2 || true
            fi
            sleep 5
          done
          echo "wait-bootstrap: FATAL: shoggoth-bootstrap-done Secret not found after 600s"
          echo "wait-bootstrap: openbao-bootstrap may have failed; check:"
          echo "  kubectl logs -n ${SHOGGOTH_NAMESPACE} -l app=openbao -c openbao-bootstrap"
          exit 1
        resources:
          requests:
            memory: 32Mi
            cpu: 50m
          limits:
            memory: 64Mi
            cpu: 200m
        volumeMounts: []
      containers:
      - name: localai
        image: localai/localai:latest-gpu-vulkan
        imagePullPolicy: IfNotPresent
        env:
        - name: ADDRESS
          value: 0.0.0.0:80
        - name: MODELS_PATH
          value: /models
        - name: THREADS
          value: '4'
        - name: MAX_ACTIVE_BACKENDS
          value: '1'
        - name: SINGLE_ACTIVE_BACKEND
          value: 'true'
        - name: PRELOAD_MODELS_CONFIG
          value: /models/preload-models.yaml
        - name: OTEL_TRACES_EXPORTER
          value: otlp
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://otelcol:4318
        - name: SHOGGOTH_DOMAIN
          value: ${SHOGGOTH_DOMAIN}
        volumeMounts:
        - name: models
          mountPath: /models
        - name: backends
          mountPath: /backends
        - name: data
          mountPath: /data
        - name: preload-config
          mountPath: /models/preload-models.yaml
          subPath: preload-models.yaml
          readOnly: true
        - name: dri
          mountPath: /dev/dri
        - name: kfd
          mountPath: /dev/kfd
        securityContext:
          privileged: true
        ports:
        - containerPort: 80
          name: http
        lifecycle:
          postStart:
            exec:
              command:
              - chown
              - -R
              - ubuntu:users
              - /backends
        resources:
          requests:
            memory: 1Gi
            cpu: 500m
          limits:
            memory: 8Gi
            cpu: 4000m
        readinessProbe:
          httpGet:
            path: /v1/models
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
          failureThreshold: 60
        livenessProbe:
          httpGet:
            path: /v1/models
            port: 80
          initialDelaySeconds: 60
          periodSeconds: 30
          failureThreshold: 6
      volumes:
      - name: models
        persistentVolumeClaim:
          claimName: localai-models
      - name: backends
        persistentVolumeClaim:
          claimName: localai-backends
      - name: data
        persistentVolumeClaim:
          claimName: localai-data
      - name: preload-config
        configMap:
          name: localai-preload
      - name: dri
        hostPath:
          path: /dev/dri
          type: Directory
      - name: kfd
        hostPath:
          path: /dev/kfd
          type: CharDevice
      serviceAccountName: localai
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: localai
  namespace: ${SHOGGOTH_NAMESPACE}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: localai-bootstrap-wait
  namespace: ${SHOGGOTH_NAMESPACE}
rules:
- apiGroups:
  - ''
  resources:
  - secrets
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: localai-bootstrap-wait
  namespace: ${SHOGGOTH_NAMESPACE}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: localai-bootstrap-wait
subjects:
- kind: ServiceAccount
  name: localai
  namespace: ${SHOGGOTH_NAMESPACE}
