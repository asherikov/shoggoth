apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: localai-models
  namespace: ${SHOGGOTH_NAMESPACE}
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
  storageClassName: local-path
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: localai-backends
  namespace: ${SHOGGOTH_NAMESPACE}
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: local-path
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: localai-data
  namespace: ${SHOGGOTH_NAMESPACE}
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: local-path
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: localai-preload
  namespace: ${SHOGGOTH_NAMESPACE}
data:
  # Use the `url:` form (no gallery `id`) so preload works with
  # AUTOLOAD_GALLERIES=false. The URL is `file://` (not http://) because
  # LocalAI's `validateGalleryConfigURL` (core/gallery/gallery.go) refuses
  # any `http(s)://` URL whose hostname ends in `.local` — which blocks
  # all in-cluster service DNS. The file is mounted from the
  # web-internal-html ConfigMap into `/models/` (the trusted root for
  # `file://` URLs, controlled by `MODELS_PATH`); files mounted outside
  # `/models/` trigger `InTrustedRoot` (pkg/utils/path.go) and fail.
  # The `files:` entry downloads the GGUF from HuggingFace into the
  # localai-models PVC; the file persists across restarts.
  # This preload file itself is mounted OUTSIDE `/models/` (PRELOAD_MODELS_
  # CONFIG=/etc/localai/...): LocalAI parses every non-dot `*.yaml` under
  # MODELS_PATH as model configs (core/config/model_config_loader.go), and
  # this array-format gallery file registers its entry as a bare model
  # config — `url:`/`files:` are not ModelConfig fields — shadowing the real
  # config with one lacking `parameters.model`, so model loads resolve to
  # the `/models` directory itself ("gguf_init_from_reader: failed to read
  # magic").
  preload-models.yaml: |
    - name: "nomic-embed-text-v1.5"
      description: |
          Nomic Embed v1.5 embedding model in GGUF format.
      license: "Apache 2.0"
      url: "file:///models/nomic-embed-text-v1.5.yaml"
      files:
          - filename: "nomic-embed-text-v1.5.f16.gguf"
            uri: "https://huggingface.co/nomic-ai/nomic-embed-text-v1.5-GGUF/resolve/main/nomic-embed-text-v1.5.f16.gguf"
---
apiVersion: v1
kind: Service
metadata:
  name: localai
  namespace: ${SHOGGOTH_NAMESPACE}
spec:
  selector:
    app: localai
  ports:
  - name: http
    port: 80
    targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: localai
  namespace: ${SHOGGOTH_NAMESPACE}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: localai
  template:
    metadata:
      labels:
        app: localai
    spec:
      dnsPolicy: None
      dnsConfig:
        nameservers:
        - ${SHOGGOTH_DNS_IP}
        searches:
        - ${SHOGGOTH_NAMESPACE}.svc.cluster.local
        - svc.cluster.local
        - cluster.local
      initContainers: []
      containers:
      - name: localai
        image: localai/localai:sha-36d800e-gpu-vulkan
        imagePullPolicy: IfNotPresent
        env:
        - name: ADDRESS
          value: 0.0.0.0:80
        - name: MODELS_PATH
          value: /models
        - name: THREADS
          value: '4'
        - name: MAX_ACTIVE_BACKENDS
          value: '1'
        - name: SINGLE_ACTIVE_BACKEND
          value: 'true'
        - name: PRELOAD_MODELS_CONFIG
          value: /etc/localai/preload-models.yaml
        - name: AUTOLOAD_GALLERIES
          value: 'false'
        - name: AUTOLOAD_BACKEND_GALLERIES
          value: 'false'
        - name: AUTO_UPGRADE_BACKENDS
          value: 'false'
        - name: OTEL_TRACES_EXPORTER
          value: otlp
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://otelcol:4318
        - name: SHOGGOTH_DOMAIN
          value: ${SHOGGOTH_DOMAIN}
        volumeMounts:
        - name: models
          mountPath: /models
        - name: backends
          mountPath: /backends
        - name: data
          mountPath: /data
        - name: preload-config
          mountPath: /etc/localai/preload-models.yaml
          subPath: preload-models.yaml
          readOnly: true
        - name: model-configs
          mountPath: /models/nomic-embed-text-v1.5.yaml
          subPath: nomic-embed-text-v1.5.yaml
          readOnly: true
        - name: dri
          mountPath: /dev/dri
        - name: kfd
          mountPath: /dev/kfd
        securityContext:
          privileged: true
        ports:
        - containerPort: 80
          name: http
        lifecycle:
          postStart:
            exec:
              command:
              - chown
              - -R
              - ubuntu:users
              - /backends
        resources:
          requests:
            memory: 1Gi
            cpu: 500m
          limits:
            memory: 8Gi
            cpu: 4000m
        # startupProbe and livenessProbe are `exec: ["true"]` so kubelet never
        # kills the container during long backend downloads — the first-run
        # vulkan-llama-cpp fetch can take well over the previous 90 min budget,
        # and any HTTP probe against /v1/models returns connection refused
        # while preload is still in flight. readinessProbe still polls
        # /v1/models so litellm only routes traffic once localai is serving.
        readinessProbe:
          httpGet:
            path: /v1/models
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
          failureThreshold: 60
        livenessProbe:
          exec:
            command: ["true"]
          periodSeconds: 30
          failureThreshold: 2147483647
        startupProbe:
          exec:
            command: ["true"]
          periodSeconds: 30
          failureThreshold: 2147483647
      volumes:
      - name: models
        persistentVolumeClaim:
          claimName: localai-models
      - name: backends
        persistentVolumeClaim:
          claimName: localai-backends
      - name: data
        persistentVolumeClaim:
          claimName: localai-data
      - name: preload-config
        configMap:
          name: localai-preload
      - name: model-configs
        configMap:
          name: web-internal-html
          items:
            - key: nomic-embed-text-v1.5.yaml
              path: nomic-embed-text-v1.5.yaml
      - name: dri
        hostPath:
          path: /dev/dri
          type: Directory
      - name: kfd
        hostPath:
          path: /dev/kfd
          type: CharDevice
