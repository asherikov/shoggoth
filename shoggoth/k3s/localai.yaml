---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: localai-models
  namespace: ${SHOGGOTH_NAMESPACE}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
  storageClassName: local-path
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: localai-backends
  namespace: ${SHOGGOTH_NAMESPACE}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: local-path
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: localai-data
  namespace: ${SHOGGOTH_NAMESPACE}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: local-path
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: localai-preload
  namespace: ${SHOGGOTH_NAMESPACE}
data:
  preload-models.yaml: |
    ---
    - id: "nomic-embed-text-v1.5"
      overrides:
          embeddings: true
          gpu_layers: 99999999
          options:
              - gpu

---
apiVersion: v1
kind: Service
metadata:
  name: localai
  namespace: ${SHOGGOTH_NAMESPACE}
spec:
  selector:
    app: localai
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: localai
  namespace: ${SHOGGOTH_NAMESPACE}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: localai
  template:
    metadata:
      labels:
        app: localai
    spec:
      dnsPolicy: None
      dnsConfig:
        nameservers:
          - ${DNS_IP}
        searches:
          - ${SHOGGOTH_NAMESPACE}.svc.cluster.local
          - svc.cluster.local
          - cluster.local
      initContainers:
        - name: wait-bringup
          image: busybox:latest
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c"]
          args:
            - |
              echo "wait-bringup: checking sentinel /shoggoth/rendered/.bringup-done"
              if [ ! -f /shoggoth/rendered/.bringup-done ]; then
                echo "wait-bringup: sentinel not found, dumping diagnostics:" >&2
                echo "wait-bringup: /shoggoth/rendered/ exists: $([ -d /shoggoth/rendered ] && echo yes || echo no)" >&2
                if [ -d /shoggoth/rendered ]; then
                  echo "wait-bringup: contents:" >&2
                  ls -la /shoggoth/rendered/ >&2 || true
                fi
                if [ -f /shoggoth/rendered/bringup.log ]; then
                  echo "wait-bringup: bringup.log tail:" >&2
                  tail -20 /shoggoth/rendered/bringup.log >&2 || true
                fi
                echo "wait-bringup: exiting, bringup may still be in progress" >&2
                exit 1
              fi
              echo "wait-bringup: sentinel found"
          resources:
            requests:
              memory: "32Mi"
              cpu: "50m"
            limits:
              memory: "64Mi"
              cpu: "200m"
          volumeMounts:
            - name: rendered
              mountPath: /shoggoth/rendered
              readOnly: true
      containers:
        - name: localai
          image: localai/localai:latest-gpu-vulkan
          imagePullPolicy: IfNotPresent
          env:
            - name: ADDRESS
              value: "0.0.0.0:80"
            - name: MODELS_PATH
              value: /models
            - name: THREADS
              value: "4"
            - name: MAX_ACTIVE_BACKENDS
              value: "1"
            - name: SINGLE_ACTIVE_BACKEND
              value: "true"
            - name: PRELOAD_MODELS_CONFIG
              value: /models/preload-models.yaml
            - name: OTEL_TRACES_EXPORTER
              value: "otlp"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otelcol:4318"
            - name: SHOGGOTH_DOMAIN
              value: "${SHOGGOTH_DOMAIN}"
          volumeMounts:
            - name: models
              mountPath: /models
            - name: backends
              mountPath: /backends
            - name: data
              mountPath: /data
            - name: preload-config
              mountPath: /models/preload-models.yaml
              subPath: preload-models.yaml
              readOnly: true
            - name: rendered
              mountPath: /shoggoth/rendered
              readOnly: true
            - name: dri
              mountPath: /dev/dri
            - name: kfd
              mountPath: /dev/kfd
          securityContext:
            privileged: true
          ports:
            - containerPort: 80
              name: http
          lifecycle:
            postStart:
              exec:
                command:
                  - chown
                  - -R
                  - ubuntu:users
                  - /backends
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "8Gi"
              cpu: "4000m"
          readinessProbe:
            httpGet:
              path: /v1/models
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /v1/models
              port: 80
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 6
      volumes:
        - name: rendered
          hostPath:
            path: /var/lib/rancher/k3s/storage/${SHOGGOTH_INSTANCE_DIR}/rendered
            type: DirectoryOrCreate
        - name: models
          persistentVolumeClaim:
            claimName: localai-models
        - name: backends
          persistentVolumeClaim:
            claimName: localai-backends
        - name: data
          persistentVolumeClaim:
            claimName: localai-data
        - name: preload-config
          configMap:
            name: localai-preload
        - name: dri
          hostPath:
            path: /dev/dri
            type: Directory
        - name: kfd
          hostPath:
            path: /dev/kfd
            type: CharDevice