---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bringup
  namespace: shoggoth
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: bringup-secrets
  namespace: shoggoth
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "update", "patch", "get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bringup-secrets
  namespace: shoggoth
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: bringup-secrets
subjects:
  - kind: ServiceAccount
    name: bringup
    namespace: shoggoth