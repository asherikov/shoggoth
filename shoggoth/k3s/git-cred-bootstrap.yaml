---
# git-cred-bootstrap — single source of truth for in-pod git credentials.
#
# Mounted as a sidecar container by:
#   1. slave-dind.yaml -> Deployment.spec.template.spec.containers (name: git-cred)
#      (DinD pod; ssh-agent + git-credential-cache are inherited by every CI
#       container spawned by gitea/runner via --volume /shoggoth/git-cred)
#   2. slave-term.yaml -> Deployment.spec.template.spec.containers (name: git-cred)
#      (interactive web terminal; ttyd shell session reads the agent socket)
#
# The sidecar must run as the same uid as the main container's interactive
# user (ccws / 1000) so the sockets it creates are readable by the consumer
# — set `securityContext.runAsUser: 1000` on the sidecar.
#
# Inputs (env):
#   SHOGGOTH_DOMAIN     — used to derive git.${DOMAIN} SSH / HTTPS endpoints
#   SSH_ID_RSA          — secretRef: ssh-slave-private-key / ssh-id-rsa
#   GITEA_SLAVE_TOKEN   — secretRef: gitea-slave-token / token
#
# Outputs (mounted at /shoggoth/git-cred, emptyDir shared with main container):
#   known_hosts              ssh-keyscan output for git.${SHOGGOTH_DOMAIN}
#   ssh_auth_sock            ssh-agent UNIX socket (SSH_AUTH_SOCK)
#   git_credential_sock      git credential-cache--daemon socket
#
# The script ends with `exec sleep infinity` so the sidecar container stays
# up for the lifetime of the pod — ssh-agent and git-credential-cache--daemon
# are backgrounded children of bash and become children of the sleeping PID 1
# after the exec, so they live until the cgroup is destroyed at pod shutdown.
#
# The main container needs only to set:
#   SSH_AUTH_SOCK=/shoggoth/git-cred/ssh_auth_sock
#   GITEA_SSH_HOST=git.${SHOGGOTH_DOMAIN}
# (the slave container's /etc/ssh/ssh_config.d/shoggoth.conf already wires
# UserKnownHostsFile=/shoggoth/git-cred/known_hosts and the git credential
# helper reads the GIT_CRED_SOCK env automatically.)
apiVersion: v1
kind: ConfigMap
metadata:
  name: git-cred-bootstrap
  namespace: ${SHOGGOTH_NAMESPACE}
data:
  bootstrap.sh: |
    #!/usr/bin/env bash
    set -euo pipefail

    SSH_AUTH_SOCK="/shoggoth/git-cred/ssh_auth_sock"
    GIT_CRED_SOCK="/shoggoth/git-cred/git_credential_sock"
    KNOWN_HOSTS="/shoggoth/git-cred/known_hosts"
    CRED_TIMEOUT=31536000

    mkdir -p /shoggoth/git-cred
    chmod 0700 /shoggoth/git-cred
    # Clean any stale AF_UNIX socket left by a previous container restart in
    # the same pod. emptyDir survives container restarts; the ssh-agent /
    # credential-cache process that owned the socket does not, so without
    # this ssh-agent fails to bind with EADDRINUSE on the next start.
    rm -f "${SSH_AUTH_SOCK}" "${GIT_CRED_SOCK}"

    if [ -z "${SHOGGOTH_DOMAIN:-}" ]; then
        echo "git-cred-bootstrap: FATAL: SHOGGOTH_DOMAIN env var is empty" >&2
        exit 1
    fi

    echo "git-cred-bootstrap: scanning git.${SHOGGOTH_DOMAIN} SSH host keys..." >&2
    if ! ssh-keyscan "git.${SHOGGOTH_DOMAIN}" > "${KNOWN_HOSTS}" 2>/dev/null; then
        echo "git-cred-bootstrap: FATAL: ssh-keyscan failed on git.${SHOGGOTH_DOMAIN}" >&2
        exit 1
    fi
    chmod 644 "${KNOWN_HOSTS}"

    echo "git-cred-bootstrap: starting ssh-agent at ${SSH_AUTH_SOCK}..." >&2
    eval "$(ssh-agent -a "${SSH_AUTH_SOCK}")"
    SSH_AGENT_PID="$(echo "${SSH_AGENT_PID}" | head -1)"
    chmod 600 "${SSH_AUTH_SOCK}"

    SSH_ID_RSA="${SSH_ID_RSA:-}"
    if [ -z "${SSH_ID_RSA}" ]; then
        echo "git-cred-bootstrap: FATAL: SSH_ID_RSA env var is empty" >&2
        echo "git-cred-bootstrap:        expected source: K8s Secret 'ssh-slave-private-key' (key 'ssh-id-rsa') in namespace '${SHOGGOTH_NAMESPACE:-}'" >&2
        exit 1
    fi

    FIRST_LINE=$(printf '%s' "${SSH_ID_RSA}" | head -n 1)
    case "${FIRST_LINE}" in
        "-----BEGIN"*) ;;
        *) echo "git-cred-bootstrap: FATAL: SSH_ID_RSA does not start with a BEGIN marker (first line: ${FIRST_LINE})" >&2; exit 1 ;;
    esac
    LAST_LINE=$(printf '%s' "${SSH_ID_RSA}" | awk 'NF{last=$0} END{print last}')
    case "${LAST_LINE}" in
        "-----END"*) ;;
        *) echo "git-cred-bootstrap: FATAL: SSH_ID_RSA does not end with an END marker (last line: ${LAST_LINE})" >&2; exit 1 ;;
    esac

    printf '%s\n' "${SSH_ID_RSA}" > /tmp/git-cred-bootstrap-key
    chmod 400 /tmp/git-cred-bootstrap-key
    if ! ssh-add /tmp/git-cred-bootstrap-key 2>&1; then
        echo "git-cred-bootstrap: FATAL: ssh-add failed" >&2
        rm -f /tmp/git-cred-bootstrap-key
        exit 1
    fi
    rm -f /tmp/git-cred-bootstrap-key

    IDENTITY_COUNT=$(ssh-add -l | wc -l | tr -d ' \n')
    if [ "${IDENTITY_COUNT}" -lt 1 ]; then
        echo "git-cred-bootstrap: FATAL: ssh-agent has no identities" >&2
        exit 1
    fi
    echo "git-cred-bootstrap: ssh-agent has ${IDENTITY_COUNT} identity(ies)" >&2

    echo "git-cred-bootstrap: starting git credential-cache daemon..." >&2
    git credential-cache--daemon "${GIT_CRED_SOCK}" &
    sleep 1
    chmod 600 "${GIT_CRED_SOCK}"

    GITEA_SLAVE_TOKEN="${GITEA_SLAVE_TOKEN:-}"
    if [ -z "${GITEA_SLAVE_TOKEN}" ]; then
        echo "git-cred-bootstrap: WARNING: GITEA_SLAVE_TOKEN empty; HTTPS pushes will 401" >&2
    else
        printf 'protocol=http\nhost=git.%s\nusername=token\npassword=%s\n' \
            "${SHOGGOTH_DOMAIN}" "${GITEA_SLAVE_TOKEN}" \
          | git credential-cache --socket "${GIT_CRED_SOCK}" \
              --timeout "${CRED_TIMEOUT}" store
    fi

    echo "git-cred-bootstrap: complete; keeping ssh-agent and git-credential-cache alive" >&2
    exec sleep infinity