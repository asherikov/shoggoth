apiVersion: v1
kind: ConfigMap
metadata:
  name: wireguard-entrypoint
  namespace: ${SHOGGOTH_NAMESPACE}
data:
  entrypoint.sh: '#!/usr/bin/env bash

    set -euo pipefail


    ln -sf /usr/sbin/iptables-nft /etc/alternatives/iptables

    ln -sf /usr/sbin/iptables-nft-restore /etc/alternatives/iptables-restore

    ln -sf /usr/sbin/iptables-nft-save /etc/alternatives/iptables-save

    ln -sf /usr/sbin/ip6tables-nft /etc/alternatives/ip6tables

    ln -sf /usr/sbin/ip6tables-nft-restore /etc/alternatives/ip6tables-restore

    ln -sf /usr/sbin/ip6tables-nft-save /etc/alternatives/ip6tables-save


    sysctl -w net.ipv4.ip_forward=1

    sysctl -w net.ipv4.conf.all.src_valid_mark=1


    exec "$@"

    '
---
apiVersion: v1
kind: Service
metadata:
  name: wireguard
  namespace: ${SHOGGOTH_NAMESPACE}
spec:
  selector:
    app: wireguard
  ports:
  - name: http
    port: ${SHOGGOTH_WG_UI_PORT}
    targetPort: ${SHOGGOTH_WG_UI_PORT}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wireguard
  namespace: ${SHOGGOTH_NAMESPACE}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: wireguard
  template:
    metadata:
      labels:
        app: wireguard
    spec:
      hostNetwork: true
      dnsPolicy: None
      dnsConfig:
        nameservers:
        - ${SHOGGOTH_DNS_IP}
        searches:
        - ${SHOGGOTH_NAMESPACE}.svc.cluster.local
        - svc.cluster.local
        - cluster.local
      initContainers:
      - name: wait-bootstrap
        image: asherikov/shoggoth_tools:alpine
        imagePullPolicy: IfNotPresent
        command:
        - bash
        - -c
        args:
        - |
          set -euo pipefail
          K8S_API="${K8S_API:-https://kubernetes.default.svc}"
          SA_TOKEN="$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)"
          SA_CA="/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
          for i in $(seq 1 120); do
            http_code=$(curl -sS --cacert "${SA_CA}" \
              -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer ${SA_TOKEN}" \
              "${K8S_API}/api/v1/namespaces/${SHOGGOTH_NAMESPACE}/secrets/shoggoth-bootstrap-done" || true)
            if [ "${http_code}" = "200" ]; then
              echo "wait-bootstrap: shoggoth-bootstrap-done Secret found"
              exit 0
            fi
            echo "wait-bootstrap: waiting for shoggoth-bootstrap-done Secret (attempt $i/120, http=${http_code})..."
            if [ $((i % 12)) -eq 0 ] && [ "${http_code}" != "404" ]; then
              curl -sS --cacert "${SA_CA}" \
                -H "Authorization: Bearer ${SA_TOKEN}" \
                "${K8S_API}/api/v1/namespaces/${SHOGGOTH_NAMESPACE}/secrets/shoggoth-bootstrap-done" >&2 || true
            fi
            sleep 5
          done
          echo "wait-bootstrap: FATAL: shoggoth-bootstrap-done Secret not found after 600s"
          echo "wait-bootstrap: openbao-bootstrap may have failed; check:"
          echo "  kubectl logs -n ${SHOGGOTH_NAMESPACE} -l app=openbao -c openbao-bootstrap"
          exit 1
        resources:
          requests:
            memory: 32Mi
            cpu: 50m
          limits:
            memory: 64Mi
            cpu: 200m
        volumeMounts: []
      containers:
      - name: wireguard
        image: ghcr.io/wg-easy/wg-easy:15
        ports:
        - containerPort: ${SHOGGOTH_WG_PORT}
          hostPort: ${SHOGGOTH_WG_PORT}
          protocol: UDP
          name: wireguard
        - containerPort: ${SHOGGOTH_WG_UI_PORT}
          name: http
        env:
        - name: INIT_ENABLED
          value: 'true'
        - name: INIT_USERNAME
          value: admin
        - name: INIT_HOST
          value: ${SHOGGOTH_DOMAIN}
        - name: INIT_PORT
          value: '${SHOGGOTH_WG_PORT}'
        - name: INIT_PASSWORD
          value: shoggoth1234
        - name: INIT_ALLOWED_IPS
          value: 10.43.0.0/16
        - name: WG_PERSISTENT_KEEPALIVE
          value: '25'
        - name: INIT_DNS
          value: ${SHOGGOTH_DNS_IP}
        - name: INSECURE
          value: 'true'
        - name: DISABLE_IPV6
          value: 'true'
        - name: PORT
          value: '${SHOGGOTH_WG_UI_PORT}'
        - name: OTEL_TRACES_EXPORTER
          value: otlp
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://otelcol:4318
        - name: SHOGGOTH_DOMAIN
          value: ${SHOGGOTH_DOMAIN}
        securityContext:
          capabilities:
            add:
            - NET_ADMIN
            - SYS_MODULE
          privileged: true
        volumeMounts:
        - name: data
          mountPath: /etc/wireguard
        - name: entrypoint
          mountPath: /entrypoint.sh
          subPath: entrypoint.sh
          readOnly: true
        - name: modules
          mountPath: /lib/modules
          readOnly: true
        - name: admin-password
          mountPath: /run/secrets/admin_password
          subPath: admin-password
          readOnly: true
        readinessProbe:
          httpGet:
            path: /
            port: ${SHOGGOTH_WG_UI_PORT}
          initialDelaySeconds: 5
          periodSeconds: 5
          failureThreshold: 30
        livenessProbe:
          httpGet:
            path: /
            port: ${SHOGGOTH_WG_UI_PORT}
          initialDelaySeconds: 10
          periodSeconds: 10
          failureThreshold: 6
        resources:
          requests:
            memory: 64Mi
            cpu: 50m
          limits:
            memory: 256Mi
            cpu: 500m
        command:
        - /entrypoint.sh
        args:
        - /usr/bin/dumb-init
        - node
        - server/index.mjs
      volumes:
      - name: data
        hostPath:
          path: /var/lib/rancher/k3s/storage/${SHOGGOTH_INSTANCE_DIR}/wireguard-data
          type: DirectoryOrCreate
      - name: entrypoint
        configMap:
          name: wireguard-entrypoint
          defaultMode: 493
      - name: modules
        hostPath:
          path: /lib/modules
          type: Directory
      - name: admin-password
        secret:
          secretName: wireguard-admin-password
      serviceAccountName: wireguard
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: wireguard
  namespace: ${SHOGGOTH_NAMESPACE}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: wireguard-bootstrap-wait
  namespace: ${SHOGGOTH_NAMESPACE}
rules:
- apiGroups:
  - ''
  resources:
  - secrets
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: wireguard-bootstrap-wait
  namespace: ${SHOGGOTH_NAMESPACE}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: wireguard-bootstrap-wait
subjects:
- kind: ServiceAccount
  name: wireguard
  namespace: ${SHOGGOTH_NAMESPACE}
