---
apiVersion: v1
kind: ConfigMap
metadata:
  name: wireguard-entrypoint
  namespace: ${SHOGGOTH_NAMESPACE}
data:
  entrypoint.sh: |
    #!/usr/bin/env bash
    set -euo pipefail

    ln -sf /usr/sbin/iptables-nft /etc/alternatives/iptables
    ln -sf /usr/sbin/iptables-nft-restore /etc/alternatives/iptables-restore
    ln -sf /usr/sbin/iptables-nft-save /etc/alternatives/iptables-save
    ln -sf /usr/sbin/ip6tables-nft /etc/alternatives/ip6tables
    ln -sf /usr/sbin/ip6tables-nft-restore /etc/alternatives/ip6tables-restore
    ln -sf /usr/sbin/ip6tables-nft-save /etc/alternatives/ip6tables-save

    sysctl -w net.ipv4.ip_forward=1
    sysctl -w net.ipv4.conf.all.src_valid_mark=1

    exec "$@"
---
apiVersion: v1
kind: Service
metadata:
  name: wireguard
  namespace: ${SHOGGOTH_NAMESPACE}
spec:
  selector:
    app: wireguard
  ports:
    - name: http
      port: 51821
      targetPort: 51821
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wireguard
  namespace: ${SHOGGOTH_NAMESPACE}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: wireguard
  template:
    metadata:
      labels:
        app: wireguard
    spec:
      hostNetwork: true
      dnsPolicy: None
      dnsConfig:
        nameservers:
          - ${DNS_IP}
        searches:
          - ${SHOGGOTH_NAMESPACE}.svc.cluster.local
          - svc.cluster.local
          - cluster.local
      initContainers:
        - name: wait-bringup
          image: busybox:latest
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c"]
          args:
            - |
              echo "wait-bringup: checking sentinel /shoggoth/rendered/.bringup-done"
              if [ ! -f /shoggoth/rendered/.bringup-done ]; then
                echo "wait-bringup: sentinel not found, dumping diagnostics:" >&2
                echo "wait-bringup: /shoggoth/rendered/ exists: $([ -d /shoggoth/rendered ] && echo yes || echo no)" >&2
                if [ -d /shoggoth/rendered ]; then
                  echo "wait-bringup: contents:" >&2
                  ls -la /shoggoth/rendered/ >&2 || true
                fi
                if [ -f /shoggoth/rendered/bringup.log ]; then
                  echo "wait-bringup: bringup.log tail:" >&2
                  tail -20 /shoggoth/rendered/bringup.log >&2 || true
                fi
                echo "wait-bringup: exiting, bringup may still be in progress" >&2
                exit 1
              fi
              echo "wait-bringup: sentinel found"
          resources:
            requests:
              memory: "32Mi"
              cpu: "50m"
            limits:
              memory: "64Mi"
              cpu: "200m"
          volumeMounts:
            - name: rendered
              mountPath: /shoggoth/rendered
              readOnly: true
      containers:
        - name: wireguard
          image: ghcr.io/wg-easy/wg-easy:15
          ports:
            - containerPort: ${WG_PORT}
              hostPort: ${WG_PORT}
              protocol: UDP
              name: wireguard
            - containerPort: 51821
              name: http
          env:
            - name: INIT_ENABLED
              value: "true"
            - name: INIT_USERNAME
              value: "admin"
            - name: INIT_HOST
              value: "${SHOGGOTH_DOMAIN}"
            - name: INIT_PORT
              value: "${WG_PORT}"
            - name: INIT_PASSWORD
              value: "shoggoth1234"
#              valueFrom:
#                secretKeyRef:
#                  name: wireguard-admin-password
#                  key: admin-password
            - name: INIT_ALLOWED_IPS
              value: "10.43.0.0/16"
            - name: INIT_DNS
              value: "${DNS_IP}"
            - name: INSECURE
              value: "true"
            - name: DISABLE_IPV6
              value: "true"
            - name: PORT
              value: "51821"
            - name: OTEL_TRACES_EXPORTER
              value: "otlp"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otelcol:4318"
            - name: SHOGGOTH_DOMAIN
              value: "${SHOGGOTH_DOMAIN}"
          securityContext:
            capabilities:
              add: ["NET_ADMIN", "SYS_MODULE"]
            privileged: true
          volumeMounts:
            - name: data
              mountPath: /etc/wireguard
            - name: entrypoint
              mountPath: /entrypoint.sh
              subPath: entrypoint.sh
              readOnly: true
            - name: modules
              mountPath: /lib/modules
              readOnly: true
            - name: admin-password
              mountPath: /run/secrets/admin_password
              subPath: admin-password
              readOnly: true
          readinessProbe:
            httpGet:
              path: /
              port: 51821
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /
              port: 51821
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          command: ["/entrypoint.sh"]
          args: ["/usr/bin/dumb-init", "node", "server/index.mjs"]
      volumes:
        - name: data
          hostPath:
            path: /var/lib/rancher/k3s/storage/${SHOGGOTH_INSTANCE_DIR}/wireguard-data
            type: DirectoryOrCreate
        - name: entrypoint
          configMap:
            name: wireguard-entrypoint
            defaultMode: 0755
        - name: modules
          hostPath:
            path: /lib/modules
            type: Directory
        - name: admin-password
          secret:
            secretName: wireguard-admin-password
        - name: rendered
          hostPath:
            path: /var/lib/rancher/k3s/storage/${SHOGGOTH_INSTANCE_DIR}/rendered
            type: DirectoryOrCreate
