---
apiVersion: v1
kind: ConfigMap
metadata:
  name: web-internal-config-template
  namespace: ${SHOGGOTH_NAMESPACE}
data:
  angie.conf.tmpl: |
    load_module modules/ngx_otel_module.so;

    events {
        worker_connections 1024;
    }

    http {
        resolver ${DNS_IP} valid=30s;

        map $http_upgrade $connection_upgrade {
            default upgrade;
            ''      close;
        }

        otel_exporter {
            endpoint http://otelcol:4317;
        }
        otel_service_name angie;

        # --- python-cache (PyPI caching proxy) ---

        proxy_cache_path /data/python_cache/cache
            levels=1:2
            keys_zone=pypi_cache:10m
            max_size=10g
            inactive=120d
            use_temp_path=off;

        server {
            listen 80;

            server_name python-cache.${SHOGGOTH_DOMAIN};

            location = / {
                return 302 /index/;
            }

            location /index/ {
                proxy_pass https://pypi.org/simple/;
                proxy_ssl_server_name on;
                proxy_set_header Host pypi.org;
                proxy_set_header Accept-Encoding "";
                sub_filter_once off;
                sub_filter 'https://files.pythonhosted.org/' 'http://python-cache.${SHOGGOTH_DOMAIN}/files/';
                sub_filter_types text/html application/vnd.pypi.simple.v1+json application/vnd.pypi.simple.latest+json application/vnd.pypi.simple.v1+html;
                proxy_cache pypi_cache;
                proxy_cache_valid 200 10m;
                proxy_cache_valid 301 302 1h;
            }

            location /files/ {
                proxy_pass https://files.pythonhosted.org/;
                proxy_ssl_server_name on;
                proxy_set_header Host files.pythonhosted.org;
                proxy_read_timeout 300s;
                proxy_connect_timeout 30s;
                proxy_cache pypi_cache;
                proxy_cache_valid 200 30d;
                proxy_cache_key $uri;
            }
        }

        # --- static site ---

        server {
            listen 80 default_server;

            server_name ${SHOGGOTH_DOMAIN};

            root /data/html;
            index index.html;

            location / {
                try_files $uri $uri/ =404;
            }

            location = /plugin.tar.gz {
                alias /data/plugin/plugin.tar.gz;
                default_type application/gzip;
            }
        }

        # --- build-cache (webdav) ---

        server {
            listen 80;

            server_name build-cache.${SHOGGOTH_DOMAIN};
            location / {
                alias /data/build_cache/;
                log_not_found off;
                dav_methods PUT DELETE;
                create_full_put_path on;
                client_max_body_size 100M;
            }
        }

        # --- api (gitea + redmine + cdash unified) ---

        upstream git {
            zone git 1m;
            server git.${SHOGGOTH_NAMESPACE}.svc.cluster.local resolve;
        }

        upstream redmine {
            zone redmine 1m;
            server redmine.${SHOGGOTH_NAMESPACE}.svc.cluster.local resolve;
        }

        upstream cdash {
            zone cdash 1m;
            server cdash.${SHOGGOTH_NAMESPACE}.svc.cluster.local resolve;
        }

        server {
            listen 80;

            server_name api.${SHOGGOTH_DOMAIN};

            proxy_read_timeout 30m;
            proxy_send_timeout 30m;
            proxy_connect_timeout 360m;

            location = /gitea {
                return 301 /gitea/;
            }

            location /gitea/ {
                proxy_pass http://git/;
                proxy_set_header Host git.${SHOGGOTH_DOMAIN};
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_set_header Authorization "Bearer ${GITEA_SLAVE_TOKEN}";
            }

            location = /redmine {
                return 301 /redmine/;
            }

            location /redmine/ {
                proxy_pass http://redmine/;
                proxy_set_header Host redmine.${SHOGGOTH_DOMAIN};
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_set_header X-Redmine-API-Key "${REDMINE_TOKEN}";
            }

            location = /cdash {
                return 301 /cdash/;
            }

            location /cdash/ {
                proxy_pass http://cdash/;
                proxy_set_header Host cdash.${SHOGGOTH_DOMAIN};
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_set_header Authorization "Bearer ${CDASH_API_TOKEN}";
            }
        }

        # --- slave-term (websocket) ---

        upstream slave-dind {
            zone slave-dind 1m;
            server slave-dind.${SHOGGOTH_NAMESPACE}.svc.cluster.local resolve;
        }

        server {
            listen 80;

            server_name slave-term.${SHOGGOTH_DOMAIN};
            location / {
                proxy_pass http://slave-dind;
                proxy_read_timeout 30m;
                proxy_send_timeout 30m;
                proxy_connect_timeout 360m;

                proxy_buffering off;
                proxy_http_version 1.1;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection $connection_upgrade;
            }
        }

        # --- grafana ---

        upstream grafana {
            zone grafana 1m;
            server grafana.${SHOGGOTH_NAMESPACE}.svc.cluster.local resolve;
        }

        server {
            listen 80;

            server_name grafana.${SHOGGOTH_DOMAIN};

            location / {
                proxy_pass http://grafana;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection $connection_upgrade;
            }
        }
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: web-internal-html
  namespace: ${SHOGGOTH_NAMESPACE}
data:
  index.html: |
    <!DOCTYPE html>
    <html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Shoggoth</title>
        <style>
            body {
                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
                max-width: 800px;
                margin: 0 auto;
                padding: 40px 20px;
                background: #1a1a2e;
                color: #eee;
            }
            h1 { color: #00d9ff; }
            a { color: #00d9ff; }
            .services { margin: 30px 0; }
            .services li { margin: 10px 0; }
            .download {
                background: #16213e;
                padding: 20px;
                border-radius: 8px;
                margin-top: 30px;
            }
        </style>
    </head>
    <body>
        <h1>Shoggoth</h1>
        <p>A self-hosted development multitool intended for personal use.</p>

        <h2>Service web pages</h2>
        <ul class="services">
            <li><a href="http://git.${SHOGGOTH_DOMAIN}/">git</a> - Gitea git service</li>
            <li><a href="http://redmine.${SHOGGOTH_DOMAIN}/">redmine</a> - Redmine issue tracker</li>
            <li><a href="http://kestra.${SHOGGOTH_DOMAIN}/">kestra</a> - Kestra workflow orchestration</li>
            <li><a href="http://registry.${SHOGGOTH_DOMAIN}/v2/_catalog">registry</a> - Container image registry (zot)</li>
            <li><a href="http://python-cache.${SHOGGOTH_DOMAIN}/">python-cache</a> - PyPI cache proxy</li>
            <li><a href="http://apt-cache.${SHOGGOTH_DOMAIN}/">apt-cache</a> - APT package cache
                <a href="http://apt-cache.${SHOGGOTH_DOMAIN}/acng-report.html">Usage statistics.</a></li>
            <li><a href="http://litellm.${SHOGGOTH_DOMAIN}/">ai</a> - LLM proxy (LiteLLM → LocalAI)</li>
            <li><a href="http://git-pages.${SHOGGOTH_DOMAIN}/">git-pages</a> - Static site hosting</li>
            <li><a href="http://grafana.${SHOGGOTH_DOMAIN}/">grafana</a> - Observability dashboard (traces, metrics, logs)</li>
            <li><a href="http://slave-term.${SHOGGOTH_DOMAIN}/">slave-term</a> - Interactive web terminal (ttyd + tmux + Qwen Code)</li>
            <li><a href="http://phpldapadmin.${SHOGGOTH_DOMAIN}/">phpldapadmin</a> - LDAP directory web UI</li>
        </ul>

        <div class="download">
            <h2>Client Setup</h2>
            <p>Download and run the setup script to configure your client:</p>
            <pre><code>curl -kO https://${SHOGGOTH_DOMAIN}/setup-client.sh
    chmod +x setup-client.sh
    ./setup-client.sh --all</code></pre>
            <p>Or download directly: <a href="https://${SHOGGOTH_DOMAIN}/setup-client.sh">setup-client.sh</a> (use <code>-k</code> if CA certificate is not installed yet)</p>
        </div>
    </body>
    </html>
---
apiVersion: v1
kind: Service
metadata:
  name: web-internal
  namespace: ${SHOGGOTH_NAMESPACE}
spec:
  selector:
    app: web-internal
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: python-cache
  namespace: ${SHOGGOTH_NAMESPACE}
spec:
  selector:
    app: web-internal
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: build-cache
  namespace: ${SHOGGOTH_NAMESPACE}
spec:
  selector:
    app: web-internal
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: ${SHOGGOTH_NAMESPACE}
spec:
  selector:
    app: web-internal
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: slave-term
  namespace: ${SHOGGOTH_NAMESPACE}
spec:
  selector:
    app: web-internal
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: angie-build-cache
  namespace: ${SHOGGOTH_NAMESPACE}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
  storageClassName: local-path
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: python-cache
  namespace: ${SHOGGOTH_NAMESPACE}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: local-path
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-internal
  namespace: ${SHOGGOTH_NAMESPACE}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web-internal
  template:
    metadata:
      labels:
        app: web-internal
    spec:
      dnsPolicy: None
      dnsConfig:
        nameservers:
          - ${DNS_IP}
        searches:
          - ${SHOGGOTH_NAMESPACE}.svc.cluster.local
          - svc.cluster.local
          - cluster.local
      initContainers:
        - name: wait-bringup
          image: busybox:latest
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c"]
          args:
            - |
              echo "wait-bringup: checking sentinel /shoggoth/rendered/.bringup-done"
              if [ ! -f /shoggoth/rendered/.bringup-done ]; then
                echo "wait-bringup: sentinel not found, dumping diagnostics:" >&2
                echo "wait-bringup: /shoggoth/rendered/ exists: $([ -d /shoggoth/rendered ] && echo yes || echo no)" >&2
                if [ -d /shoggoth/rendered ]; then
                  echo "wait-bringup: contents:" >&2
                  ls -la /shoggoth/rendered/ >&2 || true
                fi
                if [ -f /shoggoth/rendered/bringup.log ]; then
                  echo "wait-bringup: bringup.log tail:" >&2
                  tail -20 /shoggoth/rendered/bringup.log >&2 || true
                fi
                echo "wait-bringup: exiting, bringup may still be in progress" >&2
                exit 1
              fi
              echo "wait-bringup: sentinel found"
          resources:
            requests:
              memory: "32Mi"
              cpu: "50m"
            limits:
              memory: "64Mi"
              cpu: "200m"
          volumeMounts:
            - name: plugin
              mountPath: /shoggoth/rendered
              readOnly: true
        - name: render-config
          image: asherikov/shoggoth_tools:alpine
          imagePullPolicy: IfNotPresent
          command: ["bash", "-c"]
          args:
            - |
              VARS="$(printf '${%s}' SHOGGOTH_DOMAIN)"
              envsubst "$VARS" < /tmpl/angie.conf.tmpl > /rendered/angie.conf
              envsubst "$VARS" < /tmpl-html/index.html > /rendered/index.html
              sed -e "s|\${GITEA_SLAVE_TOKEN}|${GITEA_SLAVE_TOKEN}|g" \
                  -e "s|\${REDMINE_TOKEN}|${REDMINE_TOKEN}|g" \
                  -e "s|\${CDASH_API_TOKEN}|${CDASH_API_TOKEN}|g" \
                  -i /rendered/angie.conf
          env:
            - name: SHOGGOTH_DOMAIN
              value: "${SHOGGOTH_DOMAIN}"
            - name: GITEA_SLAVE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: angie-tokens
                  key: gitea-slave-token
                  optional: true
            - name: REDMINE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: angie-tokens
                  key: redmine-token
                  optional: true
            - name: CDASH_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: angie-tokens
                  key: cdash-api-token
                  optional: true
          resources:
            requests:
              memory: "32Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          volumeMounts:
            - name: config-template
              mountPath: /tmpl
              readOnly: true
            - name: html-template
              mountPath: /tmpl-html
              readOnly: true
            - name: rendered-config
              mountPath: /rendered
        - name: fix-permissions
          image: asherikov/shoggoth_tools:alpine
          imagePullPolicy: IfNotPresent
          command: ["bash", "-c", "chown -R 100:101 /data/build_cache /data/python_cache"]
          securityContext:
            runAsUser: 0
          resources:
            requests:
              memory: "32Mi"
              cpu: "50m"
            limits:
              memory: "64Mi"
              cpu: "200m"
          volumeMounts:
            - name: build-cache
              mountPath: /data/build_cache
            - name: python-cache
              mountPath: /data/python_cache
      containers:
        - name: angie
          image: docker.angie.software/angie:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          volumeMounts:
            - name: rendered-config
              mountPath: /etc/angie/angie.conf
              subPath: angie.conf
              readOnly: true
            - name: rendered-config
              mountPath: /data/html
              readOnly: true
            - name: build-cache
              mountPath: /data/build_cache
            - name: python-cache
              mountPath: /data/python_cache
            - name: plugin
              mountPath: /data/plugin
              readOnly: true
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6
      volumes:
        - name: config-template
          configMap:
            name: web-internal-config-template
        - name: rendered-config
          emptyDir: {}
        - name: html-template
          configMap:
            name: web-internal-html
        - name: build-cache
          persistentVolumeClaim:
            claimName: angie-build-cache
        - name: python-cache
          persistentVolumeClaim:
            claimName: python-cache
        - name: plugin
          hostPath:
            path: /var/lib/rancher/k3s/storage/${SHOGGOTH_INSTANCE_DIR}/rendered
            type: DirectoryOrCreate