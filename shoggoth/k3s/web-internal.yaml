  caveman-skill.md: |
    ---
    name: caveman
    description: >
      Ultra-compressed communication mode. Cuts token usage ~75% by speaking like caveman
      while keeping full technical accuracy. Supports intensity levels: lite, full (default), ultra,
      wenyan-lite, wenyan-full, wenyan-ultra.
      Use when user says "caveman mode", "talk like caveman", "use caveman", "less tokens",
      "be brief", or invokes /caveman. Also auto-triggers when token efficiency is requested.
    ---
    
    Respond terse like smart caveman. All technical substance stay. Only fluff die.
    
    ## Persistence
    
    ACTIVE EVERY RESPONSE. No revert after many turns. No filler drift. Still active if unsure. Off only: "stop caveman" / "normal mode".
    
    Default: **full**. Switch: `/caveman lite|full|ultra`.
    
    ## Rules
    
    Drop: articles (a/an/the), filler (just/really/basically/actually/simply), pleasantries (sure/certainly/of course/happy to), hedging. Fragments OK. Short synonyms (big not extensive, fix not "implement a solution for"). No tool-call narration, no decorative tables/emoji, no dumping long raw error logs unless asked — quote shortest decisive line. Standard well-known tech acronyms OK (DB/API/HTTP); never invent new abbreviations reader can't decode. Technical terms exact. Code blocks unchanged. Errors quoted exact.
    
    Preserve user's dominant language. User write Portuguese → reply Portuguese caveman. User write Spanish → reply Spanish caveman. Compress the style, not the language. No forced English openings or status phrases. ALWAYS keep technical terms, code, API names, CLI commands, commit-type keywords (feat/fix/...), and exact error strings verbatim — unless user explicitly ask for translation.
    
    No self-reference. Never name or announce the style. No "caveman mode on", "me caveman think", no third-person caveman tags. Output caveman-only — never normal answer plus "Caveman:" recap. Exception: user explicitly ask what the mode is.
    
    Pattern: `[thing] [action] [reason]. [next step].`
    
    Not: "Sure! I'd be happy to help you with that. The issue you're experiencing is likely caused by..."
    Yes: "Bug in auth middleware. Token expiry check use `<` not `<=`. Fix:"
    
    ## Intensity
    
    | Level | What change |
    |-------|------------|
    | **lite** | No filler/hedging. Keep articles + full sentences. Professional but tight |
    | **full** | Drop articles, fragments OK, short synonyms. Classic caveman. No tool-call narration, no decorative tables/emoji, no long raw error-log dumps unless asked. Standard acronyms OK; no invented abbreviations |
    | **ultra** | Abbreviate prose words (DB/auth/config/req/res/fn/impl) — prose words only, never real code symbols/function names. Strip conjunctions, arrows for causality (X → Y), one word when one word enough. Code symbols, function names, API names, error strings: never abbreviate |
    | **wenyan-lite** | Semi-classical. Drop filler/hedging but keep grammar structure, classical register |
    | **wenyan-full** | Maximum classical terseness. Fully 文言文. 80-90% character reduction. Classical sentence patterns, verbs precede objects, subjects often omitted, classical particles (之/乃/為/其) |
    | **wenyan-ultra** | Extreme abbreviation while keeping classical Chinese feel. Maximum compression, ultra terse |
    
    Example — "Why React component re-render?"
    - lite: "Your component re-renders because you create a new object reference each render. Wrap it in `useMemo`."
    - full: "New object ref each render. Inline object prop = new ref = re-render. Wrap in `useMemo`."
    - ultra: "Inline obj prop → new ref → re-render. `useMemo`."
    - wenyan-lite: "組件頻重繪，以每繪新生對象參照故。以 useMemo 包之。"
    - wenyan-full: "每繪新生對象參照，故重繪；以 useMemo 包之則免。"
    - wenyan-ultra: "新參照→重繪。useMemo Wrap。"
    
    Example — "Explain database connection pooling."
    - lite: "Connection pooling reuses open connections instead of creating new ones per request. Avoids repeated handshake overhead."
    - full: "Pool reuse open DB connections. No new connection per request. Skip handshake overhead."
    - ultra: "Pool = reuse DB conn. Skip handshake → fast under load."
    - wenyan-full: "池reuse open connection。不每req新開。skip handshake overhead。"
    - wenyan-ultra: "池reuse conn。skip handshake → fast。"
    
    ## Auto-Clarity
    
    Drop caveman when:
    - Security warnings
    - Irreversible action confirmations
    - Multi-step sequences where fragment order or omitted conjunctions risk misread
    - Compression itself creates technical ambiguity (e.g., `"migrate table drop column backup first"` — order unclear without articles/conjunctions)
    - User asks to clarify or repeats question
    
    Resume caveman after clear part done.
    
    Example — destructive op:
    > **Warning:** This will permanently delete all rows in the `users` table and cannot be undone.
    > ```sql
    > DROP TABLE users;
    > ```
    > Caveman resume. Verify backup exist first.
    
    ## Boundaries
    
    Code/commits/PRs: write normal. "stop caveman" or "normal mode": revert. Level persist until changed or session end.
    


  codebase-memory-skill.md: |
    ---
    name: codebase-memory
    description: "Use the codebase knowledge graph for structural code queries. Triggers on: explore the codebase, understand the architecture, what functions exist, show me the structure, who calls this function, what does X call, trace the call chain, find callers of, show dependencies, impact analysis, dead code, unused functions, high fan-out, refactor candidates, code quality audit, graph query syntax, Cypher query examples, edge types, how to use search_graph."
    ---
    
    # Codebase Memory — Knowledge Graph Tools
    
    Graph tools return precise structural results in ~500 tokens vs ~80K for grep.
    
    ## Quick Decision Matrix
    
    | Question | Tool call |
    |----------|----------|
    | Who calls X? | `trace_path(direction="inbound")` |
    | What does X call? | `trace_path(direction="outbound")` |
    | Full call context | `trace_path(direction="both")` |
    | Find by name pattern | `search_graph(name_pattern="...")` |
    | Dead code | `search_graph(max_degree=0, exclude_entry_points=true)` |
    | Cross-service edges | `query_graph` with Cypher |
    | Impact of local changes | `detect_changes()` |
    | Risk-classified trace | `trace_path(risk_labels=true)` |
    | Text search | `search_code` or Grep |
    
    ## Exploration Workflow
    1. `list_projects` — check if project is indexed
    2. `get_graph_schema` — understand node/edge types
    3. `search_graph(label="Function", name_pattern=".*Pattern.*")` — find code
    4. `get_code_snippet(qualified_name="project.path.FuncName")` — read source
    
    ## Tracing Workflow
    1. `search_graph(name_pattern=".*FuncName.*")` — discover exact name
    2. `trace_path(function_name="FuncName", direction="both", depth=3)` — trace
    3. `detect_changes()` — map git diff to affected symbols
    
    ## Evidence Tiers
    - **Scout (Tier 1):** fast positive lookup with few graph calls and targeted source checks. Treat results as provisional; never make absence, exhaustive, dead-code, or complete-impact claims.
    - **Verify (Tier 2, default):** task-directed searches, relevant trace directions, exact snippets for material claims, and all relevant result pages.
    - **Auditor (Tier 3):** bounded-scope full verification with a current graph generation, complete relevant pagination, both call directions and broader relationships when material, plus explicit unresolved limitations.
    - **Every tier:** after candidate paths are known, call `check_index_coverage` once with every evidence path. For negative or exhaustive claims also include the relevant scopes. A clean result means no recorded gap, not proof of completeness. For partial, skipped, excluded, stale, pending, or unknown coverage, read/grep the reported ranges or scope before relying on the graph.
    
    ## Sessions and Subagents
    - At session start or after compaction, call `list_projects`/`index_status` before structural exploration, then choose Scout, Verify, or Auditor for the task.
    - Before delegating, query the graph and coverage in the parent. Pass the tier, exact project, generation/freshness, bounded scope, queries and pagination state, qualified symbols, paths, call-chain findings, coverage ranges/reasons, source fallback already performed, and unresolved questions to the child.
    - Runtimes such as Hermes isolate child context: put those graph findings in the `context` argument to `delegate_task`; do not assume the child inherits MCP access or the parent's conversation.
    - A child without MCP tools must not call or claim MCP access. It should work from the supplied evidence and use read/grep on exact source, especially every reported missed-coverage range.
    
    ## Quality Analysis
    - Dead code: `search_graph(max_degree=0, exclude_entry_points=true)`
    - High fan-out: `search_graph(min_degree=10, relationship="CALLS", direction="outbound")`
    - High fan-in: `search_graph(min_degree=10, relationship="CALLS", direction="inbound")`
    
    ## 15 MCP Tools
    `index_repository`, `index_status`, `list_projects`, `delete_project`,
    `search_graph`, `search_code`, `trace_path`, `detect_changes`,
    `query_graph`, `get_graph_schema`, `get_code_snippet`, `get_architecture`,
    `check_index_coverage`, `manage_adr`, `ingest_traces`
    
    ## Edge Types
    CALLS, HTTP_CALLS, ASYNC_CALLS, DATA_FLOWS, IMPORTS, DEFINES, DEFINES_METHOD,
    HANDLES, IMPLEMENTS, OVERRIDE, USAGE, CALL_REFERENCE, CONFIGURES, FILE_CHANGES_WITH,
    SIMILAR_TO, SEMANTICALLY_RELATED, CONTAINS_FILE, CONTAINS_FOLDER,
    CONTAINS_PACKAGE
    
    ## Cypher Examples (for query_graph)
    ```
    MATCH (a)-[r:HTTP_CALLS]->(b) RETURN a.name, b.name, r.url_path, r.confidence LIMIT 20
    MATCH (f:Function) WHERE f.name =~ '.*Handler.*' RETURN f.name, f.file_path
    MATCH (a)-[r:CALLS]->(b) WHERE a.name = 'main' RETURN b.name
    ```
    
    ## Gotchas
    1. `search_graph(relationship="HTTP_CALLS")` filters nodes by degree — use `query_graph` with Cypher to see actual edges.
    2. `query_graph` has a 100k row ceiling — add a Cypher `LIMIT` for broad queries or use `search_graph` pagination.
    3. `trace_path` needs exact names — use `search_graph(name_pattern=...)` first.
    4. `direction="outbound"` misses cross-service callers — use `direction="both"`.
    5. `search_graph` results default to 50 per page — check `has_more` and use `offset`.
    


  kestra-flow-skill.md: |
    ---
    name: kestra-flow
    description: Generate, modify, or debug Kestra Flow YAML by fetching the live flow schema and applying the same guardrails used by the Kestra AI Copilot. Use when users ask to create, write, update, or fix a Kestra flow.
    compatibility: Requires curl and network access to https://api.kestra.io/v1/plugins/schemas/flow. No Kestra instance required.
    ---
    
    # Kestra Flow Skill
    
    Use this skill to generate production-ready Kestra Flow YAML grounded in the live schema.
    
    ## When to use
    
    Use this skill when the request includes:
    - Generating a new Kestra flow from scratch
    - Modifying, extending, or debugging an existing flow
    - Translating a workflow description into valid Kestra YAML
    
    ## Required inputs
    
    - A description of the desired flow behavior
    - Namespace (and tenant ID if applicable)
    - Existing flow YAML if the request is a modification
    
    ## Workflow
    
    ### Step 1 — Fetch the flow schema
    
    Fetch the full schema with `curl` and read it directly — do not pipe it through any interpreter:
    
    ```bash
    curl -s https://api.kestra.io/v1/plugins/schemas/flow
    ```
    
    Read the raw JSON output to validate every type, property name, and structure used in the output. Do not generate anything before the schema is available.
    
    ### Step 2 — Collect context
    
    Identify from the user message or conversation:
    - `id` — flow identifier (preserve if provided)
    - `namespace` — target namespace (preserve if provided)
    - Existing flow YAML (for modification requests)
    - Whether this is an **addition / deletion / modification** or a **full rewrite**
    
    ### Step 3 — Generate the YAML
    
    Apply all generation rules below, then output raw YAML only.
    
    ## Generation rules
    
    **Schema compliance**
    - Use only task types and properties explicitly defined in the fetched schema. Never invent or guess types or property names.
    - Property keys must be unique within each task or block.
    
    **Structural preservation**
    - Always preserve root-level `id` and `namespace` if provided.
    - For modification requests, touch only the relevant part. Do not restructure or rewrite unrelated sections.
    - Avoid duplicating existing intent (e.g., replace a log message rather than adding a second one).
    
    **Triggers**
    - Include at least one trigger if execution should start based on an event or schedule.
    - Do NOT add a `Schedule` trigger unless a regular occurrence is explicitly requested.
    - Trigger outputs are accessed via `{{ trigger.outputName }}`; only use variables defined in the trigger's declared outputs.
    
    **Looping**
    - Use `ForEach` for repeated actions over a collection.
    - Use `LoopUntil` for condition-based looping.
    
    **Flow outputs**
    - Only include flow-level `outputs` if the user explicitly requests returning a value from the execution.
    
    **State tracking between executions**
    - For state-change detection, use KV tasks (`io.kestra.plugin.core.kv.Set` / `io.kestra.plugin.core.kv.Get`) to store and compare state across executions.
    
    **JDBC plugin**
    - Always set `fetchType: STORE` when using JDBC tasks.
    
    **Date manipulation in Pebble**
    - Use `dateAdd` and `date` filters for date arithmetic.
    - Apply `| number` before numeric comparisons.
    
    **Credentials and secrets**
    - Never embed secrets or hardcoded credentials.
    - Use flow `inputs` of type `SECRET` or Pebble expressions (e.g., `{{ secret('MY_SECRET') }}`).
    
    **APIs and connectivity**
    - Prefer public/unauthenticated APIs unless the user specifies otherwise.
    - Never assume a local port; use remote URLs.
    
    **Quoting**
    - Prefer double quotes; use single quotes inside double-quoted strings when needed.
    
    **Error handling**
    - If the request cannot be fulfilled using only schema-defined types and properties, output exactly:
      ```
      I cannot generate a valid Kestra Flow YAML for this request based on the available schema.
      ```
    
    ## Output format
    
    - **Raw YAML only** — no prose, no markdown fences, no explanations outside the YAML.
    - Use `#` comments at the top of the output for any caveats, assumptions, or warnings.
    - The output must be ready to paste directly into the Kestra UI or deploy via `kestractl`.
    
    ## Example prompts
    
    - "Write a Kestra flow that fetches a public API every hour and stores the result in KV store."
    - "Add a Slack notification task to this existing flow when any task fails."
    - "Generate a flow in namespace `prod.data` that reads from a Postgres table and writes the result to S3."
    - "Debug this flow YAML — it has a trigger variable reference that doesn't exist."
    


  memory-defrag-skill.md: |
    ---
    name: memory-defrag
    description: "Defragment and reorganize agent memory files: split bloated files, merge duplicates, remove stale information, and restructure the memory hierarchy. Use when memory files have grown unwieldy, contain redundancies, or need reorganization. Run periodically (weekly) or on demand."
    ---
    
    # Memory Defrag
    
    Reorganize memory files for clarity, efficiency, and relevance. Like filesystem defragmentation but for knowledge.
    
    ## When to Run
    
    - **Periodic**: Weekly or biweekly via cron (recommended)
    - **On demand**: User asks to clean up, reorganize, or defrag memory
    - **Threshold**: When MEMORY.md exceeds ~500 lines or daily notes accumulate without consolidation
    
    ## Process
    
    ### 1. Audit Current State
    
    Inventory all memory files:
    ```
    MEMORY.md           — long-term memory
    memory/             — daily notes, tasks, topical files
    memory/tasks/       — active and completed tasks
    ```
    
    For each file, note: line count, last modified, topic coverage, staleness.
    
    ### 2. Identify Problems
    
    Look for these common issues:
    
    | Problem | Signal | Fix |
    |---------|--------|-----|
    | **Bloated file** | >300 lines, covers many topics | Split into focused files |
    | **Duplicate info** | Same fact in multiple places | Consolidate to one location |
    | **Stale entries** | References to completed work, old dates, resolved issues | Remove or archive |
    | **Orphan files** | Files in memory/ never referenced or updated | Review, merge, or remove |
    | **Inconsistencies** | Contradictory information across files | Resolve to ground truth |
    | **Poor organization** | Related info scattered across files | Restructure by topic |
    | **Recursive nesting** | `memory/memory/memory/...` directories | Delete nested dirs (indexer bug artifact) |
    
    ### 3. Plan Changes
    
    Before making edits, write a brief plan:
    ```markdown
    ## Defrag Plan
    - [ ] Split MEMORY.md "Key People" section → memory/people.md
    - [ ] Remove completed tasks older than 30 days from memory/tasks/
    - [ ] Merge memory/bm-marketing-ideas.md into memory/competitive/
    - [ ] Update stale project status entries in MEMORY.md
    ```
    
    ### 4. Execute
    
    Apply changes one at a time:
    - **Split**: Extract sections from large files into focused topical files
    - **Merge**: Combine related small files into coherent documents
    - **Prune**: Remove information that is no longer relevant or accurate
    - **Restructure**: Move files to appropriate directories, rename for clarity
    - **Update**: Fix outdated facts, dates, statuses
    
    ### 5. Verify & Log
    
    After changes:
    - Verify no information was lost (compare before/after)
    - Update any cross-references between files
    - Log what was done in today's daily note:
    
    ```markdown
    ## Memory Defrag (HH:MM)
    - Files reviewed: N
    - Split: [list]
    - Merged: [list]
    - Pruned: [list]
    - Net result: X files, Y total lines (was Z lines)
    ```
    
    ## Guidelines
    
    - **Preserve raw daily notes.** Don't delete or modify `memory/YYYY-MM-DD.md` files — they're the audit trail.
    - **Target 15-25 focused files.** Too few means bloated files; too many means fragmentation. Aim for the sweet spot.
    - **File names should be scannable.** Use descriptive names: `people.md`, `project-status.md`, `competitive-landscape.md` — not `notes-2.md`.
    - **Don't over-organize.** One level of directories is usually enough. `memory/tasks/` and `memory/competitive/` are fine; `memory/work/projects/active/basic-memory/notes/` is not.
    - **Completed tasks**: Tasks with `status: done` older than 14 days can be removed. Their insights should already be in MEMORY.md via reflection.
    - **Ask before destructive changes.** If uncertain whether information is still relevant, keep it with a `(review needed)` tag rather than deleting.
    


  memory-ingest-skill.md: |
    ---
    name: memory-ingest
    description: "Process unstructured external input (meeting transcripts, conversation logs, pasted documents) into structured Basic Memory entities. Extracts entities, searches for existing matches, proposes new entities with approval, creates notes with observations and relations, and captures action items."
    ---
    
    # Memory Ingest
    
    Turn raw, unstructured input into structured Basic Memory entities. Meeting transcripts, conversation logs, pasted documents, email threads — anything with information worth preserving gets parsed, cross-referenced against existing knowledge, and written as proper notes.
    
    ## When to Use
    
    - User pastes a meeting transcript or conversation log
    - User says "process these notes" or "add this to Basic Memory"
    - User pastes a document, article, or email for knowledge extraction
    - Any time raw external text needs to become structured knowledge
    
    ## Workflow Overview
    
    ```
    1. Parse raw input           → identify structure, extract key info
    2. Extract entities          → people, orgs, topics, action items
    3. Search existing entities  → multi-variation queries
    4. Research new entities     → optional web research (see memory-research)
    5. Present entity proposal   → get approval before creating
    6. Create source note        → verbatim content + observations + relations
    7. Create approved entities  → structured notes for each new entity
    8. Extract action items      → follow-ups and commitments
    ```
    
    ## Step 1: Parse Raw Input
    
    Read the pasted content and identify its structure:
    
    - **Format**: Meeting transcript, email thread, conversation log, article, freeform notes
    - **Date**: When this happened (extract from content or ask)
    - **Participants**: Who was involved (names, roles, organizations)
    - **Sections**: Any existing structure (headings, speaker labels, timestamps)
    
    Don't rewrite or summarize the source content. Preserve it verbatim in the note — you'll add structured observations alongside it.
    
    ## Step 2: Extract Entities
    
    Scan the content for entities worth tracking in the knowledge graph:
    
    | Entity Type | Signals |
    |-------------|---------|
    | **Person** | Names with roles, titles, or affiliations mentioned |
    | **Organization** | Company names, agencies, institutions |
    | **Topic/Concept** | Technical domains, methodologies, standards discussed substantively |
    | **Action Item** | Commitments, deadlines, "I'll do X by Y" statements |
    
    **Infer type from context.** If someone is introduced as "CTO of Acme Corp", that's both a Person and an Organization entity. If a technology is discussed in depth, it might warrant a Concept entity.
    
    **Exclude noise.** Not every name mentioned is worth an entity. Filter for:
    - People with substantive roles or interactions (not passing mentions)
    - Organizations discussed in business/technical context
    - Topics with enough detail to warrant their own note
    
    ## Step 3: Search Existing Entities
    
    For each extracted entity, search Basic Memory with multiple query variations:
    
    ```python
    # Person — try full name, last name
    search_notes(query="Sarah Chen")
    search_notes(query="Chen")
    
    # Organization — try full name, abbreviation, acronym
    search_notes(query="National Renewable Energy Laboratory")
    search_notes(query="NREL")
    
    # Topic — try the full term and keywords
    search_notes(query="edge computing")
    search_notes(query="edge inference")
    ```
    
    Classify each entity as:
    - **Existing** — found in Basic Memory. Will link to it with `[[wiki-link]]`.
    - **Proposed** — not found. Will propose creation pending approval.
    
    ## Step 4: Research New Entities (Optional)
    
    For proposed entities where more context would be valuable, do a brief web search (2-3 queries max per entity):
    
    - **Organizations**: What they do, size, public/private, key products
    - **People**: Current role, background, expertise
    - **Topics**: Brief definition, relevance
    
    Use hedging language ("appears to be", "estimated", "based on public information"). Never fabricate details.
    
    This step is optional — skip it if the source material provides enough context, or if the user is in a hurry. See the **memory-research** skill for deeper research workflows.
    
    ## Step 5: Present Entity Proposal
    
    Before creating anything, present what you found and what you'd like to create:
    
    ```
    Entities found in Basic Memory:
      - [[Sarah Chen]] (Person — existing)
      - [[Acme Corp]] (Organization — existing)
    
    Proposed new entities:
      - Jordan Rivera (Person — VP Engineering at NovaTech, mentioned as project lead)
      - NovaTech (Organization — SaaS platform, Series B, discussed as integration partner)
      - Federated Learning (Concept — core technical topic of the discussion)
    
    Approve all / select individually / skip entity creation?
    ```
    
    Include enough context with each proposed entity for the user to make a quick decision.
    
    ## Step 6: Create the Source Note
    
    Create the primary note for the ingested content. This is the "record of what happened" — it preserves the raw material and adds structured metadata.
    
    ### Meeting / Conversation Note
    
    ```python
    write_note(
      title="NovaTech Meeting - Jordan Rivera - Feb 22, 2026",
      directory="meetings/2026",
      note_type="meeting",
      tags=["meeting", "novatech", "federated-learning"],
      metadata={"date": "2026-02-22"},
      content="""
    # NovaTech Meeting - Jordan Rivera - Feb 22, 2026
    
    Brief one-sentence summary of what this meeting was about.
    
    ## Transcript
    [Preserve all source content verbatim — do not summarize or rewrite]
    
    ## Observations
    - [opportunity] NovaTech interested in integration partnership
    - [insight] Their platform handles 10K concurrent sessions, relevant to our scale needs
    - [next_step] Send technical spec document by Friday
    - [sentiment] Strong enthusiasm from their engineering team
    - [decision] Agreed to start with a proof-of-concept integration
    
    ## Relations
    - attended [[Jordan Rivera]]
    - with [[NovaTech]]
    - discussed [[Federated Learning]]
    - follow_up [[Send NovaTech Technical Spec]]
    """
    )
    ```
    
    ### Document / Article Note
    
    ```python
    write_note(
      title="Edge Computing Architecture Whitepaper",
      directory="references",
      note_type="reference",
      tags=["edge-computing", "architecture", "reference"],
      metadata={"source": "https://example.com/whitepaper.pdf", "date_ingested": "2026-02-22"},
      content="""
    # Edge Computing Architecture Whitepaper
    
    ## Source Content
    [Preserve relevant content — for long documents, include key sections rather than the entire text]
    
    ## Observations
    - [key_finding] Latency drops 40% with edge inference vs cloud-only
    - [technique] Model sharding across heterogeneous edge nodes
    - [limitation] Requires minimum 8GB RAM per edge node
    
    ## Relations
    - relates_to [[Edge Computing]]
    - relates_to [[Model Optimization]]
    """
    )
    ```
    
    ### Observation Categories
    
    Use categories that capture the nature of the information. Common categories for ingested content:
    
    | Category | Use For |
    |----------|---------|
    `opportunity` | Business or collaboration opportunities identified |
    `decision` | Decisions made or agreed upon |
    `insight` | Non-obvious understanding gained |
    `next_step` | Concrete action items or follow-ups |
    `sentiment` | Enthusiasm, concerns, hesitations expressed |
    `risk` | Risks or concerns identified |
    `requirement` | Requirements or constraints discovered |
    `key_finding` | Important facts from reference material |
    `technique` | Methods, approaches, or patterns described |
    `context` | Background information that may be useful later |
    
    Invent categories as needed — these are suggestions, not a fixed list.
    
    ## Step 7: Create Approved Entities
    
    For each entity the user approved, create a structured note. Match the entity type to an appropriate template.
    
    ### Person
    
    ```python
    write_note(
      title="Jordan Rivera",
      directory="people",
      note_type="person",
      tags=["person", "novatech", "engineering"],
      content="""
    # Jordan Rivera
    
    ## Overview
    VP of Engineering at NovaTech. Met during integration partnership discussion.
    
    ## Background
    [Role, expertise, context from meeting + any web research]
    
    ## Observations
    - [role] VP Engineering at NovaTech
    - [expertise] Distributed systems, federated learning
    - [met] 2026-02-22 during integration discussion
    
    ## Relations
    - works_at [[NovaTech]]
    - discussed_in [[NovaTech Meeting - Jordan Rivera - Feb 22, 2026]]
    """
    )
    ```
    
    ### Organization
    
    ```python
    write_note(
      title="NovaTech",
      directory="organizations",
      note_type="organization",
      tags=["organization", "saas", "integration-partner"],
      content="""
    # NovaTech
    
    ## Overview
    SaaS platform company. Series B stage.
    [Additional context from meeting + web research]
    
    ## Products & Services
    [What they offer, if discussed or researched]
    
    ## Observations
    - [stage] Series B, ~200 employees
    - [relevance] Potential integration partner for our platform
    - [first_contact] 2026-02-22
    
    ## Relations
    - employs [[Jordan Rivera]]
    - discussed_in [[NovaTech Meeting - Jordan Rivera - Feb 22, 2026]]
    """
    )
    ```
    
    ### Concept / Topic
    
    ```python
    write_note(
      title="Federated Learning",
      directory="concepts",
      note_type="concept",
      tags=["concept", "machine-learning", "distributed-systems"],
      content="""
    # Federated Learning
    
    ## Overview
    [Brief description of the concept from the discussion context]
    
    ## Observations
    - [definition] Machine learning approach where models train across decentralized data sources
    - [relevance] Core technique discussed in NovaTech integration
    
    ## Relations
    - discussed_in [[NovaTech Meeting - Jordan Rivera - Feb 22, 2026]]
    """
    )
    ```
    
    Adapt templates to your domain. The key elements are: type and tags as parameters, an overview section, observations with categories, and relations linking back to the source.
    
    ## Step 8: Extract Action Items
    
    Review the source content for commitments and follow-ups:
    
    ```
    Action Items:
      - Send NovaTech technical spec document by Friday (your commitment)
      - Jordan will share their API documentation by next week (their commitment)
    
    Follow-Up Reminders:
      - 1 week: Check if Jordan sent API docs
      - 2 weeks: Schedule follow-up call to discuss POC scope
    ```
    
    If using the **memory-tasks** skill, create Task notes for your action items. Otherwise, capture them as observations in the source note.
    
    ## Guidelines
    
    - **Preserve source content verbatim.** The original text is the ground truth. Structure and observations are your interpretation layered on top.
    - **Search before creating.** Always check if entities already exist (see memory-notes search-before-create pattern). Update existing entities with new information rather than creating duplicates.
    - **Get approval for new entities.** Present proposed entities and let the user decide which to create. Don't silently populate the knowledge graph.
    - **Infer, don't interrogate.** Extract entity types and relationships from context. Only ask the user when genuinely ambiguous.
    - **Be selective about entities.** Not every name mentioned deserves its own note. Focus on entities the user will want to reference again.
    - **Use hedging for researched info.** Web research supplements — don't present it as fact. "Appears to be", "estimated", "based on public information".
    - **Link everything back.** Every created entity should relate back to the source note. The source note should link to all entities discussed.
    - **Prose and observations together.** Notes work best with both narrative context and structured observations. Prose gives meaning and tells the story; observations make individual facts searchable. Use the body for context, then distill key facts into categorized observations.
    


  memory-lifecycle-skill.md: |
    ---
    name: memory-lifecycle
    description: "Manage entity status transitions in Basic Memory: archive completed work, move notes between status folders, update frontmatter, and handle edge cases. Use when marking items complete, archiving old entities, or managing any folder-based status workflow."
    ---
    
    # Memory Lifecycle
    
    Manage how entities move through status stages in Basic Memory. The core principle: **archive, never delete.** Completed work is valuable context — move it out of the active view, but keep it in the knowledge graph.
    
    ## When to Use
    
    - User says something is "done", "finished", "completed", "submitted", "missed", or "cancelled"
    - Moving entities between status folders (active → archive, pipeline → active, etc.)
    - Reverting a mistaken completion
    - Periodic cleanup of stale active items
    
    ## Core Principle: Archive, Never Delete
    
    Deleting a note removes it from the knowledge graph — all its observations, relations, and history disappear. Archiving preserves everything while signaling the entity is no longer active.
    
    ```
    # Good — entity stays in the knowledge graph
    move_note → active/ to archive/
    
    # Bad — knowledge is lost
    delete_note
    ```
    
    The only exception: notes created by mistake (typos, true duplicates) can be deleted.
    
    ## Folder Conventions
    
    Organize entities by status using folders. The exact folder names depend on your domain, but follow a consistent pattern:
    
    ```
    entities/
      active/          # Currently relevant, in-progress
      archive/         # Completed, no longer active, but worth keeping
      pipeline/        # Future items, not yet started
    ```
    
    For tasks specifically:
    
    ```
    tasks/
      active/          # Work in progress
      completed/       # Finished work
    ```
    
    For any entity type with a clear lifecycle:
    
    ```
    [type]/
      active/          # Current
      [end-state]/     # Whatever "done" means for this type
    ```
    
    Pick folder names that match your domain. The pattern matters more than the specific names.
    
    ## Status Detection
    
    When the user mentions completion or status change, extract the intent:
    
    | Signal | Status | Action |
    |--------|--------|--------|
    | "finished", "done", "completed", "shipped" | Complete | Move to archive/completed folder |
    | "submitted", "sent", "delivered" | Complete | Move to archive/completed folder |
    | "missed", "passed", "skipped", "expired" | Missed | Move to archive or missed folder |
    | "cancelled", "abandoned", "killed" | Cancelled | Move to archive folder |
    | "paused", "on hold", "deferred" | Paused | Update frontmatter status, keep in place |
    | "restarting", "reopening", "reviving" | Reactivate | Move back to active folder |
    
    ## Workflow
    
    ### 1. Find the Entity
    
    Search Basic Memory with multiple variations to locate the entity:
    
    ```python
    search_notes(query="quarterly report")
    search_notes(query="Q1 report")
    ```
    
    If multiple matches come back, present options and ask which one.
    
    If no match is found, ask for clarification — don't guess.
    
    ### 2. Move the File
    
    Use `move_note` to relocate the entity to the appropriate status folder:
    
    ```python
    move_note(
      identifier="tasks/active/quarterly-report",
      destination_path="tasks/completed/quarterly-report.md"
    )
    ```
    
    The permalink stays the same, so all existing `[[wiki-links]]` and `memory://` URLs continue to resolve.
    
    ### 3. Update Frontmatter
    
    After moving, update the status in frontmatter to match:
    
    ```python
    edit_note(
      identifier="quarterly-report",
      operation="find_replace",
      find_text="status: active",
      content="status: completed"
    )
    ```
    
    If there's a completion date field, set it:
    
    ```python
    edit_note(
      identifier="quarterly-report",
      operation="find_replace",
      find_text="completed:",
      content="completed: 2026-02-22"
    )
    ```
    
    ### 4. Confirm
    
    Report what was done concisely:
    
    ```
    Marked complete: Quarterly Report
      Moved to: tasks/completed/quarterly-report.md
      Status: completed
    ```
    
    ## Edge Cases
    
    ### Already Archived
    
    If the entity is already in an archive/completed folder, notify the user:
    
    > "Quarterly Report is already in tasks/completed/. Want me to update anything on it?"
    
    ### Partial Completion
    
    Sometimes only part of an entity is done. Don't move it — instead, update observations or status notes within the entity to reflect partial progress.
    
    ### Revert / Reactivate
    
    If something was archived by mistake, move it back:
    
    ```python
    move_note(
      identifier="tasks/completed/quarterly-report",
      destination_path="tasks/active/quarterly-report.md"
    )
    
    edit_note(
      identifier="quarterly-report",
      operation="find_replace",
      find_text="status: completed",
      content="status: active"
    )
    ```
    
    ### Status Without Movement
    
    Some status changes don't require a folder move — "paused" or "blocked" items often stay in `active/` with just a frontmatter update. Reserve folder moves for terminal or major state transitions.
    
    ## Relationship to Other Skills
    
    - **memory-tasks**: Tasks are a specific lifecycle case. This skill covers the general pattern; memory-tasks covers task-specific fields (steps, current_step, context).
    - **memory-notes**: Use search-before-create (from memory-notes) to find the entity before transitioning it.
    - **memory-defrag**: Periodic defrag can identify stale active items that should be archived.
    
    ## Guidelines
    
    - **Archive, never delete.** The knowledge graph benefits from historical context.
    - **Move first, then update frontmatter.** This order ensures the file is in the right place even if the edit step fails.
    - **Permalinks survive moves.** Links to the entity keep working after a `move_note`.
    - **Be concise in confirmations.** The user knows their system — just report what changed.
    - **Ask when ambiguous.** If multiple entities match or the target folder isn't clear, ask rather than guess.
    - **Batch operations are fine.** If the user says "archive all completed tasks", find them all, confirm the list, then move them in sequence.
    


  memory-metadata-search-skill.md: |
    ---
    name: memory-metadata-search
    description: "Structured metadata search for Basic Memory: query notes by custom frontmatter fields using equality, range, array, and nested filters. Use when finding notes by status, priority, confidence, or any custom YAML field rather than free-text content."
    ---
    
    # Memory Metadata Search
    
    Find notes by their structured frontmatter fields instead of (or in addition to) free-text content. Any custom YAML key in a note's frontmatter beyond the standard set (`title`, `type`, `tags`, `permalink`, `schema`) is automatically indexed as `entity_metadata` and becomes queryable.
    
    ## When to Use
    
    - **Filtering by status or priority** — find all notes with `status: draft` or `priority: high`
    - **Querying custom fields** — any frontmatter key you invent is searchable
    - **Range queries** — find notes with `confidence > 0.7` or `score between 0.3 and 0.8`
    - **Combining text + metadata** — narrow a text search with structured constraints
    - **Tag-based filtering** — find notes tagged with specific frontmatter tags
    - **Schema-aware queries** — filter by nested schema fields using dot notation
    
    ## The Tool
    
    All metadata searching uses `search_notes`. Pass filters via `metadata_filters`, or use the `tags` and `status` convenience shortcuts. Omit `query` (or pass `None`) for filter-only searches.
    
    ## Filter Syntax
    
    Filters are a JSON dictionary. Each key targets a frontmatter field; the value specifies the match condition. Multiple keys combine with **AND** logic.
    
    ### Equality
    
    ```json
    {"status": "active"}
    ```
    
    ### Array Contains (all listed values must be present)
    
    ```json
    {"tags": ["security", "oauth"]}
    ```
    
    ### `$in` (match any value in list)
    
    ```json
    {"priority": {"$in": ["high", "critical"]}}
    ```
    
    ### Comparisons (`$gt`, `$gte`, `$lt`, `$lte`)
    
    ```json
    {"confidence": {"$gt": 0.7}}
    ```
    
    Numeric values use numeric comparison; strings use lexicographic comparison.
    
    ### `$between` (inclusive range)
    
    ```json
    {"score": {"$between": [0.3, 0.8]}}
    ```
    
    ### Nested Access (dot notation)
    
    ```json
    {"schema.version": "2"}
    ```
    
    ### Quick Reference
    
    | Operator | Syntax | Example |
    |----------|--------|---------|
    | Equality | `{"field": "value"}` | `{"status": "active"}` |
    | Array contains | `{"field": ["a", "b"]}` | `{"tags": ["security", "oauth"]}` |
    | `$in` | `{"field": {"$in": [...]}}` | `{"priority": {"$in": ["high", "critical"]}}` |
    | `$gt` / `$gte` | `{"field": {"$gt": N}}` | `{"confidence": {"$gt": 0.7}}` |
    | `$lt` / `$lte` | `{"field": {"$lt": N}}` | `{"score": {"$lt": 0.5}}` |
    | `$between` | `{"field": {"$between": [lo, hi]}}` | `{"score": {"$between": [0.3, 0.8]}}` |
    | Nested | `{"a.b": "value"}` | `{"schema.version": "2"}` |
    
    **Rules:**
    - Keys must match `[A-Za-z0-9_-]+` (dots separate nesting levels)
    - Operator dicts must contain exactly one operator
    - `$in` and array-contains require non-empty lists
    - `$between` requires exactly `[min, max]`
    
    > **Warning:** Operators MUST include the `$` prefix — write `$gte`, not `gte`. Without the prefix the filter is treated as an exact-match key and will silently return no results. Correct: `{"confidence": {"$gte": 0.7}}`. Wrong: `{"confidence": {"gte": 0.7}}`.
    
    ## Using `search_notes` with Metadata
    
    Pass `metadata_filters`, `tags`, or `status` to `search_notes`. Omit `query` for filter-only searches, or combine text and filters together.
    
    ```python
    # Filter-only — find all notes with a given status
    search_notes(metadata_filters={"status": "in-progress"})
    
    # Filter-only — high-priority specs in a specific project
    search_notes(
        metadata_filters={"type": "spec", "priority": {"$in": ["high", "critical"]}},
        project="research",
        page_size=10,
    )
    
    # Filter-only — notes with confidence above a threshold
    search_notes(metadata_filters={"confidence": {"$gt": 0.7}})
    
    # Convenience shortcuts for tags and status
    search_notes(status="active")
    search_notes(tags=["security", "oauth"])
    
    # Text search narrowed by metadata
    search_notes("authentication", metadata_filters={"status": "draft"})
    
    # Mix text, tag shortcut, and advanced filter
    search_notes(
        "oauth flow",
        tags=["security"],
        metadata_filters={"confidence": {"$gt": 0.7}},
    )
    ```
    
    **Merging rules:** `tags` and `status` are convenience shortcuts merged into `metadata_filters` via `setdefault`. If the same key exists in `metadata_filters`, the explicit filter wins.
    
    ## Tag Search Shorthand
    
    The `tag:` prefix in a query converts to a tag filter automatically:
    
    ```python
    # These are equivalent:
    search_notes("tag:tier1")
    search_notes("", tags=["tier1"])
    
    # Multiple tags (comma or space separated) — all must match:
    search_notes("tag:tier1,alpha")
    ```
    
    ## Example: Custom Frontmatter in Practice
    
    A note with custom fields:
    
    ```markdown
    ---
    title: Auth Design
    type: spec
    tags: [security, oauth]
    status: in-progress
    priority: high
    confidence: 0.85
    ---
    
    # Auth Design
    
    ## Observations
    - [decision] Use OAuth 2.1 with PKCE for all client types #security
    - [requirement] Token refresh must be transparent to the user
    
    ## Relations
    - implements [[Security Requirements]]
    ```
    
    Queries that find it:
    
    ```python
    # By status and type
    search_notes(metadata_filters={"status": "in-progress", "type": "spec"})
    
    # By numeric threshold
    search_notes(metadata_filters={"confidence": {"$gt": 0.7}})
    
    # By priority set
    search_notes(metadata_filters={"priority": {"$in": ["high", "critical"]}})
    
    # By tag shorthand
    search_notes("tag:security")
    
    # Combined text + metadata
    search_notes("OAuth", metadata_filters={"status": "in-progress"})
    ```
    
    ## Guidelines
    
    - **Use metadata search for structured queries.** If you're looking for notes by a known field value (status, priority, type), metadata filters are more precise than text search.
    - **Use text search for content queries.** If you're looking for notes *about* something, text search is better. Combine both when you need precision.
    - **Custom fields are free.** Any YAML key you put in frontmatter becomes queryable — no schema or configuration required.
    - **Multiple filters are AND.** `{"status": "active", "priority": "high"}` requires both conditions.
    - **Omit `query` for filter-only searches.** `search_notes(metadata_filters={"status": "active"})` works without a text query.
    - **Dot notation for nesting.** Access nested YAML structures with dots: `{"schema.version": "2"}` queries the `version` key inside a `schema` object.
    - **Tags shortcut is convenient but limited.** `tags` and `status` are sugar for common fields. For anything else, use `metadata_filters` directly.
    


  memory-notes-skill.md: |
    ---
    name: memory-notes
    description: "How to write well-structured Basic Memory notes: frontmatter, observations with semantic categories, relations with wiki-links, and best practices for building a rich knowledge graph. Use when creating or improving notes."
    ---
    
    # Memory Notes
    
    Write well-structured notes that Basic Memory can parse into a searchable knowledge graph. Every note is a markdown file with three key sections: frontmatter, observations, and relations.
    
    ## Note Anatomy
    
    ```markdown
    ---
    title: API Design Decisions
    tags: [api, architecture, decisions]
    ---
    
    # API Design Decisions
    
    The API team evaluated multiple approaches for the public API during Q1. After
    prototyping both REST and GraphQL, the team chose REST due to broader ecosystem
    support and simpler caching semantics. This note captures the key decisions and
    their rationale, along with open questions still to resolve.
    
    ## Observations
    - [decision] Use REST over GraphQL for simplicity #api
    - [requirement] Must support versioning from day one
    - [risk] Rate limiting needed for public endpoints
    
    ## Relations
    - implements [[API Specification]]
    - depends_on [[Authentication System]]
    - relates_to [[Performance Requirements]]
    ```
    
    ### Frontmatter
    
    Every note starts with YAML frontmatter:
    
    ```yaml
    ---
    title: Note Title          # required — becomes the entity name in the knowledge graph
    tags: [tag1, tag2]         # optional — for organization and filtering
    type: note                 # optional — defaults to "note", use custom types with schemas
    permalink: custom-path     # optional — auto-generated from title if omitted
    ---
    ```
    
    - The `title` must match the `# Heading` in the body
    - Tags are searchable and help with discovery
    - Custom `type` values (Task, Meeting, Person, etc.) work with the schema system. See the **memory-schema** skill for defining schemas, validating notes against them, and detecting drift.
    - The `permalink` is auto-generated from the `title` and `directory`. For example, title "API Design Decisions" in directory "specs" produces permalink `specs/api-design-decisions` and memory URL `memory://specs/api-design-decisions`. If no directory is specified, the permalink is just the kebab-cased title. Permalinks stay stable across file moves. You rarely need to set one manually.
    
    > **Note:** When using `write_note`, you don't write frontmatter yourself. The `title`, `tags`, `note_type`, and `metadata` are separate parameters — Basic Memory generates the frontmatter automatically. Your `content` parameter is just the markdown body starting with `# Heading`.
    
    ### Body / Context
    
    Free-form markdown between the heading and the Observations section. This is the heart of the note — write generously here:
    - Background, motivation, and history
    - Detailed explanation of what happened and why it matters
    - Analysis, reasoning, and trade-offs considered
    - Context that someone (or an AI) needs to understand this note later
    
    Write complete, substantive prose. Basic Memory's search retrieves relevant chunks from note bodies, so longer, richer context makes notes more discoverable and more useful when found. Don't reduce everything to bullet points — tell the story.
    
    ## Observations
    
    Observations are categorized facts — the atomic units of knowledge. Each one becomes a searchable entity in the knowledge graph.
    
    ### Syntax
    
    ```
    - [category] Content of the observation #optional-tag
    ```
    
    - **Square brackets** define the semantic category
    - **Content** is the fact, decision, insight, or note
    - **Hash tags** (optional) add extra metadata for filtering
    
    ### Categories Are Arbitrary
    
    The category in brackets is free-form — use whatever label makes sense for the observation. There is no fixed list. The only rule is the `[category] content` syntax. Consistency within a project helps searchability, but invent categories freely.
    
    A few examples to illustrate the range:
    
    ```
    - [decision] Use PostgreSQL for primary data store
    - [risk] Third-party API has no SLA guarantee
    - [technique] Exponential backoff for retry logic #resilience
    - [question] Should we support multi-tenancy at the DB level?
    - [preference] Use Bun over Node for new projects
    - [lesson] Always validate webhook signatures server-side
    - [status] active
    - [flavor] Ethiopian beans work best with lighter roasts
    ```
    
    ### Observation Tips
    
    - **One fact per observation.** Don't pack multiple ideas into one line.
    - **Be specific.** `[decision] Use JWT` is less useful than `[decision] Use JWT with 15-minute expiry for API auth`.
    - **Use tags for cross-cutting concerns.** `[risk] Rate limiting needed #api #security` makes this findable under both topics.
    - **Categories are queryable.** `search_notes("[decision]")` finds all decisions across your knowledge base.
    
    ## Relations
    
    Relations create edges in the knowledge graph, linking notes to each other. They're how you build structure beyond individual notes.
    
    ### Syntax
    
    ```
    - relation_type [[Target Note Title]]
    ```
    
    - **relation_type** is a descriptive verb or phrase (snake_case by convention)
    - **Double brackets** `[[...]]` identify the target note by title or permalink
    - Relations are directional: this note → target note
    
    ### Relation Types
    
    | Type | Purpose | Example |
    |------|---------|---------|
    | `implements` | One thing implements another | `- implements [[Auth Spec]]` |
    | `requires` | Dependencies | `- requires [[Database Setup]]` |
    | `relates_to` | General connection | `- relates_to [[Performance Notes]]` |
    | `part_of` | Hierarchy/composition | `- part_of [[Backend Architecture]]` |
    | `extends` | Enhancement or elaboration | `- extends [[Base Config]]` |
    | `pairs_with` | Things that work together | `- pairs_with [[Frontend Client]]` |
    | `inspired_by` | Source material | `- inspired_by [[CRDT Research Paper]]` |
    | `replaces` | Supersedes another note | `- replaces [[Old Auth Design]]` |
    | `depends_on` | Runtime/build dependency | `- depends_on [[MCP SDK]]` |
    | `contrasts_with` | Alternative approaches | `- contrasts_with [[GraphQL Approach]]` |
    
    ### Inline Relations
    
    Wiki-links anywhere in the note body — not just the Relations section — also create graph edges:
    
    ```markdown
    We evaluated [[GraphQL Approach]] but decided against it because
    the team has more experience with REST. See [[API Specification]]
    for the full contract.
    ```
    
    These create `references` relations automatically. Use the Relations section for explicit, typed relationships; use inline links for natural prose references.
    
    ### Relation Tips
    
    - **Link liberally.** Relations are what turn isolated notes into a knowledge graph. When in doubt, add the link.
    - **Create target notes if they don't exist yet.** `[[Future Topic]]` is valid — BM will resolve it when that note is created.
    - **Use `build_context` to traverse.** `build_context(url="memory://note-title")` follows relations to gather connected knowledge.
    - **Custom relation types are fine.** `taught_by`, `blocks`, `tested_in` — use whatever is descriptive.
    
    ## Memory URLs
    
    Every note is addressable via a `memory://` URL, built from its permalink. These URLs are how you navigate the knowledge graph programmatically.
    
    ### URL Patterns
    
    ```
    memory://api-design-decisions          # by permalink (title → kebab-case)
    memory://docs/authentication           # by file path
    memory://docs/authentication.md        # with extension (also works)
    memory://auth*                         # wildcard prefix
    memory://docs/*                        # wildcard suffix
    memory://project/*/requirements        # path wildcards
    ```
    
    ### Project-Scoped URLs
    
    In multi-project setups, prefix with the project name:
    
    ```
    memory://main/specs/api-design         # "main" project, "specs/api-design" path
    memory://research/papers/crdt          # "research" project
    ```
    
    The first path segment is matched against known project names. If it matches, it's used as the project scope. Otherwise the URL resolves in the default project.
    
    ### Using Memory URLs
    
    Memory URLs work with `build_context` to assemble related knowledge by traversing relations:
    
    ```python
    # Get a note and its connected context
    build_context(url="memory://api-design-decisions")
    
    # Wildcard — gather all docs
    build_context(url="memory://docs/*")
    
    # Direct read by permalink
    read_note(identifier="memory://api-design-decisions")
    ```
    
    ## Before Creating a Note
    
    Always search Basic Memory before creating a new note. Duplicates fragment your knowledge graph — updating an existing note is almost always better than creating a second one.
    
    ### Search with Multiple Variations
    
    A single search often misses. Try the full name, abbreviations, acronyms, and keywords:
    
    ```python
    # Searching for an entity that might already exist
    search_notes(query="Kubernetes Migration")
    search_notes(query="k8s migration")
    search_notes(query="container migration")
    ```
    
    For people, try full name and last name. For organizations, try the full name and common abbreviations.
    
    ### Decision Tree
    
    - **Entity exists** → Update it with `edit_note` (append observations, add relations, find-and-replace outdated info)
    - **Entity doesn't exist** → Create it with `write_note`
    - **Unsure if it's the same entity** → Read the existing note first, then decide
    
    ### Granular Updates with `edit_note`
    
    When a note already exists, make targeted edits instead of rewriting the whole file:
    
    ```python
    # Append a new observation to an existing note
    edit_note(
      identifier="API Design Decisions",
      operation="append",
      section="Observations",
      content="- [decision] Switched to OpenAPI 3.1 for spec generation #api"
    )
    
    # Fix outdated information
    edit_note(
      identifier="API Design Decisions",
      operation="find_replace",
      find_text="- [status] draft",
      content="- [status] approved"
    )
    
    # Add a new relation
    edit_note(
      identifier="API Design Decisions",
      operation="append",
      section="Relations",
      content="- depends_on [[Rate Limiter]]"
    )
    ```
    
    This preserves existing content and keeps the edit history clean.
    
    ## Writing Notes with Tools
    
    ### Creating a Note
    
    ```python
    write_note(
      title="API Design Decisions",
      directory="architecture",
      tags=["api", "architecture"],
      content="""# API Design Decisions
    
    The API team evaluated REST and GraphQL during Q1 planning. After prototyping
    both approaches, we chose REST for the public API — broader ecosystem support,
    simpler caching with HTTP semantics, and a lower learning curve for external
    consumers. GraphQL remains an option for internal services where query
    flexibility matters more.
    
    ## Observations
    - [decision] Use REST for public API #api
    - [requirement] Support API versioning from v1
    
    ## Relations
    - implements [[API Specification]]
    - relates_to [[Backend Architecture]]"""
    )
    ```
    
    Basic Memory auto-generates frontmatter (including the permalink and memory URL) from the parameters. This note would get permalink `architecture/api-design-decisions` and be addressable at `memory://architecture/api-design-decisions`.
    
    ### Editing an Existing Note
    
    Use `edit_note` to append, prepend, or find-and-replace within a note:
    
    ```python
    # Append new observations
    edit_note(
      identifier="API Design Decisions",
      operation="append",
      section="Observations",
      content="- [decision] Use OpenAPI 3.1 for spec generation #api"
    )
    
    # Add a new relation
    edit_note(
      identifier="API Design Decisions",
      operation="append",
      section="Relations",
      content="- depends_on [[Rate Limiter]]"
    )
    ```
    
    ### Moving a Note
    
    Use `move_note` to reorganize notes into different directories:
    
    ```python
    move_note(
      identifier="API Design Decisions",
      destination_path="archive/api-design-decisions.md"
    )
    ```
    
    The permalink stays the same after a move, so all `[[wiki-links]]` and `memory://` URLs continue to resolve.
    
    ## Best Practices
    
    1. **Start with context.** Before listing observations, explain *why* this note exists. Future-you (or your AI collaborator) will thank you.
    
    2. **Favor completeness.** Write rich, substantive notes. Basic Memory's search pulls relevant chunks from note bodies, so longer notes with more context are *more* discoverable, not less. Use prose in the body to tell the full story — the background, the reasoning, the nuance. Then distill key facts into `[category] content` observations for structured queries. Both matter: prose gives meaning, observations give precision.
    
    3. **Build incrementally.** Add to existing notes rather than creating duplicates. Use `edit_note` to append new observations or relations as you learn more.
    
    4. **Review AI-generated content.** When an AI writes notes for you, review them for accuracy. The AI captures structure well but may miss nuance.
    
    5. **Use consistent titles.** Note titles are identifiers in the knowledge graph. `API Design Decisions` and `Api Design decisions` are different entities. Pick a convention and stick to it.
    
    6. **Link related concepts.** The value of a knowledge graph compounds with connections. A note with zero relations is an island — useful, but not as powerful as a connected one.
    
    7. **Let the graph grow naturally.** Don't try to design a perfect taxonomy upfront. Write notes as you work, add relations as connections emerge, and periodically use `/reflect` or `/defrag` to consolidate.
    


  memory-reflect-skill.md: |
    ---
    name: memory-reflect
    description: "Sleep-time memory reflection: review recent conversations and daily notes, extract insights, and consolidate into long-term memory. Use when triggered by cron, heartbeat, or explicit request to reflect on recent activity. Runs as background processing to improve memory quality over time."
    ---
    
    # Memory Reflect
    
    Review recent activity and consolidate valuable insights into long-term memory.
    
    Inspired by sleep-time compute — the idea that memory formation happens best *between* active sessions, not during them.
    
    ## When to Run
    
    - **Cron/heartbeat**: Schedule as a periodic background task (recommended: 1-2x daily)
    - **On demand**: User asks to reflect, consolidate, or review recent memory
    - **Post-compaction**: After context window compaction events
    
    ## Process
    
    ### 1. Gather Recent Material
    
    Find what changed recently, then read the relevant files:
    
    ```python
    # Find recently modified notes — use json format for the complete list
    # (text format truncates to ~5 items in the summary)
    recent_activity(timeframe="2d", output_format="json")
    
    # Read specific daily notes
    read_note(identifier="memory/2026-02-27")
    read_note(identifier="memory/2026-02-26")
    
    # Check active tasks
    search_notes(note_types=["task"], status="active")
    ```
    
    ### 2. Evaluate What Matters
    
    For each piece of information, ask:
    - Is this a **decision** that affects future work? → Keep
    - Is this a **lesson learned** or mistake to avoid? → Keep
    - Is this a **preference** or working style insight? → Keep
    - Is this a **relationship** detail (who does what, contact info)? → Keep
    - Is this **transient** (weather checked, heartbeat ran, routine task)? → Skip
    - Is this **already captured** in MEMORY.md or another long-term file? → Skip
    
    ### 3. Update Long-Term Memory
    
    Write consolidated insights to `MEMORY.md` following its existing structure:
    - Add new sections or update existing ones
    - Use concise, factual language
    - Include dates for temporal context
    - Remove or update outdated entries that the new information supersedes
    
    ### 4. Log the Reflection
    
    Append a brief entry to today's daily note:
    ```markdown
    ## Reflection (HH:MM)
    - Reviewed: [list of files reviewed]
    - Added to MEMORY.md: [brief summary of what was consolidated]
    - Removed/updated: [anything cleaned up]
    ```
    
    ## Guidelines
    
    - **Be selective.** The goal is distillation, not duplication. MEMORY.md should be curated wisdom, not a copy of daily notes.
    - **Preserve voice.** If the agent has a personality/soul file, reflections should match that voice.
    - **Don't delete daily notes.** They're the raw record. Reflection extracts from them; it doesn't replace them.
    - **Merge, don't append.** If MEMORY.md already has a section about a topic, update it in place rather than adding a duplicate entry.
    - **Flag uncertainty.** If something seems important but you're not sure, add it with a note like "(needs confirmation)" rather than skipping it entirely.
    - **Restructure over time.** If MEMORY.md is a chronological dump, restructure it into topical sections during reflection. Curated knowledge > raw logs.
    - **Check for filesystem issues.** Look for recursive nesting (memory/memory/memory/...), orphaned files, or bloat while gathering material.
    


  memory-schema-skill.md: |
    ---
    name: memory-schema
    description: "Schema lifecycle management for Basic Memory: discover unschemaed notes, infer schemas, create and edit schema definitions, validate notes, and detect drift. Use when working with structured note types (Task, Person, Meeting, etc.) to maintain consistency across the knowledge graph."
    ---
    
    # Memory Schema
    
    Manage structured note types using Basic Memory's Picoschema system. Schemas define what fields a note type should have, making notes uniform, queryable, and validatable.
    
    ## When to Use
    
    - **New note type emerging** — you notice several notes share the same structure (meetings, people, decisions)
    - **Validation check** — confirm existing notes conform to their schema
    - **Schema drift** — detect fields that notes use but the schema doesn't define (or vice versa)
    - **Schema evolution** — add/remove/change fields as requirements evolve
    - **On demand** — user asks to create, check, or manage schemas
    
    ## Picoschema Syntax Reference
    
    Schemas are defined in YAML frontmatter using Picoschema — a compact notation for describing note structure.
    
    ### Basic Types
    
    ```yaml
    schema:
      name: string, person's full name
      age: integer, age in years
      score: number, floating-point rating
      active: boolean, whether currently active
    ```
    
    Supported types: `string`, `integer`, `number`, `boolean`.
    
    ### Optional Fields
    
    Append `?` to the field name:
    
    ```yaml
    schema:
      title: string, required field
      subtitle?: string, optional field
    ```
    
    ### Enums
    
    Use `(enum)` with a list of allowed values:
    
    ```yaml
    schema:
      status(enum): [active, blocked, done, abandoned], current state
    ```
    
    Optional enum:
    
    ```yaml
    schema:
      priority?(enum): [low, medium, high, critical], task priority
    ```
    
    ### Arrays
    
    Use `(array)` for list fields:
    
    ```yaml
    schema:
      tags(array): string, categorization labels
      steps?(array): string, ordered steps to complete
    ```
    
    ### Relations
    
    Reference other entity types directly:
    
    ```yaml
    schema:
      parent_task?: Task, parent task if this is a subtask
      attendees?(array): Person, people who attended
    ```
    
    Relations create edges in the knowledge graph, linking notes together.
    
    ### Validation Settings
    
    ```yaml
    settings:
      validation: warn    # warn (log issues) or error (strict)
    ```
    
    ### Complete Example
    
    ```yaml
    ---
    title: Meeting
    type: schema
    entity: Meeting
    version: 1
    schema:
      topic: string, what was discussed
      date: string, when it happened (YYYY-MM-DD)
      attendees?(array): Person, who attended
      decisions?(array): string, decisions made
      action_items?(array): string, follow-up tasks
      status?(enum): [scheduled, completed, cancelled], meeting state
    settings:
      validation: warn
    ---
    ```
    
    ## Discovering Unschemaed Notes
    
    Look for clusters of notes that share structure but have no schema:
    
    1. **Search by type**: `search_notes(query="type:Meeting")` — if many notes share a `type` but no `schema/Meeting.md` exists, it's a candidate.
    
    2. **Infer a schema**: Use `schema_infer` to analyze existing notes and generate a suggested schema:
       ```python
       schema_infer(noteType="Meeting")
       schema_infer(noteType="Meeting", threshold=0.5)  # fields in 50%+ of notes
       ```
       The threshold (0.0–1.0) controls how common a field must be to be included. Default is usually fine; lower it to catch rarer fields.
    
    3. **Review the suggestion** — the inferred schema shows field names, types, and frequency. Decide which fields to keep, make optional, or drop.
    
    ## Creating a Schema
    
    Write the schema note to `schema/<EntityName>`:
    
    ```python
    write_note(
      title="Meeting",
      directory="schema",
      note_type="schema",
      metadata={
        "entity": "Meeting",
        "version": 1,
        "schema": {
          "topic": "string, what was discussed",
          "date": "string, when it happened",
          "attendees?(array)": "Person, who attended",
          "decisions?(array)": "string, decisions made"
        },
        "settings": {"validation": "warn"}
      },
      content="""# Meeting
    
    Schema for meeting notes.
    
    ## Observations
    - [convention] Meeting notes live in memory/meetings/ or as daily entries
    - [convention] Always include date and topic
    - [convention] Action items should become tasks when complex"""
    )
    ```
    
    ### Key Principles
    
    - **Schema notes live in `schema/`** — one note per entity type
    - **`note_type="schema"`** marks it as a schema definition
    - **`entity: Meeting`** in metadata names the type it applies to
    - **`version: 1`** in metadata — increment when making breaking changes
    - **`settings.validation: warn`** is recommended to start — it logs issues without blocking writes
    
    ## Validating Notes
    
    Check how well existing notes conform to their schema:
    
    ```python
    # Validate all notes of a type
    schema_validate(noteType="Meeting")
    
    # Validate a single note
    schema_validate(identifier="meetings/2026-02-10-standup")
    ```
    
    **Important:** `schema_validate` checks for schema fields as **observation categories** in the note body — e.g., a `status` field expects `- [status] active` as an observation. Fields stored only in frontmatter metadata won't satisfy validation. To pass cleanly, include schema fields as both frontmatter values (for metadata search) and observations (for schema validation).
    
    Validation reports:
    - **Missing required fields** — the note lacks a field the schema requires (as an observation category)
    - **Unknown fields** — the note has fields the schema doesn't define
    - **Type mismatches** — a field value doesn't match the expected type
    - **Invalid enum values** — a value isn't in the allowed set
    
    ### Handling Validation Results
    
    - **`warn` mode**: Review warnings periodically. Fix notes that are clearly wrong; add optional fields to the schema for legitimate new patterns.
    - **`error` mode**: Use for strict schemas where conformance matters (e.g., automated pipelines consuming notes).
    
    ## Detecting Drift
    
    Over time, notes evolve and schemas lag behind. Use `schema_diff` to find divergence:
    
    ```python
    schema_diff(noteType="Meeting")
    ```
    
    Diff reports:
    - **Fields in notes but not in schema** — candidates for adding to the schema (as optional)
    - **Schema fields rarely used** — consider making optional or removing
    - **Type inconsistencies** — fields used as different types across notes
    
    ## Schema Evolution
    
    When note structure changes:
    
    1. **Run diff** to see current state: `schema_diff(noteType="Meeting")`
    2. **Update the schema note** via `edit_note`:
       ```python
       edit_note(
         identifier="schema/Meeting",
         operation="find_replace",
         find_text="version: 1",
         content="version: 2",
         expected_replacements=1
       )
       ```
    3. **Add/remove/modify fields** in the `schema:` block
    4. **Re-validate** to confirm existing notes still pass: `schema_validate(noteType="Meeting")`
    5. **Fix outliers** — update notes that don't conform to the new schema
    
    ### Evolution Guidelines
    
    - **Additive changes** (new optional fields) are safe — no version bump needed
    - **Breaking changes** (new required fields, removed fields, type changes) should bump `version`
    - **Prefer optional over required** — most fields should be optional to start
    - **Don't over-constrain** — schemas should describe common structure, not enforce rigid templates
    - **Schema as documentation** — even if validation is set to `warn`, the schema serves as living documentation for what notes of that type should contain
    
    ## Workflow Summary
    
    ```
    1. Notice repeated note structure → infer schema (schema_infer)
    2. Review + create schema note   → write to schema/ (write_note)
    3. Validate existing notes       → check conformance (schema_validate)
    4. Fix outliers                  → edit non-conforming notes (edit_note)
    5. Periodically check drift      → detect divergence (schema_diff)
    6. Evolve schema as needed       → update schema note (edit_note)
    ```
    


---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-internal
  namespace: ${SHOGGOTH_NAMESPACE}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web-internal
  template:
    metadata:
      labels:
        app: web-internal
    spec:
      dnsPolicy: None
      dnsConfig:
        nameservers:
        - ${SHOGGOTH_DNS_IP}
        searches:
        - ${SHOGGOTH_NAMESPACE}.svc.cluster.local
        - svc.cluster.local
        - cluster.local
      initContainers:
      - name: build-plugin
        image: asherikov/shoggoth_tools:alpine
        imagePullPolicy: IfNotPresent
        command:
        - sh
        - -c
        - |
          set -eu
          mkdir -p /data/plugin/skills
          for src in /src/plugin/*-skill.md; do
              base="$(basename "${src}" -skill.md)"
              mkdir -p "/data/plugin/skills/${base}"
              cp "${src}" "/data/plugin/skills/${base}/SKILL.md"
          done
          cp /src/plugin/plugin.json /data/plugin/plugin.json
          tar czhf /data/plugin/plugin.tar.gz -C /data/plugin .
        resources:
          requests:
            memory: 32Mi
            cpu: 50m
          limits:
            memory: 64Mi
            cpu: 200m
        volumeMounts:
        - name: plugin-source
          mountPath: /src/plugin
          readOnly: true
        - name: plugin-data
          mountPath: /data/plugin
      - name: wait-bootstrap
        image: asherikov/shoggoth_tools:alpine
        imagePullPolicy: IfNotPresent
        command:
        - bash
        - -c
        args:
        - |
          set -euo pipefail
          K8S_API="${K8S_API:-https://kubernetes.default.svc}"
          SA_TOKEN="$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)"
          SA_CA="/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
          for i in $(seq 1 120); do
            http_code=$(curl -sS --cacert "${SA_CA}" \
              -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer ${SA_TOKEN}" \
              "${K8S_API}/api/v1/namespaces/${SHOGGOTH_NAMESPACE}/secrets/shoggoth-bootstrap-done" || true)
            if [ "${http_code}" = "200" ]; then
              echo "wait-bootstrap: shoggoth-bootstrap-done Secret found"
              exit 0
            fi
            echo "wait-bootstrap: waiting for shoggoth-bootstrap-done Secret (attempt $i/120, http=${http_code})..."
            if [ $((i % 12)) -eq 0 ] && [ "${http_code}" != "404" ]; then
              curl -sS --cacert "${SA_CA}" \
                -H "Authorization: Bearer ${SA_TOKEN}" \
                "${K8S_API}/api/v1/namespaces/${SHOGGOTH_NAMESPACE}/secrets/shoggoth-bootstrap-done" >&2 || true
            fi
            sleep 5
          done
          echo "wait-bootstrap: FATAL: shoggoth-bootstrap-done Secret not found after 600s"
          echo "wait-bootstrap: openbao-bootstrap may have failed; check:"
          echo "  kubectl logs -n ${SHOGGOTH_NAMESPACE} -l app=openbao -c openbao-bootstrap"
          exit 1
        resources:
          requests:
            memory: 32Mi
            cpu: 50m
          limits:
            memory: 64Mi
            cpu: 200m
        volumeMounts: []
      - name: render-config
        image: asherikov/shoggoth_tools:alpine
        imagePullPolicy: IfNotPresent
        command:
        - bash
        - -c
        args:
        - |
          VARS="$(printf '${%s}' SHOGGOTH_DOMAIN)"
          envsubst "$VARS" < /tmpl/angie.conf.tmpl > /rendered/angie.conf
          envsubst "$VARS" < /tmpl-html/index.html > /rendered/index.html
          sed -e "s|\${GITEA_SLAVE_TOKEN}|${GITEA_SLAVE_TOKEN}|g" \
              -e "s|\${REDMINE_TOKEN}|${REDMINE_TOKEN}|g" \
              -e "s|\${CDASH_API_TOKEN}|${CDASH_API_TOKEN}|g" \
              -i /rendered/angie.conf
        env:
        - name: SHOGGOTH_DOMAIN
          value: ${SHOGGOTH_DOMAIN}
        - name: GITEA_SLAVE_TOKEN
          valueFrom:
            secretKeyRef:
              name: gitea-slave-token
              key: token
        - name: REDMINE_TOKEN
          valueFrom:
            secretKeyRef:
              name: redmine-slave-token
              key: token
        - name: CDASH_API_TOKEN
          valueFrom:
            secretKeyRef:
              name: cdash-api-token
              key: token
        resources:
          requests:
            memory: 32Mi
            cpu: 50m
          limits:
            memory: 128Mi
            cpu: 200m
        volumeMounts:
        - name: config-template
          mountPath: /tmpl
          readOnly: true
        - name: html-template
          mountPath: /tmpl-html
          readOnly: true
        - name: rendered-config
          mountPath: /rendered
      - name: fix-permissions
        image: asherikov/shoggoth_tools:alpine
        imagePullPolicy: IfNotPresent
        command:
        - bash
        - -c
        - chown -R 100:101 /data/build_cache /data/python_cache
        securityContext:
          runAsUser: 0
        resources:
          requests:
            memory: 32Mi
            cpu: 50m
          limits:
            memory: 64Mi
            cpu: 200m
        volumeMounts:
        - name: build-cache
          mountPath: /data/build_cache
        - name: python-cache
          mountPath: /data/python_cache
      containers:
      - name: angie
        image: docker.angie.software/angie:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
          name: http
        volumeMounts:
        - name: rendered-config
          mountPath: /etc/angie/angie.conf
          subPath: angie.conf
          readOnly: true
        - name: rendered-config
          mountPath: /data/html
          readOnly: true
        - name: build-cache
          mountPath: /data/build_cache
        - name: python-cache
          mountPath: /data/python_cache
        - name: plugin-data
          mountPath: /data/plugin
          readOnly: true
        - name: setup-client
          mountPath: /data/scripts
          readOnly: true
        resources:
          requests:
            memory: 64Mi
            cpu: 50m
          limits:
            memory: 128Mi
            cpu: 500m
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
          failureThreshold: 30
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
          failureThreshold: 6
      volumes:
      - name: config-template
        configMap:
          name: web-internal-config-template
      - name: rendered-config
        emptyDir: {}
      - name: html-template
        configMap:
          name: web-internal-html
      - name: build-cache
        persistentVolumeClaim:
          claimName: angie-build-cache
      - name: python-cache
        persistentVolumeClaim:
          claimName: python-cache
      - name: plugin-source
        configMap:
          name: web-internal-plugin-source
          defaultMode: 0755
      - name: plugin-data
        emptyDir: {}
      - name: setup-client
        hostPath:
          path: /var/lib/rancher/k3s/storage/${SHOGGOTH_INSTANCE_DIR}/scripts
          type: DirectoryOrCreate

      serviceAccountName: web-internal
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: web-internal
  namespace: ${SHOGGOTH_NAMESPACE}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: web-internal-bootstrap-wait
  namespace: ${SHOGGOTH_NAMESPACE}
rules:
- apiGroups:
  - ''
  resources:
  - secrets
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: web-internal-bootstrap-wait
  namespace: ${SHOGGOTH_NAMESPACE}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: web-internal-bootstrap-wait
subjects:
- kind: ServiceAccount
  name: web-internal
  namespace: ${SHOGGOTH_NAMESPACE}
