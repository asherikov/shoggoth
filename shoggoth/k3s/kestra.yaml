---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kestra-data
  namespace: ${SHOGGOTH_NAMESPACE}
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: local-path
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kestra-db
  namespace: ${SHOGGOTH_NAMESPACE}
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: local-path
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kestra-entrypoint
  namespace: ${SHOGGOTH_NAMESPACE}
data:
  entrypoint.sh: |
    #!/usr/bin/env sh
    set -eu

    exec /app/kestra "$@"
---
apiVersion: v1
kind: Service
metadata:
  name: kestra-db
  namespace: ${SHOGGOTH_NAMESPACE}
spec:
  selector:
    app: kestra-db
  ports:
  - name: postgres
    port: 5432
    targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kestra-db
  namespace: ${SHOGGOTH_NAMESPACE}
spec:
  serviceName: kestra-db
  replicas: 1
  selector:
    matchLabels:
      app: kestra-db
  template:
    metadata:
      labels:
        app: kestra-db
    spec:
      dnsPolicy: None
      dnsConfig:
        nameservers:
        - ${SHOGGOTH_DNS_IP}
        searches:
        - ${SHOGGOTH_NAMESPACE}.svc.cluster.local
        - svc.cluster.local
        - cluster.local
      initContainers:
      - name: wait-bootstrap
        image: asherikov/shoggoth_tools:alpine
        imagePullPolicy: IfNotPresent
        command:
        - bash
        - -c
        args:
        - |
          set -euo pipefail
          NS="${SHOGGOTH_NAMESPACE}"
                    wait_for_externalsecret() {
                      local name="$1"
                      echo "wait-bootstrap: waiting for externalsecret/${name} Ready in namespace ${NS}..."
                      for i in $(seq 1 60); do
                        if kubectl get externalsecret "${name}" -n "${NS}" -o json 2>/dev/null | jq -e '.status.conditions // [] | map(select(.type=="Ready" and .status=="True")) | length > 0' >/dev/null 2>&1; then
                          echo "wait-bootstrap: externalsecret/${name} Ready (after $((i*10))s)"
                          return 0
                        fi
                        sleep 10
                      done
                      echo "FAIL: externalsecret/${name} not Ready after 10m"
                      echo "      Hint: check status from outside the pod:"
                      echo "            kubectl get externalsecret -n ${NS} ${name} -o yaml"
                      echo "            kubectl describe externalsecret -n ${NS} ${name}"
                      echo "      Most common causes: OpenBao unavailable, SecretStore reference broken,"
                      echo "      or remote secret missing (Orphan policies require a value in the source store)."
                      return 1
                    }
          wait_for_externalsecret kestra-db-password || exit 1
          wait_for_externalsecret openldap-admin-password || exit 1
          echo "wait-bootstrap: all K8s Secrets Ready"

        resources:
          requests:
            memory: 32Mi
            cpu: 50m
          limits:
            memory: 64Mi
            cpu: 200m
        volumeMounts: []
      - name: purge-data
        image: asherikov/shoggoth_tools:alpine
        imagePullPolicy: IfNotPresent
        command:
        - bash
        - -c
        args:
        - |
          set -eu
          rm -rf /var/lib/postgresql/* /var/lib/postgresql/.[!.]*
          echo "purge-data: kestra-db volume wiped"
        resources:
          requests:
            memory: 16Mi
            cpu: 10m
          limits:
            memory: 32Mi
            cpu: 100m
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql
      containers:
      - name: postgres
        image: postgres:18-alpine
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5432
          name: postgres
        env:
        - name: SHOGGOTH_DOMAIN
          value: ${SHOGGOTH_DOMAIN}
        - name: OTEL_TRACES_EXPORTER
          value: otlp
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://otelcol:4318
        - name: POSTGRES_DB
          value: kestra
        - name: POSTGRES_USER
          value: kestra
        - name: POSTGRES_PASSWORD_FILE
          value: /run/secrets/kestra_db_password
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql
        - name: db-password
          mountPath: /run/secrets/kestra_db_password
          subPath: password
          readOnly: true
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - kestra
          initialDelaySeconds: 5
          periodSeconds: 5
          failureThreshold: 60
        livenessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - kestra
          initialDelaySeconds: 30
          periodSeconds: 10
        resources:
          requests:
            memory: 512Mi
            cpu: 100m
          limits:
            memory: 1Gi
            cpu: 500m
      volumes:
      - name: db-password
        secret:
          secretName: kestra-db-password
      - name: data
        persistentVolumeClaim:
          claimName: kestra-db
      serviceAccountName: kestra-db
---
apiVersion: v1
kind: Service
metadata:
  name: kestra
  namespace: ${SHOGGOTH_NAMESPACE}
spec:
  selector:
    app: kestra
  ports:
  - name: http
    port: 80
    targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kestra
  namespace: ${SHOGGOTH_NAMESPACE}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kestra
  template:
    metadata:
      labels:
        app: kestra
      annotations:
        secret.reloader.stakater.com/reload: kestra-db-password,openldap-admin-password,gitea-server-token,openbao-unseal-key
    spec:
      dnsPolicy: None
      dnsConfig:
        nameservers:
        - ${SHOGGOTH_DNS_IP}
        searches:
        - ${SHOGGOTH_NAMESPACE}.svc.cluster.local
        - svc.cluster.local
        - cluster.local
      initContainers:
      - name: wait-bootstrap
        image: asherikov/shoggoth_tools:alpine
        imagePullPolicy: IfNotPresent
        command:
        - bash
        - -c
        args:
        - |
          set -euo pipefail
          NS="${SHOGGOTH_NAMESPACE}"
                    wait_for_externalsecret() {
                      local name="$1"
                      echo "wait-bootstrap: waiting for externalsecret/${name} Ready in namespace ${NS}..."
                      for i in $(seq 1 60); do
                        if kubectl get externalsecret "${name}" -n "${NS}" -o json 2>/dev/null | jq -e '.status.conditions // [] | map(select(.type=="Ready" and .status=="True")) | length > 0' >/dev/null 2>&1; then
                          echo "wait-bootstrap: externalsecret/${name} Ready (after $((i*10))s)"
                          return 0
                        fi
                        sleep 10
                      done
                      echo "FAIL: externalsecret/${name} not Ready after 10m"
                      echo "      Hint: check status from outside the pod:"
                      echo "            kubectl get externalsecret -n ${NS} ${name} -o yaml"
                      echo "            kubectl describe externalsecret -n ${NS} ${name}"
                      echo "      Most common causes: OpenBao unavailable, SecretStore reference broken,"
                      echo "      or remote secret missing (Orphan policies require a value in the source store)."
                      return 1
                    }
          wait_for_secret_key() {
            local name="$1" key="$2"
            echo "wait-bootstrap: waiting for secret/${name}.${key} in namespace ${NS}..."
            local ok=0
            for i in $(seq 1 60); do
              if kubectl get secret "${name}" -n "${NS}" -o json 2>/dev/null | jq -e --arg k "${key}" '(.data[$k] // "") | length > 0' >/dev/null 2>&1; then
                echo "wait-bootstrap: secret/${name}.${key} populated (after $((i*10))s)"
                ok=1
                break
              fi
              sleep 10
            done
            if [ "${ok}" != "1" ]; then
              echo "FAIL: secret/${name}.${key} not populated after 10m"
              echo "      Hint: check ExternalSecret status from outside the pod:"
              echo "            kubectl get externalsecret -n ${NS} <name> -o yaml"
              echo "      Most common cause: OpenBao unavailable, or SecretStore reference broken."
              return 1
            fi
            return 0
          }
          wait_for_externalsecret kestra-db-password || exit 1
          wait_for_externalsecret openldap-admin-password || exit 1
          wait_for_externalsecret gitea-server-token || exit 1
          wait_for_secret_key openbao-unseal-key root-token || exit 1
          echo "wait-bootstrap: all K8s Secrets Ready"

        resources:
          requests:
            memory: 32Mi
            cpu: 50m
          limits:
            memory: 64Mi
            cpu: 200m
        volumeMounts: []
      - name: render-config
        image: asherikov/shoggoth_tools:alpine
        imagePullPolicy: IfNotPresent
        env:
        - name: KESTRA_DATASOURCES_POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: kestra-db-password
              key: password
        - name: SHOGGOTH_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: openldap-admin-password
              key: password
        - name: RENDER_VARS
          value: ${KESTRA_DATASOURCES_POSTGRES_PASSWORD}${SHOGGOTH_ADMIN_PASSWORD}
        command:
        - bash
        - -c
        - exec /tmpl/render.sh
        resources:
          requests:
            memory: 32Mi
            cpu: 50m
          limits:
            memory: 64Mi
            cpu: 200m
        volumeMounts:
        - name: templates
          mountPath: /templates
          readOnly: true
        - name: rendered-config
          mountPath: /rendered
        - name: render-script
          mountPath: /tmpl
          readOnly: true
      containers:
      - name: kestra
        image: kestra/kestra:v1.3.40
        imagePullPolicy: IfNotPresent
        securityContext:
          runAsUser: 0
        env:
        - name: SHOGGOTH_DOMAIN
          value: ${SHOGGOTH_DOMAIN}
        - name: OTEL_TRACES_EXPORTER
          value: otlp
        - name: FLOWENV_SHOGGOTH_DOMAIN
          value: ${SHOGGOTH_DOMAIN}
        - name: FLOWENV_SHOGGOTH_NAMESPACE
          value: ${SHOGGOTH_NAMESPACE}
        - name: FLOWENV_SHOGGOTH_GITHUB_ORG
          value: ${SHOGGOTH_GITHUB_ORG}
        - name: FLOWENV_SHOGGOTH_VAULT_TOKEN
          valueFrom:
            secretKeyRef:
              name: openbao-unseal-key
              key: root-token
        - name: FLOWENV_GITEA_ADMIN_TOKEN
          valueFrom:
            secretKeyRef:
              name: gitea-server-token
              key: token
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://otelcol:4317
        command:
        - /bin/sh
        - /shoggoth/kestra-entrypoint/entrypoint.sh
        args:
        - server
        - standalone
        - --config
        - /shoggoth/kestra/config.yaml
        - --flow-path
        - /app/flows
        ports:
        - containerPort: 80
          name: http
        resources:
          requests:
            memory: 512Mi
            cpu: 500m
          limits:
            memory: 2Gi
            cpu: '2'
        readinessProbe:
          tcpSocket:
            port: 80
          initialDelaySeconds: 60
          periodSeconds: 10
          failureThreshold: 60
        livenessProbe:
          tcpSocket:
            port: 80
          initialDelaySeconds: 120
          periodSeconds: 30
          failureThreshold: 6
        volumeMounts:
        - name: entrypoint
          mountPath: /shoggoth/kestra-entrypoint
          readOnly: true
        - name: data
          mountPath: /app/storage
        - name: flows
          mountPath: /app/flows
        - name: plugins
          mountPath: /app/plugins
        - name: dind-socket
          mountPath: /dind
        - name: rendered-config
          mountPath: /shoggoth/kestra
          readOnly: true
        - name: workflow-scripts
          mountPath: /shoggoth/workflow/scripts
          readOnly: true
      volumes:
      - name: rendered-config
        emptyDir: {}
      - name: entrypoint
        configMap:
          name: kestra-entrypoint
          defaultMode: 493
      - name: data
        persistentVolumeClaim:
          claimName: kestra-data
      - name: flows
        hostPath:
          path: /var/lib/rancher/k3s/storage/${SHOGGOTH_INSTANCE_DIR}/kestra-flows
          type: DirectoryOrCreate
      - name: plugins
        hostPath:
          path: /var/lib/rancher/k3s/storage/${SHOGGOTH_INSTANCE_DIR}/kestra-plugins
          type: DirectoryOrCreate
      - name: dind-socket
        hostPath:
          path: /var/lib/rancher/k3s/storage/${SHOGGOTH_INSTANCE_DIR}/dind-socket
          type: DirectoryOrCreate
      - name: workflow-scripts
        hostPath:
          path: /var/lib/rancher/k3s/storage/${SHOGGOTH_INSTANCE_DIR}/workflow-scripts
          type: DirectoryOrCreate
      - name: templates
        configMap:
          name: kestra-templates
      - name: render-script
        configMap:
          name: shoggoth-render-config
          defaultMode: 493
      serviceAccountName: kestra
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kestra
  namespace: ${SHOGGOTH_NAMESPACE}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kestra-bootstrap-wait
  namespace: ${SHOGGOTH_NAMESPACE}
rules:
- apiGroups:
  - ''
  resources:
  - secrets
  resourceNames:
  - kestra-db-password
  - openldap-admin-password
  - gitea-server-token
  - openbao-unseal-key
  verbs:
  - get
- apiGroups:
  - external-secrets.io
  resources:
  - externalsecrets
  resourceNames:
  - kestra-db-password
  - openldap-admin-password
  - gitea-server-token
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kestra-bootstrap-wait
  namespace: ${SHOGGOTH_NAMESPACE}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kestra-bootstrap-wait
subjects:
- kind: ServiceAccount
  name: kestra
  namespace: ${SHOGGOTH_NAMESPACE}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kestra-db
  namespace: ${SHOGGOTH_NAMESPACE}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kestra-db-bootstrap-wait
  namespace: ${SHOGGOTH_NAMESPACE}
rules:
- apiGroups:
  - ''
  resources:
  - secrets
  resourceNames:
  - kestra-db-password
  - openldap-admin-password
  verbs:
  - get
- apiGroups:
  - external-secrets.io
  resources:
  - externalsecrets
  resourceNames:
  - kestra-db-password
  - openldap-admin-password
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kestra-db-bootstrap-wait
  namespace: ${SHOGGOTH_NAMESPACE}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kestra-db-bootstrap-wait
subjects:
- kind: ServiceAccount
  name: kestra-db
  namespace: ${SHOGGOTH_NAMESPACE}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kestra-templates
  namespace: ${SHOGGOTH_NAMESPACE}
data:
  config.yaml: |
    datasources:
      postgres:
        url: jdbc:postgresql://kestra-db:5432/kestra
        driverClassName: org.postgresql.Driver
        username: kestra
        password: "${KESTRA_DATASOURCES_POSTGRES_PASSWORD}"
    micronaut:
      server:
        host: 0.0.0.0
        port: 80
      application:
        name: kestra
      otel:
        enabled: true
        endpoint: http://otelcol:4317
      metrics:
        export:
          otlp:
            enabled: true
            url: http://otelcol:4318/v1/metrics
            resource-attributes:
              service.name: kestra
      io:
        watch:
          enabled: true
          paths:
            - /app/flows
    kestra:
      storage:
        type: local
        local:
          basePath: /app/storage
      repository:
        type: postgres
      queue:
        type: postgres
      flows:
        paths:
          - /app/flows
      server:
        basic-auth:
          username: admin@${SHOGGOTH_DOMAIN}
          password: "${SHOGGOTH_ADMIN_PASSWORD}"
          open-urls:
            - "/api/v1/executions/webhook/"
            - "/api/v1/main/executions/webhook/"
        termination-grace-period: 30s
      ai:
        enabled: false
      anonymous-usage-report:
        enabled: false
      ui-anonymous-usage-report:
        enabled: false
      tutorial-flows:
        enabled: false
      plugins:
        configurations:
          - type: io.kestra.plugin.scripts.runner.docker.Docker
            values:
              volume-enabled: true
              dockerHost: unix:///dind/docker.sock
      variables:
        env-vars-prefix: FLOWENV_
    grpc:
      server:
        enabled: false
        health:
          enabled: false

