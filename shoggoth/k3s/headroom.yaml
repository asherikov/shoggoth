---
# headroom — LLM context-compression sidecar for LiteLLM.
#
# Compresses tool output, logs, and RAG chunks *before* they reach the
# upstream model. Registered as a `pre_call` guardrail in
# shoggoth/k3s/litellm.yaml (see the `litellm-templates` ConfigMap there);
# the litellm pod reaches the proxy via the in-cluster Service name
# `headroom` on port 8787 (matching the upstream default
# `headroom proxy --port 8787`).
#
# Deployment shape
# ----------------
# - One Deployment + Service in the shoggoth namespace
# - No RBAC: headroom is a stateless proxy that does not talk to the k8s
#   API. ServiceAccount is still created so future expansion (e.g. a
#   cert-watcher init container, or a Prometheus auth header) has a
#   place to bind, and so `serviceAccountName: headroom` in the PodSpec
#   matches the project's "every pod has a named SA" convention
# - `automountServiceAccountToken: false` — no k8s API access required
#   and the token must not be exposed to a service that handles
#   user-supplied prompt content
# - `dnsPolicy: None` + `dnsConfig.nameservers: [${SHOGGOTH_DNS_IP}]` so
#   the proxy can resolve upstream LLM hostnames through shoggoth's
#   CoreDNS sidecar (the same shape litellm uses)
# - `readOnlyRootFilesystem: true`; the model cache lives on a small
#   PVC mounted at /data. `HOME=/data` and `HF_HOME=/data/huggingface`
#   so both the Python huggingface_hub download path and the Rust
#   core's `~/.cache` land on the persistent volume. Without the PVC,
#   every pod restart re-downloads `chopratejas/kompress-v2-base` and
#   the unnamed Rust-core embedding model from huggingface.co
#
# Image / air-gap
# ---------------
# The image is "thin" — Kompress-v2-base, the Rust-core embedder, and
# the ONNX Runtime are fetched on first run from `huggingface.co` and
# `cdn.pyke.io` (Mozilla roots only, see
# https://github.com/headroomlabs-ai/headroom). On air-gapped clusters
# the cache volume can be primed by an out-of-band `huggingface-cli
# download` into a tarball, then `kubectl cp`-ed into the PVC, or by
# pre-baking the models into a custom image. Zot caches the *image*
# itself; it does not help with the model/ONNX runtime fetches (those
# use HF's API, not OCI distribution).
#
# On x86_64 the ONNX runtime needs AVX2; non-AVX2 hosts (some
# QEMU/Docker-on-Win, older cloud VMs) automatically fall back to
# BM25 + heuristic detection rather than crashing.
#
# Rollout
# -------
# Wired into LiteLLM with `default_on: false`; opt-in per key via
# `POST /key/generate` with `"guardrails": ["headroom-compression"]`,
# or per request via `"guardrails": ["headroom-compression"]` in the
# request body / `litellm_metadata.guardrails` for the Anthropics
# `/v1/messages` path. Bypass: `x-headroom-bypass: true`.
#
# What gets compressed (current defaults, no env overrides set):
#   - tool output / RAG chunks / log payloads (lives in `assistant`
#     tool-result messages)
#   - upstream LLM input for the `pre_call` hook
#   - `cache_control`-marked messages: NEVER (CacheAligner refuses
#     them; preserve Anthropic prompt-cache byte matching)
#   - `user`/`system` messages: NOT compressed by default; opt in with
#     `HEADROOM_COMPRESS_USER_MESSAGES=1` on this Deployment
#   - responses: never (pre_call only)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: headroom
  namespace: ${SHOGGOTH_NAMESPACE}
  labels:
    app: headroom
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: headroom-cache
  namespace: ${SHOGGOTH_NAMESPACE}
  labels:
    app: headroom
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: local-path
---
apiVersion: v1
kind: Service
metadata:
  name: headroom
  namespace: ${SHOGGOTH_NAMESPACE}
  labels:
    app: headroom
spec:
  selector:
    app: headroom
  ports:
  - name: http
    port: 8787
    targetPort: http
    protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: headroom
  namespace: ${SHOGGOTH_NAMESPACE}
  labels:
    app: headroom
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: headroom
  template:
    metadata:
      labels:
        app: headroom
    spec:
      serviceAccountName: headroom
      automountServiceAccountToken: false
      dnsPolicy: None
      dnsConfig:
        nameservers:
        - ${SHOGGOTH_DNS_IP}
        searches:
        - ${SHOGGOTH_NAMESPACE}.svc.cluster.local
        - svc.cluster.local
        - cluster.local
      containers:
      - name: headroom
        # Pinned to the most recent `code-nonroot` build as of deploy.
        # Headroom does NOT publish semver-tagged images in the
        # registry (the `0.x.y` and `0.x.y-nonroot` tag forms shown
        # in https://docs.headroomlabs.ai/docs/installation are a
        # placeholder for a future publish scheme; querying
        # `ghcr.io/v2/headroomlabs-ai/headroom/tags/list` returns
        # only moving aliases like `latest`, `nonroot`, `code-nonroot`
        # plus short-SHA pins like `code-nonroot-4630602`). The
        # `code` extra adds tree-sitter for AST-aware code
        # compression — worth it for shoggoth's code-heavy agent
        # traffic (PR review, code generation). `nonroot` matches
        # the project's `runAsNonRoot: true` / `runAsUser: 1000`
        # security posture.
        #
        # To upgrade: bump the short SHA in this tag and rerun
        # `make up`. The latest available SHA is on
        # https://github.com/headroomlabs-ai/headroom/pkgs/container/headroom
        # (the "Recent tagged image versions" list). Avoid the
        # moving `latest` / `nonroot` / `code-nonroot` aliases —
        # they rebase without warning and break reproducibility.
        image: ghcr.io/headroomlabs-ai/headroom:code-nonroot-4630602
        imagePullPolicy: IfNotPresent
        # Override the image entrypoint with a Python wrapper that
        # pins the headroom.proxy logger to WARNING before handing
        # off to the click CLI. The image's default invocation
        # (`headroom proxy` on the python-slim variants,
        # `python3 -m headroom.cli proxy` on the distroless
        # `code-nonroot` variant — see the upstream Dockerfile)
        # ends up at `logging.basicConfig(level=logging.INFO)`
        # (headroom/proxy/server.py), and the `headroom.proxy`
        # logger inherits INFO from the root logger. The image's
        # startup emits several INFO lines on that logger
        # (`Headroom Proxy started`, `Optimization: ENABLED`,
        # `Mode: ...`, `Code graph: file watcher started`,
        # `event=rust_core_loaded ...`, etc.) that flood the pod
        # log under guardrail traffic; without this override
        # the headroom pod's stdout is dominated by these lines,
        # not the proxy_auth_rejected / model-load warnings an
        # operator actually wants surfaced.
        #
        # `HEADROOM_LOG_LEVEL=warning` below only controls
        # uvicorn's log level (per `_resolve_uvicorn_log_level`
        # in server.py) — it does not touch the headroom.proxy
        # logger, which is why the override is needed alongside
        # the env var. The other noisy loggers (`httpx`,
        # `huggingface_hub`, `huggingface_hub.utils._http`,
        # `sentence_transformers`) are already pinned in
        # headroom/cli/cli.py's module-level setLevel calls and
        # don't need adjustment.
        #
        # Click is happy with this layout: `python3 -c <code>
        # proxy ...` sets `sys.argv[0]='-c'` and
        # `sys.argv[1:]=['proxy', '--host', '0.0.0.0', '--port',
        # '8787']`, which the click group at `headroom.cli.main`
        # dispatches to the `proxy` subcommand exactly as the
        # image's own entrypoint would.
        command: ["python3", "-c"]
        args:
        - "import logging, sys; logging.getLogger('headroom.proxy').setLevel(logging.WARNING); from headroom.cli import main; sys.exit(main())"
        - proxy
        - --host
        - 0.0.0.0
        - --port
        - "8787"
        env:
        - name: HOME
          value: /data
        - name: HF_HOME
          value: /data/huggingface
        # Telemetry on: populates the in-process /metrics endpoint
        # that otelcol scrapes into VictoriaMetrics (see the
        # `headroom` job in shoggoth/k3s/otelcol.yaml). Also enables
        # the anonymous beacon by coupling (per the upstream docs,
        # `HEADROOM_TELEMETRY=off` is the way to opt out of both).
        # In a single-tenant shoggoth that's a fair trade for the
        # observability panels in shoggoth_ai (Shoggoth AI Grafana
        # dashboard: tokens saved, compression latency, cache hits).
        # All output is counters/identifiers only — no prompts,
        # completions, code, or file paths leave the cluster.
        - name: HEADROOM_TELEMETRY
          value: "on"
        # Bearer token gate on /metrics (and /stats-history, /quota,
        # /subscription-window). The proxy's bind_policy enforces
        # token-or-loopback on every non-loopback caller, and otelcol
        # is a different pod — so without this token the scrape
        # returns 401 and metrics never reach VictoriaMetrics. The
        # token itself lives in the headroom-proxy-token Secret
        # alongside this Deployment (see
        # shoggoth/k3s/headroom-proxy-token.yaml for rotation
        # notes). otelcol reads the same value from a mounted copy
        # of that Secret — see the headroom scrape job in
        # shoggoth/k3s/otelcol.yaml.
        - name: HEADROOM_PROXY_TOKEN
          valueFrom:
            secretKeyRef:
              name: headroom-proxy-token
              key: token
        # Open the /v1/compress and /v1/usage HTTP routes to
        # authorized in-cluster callers. The proxy's `bind_policy`
        # in headroom/proxy/server.py attaches
        # `Depends(_require_loopback_or_container_gateway)` to
        # those routes by default — a non-loopback peer (e.g. the
        # litellm pod, whose pod IP arrives at the listener as
        # `10.42.0.x`, not `127.0.0.1`) gets a deliberate 404 from
        # `require_loopback_or_container_gateway` (see also
        # headroom/proxy/loopback_guard.py, which documents the
        # 404 as "invisible to external scanners, not merely
        # forbidden"). LiteLLM's headroom guardrail surfaces that
        # 404 as a 502 to the LLM caller with the hint
        # "Headroom compression service returned an error /
        # HEADROOM_COMPRESS_ALLOW_REMOTE=1". This opt-in drops
        # ONLY the loopback dependency on /v1/compress and
        # /v1/usage; every other loopback-gated route
        # (`/admin/*`, `/debug/*`, `/v1/retrieve/*`,
        # `/v1/telemetry*`, etc.) is unaffected. Inbound auth is
        # still enforced: litellm presents
        # `Authorization: Bearer ${HEADROOM_API_KEY}` and the
        # proxy's `_security_gate` validates it against
        # `HEADROOM_PROXY_TOKEN` (set immediately above from the
        # same Secret), so non-loopback callers without the
        # token are still rejected. NetCluster-trust is the
        # in-cluster equivalent of the "trusted network" the
        # source comment requires.
        #
        # Note: the upstream env var is undocumented in the
        # README / docs.headroomlabs.ai / .env.example / official
        # docker-compose; the only authoritative references are
        # the source comment in `bind_policy` (which names
        # "LiteLLM" as the intended use case) and the
        # litellm-side error hint in
        # `litellm/proxy/guardrails/guardrail_hooks/headroom/
        # headroom.py:_build_compress_failure_detail`. There is
        # no test in the upstream test suite that exercises the
        # opt-in path; only the closed (404) path is tested in
        # `tests/test_proxy_loopback_gating.py`.
        - name: HEADROOM_COMPRESS_ALLOW_REMOTE
          value: "1"
        # Suppress the startup update-check notice; cluster is
        # managed by `make up` and image upgrades are pinned via the
        # tag, not by the binary's own update channel.
        - name: HEADROOM_UPDATE_CHECK
          value: "off"
        # Lenient TLS for the model-download CA chain: the Rust core
        # uses Mozilla's own roots and is unaffected by this flag;
        # this covers the Python `huggingface_hub` path which uses
        # the OS cert store. Mirrors the README's
        # `HEADROOM_TLS_STRICT=0` guidance for private-registries.
        - name: HEADROOM_TLS_STRICT
          value: "0"
        # Uvicorn log level (per `_resolve_uvicorn_log_level` in
        # headroom/proxy/server.py: this env var is *only* read by
        # the uvicorn integration — it does not affect the
        # `headroom.proxy` logger, which is pinned separately by
        # the `python3 -c` wrapper in the entrypoint above).
        # Default per upstream is `warning`; set explicitly here so
        # uvicorn's access log (one INFO line per request) does not
        # crowd the pod log when guardrail traffic ramps up. The
        # request counters are already on VictoriaMetrics via
        # /metrics so reproducing them in the pod log is
        # duplication.
        - name: HEADROOM_LOG_LEVEL
          value: warning
        ports:
        - containerPort: 8787
          name: http
          protocol: TCP
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1000
          seccompProfile:
            type: RuntimeDefault
        resources:
          requests:
            memory: 256Mi
            cpu: 100m
          limits:
            memory: 1Gi
            cpu: 1000m
        # Probes hit `/health` (the upstream default). The
        # `initialDelaySeconds` budget is generous: the first start
        # downloads the ONNX runtime, Kompress-v2-base, and the
        # Rust-core embedding model from huggingface.co / cdn.pyke.io
        # before the proxy begins serving, so the readiness probe may
        # legitimately fail for 1-2 minutes on a cold cache.
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 60
          periodSeconds: 10
          failureThreshold: 30
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 180
          periodSeconds: 30
          failureThreshold: 6
        volumeMounts:
        - name: cache
          mountPath: /data
      volumes:
      - name: cache
        persistentVolumeClaim:
          claimName: headroom-cache
