---
apiVersion: v1
kind: Namespace
metadata:
  name: ${SHOGGOTH_NAMESPACE}
  labels:
    app.kubernetes.io/name: external-secrets
    app.kubernetes.io/part-of: shoggoth
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets-cert-controller
  namespace: ${SHOGGOTH_NAMESPACE}
  labels:
    app.kubernetes.io/name: external-secrets-cert-controller
    app.kubernetes.io/part-of: external-secrets
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets
  namespace: ${SHOGGOTH_NAMESPACE}
  labels:
    app.kubernetes.io/name: external-secrets
    app.kubernetes.io/part-of: external-secrets
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets-webhook
  namespace: ${SHOGGOTH_NAMESPACE}
  labels:
    app.kubernetes.io/name: external-secrets-webhook
    app.kubernetes.io/part-of: external-secrets
---
# Init containers in the cert-controller and webhook Deployments share each
# Pod's serviceAccountName (K8s does not allow per-container SAs). The upgrade
# cleanup runs under the cert-controller SA, and the VWC register runs under
# the webhook SA. The ClusterRoles below grant the additional verbs each
# needs, scoped to ESO resources only.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: external-secrets-cert-controller-upgrade
rules:
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    resourceNames:
      - "clusterexternalsecrets.external-secrets.io"
      - "clusterpushsecrets.external-secrets.io"
      - "clustersecretstores.external-secrets.io"
      - "externalsecrets.external-secrets.io"
      - "pushsecrets.external-secrets.io"
      - "secretstores.external-secrets.io"
      - "acraccesstokens.generators.external-secrets.io"
      - "beyondtrustworkloadcredentialsdynamicsecrets.generators.external-secrets.io"
      - "cloudsmithaccesstokens.generators.external-secrets.io"
      - "clustergenerators.generators.external-secrets.io"
      - "ecrauthorizationtokens.generators.external-secrets.io"
      - "fakes.generators.external-secrets.io"
      - "gcraccesstokens.generators.external-secrets.io"
      - "generatorstates.generators.external-secrets.io"
      - "githubaccesstokens.generators.external-secrets.io"
      - "gitlabdeploytokens.generators.external-secrets.io"
      - "grafanas.generators.external-secrets.io"
      - "mfas.generators.external-secrets.io"
      - "passwords.generators.external-secrets.io"
      - "quayaccesstokens.generators.external-secrets.io"
      - "sshkeys.generators.external-secrets.io"
      - "stssessiontokens.generators.external-secrets.io"
      - "uuids.generators.external-secrets.io"
      - "vaultdynamicsecrets.generators.external-secrets.io"
      - "webhooks.generators.external-secrets.io"
    verbs: ["get", "list", "delete", "patch"]
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: ["validatingwebhookconfigurations"]
    resourceNames:
      - "secretstore-validate"
      - "externalsecret-validate"
    verbs: ["get", "list", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames:
      - "external-secrets"
      - "external-secrets-webhook"
      - "external-secrets-cert-controller"
    verbs: ["get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: external-secrets-cert-controller-upgrade
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: external-secrets-cert-controller-upgrade
subjects:
  - kind: ServiceAccount
    name: external-secrets-cert-controller
    namespace: ${SHOGGOTH_NAMESPACE}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: external-secrets-webhook-vwc-register
rules:
  # create: NO `resourceNames` restriction. Per K8s RBAC design
  # (kubernetes/kubernetes#80295, docs/reference/access-authn-authz/rbac),
  # `resourceNames` is IGNORED for the `create` verb because the object
  # name is not part of the authorization path — the SAR for create
  # is evaluated without a name, so a name-restricted rule never matches.
  # The webhook SA only runs in the register-vvc init container of the
  # external-secrets-webhook Deployment, so the broader create scope is
  # acceptable.
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: ["validatingwebhookconfigurations"]
    verbs: ["create"]
  # get: scoped to the two named VWCs we own.
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: ["validatingwebhookconfigurations"]
    resourceNames:
      - "secretstore-validate"
      - "externalsecret-validate"
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["endpoints", "pods", "services"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: external-secrets-webhook-vwc-register
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: external-secrets-webhook-vwc-register
subjects:
  - kind: ServiceAccount
    name: external-secrets-webhook
    namespace: ${SHOGGOTH_NAMESPACE}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: external-secrets-cert-controller
rules:
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    resourceNames:
      - "externalsecrets.external-secrets.io"
      - "secretstores.external-secrets.io"
      - "clustersecretstores.external-secrets.io"
    verbs: ["update", "patch"]
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: ["validatingwebhookconfigurations"]
    verbs: ["list", "watch", "get"]
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: ["validatingwebhookconfigurations"]
    resourceNames: ["secretstore-validate", "externalsecret-validate"]
    verbs: ["update", "patch"]
  - apiGroups: [""]
    resources: ["endpoints"]
    verbs: ["list", "get", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["list", "get", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["external-secrets-webhook"]
    verbs: ["update", "patch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: external-secrets-cert-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: external-secrets-cert-controller
subjects:
  - kind: ServiceAccount
    name: external-secrets-cert-controller
    namespace: ${SHOGGOTH_NAMESPACE}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: external-secrets-controller
rules:
  - apiGroups: ["external-secrets.io"]
    resources:
      - secretstores
      - clustersecretstores
      - externalsecrets
      - clusterexternalsecrets
      - pushsecrets
      - clusterpushsecrets
    verbs: ["get", "list", "watch"]
  - apiGroups: ["generators.external-secrets.io"]
    resources:
      - generatorstates
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete", "deletecollection"]
  - apiGroups: ["external-secrets.io"]
    resources:
      - externalsecrets
      - externalsecrets/status
      - externalsecrets/finalizers
      - secretstores
      - secretstores/status
      - secretstores/finalizers
      - clustersecretstores
      - clustersecretstores/status
      - clustersecretstores/finalizers
      - clusterexternalsecrets
      - clusterexternalsecrets/status
      - clusterexternalsecrets/finalizers
      - pushsecrets
      - pushsecrets/status
      - pushsecrets/finalizers
      - clusterpushsecrets
      - clusterpushsecrets/status
      - clusterpushsecrets/finalizers
    verbs: ["get", "update", "patch"]
  - apiGroups: ["generators.external-secrets.io"]
    resources:
      - acraccesstokens
      - ecrauthorizationtokens
      - fakes
      - gcraccesstokens
      - githubaccesstokens
      - passwords
      - vaultdynamicsecrets
      - webhooks
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["serviceaccounts", "namespaces"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "delete", "patch"]
  - apiGroups: [""]
    resources: ["serviceaccounts/token"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  - apiGroups: ["external-secrets.io"]
    resources:
      - externalsecrets
      - pushsecrets
      - clusterpushsecrets
    verbs: ["create", "update", "delete"]
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: external-secrets-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: external-secrets-controller
subjects:
  - kind: ServiceAccount
    name: external-secrets
    namespace: ${SHOGGOTH_NAMESPACE}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: external-secrets-leaderelection
  namespace: ${SHOGGOTH_NAMESPACE}
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["external-secrets-controller"]
    verbs: ["get", "update", "patch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: external-secrets-leaderelection
  namespace: ${SHOGGOTH_NAMESPACE}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: external-secrets-leaderelection
subjects:
  - kind: ServiceAccount
    name: external-secrets
    namespace: ${SHOGGOTH_NAMESPACE}
---
# Note: this Secret is created EMPTY (no `data:`). The cert-controller
# populates it via `update`/`patch` (its RBAC is scoped to this exact name).
# Mirrors upstream deploy/charts/external-secrets/templates/webhook-secret.yaml.
# Without this object the cert-controller cannot create the Secret itself (no
# `create` verb in its RBAC), and the webhook Deployment stays Pending because
# its `certs` volume mount has nothing to mount.
apiVersion: v1
kind: Secret
metadata:
  name: external-secrets-webhook
  namespace: ${SHOGGOTH_NAMESPACE}
  labels:
    external-secrets.io/component: webhook
    app.kubernetes.io/part-of: external-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: external-secrets-webhook
  namespace: ${SHOGGOTH_NAMESPACE}
  labels:
    external-secrets.io/component: webhook
spec:
  type: ClusterIP
  ports:
    - port: 443
      targetPort: 10250
      protocol: TCP
      name: webhook
  selector:
    app.kubernetes.io/name: external-secrets-webhook
    app.kubernetes.io/part-of: external-secrets
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: external-secrets-cert-controller
  namespace: ${SHOGGOTH_NAMESPACE}
  labels:
    app.kubernetes.io/name: external-secrets-cert-controller
    app.kubernetes.io/part-of: external-secrets
spec:
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app.kubernetes.io/name: external-secrets-cert-controller
      app.kubernetes.io/part-of: external-secrets
  template:
    metadata:
      labels:
        app.kubernetes.io/name: external-secrets-cert-controller
        app.kubernetes.io/part-of: external-secrets
    spec:
      serviceAccountName: external-secrets-cert-controller
      automountServiceAccountToken: true
      initContainers:
        - name: upgrade-cleanup
          image: asherikov/shoggoth_tools:alpine
          imagePullPolicy: IfNotPresent
          command: ['bash', '-c']
          args:
            - |
              set -eu
              echo "[upgrade-cleanup] deleting stale ESO ValidatingWebhookConfigurations..."
              STALE_VWCS=$(kubectl get validatingwebhookconfigurations -o name \
                | grep -E '(secretstore-validate|externalsecret-validate)$' || true)
              if [ -n "$STALE_VWCS" ]; then
                echo "$STALE_VWCS" | sed 's/^/  /'
                echo "$STALE_VWCS" | xargs -r kubectl delete --ignore-not-found=true --wait=true
              else
                echo "  (none; clean slate)"
              fi
              echo "[upgrade-cleanup] done."
              echo "[upgrade-cleanup] NOTE: ESO Deployments and external-secrets.io CRDs are"
              echo "[upgrade-cleanup] managed by make up (Pass 1/2 with --server-side=true"
              echo "[upgrade-cleanup] --force-conflicts) and must NOT be deleted here, since"
              echo "[upgrade-cleanup] Pass 1/2 apply them in the same `make up` run; rerun"
              echo "[upgrade-cleanup] `make up` if stale CRDs/Deployments block the rollout."
      containers:
        - name: cert-controller
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
          image: ghcr.io/external-secrets/external-secrets:v2.11.0
          imagePullPolicy: IfNotPresent
          args:
            - certcontroller
            - --crd-requeue-interval=5m
            - --service-name=external-secrets-webhook
            - --service-namespace=${SHOGGOTH_NAMESPACE}
            - --secret-name=external-secrets-webhook
            - --secret-namespace=${SHOGGOTH_NAMESPACE}
            - --metrics-addr=:8080
            - --healthz-addr=:8081
            - --loglevel=info
            - --zap-time-encoding=epoch
            - --enable-partial-cache=true
          ports:
            - containerPort: 8080
              protocol: TCP
              name: metrics
          readinessProbe:
            httpGet:
              port: 8081
              path: /readyz
            initialDelaySeconds: 20
            periodSeconds: 5
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: external-secrets
  namespace: ${SHOGGOTH_NAMESPACE}
  labels:
    app.kubernetes.io/name: external-secrets
    app.kubernetes.io/part-of: external-secrets
spec:
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app.kubernetes.io/name: external-secrets
      app.kubernetes.io/part-of: external-secrets
  template:
    metadata:
      labels:
        app.kubernetes.io/name: external-secrets
        app.kubernetes.io/part-of: external-secrets
    spec:
      serviceAccountName: external-secrets
      automountServiceAccountToken: true
      dnsPolicy: None
      dnsConfig:
        nameservers:
          - ${SHOGGOTH_DNS_IP}
        searches:
          - ${SHOGGOTH_NAMESPACE}.svc.cluster.local
          - svc.cluster.local
          - cluster.local
      containers:
        - name: external-secrets
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
          image: ghcr.io/external-secrets/external-secrets:v2.11.0
          imagePullPolicy: IfNotPresent
          args:
            - --concurrent=1
            - --metrics-addr=:8080
            - --live-addr=:8081
            - --loglevel=info
            - --namespace=${SHOGGOTH_NAMESPACE}
            - --zap-time-encoding=epoch
          ports:
            - containerPort: 8080
              protocol: TCP
              name: metrics
            - containerPort: 8081
              protocol: TCP
              name: ready
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 128Mi
              cpu: 500m
          readinessProbe:
            httpGet:
              port: 8081
              path: /healthz
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 30
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: external-secrets-webhook
  namespace: ${SHOGGOTH_NAMESPACE}
  labels:
    app.kubernetes.io/name: external-secrets-webhook
    app.kubernetes.io/part-of: external-secrets
spec:
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app.kubernetes.io/name: external-secrets-webhook
      app.kubernetes.io/part-of: external-secrets
  template:
    metadata:
      labels:
        app.kubernetes.io/name: external-secrets-webhook
        app.kubernetes.io/part-of: external-secrets
    spec:
      serviceAccountName: external-secrets-webhook
      automountServiceAccountToken: true
      initContainers:
        - name: register-vwc
          image: asherikov/shoggoth_tools:alpine
          imagePullPolicy: IfNotPresent
          command: ['bash', '-c']
          args:
            - |
              set -eu
              NS=${SHOGGOTH_NAMESPACE}
              echo "[register-vwc] verifying webhook Service object exists..."
              if ! OUT=$$(kubectl -n "$NS" get service external-secrets-webhook -o name 2>&1); then
                echo "FAIL: cannot read webhook Service in namespace $NS."
                echo "      kubectl output: $$OUT"
                echo "      Likely causes: Service not yet created (Pass 2 not run),"
                echo "      or webhook SA missing 'get services' RBAC."
                exit 1
              fi
              echo "  Service exists: $$OUT"
              echo "[register-vwc] applying VWC from /vwc/vwc.yaml..."
              kubectl apply -f /vwc/vwc.yaml
              echo "[register-vwc] waiting for cert-controller to populate caBundle (timeout 60s)..."
              CA_READY=
              for i in $(seq 1 30); do
                EMPTY=0
                for vwc in secretstore-validate externalsecret-validate; do
                  CABUNDLE=$(kubectl get validatingwebhookconfiguration "$vwc" -o jsonpath='{.webhooks[0].clientConfig.caBundle}' 2>/dev/null || echo "")
                  if [ -z "$CABUNDLE" ]; then
                    EMPTY=1
                    break
                  fi
                done
                if [ "$EMPTY" = "0" ]; then
                  echo "  caBundle populated on all VWCs after $((i*2))s."
                  CA_READY=1
                  break
                fi
                sleep 2
              done
              if [ -z "$CA_READY" ]; then
                echo "FAIL: caBundle not populated on VWC(s) after 60s; cert-controller is not patching."
                echo "      Diagnostics:"
                kubectl -n "$NS" logs -l app.kubernetes.io/name=external-secrets-cert-controller --tail=50 2>&1 || true
                exit 1
              fi
              echo "[register-vwc] done."
          volumeMounts:
            - name: vwc-config
              mountPath: /vwc
      containers:
        - name: webhook
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
          image: ghcr.io/external-secrets/external-secrets:v2.11.0
          imagePullPolicy: IfNotPresent
          args:
            - webhook
            - --port=10250
            - --dns-name=external-secrets-webhook.${SHOGGOTH_NAMESPACE}.svc
            - --cert-dir=/tmp/certs
            - --check-interval=5m
            - --metrics-addr=:8080
            - --healthz-addr=:8081
            - --loglevel=info
            - --zap-time-encoding=epoch
          ports:
            - containerPort: 8080
              protocol: TCP
              name: metrics
            - containerPort: 10250
              protocol: TCP
              name: webhook
          startupProbe:
            httpGet:
              port: 8081
              path: /readyz
            failureThreshold: 12
            periodSeconds: 5
          readinessProbe:
            httpGet:
              port: 8081
              path: /readyz
            initialDelaySeconds: 20
            periodSeconds: 5
          volumeMounts:
            - name: certs
              mountPath: /tmp/certs
              readOnly: true
      volumes:
        - name: certs
          secret:
            secretName: external-secrets-webhook
        - name: vwc-config
          configMap:
            name: external-secrets-webhooks-vwc
---
# Note: ValidatingWebhookConfiguration YAML is stored in the
# external-secrets-webhooks-vwc ConfigMap and is applied by the register-vwc
# init container in the external-secrets-webhook Deployment, once the
# Service object exists and the cert-controller has populated caBundle.
# We intentionally do NOT wait for Service endpoints — that would be
# circular (endpoints are populated from this Pod's own IP, which only
# becomes available after the readiness probe runs, which only runs after
# this init container completes).
