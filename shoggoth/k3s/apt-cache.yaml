apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: apt-cache
  namespace: ${SHOGGOTH_NAMESPACE}
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: local-path
---
apiVersion: v1
kind: Service
metadata:
  name: apt-cache
  namespace: ${SHOGGOTH_NAMESPACE}
spec:
  selector:
    app: apt-cache
  ports:
  - name: http
    port: 80
    targetPort: 3142
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: apt-cache
  namespace: ${SHOGGOTH_NAMESPACE}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: apt-cache
  template:
    metadata:
      labels:
        app: apt-cache
    spec:
      dnsPolicy: None
      dnsConfig:
        nameservers:
        - ${SHOGGOTH_DNS_IP}
        searches:
        - ${SHOGGOTH_NAMESPACE}.svc.cluster.local
        - svc.cluster.local
        - cluster.local
      initContainers: []
      containers:
      - name: apt-cache
        image: sameersbn/apt-cacher-ng:3.7.4-20220421
        imagePullPolicy: IfNotPresent
        env:
        - name: SHOGGOTH_DOMAIN
          value: ${SHOGGOTH_DOMAIN}
        - name: OTEL_TRACES_EXPORTER
          value: otlp
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://otelcol:4318
        ports:
        - containerPort: 3142
          name: http
        resources:
          requests:
            memory: 128Mi
            cpu: 50m
          limits:
            memory: 256Mi
            cpu: 200m
        readinessProbe:
          tcpSocket:
            port: 3142
          initialDelaySeconds: 5
          periodSeconds: 10
          failureThreshold: 30
        livenessProbe:
          tcpSocket:
            port: 3142
          initialDelaySeconds: 15
          periodSeconds: 30
          failureThreshold: 3
        lifecycle:
          postStart:
            exec:
              command:
              - /bin/sh
              - -c
              - chown -R apt-cacher-ng:apt-cacher-ng /var/cache/apt-cacher-ng /var/log/apt-cacher-ng
        volumeMounts:
        - name: cache
          mountPath: /var/cache/apt-cacher-ng
        - name: logs
          mountPath: /var/log/apt-cacher-ng
      volumes:
      - name: cache
        persistentVolumeClaim:
          claimName: apt-cache
      - name: logs
        hostPath:
          path: /var/lib/rancher/k3s/storage/${SHOGGOTH_INSTANCE_DIR}/apt-cache-logs
          type: DirectoryOrCreate
