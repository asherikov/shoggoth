---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: shoggoth-maintenance-secret-writer
  namespace: ${SHOGGOTH_NAMESPACE}
  labels:
    app.kubernetes.io/part-of: shoggoth
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: shoggoth-maintenance-secret-writer-gitea
  namespace: ${SHOGGOTH_NAMESPACE}
  labels:
    app.kubernetes.io/part-of: shoggoth
rules:
# K8s RBAC evaluates resourceNames against the SAR's resource — but for
# create operations no resource exists yet, so the name filter never matches.
# Pair a name-scoped rule (get/update/patch) with a separate unrestricted
# create rule, mirroring the pattern at external-secrets.yaml:108-122.
- apiGroups:
  - ''
  resources:
  - secrets
  resourceNames:
  - gitea-slave-token
  - gitea-runner-token
  verbs:
  - get
  - update
  - patch
- apiGroups:
  - ''
  resources:
  - secrets
  verbs:
  - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: shoggoth-maintenance-secret-writer-redmine
  namespace: ${SHOGGOTH_NAMESPACE}
  labels:
    app.kubernetes.io/part-of: shoggoth
rules:
# slave_token_init.rb is the only legitimate POST caller in the redmine
# pod; the only Secret it ever needs to create is redmine-slave-token. The
# get/update/patch rule is name-scoped; create is left unrestricted (same
# K8s SAR limitation as above) — the privilege narrowing relies on the
# redmine SA's name-filtered read/update/patch on the other Secrets.
- apiGroups:
  - ''
  resources:
  - secrets
  resourceNames:
  - redmine-slave-token
  verbs:
  - get
  - update
  - patch
- apiGroups:
  - ''
  resources:
  - secrets
  verbs:
  - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: shoggoth-maintenance-secret-writer-gitea
  namespace: ${SHOGGOTH_NAMESPACE}
  labels:
    app.kubernetes.io/part-of: shoggoth
subjects:
- kind: ServiceAccount
  name: shoggoth-maintenance-secret-writer
  namespace: ${SHOGGOTH_NAMESPACE}
roleRef:
  kind: Role
  name: shoggoth-maintenance-secret-writer-gitea
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: shoggoth-maintenance-secret-writer-redmine
  namespace: ${SHOGGOTH_NAMESPACE}
  labels:
    app.kubernetes.io/part-of: shoggoth
subjects:
- kind: ServiceAccount
  name: redmine
  namespace: ${SHOGGOTH_NAMESPACE}
roleRef:
  kind: Role
  name: shoggoth-maintenance-secret-writer-redmine
  apiGroup: rbac.authorization.k8s.io
---
# Argo executor permissions for the maintenance workflow pods. The maintenance
# template (shoggoth/workflow/argo/templates/maintenance.yaml:14) runs under
# shoggoth-maintenance-secret-writer to inherit the create-secrets Role above;
# Argo's executor needs argoproj.io/workflowtaskresults (and siblings) writes
# to record step status, which is granted by argo-workflow-executor. Without
# this binding the workflow fails with:
#   workflowtaskresults.argoproj.io is forbidden:
#     cannot create resource "workflowtaskresults" in API group "argoproj.io"
# A separate RoleBinding (rather than duplicating the rules into the gitea /
# redmine Roles) keeps argo-workflow-executor as the single source of truth
# for executor permissions.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: shoggoth-maintenance-secret-writer-argo
  namespace: ${SHOGGOTH_NAMESPACE}
  labels:
    app.kubernetes.io/part-of: shoggoth
subjects:
- kind: ServiceAccount
  name: shoggoth-maintenance-secret-writer
  namespace: ${SHOGGOTH_NAMESPACE}
roleRef:
  kind: Role
  name: argo-workflow-executor
  apiGroup: rbac.authorization.k8s.io
---
# Permissions for the wait-bootstrap init container injected by
# workflowDefaults.podSpecPatch in shoggoth/k3s/argo-workflows.yaml. The
# maintenance template (shoggoth/workflow/argo/templates/maintenance.yaml:14)
# overrides serviceAccountName to shoggoth-maintenance-secret-writer to
# inherit the create-secrets Role above, but it does not override
# podSpecPatch, so every workflow pod — including the maintenance pod —
# runs the `kubectl wait --for=condition=Ready ... externalsecret/<name>`
# init container under that SA. `kubectl wait` performs an internal
# LIST + WATCH, not just GET, so it needs list/watch on the four
# ExternalSecrets the maintenance workflow transitively depends on
# (gitea-slave-token via the git-cred sidecar, ssh-slave-private-key the
# same way). Without list/watch the pod fails with:
#   Failed to watch ... cannot list resource "externalsecrets" in API
#   group "external-secrets.io" ... reflector.go:200
# and the init container sits at 403 for the full 10-minute timeout,
# blocking the pod before any step runs. Reuses the
# argo-workflow-controller-bootstrap-wait Role (same scoped get+list+watch
# rules, same four resourceNames) so the rule definitions stay in one
# place — matching the pattern of the argo RoleBinding above.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: shoggoth-maintenance-secret-writer-bootstrap-wait
  namespace: ${SHOGGOTH_NAMESPACE}
  labels:
    app.kubernetes.io/part-of: shoggoth
subjects:
- kind: ServiceAccount
  name: shoggoth-maintenance-secret-writer
  namespace: ${SHOGGOTH_NAMESPACE}
roleRef:
  kind: Role
  name: argo-workflow-controller-bootstrap-wait
  apiGroup: rbac.authorization.k8s.io
