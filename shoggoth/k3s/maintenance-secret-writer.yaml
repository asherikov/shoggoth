---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: shoggoth-maintenance-secret-writer
  namespace: ${SHOGGOTH_NAMESPACE}
  labels:
    app.kubernetes.io/part-of: shoggoth
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: shoggoth-maintenance-secret-writer-gitea
  namespace: ${SHOGGOTH_NAMESPACE}
  labels:
    app.kubernetes.io/part-of: shoggoth
rules:
# K8s RBAC evaluates resourceNames against the SAR's resource — but for
# create operations no resource exists yet, so the name filter never matches.
# Pair a name-scoped rule (get/update/patch) with a separate unrestricted
# create rule, mirroring the pattern at external-secrets.yaml:108-122.
- apiGroups:
  - ''
  resources:
  - secrets
  resourceNames:
  - gitea-slave-token
  - gitea-runner-token
  verbs:
  - get
  - update
  - patch
- apiGroups:
  - ''
  resources:
  - secrets
  verbs:
  - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: shoggoth-maintenance-secret-writer-redmine
  namespace: ${SHOGGOTH_NAMESPACE}
  labels:
    app.kubernetes.io/part-of: shoggoth
rules:
# slave_token_init.rb is the only legitimate POST caller in the redmine
# pod; the only Secret it ever needs to create is redmine-slave-token. The
# get/update/patch rule is name-scoped; create is left unrestricted (same
# K8s SAR limitation as above) — the privilege narrowing relies on the
# redmine SA's name-filtered read/update/patch on the other Secrets.
- apiGroups:
  - ''
  resources:
  - secrets
  resourceNames:
  - redmine-slave-token
  verbs:
  - get
  - update
  - patch
- apiGroups:
  - ''
  resources:
  - secrets
  verbs:
  - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: shoggoth-maintenance-secret-writer-gitea
  namespace: ${SHOGGOTH_NAMESPACE}
  labels:
    app.kubernetes.io/part-of: shoggoth
subjects:
- kind: ServiceAccount
  name: shoggoth-maintenance-secret-writer
  namespace: ${SHOGGOTH_NAMESPACE}
- kind: ServiceAccount
  name: kestra
  namespace: ${SHOGGOTH_NAMESPACE}
roleRef:
  kind: Role
  name: shoggoth-maintenance-secret-writer-gitea
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: shoggoth-maintenance-secret-writer-redmine
  namespace: ${SHOGGOTH_NAMESPACE}
  labels:
    app.kubernetes.io/part-of: shoggoth
subjects:
- kind: ServiceAccount
  name: redmine
  namespace: ${SHOGGOTH_NAMESPACE}
roleRef:
  kind: Role
  name: shoggoth-maintenance-secret-writer-redmine
  apiGroup: rbac.authorization.k8s.io
