    ---
    name: memory-schema
    description: "Schema lifecycle management for Basic Memory: discover unschemaed notes, infer schemas, create and edit schema definitions, validate notes, and detect drift. Use when working with structured note types (Task, Person, Meeting, etc.) to maintain consistency across the knowledge graph."
    ---

    # Memory Schema

    Manage structured note types using Basic Memory's Picoschema system. Schemas define what fields a note type should have, making notes uniform, queryable, and validatable.

    ## When to Use

    - **New note type emerging** — you notice several notes share the same structure (meetings, people, decisions)
    - **Validation check** — confirm existing notes conform to their schema
    - **Schema drift** — detect fields that notes use but the schema doesn't define (or vice versa)
    - **Schema evolution** — add/remove/change fields as requirements evolve
    - **On demand** — user asks to create, check, or manage schemas

    ## Picoschema Syntax Reference

    Schemas are defined in YAML frontmatter using Picoschema — a compact notation for describing note structure.

    ### Basic Types

    ```yaml
    schema:
      name: string, person's full name
      age: integer, age in years
      score: number, floating-point rating
      active: boolean, whether currently active
    ```

    Supported types: `string`, `integer`, `number`, `boolean`.

    ### Optional Fields

    Append `?` to the field name:

    ```yaml
    schema:
      title: string, required field
      subtitle?: string, optional field
    ```

    ### Enums

    Use `(enum)` with a list of allowed values:

    ```yaml
    schema:
      status(enum): [active, blocked, done, abandoned], current state
    ```

    Optional enum:

    ```yaml
    schema:
      priority?(enum): [low, medium, high, critical], task priority
    ```

    ### Arrays

    Use `(array)` for list fields:

    ```yaml
    schema:
      tags(array): string, categorization labels
      steps?(array): string, ordered steps to complete
    ```

    ### Relations

    Reference other entity types directly:

    ```yaml
    schema:
      parent_task?: Task, parent task if this is a subtask
      attendees?(array): Person, people who attended
    ```

    Relations create edges in the knowledge graph, linking notes together.

    ### Validation Settings

    ```yaml
    settings:
      validation: warn    # warn (log issues) or error (strict)
    ```

    ### Complete Example

    ```yaml
    ---
    title: Meeting
    type: schema
    entity: Meeting
    version: 1
    schema:
      topic: string, what was discussed
      date: string, when it happened (YYYY-MM-DD)
      attendees?(array): Person, who attended
      decisions?(array): string, decisions made
      action_items?(array): string, follow-up tasks
      status?(enum): [scheduled, completed, cancelled], meeting state
    settings:
      validation: warn
    ---
    ```

    ## Discovering Unschemaed Notes

    Look for clusters of notes that share structure but have no schema:

    1. **Search by type**: `search_notes(query="type:Meeting")` — if many notes share a `type` but no `schema/Meeting.md` exists, it's a candidate.

    2. **Infer a schema**: Use `schema_infer` to analyze existing notes and generate a suggested schema:
       ```python
       schema_infer(noteType="Meeting")
       schema_infer(noteType="Meeting", threshold=0.5)  # fields in 50%+ of notes
       ```
       The threshold (0.0–1.0) controls how common a field must be to be included. Default is usually fine; lower it to catch rarer fields.

    3. **Review the suggestion** — the inferred schema shows field names, types, and frequency. Decide which fields to keep, make optional, or drop.

    ## Creating a Schema

    Write the schema note to `schema/<EntityName>`:

    ```python
    write_note(
      title="Meeting",
      directory="schema",
      note_type="schema",
      metadata={
        "entity": "Meeting",
        "version": 1,
        "schema": {
          "topic": "string, what was discussed",
          "date": "string, when it happened",
          "attendees?(array)": "Person, who attended",
          "decisions?(array)": "string, decisions made"
        },
        "settings": {"validation": "warn"}
      },
      content="""# Meeting

    Schema for meeting notes.

    ## Observations
    - [convention] Meeting notes live in memory/meetings/ or as daily entries
    - [convention] Always include date and topic
    - [convention] Action items should become tasks when complex"""
    )
    ```

    ### Key Principles

    - **Schema notes live in `schema/`** — one note per entity type
    - **`note_type="schema"`** marks it as a schema definition
    - **`entity: Meeting`** in metadata names the type it applies to
    - **`version: 1`** in metadata — increment when making breaking changes
    - **`settings.validation: warn`** is recommended to start — it logs issues without blocking writes

    ## Validating Notes

    Check how well existing notes conform to their schema:

    ```python
    # Validate all notes of a type
    schema_validate(noteType="Meeting")

    # Validate a single note
    schema_validate(identifier="meetings/2026-02-10-standup")
    ```

    **Important:** `schema_validate` checks for schema fields as **observation categories** in the note body — e.g., a `status` field expects `- [status] active` as an observation. Fields stored only in frontmatter metadata won't satisfy validation. To pass cleanly, include schema fields as both frontmatter values (for metadata search) and observations (for schema validation).

    Validation reports:
    - **Missing required fields** — the note lacks a field the schema requires (as an observation category)
    - **Unknown fields** — the note has fields the schema doesn't define
    - **Type mismatches** — a field value doesn't match the expected type
    - **Invalid enum values** — a value isn't in the allowed set

    ### Handling Validation Results

    - **`warn` mode**: Review warnings periodically. Fix notes that are clearly wrong; add optional fields to the schema for legitimate new patterns.
    - **`error` mode**: Use for strict schemas where conformance matters (e.g., automated pipelines consuming notes).

    ## Detecting Drift

    Over time, notes evolve and schemas lag behind. Use `schema_diff` to find divergence:

    ```python
    schema_diff(noteType="Meeting")
    ```

    Diff reports:
    - **Fields in notes but not in schema** — candidates for adding to the schema (as optional)
    - **Schema fields rarely used** — consider making optional or removing
    - **Type inconsistencies** — fields used as different types across notes

    ## Schema Evolution

    When note structure changes:

    1. **Run diff** to see current state: `schema_diff(noteType="Meeting")`
    2. **Update the schema note** via `edit_note`:
       ```python
       edit_note(
         identifier="schema/Meeting",
         operation="find_replace",
         find_text="version: 1",
         content="version: 2",
         expected_replacements=1
       )
       ```
    3. **Add/remove/modify fields** in the `schema:` block
    4. **Re-validate** to confirm existing notes still pass: `schema_validate(noteType="Meeting")`
    5. **Fix outliers** — update notes that don't conform to the new schema

    ### Evolution Guidelines

    - **Additive changes** (new optional fields) are safe — no version bump needed
    - **Breaking changes** (new required fields, removed fields, type changes) should bump `version`
    - **Prefer optional over required** — most fields should be optional to start
    - **Don't over-constrain** — schemas should describe common structure, not enforce rigid templates
    - **Schema as documentation** — even if validation is set to `warn`, the schema serves as living documentation for what notes of that type should contain

    ## Workflow Summary

    ```
    1. Notice repeated note structure → infer schema (schema_infer)
    2. Review + create schema note   → write to schema/ (write_note)
    3. Validate existing notes       → check conformance (schema_validate)
    4. Fix outliers                  → edit non-conforming notes (edit_note)
    5. Periodically check drift      → detect divergence (schema_diff)
    6. Evolve schema as needed       → update schema note (edit_note)
    ```
  redmine-cli-skill.md: |
    ---
    name: redmine-cli
    description: Use the `redmine` CLI to interact with Redmine. Activate when the user asks to create, list, update, close, or search issues, log or view time entries, manage versions or memberships, query projects/users/groups, or perform any Redmine project management task. Also activate when the user says "redmine", "issue", "ticket", "time entry", or references Redmine workflows.
    ---

    # Redmine CLI

    A CLI for the Redmine REST API. Use `redmine <command> --help` for detailed flags and examples — this skill only covers what `--help` cannot tell you.

    ## Available Commands

    Only these top-level commands exist. Do NOT invent subcommands that aren't listed here — run `redmine <command> --help` to discover subcommands.

    | Command | Purpose |
    |---------|---------|
    | `issues` | Create, list, get, update, close, reopen, assign, comment, delete, search, browse issues; manage watchers and relations (`issues watchers …`, `issues relations …`) |
    | `attachments` | Inspect attachment metadata (`attachments get <id>`) and download attachment files (`attachments download <id>`) using the active profile's auth |
    | `queries` | List Redmine saved queries; reuse them via `issues list --query` / `--query-id` |
    | `projects` | List, get, create, update, archive, unarchive, delete projects; list project members. `--include` on list/get exposes trackers, modules, categories, custom fields, and time-entry activities (Redmine 5.0+ for archive). |
    | `time` | Log, list, get, update, delete, summarize time entries |
    | `versions` | Create, list, get, update, delete project versions (milestones) |
    | `files` | List and upload project-level files (release artifacts) |
    | `memberships` | List, get, create, update, delete project memberships |
    | `users` | List, get, create, update, delete users |
    | `my-account` | Get and update your own Redmine account (works without admin) |
    | `groups` | List, get, create, update, delete groups; add/remove users |
    | `roles` | List and get roles, including their permissions |
    | `categories` | List issue categories |
    | `trackers` | List and get trackers |
    | `statuses` | List issue statuses |
    | `custom-fields` | List and get custom field definitions (admin-only endpoint) |
    | `search` | Search issues, wiki, news, messages, or browse results |
    | `auth` | Login, logout, list, switch, and check status of authentication profiles |
    | `wiki` | List, get, create, update, delete wiki pages |
    | `api` | Make raw authenticated API requests |

    ## Setup

    If the `redmine` command is not found, install it:

    ```bash
    curl -fsSL https://raw.githubusercontent.com/aarondpn/redmine-cli/main/install.sh | bash
    ```

    Then run `redmine auth login` for interactive configuration. Use `redmine config` to verify an existing setup.

    ## Critical Rules

    - **Always use `-o json`** when you need to parse output programmatically. JSON goes to stdout only; stderr is separate.
    - **Use `--limit 0`** to fetch ALL results. The default limit is 100.
    - **All name-accepting flags** (--project, --tracker, --status, --priority, --assignee, --category, --version, --activity) resolve human-readable names automatically. You don't need to look up IDs first.
    - **`--assignee me`** refers to the current API user.
    - **`--status "*"`** shows all issues regardless of status (default is `open`).

    ## When Something Doesn't Work: Stop and Use `--help`

    **Do NOT guess, loop, or retry with invented flags/subcommands.** If a command fails or you're unsure about the correct syntax:

    1. **Run `redmine <command> --help`** (or `redmine <command> <subcommand> --help`) to see the actual available options, flags, and subcommands.
    2. **Read the help output carefully** — it is authoritative and always up to date. Trust it over your own assumptions.
    3. **Never invent flags or subcommands** that aren't shown in `--help`. If you think an option should exist but it doesn't appear in the help, it doesn't exist.
    4. **Do not loop** — if the same command fails twice, stop and re-read the help output. Do not keep retrying with slight variations hoping one will work.
    5. **Parse output with `-o json` and standard JSON tools (jq)** — never use Python scripts, awk hacks, or regex to parse CLI output. The CLI's JSON output is well-structured; use it.
    6. **Ask the user** if the help output doesn't clarify things — that's better than spiraling through failed attempts.

    ## Permission Gotcha: Users & Groups

    Resolving users and groups **by name requires admin privileges**. If you get a permission error:
    - Do NOT retry with the same name
    - Use `me` for the current user
    - To discover user IDs without admin access, extract them from other sources:
      - `redmine issues list --project <project> -o json` — the `assigned_to` and `author` fields contain user IDs and names
      - `redmine memberships list --project <project> -o json` — lists all project members with their IDs
      - `redmine issues get <id> --journals -o json` — journal entries contain user references

    ## Workflow: Resolving Ambiguous Values

    When a command needs a value from a fixed set (tracker, status, priority, category, version, assignee) and you're not sure of the exact name:

    1. **Query options first**: `redmine trackers list -o json`, `redmine statuses list -o json`, etc.
    2. **Present choices to the user** via AskUserQuestion with a formatted list
    3. **Use the confirmed value** in the command

    For users/groups, if the list endpoint fails with a permission error, use the workarounds from the section above instead.

    ## After Creating Resources

    When you create an issue, project, user, or other resource, the CLI returns the new ID. Offer the user a clickable URL so they can open it in the browser:

    - **Issues**: `redmine issues open <id>` opens the issue directly. You can also provide the URL: `<server>/issues/<id>`
    - **Projects**: `<server>/projects/<identifier>`
    - **Users**: `<server>/users/<id>`
    - **Time entries**: `<server>/time_entries/<id>/edit`

    Get the server URL from `redmine config` (or from the JSON output's hints). Always mention the URL or the `open` command after a successful create so the user can quickly navigate to the new resource.

    ## Attachments: Always Download and Inspect Them

    Issues often carry attachments (screenshots, diagrams, logs, PDFs) that contain
    information not present in the text. **Whenever an issue has attachments,
    download them and inspect their contents before answering** - especially
    images, which frequently hold the actual error, mockup, or detail the ticket is
    about.

    1. **Discover attachment IDs**: `redmine issues get <id> --attachments` lists each
       attachment's `id`, `filename`, `size`, and `content_type`. With `-o json` the
       issue's `attachments[]` array is included in the output.
    2. **Download one file**: `redmine attachments download <att-id> -d <dir>` saves it
       under its real filename (or `--path <file>` for an exact path, `--path -` to
       stream to stdout). No `curl`, no manual API-key handling - it reuses the active
       profile's auth.
    3. **Download everything at once**: `redmine issues get <id> --download-attachments <dir>`
       pulls every attachment of the issue into `<dir>` in one step.
    4. **Inspect metadata only** (no download): `redmine attachments get <att-id>`.

    After downloading an image, open/read it and use what it shows. Do not answer a
    question about a ticket with attachments without first looking at them.

    ## Non-Obvious Behaviors

    - `redmine issues list` defaults to `--status open`. Use `--status closed`, `--status "*"`, or a specific status name.
    - `redmine issues get <id> --journals` includes comments/history. Also available: `--children`, `--relations`, `--attachments`.
    - `redmine issues update` only sends flags you explicitly pass — omitted flags are not changed.
    - If `--project` is omitted, the configured default project is used (set via `redmine auth login`).
    - Projects can accumulate hundreds of versions, most of them closed or locked. When you need a version for a new issue, time entry, or similar workflow, always start from `redmine versions list --open` so the shortlist stays small and you don't pick a version that can no longer accept work.
    - Any date flag (`--due-date`, `--date`, `--from`, `--to`) accepts the literal keyword `today` as a shortcut for the current date.
---
apiVersion: batch/v1
kind: Job
metadata:
  name: bringup
  namespace: ${SHOGGOTH_NAMESPACE}
spec:
  ttlSecondsAfterFinished: 86400
  backoffLimit: 6
  template:
    metadata:
      labels:
        app: bringup
    spec:
      dnsPolicy: None
      dnsConfig:
        nameservers:
          - ${DNS_IP}
        searches:
          - ${SHOGGOTH_NAMESPACE}.svc.cluster.local
          - svc.cluster.local
          - cluster.local
      restartPolicy: OnFailure
      serviceAccountName: bringup
      initContainers:
        - name: preflight
          image: busybox:latest
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c"]
          args:
            - |
              echo "bringup preflight: checking dependencies"
              REG="docker-registry.${SHOGGOTH_DOMAIN}"
              echo "bringup preflight: DNS ${REG} -> $(nslookup ${REG} 2>&1 || echo FAILED)"
              echo "bringup preflight: HTTP ${REG} -> $(wget -q -S -O /dev/null --timeout=3 http://${REG}/v2/ 2>&1 || echo FAILED)"
              echo "bringup preflight: OpenBao -> $(wget -q -S -O /dev/null --timeout=3 http://openbao:80/v1/sys/health 2>&1 || echo FAILED)"
              echo "bringup preflight: done"
          resources:
            requests:
              memory: "16Mi"
              cpu: "10m"
            limits:
              memory: "32Mi"
              cpu: "100m"
        - name: wait-openbao
          image: busybox:latest
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c"]
          args:
            - |
              echo "bringup: wait-openbao started"
              while true; do
                if wget -q -S -O /dev/null --timeout=3 http://openbao:80/v1/sys/health 2>&1 | grep -q 'HTTP/'; then
                  echo "bringup: OpenBao responding"
                  exit 0
                fi
                echo "bringup: waiting for OpenBao..."
                sleep 2
              done
          resources:
            requests:
              memory: "32Mi"
              cpu: "50m"
            limits:
              memory: "64Mi"
              cpu: "200m"
        - name: fix-permissions
          image: busybox:latest
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c"]
          args:
            - "find /shoggoth/rendered -mindepth 1 -delete 2>/dev/null; mkdir -p /shoggoth/rendered/certs && chown -R 1000:1000 /shoggoth/rendered"
          securityContext:
            runAsUser: 0
          resources:
            requests:
              memory: "32Mi"
              cpu: "50m"
            limits:
              memory: "64Mi"
              cpu: "200m"
          volumeMounts:
            - name: shared-rendered
              mountPath: /shoggoth/rendered
      containers:
        - name: bringup
          image: asherikov/shoggoth_tools:alpine
          imagePullPolicy: IfNotPresent
          workingDir: /shoggoth/bringup
          command: ["bash", "-c"]
          args:
            - "bash /shoggoth/bringup/bringup.sh 2>&1 | tee /shoggoth/rendered/bringup.log; exit ${PIPESTATUS[0]}"
          securityContext:
            runAsUser: 0
          env:
            - name: SHOGGOTH_DOMAIN
              value: "${SHOGGOTH_DOMAIN}"
            - name: SHOGGOTH_GITHUB_ORG
              value: "${SHOGGOTH_GITHUB_ORG}"
            - name: OPENBAO_ADDR
              value: "http://openbao:80"
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "1Gi"
              cpu: "2000m"
          volumeMounts:
            - name: bringup-scripts
              mountPath: /shoggoth/bringup
            - name: bringup-templates
              mountPath: /shoggoth/bringup/templates
              readOnly: true
            - name: private
              mountPath: /shoggoth/private
              readOnly: true
            - name: openbao-data
              mountPath: /openbao-data
            - name: rendered
              mountPath: /shoggoth/bringup/rendered
            - name: shared-rendered
              mountPath: /shoggoth/rendered
            - name: plugin
              mountPath: /shoggoth/ai/plugin
              readOnly: true
      volumes:
        - name: bringup-scripts
          configMap:
            name: bringup-scripts
        - name: bringup-templates
          configMap:
            name: bringup-templates
            defaultMode: 0755
        - name: private
          hostPath:
            path: /var/lib/rancher/k3s/storage/${SHOGGOTH_INSTANCE_DIR}/private
            type: DirectoryOrCreate
        - name: openbao-data
          persistentVolumeClaim:
            claimName: openbao-data
        - name: rendered
          emptyDir: {}
        - name: shared-rendered
          hostPath:
            path: /var/lib/rancher/k3s/storage/${SHOGGOTH_INSTANCE_DIR}/rendered
            type: DirectoryOrCreate
        - name: plugin
          configMap:
            name: bringup-plugin
            items:
              - key: plugin.json
                path: .claude-plugin/plugin.json
              - key: caveman-skill.md
                path: skills/caveman/SKILL.md
              - key: kestra-flow-skill.md
                path: skills/kestra-flow/SKILL.md
              - key: memory-defrag-skill.md
                path: skills/memory-defrag/SKILL.md
              - key: memory-ingest-skill.md
                path: skills/memory-ingest/SKILL.md
              - key: memory-lifecycle-skill.md
                path: skills/memory-lifecycle/SKILL.md
              - key: memory-metadata-search-skill.md
                path: skills/memory-metadata-search/SKILL.md
              - key: memory-notes-skill.md
                path: skills/memory-notes/SKILL.md
              - key: memory-reflect-skill.md
                path: skills/memory-reflect/SKILL.md
              - key: memory-schema-skill.md
                path: skills/memory-schema/SKILL.md
              - key: redmine-cli-skill.md
                path: skills/redmine-cli/SKILL.md