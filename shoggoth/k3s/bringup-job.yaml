  caveman-skill.md: |
    ---
    name: caveman
    description: >
      Ultra-compressed communication mode. Cuts token usage ~75% by speaking like caveman
      while keeping full technical accuracy. Supports intensity levels: lite, full (default), ultra,
      wenyan-lite, wenyan-full, wenyan-ultra.
      Use when user says "caveman mode", "talk like caveman", "use caveman", "less tokens",
      "be brief", or invokes /caveman. Also auto-triggers when token efficiency is requested.
    ---

    Respond terse like smart caveman. All technical substance stay. Only fluff die.

    ## Persistence

    ACTIVE EVERY RESPONSE. No revert after many turns. No filler drift. Still active if unsure. Off only: "stop caveman" / "normal mode".

    Default: **full**. Switch: `/caveman lite|full|ultra`.

    ## Rules

    Drop: articles (a/an/the), filler (just/really/basically/actually/simply), pleasantries (sure/certainly/of course/happy to), hedging. Fragments OK. Short synonyms (big not extensive, fix not "implement a solution for"). No tool-call narration, no decorative tables/emoji, no dumping long raw error logs unless asked — quote shortest decisive line. Standard well-known tech acronyms OK (DB/API/HTTP); never invent new abbreviations reader can't decode. Technical terms exact. Code blocks unchanged. Errors quoted exact.

    Preserve user's dominant language. User write Portuguese → reply Portuguese caveman. User write Spanish → reply Spanish caveman. Compress the style, not the language. No forced English openings or status phrases. ALWAYS keep technical terms, code, API names, CLI commands, commit-type keywords (feat/fix/...), and exact error strings verbatim — unless user explicitly ask for translation.

    No self-reference. Never name or announce the style. No "caveman mode on", "me caveman think", no third-person caveman tags. Output caveman-only — never normal answer plus "Caveman:" recap. Exception: user explicitly ask what the mode is.

    Pattern: `[thing] [action] [reason]. [next step].`

    Not: "Sure! I'd be happy to help you with that. The issue you're experiencing is likely caused by..."
    Yes: "Bug in auth middleware. Token expiry check use `<` not `<=`. Fix:"

    ## Intensity

    | Level | What change |
    |-------|------------|
    | **lite** | No filler/hedging. Keep articles + full sentences. Professional but tight |
    | **full** | Drop articles, fragments OK, short synonyms. Classic caveman. No tool-call narration, no decorative tables/emoji, no long raw error-log dumps unless asked. Standard acronyms OK; no invented abbreviations |
    | **ultra** | Abbreviate prose words (DB/auth/config/req/res/fn/impl) — prose words only, never real code symbols/function names. Strip conjunctions, arrows for causality (X → Y), one word when one word enough. Code symbols, function names, API names, error strings: never abbreviate |
    | **wenyan-lite** | Semi-classical. Drop filler/hedging but keep grammar structure, classical register |
    | **wenyan-full** | Maximum classical terseness. Fully 文言文. 80-90% character reduction. Classical sentence patterns, verbs precede objects, subjects often omitted, classical particles (之/乃/為/其) |
    | **wenyan-ultra** | Extreme abbreviation while keeping classical Chinese feel. Maximum compression, ultra terse |

    Example — "Why React component re-render?"
    - lite: "Your component re-renders because you create a new object reference each render. Wrap it in `useMemo`."
    - full: "New object ref each render. Inline object prop = new ref = re-render. Wrap in `useMemo`."
    - ultra: "Inline obj prop → new ref → re-render. `useMemo`."
    - wenyan-lite: "組件頻重繪，以每繪新生對象參照故。以 useMemo 包之。"
    - wenyan-full: "每繪新生對象參照，故重繪；以 useMemo 包之則免。"
    - wenyan-ultra: "新參照→重繪。useMemo Wrap。"

    Example — "Explain database connection pooling."
    - lite: "Connection pooling reuses open connections instead of creating new ones per request. Avoids repeated handshake overhead."
    - full: "Pool reuse open DB connections. No new connection per request. Skip handshake overhead."
    - ultra: "Pool = reuse DB conn. Skip handshake → fast under load."
    - wenyan-full: "池reuse open connection。不每req新開。skip handshake overhead。"
    - wenyan-ultra: "池reuse conn。skip handshake → fast。"

    ## Auto-Clarity

    Drop caveman when:
    - Security warnings
    - Irreversible action confirmations
    - Multi-step sequences where fragment order or omitted conjunctions risk misread
    - Compression itself creates technical ambiguity (e.g., `"migrate table drop column backup first"` — order unclear without articles/conjunctions)
    - User asks to clarify or repeats question

    Resume caveman after clear part done.

    Example — destructive op:
    > **Warning:** This will permanently delete all rows in the `users` table and cannot be undone.
    > ```sql
    > DROP TABLE users;
    > ```
    > Caveman resume. Verify backup exist first.

    ## Boundaries

    Code/commits/PRs: write normal. "stop caveman" or "normal mode": revert. Level persist until changed or session end.
  kestra-flow-skill.md: |
    ---
    name: kestra-flow
    description: Generate, modify, or debug Kestra Flow YAML by fetching the live flow schema and applying the same guardrails used by the Kestra AI Copilot. Use when users ask to create, write, update, or fix a Kestra flow.
    compatibility: Requires curl and network access to https://api.kestra.io/v1/plugins/schemas/flow. No Kestra instance required.
    ---

    # Kestra Flow Skill

    Use this skill to generate production-ready Kestra Flow YAML grounded in the live schema.

    ## When to use

    Use this skill when the request includes:
    - Generating a new Kestra flow from scratch
    - Modifying, extending, or debugging an existing flow
    - Translating a workflow description into valid Kestra YAML

    ## Required inputs

    - A description of the desired flow behavior
    - Namespace (and tenant ID if applicable)
    - Existing flow YAML if the request is a modification

    ## Workflow

    ### Step 1 — Fetch the flow schema

    Fetch the full schema with `curl` and read it directly — do not pipe it through any interpreter:

    ```bash
    curl -s https://api.kestra.io/v1/plugins/schemas/flow
    ```

    Read the raw JSON output to validate every type, property name, and structure used in the output. Do not generate anything before the schema is available.

    ### Step 2 — Collect context

    Identify from the user message or conversation:
    - `id` — flow identifier (preserve if provided)
    - `namespace` — target namespace (preserve if provided)
    - Existing flow YAML (for modification requests)
    - Whether this is an **addition / deletion / modification** or a **full rewrite**

    ### Step 3 — Generate the YAML

    Apply all generation rules below, then output raw YAML only.

    ## Generation rules

    **Schema compliance**
    - Use only task types and properties explicitly defined in the fetched schema. Never invent or guess types or property names.
    - Property keys must be unique within each task or block.

    **Structural preservation**
    - Always preserve root-level `id` and `namespace` if provided.
    - For modification requests, touch only the relevant part. Do not restructure or rewrite unrelated sections.
    - Avoid duplicating existing intent (e.g., replace a log message rather than adding a second one).

    **Triggers**
    - Include at least one trigger if execution should start based on an event or schedule.
    - Do NOT add a `Schedule` trigger unless a regular occurrence is explicitly requested.
    - Trigger outputs are accessed via `{{ trigger.outputName }}`; only use variables defined in the trigger's declared outputs.

    **Looping**
    - Use `ForEach` for repeated actions over a collection.
    - Use `LoopUntil` for condition-based looping.

    **Flow outputs**
    - Only include flow-level `outputs` if the user explicitly requests returning a value from the execution.

    **State tracking between executions**
    - For state-change detection, use KV tasks (`io.kestra.plugin.core.kv.Set` / `io.kestra.plugin.core.kv.Get`) to store and compare state across executions.

    **JDBC plugin**
    - Always set `fetchType: STORE` when using JDBC tasks.

    **Date manipulation in Pebble**
    - Use `dateAdd` and `date` filters for date arithmetic.
    - Apply `| number` before numeric comparisons.

    **Credentials and secrets**
    - Never embed secrets or hardcoded credentials.
    - Use flow `inputs` of type `SECRET` or Pebble expressions (e.g., `{{ secret('MY_SECRET') }}`).

    **APIs and connectivity**
    - Prefer public/unauthenticated APIs unless the user specifies otherwise.
    - Never assume a local port; use remote URLs.

    **Quoting**
    - Prefer double quotes; use single quotes inside double-quoted strings when needed.

    **Error handling**
    - If the request cannot be fulfilled using only schema-defined types and properties, output exactly:
      ```
      I cannot generate a valid Kestra Flow YAML for this request based on the available schema.
      ```

    ## Output format

    - **Raw YAML only** — no prose, no markdown fences, no explanations outside the YAML.
    - Use `#` comments at the top of the output for any caveats, assumptions, or warnings.
    - The output must be ready to paste directly into the Kestra UI or deploy via `kestractl`.

    ## Example prompts

    - "Write a Kestra flow that fetches a public API every hour and stores the result in KV store."
    - "Add a Slack notification task to this existing flow when any task fails."
    - "Generate a flow in namespace `prod.data` that reads from a Postgres table and writes the result to S3."
    - "Debug this flow YAML — it has a trigger variable reference that doesn't exist."
  memory-defrag-skill.md: |
    ---
    name: memory-defrag
    description: "Defragment and reorganize agent memory files: split bloated files, merge duplicates, remove stale information, and restructure the memory hierarchy. Use when memory files have grown unwieldy, contain redundancies, or need reorganization. Run periodically (weekly) or on demand."
    ---

    # Memory Defrag

    Reorganize memory files for clarity, efficiency, and relevance. Like filesystem defragmentation but for knowledge.

    ## When to Run

    - **Periodic**: Weekly or biweekly via cron (recommended)
    - **On demand**: User asks to clean up, reorganize, or defrag memory
    - **Threshold**: When MEMORY.md exceeds ~500 lines or daily notes accumulate without consolidation

    ## Process

    ### 1. Audit Current State

    Inventory all memory files:
    ```
    MEMORY.md           — long-term memory
    memory/             — daily notes, tasks, topical files
    memory/tasks/       — active and completed tasks
    ```

    For each file, note: line count, last modified, topic coverage, staleness.

    ### 2. Identify Problems

    Look for these common issues:

    | Problem | Signal | Fix |
    |---------|--------|-----|
    | **Bloated file** | >300 lines, covers many topics | Split into focused files |
    | **Duplicate info** | Same fact in multiple places | Consolidate to one location |
    | **Stale entries** | References to completed work, old dates, resolved issues | Remove or archive |
    | **Orphan files** | Files in memory/ never referenced or updated | Review, merge, or remove |
    | **Inconsistencies** | Contradictory information across files | Resolve to ground truth |
    | **Poor organization** | Related info scattered across files | Restructure by topic |
    | **Recursive nesting** | `memory/memory/memory/...` directories | Delete nested dirs (indexer bug artifact) |

    ### 3. Plan Changes

    Before making edits, write a brief plan:
    ```markdown
    ## Defrag Plan
    - [ ] Split MEMORY.md "Key People" section → memory/people.md
    - [ ] Remove completed tasks older than 30 days from memory/tasks/
    - [ ] Merge memory/bm-marketing-ideas.md into memory/competitive/
    - [ ] Update stale project status entries in MEMORY.md
    ```

    ### 4. Execute

    Apply changes one at a time:
    - **Split**: Extract sections from large files into focused topical files
    - **Merge**: Combine related small files into coherent documents
    - **Prune**: Remove information that is no longer relevant or accurate
    - **Restructure**: Move files to appropriate directories, rename for clarity
    - **Update**: Fix outdated facts, dates, statuses

    ### 5. Verify & Log

    After changes:
    - Verify no information was lost (compare before/after)
    - Update any cross-references between files
    - Log what was done in today's daily note:

    ```markdown
    ## Memory Defrag (HH:MM)
    - Files reviewed: N
    - Split: [list]
    - Merged: [list]
    - Pruned: [list]
    - Net result: X files, Y total lines (was Z lines)
    ```

    ## Guidelines

    - **Preserve raw daily notes.** Don't delete or modify `memory/YYYY-MM-DD.md` files — they're the audit trail.
    - **Target 15-25 focused files.** Too few means bloated files; too many means fragmentation. Aim for the sweet spot.
    - **File names should be scannable.** Use descriptive names: `people.md`, `project-status.md`, `competitive-landscape.md` — not `notes-2.md`.
    - **Don't over-organize.** One level of directories is usually enough. `memory/tasks/` and `memory/competitive/` are fine; `memory/work/projects/active/basic-memory/notes/` is not.
    - **Completed tasks**: Tasks with `status: done` older than 14 days can be removed. Their insights should already be in MEMORY.md via reflection.
    - **Ask before destructive changes.** If uncertain whether information is still relevant, keep it with a `(review needed)` tag rather than deleting.
  memory-ingest-skill.md: |
    ---
    name: memory-ingest
    description: "Process unstructured external input (meeting transcripts, conversation logs, pasted documents) into structured Basic Memory entities. Extracts entities, searches for existing matches, proposes new entities with approval, creates notes with observations and relations, and captures action items."
    ---

    # Memory Ingest

    Turn raw, unstructured input into structured Basic Memory entities. Meeting transcripts, conversation logs, pasted documents, email threads — anything with information worth preserving gets parsed, cross-referenced against existing knowledge, and written as proper notes.

    ## When to Use

    - User pastes a meeting transcript or conversation log
    - User says "process these notes" or "add this to Basic Memory"
    - User pastes a document, article, or email for knowledge extraction
    - Any time raw external text needs to become structured knowledge

    ## Workflow Overview

    ```
    1. Parse raw input           → identify structure, extract key info
    2. Extract entities          → people, orgs, topics, action items
    3. Search existing entities  → multi-variation queries
    4. Research new entities     → optional web research (see memory-research)
    5. Present entity proposal   → get approval before creating
    6. Create source note        → verbatim content + observations + relations
    7. Create approved entities  → structured notes for each new entity
    8. Extract action items      → follow-ups and commitments
    ```

    ## Step 1: Parse Raw Input

    Read the pasted content and identify its structure:

    - **Format**: Meeting transcript, email thread, conversation log, article, freeform notes
    - **Date**: When this happened (extract from content or ask)
    - **Participants**: Who was involved (names, roles, organizations)
    - **Sections**: Any existing structure (headings, speaker labels, timestamps)

    Don't rewrite or summarize the source content. Preserve it verbatim in the note — you'll add structured observations alongside it.

    ## Step 2: Extract Entities

    Scan the content for entities worth tracking in the knowledge graph:

    | Entity Type | Signals |
    |-------------|---------|
    | **Person** | Names with roles, titles, or affiliations mentioned |
    | **Organization** | Company names, agencies, institutions |
    | **Topic/Concept** | Technical domains, methodologies, standards discussed substantively |
    | **Action Item** | Commitments, deadlines, "I'll do X by Y" statements |

    **Infer type from context.** If someone is introduced as "CTO of Acme Corp", that's both a Person and an Organization entity. If a technology is discussed in depth, it might warrant a Concept entity.

    **Exclude noise.** Not every name mentioned is worth an entity. Filter for:
    - People with substantive roles or interactions (not passing mentions)
    - Organizations discussed in business/technical context
    - Topics with enough detail to warrant their own note

    ## Step 3: Search Existing Entities

    For each extracted entity, search Basic Memory with multiple query variations:

    ```python
    # Person — try full name, last name
    search_notes(query="Sarah Chen")
    search_notes(query="Chen")

    # Organization — try full name, abbreviation, acronym
    search_notes(query="National Renewable Energy Laboratory")
    search_notes(query="NREL")

    # Topic — try the full term and keywords
    search_notes(query="edge computing")
    search_notes(query="edge inference")
    ```

    Classify each entity as:
    - **Existing** — found in Basic Memory. Will link to it with `[[wiki-link]]`.
    - **Proposed** — not found. Will propose creation pending approval.

    ## Step 4: Research New Entities (Optional)

    For proposed entities where more context would be valuable, do a brief web search (2-3 queries max per entity):

    - **Organizations**: What they do, size, public/private, key products
    - **People**: Current role, background, expertise
    - **Topics**: Brief definition, relevance

    Use hedging language ("appears to be", "estimated", "based on public information"). Never fabricate details.

    This step is optional — skip it if the source material provides enough context, or if the user is in a hurry. See the **memory-research** skill for deeper research workflows.

    ## Step 5: Present Entity Proposal

    Before creating anything, present what you found and what you'd like to create:

    ```
    Entities found in Basic Memory:
      - [[Sarah Chen]] (Person — existing)
      - [[Acme Corp]] (Organization — existing)

    Proposed new entities:
      - Jordan Rivera (Person — VP Engineering at NovaTech, mentioned as project lead)
      - NovaTech (Organization — SaaS platform, Series B, discussed as integration partner)
      - Federated Learning (Concept — core technical topic of the discussion)

    Approve all / select individually / skip entity creation?
    ```

    Include enough context with each proposed entity for the user to make a quick decision.

    ## Step 6: Create the Source Note

    Create the primary note for the ingested content. This is the "record of what happened" — it preserves the raw material and adds structured metadata.

    ### Meeting / Conversation Note

    ```python
    write_note(
      title="NovaTech Meeting - Jordan Rivera - Feb 22, 2026",
      directory="meetings/2026",
      note_type="meeting",
      tags=["meeting", "novatech", "federated-learning"],
      metadata={"date": "2026-02-22"},
      content="""
    # NovaTech Meeting - Jordan Rivera - Feb 22, 2026

    Brief one-sentence summary of what this meeting was about.

    ## Transcript
    [Preserve all source content verbatim — do not summarize or rewrite]

    ## Observations
    - [opportunity] NovaTech interested in integration partnership
    - [insight] Their platform handles 10K concurrent sessions, relevant to our scale needs
    - [next_step] Send technical spec document by Friday
    - [sentiment] Strong enthusiasm from their engineering team
    - [decision] Agreed to start with a proof-of-concept integration

    ## Relations
    - attended [[Jordan Rivera]]
    - with [[NovaTech]]
    - discussed [[Federated Learning]]
    - follow_up [[Send NovaTech Technical Spec]]
    """
    )
    ```

    ### Document / Article Note

    ```python
    write_note(
      title="Edge Computing Architecture Whitepaper",
      directory="references",
      note_type="reference",
      tags=["edge-computing", "architecture", "reference"],
      metadata={"source": "https://example.com/whitepaper.pdf", "date_ingested": "2026-02-22"},
      content="""
    # Edge Computing Architecture Whitepaper

    ## Source Content
    [Preserve relevant content — for long documents, include key sections rather than the entire text]

    ## Observations
    - [key_finding] Latency drops 40% with edge inference vs cloud-only
    - [technique] Model sharding across heterogeneous edge nodes
    - [limitation] Requires minimum 8GB RAM per edge node

    ## Relations
    - relates_to [[Edge Computing]]
    - relates_to [[Model Optimization]]
    """
    )
    ```

    ### Observation Categories

    Use categories that capture the nature of the information. Common categories for ingested content:

    | Category | Use For |
    |----------|---------|
    `opportunity` | Business or collaboration opportunities identified |
    `decision` | Decisions made or agreed upon |
    `insight` | Non-obvious understanding gained |
    `next_step` | Concrete action items or follow-ups |
    `sentiment` | Enthusiasm, concerns, hesitations expressed |
    `risk` | Risks or concerns identified |
    `requirement` | Requirements or constraints discovered |
    `key_finding` | Important facts from reference material |
    `technique` | Methods, approaches, or patterns described |
    `context` | Background information that may be useful later |

    Invent categories as needed — these are suggestions, not a fixed list.

    ## Step 7: Create Approved Entities

    For each entity the user approved, create a structured note. Match the entity type to an appropriate template.

    ### Person

    ```python
    write_note(
      title="Jordan Rivera",
      directory="people",
      note_type="person",
      tags=["person", "novatech", "engineering"],
      content="""
    # Jordan Rivera

    ## Overview
    VP of Engineering at NovaTech. Met during integration partnership discussion.

    ## Background
    [Role, expertise, context from meeting + any web research]

    ## Observations
    - [role] VP Engineering at NovaTech
    - [expertise] Distributed systems, federated learning
    - [met] 2026-02-22 during integration discussion

    ## Relations
    - works_at [[NovaTech]]
    - discussed_in [[NovaTech Meeting - Jordan Rivera - Feb 22, 2026]]
    """
    )
    ```

    ### Organization

    ```python
    write_note(
      title="NovaTech",
      directory="organizations",
      note_type="organization",
      tags=["organization", "saas", "integration-partner"],
      content="""
    # NovaTech

    ## Overview
    SaaS platform company. Series B stage.
    [Additional context from meeting + web research]

    ## Products & Services
    [What they offer, if discussed or researched]

    ## Observations
    - [stage] Series B, ~200 employees
    - [relevance] Potential integration partner for our platform
    - [first_contact] 2026-02-22

    ## Relations
    - employs [[Jordan Rivera]]
    - discussed_in [[NovaTech Meeting - Jordan Rivera - Feb 22, 2026]]
    """
    )
    ```

    ### Concept / Topic

    ```python
    write_note(
      title="Federated Learning",
      directory="concepts",
      note_type="concept",
      tags=["concept", "machine-learning", "distributed-systems"],
      content="""
    # Federated Learning

    ## Overview
    [Brief description of the concept from the discussion context]

    ## Observations
    - [definition] Machine learning approach where models train across decentralized data sources
    - [relevance] Core technique discussed in NovaTech integration

    ## Relations
    - discussed_in [[NovaTech Meeting - Jordan Rivera - Feb 22, 2026]]
    """
    )
    ```

    Adapt templates to your domain. The key elements are: type and tags as parameters, an overview section, observations with categories, and relations linking back to the source.

    ## Step 8: Extract Action Items

    Review the source content for commitments and follow-ups:

    ```
    Action Items:
      - Send NovaTech technical spec document by Friday (your commitment)
      - Jordan will share their API documentation by next week (their commitment)

    Follow-Up Reminders:
      - 1 week: Check if Jordan sent API docs
      - 2 weeks: Schedule follow-up call to discuss POC scope
    ```

    If using the **memory-tasks** skill, create Task notes for your action items. Otherwise, capture them as observations in the source note.

    ## Guidelines

    - **Preserve source content verbatim.** The original text is the ground truth. Structure and observations are your interpretation layered on top.
    - **Search before creating.** Always check if entities already exist (see memory-notes search-before-create pattern). Update existing entities with new information rather than creating duplicates.
    - **Get approval for new entities.** Present proposed entities and let the user decide which to create. Don't silently populate the knowledge graph.
    - **Infer, don't interrogate.** Extract entity types and relationships from context. Only ask the user when genuinely ambiguous.
    - **Be selective about entities.** Not every name mentioned deserves its own note. Focus on entities the user will want to reference again.
    - **Use hedging for researched info.** Web research supplements — don't present it as fact. "Appears to be", "estimated", "based on public information".
    - **Link everything back.** Every created entity should relate back to the source note. The source note should link to all entities discussed.
    - **Prose and observations together.** Notes work best with both narrative context and structured observations. Prose gives meaning and tells the story; observations make individual facts searchable. Use the body for context, then distill key facts into categorized observations.
  memory-lifecycle-skill.md: |
    ---
    name: memory-lifecycle
    description: "Manage entity status transitions in Basic Memory: archive completed work, move notes between status folders, update frontmatter, and handle edge cases. Use when marking items complete, archiving old entities, or managing any folder-based status workflow."
    ---

    # Memory Lifecycle

    Manage how entities move through status stages in Basic Memory. The core principle: **archive, never delete.** Completed work is valuable context — move it out of the active view, but keep it in the knowledge graph.

    ## When to Use

    - User says something is "done", "finished", "completed", "submitted", "missed", or "cancelled"
    - Moving entities between status folders (active → archive, pipeline → active, etc.)
    - Reverting a mistaken completion
    - Periodic cleanup of stale active items

    ## Core Principle: Archive, Never Delete

    Deleting a note removes it from the knowledge graph — all its observations, relations, and history disappear. Archiving preserves everything while signaling the entity is no longer active.

    ```
    # Good — entity stays in the knowledge graph
    move_note → active/ to archive/

    # Bad — knowledge is lost
    delete_note
    ```

    The only exception: notes created by mistake (typos, true duplicates) can be deleted.

    ## Folder Conventions

    Organize entities by status using folders. The exact folder names depend on your domain, but follow a consistent pattern:

    ```
    entities/
      active/          # Currently relevant, in-progress
      archive/         # Completed, no longer active, but worth keeping
      pipeline/        # Future items, not yet started
    ```

    For tasks specifically:

    ```
    tasks/
      active/          # Work in progress
      completed/       # Finished work
    ```

    For any entity type with a clear lifecycle:

    ```
    [type]/
      active/          # Current
      [end-state]/     # Whatever "done" means for this type
    ```

    Pick folder names that match your domain. The pattern matters more than the specific names.

    ## Status Detection

    When the user mentions completion or status change, extract the intent:

    | Signal | Status | Action |
    |--------|--------|--------|
    | "finished", "done", "completed", "shipped" | Complete | Move to archive/completed folder |
    | "submitted", "sent", "delivered" | Complete | Move to archive/completed folder |
    | "missed", "passed", "skipped", "expired" | Missed | Move to archive or missed folder |
    | "cancelled", "abandoned", "killed" | Cancelled | Move to archive folder |
    | "paused", "on hold", "deferred" | Paused | Update frontmatter status, keep in place |
    | "restarting", "reopening", "reviving" | Reactivate | Move back to active folder |

    ## Workflow

    ### 1. Find the Entity

    Search Basic Memory with multiple variations to locate the entity:

    ```python
    search_notes(query="quarterly report")
    search_notes(query="Q1 report")
    ```

    If multiple matches come back, present options and ask which one.

    If no match is found, ask for clarification — don't guess.

    ### 2. Move the File

    Use `move_note` to relocate the entity to the appropriate status folder:

    ```python
    move_note(
      identifier="tasks/active/quarterly-report",
      destination_path="tasks/completed/quarterly-report.md"
    )
    ```

    The permalink stays the same, so all existing `[[wiki-links]]` and `memory://` URLs continue to resolve.

    ### 3. Update Frontmatter

    After moving, update the status in frontmatter to match:

    ```python
    edit_note(
      identifier="quarterly-report",
      operation="find_replace",
      find_text="status: active",
      content="status: completed"
    )
    ```

    If there's a completion date field, set it:

    ```python
    edit_note(
      identifier="quarterly-report",
      operation="find_replace",
      find_text="completed:",
      content="completed: 2026-02-22"
    )
    ```

    ### 4. Confirm

    Report what was done concisely:

    ```
    Marked complete: Quarterly Report
      Moved to: tasks/completed/quarterly-report.md
      Status: completed
    ```

    ## Edge Cases

    ### Already Archived

    If the entity is already in an archive/completed folder, notify the user:

    > "Quarterly Report is already in tasks/completed/. Want me to update anything on it?"

    ### Partial Completion

    Sometimes only part of an entity is done. Don't move it — instead, update observations or status notes within the entity to reflect partial progress.

    ### Revert / Reactivate

    If something was archived by mistake, move it back:

    ```python
    move_note(
      identifier="tasks/completed/quarterly-report",
      destination_path="tasks/active/quarterly-report.md"
    )

    edit_note(
      identifier="quarterly-report",
      operation="find_replace",
      find_text="status: completed",
      content="status: active"
    )
    ```

    ### Status Without Movement

    Some status changes don't require a folder move — "paused" or "blocked" items often stay in `active/` with just a frontmatter update. Reserve folder moves for terminal or major state transitions.

    ## Relationship to Other Skills

    - **memory-tasks**: Tasks are a specific lifecycle case. This skill covers the general pattern; memory-tasks covers task-specific fields (steps, current_step, context).
    - **memory-notes**: Use search-before-create (from memory-notes) to find the entity before transitioning it.
    - **memory-defrag**: Periodic defrag can identify stale active items that should be archived.

    ## Guidelines

    - **Archive, never delete.** The knowledge graph benefits from historical context.
    - **Move first, then update frontmatter.** This order ensures the file is in the right place even if the edit step fails.
    - **Permalinks survive moves.** Links to the entity keep working after a `move_note`.
    - **Be concise in confirmations.** The user knows their system — just report what changed.
    - **Ask when ambiguous.** If multiple entities match or the target folder isn't clear, ask rather than guess.
    - **Batch operations are fine.** If the user says "archive all completed tasks", find them all, confirm the list, then move them in sequence.
