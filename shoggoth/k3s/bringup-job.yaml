---
apiVersion: v1
kind: ConfigMap
metadata:
  name: bringup-scripts
  namespace: ${SHOGGOTH_NAMESPACE}
data:
  bao_helpers.sh: |
    #!/usr/bin/env bash
    set -euo pipefail

    OPENBAO_ADDR="${OPENBAO_ADDR:-http://openbao:80}"

    bao_get_value() {
        local path="${1}"
        local tmp response http_code
        tmp="$(mktemp)"
        http_code="$(curl -sL -w '%{http_code}' -o "${tmp}" \
            -H "X-Vault-Token: ${SHOGGOTH_VAULT_TOKEN}" \
            "${OPENBAO_ADDR}/v1/secret/data/${path}" 2>/dev/null || true)"
        response="$(cat "${tmp}" 2>/dev/null || true)"
        rm -f "${tmp}"
        if [ "${http_code}" = "000" ]; then
            echo "shoggoth: ERROR: OpenBao API unreachable for secret/data/${path}" >&2
            return 1
        fi
        if [ "${http_code}" = "404" ]; then
            return 0
        fi
        if [ "${http_code}" != "200" ]; then
            echo "shoggoth: ERROR: OpenBao returned HTTP ${http_code} for secret/data/${path}" >&2
            return 1
        fi
        printf '%s' "${response}" | jq -r '.data.data.value // empty'
    }

    bao_put() {
        local path="${1}"
        local key="${2}"
        local value="${3}"
        local payload http_code
        payload="$(printf '%s' "${value}" | jq -Rs . | jq -c --arg k "${key}" '{"data": {($k): .}}')"
        http_code="$(curl -sL -w '%{http_code}' -o /dev/null \
            -H "X-Vault-Token: ${SHOGGOTH_VAULT_TOKEN}" -H "Content-Type: application/json" \
            -X POST \
            -d "${payload}" \
            "${OPENBAO_ADDR}/v1/secret/data/${path}" 2>/dev/null || true)"
        if [ "${http_code}" != "200" ] && [ "${http_code}" != "204" ]; then
            echo "shoggoth: ERROR: OpenBao PUT failed with HTTP ${http_code} for secret/data/${path}" >&2
            return 1
        fi
    }

    _bao_generate() {
        local style="${1}"
        local length="${2:-32}"
        if [ "${style}" = "hex" ]; then
            openssl rand -hex "${length}"
        else
            openssl rand -base64 "${length}" | tr -dc 'a-zA-Z0-9' | head -c "${length}"
        fi
    }

    bao_get_or_generate() {
        local path="${1}"
        local length="${2:-32}"
        local value
        value="$(bao_get_value "${path}")"
        if [ -n "${value}" ]; then
            printf '%s' "${value}"
            return
        fi
        value="$(_bao_generate base64 "${length}")"
        bao_put "${path}" "value" "${value}"
        printf '%s' "${value}"
    }

    bao_get_or_generate_hex() {
        local path="${1}"
        local length="${2:-24}"
        local value
        value="$(bao_get_value "${path}")"
        if [ -n "${value}" ]; then
            printf '%s' "${value}"
            return
        fi
        value="$(_bao_generate hex "${length}")"
        bao_put "${path}" "value" "${value}"
        printf '%s' "${value}"
    }
  bringup.sh: |
    #!/usr/bin/env bash
    set -euo pipefail
    set +o xtrace

    OPENBAO_ADDR="${OPENBAO_ADDR:-http://openbao:80}"
    BAO_DATA="/openbao-data"
    SECRETS_DIR="/shoggoth/bringup/rendered/secrets"
    TEMPLATES_DIR="/shoggoth/bringup/templates"
    RENDERED_DIR="/shoggoth/bringup/rendered"
    RENDERED_LDAP_DIR="${RENDERED_DIR}/openldap"
    PRIVATE_DIR="/shoggoth/private"

    : "${SHOGGOTH_DOMAIN:?SHOGGOTH_DOMAIN is required}"
    : "${SHOGGOTH_GITHUB_ORG:=}"
    LDAP_BASE_DN="$(printf '%s' "${SHOGGOTH_DOMAIN}" | sed 's/\./,dc=/g; s/^/dc=/')"

    trap 'echo "FATAL: bringup.sh exited with code $? at line ${LINENO}"' ERR

    source /shoggoth/bringup/bao_helpers.sh

    slappasswd() {
        local salt
        salt=$(openssl rand 4)
        local hash
        hash=$(printf '%s%s' "$1" "${salt}" | openssl dgst -sha1 -binary)
        printf '{SSHA}%s' "$(printf '%s%s' "${hash}" "${salt}" | openssl base64 -A)"
    }

    mkdir -p "${SECRETS_DIR}" "${RENDERED_DIR}" "${RENDERED_LDAP_DIR}"

    echo "=== Phase 1: OpenBao init + unseal ==="
    echo "OPENBAO_ADDR=${OPENBAO_ADDR}"
    echo "Resolving openbao: $(getent hosts openbao || echo 'FAILED')"

    INIT_FLAG="${BAO_DATA}/.shoggoth-initialized"
    UNSEAL_KEY_FILE="${BAO_DATA}/.shoggoth-unseal-key"
    ROOT_TOKEN_FILE="${BAO_DATA}/shoggoth/root-token"

    health=$(curl -s "${OPENBAO_ADDR}/v1/sys/health" 2>/dev/null || echo '{}')
    echo "OpenBao health: ${health}"
    initialized=$(printf '%s' "${health}" | jq -r '.initialized | tostring')
    is_sealed=$(printf '%s' "${health}" | jq -r '.sealed | tostring')

    if [ -f "${INIT_FLAG}" ] && [ -f "${UNSEAL_KEY_FILE}" ]; then
        echo "OpenBao already initialized (flag file), unsealing..."
        UNSEAL_KEY=$(cat "${UNSEAL_KEY_FILE}")
        ROOT_TOKEN=$(cat "${ROOT_TOKEN_FILE}")
    elif [ "${initialized}" = "true" ] && [ -f "${UNSEAL_KEY_FILE}" ]; then
        echo "OpenBao already initialized, unsealing..."
        UNSEAL_KEY=$(cat "${UNSEAL_KEY_FILE}")
        ROOT_TOKEN=$(cat "${ROOT_TOKEN_FILE}")
        touch "${INIT_FLAG}"
    elif [ "${initialized}" = "true" ]; then
        echo "OpenBao is initialized but unseal key file missing on PVC, trying K8s Secret backup..."
        K8S_API="https://kubernetes.default.svc"
        SA_TOKEN="$(cat /var/run/secrets/kubernetes.io/serviceaccount/token 2>/dev/null || true)"
        K8S_NS="$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace 2>/dev/null || echo ${SHOGGOTH_NAMESPACE})"
        K8S_CACERT="/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
        SECRET_HTTP_CODE=$(curl -s -o /tmp/k8s-unseal-key.json -w '%{http_code}' \
            --cacert "${K8S_CACERT}" \
            -H "Authorization: Bearer ${SA_TOKEN}" \
            "${K8S_API}/api/v1/namespaces/${K8S_NS}/secrets/openbao-unseal-key" 2>/dev/null || true)
        if [ "${SECRET_HTTP_CODE}" = "200" ]; then
            UNSEAL_KEY=$(jq -r '.data."unseal-key" // empty' < /tmp/k8s-unseal-key.json | base64 -d 2>/dev/null || true)
            ROOT_TOKEN=$(jq -r '.data."root-token" // empty' < /tmp/k8s-unseal-key.json | base64 -d 2>/dev/null || true)
            rm -f /tmp/k8s-unseal-key.json
            if [ -n "${UNSEAL_KEY}" ] && [ -n "${ROOT_TOKEN}" ]; then
                echo "Recovered unseal key and root token from K8s Secret, writing to PVC..."
                printf '%s' "${UNSEAL_KEY}" > "${UNSEAL_KEY_FILE}"
                chmod 400 "${UNSEAL_KEY_FILE}"
                printf '%s' "${ROOT_TOKEN}" > "${ROOT_TOKEN_FILE}"
                chmod 400 "${ROOT_TOKEN_FILE}"
                mkdir -p "${BAO_DATA}/shoggoth"
                touch "${INIT_FLAG}"
            else
                echo "ERROR: OpenBao is initialized, K8s Secret exists but key data is incomplete."
                echo "Cannot recover unseal key. Manual intervention required."
                exit 1
            fi
        else
            echo "ERROR: OpenBao is initialized but no unseal key file exists."
            echo "K8s Secret backup not found (HTTP ${SECRET_HTTP_CODE})."
            echo "Cannot recover unseal key. Manual intervention required."
            exit 1
        fi
    else
        echo "Initializing OpenBao..."
        INIT_HTTP_CODE=$(curl -s -o /tmp/init_response.json -w '%{http_code}' \
            -X PUT "${OPENBAO_ADDR}/v1/sys/init" \
            -H "Content-Type: application/json" \
            -d '{"secret_shares":1,"secret_threshold":1}' 2>/dev/null || true)
        INIT_RESPONSE=$(cat /tmp/init_response.json 2>/dev/null || true)
        echo "Init HTTP code: ${INIT_HTTP_CODE}"
        UNSEAL_KEY=$(printf '%s' "${INIT_RESPONSE}" | jq -r '.unseal_keys_b64[0] // empty' 2>/dev/null || true)
        ROOT_TOKEN=$(printf '%s' "${INIT_RESPONSE}" | jq -r '.root_token // empty' 2>/dev/null || true)
        echo "Parsed unseal_key length: ${#UNSEAL_KEY}, root_token length: ${#ROOT_TOKEN}"
        if [ -z "${UNSEAL_KEY}" ] || [ -z "${ROOT_TOKEN}" ]; then
            echo "ERROR: OpenBao init failed (HTTP ${INIT_HTTP_CODE}). Response: ${INIT_RESPONSE}"
            exit 1
        fi
        echo "Writing key files to ${BAO_DATA}..."
        printf '%s' "${UNSEAL_KEY}" > "${UNSEAL_KEY_FILE}"
        chmod 400 "${UNSEAL_KEY_FILE}"
        printf '%s' "${ROOT_TOKEN}" > "${ROOT_TOKEN_FILE}"
        chmod 400 "${ROOT_TOKEN_FILE}"
        mkdir -p "${BAO_DATA}/shoggoth"
        touch "${INIT_FLAG}"
        echo "Key files written, init flag touched."
        echo "Backing up unseal key and root token to K8s Secret..."
        K8S_API="https://kubernetes.default.svc"
        SA_TOKEN="$(cat /var/run/secrets/kubernetes.io/serviceaccount/token 2>/dev/null || true)"
        K8S_NS="$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace 2>/dev/null || echo ${SHOGGOTH_NAMESPACE})"
        K8S_CACERT="/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
        UNSEAL_KEY_B64=$(printf '%s' "${UNSEAL_KEY}" | base64 -w0)
        ROOT_TOKEN_B64=$(printf '%s' "${ROOT_TOKEN}" | base64 -w0)
        SECRET_PAYLOAD=$(jq -c -n \
            --arg uk "${UNSEAL_KEY_B64}" --arg rt "${ROOT_TOKEN_B64}" \
            '{"apiVersion":"v1","kind":"Secret","metadata":{"name":"openbao-unseal-key","namespace":"${SHOGGOTH_NAMESPACE}"},"type":"Opaque","data":{"unseal-key":$uk,"root-token":$rt}}')
        SECRET_HTTP_CODE=$(curl -s -o /dev/null -w '%{http_code}' \
            --cacert "${K8S_CACERT}" \
            -X PUT \
            -H "Authorization: Bearer ${SA_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "${SECRET_PAYLOAD}" \
            "${K8S_API}/api/v1/namespaces/${K8S_NS}/secrets/openbao-unseal-key" 2>/dev/null || true)
        if [ "${SECRET_HTTP_CODE}" != "200" ] && [ "${SECRET_HTTP_CODE}" != "201" ]; then
            SECRET_HTTP_CODE=$(curl -s -o /dev/null -w '%{http_code}' \
                --cacert "${K8S_CACERT}" \
                -X POST \
                -H "Authorization: Bearer ${SA_TOKEN}" \
                -H "Content-Type: application/json" \
                -d "${SECRET_PAYLOAD}" \
                "${K8S_API}/api/v1/namespaces/${K8S_NS}/secrets" 2>/dev/null || true)
        fi
        echo "K8s Secret backup HTTP code: ${SECRET_HTTP_CODE}"
    fi

    if [ "${is_sealed}" = "false" ]; then
        echo "OpenBao already unsealed, skipping unseal"
    else
    echo "Unsealing OpenBao..."
    UNSEAL_RESPONSE=$(curl -s -o /tmp/unseal_response.json -w '%{http_code}' \
        -X PUT "${OPENBAO_ADDR}/v1/sys/unseal" \
        -H "Content-Type: application/json" \
        -d "{\"key\":\"${UNSEAL_KEY}\"}" 2>/dev/null || true)
    echo "Unseal HTTP code: ${UNSEAL_RESPONSE}"
    UNSEAL_SEALED=$(jq -r '.sealed | tostring' < /tmp/unseal_response.json 2>/dev/null || echo true)
    rm -f /tmp/unseal_response.json
    if [ "${UNSEAL_SEALED}" != "false" ]; then
        echo "Unseal with PVC key failed, trying K8s Secret backup..."
        K8S_API="https://kubernetes.default.svc"
        SA_TOKEN_BAK="$(cat /var/run/secrets/kubernetes.io/serviceaccount/token 2>/dev/null || true)"
        K8S_NS_BAK="$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace 2>/dev/null || echo ${SHOGGOTH_NAMESPACE})"
        K8S_CACERT_BAK="/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
        BAK_HTTP_CODE=$(curl -s -o /tmp/k8s-unseal-bak.json -w '%{http_code}' \
            --cacert "${K8S_CACERT_BAK}" \
            -H "Authorization: Bearer ${SA_TOKEN_BAK}" \
            "${K8S_API}/api/v1/namespaces/${K8S_NS_BAK}/secrets/openbao-unseal-key" 2>/dev/null || true)
        if [ "${BAK_HTTP_CODE}" = "200" ]; then
            BAK_UNSEAL_KEY=$(jq -r '.data."unseal-key" // empty' < /tmp/k8s-unseal-bak.json | base64 -d 2>/dev/null || true)
            BAK_ROOT_TOKEN=$(jq -r '.data."root-token" // empty' < /tmp/k8s-unseal-bak.json | base64 -d 2>/dev/null || true)
            rm -f /tmp/k8s-unseal-bak.json
            if [ -n "${BAK_UNSEAL_KEY}" ] && [ "${BAK_UNSEAL_KEY}" != "${UNSEAL_KEY}" ]; then
                echo "Trying unseal with K8s Secret key..."
                UNSEAL_RESPONSE=$(curl -s -o /tmp/unseal_response2.json -w '%{http_code}' \
                    -X PUT "${OPENBAO_ADDR}/v1/sys/unseal" \
                    -H "Content-Type: application/json" \
                    -d "{\"key\":\"${BAK_UNSEAL_KEY}\"}" 2>/dev/null || true)
                echo "Unseal HTTP code: ${UNSEAL_RESPONSE}"
                UNSEAL_SEALED=$(jq -r '.sealed | tostring' < /tmp/unseal_response2.json 2>/dev/null || echo true)
                rm -f /tmp/unseal_response2.json
                if [ "${UNSEAL_SEALED}" = "false" ]; then
                    echo "Unseal with K8s Secret key succeeded, updating PVC key files..."
                    UNSEAL_KEY="${BAK_UNSEAL_KEY}"
                    ROOT_TOKEN="${BAK_ROOT_TOKEN}"
                    printf '%s' "${UNSEAL_KEY}" > "${UNSEAL_KEY_FILE}"
                    chmod 400 "${UNSEAL_KEY_FILE}"
                    printf '%s' "${ROOT_TOKEN}" > "${ROOT_TOKEN_FILE}"
                    chmod 400 "${ROOT_TOKEN_FILE}"
                fi
            fi
        else
            rm -f /tmp/k8s-unseal-bak.json
        fi
    fi
    if [ "${UNSEAL_SEALED}" != "false" ]; then
        echo "ERROR: OpenBao unseal failed with both PVC and K8s Secret keys"
        exit 1
    fi
    fi

    echo "Ensuring K8s Secret backup of unseal key..."
    K8S_API="https://kubernetes.default.svc"
    SA_TOKEN_BAK="$(cat /var/run/secrets/kubernetes.io/serviceaccount/token 2>/dev/null || true)"
    K8S_NS_BAK="$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace 2>/dev/null || echo ${SHOGGOTH_NAMESPACE})"
    K8S_CACERT_BAK="/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
    BAK_CHECK=$(curl -s -o /dev/null -w '%{http_code}' \
        --cacert "${K8S_CACERT_BAK}" \
        -H "Authorization: Bearer ${SA_TOKEN_BAK}" \
        "${K8S_API}/api/v1/namespaces/${K8S_NS_BAK}/secrets/openbao-unseal-key" 2>/dev/null || true)
    if [ "${BAK_CHECK}" != "200" ]; then
        echo "K8s Secret backup missing, creating..."
        UNSEAL_KEY_B64=$(printf '%s' "${UNSEAL_KEY}" | base64 -w0)
        ROOT_TOKEN_B64=$(printf '%s' "${ROOT_TOKEN}" | base64 -w0)
        SECRET_PAYLOAD=$(jq -c -n \
            --arg uk "${UNSEAL_KEY_B64}" --arg rt "${ROOT_TOKEN_B64}" \
            '{"apiVersion":"v1","kind":"Secret","metadata":{"name":"openbao-unseal-key","namespace":"${SHOGGOTH_NAMESPACE}"},"type":"Opaque","data":{"unseal-key":$uk,"root-token":$rt}}')
        BAK_PUT_HTTP=$(curl -s -o /dev/null -w '%{http_code}' \
            --cacert "${K8S_CACERT_BAK}" \
            -X POST \
            -H "Authorization: Bearer ${SA_TOKEN_BAK}" \
            -H "Content-Type: application/json" \
            -d "${SECRET_PAYLOAD}" \
            "${K8S_API}/api/v1/namespaces/${K8S_NS_BAK}/secrets" 2>/dev/null || true)
        echo "K8s Secret backup created (HTTP ${BAK_PUT_HTTP})"
    else
        echo "K8s Secret backup already exists"
    fi

    export SHOGGOTH_VAULT_TOKEN="${ROOT_TOKEN}"

    MOUNT_CHECK=$(curl -s -o /dev/null -w '%{http_code}' \
        "${OPENBAO_ADDR}/v1/sys/mounts/secret" \
        -H "X-Vault-Token: ${SHOGGOTH_VAULT_TOKEN}" 2>/dev/null || true)
    if [ "${MOUNT_CHECK}" = "200" ]; then
        echo "KV-v2 mount already exists, skipping"
    else
        MOUNT_HTTP_CODE=$(curl -s -o /dev/null -w '%{http_code}' \
            -X POST "${OPENBAO_ADDR}/v1/sys/mounts/secret" \
            -H "X-Vault-Token: ${SHOGGOTH_VAULT_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"type":"kv-v2"}' 2>/dev/null || true)
        echo "KV-v2 mount HTTP code: ${MOUNT_HTTP_CODE}"
    fi

    echo "=== Phase 2: Seed secrets into OpenBao ==="
    [ -f "${PRIVATE_DIR}/gitea-server-token.txt" ] && \
        bao_put "gitea/server-token" "value" "$(cat ${PRIVATE_DIR}/gitea-server-token.txt)"
    [ -f "${PRIVATE_DIR}/redmine-token.txt" ] && \
        bao_put "redmine/api-token" "value" "$(cat ${PRIVATE_DIR}/redmine-token.txt)"
    [ -f "${PRIVATE_DIR}/ollama-cloud-token.txt" ] && \
        bao_put "ollama/cloud-token" "value" "$(cat ${PRIVATE_DIR}/ollama-cloud-token.txt)"

    GITEA_SLAVE_TOKEN=$(bao_get_or_generate "gitea/slave-token" 32)

    SSH_PRIVATE_KEY="$(bao_get_value "ssh/slave-private-key")"
    if [ -z "${SSH_PRIVATE_KEY}" ]; then
        echo "Generating ED25519 SSH key pair..."
        SSH_KEY_DIR="$(mktemp -d)"
        ssh-keygen -t ed25519 -N "" -C "shoggoth-slave" -f "${SSH_KEY_DIR}/id_ed25519" >/dev/null 2>&1
        SSH_PRIVATE_KEY="$(cat "${SSH_KEY_DIR}/id_ed25519")"
        SSH_PUBLIC_KEY="$(cat "${SSH_KEY_DIR}/id_ed25519.pub")"
        rm -rf "${SSH_KEY_DIR}"
        bao_put "ssh/slave-private-key" "value" "${SSH_PRIVATE_KEY}"
        bao_put "ssh/slave-public-key" "value" "${SSH_PUBLIC_KEY}"
    fi

    echo "${SSH_PRIVATE_KEY}" > "${SECRETS_DIR}/ssh-id-rsa"
    chmod 600 "${SECRETS_DIR}/ssh-id-rsa"

    if [ -f "${PRIVATE_DIR}/gitea-user.txt" ]; then
        cp "${PRIVATE_DIR}/gitea-user.txt" "${SECRETS_DIR}/gitea-user"
        chmod 600 "${SECRETS_DIR}/gitea-user"
    fi

    echo "=== Phase 3: Generate database/app secrets ==="
    for svc in kestra redmine cdash; do
        DB_PASS=$(bao_get_or_generate "${svc}/db-password" 32)
        echo "${DB_PASS}" > "${SECRETS_DIR}/${svc}-db-password"
        chmod 600 "${SECRETS_DIR}/${svc}-db-password"
    done

    REDMINE_KEY=$(bao_get_or_generate_hex "redmine/secret-key-base" 24)
    echo "${REDMINE_KEY}" > "${SECRETS_DIR}/redmine-secret-key-base"
    chmod 600 "${SECRETS_DIR}/redmine-secret-key-base"

    GITEA_RUNNER_TOKEN=$(bao_get_or_generate_hex "gitea/runner-token" 24)
    echo "${GITEA_RUNNER_TOKEN}" > "${SECRETS_DIR}/gitea-runner-token"
    chmod 600 "${SECRETS_DIR}/gitea-runner-token"

    for name in admin config-admin sldapauth sslave; do
        PASS=$(bao_get_or_generate "openldap/${name}-password" 32)
        echo "${PASS}" > "${SECRETS_DIR}/openldap-${name}-password"
        chmod 600 "${SECRETS_DIR}/openldap-${name}-password"
    done

    SHOGGOTH_ADMIN_PASSWORD="$(bao_get_or_generate "openldap/admin-password" 32)"
    if [ -f "${PRIVATE_DIR}/admin-password.txt" ]; then
        SHOGGOTH_ADMIN_PASSWORD="$(tr -d '\n\r' < "${PRIVATE_DIR}/admin-password.txt")"
        bao_put "openldap/admin-password" "value" "${SHOGGOTH_ADMIN_PASSWORD}"
    fi
    ADMIN_PASSWORD="${SHOGGOTH_ADMIN_PASSWORD}"
    echo "${ADMIN_PASSWORD}" > "${SECRETS_DIR}/grafana-admin-password"
    echo "${ADMIN_PASSWORD}" > "${SECRETS_DIR}/wireguard-admin-password"
    chmod 600 "${SECRETS_DIR}/grafana-admin-password" "${SECRETS_DIR}/wireguard-admin-password"
    CDASH_APP_KEY=$(bao_get_or_generate "cdash/app-key" 32)
    echo "${CDASH_APP_KEY}" > "${SECRETS_DIR}/cdash-app-key"
    chmod 600 "${SECRETS_DIR}/cdash-app-key"

    echo "=== Phase 4: Render OpenLDAP LDIF files ==="
    export LDAP_BASE_DN SHOGGOTH_DOMAIN

    for tmpl in config.ldif data.ldif memberof_module.ldif; do
        if [ -f "${TEMPLATES_DIR}/openldap_${tmpl}" ]; then
            envsubst < "${TEMPLATES_DIR}/openldap_${tmpl}" > "${RENDERED_LDAP_DIR}/${tmpl}"
        fi
    done
    if [ -f "${TEMPLATES_DIR}/openldap_memberof_overlay.ldif" ]; then
        cp "${TEMPLATES_DIR}/openldap_memberof_overlay.ldif" "${RENDERED_LDAP_DIR}/memberof_overlay.ldif"
    fi

    LDAP_ADMIN_PASS=$(cat "${SECRETS_DIR}/openldap-admin-password")
    LDAP_CONFIG_ADMIN_PASS=$(cat "${SECRETS_DIR}/openldap-config-admin-password")
    LDAP_SLDAUTH_PASS=$(cat "${SECRETS_DIR}/openldap-sldapauth-password")
    LDAP_SSLAVE_PASS=$(cat "${SECRETS_DIR}/openldap-sslave-password")

    export LDAP_ADMIN_PASS LDAP_CONFIG_ADMIN_PASS LDAP_SLDAUTH_PASS LDAP_SSLAVE_PASS

    ADMIN_HASH=$(slappasswd "${LDAP_ADMIN_PASS}")
    CONFIG_ADMIN_HASH=$(slappasswd "${LDAP_CONFIG_ADMIN_PASS}")
    SLDAUTH_HASH=$(slappasswd "${LDAP_SLDAUTH_PASS}")
    SSLAVE_HASH=$(slappasswd "${LDAP_SSLAVE_PASS}")

    export ADMIN_HASH CONFIG_ADMIN_HASH SLDAUTH_HASH SSLAVE_HASH

    if [ -f "${TEMPLATES_DIR}/openldap_passwords.ldif" ]; then
        envsubst < "${TEMPLATES_DIR}/openldap_passwords.ldif" > "${RENDERED_LDAP_DIR}/passwords.ldif"
    fi

    echo "=== Phase 5: Render service env files ==="
    GITEA_SLAVE_TOKEN=$(bao_get_value "gitea/slave-token")
    OLLAMA_CLOUD_TOKEN=$(bao_get_value "ollama/cloud-token")
    GITEA_SERVER_TOKEN=$(bao_get_value "gitea/server-token")
    REDMINE_TOKEN=$(bao_get_value "redmine/api-token")
    CDASH_API_TOKEN=$(bao_get_or_generate "cdash/api-token" 32)

    export GITEA_SLAVE_TOKEN OLLAMA_CLOUD_TOKEN GITEA_SERVER_TOKEN REDMINE_TOKEN CDASH_API_TOKEN
    export SHOGGOTH_ADMIN_PASSWORD
    KESTRA_DATASOURCES_POSTGRES_PASSWORD=$(cat "${SECRETS_DIR}/kestra-db-password")
    export KESTRA_DATASOURCES_POSTGRES_PASSWORD

    for tmpl in gitea-runner_config.yaml litellm_config.yaml \
                web-internal.conf web-external.conf kestra_config.yaml; do
        if [ -f "${TEMPLATES_DIR}/${tmpl}" ]; then
            OUT_NAME=$(echo "${tmpl}" | sed 's/_/-/g')
            envsubst < "${TEMPLATES_DIR}/${tmpl}" > "${RENDERED_DIR}/${OUT_NAME}"
        fi
    done

    echo "=== Phase 5b: Generate service env files ==="
    mkdir -p "${RENDERED_DIR}/kestra" "${RENDERED_DIR}/cdash" "${RENDERED_DIR}/redmine" "${RENDERED_DIR}/gitea"

    printf 'FLOWENV_SHOGGOTH_VAULT_TOKEN=%s\n' "${SHOGGOTH_VAULT_TOKEN}" > "${RENDERED_DIR}/kestra/env"
    printf 'FLOWENV_GITEA_ADMIN_TOKEN=%s\n' "${GITEA_SERVER_TOKEN}" >> "${RENDERED_DIR}/kestra/env"
    printf 'FLOWENV_GITEA_SLAVE_TOKEN=%s\n' "${GITEA_SLAVE_TOKEN}" >> "${RENDERED_DIR}/kestra/env"
    printf 'FLOWENV_SHOGGOTH_GITHUB_ORG=%s\n' "${SHOGGOTH_GITHUB_ORG}" >> "${RENDERED_DIR}/kestra/env"

    LDAP_BIND_DN="uid=sldapauth,ou=people,${LDAP_BASE_DN}"
    LDAP_SLDAUTH_PASS=$(cat "${SECRETS_DIR}/openldap-sldapauth-password")
    LDAP_SSLAVE_PASS=$(cat "${SECRETS_DIR}/openldap-sslave-password")
    CDASH_DB_PASSWORD=$(cat "${SECRETS_DIR}/cdash-db-password")
    CDASH_APP_KEY_RENDERED="base64:$(printf '%s' "$(cat "${SECRETS_DIR}/cdash-app-key")" | base64 -w0)"

    {
        printf 'LDAP_BASE_DN=%s\n' "${LDAP_BASE_DN}"
        printf 'LDAP_HOST=openldap\n'
        printf 'LDAP_BIND_DN=%s\n' "${LDAP_BIND_DN}"
        printf 'LDAP_BIND_PASSWORD=%s\n' "${LDAP_SLDAUTH_PASS}"
        printf 'APP_KEY=%s\n' "${CDASH_APP_KEY_RENDERED}"
        printf 'DB_PASSWORD=%s\n' "${CDASH_DB_PASSWORD}"
        printf 'CDASH_AUTHENTICATION_PROVIDER=ldap\n'
        printf 'LOGIN_FIELD=Username\n'
        printf 'LDAP_HOSTS=openldap\n'
        printf 'LDAP_PORT=389\n'
        printf 'LDAP_PROVIDER=openldap\n'
        printf 'LDAP_LOCATE_USERS_BY=uid\n'
        printf 'LDAP_USERNAME=%s\n' "${LDAP_BIND_DN}"
        printf 'LDAP_PASSWORD=%s\n' "${LDAP_SLDAUTH_PASS}"
        printf 'USER_CREATE_PROJECTS=true\n'
        printf 'TOKEN_DURATION=0\n'
        printf 'OPENLDAP_S_SLAVE_PASSWORD=%s\n' "${LDAP_SSLAVE_PASS}"
        printf 'SHOGGOTH_VAULT_TOKEN=%s\n' "${SHOGGOTH_VAULT_TOKEN}"
        printf 'OPENBAO_ADDR=%s\n' "${OPENBAO_ADDR}"
    } > "${RENDERED_DIR}/cdash/cdash.env"

    {
        printf 'LDAP_BASE_DN=%s\n' "${LDAP_BASE_DN}"
        printf 'LDAP_HOST=openldap\n'
        printf 'LDAP_BIND_DN=%s\n' "${LDAP_BIND_DN}"
        printf 'LDAP_BIND_PASSWORD=%s\n' "${LDAP_SLDAUTH_PASS}"
        printf 'SHOGGOTH_ADMIN_PASSWORD=%s\n' "${SHOGGOTH_ADMIN_PASSWORD}"
    } > "${RENDERED_DIR}/redmine/redmine.env"

    {
        printf 'LDAP_BASE_DN=%s\n' "${LDAP_BASE_DN}"
        printf 'LDAP_HOST=openldap\n'
        printf 'LDAP_BIND_DN=%s\n' "${LDAP_BIND_DN}"
        printf 'LDAP_BIND_PASSWORD=%s\n' "${LDAP_SLDAUTH_PASS}"
        printf 'SHOGGOTH_ADMIN_PASSWORD=%s\n' "${SHOGGOTH_ADMIN_PASSWORD}"
    } > "${RENDERED_DIR}/gitea/gitea.env"

    {
        echo "LDAP_HOST=openldap"
        echo "LDAP_PORT=389"
        echo "LDAP_USERNAME=uid=sldapauth,ou=people,${LDAP_BASE_DN}"
        echo "LDAP_PASSWORD=${LDAP_SLDAUTH_PASS}"
    } > "${RENDERED_DIR}/phpldapadmin.env"

    echo "=== Phase 6: TLS certificate generation ==="
    CERTS_DIR="${RENDERED_DIR}/certs"
    mkdir -p "${CERTS_DIR}"

    if [ ! -f "${CERTS_DIR}/ca.crt" ]; then
        CA_PASS=$(bao_get_or_generate "ca/passphrase" 32)
        openssl genrsa -des3 -passout "pass:${CA_PASS}" -out "${CERTS_DIR}/ca.key" 4096
        openssl req -x509 -new -nodes -key "${CERTS_DIR}/ca.key" \
            -passin "pass:${CA_PASS}" -sha256 -days 3650 \
            -subj "/CN=shoggoth-ca" -out "${CERTS_DIR}/ca.crt"
        openssl genrsa -out "${CERTS_DIR}/server.key" 2048
        openssl req -new -key "${CERTS_DIR}/server.key" \
            -subj "/CN=*.${SHOGGOTH_DOMAIN}" -out "${CERTS_DIR}/server.csr"
        printf 'authorityKeyIdentifier=keyid,issuer\nbasicConstraints=CA:FALSE\nkeyUsage=digitalSignature,keyEncipherment\nsubjectAltName=DNS:*.%s,DNS:%s\n' "${SHOGGOTH_DOMAIN}" "${SHOGGOTH_DOMAIN}" > "${CERTS_DIR}/server.ext"
        openssl x509 -req -in "${CERTS_DIR}/server.csr" \
            -CA "${CERTS_DIR}/ca.crt" -CAkey "${CERTS_DIR}/ca.key" \
            -passin "pass:${CA_PASS}" -CAcreateserial \
            -out "${CERTS_DIR}/server.crt" -days 3650 -sha256 \
            -extfile "${CERTS_DIR}/server.ext"
    fi

    DOCKER_CACHE_CA_DIR="${RENDERED_DIR}/docker-cache-certs"
    mkdir -p "${DOCKER_CACHE_CA_DIR}"
    if [ ! -f "${DOCKER_CACHE_CA_DIR}/ca.key" ] || [ ! -f "${DOCKER_CACHE_CA_DIR}/ca.crt" ]; then
        openssl rsa -in "${CERTS_DIR}/ca.key" -passin "pass:${CA_PASS}" -des3 -passout "pass:foobar" -out "${DOCKER_CACHE_CA_DIR}/ca.key"
        cp "${CERTS_DIR}/ca.crt" "${DOCKER_CACHE_CA_DIR}/ca.crt"
        echo "01" > "${DOCKER_CACHE_CA_DIR}/ca.srl"
        chmod 600 "${DOCKER_CACHE_CA_DIR}/ca.key"
        chmod 644 "${DOCKER_CACHE_CA_DIR}/ca.crt" "${DOCKER_CACHE_CA_DIR}/ca.srl"
    fi

    echo "=== Phase 7: OpenBao LDAP auth configuration ==="
    LDAP_AUTH_ENABLED="$(curl -sf -H "X-Vault-Token: ${SHOGGOTH_VAULT_TOKEN}" \
        "${OPENBAO_ADDR}/v1/sys/auth" 2>/dev/null \
        | grep -q '"ldap/"' && echo true || echo false)"

    if [ "${LDAP_AUTH_ENABLED}" != "true" ]; then
        curl -sfS -X POST "${OPENBAO_ADDR}/v1/sys/auth/ldap" \
            -H "X-Vault-Token: ${SHOGGOTH_VAULT_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"type":"ldap"}' > /dev/null
    fi

    LDAP_BIND_DN="uid=sldapauth,ou=people,${LDAP_BASE_DN}"
    LDAP_SLDAUTH_PASS=$(cat "${SECRETS_DIR}/openldap-sldapauth-password")

    curl -sfS -X POST "${OPENBAO_ADDR}/v1/auth/ldap/config" \
        -H "X-Vault-Token: ${SHOGGOTH_VAULT_TOKEN}" \
        -H "Content-Type: application/json" \
        -d "{\"url\":\"ldap://openldap:389\",\"binddn\":\"${LDAP_BIND_DN}\",\"bindpass\":\"${LDAP_SLDAUTH_PASS}\",\"userdn\":\"ou=people,${LDAP_BASE_DN}\",\"groupdn\":\"ou=groups,${LDAP_BASE_DN}\",\"userattr\":\"uid\",\"groupattr\":\"cn\",\"groupfilter\":\"(member={{.UserDN}})\",\"insecure_tls\":true,\"starttls\":false,\"deny_null_bind\":true,\"username_as_alias\":true}" > /dev/null

    curl -sf -X POST "${OPENBAO_ADDR}/v1/sys/policies/acl/shoggoth-admin" \
        -H "X-Vault-Token: ${SHOGGOTH_VAULT_TOKEN}" \
        -d '{"policy":"path \"secret/data/*\" { capabilities = [\"create\",\"read\",\"update\",\"delete\",\"list\"] }\npath \"sys/*\" { capabilities = [\"read\",\"list\"] }"}' 2>/dev/null || true

    curl -sf -X POST "${OPENBAO_ADDR}/v1/auth/ldap/groups/admins" \
        -H "X-Vault-Token: ${SHOGGOTH_VAULT_TOKEN}" \
        -d '{"policies":"shoggoth-admin"}' 2>/dev/null || true

    echo "=== Phase 8: Qwen Code plugin archive ==="
    if [ -d "/shoggoth/ai/plugin" ]; then
        TMP_DIR=$(mktemp -d)
        cp -a /shoggoth/ai/plugin/* "${TMP_DIR}/"
        if [ -f "${TEMPLATES_DIR}/qwen-extension.json" ]; then
            SHOGGOTH_DOMAIN="${SHOGGOTH_DOMAIN}" envsubst \
                < "${TEMPLATES_DIR}/qwen-extension.json" \
                > "${TMP_DIR}/qwen-extension.json"
        fi
        tar czf "${RENDERED_DIR}/plugin.tar.gz" -C "${TMP_DIR}" .
        rm -rf "${TMP_DIR}"
    fi

    echo "=== Phase 9: Write K8s Secret manifests ==="
    K8S_SECRETS_DIR="${RENDERED_DIR}/k8s-secrets"
    mkdir -p "${K8S_SECRETS_DIR}"

    write_secret() {
        local name="$1" file="$2"
        local key="$3" value_b64="$4"
        printf '{"apiVersion":"v1","kind":"Secret","metadata":{"name":"%s","namespace":"${SHOGGOTH_NAMESPACE}"},"type":"Opaque","data":{"%s":"%s"}}\n' \
            "${name}" "${key}" "${value_b64}" > "${K8S_SECRETS_DIR}/${file}"
    }

    for name in admin config-admin sldapauth sslave; do
        PASS_FILE="${SECRETS_DIR}/openldap-${name}-password"
        if [ -f "${PASS_FILE}" ]; then
            PASS_B64=$(base64 -w0 < "${PASS_FILE}")
            write_secret "openldap-${name%-password}-password" \
                "openldap-${name%-password}-password.yaml" "password" "${PASS_B64}"
        fi
    done

    if [ -f "${SECRETS_DIR}/wireguard-admin-password" ]; then
        PASS_B64=$(base64 -w0 < "${SECRETS_DIR}/wireguard-admin-password")
        write_secret "wireguard-admin-password" \
            "wireguard-admin-password.yaml" "admin-password" "${PASS_B64}"
    fi

    if [ -f "${SECRETS_DIR}/grafana-admin-password" ]; then
        PASS_B64=$(base64 -w0 < "${SECRETS_DIR}/grafana-admin-password")
        write_secret "grafana-admin-password" \
            "grafana-admin-password.yaml" "admin-password" "${PASS_B64}"
    fi

    GITEA_SLAVE_TOKEN_B64=$(printf '%s' "${GITEA_SLAVE_TOKEN}" | base64 -w0)
    REDMINE_TOKEN_B64=$(printf '%s' "${REDMINE_TOKEN}" | base64 -w0)
    CDASH_API_TOKEN_B64=$(printf '%s' "${CDASH_API_TOKEN}" | base64 -w0)
    printf '{"apiVersion":"v1","kind":"Secret","metadata":{"name":"angie-tokens","namespace":"${SHOGGOTH_NAMESPACE}"},"type":"Opaque","data":{"gitea-slave-token":"%s","redmine-token":"%s","cdash-api-token":"%s"}}\n' \
        "${GITEA_SLAVE_TOKEN_B64}" "${REDMINE_TOKEN_B64}" "${CDASH_API_TOKEN_B64}" \
        > "${K8S_SECRETS_DIR}/angie-tokens.yaml"

    for svc in redmine cdash kestra; do
        PASS_FILE="${SECRETS_DIR}/${svc}-db-password"
        if [ -f "${PASS_FILE}" ]; then
            PASS_B64=$(base64 -w0 < "${PASS_FILE}")
            write_secret "${svc}-db-password" \
                "${svc}-db-password.yaml" "password" "${PASS_B64}"
        fi
    done

    if [ -f "${SECRETS_DIR}/redmine-secret-key-base" ]; then
        KEY_B64=$(base64 -w0 < "${SECRETS_DIR}/redmine-secret-key-base")
        write_secret "redmine-secret-key-base" \
            "redmine-secret-key-base.yaml" "secret-key-base" "${KEY_B64}"
    fi

    if [ -f "${SECRETS_DIR}/cdash-app-key" ]; then
        KEY_B64=$(base64 -w0 < "${SECRETS_DIR}/cdash-app-key")
        write_secret "cdash-app-key" \
            "cdash-app-key.yaml" "app-key" "${KEY_B64}"
    fi

    if [ -f "${SECRETS_DIR}/gitea-runner-token" ]; then
        TOKEN_B64=$(base64 -w0 < "${SECRETS_DIR}/gitea-runner-token")
        write_secret "gitea-runner-token" \
            "gitea-runner-token.yaml" "token" "${TOKEN_B64}"
    fi

    SLAVE_DIND_TOKEN_B64=$(printf '%s' "${GITEA_SLAVE_TOKEN}" | base64 -w0)
    SLAVE_DIND_SSH_B64=$(base64 -w0 < "${SECRETS_DIR}/ssh-id-rsa")
    SLAVE_DIND_USER_B64=""
    if [ -f "${SECRETS_DIR}/gitea-user" ]; then
        SLAVE_DIND_USER_B64=$(base64 -w0 < "${SECRETS_DIR}/gitea-user")
    fi
    printf '{"apiVersion":"v1","kind":"Secret","metadata":{"name":"slave-dind-secrets","namespace":"${SHOGGOTH_NAMESPACE}"},"type":"Opaque","data":{"gitea-slave-token":"%s","ssh-id-rsa":"%s","gitea-user":"%s"}}\n' \
        "${SLAVE_DIND_TOKEN_B64}" "${SLAVE_DIND_SSH_B64}" "${SLAVE_DIND_USER_B64}" \
        > "${K8S_SECRETS_DIR}/slave-dind-secrets.yaml"

    echo "K8s Secret manifests written to ${K8S_SECRETS_DIR}"

    echo "=== Phase 10: Apply K8s Secrets via API ==="
    K8S_API="https://kubernetes.default.svc"
    SA_TOKEN="$(cat /var/run/secrets/kubernetes.io/serviceaccount/token 2>/dev/null || true)"
    K8S_NS="$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace 2>/dev/null || echo ${SHOGGOTH_NAMESPACE})"
    K8S_CACERT="/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
    if [ -n "${SA_TOKEN}" ]; then
        echo "  K8S API: ${K8S_API}"
        echo "  Namespace: ${K8S_NS}"
        echo "  SA token: present (length: ${#SA_TOKEN})"
        echo "  CA cert: $([ -f "${K8S_CACERT}" ] && echo 'present' || echo 'MISSING')"
        for f in "${K8S_SECRETS_DIR}"/*.yaml; do
            [ -f "$f" ] || continue
            SECRET_NAME=$(jq -r '.metadata.name // empty' < "$f" 2>/dev/null || true)
            [ -z "${SECRET_NAME}" ] && { echo "  ERROR: cannot parse secret name from $(basename "$f")"; continue; }
            HTTP_CODE=$(curl -s -o /tmp/k8s-secret-resp.json -w '%{http_code}' \
                --cacert "${K8S_CACERT}" \
                -X PUT \
                -H "Authorization: Bearer ${SA_TOKEN}" \
                -H "Content-Type: application/json" \
                --data-binary @"${f}" \
                "${K8S_API}/api/v1/namespaces/${K8S_NS}/secrets/${SECRET_NAME}" 2>/tmp/k8s-curl-err.txt)
            CURL_EXIT=$?
            if [ "${HTTP_CODE}" = "200" ] || [ "${HTTP_CODE}" = "201" ]; then
                echo "  Updated secret: ${SECRET_NAME} (HTTP ${HTTP_CODE})"
                continue
            fi
            if [ "${CURL_EXIT}" -ne 0 ]; then
                echo "  CURL ERROR (PUT): $(cat /tmp/k8s-curl-err.txt)"
            fi
            HTTP_CODE=$(curl -s -o /tmp/k8s-secret-resp.json -w '%{http_code}' \
                --cacert "${K8S_CACERT}" \
                -X POST \
                -H "Authorization: Bearer ${SA_TOKEN}" \
                -H "Content-Type: application/json" \
                --data-binary @"${f}" \
                "${K8S_API}/api/v1/namespaces/${K8S_NS}/secrets" 2>/tmp/k8s-curl-err.txt)
            CURL_EXIT=$?
            if [ "${HTTP_CODE}" = "200" ] || [ "${HTTP_CODE}" = "201" ]; then
                echo "  Created secret: ${SECRET_NAME} (HTTP ${HTTP_CODE})"
            else
                echo "  FAILED: ${SECRET_NAME} (HTTP ${HTTP_CODE}, curl exit ${CURL_EXIT})"
                [ "${CURL_EXIT}" -ne 0 ] && echo "  CURL ERROR (POST): $(cat /tmp/k8s-curl-err.txt)"
            fi
        done
    else
        echo "WARNING: No service account token found, K8s Secrets not applied"
    fi
    rm -f /tmp/k8s-secret-resp.json /tmp/k8s-curl-err.txt

    echo "=== Phase 11: Copy rendered files to shared volume ==="
    SHARED_DIR="/shoggoth/rendered"
    mkdir -p "${SHARED_DIR}/openldap" "${SHARED_DIR}/certs" "${SHARED_DIR}/k8s-secrets" \
             "${SHARED_DIR}/redmine" "${SHARED_DIR}/cdash" "${SHARED_DIR}/gitea" \
             "${SHARED_DIR}/kestra" "${SHARED_DIR}/litellm" "${SHARED_DIR}/gitea-runner" \
             "${SHARED_DIR}/docker-cache-certs"
    COPY_ERRORS=0
    cp -a "${RENDERED_LDAP_DIR}/"* "${SHARED_DIR}/openldap/" 2>/dev/null || COPY_ERRORS=$((COPY_ERRORS + 1))
    cp -a "${CERTS_DIR}/ca.crt" "${SHARED_DIR}/certs/shoggoth-ca.crt" || COPY_ERRORS=$((COPY_ERRORS + 1))
    cp -a "${CERTS_DIR}/server.crt" "${SHARED_DIR}/certs/shoggoth.crt" || COPY_ERRORS=$((COPY_ERRORS + 1))
    cp -a "${CERTS_DIR}/server.key" "${SHARED_DIR}/certs/shoggoth.key" || COPY_ERRORS=$((COPY_ERRORS + 1))
    cp -a "${RENDERED_DIR}/phpldapadmin.env" "${SHARED_DIR}/" 2>/dev/null || COPY_ERRORS=$((COPY_ERRORS + 1))
    cp -a "${RENDERED_DIR}/plugin.tar.gz" "${SHARED_DIR}/" 2>/dev/null || COPY_ERRORS=$((COPY_ERRORS + 1))
    cp -a "${RENDERED_DIR}/web-external.conf" "${SHARED_DIR}/" 2>/dev/null || COPY_ERRORS=$((COPY_ERRORS + 1))
    cp -a "${K8S_SECRETS_DIR}/"* "${SHARED_DIR}/k8s-secrets/" 2>/dev/null || COPY_ERRORS=$((COPY_ERRORS + 1))
    cp /shoggoth/bringup/templates/setup-client.sh "${SHARED_DIR}/setup-client.sh" && chmod 755 "${SHARED_DIR}/setup-client.sh" || COPY_ERRORS=$((COPY_ERRORS + 1))
    cp -a "${RENDERED_DIR}/redmine/redmine.env" "${SHARED_DIR}/redmine/" 2>/dev/null || COPY_ERRORS=$((COPY_ERRORS + 1))
    cp -a "${RENDERED_DIR}/cdash/cdash.env" "${SHARED_DIR}/cdash/" 2>/dev/null || COPY_ERRORS=$((COPY_ERRORS + 1))
    cp -a "${RENDERED_DIR}/gitea/gitea.env" "${SHARED_DIR}/gitea/" 2>/dev/null || COPY_ERRORS=$((COPY_ERRORS + 1))
    cp -a "${RENDERED_DIR}/kestra/env" "${SHARED_DIR}/kestra/" 2>/dev/null || COPY_ERRORS=$((COPY_ERRORS + 1))
    cp -a "${RENDERED_DIR}/kestra-config.yaml" "${SHARED_DIR}/kestra/config.yaml" 2>/dev/null || COPY_ERRORS=$((COPY_ERRORS + 1))
    cp -a "${RENDERED_DIR}/litellm-config.yaml" "${SHARED_DIR}/litellm/config.yaml" 2>/dev/null || COPY_ERRORS=$((COPY_ERRORS + 1))
    cp -a "${RENDERED_DIR}/gitea-runner-config.yaml" "${SHARED_DIR}/gitea-runner/config.yaml" 2>/dev/null || COPY_ERRORS=$((COPY_ERRORS + 1))
    mkdir -p "${SHARED_DIR}/docker-cache-certs"
    cp -a "${DOCKER_CACHE_CA_DIR}/"* "${SHARED_DIR}/docker-cache-certs/" 2>&1 || echo "WARNING: docker-cache-certs copy failed (non-fatal)"

    if [ "${COPY_ERRORS}" -gt 0 ]; then
        echo "ERROR: ${COPY_ERRORS} file copy operation(s) failed in Phase 11. Sentinel not created." >&2
        exit 1
    fi

    touch "${SHARED_DIR}/.bringup-done"
    echo "Bringup Job complete."
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: bringup-templates
  namespace: ${SHOGGOTH_NAMESPACE}
data:
  openldap_config.ldif: |
    dn: olcDatabase={1}mdb,cn=config
    changetype: modify
    replace: olcAccess
    olcAccess: {0}to attrs=userPassword by self write by anonymous auth by * none
    olcAccess: {1}to attrs=shadowLastChange by self write by users read
    olcAccess: {2}to * by users read by * none
  openldap_data.ldif: |
    dn: ou=people,${LDAP_BASE_DN}
    changetype: add
    objectClass: organizationalUnit
    ou: people

    dn: ou=groups,${LDAP_BASE_DN}
    changetype: add
    objectClass: organizationalUnit
    ou: groups

    dn: uid=admin,ou=people,${LDAP_BASE_DN}
    changetype: add
    objectClass: inetOrgPerson
    objectClass: posixAccount
    uid: admin
    cn: Admin
    sn: Shoggoth
    uidNumber: 10000
    gidNumber: 10000
    homeDirectory: /home/admin
    mail: admin@${SHOGGOTH_DOMAIN}

    dn: uid=sldapauth,ou=people,${LDAP_BASE_DN}
    changetype: add
    objectClass: inetOrgPerson
    objectClass: posixAccount
    uid: sldapauth
    cn: LDAP Auth
    sn: Shoogoth
    uidNumber: 10001
    gidNumber: 10001
    homeDirectory: /home/sldapauth
    mail: sldapauth@${SHOGGOTH_DOMAIN}

    dn: uid=sslave,ou=people,${LDAP_BASE_DN}
    changetype: add
    objectClass: inetOrgPerson
    objectClass: posixAccount
    uid: sslave
    cn: Slave
    sn: Shoggoth
    uidNumber: 10002
    gidNumber: 10002
    homeDirectory: /home/sslave
    mail: sslave@${SHOGGOTH_DOMAIN}

    dn: cn=admins,ou=groups,${LDAP_BASE_DN}
    changetype: add
    objectClass: groupOfNames
    cn: admins
    member: uid=admin,ou=people,${LDAP_BASE_DN}

    dn: cn=shoggoth-auth,ou=groups,${LDAP_BASE_DN}
    changetype: add
    objectClass: groupOfNames
    cn: shoggoth-auth
    member: uid=sldapauth,ou=people,${LDAP_BASE_DN}
  openldap_memberof_module.ldif: |
    dn: cn=module{0},cn=config
    changetype: modify
    add: olcModuleLoad
    olcModuleLoad: memberof
  openldap_memberof_overlay.ldif: |
    dn: olcOverlay=memberof,${MDB_DN}
    objectClass: olcOverlayConfig
    objectClass: olcMemberOf
    olcOverlay: memberof
    olcMemberOfDangling: ignore
    olcMemberOfRefInt: FALSE
    olcMemberOfGroupOC: groupOfNames
    olcMemberOfMemberAD: member
    olcMemberOfMemberOfAD: memberOf
  openldap_passwords.ldif: |
    dn: uid=admin,ou=people,${LDAP_BASE_DN}
    changetype: modify
    replace: userPassword
    userPassword: ${ADMIN_HASH}

    dn: uid=sldapauth,ou=people,${LDAP_BASE_DN}
    changetype: modify
    replace: userPassword
    userPassword: ${SLDAUTH_HASH}

    dn: uid=sslave,ou=people,${LDAP_BASE_DN}
    changetype: modify
    replace: userPassword
    userPassword: ${SSLAVE_HASH}
  gitea-runner_config.yaml: |
    log:
      level: debug
    runner:
      file: .runner
      capacity: 1
      envs:
        RUNNER_TOOL_CACHE: /toolcache
      timeout: 3h
      shutdown_timeout: 0s
      insecure: false
      fetch_timeout: 5s
      fetch_interval: 2s
      github_mirror: ''
      labels:
        - "ubuntu-latest:docker://docker-registry.${SHOGGOTH_DOMAIN}/slave_noble:dind"
        - "ubuntu-24.04:docker://docker-registry.${SHOGGOTH_DOMAIN}/slave_noble:dind"
        - "ubuntu-22.04:docker://docker-registry.${SHOGGOTH_DOMAIN}/slave_jammy:dind"
    cache:
      enabled: true
      dir: "/cache/gitea/actcache/"
      host: "gitea-runner"
      port: 0
      external_server: ""
    container:
      network: "host"
      privileged: false
      options: "--volume /shoggoth/git-cred:/shoggoth/git-cred
                --volume /shoggoth/ci_cache:/cache"
      workdir_parent:
      valid_volumes: ['**']
      docker_host: "unix:///dind/docker.sock"
      force_pull: false
      force_rebuild: false
      require_docker: false
      docker_timeout: 0s
    host:
      workdir_parent: "/cache/gitea/act/"
  kestra_config.yaml: |
    datasources:
      postgres:
        url: jdbc:postgresql://kestra-db:5432/kestra
        driverClassName: org.postgresql.Driver
        username: kestra
        password: "${KESTRA_DATASOURCES_POSTGRES_PASSWORD}"
    micronaut:
      server:
