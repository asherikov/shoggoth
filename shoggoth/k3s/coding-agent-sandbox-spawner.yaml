---
# coding-agent-sandbox-spawner — ServiceAccount + RBAC for the
# `coding-agent-dispatcher` DAG's `dispatch` step (and the parallel
# sandbox-only template). Lets the dispatch pod:
#
#   * Apply / delete Pod + Service objects it creates itself.
#   * Watch the sandbox pod's status (`kubectl wait --for=condition=Ready`,
#     `kubectl wait --for=jsonpath=...`) until the ttyd session ends.
#   * Stream the sandbox pod's log on failure (best-effort; the
#     dispatcher's ``_wait_sandbox_ready`` and
#     ``_snapshot_sandbox_pod`` run ``kubectl logs -c <container>``
#     via the ``run()`` helper, see
#     ``shoggoth/workflow/scripts/shoggoth/commands/dispatch.py``).
#
# Scope: the `shoggoth` namespace only. The dispatch pod cannot touch
# pods/services in any other namespace, cannot delete nodes / pvcs /
# configmaps / secrets / deployments / replicasets / jobs, and cannot
# `create token` against any SA. The blast radius is one namespace,
# one resource pair (pods, services), and one verb set (CRUD on those
# two resources, plus `pods/log` read).
#
# Why a new SA instead of reusing the default `argo` SA: the default
# SA is used by every other argo workflow in the cluster and the
# principle of least privilege says the dispatcher should not be able
# to mutate pods it did not create. A dedicated SA also makes the
# audit trail unambiguous (`kubectl get pod --as=
# system:serviceaccount:shoggoth:shoggoth-coding-agent-sandbox-spawner`
# shows only dispatch-initiated changes).
#
# Why not a `resourceNames` allow-list (e.g. only `pods/sandbox-pr-*`):
# K8s RBAC's `resourceNames` is matched against the *object name* the
# verb acts on, but `create` is rejected when `resourceNames` is set
# (the object does not exist yet, so the filter cannot match — same
# limitation documented in `maintenance-secret-writer.yaml:14-19`).
# The narrower alternative is OPA/Gatekeeper with a label-selector
# constraint, which is out of scope for this change. The namespaced
# scope + the per-pod label set on the dispatcher's own manifests
# (every pod it creates is labelled `kind: sandbox` and
# `app: shoggoth-coding-agent-sandbox`) keeps the blast
# radius small in practice.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: shoggoth-coding-agent-sandbox-spawner
  namespace: ${SHOGGOTH_NAMESPACE}
  labels:
    app.kubernetes.io/part-of: shoggoth
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: shoggoth-coding-agent-sandbox-spawner
  namespace: ${SHOGGOTH_NAMESPACE}
  labels:
    app.kubernetes.io/part-of: shoggoth
rules:
- apiGroups:
  - ''
  resources:
  - pods
  - services
  verbs:
  - create
  - get
  - list
  - watch
  - delete
  # ``patch`` is needed by the dispatcher's
  # ``_apply_sandbox_service`` -- after kubectl-applying the
  # Service, the dispatcher looks up the Pod's UID and
  # ``kubectl patch``-es an ``ownerReferences`` entry onto
  # the Service so K8s GC deletes the Service when the pod
  # goes. Without ``patch`` the API server rejects the
  # request with ``Forbidden: ... cannot patch resource
  # "services"`` and the Service leaks past the pod's
  # lifetime (the pre-fix code logged this as a WARNING
  # and continued; the dispatcher now ``die()``s on the
  # failure so the workflow is marked Failed and the user
  # can retry).
  - patch
# `pods/log` is a subresource and needs its own rule. Used by
# the dispatcher's ``kubectl logs -c <container>`` probes in
# ``_wait_sandbox_ready`` / ``_snapshot_sandbox_pod`` (see
# ``shoggoth/workflow/scripts/shoggoth/commands/dispatch.py``)
# to surface the sandbox container's stderr in the
# dispatcher's PR comment when the pod fails to become Ready.
# `get` is sufficient (no `list` of every pod's log; the dispatcher
# already knows the pod name it just created).
- apiGroups:
  - ''
  resources:
  - pods/log
  verbs:
  - get
# `pods/exec` would let the dispatcher shell into the sandbox
# container. NOT granted here — the user accesses the sandbox
# through the ttyd WebSocket, not via kubectl exec. If a future
# `/sandbox-debug` slash command needs exec, add it explicitly
# then with a separate Role so the failure mode is auditable.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: shoggoth-coding-agent-sandbox-spawner
  namespace: ${SHOGGOTH_NAMESPACE}
  labels:
    app.kubernetes.io/part-of: shoggoth
subjects:
- kind: ServiceAccount
  name: shoggoth-coding-agent-sandbox-spawner
  namespace: ${SHOGGOTH_NAMESPACE}
roleRef:
  kind: Role
  name: shoggoth-coding-agent-sandbox-spawner
  apiGroup: rbac.authorization.k8s.io
---
# `kubectl get externalsecret ... -o json | jq -e ...` in a
# 60-iteration polling loop (see
# `shoggoth/workflow/scripts/sandbox.py wait-bootstrap`
# for the Python implementation; the original was a bash
# for-loop at SANDBOX_WAIT_BOOTSTRAP_SCRIPT). The only
# verb actually exercised is `get`; the binding still
# inherits `list` + `watch` from the reused
# `argo-workflow-controller-bootstrap-wait` Role because
# tightening the inherited Role would also affect the
# controller-bootstrap waiter (the only other consumer),
# and the new binding's narrow resourceNames
# (`gitea-slave-token`, `ssh-slave-private-key`) keep
# the blast radius to two specific externalsecrets in
# the one namespace. If a future change drops `list` /
# `watch` from the controller's role, this binding
# still works (the polling loop only ever calls `get`).
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: shoggoth-coding-agent-sandbox-spawner-bootstrap-wait
  namespace: ${SHOGGOTH_NAMESPACE}
  labels:
    app.kubernetes.io/part-of: shoggoth
subjects:
- kind: ServiceAccount
  name: shoggoth-coding-agent-sandbox-spawner
  namespace: ${SHOGGOTH_NAMESPACE}
roleRef:
  kind: Role
  name: argo-workflow-controller-bootstrap-wait
  apiGroup: rbac.authorization.k8s.io
---
# No RoleBindings for Gitea / Redmine / LDAP / SSH secrets
# on the sandbox-spawner SA. The dispatcher pod instantiates
# the `Gitea` and `Redmine` clients with
# `read_tokens=False` (shoggoth/workflow/scripts/dispatch.py),
# which short-circuits both `secrets_store.read(...)` calls
# in their constructors (shoggoth/workflow/scripts/shoggoth/gitea.py
# / shoggoth/workflow/scripts/shoggoth/redmine.py). The
# dispatcher authenticates against Gitea/Redmine via the
# api-proxy at `api.${SHOGGOTH_DOMAIN}` (api-gateway
# injects the argo-webhook-receiver / gitea-slave token
# for outgoing calls) — the dispatch pod has no K8s
# Secret reads on its own. The pre-fix bindings
# (`shoggott-coding-agent-sandbox-spawner-ldap-ssh-read`,
# `-redmine-read`) granted read on five Secrets the SA
# never used; dropping them keeps a compromised dispatcher
# pod from gaining `get` on `redmine-slave-token`,
# `openldap-{slave,admin,ldapauth}-password`, and
# `ssh-slave-public-key` for free. If a future dispatcher
# handler does need to read one of these Secrets, grant
# it then with a name-scoped `resourceNames` shape so the
# bind remains auditable.
---
# Argo executor permissions for the dispatch pod. Without this the
# workflow fails with::
#   workflowtaskresults.argoproj.io is forbidden:
#     cannot create resource "workflowtaskresults" in API group "argoproj.io"
# mirroring the maintenance pod's argo-executor binding at
# `maintenance-secret-writer.yaml:131-147`. The dispatch template
# runs under `shoggoth-coding-agent-sandbox-spawner` (set explicitly
# in the new `coding-agent-dispatcher` DAG), so the executor
# permissions must be bound to that SA, not to the default `argo`
# SA.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: shoggoth-coding-agent-sandbox-spawner-argo
  namespace: ${SHOGGOTH_NAMESPACE}
  labels:
    app.kubernetes.io/part-of: shoggoth
subjects:
- kind: ServiceAccount
  name: shoggoth-coding-agent-sandbox-spawner
  namespace: ${SHOGGOTH_NAMESPACE}
roleRef:
  kind: Role
  name: argo-workflow-executor
  apiGroup: rbac.authorization.k8s.io
