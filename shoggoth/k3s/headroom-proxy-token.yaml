---
# headroom-proxy-token — shared secret for scraping headroom's /metrics
# endpoint from otelcol.
#
# headroom's /metrics route is gated by HEADROOM_PROXY_TOKEN per
# headroom/proxy/bind_policy.py: loopback callers are trusted, every other
# caller (including otelcol from another pod) must present this token. The
# proxy also rejects non-loopback binds outright without either this token
# or HEADROOM_ALLOW_UNAUTHENTICATED_BIND=1 — so the token is required
# whenever the Deployment binds 0.0.0.0 (which it does, for litellm to
# reach it via the headroom Service).
#
# Two consumers reference this Secret:
#   - shoggoth/k3s/headroom.yaml — sets HEADROOM_PROXY_TOKEN from
#     secretKeyRef: name: headroom-proxy-token, key: token
#   - shoggoth/k3s/otelcol.yaml — mounts it as a volume at
#     /etc/otelcol-contrib/secrets/headroom-proxy-token/token and
#     references that path as bearer_token_file in the headroom scrape
#     config (so the token never appears in the otelcol ConfigMap).
#
# Token rotation: regenerate via `openssl rand -hex 32`, base64-encode
# (no wrap), and replace the `data.token` below. Both consumers pick
# the new value up on the next pod restart (the headroom Deployment
# reschedules, otelcol is a DaemonSet that rolls on ConfigMap change).
# The two consumers must always agree on the value; otherwise otelcol
# scrape returns 401/403 and headroom metrics stop arriving in
# VictoriaMetrics.
#
# Threat model: this token only gates /metrics on a service that's
# already reachable only from inside the cluster (the headroom Service
# is cluster-local). It is not a credential to any external system.
# Keeping it in a plain Secret rather than routing through OpenBao
# avoids a cross-namespace read dependency at scrape time; rotate as
# you would any internal API token.
apiVersion: v1
kind: Secret
metadata:
  name: headroom-proxy-token
  namespace: ${SHOGGOTH_NAMESPACE}
type: Opaque
data:
  # base64("3cb595958ee9985fa8670eadaf892042547c2931ef72d511cf4375b6039aca6c")
  token: M2NiNTk1OTU4ZWU5OTg1ZmE4NjcwZWFkYWY4OTIwNDI1NDdjMjkzMWVmNzJkNTExY2Y0Mzc1YjYwMzlhY2E2Yw==