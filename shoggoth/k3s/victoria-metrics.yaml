apiVersion: v1
kind: Service
metadata:
  name: victoria-metrics
  namespace: ${SHOGGOTH_NAMESPACE}
spec:
  selector:
    app: victoria-metrics
  ports:
  - name: http
    port: 80
    targetPort: 80
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: victoria-metrics-data
  namespace: ${SHOGGOTH_NAMESPACE}
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: local-path
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: victoria-metrics
  namespace: ${SHOGGOTH_NAMESPACE}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: victoria-metrics
  template:
    metadata:
      labels:
        app: victoria-metrics
    spec:
      dnsPolicy: None
      dnsConfig:
        nameservers:
        - ${SHOGGOTH_DNS_IP}
        searches:
        - ${SHOGGOTH_NAMESPACE}.svc.cluster.local
        - svc.cluster.local
        - cluster.local
      initContainers:
      - name: wait-bootstrap
        image: asherikov/shoggoth_tools:alpine
        imagePullPolicy: IfNotPresent
        command:
        - bash
        - -c
        args:
        - |
          set -euo pipefail
          K8S_API="${K8S_API:-https://kubernetes.default.svc}"
          SA_TOKEN="$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)"
          SA_CA="/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
          for i in $(seq 1 120); do
            http_code=$(curl -sS --cacert "${SA_CA}" \
              -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer ${SA_TOKEN}" \
              "${K8S_API}/api/v1/namespaces/${SHOGGOTH_NAMESPACE}/secrets/shoggoth-bootstrap-done" || true)
            if [ "${http_code}" = "200" ]; then
              echo "wait-bootstrap: shoggoth-bootstrap-done Secret found"
              exit 0
            fi
            echo "wait-bootstrap: waiting for shoggoth-bootstrap-done Secret (attempt $i/120, http=${http_code})..."
            if [ $((i % 12)) -eq 0 ] && [ "${http_code}" != "404" ]; then
              curl -sS --cacert "${SA_CA}" \
                -H "Authorization: Bearer ${SA_TOKEN}" \
                "${K8S_API}/api/v1/namespaces/${SHOGGOTH_NAMESPACE}/secrets/shoggoth-bootstrap-done" >&2 || true
            fi
            sleep 5
          done
          echo "wait-bootstrap: FATAL: shoggoth-bootstrap-done Secret not found after 600s"
          echo "wait-bootstrap: openbao-bootstrap may have failed; check:"
          echo "  kubectl logs -n ${SHOGGOTH_NAMESPACE} -l app=openbao -c openbao-bootstrap"
          exit 1
        resources:
          requests:
            memory: 32Mi
            cpu: 50m
          limits:
            memory: 64Mi
            cpu: 200m
        volumeMounts: []
      containers:
      - name: victoria-metrics
        image: victoriametrics/victoria-metrics:latest
        imagePullPolicy: IfNotPresent
        args:
        - -retentionPeriod=1y
        - -selfScrapeInterval=15s
        - -httpListenAddr=:80
        ports:
        - containerPort: 80
          name: http
        env:
        - name: OTEL_TRACES_EXPORTER
          value: otlp
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://otelcol:4318
        - name: SHOGGOTH_DOMAIN
          value: ${SHOGGOTH_DOMAIN}
        volumeMounts:
        - name: data
          mountPath: /victoria-metrics-data
        resources:
          requests:
            memory: 256Mi
            cpu: 100m
          limits:
            memory: 512Mi
            cpu: 1000m
        readinessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
          failureThreshold: 30
        livenessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
          failureThreshold: 6
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: victoria-metrics-data
      serviceAccountName: victoria-metrics
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: victoria-metrics
  namespace: ${SHOGGOTH_NAMESPACE}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: victoria-metrics-bootstrap-wait
  namespace: ${SHOGGOTH_NAMESPACE}
rules:
- apiGroups:
  - ''
  resources:
  - secrets
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: victoria-metrics-bootstrap-wait
  namespace: ${SHOGGOTH_NAMESPACE}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: victoria-metrics-bootstrap-wait
subjects:
- kind: ServiceAccount
  name: victoria-metrics
  namespace: ${SHOGGOTH_NAMESPACE}
