---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: docker-cache
  namespace: ${SHOGGOTH_NAMESPACE}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: local-path
---
apiVersion: v1
kind: Service
metadata:
  name: docker-cache
  namespace: ${SHOGGOTH_NAMESPACE}
spec:
  selector:
    app: docker-cache
  ports:
    - name: proxy
      port: 3128
      targetPort: 3128
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: docker-cache
  namespace: ${SHOGGOTH_NAMESPACE}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: docker-cache
  template:
    metadata:
      labels:
        app: docker-cache
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      initContainers:
        - name: wait-bringup
          image: busybox:latest
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c"]
          args:
            - |
              echo "wait-bringup: checking sentinel /shoggoth/rendered/.bringup-done"
              if [ ! -f /shoggoth/rendered/.bringup-done ]; then
                echo "wait-bringup: sentinel not found, dumping diagnostics:" >&2
                echo "wait-bringup: /shoggoth/rendered/ exists: $([ -d /shoggoth/rendered ] && echo yes || echo no)" >&2
                if [ -d /shoggoth/rendered ]; then
                  echo "wait-bringup: contents:" >&2
                  ls -la /shoggoth/rendered/ >&2 || true
                fi
                if [ -f /shoggoth/rendered/bringup.log ]; then
                  echo "wait-bringup: bringup.log tail:" >&2
                  tail -20 /shoggoth/rendered/bringup.log >&2 || true
                fi
                echo "wait-bringup: exiting, bringup may still be in progress" >&2
                exit 1
              fi
              echo "wait-bringup: sentinel found"
          resources:
            requests:
              memory: "32Mi"
              cpu: "50m"
            limits:
              memory: "64Mi"
              cpu: "200m"
          volumeMounts:
            - name: rendered
              mountPath: /shoggoth/rendered
              readOnly: true
        - name: patch-nginx-conf
          image: rpardini/docker-registry-proxy:0.6.5
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c"]
          args:
            - |
              sed 's/listen 80 /listen 8080 /g; s/listen \[::\]:80 /listen [::]:8080 /g' \
                /etc/nginx/nginx.conf > /tmp/nginx.conf
          resources:
            requests:
              memory: "32Mi"
              cpu: "50m"
            limits:
              memory: "64Mi"
              cpu: "200m"
          volumeMounts:
            - name: nginx-conf
              mountPath: /tmp
      containers:
        - name: docker-cache
          image: rpardini/docker-registry-proxy:0.6.5
          imagePullPolicy: IfNotPresent
          env:
            - name: SHOGGOTH_DOMAIN
              value: "${SHOGGOTH_DOMAIN}"
            - name: OTEL_TRACES_EXPORTER
              value: "otlp"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otelcol:4318"
            - name: REGISTRIES
              value: "docker.io registry.k8s.io gcr.io quay.io ghcr.io mcr.microsoft.com docker.gitea.com docker.angie.software codeberg.org public.ecr.aws"
            - name: ENABLE_MANIFEST_CACHE
              value: "true"
            - name: CACHE_MAX_SIZE
              value: "64g"
            - name: MANIFEST_CACHE_PRIMARY_REGEX
              value: "(stable|nightly|production|test)"
            - name: MANIFEST_CACHE_PRIMARY_TIME
              value: "10m"
            - name: MANIFEST_CACHE_SECONDARY_REGEX
              value: "(.*)(\\d|\\.)+(\\d|\\.)+(.*)(\\d|\\.)+"
            - name: MANIFEST_CACHE_SECONDARY_TIME
              value: "60d"
            - name: MANIFEST_CACHE_DEFAULT_TIME
              value: "1h"
            - name: DISABLE_IPV6
              value: "true"
            - name: ALLOW_PUSH
              value: "true"
          ports:
            - containerPort: 3128
              name: proxy
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "1"
          readinessProbe:
            tcpSocket:
              port: 3128
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            tcpSocket:
              port: 3128
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
          volumeMounts:
            - name: cache
              mountPath: /docker_mirror_cache
            - name: rendered
              mountPath: /ca
              subPath: docker-cache-certs
            - name: nginx-conf
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
      volumes:
        - name: rendered
          hostPath:
            path: /var/lib/rancher/k3s/storage/${SHOGGOTH_INSTANCE_DIR}/rendered
            type: DirectoryOrCreate
        - name: cache
          persistentVolumeClaim:
            claimName: docker-cache
        - name: nginx-conf
          emptyDir: {}