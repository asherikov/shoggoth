apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: git-pages-data
  namespace: ${SHOGGOTH_NAMESPACE}
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: local-path
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: git-pages-config
  namespace: ${SHOGGOTH_NAMESPACE}
data:
  config.toml: |
    log-format = "text"

    [server]
    pages = "tcp/:80"
    caddy = "-"
    metrics = "tcp/:9253"

    [storage]
    type = "fs"

    [storage.fs]
    root = "/app/data"

    [limits]
    max-site-size = "128M"
    max-manifest-size = "1M"
    max-inline-file-size = "256B"
    git-large-object-threshold = "1M"
    max-symlink-depth = 16
    update-timeout = "60s"
    max-heap-size-ratio = 0.1
    forbidden-domains = []
    allowed-repository-url-prefixes = []
---
apiVersion: v1
kind: Service
metadata:
  name: git-pages
  namespace: ${SHOGGOTH_NAMESPACE}
spec:
  selector:
    app: git-pages
  ports:
  - name: http
    port: 80
    targetPort: 80
  - name: metrics
    port: 9253
    targetPort: 9253
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: git-pages
  namespace: ${SHOGGOTH_NAMESPACE}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: git-pages
  template:
    metadata:
      labels:
        app: git-pages
    spec:
      dnsPolicy: None
      dnsConfig:
        nameservers:
        - ${SHOGGOTH_DNS_IP}
        searches:
        - ${SHOGGOTH_NAMESPACE}.svc.cluster.local
        - svc.cluster.local
        - cluster.local
      initContainers: []
      containers:
      - name: git-pages
        image: codeberg.org/git-pages/git-pages:0.9.1
        imagePullPolicy: IfNotPresent
        env:
        - name: SHOGGOTH_DOMAIN
          value: ${SHOGGOTH_DOMAIN}
        - name: OTEL_TRACES_EXPORTER
          value: otlp
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://otelcol:4318
        - name: PAGES_INSECURE
          value: '1'
        ports:
        - containerPort: 80
          name: http
        - containerPort: 9253
          name: metrics
        resources:
          requests:
            memory: 64Mi
            cpu: 50m
          limits:
            memory: 256Mi
            cpu: 500m
        readinessProbe:
          tcpSocket:
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
          failureThreshold: 30
        livenessProbe:
          tcpSocket:
            port: 80
          initialDelaySeconds: 15
          periodSeconds: 30
          failureThreshold: 3
        volumeMounts:
        - name: data
          mountPath: /app/data
        - name: config
          mountPath: /app/config.toml
          subPath: config.toml
          readOnly: true
      volumes:
      - name: config
        configMap:
          name: git-pages-config
      - name: data
        persistentVolumeClaim:
          claimName: git-pages-data
