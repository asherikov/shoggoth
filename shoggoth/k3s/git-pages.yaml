apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: git-pages-data
  namespace: ${SHOGGOTH_NAMESPACE}
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: local-path
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: git-pages-config
  namespace: ${SHOGGOTH_NAMESPACE}
data:
  config.toml: 'log-format = "text"


    [server]

    pages = "tcp/:80"

    caddy = "-"

    metrics = "tcp/:9253"


    [storage]

    type = "fs"


    [storage.fs]

    root = "/app/data"


    [limits]

    max-site-size = "128M"

    max-manifest-size = "1M"

    max-inline-file-size = "256B"

    git-large-object-threshold = "1M"

    max-symlink-depth = 16

    update-timeout = "60s"

    max-heap-size-ratio = 0.1

    forbidden-domains = []

    allowed-repository-url-prefixes = []

    '
---
apiVersion: v1
kind: Service
metadata:
  name: git-pages
  namespace: ${SHOGGOTH_NAMESPACE}
spec:
  selector:
    app: git-pages
  ports:
  - name: http
    port: 80
    targetPort: 80
  - name: metrics
    port: 9253
    targetPort: 9253
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: git-pages
  namespace: ${SHOGGOTH_NAMESPACE}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: git-pages
  template:
    metadata:
      labels:
        app: git-pages
    spec:
      dnsPolicy: None
      dnsConfig:
        nameservers:
        - ${SHOGGOTH_DNS_IP}
        searches:
        - ${SHOGGOTH_NAMESPACE}.svc.cluster.local
        - svc.cluster.local
        - cluster.local
      initContainers:
      - name: wait-bootstrap
        image: asherikov/shoggoth_tools:alpine
        imagePullPolicy: IfNotPresent
        command:
        - bash
        - -c
        args:
        - |
          set -euo pipefail
          K8S_API="${K8S_API:-https://kubernetes.default.svc}"
          SA_TOKEN="$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)"
          SA_CA="/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
          for i in $(seq 1 120); do
            http_code=$(curl -sS --cacert "${SA_CA}" \
              -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer ${SA_TOKEN}" \
              "${K8S_API}/api/v1/namespaces/${SHOGGOTH_NAMESPACE}/secrets/shoggoth-bootstrap-done" || true)
            if [ "${http_code}" = "200" ]; then
              echo "wait-bootstrap: shoggoth-bootstrap-done Secret found"
              exit 0
            fi
            echo "wait-bootstrap: waiting for shoggoth-bootstrap-done Secret (attempt $i/120, http=${http_code})..."
            if [ $((i % 12)) -eq 0 ] && [ "${http_code}" != "404" ]; then
              curl -sS --cacert "${SA_CA}" \
                -H "Authorization: Bearer ${SA_TOKEN}" \
                "${K8S_API}/api/v1/namespaces/${SHOGGOTH_NAMESPACE}/secrets/shoggoth-bootstrap-done" >&2 || true
            fi
            sleep 5
          done
          echo "wait-bootstrap: FATAL: shoggoth-bootstrap-done Secret not found after 600s"
          echo "wait-bootstrap: openbao-bootstrap may have failed; check:"
          echo "  kubectl logs -n ${SHOGGOTH_NAMESPACE} -l app=openbao -c openbao-bootstrap"
          exit 1
        resources:
          requests:
            memory: 32Mi
            cpu: 50m
          limits:
            memory: 64Mi
            cpu: 200m
        volumeMounts: []
      containers:
      - name: git-pages
        image: codeberg.org/git-pages/git-pages:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: SHOGGOTH_DOMAIN
          value: ${SHOGGOTH_DOMAIN}
        - name: OTEL_TRACES_EXPORTER
          value: otlp
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://otelcol:4318
        - name: PAGES_INSECURE
          value: '1'
        ports:
        - containerPort: 80
          name: http
        - containerPort: 9253
          name: metrics
        resources:
          requests:
            memory: 64Mi
            cpu: 50m
          limits:
            memory: 256Mi
            cpu: 500m
        readinessProbe:
          tcpSocket:
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
          failureThreshold: 30
        livenessProbe:
          tcpSocket:
            port: 80
          initialDelaySeconds: 15
          periodSeconds: 30
          failureThreshold: 3
        volumeMounts:
        - name: data
          mountPath: /app/data
        - name: config
          mountPath: /app/config.toml
          subPath: config.toml
          readOnly: true
      volumes:
      - name: config
        configMap:
          name: git-pages-config
      - name: data
        persistentVolumeClaim:
          claimName: git-pages-data
      serviceAccountName: git-pages
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: git-pages
  namespace: ${SHOGGOTH_NAMESPACE}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: git-pages-bootstrap-wait
  namespace: ${SHOGGOTH_NAMESPACE}
rules:
- apiGroups:
  - ''
  resources:
  - secrets
  resourceNames:
  - shoggoth-bootstrap-done
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: git-pages-bootstrap-wait
  namespace: ${SHOGGOTH_NAMESPACE}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: git-pages-bootstrap-wait
subjects:
- kind: ServiceAccount
  name: git-pages
  namespace: ${SHOGGOTH_NAMESPACE}
