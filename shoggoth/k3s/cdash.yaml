---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
    name: cdash-db
    namespace: ${SHOGGOTH_NAMESPACE}
spec:
    accessModes:
        - ReadWriteOnce
    resources:
        requests:
            storage: 5Gi
    storageClassName: local-path
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
    name: cdash-storage
    namespace: ${SHOGGOTH_NAMESPACE}
spec:
    accessModes:
        - ReadWriteOnce
    resources:
        requests:
            storage: 5Gi
    storageClassName: local-path
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cdash-entrypoint
  namespace: ${SHOGGOTH_NAMESPACE}
data:
  entrypoint-wrapper.sh: |
    #!/usr/bin/env bash
    set -euo pipefail

    . /shoggoth/rendered/cdash/cdash.env

    export APP_KEY DB_PASSWORD
    export CDASH_AUTHENTICATION_PROVIDER LOGIN_FIELD
    export LDAP_HOSTS LDAP_PORT LDAP_PROVIDER LDAP_LOCATE_USERS_BY LDAP_USERNAME LDAP_PASSWORD LDAP_BASE_DN
    export USER_CREATE_PROJECTS TOKEN_DURATION OPENLDAP_S_SLAVE_PASSWORD SHOGGOTH_VAULT_TOKEN OPENBAO_ADDR

    printf 'Listen 80\n' > /etc/apache2/ports.conf
    sed -i 's/:8080/:80/g' /etc/apache2/sites-enabled/cdash-site.conf

    unset LDAP_BIND_PASSWORD

    exec /cdash/docker/docker-entrypoint.sh "$@"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cdash-init
  namespace: ${SHOGGOTH_NAMESPACE}
data:
  init.sh: |
    #!/usr/bin/env bash
    set -euo pipefail

    . /shoggoth/rendered/cdash/cdash.env

    export APP_KEY DB_PASSWORD
    export CDASH_AUTHENTICATION_PROVIDER LOGIN_FIELD
    export LDAP_HOSTS LDAP_PORT LDAP_PROVIDER LDAP_LOCATE_USERS_BY LDAP_USERNAME LDAP_PASSWORD LDAP_BASE_DN

    cd /cdash

    echo "shoggoth: Waiting for CDash to be ready..."
    for i in $(seq 1 30); do
        if php artisan migrate:status > /dev/null 2>&1; then
            break
        fi
        sleep 2
    done
    if ! php artisan migrate:status > /dev/null 2>&1; then
        echo "shoggoth: FATAL: CDash not ready after 60s" >&2
        exit 1
    fi
    echo "shoggoth: CDash is ready"

    php artisan user:save \
        --email=sslave \
        --firstname=Slave \
        --lastname=User \
        --institution=shoggoth \
        --password="${OPENLDAP_S_SLAVE_PASSWORD}" \
        --admin=0 \
        || echo "shoggoth: WARNING: user:save failed (may already exist or DB issue)" >&2

    CDASH_URL="http://localhost"
    COOKIE_JAR="$(mktemp)"
    trap 'rm -f "${COOKIE_JAR}"' EXIT

    echo "shoggoth: Waiting for CDash web server..."
    for i in $(seq 1 30); do
        if curl -s -o /dev/null -w '%{http_code}' "${CDASH_URL}/login" 2>/dev/null | grep -q '^200'; then
            break
        fi
        sleep 2
    done
    if ! curl -s -o /dev/null -w '%{http_code}' "${CDASH_URL}/login" 2>/dev/null | grep -q '^200'; then
        echo "shoggoth: FATAL: CDash web server not ready after 60s" >&2
        exit 1
    fi
    echo "shoggoth: CDash web server is ready"

    CSRF_PAGE="$(curl -s -c "${COOKIE_JAR}" "${CDASH_URL}/login" 2>/dev/null)" || {
        echo "shoggoth: FATAL: Could not fetch CDash login page" >&2
        exit 1
    }
    CSRF_TOKEN="$(printf '%s' "${CSRF_PAGE}" \
        | sed -n 's/.*name="_token" value="\([^"]*\)".*/\1/p' | head -1)"

    if [ -z "${CSRF_TOKEN}" ]; then
        echo "shoggoth: FATAL: Could not get CSRF token from CDash login page" >&2
        exit 1
    fi

    LOGIN_RESULT="$(curl -s -b "${COOKIE_JAR}" -c "${COOKIE_JAR}" \
        -X POST "${CDASH_URL}/login" \
        -H "Content-Type: application/x-www-form-urlencoded" \
        -d "_token=${CSRF_TOKEN}&email=sslave&password=${OPENLDAP_S_SLAVE_PASSWORD}" \
        -o /dev/null -w '%{http_code} %{redirect_url}')"
    LOGIN_CODE="${LOGIN_RESULT%% *}"
    LOGIN_REDIRECT="${LOGIN_RESULT#* }"
    if [ "${LOGIN_CODE}" = "302" ] && printf '%s' "${LOGIN_REDIRECT}" | grep -qE '^https?://[^/]+/login'; then
        echo "shoggoth: FATAL: CDash login failed for sslave (redirected back to login)" >&2
        echo "shoggoth: Check /cdash/storage/logs/laravel.log for LDAP auth errors" >&2
        exit 1
    fi
    if [ "${LOGIN_CODE}" != "200" ] && [ "${LOGIN_CODE}" != "302" ]; then
        echo "shoggoth: FATAL: CDash login failed for sslave (HTTP ${LOGIN_CODE})" >&2
        exit 1
    fi

    GRAPHQL_RESPONSE="$(curl -s -b "${COOKIE_JAR}" \
        -X POST "${CDASH_URL}/graphql" \
        -H "Content-Type: application/json" \
        -H "X-Requested-With: XMLHttpRequest" \
        -d '{
            "query": "query { authenticationTokens(first: 100000) { edges { node { id description } } } }"
        }')" || {
        echo "shoggoth: FATAL: GraphQL query for existing tokens failed" >&2
        exit 1
    }

    OLD_TOKEN_IDS="$(printf '%s' "${GRAPHQL_RESPONSE}" \
        | php -r '$d=json_decode(stream_get_contents(STDIN),true);foreach(($d["data"]["authenticationTokens"]["edges"]??[]) as $e){if(($e["node"]["description"]??"")==="shoggoth-slave"){echo $e["node"]["id"]."\n";}}')"

    for TOKEN_ID in ${OLD_TOKEN_IDS}; do
        curl -s -b "${COOKIE_JAR}" \
            -X POST "${CDASH_URL}/graphql" \
            -H "Content-Type: application/json" \
            -H "X-Requested-With: XMLHttpRequest" \
            -d "{\"query\": \"mutation DeleteToken(\$input: DeleteAuthenticationTokenInput!) { deleteAuthenticationToken(input: \$input) { message } }\", \"variables\": {\"input\": {\"tokenId\": ${TOKEN_ID}}}}" \
            > /dev/null 2>&1 || true
    done

    GRAPHQL_RESPONSE="$(curl -s -b "${COOKIE_JAR}" \
        -X POST "${CDASH_URL}/graphql" \
        -H "Content-Type: application/json" \
        -H "X-Requested-With: XMLHttpRequest" \
        -d '{
            "query": "mutation CreateToken($input: CreateAuthenticationTokenInput!) { createAuthenticationToken(input: $input) { rawToken } }",
            "variables": {
                "input": {
                    "scope": "FULL_ACCESS",
                    "description": "shoggoth-slave",
                    "expiration": "2999-12-31T23:59:59Z"
                }
            }
        }')" || {
        echo "shoggoth: FATAL: GraphQL createAuthenticationToken request failed" >&2
        exit 1
    }

    RAW_TOKEN="$(printf '%s' "${GRAPHQL_RESPONSE}" \
        | php -r '$d=json_decode(stream_get_contents(STDIN),true);echo $d["data"]["createAuthenticationToken"]["rawToken"]??"";')"

    if [ -z "${RAW_TOKEN}" ]; then
        echo "shoggoth: FATAL: GraphQL did not return a raw token" >&2
        printf '%s\n' "${GRAPHQL_RESPONSE}" >&2
        exit 1
    fi

    OBAO_HEALTH="$(curl -s -o /dev/null -w '%{http_code}' "${OPENBAO_ADDR}/v1/sys/health" 2>/dev/null)" || true
    if ! printf '%s' "${OBAO_HEALTH}" | grep -qE '^(200|429|472|473)$'; then
        echo "shoggoth: FATAL: OpenBao not ready (HTTP ${OBAO_HEALTH})" >&2
        exit 1
    fi
    echo "shoggoth: OpenBao is unsealed (HTTP ${OBAO_HEALTH})"

    OBAO_RESP="$(mktemp)"
    OBAO_HTTP="$(curl -s -w '%{http_code}' -o "${OBAO_RESP}" -X POST \
        "${OPENBAO_ADDR}/v1/secret/data/cdash/api-token" \
        -H "X-Vault-Token: ${SHOGGOTH_VAULT_TOKEN}" \
        -H "Content-Type: application/json" \
        -d "{\"data\":{\"value\":\"${RAW_TOKEN}\"}}" 2>&1)" || true
    if ! printf '%s' "${OBAO_HTTP}" | grep -qE '^(200|204)$'; then
        echo "shoggoth: FATAL: Failed to store CDash API token in OpenBao (HTTP ${OBAO_HTTP})" >&2
        echo "shoggoth: Response: $(cat "${OBAO_RESP}" 2>/dev/null)" >&2
        echo "shoggoth: OPENBAO_ADDR=${OPENBAO_ADDR}" >&2
        echo "shoggoth: Token length: ${#SHOGGOTH_VAULT_TOKEN}" >&2
        rm -f "${OBAO_RESP}"
        exit 1
    fi
    rm -f "${OBAO_RESP}"

    echo "shoggoth: CDash slave token created and stored in OpenBao"
    echo "shoggoth: Restart web-internal to pick up the new token"

---
apiVersion: v1
kind: Service
metadata:
  name: cdash-db
  namespace: ${SHOGGOTH_NAMESPACE}
spec:
  selector:
    app: cdash-db
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cdash-db
  namespace: ${SHOGGOTH_NAMESPACE}
spec:
  serviceName: cdash-db
  replicas: 1
  selector:
    matchLabels:
      app: cdash-db
  template:
    metadata:
      labels:
        app: cdash-db
    spec:
      dnsPolicy: None
      dnsConfig:
        nameservers:
          - ${DNS_IP}
        searches:
          - ${SHOGGOTH_NAMESPACE}.svc.cluster.local
          - svc.cluster.local
          - cluster.local
      initContainers:
        - name: wait-bringup
          image: busybox:latest
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c"]
          args:
            - |
              echo "wait-bringup: checking sentinel /shoggoth/rendered/.bringup-done"
              if [ ! -f /shoggoth/rendered/.bringup-done ]; then
                echo "wait-bringup: sentinel not found, dumping diagnostics:" >&2
                echo "wait-bringup: /shoggoth/rendered/ exists: $([ -d /shoggoth/rendered ] && echo yes || echo no)" >&2
                if [ -d /shoggoth/rendered ]; then
                  echo "wait-bringup: contents:" >&2
                  ls -la /shoggoth/rendered/ >&2 || true
                fi
                if [ -f /shoggoth/rendered/bringup.log ]; then
                  echo "wait-bringup: bringup.log tail:" >&2
                  tail -20 /shoggoth/rendered/bringup.log >&2 || true
                fi
                echo "wait-bringup: exiting, bringup may still be in progress" >&2
                exit 1
              fi
              echo "wait-bringup: sentinel found"
          resources:
            requests:
              memory: "32Mi"
              cpu: "50m"
            limits:
              memory: "64Mi"
              cpu: "200m"
          volumeMounts:
            - name: rendered
              mountPath: /shoggoth/rendered
              readOnly: true
      containers:
        - name: postgres
          image: postgres:18-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_DB
              value: cdash
            - name: POSTGRES_USER
              value: cdash
            - name: POSTGRES_PASSWORD_FILE
              value: /run/secrets/cdash_db_password
            - name: OTEL_TRACES_EXPORTER
              value: "otlp"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otelcol:4318"
            - name: SHOGGOTH_DOMAIN
              value: "${SHOGGOTH_DOMAIN}"
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
            - name: db-password
              mountPath: /run/secrets/cdash_db_password
              subPath: password
              readOnly: true
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "cdash"]
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "cdash"]
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
      volumes:
        - name: rendered
          hostPath:
            path: /var/lib/rancher/k3s/storage/${SHOGGOTH_INSTANCE_DIR}/rendered
            type: DirectoryOrCreate
        - name: db-password
          secret:
            secretName: cdash-db-password
        - name: data
          persistentVolumeClaim:
            claimName: cdash-db

---
apiVersion: v1
kind: Service
metadata:
  name: cdash
  namespace: ${SHOGGOTH_NAMESPACE}
spec:
  selector:
    app: cdash
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cdash
  namespace: ${SHOGGOTH_NAMESPACE}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cdash
  template:
    metadata:
      labels:
        app: cdash
    spec:
      dnsPolicy: None
      dnsConfig:
        nameservers:
          - ${DNS_IP}
        searches:
          - ${SHOGGOTH_NAMESPACE}.svc.cluster.local
          - svc.cluster.local
          - cluster.local
      initContainers:
        - name: wait-bringup
          image: busybox:latest
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c"]
          args:
            - |
              echo "wait-bringup: checking sentinel /shoggoth/rendered/.bringup-done"
              if [ ! -f /shoggoth/rendered/.bringup-done ]; then
                echo "wait-bringup: sentinel not found, dumping diagnostics:" >&2
                echo "wait-bringup: /shoggoth/rendered/ exists: $([ -d /shoggoth/rendered ] && echo yes || echo no)" >&2
                if [ -d /shoggoth/rendered ]; then
                  echo "wait-bringup: contents:" >&2
                  ls -la /shoggoth/rendered/ >&2 || true
                fi
                if [ -f /shoggoth/rendered/bringup.log ]; then
                  echo "wait-bringup: bringup.log tail:" >&2
                  tail -20 /shoggoth/rendered/bringup.log >&2 || true
                fi
                echo "wait-bringup: exiting, bringup may still be in progress" >&2
                exit 1
              fi
              echo "wait-bringup: sentinel found"
          resources:
            requests:
              memory: "32Mi"
              cpu: "50m"
            limits:
              memory: "64Mi"
              cpu: "200m"
          volumeMounts:
            - name: rendered
              mountPath: /shoggoth/rendered
              readOnly: true
      containers:
        - name: cdash
          image: kitware/cdash:latest
          imagePullPolicy: IfNotPresent
          command: ["/cdash/entrypoint-wrapper.sh"]
          args: ["start-website"]
          ports:
            - containerPort: 80
              name: http
          env:
            - name: APP_URL
              value: http://cdash.${SHOGGOTH_DOMAIN}
            - name: DB_HOST
              value: cdash-db
            - name: DB_PORT
              value: "5432"
            - name: DB_DATABASE
              value: cdash
            - name: DB_USERNAME
              value: cdash
            - name: QUEUE_CONNECTION
              value: database
            - name: OTEL_TRACES_EXPORTER
              value: "otlp"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otelcol:4318"
            - name: SHOGGOTH_DOMAIN
              value: "${SHOGGOTH_DOMAIN}"
          volumeMounts:
            - name: storage
              mountPath: /cdash/storage
            - name: rendered
              mountPath: /shoggoth/rendered
              readOnly: true
            - name: entrypoint-script
              mountPath: /cdash/entrypoint-wrapper.sh
              subPath: entrypoint-wrapper.sh
              readOnly: true
            - name: init-script
              mountPath: /shoggoth/cdash/init.sh
              subPath: init.sh
              readOnly: true
            - name: db-password
              mountPath: /run/secrets/cdash_db_password
              subPath: password
              readOnly: true
          lifecycle:
            postStart:
              exec:
                command:
                  - /bin/bash
                  - -c
                  - |
                    set -o pipefail
                    LOG=/shoggoth/rendered/cdash-init.log
                    exec > >(tee -a "${LOG}" > /proc/1/fd/1) 2>&1
                    echo "=== cdash-init start $(date -Iseconds) ==="
                    /bin/bash /shoggoth/cdash/init.sh
                    echo "=== cdash-init exit $? $(date -Iseconds) ==="
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "1000m"
          readinessProbe:
            httpGet:
              path: /login
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /login
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
      volumes:
        - name: rendered
          hostPath:
            path: /var/lib/rancher/k3s/storage/${SHOGGOTH_INSTANCE_DIR}/rendered
            type: DirectoryOrCreate
        - name: entrypoint-script
          configMap:
            name: cdash-entrypoint
            defaultMode: 0755
        - name: init-script
          configMap:
            name: cdash-init
            defaultMode: 0755
        - name: storage
          persistentVolumeClaim:
            claimName: cdash-storage
        - name: db-password
          secret:
            secretName: cdash-db-password