apiVersion: v1
kind: ConfigMap
metadata:
  name: redmine-init
  namespace: ${SHOGGOTH_NAMESPACE}
data:
  init.sh: |
    #!/bin/sh
    set -eu

    if [ -n "${REDMINE_SECRET_KEY_BASE_FILE:-}" ] && [ -z "${SECRET_KEY_BASE:-}" ]; then
        export SECRET_KEY_BASE="$(cat "${REDMINE_SECRET_KEY_BASE_FILE}")"
    fi

    echo "shoggoth: Waiting for Redmine to be ready..."
    for i in $(seq 1 30); do
        if bundle exec rails runner 'puts "ready"' > /dev/null 2>&1; then
            break
        fi
        sleep 2
    done
    if ! READY_CHECK="$(bundle exec rails runner 'puts "ready"' 2>&1)"; then
        echo "shoggoth: FATAL: Redmine not ready after 60s: ${READY_CHECK}" >&2
        exit 1
    fi
    echo "shoggoth: Redmine is ready for LDAP configuration"

    echo "shoggoth: Configuring LDAP auth source"
    for VAR in LDAP_HOST LDAP_BIND_DN LDAP_BIND_PASSWORD LDAP_BASE_DN; do
        if [ -z "$(eval "echo \"\${${VAR}:-}\"")" ]; then
            echo "shoggoth: ERROR: ${VAR} not set" >&2
            exit 1
        fi
    done
    LDAP_HOST="${LDAP_HOST}" LDAP_BIND_DN="${LDAP_BIND_DN}" LDAP_BIND_PASSWORD="${LDAP_BIND_PASSWORD}" LDAP_BASE_DN="${LDAP_BASE_DN}" \
        bundle exec rails runner '
        auth = AuthSourceLdap.find_or_initialize_by(name: "openldap")
        auth.host = ENV["LDAP_HOST"]
        auth.port = 389
        auth.account = ENV["LDAP_BIND_DN"]
        auth.account_password = ENV["LDAP_BIND_PASSWORD"]
        auth.base_dn = ENV["LDAP_BASE_DN"]
        auth.attr_login = "uid"
        auth.attr_firstname = "cn"
        auth.attr_lastname = "sn"
        auth.attr_mail = "mail"
        auth.onthefly_register = true
        auth.tls = false
        auth.save!
    ' && echo "shoggoth: === redmine ldap init complete ===" \
        || { echo "shoggoth: FATAL: LDAP auth source configuration failed" >&2; exit 1; }

    echo "shoggoth: Setting local admin password"
    if [ -z "${SHOGGOTH_ADMIN_PASSWORD:-}" ]; then
        echo "shoggoth: ERROR: SHOGGOTH_ADMIN_PASSWORD not set" >&2
        exit 1
    fi
    RESULT="$(SHOGGOTH_ADMIN_PASSWORD="${SHOGGOTH_ADMIN_PASSWORD}" bundle exec rails runner '
        user = User.find_by_login("admin")
        if user
          user.password = ENV["SHOGGOTH_ADMIN_PASSWORD"]
          user.password_confirmation = ENV["SHOGGOTH_ADMIN_PASSWORD"]
          user.must_change_passwd = false
          user.save!
          puts "updated"
        else
          puts "not_found"
        end
    ')" || { echo "shoggoth: ERROR: admin password update failed" >&2; exit 1; }
    case "${RESULT}" in
        updated)    echo "shoggoth: admin password updated" ;;
        not_found)  echo "shoggoth: admin user not found, skipping password update" ;;
    esac

    echo "shoggoth: Ensuring slave user and api_key"
    SLAVE_KEY="$(bundle exec rails runner /shoggoth/redmine/slave_token_init.rb)" || { echo "shoggoth: ERROR: slave api_key init failed" >&2; exit 1; }

    if [ -z "${SLAVE_KEY}" ]; then
        echo "shoggoth: ERROR: slave token empty; cannot mark ready" >&2
        exit 1
    fi
    echo "shoggoth: slave api_key stored in OpenBao at redmine/slave-token (len=${#SLAVE_KEY})"

    echo "shoggoth: Marking token init as ready"
    touch /tmp/slave-token-ready

    echo "shoggoth: Syncing slave project memberships"
    bundle exec rails runner '
        User.current = User.find_by_login("admin")
        slave = User.find_by_login("slave")
        developer_role = Role.find_by(name: "Developer")
        if slave && developer_role
            added = 0
            Project.where(status: Project::STATUS_ACTIVE).each do |project|
                unless Member.exists?(project_id: project.id, user_id: slave.id)
                    Member.create!(project_id: project.id, user_id: slave.id, role_ids: [developer_role.id])
                    added += 1
                end
            end
            puts "added=#{added} total=#{Project.where(status: Project::STATUS_ACTIVE).count}"
        else
            puts "skipped"
        end
    ' && echo "shoggoth: === redmine slave init complete ===" \
        || echo "shoggoth: WARNING: membership sync failed"
  slave_token_init.rb: |
    require 'net/http'
    require 'uri'
    require 'json'

    User.current = User.find_by_login("admin")
    ldap_auth = AuthSourceLdap.find_by(name: "openldap")
    slave = User.find_by_login("slave")
    if slave.nil? && ldap_auth
        slave = User.new
        slave.login = "slave"
        slave.firstname = "Slave"
        slave.lastname = "User"
        slave.mail = "slave@localhost"
        slave.auth_source = ldap_auth
        slave.language = "en"
        slave.must_change_passwd = false
        slave.save!
    end
    if slave.nil?
        STDERR.puts "slave user unavailable"
        exit 1
    end

    token = Token.create(user: slave, action: 'api')
    new_key = token.value

    openbao_addr = ENV['OPENBAO_ADDR'].to_s
    vault_token = ENV['SHOGGOTH_VAULT_TOKEN'].to_s
    if openbao_addr.empty? || vault_token.empty?
        STDERR.puts "OPENBAO_ADDR or SHOGGOTH_VAULT_TOKEN not set"
        exit 1
    end

    uri = URI.parse("#{openbao_addr}/v1/secret/data/redmine/slave-token")
    http = Net::HTTP.new(uri.host, uri.port)
    http.use_ssl = (uri.scheme == 'https')
    req = Net::HTTP::Post.new(uri.request_uri)
    req['X-Vault-Token'] = vault_token
    req['Content-Type'] = 'application/json'
    req.body = JSON.generate(data: { value: new_key })

    begin
        resp = http.request(req)
    rescue => e
        STDERR.puts "OpenBao write exception: #{e.class}: #{e.message}"
        exit 1
    end

    unless resp.code == '200' || resp.code == '204'
        STDERR.puts "OpenBao write returned HTTP #{resp.code}: #{resp.body}"
        exit 1
    end

    print new_key
---
apiVersion: v1
kind: Service
metadata:
  name: redmine-db
  namespace: ${SHOGGOTH_NAMESPACE}
spec:
  selector:
    app: redmine-db
  ports:
  - name: postgres
    port: 5432
    targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redmine-db
  namespace: ${SHOGGOTH_NAMESPACE}
spec:
  serviceName: redmine-db
  replicas: 1
  selector:
    matchLabels:
      app: redmine-db
  template:
    metadata:
      labels:
        app: redmine-db
    spec:
      dnsPolicy: None
      dnsConfig:
        nameservers:
        - ${SHOGGOTH_DNS_IP}
        searches:
        - ${SHOGGOTH_NAMESPACE}.svc.cluster.local
        - svc.cluster.local
        - cluster.local
      initContainers:
      - name: wait-bootstrap
        image: asherikov/shoggoth_tools:alpine
        imagePullPolicy: IfNotPresent
        command:
        - bash
        - -c
        args:
        - |
          set -euo pipefail
          K8S_API="${K8S_API:-https://kubernetes.default.svc}"
          SA_TOKEN="$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)"
          SA_CA="/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
          for i in $(seq 1 120); do
            http_code=$(curl -sS --cacert "${SA_CA}" \
              -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer ${SA_TOKEN}" \
              "${K8S_API}/api/v1/namespaces/${SHOGGOTH_NAMESPACE}/secrets/shoggoth-bootstrap-done" || true)
            if [ "${http_code}" = "200" ]; then
              echo "wait-bootstrap: shoggoth-bootstrap-done Secret found"
              exit 0
            fi
            echo "wait-bootstrap: waiting for shoggoth-bootstrap-done Secret (attempt $i/120, http=${http_code})..."
            if [ $((i % 12)) -eq 0 ] && [ "${http_code}" != "404" ]; then
              curl -sS --cacert "${SA_CA}" \
                -H "Authorization: Bearer ${SA_TOKEN}" \
                "${K8S_API}/api/v1/namespaces/${SHOGGOTH_NAMESPACE}/secrets/shoggoth-bootstrap-done" >&2 || true
            fi
            sleep 5
          done
          echo "wait-bootstrap: FATAL: shoggoth-bootstrap-done Secret not found after 600s"
          echo "wait-bootstrap: openbao-bootstrap may have failed; check:"
          echo "  kubectl logs -n ${SHOGGOTH_NAMESPACE} -l app=openbao -c openbao-bootstrap"
          exit 1
        resources:
          requests:
            memory: 32Mi
            cpu: 50m
          limits:
            memory: 64Mi
            cpu: 200m
        volumeMounts: []
      containers:
      - name: postgres
        image: postgres:18-alpine
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5432
          name: postgres
        env:
        - name: POSTGRES_DB
          value: redmine
        - name: POSTGRES_USER
          value: redmine
        - name: POSTGRES_PASSWORD_FILE
          value: /run/secrets/redmine_db_password
        - name: OTEL_TRACES_EXPORTER
          value: otlp
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://otelcol:4318
        - name: SHOGGOTH_DOMAIN
          value: ${SHOGGOTH_DOMAIN}
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql
        - name: db-password
          mountPath: /run/secrets/redmine_db_password
          subPath: password
          readOnly: true
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - redmine
          initialDelaySeconds: 5
          periodSeconds: 5
          failureThreshold: 60
        livenessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - redmine
          initialDelaySeconds: 30
          periodSeconds: 10
        resources:
          requests:
            memory: 128Mi
            cpu: 100m
          limits:
            memory: 256Mi
            cpu: 500m
      volumes:
      - name: db-password
        secret:
          secretName: redmine-db-password
      - name: data
        persistentVolumeClaim:
          claimName: redmine-db
      serviceAccountName: redmine-db
---
apiVersion: v1
kind: Service
metadata:
  name: redmine
  namespace: ${SHOGGOTH_NAMESPACE}
spec:
  selector:
    app: redmine
  ports:
  - name: http
    port: 80
    targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redmine
  namespace: ${SHOGGOTH_NAMESPACE}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redmine
  template:
    metadata:
      labels:
        app: redmine
    spec:
      dnsPolicy: None
      dnsConfig:
        nameservers:
        - ${SHOGGOTH_DNS_IP}
        searches:
        - ${SHOGGOTH_NAMESPACE}.svc.cluster.local
        - svc.cluster.local
        - cluster.local
      initContainers:
      - name: wait-bootstrap
        image: asherikov/shoggoth_tools:alpine
        imagePullPolicy: IfNotPresent
        command:
        - bash
        - -c
        args:
        - |
          set -euo pipefail
          K8S_API="${K8S_API:-https://kubernetes.default.svc}"
          SA_TOKEN="$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)"
          SA_CA="/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
          for i in $(seq 1 120); do
            http_code=$(curl -sS --cacert "${SA_CA}" \
              -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer ${SA_TOKEN}" \
              "${K8S_API}/api/v1/namespaces/${SHOGGOTH_NAMESPACE}/secrets/shoggoth-bootstrap-done" || true)
            if [ "${http_code}" = "200" ]; then
              echo "wait-bootstrap: shoggoth-bootstrap-done Secret found"
              exit 0
            fi
            echo "wait-bootstrap: waiting for shoggoth-bootstrap-done Secret (attempt $i/120, http=${http_code})..."
            if [ $((i % 12)) -eq 0 ] && [ "${http_code}" != "404" ]; then
              curl -sS --cacert "${SA_CA}" \
                -H "Authorization: Bearer ${SA_TOKEN}" \
                "${K8S_API}/api/v1/namespaces/${SHOGGOTH_NAMESPACE}/secrets/shoggoth-bootstrap-done" >&2 || true
            fi
            sleep 5
          done
          echo "wait-bootstrap: FATAL: shoggoth-bootstrap-done Secret not found after 600s"
          echo "wait-bootstrap: openbao-bootstrap may have failed; check:"
          echo "  kubectl logs -n ${SHOGGOTH_NAMESPACE} -l app=openbao -c openbao-bootstrap"
          exit 1
        resources:
          requests:
            memory: 32Mi
            cpu: 50m
          limits:
            memory: 64Mi
            cpu: 200m
        volumeMounts: []
      containers:
      - name: redmine
        image: redmine:7.0.0-alpine3.23
        imagePullPolicy: IfNotPresent
        args:
        - rails
        - server
        - -b
        - 0.0.0.0
        - -p
        - '80'
        ports:
        - containerPort: 80
          name: http
        env:
        - name: REDMINE_DB_POSTGRES
          value: redmine-db
        - name: REDMINE_DB_PORT
          value: '5432'
        - name: REDMINE_DB_DATABASE
          value: redmine
        - name: REDMINE_DB_USERNAME
          value: redmine
        - name: REDMINE_DB_PASSWORD_FILE
          value: /run/secrets/redmine_db_password
        - name: REDMINE_SECRET_KEY_BASE_FILE
          value: /run/secrets/redmine_secret_key_base
        - name: REDMINE_PLUGINS_MIGRATE
          value: 'true'
        - name: LDAP_BASE_DN
          value: ${LDAP_BASE_DN}
        - name: LDAP_HOST
          value: openldap
        - name: LDAP_BIND_DN
          value: uid=ldapauth,ou=people,${LDAP_BASE_DN}
        - name: LDAP_BIND_PASSWORD
          valueFrom:
            secretKeyRef:
              name: openldap-ldapauth-password
              key: password
        - name: SHOGGOTH_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: openldap-admin-password
              key: password
        - name: OTEL_TRACES_EXPORTER
          value: otlp
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://otelcol:4318
        - name: SHOGGOTH_DOMAIN
          value: ${SHOGGOTH_DOMAIN}
        - name: OPENBAO_ADDR
          value: http://openbao:80
        - name: SHOGGOTH_VAULT_TOKEN
          valueFrom:
            secretKeyRef:
              name: openbao-unseal-key
              key: root-token
        volumeMounts:
        - name: files
          mountPath: /usr/src/redmine/files
        - name: bundle-cache
          mountPath: /usr/local/bundle/cache/
        - name: plugins
          mountPath: /usr/src/redmine/plugins
        - name: init-script
          mountPath: /shoggoth/redmine/init.sh
          subPath: init.sh
          readOnly: true
        - name: init-script
          mountPath: /shoggoth/redmine/slave_token_init.rb
          subPath: slave_token_init.rb
          readOnly: true
        - name: db-password
          mountPath: /run/secrets/redmine_db_password
          subPath: password
          readOnly: true
        - name: secret-key-base
          mountPath: /run/secrets/redmine_secret_key_base
          subPath: secret-key-base
          readOnly: true
        lifecycle:
          postStart:
            exec:
              command:
              - /bin/bash
              - -c
              - 'set -o pipefail

                LOG=/usr/src/redmine/files/redmine-init.log

                exec > >(tee -a "${LOG}" > /proc/1/fd/1) 2>&1

                echo "=== redmine-init start $(date -Iseconds) ==="

                /bin/sh /shoggoth/redmine/init.sh

                echo "=== redmine-init exit $? $(date -Iseconds) ==="

                '
        resources:
          requests:
            memory: 256Mi
            cpu: 200m
          limits:
            memory: 512Mi
            cpu: 1000m
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - '[ -f /tmp/slave-token-ready ]'
          initialDelaySeconds: 15
          periodSeconds: 10
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
          failureThreshold: 6
      volumes:
      - name: init-script
        configMap:
          name: redmine-init
          defaultMode: 493
      - name: files
        persistentVolumeClaim:
          claimName: redmine-files
      - name: bundle-cache
        persistentVolumeClaim:
          claimName: redmine-bundle-cache
      - name: plugins
        hostPath:
          path: /var/lib/rancher/k3s/storage/${SHOGGOTH_INSTANCE_DIR}/redmine-plugins
          type: DirectoryOrCreate
      - name: db-password
        secret:
          secretName: redmine-db-password
      - name: secret-key-base
        secret:
          secretName: redmine-secret-key-base
      serviceAccountName: redmine
---
