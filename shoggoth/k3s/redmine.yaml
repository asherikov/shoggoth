metadata:
  name: redmine-db-bootstrap-wait
  namespace: ${SHOGGOTH_NAMESPACE}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: redmine-db-bootstrap-wait
subjects:
