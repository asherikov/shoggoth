  name: redmine-bootstrap-wait
  namespace: ${SHOGGOTH_NAMESPACE}
rules:
- apiGroups:
  - ''
  resources:
  - secrets
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: redmine-bootstrap-wait
  namespace: ${SHOGGOTH_NAMESPACE}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: redmine-bootstrap-wait
subjects:
- kind: ServiceAccount
  name: redmine
  namespace: ${SHOGGOTH_NAMESPACE}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: redmine-db
  namespace: ${SHOGGOTH_NAMESPACE}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: redmine-db-bootstrap-wait
  namespace: ${SHOGGOTH_NAMESPACE}
rules:
- apiGroups:
  - ''
  resources:
  - secrets
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: redmine-db-bootstrap-wait
  namespace: ${SHOGGOTH_NAMESPACE}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: redmine-db-bootstrap-wait
subjects:
- kind: ServiceAccount
  name: redmine-db
  namespace: ${SHOGGOTH_NAMESPACE}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: redmine-templates
  namespace: ${SHOGGOTH_NAMESPACE}
data:
  redmine.env: 'LDAP_BASE_DN=${LDAP_BASE_DN}

    LDAP_HOST=openldap

    LDAP_BIND_DN=uid=ldapauth,ou=people,${LDAP_BASE_DN}

    LDAP_BIND_PASSWORD=${LDAP_BIND_PASSWORD}

    SHOGGOTH_ADMIN_PASSWORD=${SHOGGOTH_ADMIN_PASSWORD}

    '
