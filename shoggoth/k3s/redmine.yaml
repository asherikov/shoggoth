---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
    name: redmine-db
    namespace: ${SHOGGOTH_NAMESPACE}
spec:
    accessModes:
        - ReadWriteOnce
    resources:
        requests:
            storage: 5Gi
    storageClassName: local-path
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
    name: redmine-files
    namespace: ${SHOGGOTH_NAMESPACE}
spec:
    accessModes:
        - ReadWriteOnce
    resources:
        requests:
            storage: 5Gi
    storageClassName: local-path
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
    name: redmine-bundle-cache
    namespace: ${SHOGGOTH_NAMESPACE}
spec:
    accessModes:
        - ReadWriteOnce
    resources:
        requests:
            storage: 2Gi
    storageClassName: local-path
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: redmine-init
  namespace: ${SHOGGOTH_NAMESPACE}
data:
  init.sh: |
    #!/bin/sh
    set -eu

    if [ -n "${REDMINE_SECRET_KEY_BASE_FILE:-}" ] && [ -z "${SECRET_KEY_BASE:-}" ]; then
        export SECRET_KEY_BASE="$(cat "${REDMINE_SECRET_KEY_BASE_FILE}")"
    fi

    if [ ! -f /shoggoth/rendered/redmine/redmine.env ]; then
        echo "shoggoth: FATAL: /shoggoth/rendered/redmine/redmine.env not found — bringup may not have completed" >&2
        exit 1
    fi
    . /shoggoth/rendered/redmine/redmine.env

    echo "shoggoth: Waiting for Redmine to be ready..."
    for i in $(seq 1 30); do
        if bundle exec rails runner 'puts "ready"' > /dev/null 2>&1; then
            break
        fi
        sleep 2
    done
    if ! READY_CHECK="$(bundle exec rails runner 'puts "ready"' 2>&1)"; then
        echo "shoggoth: FATAL: Redmine not ready after 60s: ${READY_CHECK}" >&2
        exit 1
    fi
    echo "shoggoth: Redmine is ready for LDAP configuration"

    echo "shoggoth: Configuring LDAP auth source"
    for VAR in LDAP_HOST LDAP_BIND_DN LDAP_BIND_PASSWORD LDAP_BASE_DN; do
        eval "VAL=\${${VAR}:-}"
        if [ -z "${VAL}" ]; then
            echo "shoggoth: ERROR: ${VAR} not set — redmine.env may be incomplete" >&2
            exit 1
        fi
    done
    LDAP_HOST="${LDAP_HOST}" LDAP_BIND_DN="${LDAP_BIND_DN}" LDAP_BIND_PASSWORD="${LDAP_BIND_PASSWORD}" LDAP_BASE_DN="${LDAP_BASE_DN}" \
        bundle exec rails runner '
        auth = AuthSourceLdap.find_or_initialize_by(name: "openldap")
        auth.host = ENV["LDAP_HOST"]
        auth.port = 389
        auth.account = ENV["LDAP_BIND_DN"]
        auth.account_password = ENV["LDAP_BIND_PASSWORD"]
        auth.base_dn = ENV["LDAP_BASE_DN"]
        auth.attr_login = "uid"
        auth.attr_firstname = "cn"
        auth.attr_lastname = "sn"
        auth.attr_mail = "mail"
        auth.onthefly_register = true
        auth.tls = false
        auth.save!
    ' && echo "shoggoth: === redmine ldap init complete ===" \
        || { echo "shoggoth: FATAL: LDAP auth source configuration failed" >&2; exit 1; }

    echo "shoggoth: Setting local admin password"
    if [ -z "${SHOGGOTH_ADMIN_PASSWORD:-}" ]; then
        echo "shoggoth: ERROR: SHOGGOTH_ADMIN_PASSWORD not set — redmine.env may be incomplete" >&2
        exit 1
    fi
    RESULT="$(SHOGGOTH_ADMIN_PASSWORD="${SHOGGOTH_ADMIN_PASSWORD}" bundle exec rails runner '
        user = User.find_by_login("admin")
        if user
          user.password = ENV["SHOGGOTH_ADMIN_PASSWORD"]
          user.password_confirmation = ENV["SHOGGOTH_ADMIN_PASSWORD"]
          user.must_change_passwd = false
          user.save!
          puts "updated"
        else
          puts "not_found"
        end
    ')" || { echo "shoggoth: ERROR: admin password update failed" >&2; exit 1; }
    case "${RESULT}" in
        updated)    echo "shoggoth: admin password updated" ;;
        not_found)  echo "shoggoth: admin user not found, skipping password update" ;;
    esac

---
apiVersion: v1
kind: Service
metadata:
  name: redmine-db
  namespace: ${SHOGGOTH_NAMESPACE}
spec:
  selector:
    app: redmine-db
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redmine-db
  namespace: ${SHOGGOTH_NAMESPACE}
spec:
  serviceName: redmine-db
  replicas: 1
  selector:
    matchLabels:
      app: redmine-db
  template:
    metadata:
      labels:
        app: redmine-db
    spec:
      dnsPolicy: None
      dnsConfig:
        nameservers:
          - ${DNS_IP}
        searches:
          - ${SHOGGOTH_NAMESPACE}.svc.cluster.local
          - svc.cluster.local
          - cluster.local
      initContainers:
        - name: wait-bringup
          image: busybox:latest
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c"]
          args:
            - |
              echo "wait-bringup: checking sentinel /shoggoth/rendered/.bringup-done"
              if [ ! -f /shoggoth/rendered/.bringup-done ]; then
                echo "wait-bringup: sentinel not found, dumping diagnostics:" >&2
                echo "wait-bringup: /shoggoth/rendered/ exists: $([ -d /shoggoth/rendered ] && echo yes || echo no)" >&2
                if [ -d /shoggoth/rendered ]; then
                  echo "wait-bringup: contents:" >&2
                  ls -la /shoggoth/rendered/ >&2 || true
                fi
                if [ -f /shoggoth/rendered/bringup.log ]; then
                  echo "wait-bringup: bringup.log tail:" >&2
                  tail -20 /shoggoth/rendered/bringup.log >&2 || true
                fi
                echo "wait-bringup: exiting, bringup may still be in progress" >&2
                exit 1
              fi
              echo "wait-bringup: sentinel found"
          resources:
            requests:
              memory: "32Mi"
              cpu: "50m"
            limits:
              memory: "64Mi"
              cpu: "200m"
          volumeMounts:
            - name: rendered
              mountPath: /shoggoth/rendered
              readOnly: true
      containers:
        - name: postgres
          image: postgres:18-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_DB
              value: redmine
            - name: POSTGRES_USER
              value: redmine
            - name: POSTGRES_PASSWORD_FILE
              value: /run/secrets/redmine_db_password
            - name: OTEL_TRACES_EXPORTER
              value: "otlp"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otelcol:4318"
            - name: SHOGGOTH_DOMAIN
              value: "${SHOGGOTH_DOMAIN}"
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
            - name: db-password
              mountPath: /run/secrets/redmine_db_password
              subPath: password
              readOnly: true
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "redmine"]
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "redmine"]
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
      volumes:
        - name: rendered
          hostPath:
            path: /var/lib/rancher/k3s/storage/${SHOGGOTH_INSTANCE_DIR}/rendered
            type: DirectoryOrCreate
        - name: db-password
          secret:
            secretName: redmine-db-password
        - name: data
          persistentVolumeClaim:
            claimName: redmine-db

---
apiVersion: v1
kind: Service
metadata:
  name: redmine
  namespace: ${SHOGGOTH_NAMESPACE}
spec:
  selector:
    app: redmine
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redmine
  namespace: ${SHOGGOTH_NAMESPACE}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redmine
  template:
    metadata:
      labels:
        app: redmine
    spec:
      dnsPolicy: None
      dnsConfig:
        nameservers:
          - ${DNS_IP}
        searches:
          - ${SHOGGOTH_NAMESPACE}.svc.cluster.local
          - svc.cluster.local
          - cluster.local
      initContainers:
        - name: wait-bringup
          image: busybox:latest
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c"]
          args:
            - |
              echo "wait-bringup: checking sentinel /shoggoth/rendered/.bringup-done"
              if [ ! -f /shoggoth/rendered/.bringup-done ]; then
                echo "wait-bringup: sentinel not found, dumping diagnostics:" >&2
                echo "wait-bringup: /shoggoth/rendered/ exists: $([ -d /shoggoth/rendered ] && echo yes || echo no)" >&2
                if [ -d /shoggoth/rendered ]; then
                  echo "wait-bringup: contents:" >&2
                  ls -la /shoggoth/rendered/ >&2 || true
                fi
                if [ -f /shoggoth/rendered/bringup.log ]; then
                  echo "wait-bringup: bringup.log tail:" >&2
                  tail -20 /shoggoth/rendered/bringup.log >&2 || true
                fi
                echo "wait-bringup: exiting, bringup may still be in progress" >&2
                exit 1
              fi
              echo "wait-bringup: sentinel found"
          resources:
            requests:
              memory: "32Mi"
              cpu: "50m"
            limits:
              memory: "64Mi"
              cpu: "200m"
          volumeMounts:
            - name: rendered
              mountPath: /shoggoth/rendered
              readOnly: true
        - name: fix-permissions
          image: asherikov/shoggoth_tools:alpine
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 0
          command: ["bash", "-c"]
          args:
            - "chown -R 999:999 /usr/src/redmine/plugins /usr/src/redmine/files /usr/local/bundle/cache || true"
          volumeMounts:
            - name: plugins
              mountPath: /usr/src/redmine/plugins
            - name: files
              mountPath: /usr/src/redmine/files
            - name: bundle-cache
              mountPath: /usr/local/bundle/cache
      containers:
        - name: redmine
          image: redmine:6.1.2-alpine
          imagePullPolicy: IfNotPresent
          args:
            - "rails"
            - "server"
            - "-b"
            - "0.0.0.0"
            - "-p"
            - "80"
          ports:
            - containerPort: 80
              name: http
          env:
            - name: REDMINE_DB_POSTGRES
              value: redmine-db
            - name: REDMINE_DB_PORT
              value: "5432"
            - name: REDMINE_DB_DATABASE
              value: redmine
            - name: REDMINE_DB_USERNAME
              value: redmine
            - name: REDMINE_DB_PASSWORD_FILE
              value: /run/secrets/redmine_db_password
            - name: REDMINE_SECRET_KEY_BASE_FILE
              value: /run/secrets/redmine_secret_key_base
            - name: REDMINE_PLUGINS_MIGRATE
              value: "true"
            - name: OTEL_TRACES_EXPORTER
              value: "otlp"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otelcol:4318"
            - name: SHOGGOTH_DOMAIN
              value: "${SHOGGOTH_DOMAIN}"
          volumeMounts:
            - name: files
              mountPath: /usr/src/redmine/files
            - name: bundle-cache
              mountPath: /usr/local/bundle/cache/
            - name: plugins
              mountPath: /usr/src/redmine/plugins
            - name: rendered
              mountPath: /shoggoth/rendered
              readOnly: true
            - name: init-script
              mountPath: /shoggoth/redmine/init.sh
              subPath: init.sh
              readOnly: true
            - name: db-password
              mountPath: /run/secrets/redmine_db_password
              subPath: password
              readOnly: true
            - name: secret-key-base
              mountPath: /run/secrets/redmine_secret_key_base
              subPath: secret-key-base
              readOnly: true
          lifecycle:
            postStart:
              exec:
                command:
                  - /bin/bash
                  - -c
                  - |
                    set -o pipefail
                    LOG=/shoggoth/rendered/redmine-init.log
                    exec > >(tee -a "${LOG}" > /proc/1/fd/1) 2>&1
                    echo "=== redmine-init start $(date -Iseconds) ==="
                    /bin/sh /shoggoth/redmine/init.sh
                    echo "=== redmine-init exit $? $(date -Iseconds) ==="
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "1000m"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
      volumes:
        - name: rendered
          hostPath:
            path: /var/lib/rancher/k3s/storage/${SHOGGOTH_INSTANCE_DIR}/rendered
            type: DirectoryOrCreate
        - name: init-script
          configMap:
            name: redmine-init
            defaultMode: 0755
        - name: files
          persistentVolumeClaim:
            claimName: redmine-files
        - name: bundle-cache
          persistentVolumeClaim:
            claimName: redmine-bundle-cache
        - name: plugins
          hostPath:
            path: /var/lib/rancher/k3s/storage/${SHOGGOTH_INSTANCE_DIR}/redmine-plugins
            type: DirectoryOrCreate
        - name: db-password
          secret:
            secretName: redmine-db-password
        - name: secret-key-base
          secret:
            secretName: redmine-secret-key-base