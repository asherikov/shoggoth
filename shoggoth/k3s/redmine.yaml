---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redmine-db
  namespace: ${SHOGGOTH_NAMESPACE}
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: local-path
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redmine-files
  namespace: ${SHOGGOTH_NAMESPACE}
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: local-path
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redmine-bundle-cache
  namespace: ${SHOGGOTH_NAMESPACE}
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
  storageClassName: local-path
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: redmine-init
  namespace: ${SHOGGOTH_NAMESPACE}
data:
  init.sh: |
    #!/bin/sh
    set -eu
    if [ -n "${REDMINE_SECRET_KEY_BASE_FILE:-}" ] && [ -z "${SECRET_KEY_BASE:-}" ]; then
        export SECRET_KEY_BASE="$(cat "${REDMINE_SECRET_KEY_BASE_FILE}")"
    fi
    echo "shoggoth: Waiting for Redmine to be ready..."
    for i in $(seq 1 30); do
        if bundle exec rails runner 'puts "ready"' > /dev/null 2>&1; then
            break
        fi
        sleep 2
    done
    if ! READY_CHECK="$(bundle exec rails runner 'puts "ready"' 2>&1)"; then
        echo "shoggoth: FATAL: Redmine not ready after 60s: ${READY_CHECK}" >&2
        exit 1
    fi
    echo "shoggoth: Redmine is ready for LDAP configuration"
    echo "shoggoth: Configuring LDAP auth source"
    for VAR in LDAP_HOST LDAP_BIND_DN LDAP_BIND_PASSWORD LDAP_BASE_DN; do
        if [ -z "$(eval "echo \"\${${VAR}:-}\"")" ]; then
            echo "shoggoth: ERROR: ${VAR} not set" >&2
            exit 1
        fi
    done
    LDAP_HOST="${LDAP_HOST}" LDAP_BIND_DN="${LDAP_BIND_DN}" LDAP_BIND_PASSWORD="${LDAP_BIND_PASSWORD}" LDAP_BASE_DN="${LDAP_BASE_DN}" \
        bundle exec rails runner '
        auth = AuthSourceLdap.find_or_initialize_by(name: "openldap")
        auth.host = ENV["LDAP_HOST"]
        auth.port = 389
        auth.account = ENV["LDAP_BIND_DN"]
        auth.account_password = ENV["LDAP_BIND_PASSWORD"]
        auth.base_dn = ENV["LDAP_BASE_DN"]
        auth.attr_login = "uid"
        auth.attr_firstname = "cn"
        auth.attr_lastname = "sn"
        auth.attr_mail = "mail"
        auth.onthefly_register = true
        auth.tls = false
        auth.save!
    ' && echo "shoggoth: === redmine ldap init complete ===" \
        || { echo "shoggoth: FATAL: LDAP auth source configuration failed" >&2; exit 1; }
    echo "shoggoth: Setting local admin password"
    if [ -z "${SHOGGOTH_ADMIN_PASSWORD:-}" ]; then
        echo "shoggoth: ERROR: SHOGGOTH_ADMIN_PASSWORD not set" >&2
        exit 1
    fi
    RESULT="$(SHOGGOTH_ADMIN_PASSWORD="${SHOGGOTH_ADMIN_PASSWORD}" bundle exec rails runner '
        user = User.find_by_login("admin")
        if user
          user.password = ENV["SHOGGOTH_ADMIN_PASSWORD"]
          user.password_confirmation = ENV["SHOGGOTH_ADMIN_PASSWORD"]
          user.must_change_passwd = false
          user.save!
          puts "updated"
        else
          puts "not_found"
        end
    ')" || { echo "shoggoth: ERROR: admin password update failed" >&2; exit 1; }
    case "${RESULT}" in
        updated)    echo "shoggoth: admin password updated" ;;
        not_found)  echo "shoggoth: admin user not found, skipping password update" ;;
    esac
    echo "shoggoth: Ensuring slave user and api_key"
    SLAVE_KEY="$(bundle exec rails runner /shoggoth/redmine/slave_token_init.rb)" || { echo "shoggoth: ERROR: slave api_key init failed" >&2; exit 1; }
    if [ -z "${SLAVE_KEY}" ]; then
        echo "shoggoth: ERROR: slave token empty; cannot mark ready" >&2
        exit 1
    fi
    echo "shoggoth: slave api_key stored in K8s Secret redmine-slave-token (len=${#SLAVE_KEY})"
    echo "shoggoth: Marking token init as ready"
    touch /tmp/slave-token-ready
    echo "shoggoth: Syncing slave project memberships"
    bundle exec rails runner '
        User.current = User.find_by_login("admin")
        slave = User.find_by_login("slave")
        developer_role = Role.find_by(name: "Developer")
        if slave && developer_role
            added = 0
            Project.where(status: Project::STATUS_ACTIVE).each do |project|
                unless Member.exists?(project_id: project.id, user_id: slave.id)
                    Member.create!(project_id: project.id, user_id: slave.id, role_ids: [developer_role.id])
                    added += 1
                end
            end
            puts "added=#{added} total=#{Project.where(status: Project::STATUS_ACTIVE).count}"
        else
            puts "skipped"
        end
    ' && echo "shoggoth: === redmine slave init complete ===" \
        || echo "shoggoth: WARNING: membership sync failed"

  slave_token_init.rb: |
    require 'net/http'
    require 'uri'
    require 'json'
    require 'base64'
    require 'openssl'
    User.current = User.find_by_login("admin")
    ldap_auth = AuthSourceLdap.find_by(name: "openldap")
    slave = User.find_by_login("slave")
    if slave.nil? && ldap_auth
        slave = User.new
        slave.login = "slave"
        slave.firstname = "Slave"
        slave.lastname = "User"
        slave.mail = "slave@localhost"
        slave.auth_source = ldap_auth
        slave.language = "en"
        slave.must_change_passwd = false
        slave.save!
    end
    if slave.nil?
        STDERR.puts "slave user unavailable"
        exit 1
    end
    namespace = ENV['SHOGGOTH_NAMESPACE'].to_s
    if namespace.empty?
        STDERR.puts "SHOGGOTH_NAMESPACE not set"
        exit 1
    end
    secret_name = 'redmine-slave-token'
    sa_token_path = '/var/run/secrets/kubernetes.io/serviceaccount/token'
    ca_cert_path = '/var/run/secrets/kubernetes.io/serviceaccount/ca.crt'
    api_host = ENV['KUBERNETES_SERVICE_HOST'].to_s
    api_port = ENV['KUBERNETES_SERVICE_PORT'].to_s
    if api_host.empty? || api_port.empty?
        STDERR.puts "KUBERNETES_SERVICE_HOST or KUBERNETES_SERVICE_PORT not set"
        exit 1
    end
    unless File.exist?(sa_token_path)
        STDERR.puts "service account token not mounted at #{sa_token_path}"
        exit 1
    end
    unless File.exist?(ca_cert_path)
        STDERR.puts "CA certificate not mounted at #{ca_cert_path}"
        exit 1
    end
    sa_token = File.read(sa_token_path).strip
    http = Net::HTTP.new(api_host, api_port.to_i)
    http.use_ssl = true
    http.ca_file = ca_cert_path
    http.verify_mode = OpenSSL::SSL::VERIFY_PEER
    http.open_timeout = 10
    http.read_timeout = 15
    def k8s_url_for(http, namespace, secret_name)
        base = http.address.to_s
        port = http.port
        ns_enc = URI.encode_www_form_component(namespace)
        sn_enc = URI.encode_www_form_component(secret_name)
        URI("https://#{base}:#{port}/api/v1/namespaces/#{ns_enc}/secrets/#{sn_enc}")
    end
    def k8s_post_url_for(http, namespace)
        base = http.address.to_s
        port = http.port
        ns_enc = URI.encode_www_form_component(namespace)
        URI("https://#{base}:#{port}/api/v1/namespaces/#{ns_enc}/secrets")
    end
    get_url = k8s_url_for(http, namespace, secret_name)
    get_req = Net::HTTP::Get.new(get_url.request_uri)
    get_req['Authorization'] = "Bearer #{sa_token}"
    get_req['Accept'] = 'application/json'
    begin
        get_res = http.request(get_req)
    rescue => e
        STDERR.puts "K8s GET secret exception: #{e.class}: #{e.message}"
        exit 1
    end
    case get_res
    when Net::HTTPSuccess
        body = JSON.parse(get_res.body) rescue {}
        token_b64 = body['data'] && body['data']['token']
        if token_b64 && !token_b64.empty?
            print Base64.decode64(token_b64)
            exit 0
        end
    when Net::HTTPNotFound
        # fall through to create
    else
        STDERR.puts "K8s GET secret failed: HTTP #{get_res.code}: #{get_res.body[0, 200]}"
        exit 1
    end
    token = Token.create(user: slave, action: 'api')
    new_key = token.value
    manifest = JSON.generate(
        'apiVersion' => 'v1',
        'kind' => 'Secret',
        'metadata' => { 'name' => secret_name, 'namespace' => namespace },
        'type' => 'Opaque',
        'data' => { 'token' => Base64.strict_encode64(new_key) }
    )
    post_url = k8s_post_url_for(http, namespace)
    post_req = Net::HTTP::Post.new(post_url.request_uri)
    post_req['Authorization'] = "Bearer #{sa_token}"
    post_req['Content-Type'] = 'application/json'
    post_req['Accept'] = 'application/json'
    post_req.body = manifest
    begin
        post_res = http.request(post_req)
    rescue => e
        STDERR.puts "K8s POST secret exception: #{e.class}: #{e.message}"
        exit 1
    end
    unless post_res.is_a?(Net::HTTPSuccess)
        STDERR.puts "K8s POST secret failed: HTTP #{post_res.code}: #{post_res.body[0, 200]}"
        exit 1
    end
    print new_key

---
apiVersion: v1
kind: Service
metadata:
  name: redmine-db
  namespace: ${SHOGGOTH_NAMESPACE}
spec:
  selector:
    app: redmine-db
  ports:
  - name: postgres
    port: 5432
    targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redmine-db
  namespace: ${SHOGGOTH_NAMESPACE}
spec:
  serviceName: redmine-db
  replicas: 1
  selector:
    matchLabels:
      app: redmine-db
  template:
    metadata:
      labels:
        app: redmine-db
    spec:
      dnsPolicy: None
      dnsConfig:
        nameservers:
        - ${SHOGGOTH_DNS_IP}
        searches:
        - ${SHOGGOTH_NAMESPACE}.svc.cluster.local
        - svc.cluster.local
        - cluster.local
      initContainers:
      - name: wait-bootstrap
        image: asherikov/shoggoth_tools:alpine
        imagePullPolicy: IfNotPresent
        command:
        - bash
        - -c
        args:
        - |
          set -euo pipefail
          NS="${SHOGGOTH_NAMESPACE}"
                    wait_for_externalsecret() {
                      local name="$1"
                      echo "wait-bootstrap: waiting for externalsecret/${name} Ready in namespace ${NS}..."
                      for i in $(seq 1 60); do
                        if kubectl get externalsecret "${name}" -n "${NS}" -o json 2>/dev/null | jq -e '.status.conditions // [] | map(select(.type=="Ready" and .status=="True")) | length > 0' >/dev/null 2>&1; then
                          echo "wait-bootstrap: externalsecret/${name} Ready (after $((i*10))s)"
                          return 0
                        fi
                        sleep 10
                      done
                      echo "FAIL: externalsecret/${name} not Ready after 10m"
                      echo "      Hint: check status from outside the pod:"
                      echo "            kubectl get externalsecret -n ${NS} ${name} -o yaml"
                      echo "            kubectl describe externalsecret -n ${NS} ${name}"
                      echo "      Most common causes: OpenBao unavailable, SecretStore reference broken,"
                      echo "      or remote secret missing (Orphan policies require a value in the source store)."
                      return 1
                    }
          for pw in redmine-db-password redmine-secret-key-base; do
            key="password"
                    case "${pw}" in
                      redmine-db-password) wait_for_externalsecret redmine-db-password || exit 1 ;;
                      redmine-secret-key-base) wait_for_externalsecret redmine-secret-key-base || exit 1 ;;
                    esac
          done
          echo "wait-bootstrap: all K8s Secrets Ready"

        resources:
          requests:
            memory: 32Mi
            cpu: 50m
          limits:
            memory: 64Mi
            cpu: 200m
        volumeMounts: []
      containers:
      - name: postgres
        image: postgres:18-alpine
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5432
          name: postgres
        env:
        - name: POSTGRES_DB
          value: redmine
        - name: POSTGRES_USER
          value: redmine
        - name: POSTGRES_PASSWORD_FILE
          value: /run/secrets/redmine_db_password
        - name: OTEL_TRACES_EXPORTER
          value: otlp
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://otelcol:4318
        - name: SHOGGOTH_DOMAIN
          value: ${SHOGGOTH_DOMAIN}
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql
        - name: db-password
          mountPath: /run/secrets/redmine_db_password
          subPath: password
          readOnly: true
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - redmine
          initialDelaySeconds: 5
          periodSeconds: 5
          failureThreshold: 60
        livenessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - redmine
          initialDelaySeconds: 30
          periodSeconds: 10
        resources:
          requests:
            memory: 256Mi
            cpu: 100m
          limits:
            memory: 512Mi
            cpu: 500m
      volumes:
      - name: db-password
        secret:
          secretName: redmine-db-password
      - name: data
        persistentVolumeClaim:
          claimName: redmine-db
      serviceAccountName: redmine-db
---
apiVersion: v1
kind: Service
metadata:
  name: redmine
  namespace: ${SHOGGOTH_NAMESPACE}
spec:
  selector:
    app: redmine
  ports:
  - name: http
    port: 80
    targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redmine
  namespace: ${SHOGGOTH_NAMESPACE}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redmine
  template:
    metadata:
      labels:
        app: redmine
      annotations:
        secret.reloader.stakater.com/reload: redmine-db-password,redmine-secret-key-base,openldap-ldapauth-password
    spec:
      dnsPolicy: None
      dnsConfig:
        nameservers:
        - ${SHOGGOTH_DNS_IP}
        searches:
        - ${SHOGGOTH_NAMESPACE}.svc.cluster.local
        - svc.cluster.local
        - cluster.local
      initContainers:
      - name: wait-bootstrap
        image: asherikov/shoggoth_tools:alpine
        imagePullPolicy: IfNotPresent
        command:
        - bash
        - -c
        args:
        - |
          set -euo pipefail
          NS="${SHOGGOTH_NAMESPACE}"
                    wait_for_externalsecret() {
                      local name="$1"
                      echo "wait-bootstrap: waiting for externalsecret/${name} Ready in namespace ${NS}..."
                      for i in $(seq 1 60); do
                        if kubectl get externalsecret "${name}" -n "${NS}" -o json 2>/dev/null | jq -e '.status.conditions // [] | map(select(.type=="Ready" and .status=="True")) | length > 0' >/dev/null 2>&1; then
                          echo "wait-bootstrap: externalsecret/${name} Ready (after $((i*10))s)"
                          return 0
                        fi
                        sleep 10
                      done
                      echo "FAIL: externalsecret/${name} not Ready after 10m"
                      echo "      Hint: check status from outside the pod:"
                      echo "            kubectl get externalsecret -n ${NS} ${name} -o yaml"
                      echo "            kubectl describe externalsecret -n ${NS} ${name}"
                      echo "      Most common causes: OpenBao unavailable, SecretStore reference broken,"
                      echo "      or remote secret missing (Orphan policies require a value in the source store)."
                      return 1
                    }
          wait_for_secret_key() {
            local name="$1" key="$2"
            echo "wait-bootstrap: waiting for secret/${name}.${key} in namespace ${NS}..."
            local ok=0
            for i in $(seq 1 60); do
              if kubectl get secret "${name}" -n "${NS}" -o json 2>/dev/null | jq -e --arg k "${key}" '(.data[$k] // "") | length > 0' >/dev/null 2>&1; then
                echo "wait-bootstrap: secret/${name}.${key} populated (after $((i*10))s)"
                ok=1
                break
              fi
              sleep 10
            done
            if [ "${ok}" != "1" ]; then
              echo "FAIL: secret/${name}.${key} not populated after 10m"
              echo "      Hint: check ExternalSecret status from outside the pod:"
              echo "            kubectl get externalsecret -n ${NS} <name> -o yaml"
              echo "      Most common cause: OpenBao unavailable, or SecretStore reference broken."
              return 1
            fi
            return 0
          }
          for pw in redmine-db-password redmine-secret-key-base; do
                    case "${pw}" in
                      redmine-db-password) wait_for_externalsecret redmine-db-password || exit 1 ;;
                      redmine-secret-key-base) wait_for_externalsecret redmine-secret-key-base || exit 1 ;;
                    esac
          done
          for pw in openldap-admin-password openldap-ldapauth-password; do
                    case "${pw}" in
                      openldap-admin-password) wait_for_externalsecret openldap-admin-password || exit 1 ;;
                      openldap-ldapauth-password) wait_for_externalsecret openldap-ldapauth-password || exit 1 ;;
                    esac
          done
          wait_for_secret_key openbao-unseal-key root-token || exit 1
          echo "wait-bootstrap: all K8s Secrets Ready"

        resources:
          requests:
            memory: 32Mi
            cpu: 50m
          limits:
            memory: 64Mi
            cpu: 200m
        volumeMounts: []
      containers:
      - name: redmine
        image: redmine:7.0.1-alpine3.24
        imagePullPolicy: IfNotPresent
        args:
        - rails
        - server
        - -b
        - 0.0.0.0
        - -p
        - '80'
        ports:
        - containerPort: 80
          name: http
        env:
        - name: REDMINE_DB_POSTGRES
          value: redmine-db
        - name: REDMINE_DB_PORT
          value: '5432'
        - name: REDMINE_DB_DATABASE
          value: redmine
        - name: REDMINE_DB_USERNAME
          value: redmine
        - name: REDMINE_DB_PASSWORD_FILE
          value: /run/secrets/redmine_db_password
        - name: REDMINE_SECRET_KEY_BASE_FILE
          value: /run/secrets/redmine_secret_key_base
        - name: REDMINE_PLUGINS_MIGRATE
          value: 'true'
        - name: LDAP_BASE_DN
          value: ${LDAP_BASE_DN}
        - name: LDAP_HOST
          value: openldap
        - name: LDAP_BIND_DN
          value: uid=ldapauth,ou=people,${LDAP_BASE_DN}
        - name: LDAP_BIND_PASSWORD
          valueFrom:
            secretKeyRef:
              name: openldap-ldapauth-password
              key: password
        - name: SHOGGOTH_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: openldap-admin-password
              key: password
        - name: OTEL_TRACES_EXPORTER
          value: otlp
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://otelcol:4318
        - name: SHOGGOTH_DOMAIN
          value: ${SHOGGOTH_DOMAIN}
        - name: SHOGGOTH_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        volumeMounts:
        - name: files
          mountPath: /usr/src/redmine/files
        - name: bundle-cache
          mountPath: /usr/local/bundle/cache/
        - name: plugins
          mountPath: /usr/src/redmine/plugins
        - name: init-script
          mountPath: /shoggoth/redmine/init.sh
          subPath: init.sh
          readOnly: true
        - name: init-script
          mountPath: /shoggoth/redmine/slave_token_init.rb
          subPath: slave_token_init.rb
          readOnly: true
        - name: db-password
          mountPath: /run/secrets/redmine_db_password
          subPath: password
          readOnly: true
        - name: secret-key-base
          mountPath: /run/secrets/redmine_secret_key_base
          subPath: secret-key-base
          readOnly: true
        lifecycle:
          postStart:
            exec:
              command:
              - /bin/bash
              - -c
              - |
                set -o pipefail
                LOG=/usr/src/redmine/files/redmine-init.log
                exec > >(tee -a "${LOG}" > /proc/1/fd/1) 2>&1
                echo "=== redmine-init start $(date -Iseconds) ==="
                /bin/sh /shoggoth/redmine/init.sh
                echo "=== redmine-init exit $? $(date -Iseconds) ==="
        resources:
          requests:
            memory: 256Mi
            cpu: 200m
          limits:
            memory: 512Mi
            cpu: 1000m
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - '[ -f /tmp/slave-token-ready ]'
          initialDelaySeconds: 15
          periodSeconds: 10
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
          failureThreshold: 6
      volumes:
      - name: init-script
        configMap:
          name: redmine-init
          defaultMode: 493
      - name: files
        persistentVolumeClaim:
          claimName: redmine-files
      - name: bundle-cache
        persistentVolumeClaim:
          claimName: redmine-bundle-cache
      - name: plugins
        hostPath:
          path: /var/lib/rancher/k3s/storage/${SHOGGOTH_INSTANCE_DIR}/redmine-plugins
          type: DirectoryOrCreate
      - name: db-password
        secret:
          secretName: redmine-db-password
      - name: secret-key-base
        secret:
          secretName: redmine-secret-key-base
      serviceAccountName: redmine
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: redmine
  namespace: ${SHOGGOTH_NAMESPACE}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: redmine-bootstrap-wait
  namespace: ${SHOGGOTH_NAMESPACE}
rules:
- apiGroups:
  - ''
  resources:
  - secrets
  resourceNames:
  - redmine-db-password
  - redmine-secret-key-base
  - openldap-admin-password
  - openldap-ldapauth-password
  - openbao-unseal-key
  verbs:
  - get
- apiGroups:
  - external-secrets.io
  resources:
  - externalsecrets
  resourceNames:
  - redmine-db-password
  - redmine-secret-key-base
  - openldap-admin-password
  - openldap-ldapauth-password
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: redmine-bootstrap-wait
  namespace: ${SHOGGOTH_NAMESPACE}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: redmine-bootstrap-wait
subjects:
- kind: ServiceAccount
  name: redmine
  namespace: ${SHOGGOTH_NAMESPACE}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: redmine-db
  namespace: ${SHOGGOTH_NAMESPACE}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: redmine-db-bootstrap-wait
  namespace: ${SHOGGOTH_NAMESPACE}
rules:
- apiGroups:
  - ''
  resources:
  - secrets
  resourceNames:
  - redmine-db-password
  - redmine-secret-key-base
  verbs:
  - get
- apiGroups:
  - external-secrets.io
  resources:
  - externalsecrets
  resourceNames:
  - redmine-db-password
  - redmine-secret-key-base
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: redmine-db-bootstrap-wait
  namespace: ${SHOGGOTH_NAMESPACE}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: redmine-db-bootstrap-wait
subjects:
- kind: ServiceAccount
  name: redmine-db
  namespace: ${SHOGGOTH_NAMESPACE}
