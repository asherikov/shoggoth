apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gitea-data
  namespace: ${SHOGGOTH_NAMESPACE}
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: local-path
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gitea-init
  namespace: ${SHOGGOTH_NAMESPACE}
data:
  init.sh: |
    #!/bin/sh
    set -eu

    . /shoggoth/rendered/gitea/gitea.env

    echo "shoggoth: Waiting for Gitea to be ready..."
    for i in $(seq 1 30); do
        if su-exec git gitea admin auth list > /dev/null 2>&1; then
            break
        fi
        sleep 2
    done
    if ! AUTH_CHECK="$(su-exec git gitea admin auth list 2>&1)"; then
        echo "shoggoth: ERROR: Gitea not ready after 60s: ${AUTH_CHECK}" >&2
        exit 1
    fi

    EXISTING="$(su-exec git gitea admin auth list 2>/dev/null \
        | awk -v name="openldap" '$2 == name {print $1; exit}')"

    if [ -z "${EXISTING}" ]; then
        su-exec git gitea admin auth add-ldap \
            -name openldap \
            -security-protocol unencrypted \
            -host "${LDAP_HOST}" \
            -port 389 \
            -bind-dn "${LDAP_BIND_DN}" \
            -bind-password "${LDAP_BIND_PASSWORD}" \
            -user-search-base "ou=people,${LDAP_BASE_DN}" \
            -user-filter "(&(objectClass=inetOrgPerson)(|(uid=%[1]s)(mail=%[1]s)))" \
            -admin-filter "(memberOf=cn=admins,ou=groups,${LDAP_BASE_DN})" \
            -username-attribute uid \
            -firstname-attribute cn \
            -surname-attribute sn \
            -email-attribute mail \
            -synchronize-users
    else
        su-exec git gitea admin auth update-ldap --id "${EXISTING}" \
            -name openldap \
            -security-protocol unencrypted \
            -host "${LDAP_HOST}" \
            -port 389 \
            -bind-dn "${LDAP_BIND_DN}" \
            -bind-password "${LDAP_BIND_PASSWORD}" \
            -user-search-base "ou=people,${LDAP_BASE_DN}" \
            -user-filter "(&(objectClass=inetOrgPerson)(|(uid=%[1]s)(mail=%[1]s)))" \
            -admin-filter "(memberOf=cn=admins,ou=groups,${LDAP_BASE_DN})" \
            -username-attribute uid \
            -firstname-attribute cn \
            -surname-attribute sn \
            -email-attribute mail \
            -synchronize-users
    fi

    echo "shoggoth: === gitea ldap init complete ==="

    echo "shoggoth: Setting local admin password"
    su-exec git gitea admin user change-password --username admin --password "${SHOGGOTH_ADMIN_PASSWORD}" --must-change-password=false 2>/dev/null \
        || echo "shoggoth: admin user not found yet (will be created on first web login)"
---
apiVersion: v1
kind: Service
metadata:
  name: git
  namespace: ${SHOGGOTH_NAMESPACE}
spec:
  selector:
    app: gitea
  ports:
  - name: http
    port: 80
    targetPort: 80
  - name: ssh
    port: 22
    targetPort: 22
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitea
  namespace: ${SHOGGOTH_NAMESPACE}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gitea
  template:
    metadata:
      labels:
        app: gitea
    spec:
      dnsPolicy: None
      dnsConfig:
        nameservers:
        - ${SHOGGOTH_DNS_IP}
        searches:
        - ${SHOGGOTH_NAMESPACE}.svc.cluster.local
        - svc.cluster.local
        - cluster.local
      initContainers:
      - name: render-config
        image: asherikov/shoggoth_tools:alpine
        imagePullPolicy: IfNotPresent
        env:
        - name: LDAP_BIND_PASSWORD
          valueFrom:
            secretKeyRef:
              name: openldap-ldapauth-password
              key: password
        - name: SHOGGOTH_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: openldap-admin-password
              key: password
        - name: RENDER_VARS
          value: ${LDAP_BASE_DN}${LDAP_BIND_PASSWORD}${SHOGGOTH_ADMIN_PASSWORD}
        command:
        - bash
        - -c
        - 'exec /tmpl/render.sh

          '
        resources:
          requests:
            memory: 32Mi
            cpu: 50m
          limits:
            memory: 64Mi
            cpu: 200m
        volumeMounts:
        - name: templates
          mountPath: /templates
          readOnly: true
        - name: rendered-config
          mountPath: /rendered
        - name: render-script
          mountPath: /tmpl
          readOnly: true
      - name: wait-bootstrap
        image: asherikov/shoggoth_tools:alpine
        imagePullPolicy: IfNotPresent
        command:
        - bash
        - -c
        args:
        - |
          set -euo pipefail
          K8S_API="${K8S_API:-https://kubernetes.default.svc}"
          SA_TOKEN="$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)"
          SA_CA="/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
          for i in $(seq 1 120); do
            http_code=$(curl -sS --cacert "${SA_CA}" \
              -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer ${SA_TOKEN}" \
              "${K8S_API}/api/v1/namespaces/${SHOGGOTH_NAMESPACE}/secrets/shoggoth-bootstrap-done" || true)
            if [ "${http_code}" = "200" ]; then
              echo "wait-bootstrap: shoggoth-bootstrap-done Secret found"
              exit 0
            fi
            echo "wait-bootstrap: waiting for shoggoth-bootstrap-done Secret (attempt $i/120, http=${http_code})..."
            if [ $((i % 12)) -eq 0 ] && [ "${http_code}" != "404" ]; then
              curl -sS --cacert "${SA_CA}" \
                -H "Authorization: Bearer ${SA_TOKEN}" \
                "${K8S_API}/api/v1/namespaces/${SHOGGOTH_NAMESPACE}/secrets/shoggoth-bootstrap-done" >&2 || true
            fi
            sleep 5
          done
          echo "wait-bootstrap: FATAL: shoggoth-bootstrap-done Secret not found after 600s"
          echo "wait-bootstrap: openbao-bootstrap may have failed; check:"
          echo "  kubectl logs -n ${SHOGGOTH_NAMESPACE} -l app=openbao -c openbao-bootstrap"
          exit 1
        resources:
          requests:
            memory: 32Mi
            cpu: 50m
          limits:
            memory: 64Mi
            cpu: 200m
        volumeMounts: []
      containers:
      - name: gitea
        image: gitea/gitea:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: SHOGGOTH_DOMAIN
          value: ${SHOGGOTH_DOMAIN}
        - name: OTEL_TRACES_EXPORTER
          value: otlp
        - name: GITEA__overall__APP_NAME
          value: git.${SHOGGOTH_DOMAIN}
        - name: GITEA__repository__FORCE_PRIVATE
          value: 'false'
        - name: GITEA__repository__USE_COMPAT_SSH_URI
          value: 'false'
        - name: GITEA__repository__DEFAULT_BRANCH
          value: main
        - name: GITEA__repository__DEFAULT_PRIVATE
          value: private
        - name: GITEA__repository__DEFAULT_MERGE_STYLE
          value: fast-forward-only
        - name: GITEA__repository__DEFAULT_DELETE_BRANCH_AFTER_MERGE
          value: 'true'
        - name: GITEA__repository__DEFAULT_REPO_UNITS
          value: repo.code,repo.releases,repo.issues,repo.pulls,repo.wiki,repo.projects,repo.actions
        - name: GITEA__server__START_SSH_SERVER
          value: 'false'
        - name: GITEA__server__HTTP_PORT
          value: '80'
        - name: GITEA__server__ROOT_URL
          value: http://git.${SHOGGOTH_DOMAIN}
        - name: GITEA__server__DOMAIN
          value: git.${SHOGGOTH_DOMAIN}
        - name: GITEA__server__SSH_DOMAIN
          value: git.${SHOGGOTH_DOMAIN}
        - name: GITEA__service__NO_REPLY_ADDRESS
          value: noreply.git.${SHOGGOTH_DOMAIN}
        - name: GITEA__webhook__ALLOWED_HOST_LIST
          value: private
        - name: GITEA__admin__USER_DISABLED_FEATURES
          value: deletion
        - name: GITEA__actions__DEFAULT_ACTIONS_URL
          value: github
        - name: GITEA__opentelemetry__ENABLED
          value: 'true'
        - name: GITEA__opentelemetry__ENDPOINT
          value: http://otelcol:4317
        ports:
        - containerPort: 80
          name: http
        - containerPort: 22
          name: ssh
        resources:
          requests:
            memory: 256Mi
            cpu: 200m
          limits:
            memory: 512Mi
            cpu: '1'
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
          failureThreshold: 30
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 30
          failureThreshold: 3
        lifecycle:
          postStart:
            exec:
              command:
              - /bin/bash
              - -c
              - 'set -o pipefail

                LOG=/data/gitea/gitea-init.log

                exec > >(tee -a "${LOG}" > /proc/1/fd/1) 2>&1

                echo "=== gitea-init start $(date -Iseconds) ==="

                /bin/sh /shoggoth/git/gitea/init.sh

                echo "=== gitea-init exit $? $(date -Iseconds) ==="

                '
        volumeMounts:
        - name: data
          mountPath: /data
        - name: rendered-config
          mountPath: /shoggoth/rendered
          readOnly: true
        - name: gitea-init
          mountPath: /shoggoth/git/gitea
          readOnly: true
      volumes:
      - name: rendered-config
        emptyDir: {}
      - name: gitea-init
        configMap:
          name: gitea-init
          defaultMode: 493
      - name: data
        persistentVolumeClaim:
          claimName: gitea-data
      - name: templates
        configMap:
          name: gitea-templates
      - name: render-script
        configMap:
          name: shoggoth-render-config
          defaultMode: 493
      serviceAccountName: gitea
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitea-runner
  namespace: ${SHOGGOTH_NAMESPACE}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gitea-runner
  template:
    metadata:
      labels:
        app: gitea-runner
    spec:
      dnsPolicy: None
      dnsConfig:
        nameservers:
        - ${SHOGGOTH_DNS_IP}
        searches:
        - ${SHOGGOTH_NAMESPACE}.svc.cluster.local
        - svc.cluster.local
        - cluster.local
      initContainers:
      - name: render-config
        image: asherikov/shoggoth_tools:alpine
        imagePullPolicy: IfNotPresent
        env:
        - name: SHOGGOTH_DOMAIN
          value: ${SHOGGOTH_DOMAIN}
        - name: RENDER_VARS
          value: ${SHOGGOTH_DOMAIN}
        command:
        - bash
        - -c
        - 'exec /tmpl/render.sh

          '
        resources:
          requests:
            memory: 32Mi
            cpu: 50m
          limits:
            memory: 64Mi
            cpu: 200m
        volumeMounts:
        - name: templates
          mountPath: /templates
          readOnly: true
        - name: rendered-config
          mountPath: /rendered
        - name: render-script
          mountPath: /tmpl
          readOnly: true
      - name: wait-bootstrap
        image: asherikov/shoggoth_tools:alpine
        imagePullPolicy: IfNotPresent
        command:
        - bash
        - -c
        args:
        - |
          set -euo pipefail
          K8S_API="${K8S_API:-https://kubernetes.default.svc}"
          SA_TOKEN="$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)"
          SA_CA="/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
          for i in $(seq 1 120); do
            http_code=$(curl -sS --cacert "${SA_CA}" \
              -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer ${SA_TOKEN}" \
              "${K8S_API}/api/v1/namespaces/${SHOGGOTH_NAMESPACE}/secrets/shoggoth-bootstrap-done" || true)
            if [ "${http_code}" = "200" ]; then
              echo "wait-bootstrap: shoggoth-bootstrap-done Secret found"
              exit 0
            fi
            echo "wait-bootstrap: waiting for shoggoth-bootstrap-done Secret (attempt $i/120, http=${http_code})..."
            if [ $((i % 12)) -eq 0 ] && [ "${http_code}" != "404" ]; then
              curl -sS --cacert "${SA_CA}" \
                -H "Authorization: Bearer ${SA_TOKEN}" \
                "${K8S_API}/api/v1/namespaces/${SHOGGOTH_NAMESPACE}/secrets/shoggoth-bootstrap-done" >&2 || true
            fi
            sleep 5
          done
          echo "wait-bootstrap: FATAL: shoggoth-bootstrap-done Secret not found after 600s"
          echo "wait-bootstrap: openbao-bootstrap may have failed; check:"
          echo "  kubectl logs -n ${SHOGGOTH_NAMESPACE} -l app=openbao -c openbao-bootstrap"
          exit 1
        resources:
          requests:
            memory: 32Mi
            cpu: 50m
          limits:
            memory: 64Mi
            cpu: 200m
        volumeMounts: []
      containers:
      - name: runner
        image: gitea/act_runner:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: SHOGGOTH_DOMAIN
          value: ${SHOGGOTH_DOMAIN}
        - name: OTEL_TRACES_EXPORTER
          value: otlp
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://otelcol:4318
        - name: GITEA_INSTANCE_URL
          value: http://git.${SHOGGOTH_NAMESPACE}.svc.cluster.local
        - name: GITEA_RUNNER_NAME
          value: shoggoth-runner
        - name: GITEA_RUNNER_LABELS
          value: ubuntu-latest,ubuntu-24.04
        - name: GITEA_RUNNER_REGISTRATION_TOKEN_FILE
          value: /run/secrets/gitea_runner_token
        - name: CONFIG_FILE
          value: /shoggoth/rendered/config.yaml
        volumeMounts:
        - name: data
          mountPath: /data
        - name: rendered-config
          mountPath: /shoggoth/rendered
          readOnly: true
        - name: dind-socket
          mountPath: /dind
        - name: runner-token
          mountPath: /run/secrets/gitea_runner_token
          subPath: token
          readOnly: true
      volumes:
      - name: rendered-config
        emptyDir: {}
      - name: data
        hostPath:
          path: /var/lib/rancher/k3s/storage/${SHOGGOTH_INSTANCE_DIR}/gitea-runner-data
          type: DirectoryOrCreate
      - name: dind-socket
        hostPath:
          path: /var/lib/rancher/k3s/storage/${SHOGGOTH_INSTANCE_DIR}/dind-socket
          type: DirectoryOrCreate
      - name: runner-token
        secret:
          secretName: gitea-runner-token
      - name: templates
        configMap:
          name: gitea-runner-templates
      - name: render-script
        configMap:
          name: shoggoth-render-config
          defaultMode: 493
      serviceAccountName: gitea-runner
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gitea
  namespace: ${SHOGGOTH_NAMESPACE}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gitea-bootstrap-wait
  namespace: ${SHOGGOTH_NAMESPACE}
rules:
- apiGroups:
  - ''
  resources:
  - secrets
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gitea-bootstrap-wait
  namespace: ${SHOGGOTH_NAMESPACE}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: gitea-bootstrap-wait
subjects:
- kind: ServiceAccount
  name: gitea
  namespace: ${SHOGGOTH_NAMESPACE}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gitea-runner
  namespace: ${SHOGGOTH_NAMESPACE}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gitea-runner-bootstrap-wait
  namespace: ${SHOGGOTH_NAMESPACE}
rules:
- apiGroups:
  - ''
  resources:
  - secrets
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gitea-runner-bootstrap-wait
  namespace: ${SHOGGOTH_NAMESPACE}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: gitea-runner-bootstrap-wait
subjects:
- kind: ServiceAccount
  name: gitea-runner
  namespace: ${SHOGGOTH_NAMESPACE}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gitea-templates
  namespace: ${SHOGGOTH_NAMESPACE}
data:
  gitea.env: 'LDAP_BASE_DN=${LDAP_BASE_DN}

    LDAP_HOST=openldap

    LDAP_BIND_DN=uid=ldapauth,ou=people,${LDAP_BASE_DN}

    LDAP_BIND_PASSWORD=${LDAP_BIND_PASSWORD}

    SHOGGOTH_ADMIN_PASSWORD=${SHOGGOTH_ADMIN_PASSWORD}

    '
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gitea-runner-templates
  namespace: ${SHOGGOTH_NAMESPACE}
data:
  config.yaml: |
    log:
      level: debug
    runner:
      file: .runner
      capacity: 1
      envs:
        RUNNER_TOOL_CACHE: /toolcache
      timeout: 3h
      shutdown_timeout: 0s
      insecure: false
      fetch_timeout: 5s
      fetch_interval: 2s
      github_mirror: ''
      labels:
        - "ubuntu-latest:docker://registry.${SHOGGOTH_DOMAIN}/slave_noble:dind"
        - "ubuntu-24.04:docker://registry.${SHOGGOTH_DOMAIN}/slave_noble:dind"
        - "ubuntu-22.04:docker://registry.${SHOGGOTH_DOMAIN}/slave_jammy:dind"
    cache:
      enabled: true
      dir: "/cache/gitea/actcache/"
      host: "gitea-runner"
      port: 0
      external_server: ""
    container:
      network: "host"
      privileged: false
      options: "--volume /shoggoth/git-cred:/shoggoth/git-cred
                --volume /shoggoth/ci_cache:/cache"
      workdir_parent:
      valid_volumes: ['**']
      docker_host: "unix:///dind/docker.sock"
      force_pull: false
      force_rebuild: false
      require_docker: false
      docker_timeout: 0s
    host:
      workdir_parent: "/cache/gitea/act/"
