---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitea-server-token
  namespace: ${SHOGGOTH_NAMESPACE}
spec:
  secretStoreRef:
    name: shoggoth-openbao
    kind: SecretStore
  target:
    name: gitea-server-token
    creationPolicy: Orphan
  data:
    - secretKey: token
      remoteRef:
        key: gitea/server-token
        property: value
  refreshInterval: 5m
