---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitea-runner-token
  namespace: ${SHOGGOTH_NAMESPACE}
spec:
  secretStoreRef:
    name: shoggoth-openbao
    kind: SecretStore
  target:
    # See gitea-slave-token.yaml for the rationale: the script
    # (``runner-token``) is the authority on this Secret's
    # value, the PushSecret pushes it to OpenBao, and the
    # ExternalSecret must not overwrite the script's fresh
    # write. ``creationPolicy: Orphan`` + ``refreshInterval:
    # 0s`` is the combo that prevents the overwrite
    # (see gitea-slave-token.yaml for the controller-side
    # reason).
    name: gitea-runner-token
    creationPolicy: Orphan
  data:
    - secretKey: token
      remoteRef:
        key: gitea/runner-token
        property: value
  refreshInterval: 0s
