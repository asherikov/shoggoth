---
---
# The /cache persistent storage is shared across all CI consumers
# (gitea-runner job pods, slave-term, and Kestra workflows via slave-dind's
# DinD). See shoggoth/k3s/shared-cache.yaml for the single PVC definition.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: slave-dind-entrypoint
  namespace: ${SHOGGOTH_NAMESPACE}
data:
  entrypoint.sh: |
    #!/usr/bin/env sh
    set -eu
    DOCKERD_PID=""
    export DOCKER_HOST=unix:///dind/docker.sock
    mkdir -p /etc/docker/
    printf '{"insecure-registries":["registry.%s"],"registry-mirrors":["http://registry.%s"]}\n' "${SHOGGOTH_DOMAIN}" "${SHOGGOTH_DOMAIN}" > /etc/docker/daemon.json
    rm -f /var/run/docker.pid
    cleanup() {
        echo "shoggoth: Shutting down..." >&2
        [ -n "${DOCKERD_PID}" ] && kill "${DOCKERD_PID}" 2>/dev/null || true
        [ -n "${DOCKERD_PID}" ] && wait "${DOCKERD_PID}" 2>/dev/null || true
    }
    trap cleanup EXIT
    echo "shoggoth: Starting dockerd..." >&2
    cat /etc/docker/daemon.json
    dockerd --host unix:///dind/docker.sock --config-file /etc/docker/daemon.json --log-level info &
    DOCKERD_PID=$!
    echo "shoggoth: Waiting for dockerd to be ready..." >&2
    ATTEMPT=1
    while [ "${ATTEMPT}" -le 60 ]; do
        if docker info > /dev/null 2>&1; then
            echo "shoggoth: dockerd is ready (attempt ${ATTEMPT})" >&2
            break
        fi
        sleep 1
        ATTEMPT=$((ATTEMPT + 1))
    done
    if ! docker info > /dev/null 2>&1; then
        echo "shoggoth: FATAL: dockerd failed to start" >&2
        exit 1
    fi
    BASE_IMAGE="registry.${SHOGGOTH_DOMAIN}/slave:noble"
    echo "shoggoth: Pulling slave image ${BASE_IMAGE}..." >&2
    if ! docker pull "${BASE_IMAGE}"; then
        echo "shoggoth: FATAL: Failed to pull slave image ${BASE_IMAGE}" >&2
        exit 1
    fi
    echo "shoggoth: Preparing ci_cache directory..." >&2
    mkdir -p /shoggoth/ci_cache
    chown -R 1000:1000 /shoggoth/ci_cache
    echo "shoggoth: slave-dind ready (dockerd + ci_cache; git-cred served by git-cred-bootstrap sidecar)" >&2
    wait "${DOCKERD_PID}" || true

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: slave-dind
  namespace: ${SHOGGOTH_NAMESPACE}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: slave-dind
  progressDeadlineSeconds: 1200
  template:
    metadata:
      labels:
        app: slave-dind
      annotations:
        secret.reloader.stakater.com/reload: gitea-slave-token,ssh-slave-private-key
    spec:
      dnsPolicy: None
      dnsConfig:
        nameservers:
        - ${SHOGGOTH_DNS_IP}
        searches:
        - ${SHOGGOTH_NAMESPACE}.svc.cluster.local
        - svc.cluster.local
        - cluster.local
      initContainers:
      - name: wait-bootstrap
        image: asherikov/shoggoth_tools:alpine
        imagePullPolicy: IfNotPresent
        env:
        - name: SHOGGOTH_NAMESPACE
          value: ${SHOGGOTH_NAMESPACE}
        command:
        - bash
        - -c
        args:
        - |
          set -euo pipefail
          NS="${SHOGGOTH_NAMESPACE}"
          wait_for_externalsecret() {
            local name="$1"
            echo "wait-bootstrap: waiting for externalsecret/${name} Ready in namespace ${NS}..."
            for i in $(seq 1 60); do
              if kubectl get externalsecret "${name}" -n "${NS}" -o json 2>/dev/null | jq -e '.status.conditions // [] | map(select(.type=="Ready" and .status=="True")) | length > 0' >/dev/null 2>&1; then
                echo "wait-bootstrap: externalsecret/${name} Ready (after $((i*10))s)"
                return 0
              fi
              sleep 10
            done
            echo "FAIL: externalsecret/${name} not Ready after 10m"
            return 1
          }
          wait_for_externalsecret gitea-slave-token || exit 1
          wait_for_externalsecret ssh-slave-private-key || exit 1
          echo "wait-bootstrap: all K8s Secrets Ready"
        resources:
          requests:
            memory: 32Mi
            cpu: 50m
          limits:
            memory: 64Mi
            cpu: 200m
      - name: init-git-cred-perms
        image: asherikov/shoggoth_tools:alpine
        imagePullPolicy: IfNotPresent
        command:
        - sh
        - -c
        args:
        - |
          set -eu
          # kubelet mounts the emptyDir as root:root with default perms;
          # the git-cred sidecar runs as uid 1000 (securityContext.runAsUser)
          # and needs to chmod the mountpoint to 0700 so git-credential-cache
          # accepts the directory (it refuses any mode looser than 0700 with
          # "permissions on your socket directory are too loose"). uid 1000
          # cannot chmod a root-owned directory, so we chown+chmod here as
          # root before the sidecar starts. The sidecar re-applies chmod 0700
          # defensively, which is now a no-op (it owns the directory).
          chown 1000:1000 /shoggoth/git-cred
          chmod 0700 /shoggoth/git-cred
        volumeMounts:
        - name: git-cred
          mountPath: /shoggoth/git-cred
        resources:
          requests:
            memory: 16Mi
            cpu: 10m
          limits:
            memory: 32Mi
            cpu: 50m
      containers:
      - name: git-cred
        image: asherikov/shoggoth_tools:alpine
        imagePullPolicy: IfNotPresent
        command:
        - /bin/bash
        - /git-cred/bootstrap.sh
        env:
        - name: SHOGGOTH_DOMAIN
          value: ${SHOGGOTH_DOMAIN}
        - name: SHOGGOTH_NAMESPACE
          value: ${SHOGGOTH_NAMESPACE}
        - name: SSH_ID_RSA
          valueFrom:
            secretKeyRef:
              name: ssh-slave-private-key
              key: ssh-id-rsa
              optional: true
        - name: GITEA_SLAVE_TOKEN
          valueFrom:
            secretKeyRef:
              name: gitea-slave-token
              key: token
              optional: true
        volumeMounts:
        - name: git-cred
          mountPath: /shoggoth/git-cred
        - name: git-cred-bootstrap
          mountPath: /git-cred
          readOnly: true
        resources:
          requests:
            memory: 32Mi
            cpu: 20m
          limits:
            memory: 64Mi
            cpu: 100m
        # Sibling of `image:` and `securityContext:`, not a field inside
        # securityContext (kube-apiserver rejects the latter with "field not
        # declared in schema"). On non-zero exit kubelet normally leaves
        # containerState.Terminated.Message empty, so the FATAL stderr line
        # bootstrap.sh writes (e.g. "git-cred-bootstrap: FATAL: ssh-keyscan
        # failed on git.s.local") is invisible from `kubectl describe pod`.
        # FallbackToLogsOnError makes kubelet populate the message from the
        # last 2048 bytes / 80 lines of the container's log on exit.
        # https://kubernetes.io/docs/tasks/debug/debug-application/determine-reason-pod-failure/
        terminationMessagePolicy: FallbackToLogsOnError
        securityContext:
          runAsUser: 1000
      - name: dind
        image: docker:29.8.1-dind
        imagePullPolicy: IfNotPresent
        securityContext:
          privileged: true
        env:
        - name: DOCKER_HOST
          value: unix:///dind/docker.sock
        - name: DOCKER_TLS_CERTDIR
          value: ''
        command:
        - /bin/sh
        - /entrypoint/entrypoint.sh
        resources:
          requests:
            memory: 512Mi
            cpu: 500m
          limits:
            memory: 2Gi
            cpu: '2'
        readinessProbe:
          exec:
            command:
            - sh
            - -c
            - docker info > /dev/null 2>&1
          initialDelaySeconds: 30
          periodSeconds: 10
          failureThreshold: 30
          timeoutSeconds: 5
        livenessProbe:
          exec:
            command:
            - sh
            - -c
            - docker info > /dev/null 2>&1
          initialDelaySeconds: 60
          periodSeconds: 30
          failureThreshold: 3
          timeoutSeconds: 10
        volumeMounts:
        - name: dind-socket
          mountPath: /dind
        - name: entrypoint
          mountPath: /entrypoint
          readOnly: true
        - name: workflow-scripts
          mountPath: /host_volumes/workflow-scripts
          readOnly: true
        - name: ci-cache
          mountPath: /cache
        - name: git-cred
          mountPath: /shoggoth/git-cred
        - name: dind-data
          mountPath: /var/lib/docker
      volumes:
      - name: dind-socket
        hostPath:
          path: /var/lib/rancher/k3s/storage/${SHOGGOTH_INSTANCE_DIR}/dind-socket
          type: DirectoryOrCreate
      - name: entrypoint
        configMap:
          name: slave-dind-entrypoint
          defaultMode: 493
      - name: workflow-scripts
        hostPath:
          path: /var/lib/rancher/k3s/storage/${SHOGGOTH_INSTANCE_DIR}/workflow-scripts
          type: DirectoryOrCreate
      - name: ci-cache
        persistentVolumeClaim:
          claimName: shoggoth-shared-cache
      - name: git-cred
        emptyDir: {}
      - name: git-cred-bootstrap
        configMap:
          name: git-cred-bootstrap
          defaultMode: 493
      - name: dind-data
        emptyDir:
          sizeLimit: 20Gi
      serviceAccountName: slave-dind
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: slave-dind
  namespace: ${SHOGGOTH_NAMESPACE}
---
# Required by Kestra's Docker task runner when the maintenance flow's
# slave_token / runner_token tasks run inside a container spawned on the
# slave-dind Docker daemon (networkMode: host + bind-mount of the daemon's
# SA-token path /var/run/secrets/kubernetes.io/serviceaccount). The spawned
# container's kubectl resolves credentials from the bind-mounted token,
# which is slave-dind's; without this Role, `k8s_upsert_secret` would 403
# on create/update/patch of the maintenance Secrets.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: slave-dind-secret-bootstrap
  namespace: ${SHOGGOTH_NAMESPACE}
rules:
- apiGroups:
  - ''
  resources:
  - secrets
  resourceNames:
  - gitea-slave-token
  - gitea-runner-token
  verbs:
  - get
  - create
  - update
  - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: slave-dind-secret-bootstrap
  namespace: ${SHOGGOTH_NAMESPACE}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: slave-dind-secret-bootstrap
subjects:
- kind: ServiceAccount
  name: slave-dind
  namespace: ${SHOGGOTH_NAMESPACE}
---
# Required by the wait-bootstrap initContainer in this Deployment, which
# polls `kubectl get externalsecret` for the gitea-slave-token and
# ssh-slave-private-key ExternalSecrets before the git-cred sidecar starts
# reading the corresponding K8s Secrets — without `get` on the externalsecrets
# and secrets, the kubectl call 403s and the initContainer times out after 10m.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: slave-dind-bootstrap-wait
  namespace: ${SHOGGOTH_NAMESPACE}
rules:
- apiGroups:
  - ''
  resources:
  - secrets
  resourceNames:
  - gitea-slave-token
  - ssh-slave-private-key
  verbs:
  - get
- apiGroups:
  - external-secrets.io
  resources:
  - externalsecrets
  resourceNames:
  - gitea-slave-token
  - ssh-slave-private-key
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: slave-dind-bootstrap-wait
  namespace: ${SHOGGOTH_NAMESPACE}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: slave-dind-bootstrap-wait
subjects:
- kind: ServiceAccount
  name: slave-dind
  namespace: ${SHOGGOTH_NAMESPACE}
