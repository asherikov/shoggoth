---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: slave-dind-data
  namespace: shoggoth
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: local-path
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: slave-dind-ci-cache
  namespace: shoggoth
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: local-path
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: slave-dind-entrypoint
  namespace: shoggoth
data:
  entrypoint.sh: |
    #!/usr/bin/env sh
    set -eu

    DOCKERD_PID=""
    CRED_CACHE_PID=""
    SSH_AGENT_PID=""
    LOGS_PIDS=""

    export DOCKER_HOST=unix:///dind/docker.sock

    mkdir -p /etc/docker/
    printf '{"insecure-registries":["docker-registry.%s"]}\n' "${SHOGGOTH_DOMAIN}" > /etc/docker/daemon.json

    rm -f /var/run/docker.pid

    cleanup() {
        echo "shoggoth: Shutting down..." >&2
        for PID in ${LOGS_PIDS}; do
            kill "${PID}" 2>/dev/null || true
        done
        docker compose -f /shoggoth/compose/docker-compose.yml down 2>/dev/null || true
        [ -n "${DOCKERD_PID}" ] && kill "${DOCKERD_PID}" 2>/dev/null || true
        [ -n "${CRED_CACHE_PID}" ] && kill "${CRED_CACHE_PID}" 2>/dev/null || true
        [ -n "${SSH_AGENT_PID}" ] && kill "${SSH_AGENT_PID}" 2>/dev/null || true
        [ -n "${DOCKERD_PID}" ] && wait "${DOCKERD_PID}" 2>/dev/null || true
    }
    trap cleanup EXIT

    echo "shoggoth: Starting dockerd..." >&2
    dockerd --host unix:///dind/docker.sock --config-file /etc/docker/daemon.json &
    DOCKERD_PID=$!

    echo "shoggoth: Waiting for dockerd to be ready..." >&2
    ATTEMPT=1
    while [ "${ATTEMPT}" -le 60 ]; do
        if docker info > /dev/null 2>&1; then
            echo "shoggoth: dockerd is ready (attempt ${ATTEMPT})" >&2
            break
        fi
        sleep 1
        ATTEMPT=$((ATTEMPT + 1))
    done

    if ! docker info > /dev/null 2>&1; then
        echo "shoggoth: FATAL: dockerd failed to start" >&2
        exit 1
    fi

    BASE_IMAGE="docker-registry.${SHOGGOTH_DOMAIN}/slave_noble"

    echo "shoggoth: Pulling base image ${BASE_IMAGE}:latest..." >&2
    ATTEMPT=1
    while [ "${ATTEMPT}" -le 30 ]; do
        if docker pull "${BASE_IMAGE}:latest"; then
            break
        fi
        echo "shoggoth: Pull attempt ${ATTEMPT} failed, retrying in 5 seconds..." >&2
        sleep 5
        ATTEMPT=$((ATTEMPT + 1))
    done

    if ! docker image inspect "${BASE_IMAGE}:latest" >/dev/null 2>&1; then
        echo "shoggoth: FATAL: Failed to pull base image ${BASE_IMAGE}:latest after 30 attempts" >&2
        exit 1
    fi

    echo "shoggoth: Building shoggoth-slave image..." >&2
    BUILD_DIR="/shoggoth/compose/build"
    rm -rf "${BUILD_DIR}"
    mkdir -p "${BUILD_DIR}/workflow" "${BUILD_DIR}/scripts"

    echo "shoggoth: Generating client configuration..." >&2
    /shoggoth/rendered/setup-client.sh \
        --client-conf "${BUILD_DIR}/workflow" \
        --domain "${SHOGGOTH_DOMAIN}" \
        --api-gateway \
        --gitea-user "$(cat /run/secrets/gitea_user)" \
        --ai-token litellm
    cp -r /host_volumes/workflow-scripts/* "${BUILD_DIR}/scripts/"

    DOCKERFILE="${BUILD_DIR}/Dockerfile"
    cat > "${DOCKERFILE}" <<'DOCKERFILE_HEAD'
    FROM docker-registry.__SHOGGOTH_DOMAIN__/slave_noble:latest

    ENV SSH_AUTH_SOCK="/shoggoth/git-cred/ssh_auth_sock"
    ENV CCWS_CACHE="/cache/ccws/"
    ENV PIP_CACHE_DIR="/cache/ccws/pip"

    RUN mkdir -p /home/ccws/.qwen
    COPY workflow/qwen-settings.json /home/ccws/.qwen/settings.json

    USER root

    RUN mkdir -p /root/.qwen \
        && chown -R ccws /home/ccws/.qwen \
        && git config --system credential.helper 'cache --socket=/shoggoth/git-cred/git_credential_sock' \
        && git config --system user.email 'slave@__SHOGGOTH_DOMAIN__' \
        && git config --system user.name 'shoggoth' \
        && printf 'Host *\n  UserKnownHostsFile /shoggoth/git-cred/known_hosts\n' > /etc/ssh/ssh_config.d/shoggoth.conf

    COPY workflow/apt-cache.conf /etc/apt/apt.conf.d/00-shoggoth-apt-cache
    COPY scripts/ /shoggoth/workflow/scripts/

    USER ccws
    DOCKERFILE_HEAD

    sed -i "s|__SHOGGOTH_DOMAIN__|${SHOGGOTH_DOMAIN}|g" "${DOCKERFILE}"

    while IFS='=' read -r key value; do
        [ -z "${key}" ] && continue
        case "${key}" in
            \#*) continue ;;
        esac
        printf 'ENV %s="%s"\n' "${key}" "${value}" >> "${DOCKERFILE}"
    done < "${BUILD_DIR}/workflow/env"

    GITEA_SLAVE_TOKEN="$(cat /run/secrets/gitea_slave_token)"

    echo "shoggoth: Creating ci_cache directory..." >&2
    mkdir -p /shoggoth/ci_cache
    chown -R 1000:1000 /shoggoth/ci_cache

    CREDENTIAL_TIMEOUT=31536000
    SSH_AUTH_SOCK="/shoggoth/git-cred/ssh_auth_sock"
    GIT_CREDENTIAL_SOCK="/shoggoth/git-cred/git_credential_sock"
    KNOWN_HOSTS="/shoggoth/git-cred/known_hosts"

    echo "shoggoth: Preparing git-cred directory..." >&2
    mkdir -p /shoggoth/git-cred
    chmod 0700 /shoggoth/git-cred
    chown 1000:1000 /shoggoth/git-cred
    adduser -D -u 1000 -H -s /bin/sh ccws 2>/dev/null || true

    echo "shoggoth: Cleaning up stale sockets..." >&2
    rm -f "${SSH_AUTH_SOCK}" "${GIT_CREDENTIAL_SOCK}"

    echo "shoggoth: Scanning Gitea SSH host keys on git.${SHOGGOTH_DOMAIN}..." >&2
    for ATTEMPT in $(seq 1 30); do
        if ssh-keyscan "git.${SHOGGOTH_DOMAIN}" > "${KNOWN_HOSTS}.tmp" 2>/dev/null; then
            mv "${KNOWN_HOSTS}.tmp" "${KNOWN_HOSTS}"
            chmod 644 "${KNOWN_HOSTS}"
            echo "shoggoth: ssh-keyscan succeeded on attempt ${ATTEMPT}" >&2
            break
        fi
        SLEEP=$((ATTEMPT < 10 ? 2 : 5))
        echo "shoggoth: Waiting for Gitea SSH on git.${SHOGGOTH_DOMAIN} (attempt ${ATTEMPT}/30)..." >&2
        sleep "${SLEEP}"
    done

    if [ ! -s "${KNOWN_HOSTS}" ]; then
        echo "shoggoth: FATAL: ssh-keyscan failed after 30 attempts" >&2
        exit 1
    fi

    echo "shoggoth: Starting SSH agent at ${SSH_AUTH_SOCK}..." >&2
    eval "$(su ccws -c "ssh-agent -a '${SSH_AUTH_SOCK}'")"
    SSH_AGENT_PID="$(echo "${SSH_AGENT_PID}" | head -1)"
    chmod 600 "${SSH_AUTH_SOCK}"

    echo "shoggoth: Adding SSH identity..." >&2
    cp /run/secrets/ssh_id_rsa "${SSH_AUTH_SOCK}.key"
    chmod 400 "${SSH_AUTH_SOCK}.key"
    chown 1000:1000 "${SSH_AUTH_SOCK}.key"
    su ccws -c "ssh-add -v '${SSH_AUTH_SOCK}.key'"
    rm -f "${SSH_AUTH_SOCK}.key"

    echo "shoggoth: Listing SSH agent identities:" >&2
    su ccws -c "SSH_AUTH_SOCK='${SSH_AUTH_SOCK}' ssh-add -l" >&2

    echo "shoggoth: Starting git credential cache daemon at ${GIT_CREDENTIAL_SOCK}..." >&2
    git credential-cache--daemon "${GIT_CREDENTIAL_SOCK}" &
    CRED_CACHE_PID=$!
    sleep 1
    chmod 600 "${GIT_CREDENTIAL_SOCK}"

    echo "shoggoth: Storing Gitea HTTP credentials..." >&2
    printf 'protocol=http\nhost=git.%s\nusername=token\npassword=%s\n' \
        "${SHOGGOTH_DOMAIN}" "${GITEA_SLAVE_TOKEN}" \
        | git credential-cache --socket "${GIT_CREDENTIAL_SOCK}" --timeout "${CREDENTIAL_TIMEOUT}" store

    chown -R 1000:1000 /shoggoth/git-cred

    echo "shoggoth: slave-dind setup complete" >&2

    COMPOSE_DIR="/shoggoth/compose"
    mkdir -p "${COMPOSE_DIR}"

    cat > "${COMPOSE_DIR}/docker-compose.yml" <<EOF
    services:
        slave-term:
            build:
                context: ${BUILD_DIR}
            image: docker-registry.${SHOGGOTH_DOMAIN}/slave_noble:dind
            container_name: slave-term
            restart: unless-stopped
            network_mode: host
            volumes:
                - /shoggoth/git-cred:/shoggoth/git-cred
                - /shoggoth/ci_cache:/cache
            command: ttyd --max-clients 1 --port 80 --writable -t disableReconnect=true --once tmux -u new-session bash
    EOF

    docker compose -f "${COMPOSE_DIR}/docker-compose.yml" up -d --build

    LOGS_PIDS=""
    for service in $(docker compose -f "${COMPOSE_DIR}/docker-compose.yml" config --services); do
        docker compose -f "${COMPOSE_DIR}/docker-compose.yml" logs -f "${service}" &
        LOGS_PIDS="${LOGS_PIDS} $!"
    done

    wait "${DOCKERD_PID}" || true
---
apiVersion: v1
kind: Service
metadata:
  name: slave-dind
  namespace: shoggoth
spec:
  selector:
    app: slave-dind
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: slave-dind
  namespace: shoggoth
spec:
  replicas: 1
  selector:
    matchLabels:
      app: slave-dind
  progressDeadlineSeconds: 1200
  template:
    metadata:
      labels:
        app: slave-dind
    spec:
      dnsPolicy: None
      dnsConfig:
        nameservers:
          - 10.43.0.53
        searches:
          - shoggoth.svc.cluster.local
          - svc.cluster.local
          - cluster.local
      initContainers:
        - name: wait-bringup
          image: docker-registry.${SHOGGOTH_DOMAIN}/slave_noble:latest
          imagePullPolicy: IfNotPresent
          command: ["bash", "-c"]
          args:
            - |
              for i in $(seq 1 120); do
                if [ -f /shoggoth/rendered/.bringup-done ]; then
                  exit 0
                fi
                sleep 5
              done
              echo "ERROR: bringup sentinel not found after 600s"
              exit 1
          resources:
            requests:
              memory: "32Mi"
              cpu: "50m"
            limits:
              memory: "64Mi"
              cpu: "200m"
          volumeMounts:
            - name: rendered
              mountPath: /shoggoth/rendered
              readOnly: true
      containers:
        - name: dind
          image: docker:dind
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: true
          env:
            - name: SHOGGOTH_DOMAIN
              value: "${SHOGGOTH_DOMAIN}"
            - name: OTEL_TRACES_EXPORTER
              value: "otlp"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otelcol:4318"
            - name: DOCKER_HOST
              value: "unix:///dind/docker.sock"
            - name: DOCKER_TLS_CERTDIR
              value: ""
          command: ["/bin/sh", "/entrypoint/entrypoint.sh"]
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "2"
          readinessProbe:
            exec:
              command:
                - "sh"
                - "-c"
                - "docker info > /dev/null 2>&1 && docker image inspect docker-registry.${SHOGGOTH_DOMAIN}/slave_noble:dind > /dev/null 2>&1 && test -S /shoggoth/git-cred/ssh_auth_sock"
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 30
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command:
                - "sh"
                - "-c"
                - "docker info > /dev/null 2>&1"
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 3
            timeoutSeconds: 10
          volumeMounts:
            - name: dind-socket
              mountPath: /dind
            - name: entrypoint
              mountPath: /entrypoint
              readOnly: true
            - name: rendered
              mountPath: /shoggoth/rendered
              readOnly: true
            - name: workflow-scripts
              mountPath: /host_volumes/workflow-scripts
              readOnly: true
            - name: git-cred
              mountPath: /shoggoth/git-cred
            - name: ci-cache
              mountPath: /shoggoth/ci_cache
            - name: dind-data
              mountPath: /var/lib/docker
            - name: gitea-slave-token
              mountPath: /run/secrets/gitea_slave_token
              subPath: gitea-slave-token
              readOnly: true
            - name: ssh-id-rsa
              mountPath: /run/secrets/ssh_id_rsa
              subPath: ssh-id-rsa
              readOnly: true
            - name: gitea-user
              mountPath: /run/secrets/gitea_user
              subPath: gitea-user
              readOnly: true
      volumes:
        - name: dind-socket
          hostPath:
            path: /var/lib/rancher/k3s/storage/shoggoth/dind-socket
            type: DirectoryOrCreate
        - name: entrypoint
          configMap:
            name: slave-dind-entrypoint
            defaultMode: 0755
        - name: rendered
          hostPath:
            path: /var/lib/rancher/k3s/storage/shoggoth/rendered
            type: DirectoryOrCreate
        - name: workflow-scripts
          hostPath:
            path: /var/lib/rancher/k3s/storage/shoggoth/workflow-scripts
            type: DirectoryOrCreate
        - name: git-cred
          hostPath:
            path: /var/lib/rancher/k3s/storage/shoggoth/slave-dind-git-cred
            type: DirectoryOrCreate
        - name: ci-cache
          persistentVolumeClaim:
            claimName: slave-dind-ci-cache
        - name: dind-data
          persistentVolumeClaim:
            claimName: slave-dind-data
        - name: gitea-slave-token
          secret:
            secretName: slave-dind-secrets
            items:
              - key: gitea-slave-token
                path: gitea-slave-token
        - name: ssh-id-rsa
          secret:
            secretName: slave-dind-secrets
            items:
              - key: ssh-id-rsa
                path: ssh-id-rsa
        - name: gitea-user
          secret:
            secretName: slave-dind-secrets
            items:
              - key: gitea-user
                path: gitea-user