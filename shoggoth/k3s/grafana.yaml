---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-config
  namespace: shoggoth
data:
  datasources.yaml: |
    apiVersion: 1
    
    datasources:
        - name: VictoriaMetrics
          type: prometheus
          access: proxy
          uid: vm
          url: http://victoria-metrics:80
          isDefault: true
          editable: false
        - name: Loki
          type: loki
          access: proxy
          uid: loki
          url: http://loki:3100
          editable: false
        - name: Tempo
          type: tempo
          access: proxy
          uid: tempo
          url: http://tempo:3200
          editable: false
          jsonData:
              search:
                  hide: false
              tracesToMetrics:
                  datasourceUid: vm
                  tags:
                      - key: service
                        value: service
                      - key: span_name
                        value: span_name
              tracesToLogs:
                  datasourceUid: loki
                  filterByTraceID: true
                  filterBySpanID: true
                  tags:
                      - key: service
                        value: service
  dashboards.yaml: |
    apiVersion: 1
    
    providers:
        - name: default
          orgId: 1
          folder: ""
          type: file
          disableDeletion: true
          editable: true
          options:
              path: /etc/grafana/provisioning/dashboards
              foldersFromFilesStructure: false

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-shoggoth
  namespace: shoggoth
data:
  shoggoth.json: |
    {
        "annotations": {
            "list": []
        },
        "editable": true,
        "fiscalYearStartMonth": 0,
        "graphTooltip": 1,
        "id": null,
        "links": [],
        "panels": [
            {
                "title": "Host CPU Utilization",
                "type": "timeseries",
                "gridPos": {"h": 9, "w": 6, "x": 0, "y": 0},
                "datasource": {"uid": "vm"},
                "targets": [{"expr": "100 - (avg by(host_name)(rate(system_cpu_time_seconds_total{state=\"idle\"}[5m])) * 100)", "legendFormat": "{{host_name}}", "refId": "A"}],
                "fieldConfig": {
                    "defaults": {
                        "unit": "percent",
                        "min": 0,
                        "max": 100,
                        "custom": {"drawStyle": "line", "lineInterpolation": "smooth", "lineWidth": 1.5, "showPoints": "never", "fillOpacity": 10}
                    },
                    "overrides": []
                }
            },
            {
                "title": "Host Memory Usage",
                "type": "timeseries",
                "gridPos": {"h": 9, "w": 6, "x": 6, "y": 0},
                "datasource": {"uid": "vm"},
                "targets": [{"expr": "(1 - system_linux_memory_available_bytes / system_memory_limit_bytes) * 100", "legendFormat": "{{host_name}}", "refId": "A"}],
                "fieldConfig": {
                    "defaults": {
                        "unit": "percent",
                        "min": 0,
                        "max": 100,
                        "custom": {"drawStyle": "line", "lineInterpolation": "smooth", "lineWidth": 1.5, "showPoints": "never", "fillOpacity": 10}
                    },
                    "overrides": []
                }
            },
            {
                "title": "Host Disk Usage",
                "type": "timeseries",
                "gridPos": {"h": 9, "w": 6, "x": 12, "y": 0},
                "datasource": {"uid": "vm"},
                "targets": [{"expr": "system_filesystem_utilization_ratio{type!~\"tmpfs|squashfs|overlay\"} * 100", "legendFormat": "{{mountpoint}}", "refId": "A"}],
                "fieldConfig": {
                    "defaults": {
                        "unit": "percent",
                        "min": 0,
                        "max": 100,
                        "custom": {"drawStyle": "line", "lineInterpolation": "smooth", "lineWidth": 1.5, "showPoints": "never", "fillOpacity": 10}
                    },
                    "overrides": []
                }
            },
            {
                "title": "Network Throughput",
                "type": "timeseries",
                "gridPos": {"h": 9, "w": 6, "x": 18, "y": 0},
                "datasource": {"uid": "vm"},
                "targets": [
                    {"expr": "rate(system_network_io_bytes_total{direction=\"receive\",device=~\"eth.*|wlan.*|enp.*\"}[5m])", "legendFormat": "↓ {{device}}", "refId": "A"},
                    {"expr": "rate(system_network_io_bytes_total{direction=\"transmit\",device=~\"eth.*|wlan.*|enp.*\"}[5m])", "legendFormat": "↑ {{device}}", "refId": "B"}
                ],
                "fieldConfig": {
                    "defaults": {
                        "unit": "Bps",
                        "custom": {"drawStyle": "line", "lineInterpolation": "smooth", "lineWidth": 1.5, "showPoints": "never", "fillOpacity": 10}
                    },
                    "overrides": []
                }
            },
            {
                "title": "Load Average (1m / 5m / 15m)",
                "type": "timeseries",
                "gridPos": {"h": 9, "w": 12, "x": 0, "y": 10},
                "datasource": {"uid": "vm"},
                "targets": [
                    {"expr": "system_cpu_load_average_1m", "legendFormat": "load 1m", "refId": "A"},
                    {"expr": "system_cpu_load_average_5m", "legendFormat": "load 5m", "refId": "B"},
                    {"expr": "system_cpu_load_average_15m", "legendFormat": "load 15m", "refId": "C"}
                ],
                "fieldConfig": {
                    "defaults": {
                        "custom": {"drawStyle": "line", "lineInterpolation": "smooth", "lineWidth": 1.5, "showPoints": "never", "fillOpacity": 10}
                    },
                    "overrides": []
                }
            },
            {
                "title": "Process Count by Status",
                "type": "timeseries",
                "gridPos": {"h": 9, "w": 12, "x": 12, "y": 10},
                "datasource": {"uid": "vm"},
                "targets": [{"expr": "system_processes_count", "legendFormat": "{{host_name}} {{status}}", "refId": "A"}],
                "fieldConfig": {
                    "defaults": {
                        "unit": "none",
                        "custom": {"drawStyle": "line", "lineInterpolation": "smooth", "lineWidth": 1.5, "showPoints": "never", "fillOpacity": 10}
                    },
                    "overrides": []
                }
            },
            {
                "title": "Container CPU Usage",
                "type": "timeseries",
                "gridPos": {"h": 9, "w": 12, "x": 0, "y": 19},
                "datasource": {"uid": "vm"},
                "targets": [{"expr": "max by(service) (rate(container_cpu_time_seconds_total{service=~\".+\"}[5m]))", "legendFormat": "{{service}}", "refId": "A"}],
                "fieldConfig": {
                    "defaults": {
                        "unit": "none",
                        "min": 0,
                        "custom": {"drawStyle": "line", "lineInterpolation": "smooth", "lineWidth": 1.5, "showPoints": "never", "fillOpacity": 10}
                    },
                    "overrides": []
                }
            },
            {
                "title": "Container Memory Usage",
                "type": "timeseries",
                "gridPos": {"h": 9, "w": 12, "x": 12, "y": 19},
                "datasource": {"uid": "vm"},
                "targets": [{"expr": "max by(service) (container_memory_usage_bytes{service=~\".+\"})", "legendFormat": "{{service}}", "refId": "A"}],
                "fieldConfig": {
                    "defaults": {
                        "unit": "bytes",
                        "custom": {"drawStyle": "line", "lineInterpolation": "smooth", "lineWidth": 1.5, "showPoints": "never", "fillOpacity": 10}
                    },
                    "overrides": []
                }
            },
            {
                "title": "Container Log Rate",
                "type": "timeseries",
                "gridPos": {"h": 9, "w": 24, "x": 0, "y": 28},
                "datasource": {"uid": "loki"},
                "targets": [{"expr": "sum by (service) (rate({service=~\".+\"}[5m]))", "legendFormat": "{{service}}", "refId": "A"}],
                "fieldConfig": {
                    "defaults": {
                        "unit": "lops",
                        "min": 0,
                        "custom": {"drawStyle": "line", "lineInterpolation": "smooth", "lineWidth": 1.5, "showPoints": "never", "fillOpacity": 10}
                    },
                    "overrides": []
                }
            },
            {
                "title": "Error Logs",
                "type": "logs",
                "gridPos": {"h": 18, "w": 24, "x": 0, "y": 37},
                "datasource": {"uid": "loki"},
                "targets": [
                    {"expr": "{service=~\".+\"} |~ \"(?i)(error|fatal|panic|critical|fail|FATAL|CRIT)|ERR\" !~ \"(?i)trace\" | line_format \"{{.service}} {{__line__}}\"", "refId": "A"}
                ],
                "options": {"showLabels": false, "showTime": true, "sortOrder": "Descending", "enableLogDetails": true, "wrapLogMessage": true, "prettifyLogMessage": true}
            },
            {
                "title": "Trace Rate",
                "type": "timeseries",
                "gridPos": {"h": 9, "w": 12, "x": 0, "y": 56},
                "datasource": {"uid": "vm"},
                "targets": [
                    {"expr": "sum(rate(traces_spanmetrics_calls_total[5m]))", "legendFormat": "traces/s", "refId": "A"},
                    {"expr": "sum(rate(traces_spanmetrics_calls_total{status_code=\"ERROR\"}[5m]))", "legendFormat": "errors/s", "refId": "B"}
                ],
                "fieldConfig": {
                    "defaults": {
                        "unit": "reqps",
                        "custom": {"drawStyle": "line", "lineInterpolation": "smooth", "lineWidth": 1.5, "showPoints": "never", "fillOpacity": 10}
                    },
                    "overrides": [
                        {
                            "matcher": {"id": "byName", "options": "errors/s"},
                            "properties": [{"id": "color", "value": {"fixedColor": "red", "mode": "fixed"}}]
                        }
                    ]
                }
            },
            {
                "title": "Trace Duration (p50 / p95 / p99)",
                "type": "timeseries",
                "gridPos": {"h": 9, "w": 12, "x": 12, "y": 56},
                "datasource": {"uid": "vm"},
                "targets": [
                    {"expr": "histogram_quantile(0.5, sum(rate(traces_spanmetrics_latency_bucket[5m])) by (le))", "legendFormat": "p50", "refId": "A"},
                    {"expr": "histogram_quantile(0.95, sum(rate(traces_spanmetrics_latency_bucket[5m])) by (le))", "legendFormat": "p95", "refId": "B"},
                    {"expr": "histogram_quantile(0.99, sum(rate(traces_spanmetrics_latency_bucket[5m])) by (le))", "legendFormat": "p99", "refId": "C"}
                ],
                "fieldConfig": {
                    "defaults": {
                        "unit": "s",
                        "custom": {"drawStyle": "line", "lineInterpolation": "smooth", "lineWidth": 1.5, "showPoints": "never", "fillOpacity": 10}
                    },
                    "overrides": []
                }
            },
            {
                "title": "Traces",
                "type": "table",
                "gridPos": {"h": 12, "w": 24, "x": 0, "y": 66},
                "datasource": {"type": "tempo", "uid": "tempo"},
                "targets": [
                    {"refId": "A", "datasource": {"type": "tempo", "uid": "tempo"}, "query": "{}", "queryType": "traceql", "tableType": "traces", "limit": 20}
                ],
                "fieldConfig": {
                    "defaults": {
                        "custom": {"cellOptions": {"type": "auto"}}
                    },
                    "overrides": []
                },
                "options": {"showHeader": true}
            }
        ],
        "refresh": "30s",
        "schemaVersion": 40,
        "tags": ["shoggoth"],
        "templating": {
            "list": []
        },
        "time": {"from": "now-1h", "to": "now"},
        "title": "Shoggoth",
        "description": "Shoggoth infrastructure overview: host metrics and traces",
        "uid": "shoggoth",
        "version": 2
    }

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-shoggoth-service
  namespace: shoggoth
data:
  shoggoth_service.json: |
    {
        "annotations": {
            "list": []
        },
        "editable": true,
        "fiscalYearStartMonth": 0,
        "graphTooltip": 1,
        "id": null,
        "links": [],
        "panels": [
            {
                "title": "CPU Usage",
                "type": "timeseries",
                "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0},
                "datasource": {"uid": "vm"},
                "targets": [
                    {"expr": "max by(service) (rate(container_cpu_time_seconds_total{service=\"$service\"}[5m]))", "legendFormat": "CPU cores", "refId": "A"}
                ],
                "fieldConfig": {
                    "defaults": {
                        "unit": "none",
                        "min": 0,
                        "custom": {"drawStyle": "line", "lineInterpolation": "smooth", "lineWidth": 1.5, "showPoints": "never", "fillOpacity": 10}
                    },
                    "overrides": []
                }
            },
            {
                "title": "Memory Usage",
                "type": "timeseries",
                "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0},
                "datasource": {"uid": "vm"},
                "targets": [
                    {"expr": "max by(service) (container_memory_usage_bytes{service=\"$service\"})", "legendFormat": "Memory usage", "refId": "A"},
                    {"expr": "max by(service) (container_spec_memory_limit_bytes{service=\"$service\"})", "legendFormat": "Limit", "refId": "B"}
                ],
                "fieldConfig": {
                    "defaults": {
                        "unit": "bytes",
                        "custom": {"drawStyle": "line", "lineInterpolation": "smooth", "lineWidth": 1.5, "showPoints": "never", "fillOpacity": 10}
                    },
                    "overrides": []
                }
            },
            {
                "title": "Network I/O",
                "type": "timeseries",
                "gridPos": {"h": 8, "w": 24, "x": 0, "y": 8},
                "datasource": {"uid": "vm"},
                "targets": [
                    {"expr": "sum by(service) (rate(k8s_pod_network_io_bytes_total{service=\"$service\",direction=\"receive\"}[5m]))", "legendFormat": "↓ Receive", "refId": "A"},
                    {"expr": "sum by(service) (rate(k8s_pod_network_io_bytes_total{service=\"$service\",direction=\"transmit\"}[5m]))", "legendFormat": "↑ Transmit", "refId": "B"}
                ],
                "fieldConfig": {
                    "defaults": {
                        "unit": "Bps",
                        "custom": {"drawStyle": "line", "lineInterpolation": "smooth", "lineWidth": 1.5, "showPoints": "never", "fillOpacity": 10}
                    },
                    "overrides": []
                }
            },
            {
                "title": "Working Set",
                "type": "stat",
                "gridPos": {"h": 4, "w": 12, "x": 0, "y": 16},
                "datasource": {"uid": "vm"},
                "targets": [
                    {"expr": "max(container_memory_working_set_bytes{service=\"$service\"})", "legendFormat": "", "refId": "A"}
                ],
                "fieldConfig": {
                    "defaults": {
                        "unit": "bytes",
                        "color": {"mode": "value"}
                    },
                    "overrides": []
                }
            },
            {
                "title": "Uptime",
                "type": "stat",
                "gridPos": {"h": 4, "w": 12, "x": 12, "y": 16},
                "datasource": {"uid": "vm"},
                "targets": [
                    {"expr": "max by(service) (container_uptime_seconds_total{service=\"$service\"})", "legendFormat": "", "refId": "A"}
                ],
                "fieldConfig": {
                    "defaults": {
                        "unit": "s",
                        "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}]},
                        "color": {"mode": "thresholds"}
                    },
                    "overrides": []
                }
            },
            {
                "title": "Service Logs",
                "type": "logs",
                "gridPos": {"h": 12, "w": 24, "x": 0, "y": 20},
                "datasource": {"uid": "loki"},
                "targets": [
                    {"expr": "{service=\"$service\"}", "refId": "A"}
                ],
                "options": {"showLabels": false, "showTime": true, "sortOrder": "Descending", "enableLogDetails": true, "wrapLogMessage": true, "prettifyLogMessage": true}
            }
        ],
        "refresh": "30s",
        "schemaVersion": 40,
        "tags": ["shoggoth", "service"],
        "templating": {
            "list": [
                {
                    "current": {"text": "", "value": ""},
                    "definition": "label_values(container_cpu_time_seconds_total{service=~\".+\"}, service)",
                    "hide": 0,
                    "includeAll": false,
                    "label": "Service",
                    "multi": false,
                    "name": "service",
                    "options": [],
                    "query": {"qryType": 1, "query": "label_values(container_cpu_time_seconds_total{service=~\".+\"}, service)", "refId": "VariableQuery-0"},
                    "refresh": 2,
                    "sort": 1,
                    "type": "query",
                    "datasource": {"uid": "vm"}
                }
            ]
        },
        "time": {"from": "now-1h", "to": "now"},
        "title": "Shoggoth Service",
        "description": "Per-service observability: CPU, memory, network, disk, and logs for a single selected container",
        "uid": "shoggoth-service",
        "version": 3
    }

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-shoggoth-kestra
  namespace: shoggoth
data:
  shoggoth_kestra.json: |
    {
        "annotations": {
            "list": []
        },
        "editable": true,
        "fiscalYearStartMonth": 0,
        "graphTooltip": 1,
        "id": null,
        "links": [],
        "panels": [
            {
                "title": "Execution Rate",
                "type": "timeseries",
                "gridPos": {"h": 9, "w": 8, "x": 0, "y": 0},
                "datasource": {"uid": "vm"},
                "targets": [
                    {"expr": "sum(rate(kestra_executor_execution_started_count_total[5m]))", "legendFormat": "started/s", "refId": "A"},
                    {"expr": "sum(rate(kestra_executor_execution_end_count_total[5m]))", "legendFormat": "ended/s", "refId": "B"},
                    {"expr": "sum(rate(kestra_executor_execution_queued_count_total[5m]))", "legendFormat": "queued/s", "refId": "C"}
                ],
                "fieldConfig": {
                    "defaults": {
                        "unit": "reqps",
                        "custom": {"drawStyle": "line", "lineInterpolation": "smooth", "lineWidth": 1.5, "showPoints": "never", "fillOpacity": 10}
                    },
                    "overrides": []
                }
            },
            {
                "title": "Task Run Rate",
                "type": "timeseries",
                "gridPos": {"h": 9, "w": 8, "x": 8, "y": 0},
                "datasource": {"uid": "vm"},
                "targets": [
                    {"expr": "sum(rate(kestra_worker_started_count_total[5m]))", "legendFormat": "started/s", "refId": "A"},
                    {"expr": "sum(rate(kestra_worker_ended_count_total[5m]))", "legendFormat": "ended/s", "refId": "B"},
                    {"expr": "sum(rate(kestra_worker_timeout_count_total[5m]))", "legendFormat": "timed out/s", "refId": "C"}
                ],
                "fieldConfig": {
                    "defaults": {
                        "unit": "reqps",
                        "custom": {"drawStyle": "line", "lineInterpolation": "smooth", "lineWidth": 1.5, "showPoints": "never", "fillOpacity": 10}
                    },
                    "overrides": [
                        {
                            "matcher": {"id": "byRegexp", "options": ".*timed out.*"},
                            "properties": [{"id": "color", "value": {"fixedColor": "orange", "mode": "fixed"}}]
                        }
                    ]
                }
            },
            {
                "title": "Running Tasks",
                "type": "stat",
                "gridPos": {"h": 9, "w": 4, "x": 16, "y": 0},
                "datasource": {"uid": "vm"},
                "targets": [
                    {"expr": "sum(kestra_worker_running_count)", "legendFormat": "running", "refId": "A"},
                    {"expr": "sum(kestra_controller_job_inflight)", "legendFormat": "inflight", "refId": "B"},
                    {"expr": "sum(kestra_worker_pending_count)", "legendFormat": "pending", "refId": "C"}
                ],
                "fieldConfig": {
                    "defaults": {
                        "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "yellow", "value": 10}]},
                        "color": {"mode": "thresholds"}
                    },
                    "overrides": []
                }
            },
            {
                "title": "Worker Threads",
                "type": "stat",
                "gridPos": {"h": 9, "w": 4, "x": 20, "y": 0},
                "datasource": {"uid": "vm"},
                "targets": [
                    {"expr": "sum(kestra_worker_job_thread)", "legendFormat": "threads", "refId": "A"}
                ],
                "fieldConfig": {
                    "defaults": {
                        "thresholds": {"mode": "absolute", "steps": [{"color": "blue", "value": null}]},
                        "color": {"mode": "thresholds"}
                    },
                    "overrides": []
                }
            },
            {
                "title": "Execution Duration (p50 / p95 / p99)",
                "type": "timeseries",
                "gridPos": {"h": 9, "w": 12, "x": 0, "y": 9},
                "datasource": {"uid": "vm"},
                "targets": [
                    {"expr": "histogram_quantile(0.5, sum(rate(kestra_executor_execution_duration_seconds_bucket[5m])) by (le))", "legendFormat": "p50", "refId": "A"},
                    {"expr": "histogram_quantile(0.95, sum(rate(kestra_executor_execution_duration_seconds_bucket[5m])) by (le))", "legendFormat": "p95", "refId": "B"},
                    {"expr": "histogram_quantile(0.99, sum(rate(kestra_executor_execution_duration_seconds_bucket[5m])) by (le))", "legendFormat": "p99", "refId": "C"}
                ],
                "fieldConfig": {
                    "defaults": {
                        "unit": "s",
                        "custom": {"drawStyle": "line", "lineInterpolation": "smooth", "lineWidth": 1.5, "showPoints": "never", "fillOpacity": 10}
                    },
                    "overrides": []
                }
            },
            {
                "title": "Task Duration (p50 / p95 / p99)",
                "type": "timeseries",
                "gridPos": {"h": 9, "w": 12, "x": 12, "y": 9},
                "datasource": {"uid": "vm"},
                "targets": [
                    {"expr": "histogram_quantile(0.5, sum(rate(kestra_worker_ended_duration_seconds_bucket[5m])) by (le))", "legendFormat": "p50", "refId": "A"},
                    {"expr": "histogram_quantile(0.95, sum(rate(kestra_worker_ended_duration_seconds_bucket[5m])) by (le))", "legendFormat": "p95", "refId": "B"},
                    {"expr": "histogram_quantile(0.99, sum(rate(kestra_worker_ended_duration_seconds_bucket[5m])) by (le))", "legendFormat": "p99", "refId": "C"}
                ],
                "fieldConfig": {
                    "defaults": {
                        "unit": "s",
                        "custom": {"drawStyle": "line", "lineInterpolation": "smooth", "lineWidth": 1.5, "showPoints": "never", "fillOpacity": 10}
                    },
                    "overrides": []
                }
            },
            {
                "title": "Indexer Rate",
                "type": "timeseries",
                "gridPos": {"h": 9, "w": 8, "x": 0, "y": 18},
                "datasource": {"uid": "vm"},
                "targets": [
                    {"expr": "sum(rate(kestra_indexer_request_count_total[5m]))", "legendFormat": "requests/s", "refId": "A"},
                    {"expr": "sum(rate(kestra_indexer_message_in_count_total[5m]))", "legendFormat": "messages in/s", "refId": "B"},
                    {"expr": "sum(rate(kestra_indexer_message_out_count_total[5m]))", "legendFormat": "messages out/s", "refId": "C"}
                ],
                "fieldConfig": {
                    "defaults": {
                        "unit": "reqps",
                        "custom": {"drawStyle": "line", "lineInterpolation": "smooth", "lineWidth": 1.5, "showPoints": "never", "fillOpacity": 10}
                    },
                    "overrides": []
                }
            },
            {
                "title": "Indexer Duration (p50 / p99)",
                "type": "timeseries",
                "gridPos": {"h": 9, "w": 8, "x": 8, "y": 18},
                "datasource": {"uid": "vm"},
                "targets": [
                    {"expr": "histogram_quantile(0.5, sum(rate(kestra_indexer_request_duration_seconds_bucket[5m])) by (le))", "legendFormat": "p50", "refId": "A"},
                    {"expr": "histogram_quantile(0.99, sum(rate(kestra_indexer_request_duration_seconds_bucket[5m])) by (le))", "legendFormat": "p99", "refId": "B"}
                ],
                "fieldConfig": {
                    "defaults": {
                        "unit": "s",
                        "custom": {"drawStyle": "line", "lineInterpolation": "smooth", "lineWidth": 1.5, "showPoints": "never", "fillOpacity": 10}
                    },
                    "overrides": []
                }
            },
            {
                "title": "Queue Rate",
                "type": "timeseries",
