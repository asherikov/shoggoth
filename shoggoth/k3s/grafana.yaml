                    {"expr": "{service=~\"kestra.*\"}", "refId": "A"}
                ],
                "options": {"showLabels": false, "showTime": true, "sortOrder": "Descending", "enableLogDetails": true, "wrapLogMessage": true, "prettifyLogMessage": true}
            },
            {
                "title": "Kestra Traces",
                "type": "table",
                "gridPos": {"h": 12, "w": 24, "x": 0, "y": 48},
                "datasource": {"type": "tempo", "uid": "tempo"},
                "targets": [
                    {"refId": "A", "datasource": {"type": "tempo", "uid": "tempo"}, "query": "{ resource.service.name = \"kestra\" }", "queryType": "traceql", "tableType": "traces"}
                ],
                "fieldConfig": {
                    "defaults": {
                        "custom": {"cellOptions": {"type": "auto"}}
                    },
                    "overrides": []
                },
                "options": {"showHeader": true}
            }
        ],
        "refresh": "30s",
        "schemaVersion": 40,
        "tags": ["shoggoth", "kestra"],
        "templating": {
            "list": []
        },
        "time": {"from": "now-1h", "to": "now"},
        "title": "Shoggoth Kestra",
        "description": "Kestra workflow engine metrics: executions, tasks, scheduler, queue, and logs",
        "uid": "shoggoth-kestra",
        "version": 2
    }

