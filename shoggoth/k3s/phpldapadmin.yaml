---
apiVersion: v1
kind: ConfigMap
metadata:
  name: phpldapadmin-entrypoint
  namespace: ${SHOGGOTH_NAMESPACE}
data:
  entrypoint.sh: |
    #!/usr/bin/env bash
    set -euo pipefail

    set -a
    . /shoggoth/rendered/phpldapadmin.env
    set +a

    exec /sbin/init-docker --config /etc/caddy/Caddyfile --adapter caddyfile

---
apiVersion: v1
kind: Service
metadata:
  name: phpldapadmin
  namespace: ${SHOGGOTH_NAMESPACE}
spec:
  selector:
    app: phpldapadmin
  ports:
    - name: http
      port: 80
      targetPort: 80

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: phpldapadmin
  namespace: ${SHOGGOTH_NAMESPACE}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: phpldapadmin
  template:
    metadata:
      labels:
        app: phpldapadmin
    spec:
      dnsPolicy: None
      dnsConfig:
        nameservers:
          - ${DNS_IP}
        searches:
          - ${SHOGGOTH_NAMESPACE}.svc.cluster.local
          - svc.cluster.local
          - cluster.local
      initContainers:
        - name: wait-bringup
          image: busybox:latest
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c"]
          args:
            - |
              echo "wait-bringup: checking sentinel /shoggoth/rendered/.bringup-done"
              if [ ! -f /shoggoth/rendered/.bringup-done ]; then
                echo "wait-bringup: sentinel not found, dumping diagnostics:" >&2
                echo "wait-bringup: /shoggoth/rendered/ exists: $([ -d /shoggoth/rendered ] && echo yes || echo no)" >&2
                if [ -d /shoggoth/rendered ]; then
                  echo "wait-bringup: contents:" >&2
                  ls -la /shoggoth/rendered/ >&2 || true
                fi
                if [ -f /shoggoth/rendered/bringup.log ]; then
                  echo "wait-bringup: bringup.log tail:" >&2
                  tail -20 /shoggoth/rendered/bringup.log >&2 || true
                fi
                echo "wait-bringup: exiting, bringup may still be in progress" >&2
                exit 1
              fi
              echo "wait-bringup: sentinel found"
          resources:
            requests:
              memory: "32Mi"
              cpu: "50m"
            limits:
              memory: "64Mi"
              cpu: "200m"
          volumeMounts:
            - name: rendered
              mountPath: /shoggoth/rendered
              readOnly: true
      containers:
        - name: phpldapadmin
          image: phpldapadmin/phpldapadmin:latest
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "/shoggoth/entrypoint.sh"]
          ports:
            - containerPort: 80
              name: http
          env:
            - name: SERVER_NAME
              value: ":80"
            - name: OTEL_TRACES_EXPORTER
              value: "otlp"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otelcol:4318"
            - name: SHOGGOTH_DOMAIN
              value: "${SHOGGOTH_DOMAIN}"
          volumeMounts:
            - name: rendered
              mountPath: /shoggoth/rendered
              readOnly: true
            - name: entrypoint
              mountPath: /shoggoth/entrypoint.sh
              subPath: entrypoint.sh
              readOnly: true
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6
      volumes:
        - name: rendered
          hostPath:
            path: /var/lib/rancher/k3s/storage/${SHOGGOTH_INSTANCE_DIR}/rendered
            type: DirectoryOrCreate
        - name: entrypoint
          configMap:
            name: phpldapadmin-entrypoint