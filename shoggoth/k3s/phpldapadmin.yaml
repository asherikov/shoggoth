---
apiVersion: v1
kind: ConfigMap
metadata:
  name: phpldapadmin-entrypoint
  namespace: ${SHOGGOTH_NAMESPACE}
data:
  entrypoint.sh: |
    #!/usr/bin/env bash
    set -euo pipefail

    : "${LDAP_BASE_DN:=dc=$(printf '%s' "${SHOGGOTH_DOMAIN}" | sed 's/\./,dc=/g')}"

    export LDAP_BASE_DN

    exec /sbin/init-docker --config /etc/caddy/Caddyfile --adapter caddyfile
---
apiVersion: v1
kind: Service
metadata:
  name: phpldapadmin
  namespace: ${SHOGGOTH_NAMESPACE}
spec:
  selector:
    app: phpldapadmin
  ports:
  - name: http
    port: 80
    targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: phpldapadmin
  namespace: ${SHOGGOTH_NAMESPACE}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: phpldapadmin
  template:
    metadata:
      labels:
        app: phpldapadmin
      annotations:
        secret.reloader.stakater.com/reload: openldap-ldapauth-password
    spec:
      dnsPolicy: None
      dnsConfig:
        nameservers:
        - ${SHOGGOTH_DNS_IP}
        searches:
        - ${SHOGGOTH_NAMESPACE}.svc.cluster.local
        - svc.cluster.local
        - cluster.local
      initContainers:
      - name: wait-bootstrap
        image: asherikov/shoggoth_tools:alpine
        imagePullPolicy: IfNotPresent
        command:
        - bash
        - -c
        args:
        - |
          set -euo pipefail
          NS="${SHOGGOTH_NAMESPACE}"
                    wait_for_externalsecret() {
                      local name="$1"
                      echo "wait-bootstrap: waiting for externalsecret/${name} Ready in namespace ${NS}..."
                      for i in $(seq 1 60); do
                        if kubectl get externalsecret "${name}" -n "${NS}" -o json 2>/dev/null | jq -e '.status.conditions // [] | map(select(.type=="Ready" and .status=="True")) | length > 0' >/dev/null 2>&1; then
                          echo "wait-bootstrap: externalsecret/${name} Ready (after $((i*10))s)"
                          return 0
                        fi
                        sleep 10
                      done
                      echo "FAIL: externalsecret/${name} not Ready after 10m"
                      echo "      Hint: check status from outside the pod:"
                      echo "            kubectl get externalsecret -n ${NS} ${name} -o yaml"
                      echo "            kubectl describe externalsecret -n ${NS} ${name}"
                      echo "      Most common causes: OpenBao unavailable, SecretStore reference broken,"
                      echo "      or remote secret missing (Orphan policies require a value in the source store)."
                      return 1
                    }
          echo "wait-bootstrap: waiting for secret/openldap-ldapauth-password.password in namespace ${NS}..."
                    wait_for_externalsecret openldap-ldapauth-password || exit 1
          echo "wait-bootstrap: all K8s Secrets Ready"

        resources:
          requests:
            memory: 32Mi
            cpu: 50m
          limits:
            memory: 64Mi
            cpu: 200m
        volumeMounts: []
      containers:
      - name: phpldapadmin
        image: phpldapadmin/phpldapadmin:2.3.11
        imagePullPolicy: IfNotPresent
        command:
        - /bin/bash
        - /shoggoth/entrypoint.sh
        ports:
        - containerPort: 80
          name: http
        env:
        - name: SERVER_NAME
          value: :80
        - name: LDAP_HOST
          value: openldap
        - name: LDAP_PORT
          value: '389'
        - name: LDAP_USERNAME
          value: uid=ldapauth,ou=people,${LDAP_BASE_DN}
        - name: LDAP_PASSWORD
          valueFrom:
            secretKeyRef:
              name: openldap-ldapauth-password
              key: password
        - name: OTEL_TRACES_EXPORTER
          value: otlp
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://otelcol:4318
        - name: SHOGGOTH_DOMAIN
          value: ${SHOGGOTH_DOMAIN}
        - name: LDAP_BASE_DN
          value: ${LDAP_BASE_DN}
        volumeMounts:
        - name: entrypoint
          mountPath: /shoggoth/entrypoint.sh
          subPath: entrypoint.sh
          readOnly: true
        resources:
          requests:
            memory: 64Mi
            cpu: 50m
          limits:
            memory: 128Mi
            cpu: 500m
        readinessProbe:
          httpGet:
            path: /up
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
          failureThreshold: 30
        livenessProbe:
          httpGet:
            path: /up
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 30
          failureThreshold: 3
          timeoutSeconds: 5
      volumes:
      - name: entrypoint
        configMap:
          name: phpldapadmin-entrypoint
      serviceAccountName: phpldapadmin
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: phpldapadmin
  namespace: ${SHOGGOTH_NAMESPACE}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: phpldapadmin-bootstrap-wait
  namespace: ${SHOGGOTH_NAMESPACE}
rules:
- apiGroups:
  - ''
  resources:
  - secrets
  resourceNames:
  - openldap-ldapauth-password
  verbs:
  - get
- apiGroups:
  - external-secrets.io
  resources:
  - externalsecrets
  resourceNames:
  - openldap-ldapauth-password
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: phpldapadmin-bootstrap-wait
  namespace: ${SHOGGOTH_NAMESPACE}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: phpldapadmin-bootstrap-wait
subjects:
- kind: ServiceAccount
  name: phpldapadmin
  namespace: ${SHOGGOTH_NAMESPACE}
