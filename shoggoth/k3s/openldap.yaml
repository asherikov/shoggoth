apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: openldap-data
  namespace: ${SHOGGOTH_NAMESPACE}
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: local-path
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: openldap-config
  namespace: ${SHOGGOTH_NAMESPACE}
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: local-path
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: openldap-init
  namespace: ${SHOGGOTH_NAMESPACE}
data:
  init.sh: |
    #!/usr/bin/env bash
    set -euo pipefail

    LDAP_BASE_DN="$(printf '%s' "${LDAP_DOMAIN}" | sed 's/\./,dc=/g; s/^/dc=/')"
    ADMIN_DN="cn=admin,${LDAP_BASE_DN}"
    CONFIG_ADMIN_DN="cn=admin,cn=config"
    LDAP_URL="ldap://localhost:389"
    LDAP_DIR="/shoggoth/openldap"

    clean_pw_file() {
        local src="${1}"
        local dst
        dst="$(mktemp)"
        tr -d '\n\r' < "${src}" > "${dst}"
        printf '%s' "${dst}"
    }

    get_actual_base_dn() {
        ldapsearch -x -H "${LDAP_URL}" \
            -D "${CONFIG_ADMIN_DN}" -y "${CONFIG_ADMIN_PW}" \
            -b "cn=config" -s sub '(olcSuffix=*)' olcSuffix 2>/dev/null \
            | grep '^olcSuffix:' | awk '{print $2}' | head -1 || true
    }

    ADMIN_PW="$(clean_pw_file /run/secrets/openldap_admin_password)"
    CONFIG_ADMIN_PW="$(clean_pw_file /run/secrets/openldap_config_admin_password)"
    trap 'rm -f "${ADMIN_PW}" "${CONFIG_ADMIN_PW}"' EXIT

    SENTINEL="/var/lib/ldap/shoggoth-init-done"

    if [ -f "${SENTINEL}" ]; then
        echo "shoggoth: LDAP already initialized, re-applying passwords for rotation"
        echo "shoggoth: Waiting for slapd to accept connections..."
        for i in $(seq 1 30); do
            if ldapsearch -x -H "${LDAP_URL}" -b "" -s base namingContexts >/dev/null 2>&1; then
                break
            fi
            sleep 1
        done
        if ! ldapsearch -x -H "${LDAP_URL}" -b "" -s base namingContexts >/dev/null 2>&1; then
            echo "shoggoth: FATAL: slapd not accepting connections after 30s" >&2
            exit 1
        fi
        if ! ldapsearch -x -H "${LDAP_URL}" \
            -D "${ADMIN_DN}" -y "${ADMIN_PW}" \
            -b "${LDAP_BASE_DN}" -s base '(objectClass=*)' dn > /dev/null 2>&1; then
            ACTUAL_BASE_DN="$(get_actual_base_dn)"
            if [ -n "${ACTUAL_BASE_DN}" ] && [ "${ACTUAL_BASE_DN}" != "${LDAP_BASE_DN}" ]; then
                echo "shoggoth: LDAP domain changed: ${ACTUAL_BASE_DN} -> ${LDAP_BASE_DN}, using actual DB suffix for auth"
                ADMIN_DN="cn=admin,${ACTUAL_BASE_DN}"
                if ! ldapsearch -x -H "${LDAP_URL}" \
                    -D "${ADMIN_DN}" -y "${ADMIN_PW}" \
                    -b "${ACTUAL_BASE_DN}" -s base '(objectClass=*)' dn > /dev/null 2>&1; then
                    echo "shoggoth: FATAL: slapd not ready (admin=${ADMIN_DN}, base=${ACTUAL_BASE_DN})" >&2
                    exit 1
                fi
            else
                echo "shoggoth: FATAL: slapd not ready (admin=${ADMIN_DN}, base=${LDAP_BASE_DN})" >&2
                exit 1
            fi
        fi
        if [ -f "${LDAP_DIR}/passwords.ldif" ]; then
            if [ "${ADMIN_DN}" = "cn=admin,${LDAP_BASE_DN}" ]; then
                ldapmodify -x -H "${LDAP_URL}" \
                    -D "${ADMIN_DN}" -y "${ADMIN_PW}" \
                    -f "${LDAP_DIR}/passwords.ldif" || {
                    echo "shoggoth: ERROR: password rotation failed" >&2
                    exit 1
                }
            else
                echo "shoggoth: skipping password rotation (domain changed, LDIF DNs would not match)"
            fi
        fi
        touch /run/shoggoth-ldap-init-done
        exit 0
    fi

    echo "shoggoth: === openldap: checking slapd ==="
    echo "shoggoth: Waiting for slapd to accept connections..."
    for i in $(seq 1 30); do
        if ldapsearch -x -H "${LDAP_URL}" -b "" -s base namingContexts >/dev/null 2>&1; then
            break
        fi
        sleep 1
    done
    if ! ldapsearch -x -H "${LDAP_URL}" \
        -D "${ADMIN_DN}" -y "${ADMIN_PW}" \
        -b "${LDAP_BASE_DN}" -s base '(objectClass=*)' dn > /dev/null 2>&1; then
        echo "shoggoth: FATAL: slapd not ready (admin=${ADMIN_DN}, base=${LDAP_BASE_DN})" >&2
        exit 1
    fi
    echo "shoggoth: slapd is ready."

    MDB_DN="olcDatabase={1}mdb,cn=config"

    echo "shoggoth: === configuring memberof overlay ==="
    MEMBEROF_EXISTS="$(ldapsearch -x -H "${LDAP_URL}" \
        -D "${CONFIG_ADMIN_DN}" -y "${CONFIG_ADMIN_PW}" \
        -b "olcOverlay=memberof,${MDB_DN}" -s base '(objectClass=*)' \
        olcMemberOfGroupOC 2>/dev/null || true)"

    if printf '%s\n' "${MEMBEROF_EXISTS}" | grep -q "^olcMemberOfGroupOC:"; then
        echo "shoggoth: memberof overlay already configured"
    else
        MEMBEROF_MODULE_EXISTS="$(ldapsearch -x -H "${LDAP_URL}" \
            -D "${CONFIG_ADMIN_DN}" -y "${CONFIG_ADMIN_PW}" \
            -b "cn=module{0},cn=config" -s base '(objectClass=*)' olcModuleLoad 2>/dev/null || true)"
        if ! printf '%s\n' "${MEMBEROF_MODULE_EXISTS}" | grep -q "memberof"; then
            if [ -f "${LDAP_DIR}/memberof_module.ldif" ]; then
                ldapmodify -x -H "${LDAP_URL}" \
                    -D "${CONFIG_ADMIN_DN}" -y "${CONFIG_ADMIN_PW}" \
                    -f "${LDAP_DIR}/memberof_module.ldif" || true
            fi
        fi
        if [ -f "${LDAP_DIR}/memberof_overlay.ldif" ]; then
            ldapadd -x -H "${LDAP_URL}" \
                -D "${CONFIG_ADMIN_DN}" -y "${CONFIG_ADMIN_PW}" \
                -f "${LDAP_DIR}/memberof_overlay.ldif" || true
        fi
        echo "shoggoth: memberof overlay enabled"
    fi

    if [ -f "${LDAP_DIR}/config.ldif" ]; then
        echo "shoggoth: === configuring ACLs ==="
        ldapmodify -x -H "${LDAP_URL}" \
            -D "${CONFIG_ADMIN_DN}" -y "${CONFIG_ADMIN_PW}" \
            -f "${LDAP_DIR}/config.ldif" || true
    fi

    if [ -f "${LDAP_DIR}/data.ldif" ]; then
        echo "shoggoth: === provisioning LDAP data ==="
        ldapadd -c -x -H "${LDAP_URL}" \
            -D "${ADMIN_DN}" -y "${ADMIN_PW}" \
            -f "${LDAP_DIR}/data.ldif" 2>&1 | grep -v 'Already exists' || true
    fi

    if [ -f "${LDAP_DIR}/passwords.ldif" ]; then
        echo "shoggoth: setting passwords"
        ldapmodify -x -H "${LDAP_URL}" \
            -D "${ADMIN_DN}" -y "${ADMIN_PW}" \
            -f "${LDAP_DIR}/passwords.ldif" || true
    fi

    touch "${SENTINEL}"
    touch /run/shoggoth-ldap-init-done
    echo "shoggoth: OpenLDAP initialization complete."
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: openldap-ldif-templates
  namespace: ${SHOGGOTH_NAMESPACE}
data:
  config.ldif: |
    dn: olcDatabase={1}mdb,cn=config
    changetype: modify
    replace: olcAccess
    olcAccess: {0}to attrs=userPassword by self write by anonymous auth by * none
    olcAccess: {1}to attrs=shadowLastChange by self write by users read
    olcAccess: {2}to * by users read by * none
  data.ldif: |
    dn: ou=people,${LDAP_BASE_DN}
    changetype: add
    objectClass: organizationalUnit
    ou: people

    dn: ou=groups,${LDAP_BASE_DN}
    changetype: add
    objectClass: organizationalUnit
    ou: groups

    dn: uid=admin,ou=people,${LDAP_BASE_DN}
    changetype: add
    objectClass: inetOrgPerson
    objectClass: posixAccount
    uid: admin
    cn: Admin
    sn: Shoggoth
    uidNumber: 10000
    gidNumber: 10000
    homeDirectory: /home/admin
    mail: admin@${SHOGGOTH_DOMAIN}

    dn: uid=ldapauth,ou=people,${LDAP_BASE_DN}
    changetype: add
    objectClass: inetOrgPerson
    objectClass: posixAccount
    uid: ldapauth
    cn: LDAP Auth
    sn: Shoogoth
    uidNumber: 10001
    gidNumber: 10001
    homeDirectory: /home/ldapauth
    mail: ldapauth@${SHOGGOTH_DOMAIN}

    dn: uid=slave,ou=people,${LDAP_BASE_DN}
    changetype: add
    objectClass: inetOrgPerson
    objectClass: posixAccount
    uid: slave
    cn: Slave
    sn: Shoggoth
    uidNumber: 10002
    gidNumber: 10002
    homeDirectory: /home/slave
    mail: slave@${SHOGGOTH_DOMAIN}

    dn: uid=slave-reviewer,ou=people,${LDAP_BASE_DN}
    changetype: add
    objectClass: inetOrgPerson
    objectClass: posixAccount
    uid: slave-reviewer
    cn: Slave Reviewer
    sn: Shoggoth
    uidNumber: 10003
    gidNumber: 10003
    homeDirectory: /home/slave-reviewer
    mail: slave-reviewer@${SHOGGOTH_DOMAIN}

    dn: cn=admins,ou=groups,${LDAP_BASE_DN}
    changetype: add
    objectClass: groupOfNames
    cn: admins
    member: uid=admin,ou=people,${LDAP_BASE_DN}

    dn: cn=shoggoth-auth,ou=groups,${LDAP_BASE_DN}
    changetype: add
    objectClass: groupOfNames
    cn: shoggoth-auth
    member: uid=ldapauth,ou=people,${LDAP_BASE_DN}
  memberof_module.ldif: |
    dn: cn=module{0},cn=config
    changetype: modify
    add: olcModuleLoad
    olcModuleLoad: memberof
  memberof_overlay.ldif: |
    dn: olcOverlay=memberof,${MDB_DN}
    objectClass: olcOverlayConfig
    objectClass: olcMemberOf
    olcOverlay: memberof
    olcMemberOfDangling: ignore
    olcMemberOfRefInt: FALSE
    olcMemberOfGroupOC: groupOfNames
    olcMemberOfMemberAD: member
    olcMemberOfMemberOfAD: memberOf
  passwords.ldif: |
    dn: uid=admin,ou=people,${LDAP_BASE_DN}
    changetype: modify
    replace: userPassword
    userPassword: ${ADMIN_HASH}

    dn: uid=ldapauth,ou=people,${LDAP_BASE_DN}
    changetype: modify
    replace: userPassword
    userPassword: ${LDAPAUTH_HASH}

    dn: uid=slave,ou=people,${LDAP_BASE_DN}
    changetype: modify
    replace: userPassword
    userPassword: ${SLAVE_HASH}

    dn: uid=slave-reviewer,ou=people,${LDAP_BASE_DN}
    changetype: modify
    replace: userPassword
    userPassword: ${SLAVE_REVIEWER_HASH}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: openldap-render-ldif
  namespace: ${SHOGGOTH_NAMESPACE}
data:
  render.sh: |
    #!/usr/bin/env bash
    set -euo pipefail

    TEMPLATES_DIR="/templates"
    RENDERED_DIR="/rendered"

    read_pw() {
        local f="${1}"
        tr -d '\n\r' < "${f}"
    }

    hex_to_raw() {
        local hex="${1}"
        printf '%b' "$(printf '%s' "${hex}" | sed 's/\(..\)/\\x\1/g')"
    }

    slappasswd() {
        local pw="${1}"
        local salt_hex salt hash
        salt_hex="$(openssl rand -hex 4)"
        salt="$(hex_to_raw "${salt_hex}")"
        hash="$(printf '%s%s' "${pw}" "${salt}" | openssl dgst -sha1 -hex | awk '{print $NF}')"
        local combined
        combined="$(hex_to_raw "${hash}${salt_hex}")"
        printf '{SSHA}%s' "$(printf '%s' "${combined}" | openssl base64 -A)"
    }

    export ADMIN_HASH="$(slappasswd "$(read_pw /run/secrets/openldap_admin_password)")"
    export LDAPAUTH_HASH="$(slappasswd "$(read_pw /run/secrets/openldap_ldapauth_password)")"
    export SLAVE_HASH="$(slappasswd "$(read_pw /run/secrets/openldap_slave_password)")"
    export SLAVE_REVIEWER_HASH="$(slappasswd "$(read_pw /run/secrets/openldap_slave-reviewer_password)")"

    VARS='${LDAP_BASE_DN}${SHOGGOTH_DOMAIN}${MDB_DN}${ADMIN_HASH}${LDAPAUTH_HASH}${SLAVE_HASH}${SLAVE_REVIEWER_HASH}'

    for tmpl in config.ldif data.ldif memberof_module.ldif memberof_overlay.ldif passwords.ldif; do
        if [ ! -f "${TEMPLATES_DIR}/${tmpl}" ]; then
            echo "render-ldif: FATAL: missing template ${tmpl}" >&2
            exit 1
        fi
        envsubst "${VARS}" < "${TEMPLATES_DIR}/${tmpl}" > "${RENDERED_DIR}/${tmpl}"
    done

    echo "render-ldif: rendered $(ls ${RENDERED_DIR} | wc -l) LDIF files"
    ls -la "${RENDERED_DIR}"
---
apiVersion: v1
kind: Service
metadata:
  name: openldap
  namespace: ${SHOGGOTH_NAMESPACE}
spec:
  selector:
    app: openldap
  ports:
  - name: ldap
    port: 389
    targetPort: 389
  - name: ldaps
    port: 636
    targetPort: 636
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openldap
  namespace: ${SHOGGOTH_NAMESPACE}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openldap
  template:
    metadata:
      labels:
        app: openldap
    spec:
      dnsPolicy: None
      dnsConfig:
        nameservers:
        - ${SHOGGOTH_DNS_IP}
        searches:
        - ${SHOGGOTH_NAMESPACE}.svc.cluster.local
        - svc.cluster.local
        - cluster.local
      initContainers:
      - name: render-ldif
        image: asherikov/shoggoth_tools:alpine
        imagePullPolicy: IfNotPresent
        env:
        - name: LDAP_BASE_DN
          value: dc=$(printf '%s' "${SHOGGOTH_DOMAIN}" | sed 's/\./,dc=/g')
        - name: SHOGGOTH_DOMAIN
          value: ${SHOGGOTH_DOMAIN}
        - name: MDB_DN
          value: olcDatabase={1}mdb,cn=config
        command:
        - bash
        - -c
        args:
        - /tmpl/render.sh
        resources:
          requests:
            memory: 32Mi
            cpu: 50m
          limits:
            memory: 64Mi
            cpu: 200m
        volumeMounts:
        - name: ldif-templates
          mountPath: /templates
          readOnly: true
        - name: rendered-ldif
          mountPath: /rendered
        - name: admin-password
          mountPath: /run/secrets/openldap_admin_password
          subPath: password
          readOnly: true
        - name: ldapauth-password
          mountPath: /run/secrets/openldap_ldapauth_password
          subPath: password
          readOnly: true
        - name: slave-password
          mountPath: /run/secrets/openldap_slave_password
          subPath: password
          readOnly: true
        - name: slave-reviewer-password
          mountPath: /run/secrets/openldap_slave-reviewer_password
          subPath: password
          readOnly: true
        - name: render-script
          mountPath: /tmpl
          readOnly: true
      - name: wait-bootstrap
        image: asherikov/shoggoth_tools:alpine
        imagePullPolicy: IfNotPresent
        command:
        - bash
        - -c
        args:
        - |
          set -euo pipefail
          K8S_API="${K8S_API:-https://kubernetes.default.svc}"
          SA_TOKEN="$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)"
          SA_CA="/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
          for i in $(seq 1 120); do
            http_code=$(curl -sS --cacert "${SA_CA}" \
              -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer ${SA_TOKEN}" \
              "${K8S_API}/api/v1/namespaces/${SHOGGOTH_NAMESPACE}/secrets/shoggoth-bootstrap-done" || true)
            if [ "${http_code}" = "200" ]; then
              echo "wait-bootstrap: shoggoth-bootstrap-done Secret found"
              exit 0
            fi
            echo "wait-bootstrap: waiting for shoggoth-bootstrap-done Secret (attempt $i/120, http=${http_code})..."
            if [ $((i % 12)) -eq 0 ] && [ "${http_code}" != "404" ]; then
              curl -sS --cacert "${SA_CA}" \
                -H "Authorization: Bearer ${SA_TOKEN}" \
                "${K8S_API}/api/v1/namespaces/${SHOGGOTH_NAMESPACE}/secrets/shoggoth-bootstrap-done" >&2 || true
            fi
            sleep 5
          done
          echo "wait-bootstrap: FATAL: shoggoth-bootstrap-done Secret not found after 600s"
          echo "wait-bootstrap: openbao-bootstrap may have failed; check:"
          echo "  kubectl logs -n ${SHOGGOTH_NAMESPACE} -l app=openbao -c openbao-bootstrap"
          exit 1
        resources:
          requests:
            memory: 32Mi
            cpu: 50m
          limits:
            memory: 64Mi
            cpu: 200m
        volumeMounts: []
      containers:
      - name: openldap
        image: osixia/openldap:1.5.0
        ports:
        - containerPort: 389
          name: ldap
        - containerPort: 636
          name: ldaps
        args:
        - --loglevel
        - debug
        env:
        - name: LDAP_DOMAIN
          value: ${SHOGGOTH_DOMAIN}
        - name: LDAP_ADMIN_PASSWORD_FILE
          value: /run/secrets/openldap_admin_password
        - name: LDAP_CONFIG_PASSWORD_FILE
          value: /run/secrets/openldap_config_admin_password
        - name: LDAP_LOG_LEVEL
          value: '256'
        - name: LDAP_TLS
          value: 'false'
        - name: CONTAINER_LOG_LEVEL
          value: '5'
        - name: LDAP_REMOVE_CONFIG_AFTER_SETUP
          value: 'false'
        - name: OTEL_TRACES_EXPORTER
          value: otlp
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://otelcol:4318
        - name: SHOGGOTH_DOMAIN
          value: ${SHOGGOTH_DOMAIN}
        volumeMounts:
        - name: data
          mountPath: /var/lib/ldap
        - name: config
          mountPath: /etc/ldap/slapd.d
        - name: rendered-ldif
          mountPath: /shoggoth/openldap
          readOnly: true
        - name: init-script
          mountPath: /shoggoth/openldap-init.sh
          subPath: init.sh
          readOnly: true
        - name: admin-password
          mountPath: /run/secrets/openldap_admin_password
          subPath: password
          readOnly: true
        - name: config-admin-password
          mountPath: /run/secrets/openldap_config_admin_password
          subPath: password
          readOnly: true
        lifecycle:
          postStart:
            exec:
              command:
              - /bin/bash
              - -c
              - 'set -o pipefail

                echo "=== openldap-init start $(date -Iseconds) ==="

                /bin/bash /shoggoth/openldap-init.sh

                echo "=== openldap-init exit $? $(date -Iseconds) ==="

                '
        resources:
          requests:
            memory: 256Mi
            cpu: 100m
          limits:
            memory: 512Mi
            cpu: 1000m
        readinessProbe:
          exec:
            command:
            - bash
            - -c
            - test -f /run/shoggoth-ldap-init-done
          initialDelaySeconds: 10
          periodSeconds: 5
          failureThreshold: 60
        livenessProbe:
          tcpSocket:
            port: 389
          initialDelaySeconds: 30
          periodSeconds: 10
      volumes:
      - name: init-script
        configMap:
          name: openldap-init
      - name: ldif-templates
        configMap:
          name: openldap-ldif-templates
      - name: render-script
        configMap:
          name: openldap-render-ldif
          defaultMode: 0755
      - name: rendered-ldif
        emptyDir: {}
      - name: data
        persistentVolumeClaim:
          claimName: openldap-data
      - name: config
        persistentVolumeClaim:
          claimName: openldap-config
      - name: admin-password
        secret:
          secretName: openldap-admin-password
      - name: config-admin-password
        secret:
          secretName: openldap-config-admin-password
      - name: ldapauth-password
        secret:
          secretName: openldap-ldapauth-password
      - name: slave-password
        secret:
          secretName: openldap-slave-password
      - name: slave-reviewer-password
        secret:
          secretName: openldap-slave-reviewer-password
      serviceAccountName: openldap
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openldap
  namespace: ${SHOGGOTH_NAMESPACE}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: openldap-bootstrap-wait
  namespace: ${SHOGGOTH_NAMESPACE}
rules:
- apiGroups:
  - ''
  resources:
  - secrets
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: openldap-bootstrap-wait
  namespace: ${SHOGGOTH_NAMESPACE}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: openldap-bootstrap-wait
subjects:
- kind: ServiceAccount
  name: openldap
  namespace: ${SHOGGOTH_NAMESPACE}
