apiVersion: v1
kind: ConfigMap
metadata:
  name: web-external-config
  namespace: ${SHOGGOTH_NAMESPACE}
data:
  angie.conf: |
    load_module modules/ngx_otel_module.so;

    events {
        worker_connections 1024;
    }

    error_log /dev/stderr debug;

    http {
        resolver ${SHOGGOTH_DNS_IP} valid=30s;
        access_log /dev/stdout;

        map $http_upgrade $connection_upgrade {
            default upgrade;
            ''      close;
        }

        otel_exporter {
            endpoint http://otelcol:4317;
        }
        otel_service_name web-external;

        upstream wireguard {
            zone wireguard 1m;
            server wireguard.${SHOGGOTH_NAMESPACE}.svc.cluster.local:${SHOGGOTH_WG_UI_PORT} resolve;
        }

        server {
            listen ${SHOGGOTH_WEB_EXT_PORT} ssl default_server;

            ssl_certificate /data/certs/shoggoth.crt;
            ssl_certificate_key /data/certs/shoggoth.key;
            ssl_protocols TLSv1.2 TLSv1.3;
            ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
            ssl_prefer_server_ciphers off;

            add_header Strict-Transport-Security "max-age=31536000" always;

            proxy_read_timeout 30m;
            proxy_send_timeout 30m;
            proxy_connect_timeout 60s;

            location = /ca.crt {
                alias /data/certs/shoggoth-ca.crt;
                default_type application/x-x509-ca-cert;
            }

            location = /setup-client.sh {
                default_type application/x-sh;
                alias /data/scripts/setup-client.sh;
            }

            location / {
                proxy_pass http://wireguard;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto https;

                proxy_buffering off;
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection $connection_upgrade;
            }
        }
    }
---
apiVersion: v1
kind: Service
metadata:
  name: web-external
  namespace: ${SHOGGOTH_NAMESPACE}
spec:
  selector:
    app: web-external
  ports:
  - name: https
    port: ${SHOGGOTH_WEB_EXT_PORT}
    targetPort: ${SHOGGOTH_WEB_EXT_PORT}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-external
  namespace: ${SHOGGOTH_NAMESPACE}
spec:
  replicas: 1
  strategy:
    type: Recreate
  progressDeadlineSeconds: 120
  selector:
    matchLabels:
      app: web-external
  template:
    metadata:
      labels:
        app: web-external
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      serviceAccountName: web-external
      initContainers:
      - name: wait-bootstrap
        image: asherikov/shoggoth_tools:alpine
        imagePullPolicy: IfNotPresent
        command:
        - bash
        - -c
        args:
        - |
          set -euo pipefail
          NS="${SHOGGOTH_NAMESPACE}"
          wait_for_secret_key() {
            local name="$1" key="$2"
            echo "wait-bootstrap: waiting for secret/${name}.${key} in namespace ${NS}..."
            local ok=0
            for i in $(seq 1 60); do
              # bracket jsonpath: literal key name (Go template treats dots/hyphens as struct descent)
              if kubectl get secret "${name}" -n "${NS}" -o json 2>/dev/null | jq -e --arg k "${key}" '(.data[$k] // "") | length > 0' >/dev/null 2>&1; then
                echo "wait-bootstrap: secret/${name}.${key} populated (after $((i*10))s)"
                ok=1
                break
              fi
              sleep 10
            done
            if [ "${ok}" != "1" ]; then
              echo "FAIL: secret/${name}.${key} not populated after 10m"
              echo "      Hint: openbao-bootstrap Job may have failed to write the Secret; check:"
              echo "            kubectl logs -n ${NS} -l app=openbao -c openbao-bootstrap"
              return 1
            fi
            return 0
          }
          for s in shoggoth-server shoggoth-ca; do
            k="tls.crt"
            [ "${s}" = "shoggoth-ca" ] && k="ca.crt"
            wait_for_secret_key "${s}" "${k}" || exit 1
          done
          echo "wait-bootstrap: all K8s Secrets Ready"
        resources:
          requests:
            memory: 32Mi
            cpu: 50m
          limits:
            memory: 64Mi
            cpu: 200m
      containers:
      - name: angie
        image: docker.angie.software/angie:1.11.6
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: ${SHOGGOTH_WEB_EXT_PORT}
          name: https
        env:
        - name: SHOGGOTH_DOMAIN
          value: ${SHOGGOTH_DOMAIN}
        volumeMounts:
        - name: config
          mountPath: /etc/angie/angie.conf
          subPath: angie.conf
          readOnly: true
        - name: server-cert
          mountPath: /data/certs/shoggoth.crt
          subPath: shoggoth.crt
          readOnly: true
        - name: server-cert
          mountPath: /data/certs/shoggoth.key
          subPath: shoggoth.key
          readOnly: true
        - name: ca-cert
          mountPath: /data/certs/shoggoth-ca.crt
          subPath: shoggoth-ca.crt
          readOnly: true
        - name: setup-client
          mountPath: /data/scripts
          readOnly: true
        resources:
          requests:
            memory: 64Mi
            cpu: 50m
          limits:
            memory: 128Mi
            cpu: 500m
        startupProbe:
          tcpSocket:
            port: ${SHOGGOTH_WEB_EXT_PORT}
          periodSeconds: 5
          failureThreshold: 24
        readinessProbe:
          tcpSocket:
            port: ${SHOGGOTH_WEB_EXT_PORT}
          periodSeconds: 5
          failureThreshold: 3
        livenessProbe:
          tcpSocket:
            port: ${SHOGGOTH_WEB_EXT_PORT}
          periodSeconds: 10
          failureThreshold: 3
      volumes:
      - name: config
        configMap:
          name: web-external-config
      - name: server-cert
        secret:
          secretName: shoggoth-server
          items:
          - key: tls.crt
            path: shoggoth.crt
          - key: tls.key
            path: shoggoth.key
      - name: ca-cert
        secret:
          secretName: shoggoth-ca
          items:
          - key: ca.crt
            path: shoggoth-ca.crt
      - name: setup-client
        hostPath:
          path: /var/lib/rancher/k3s/storage/${SHOGGOTH_INSTANCE_DIR}/scripts
          type: DirectoryOrCreate
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: web-external
  namespace: ${SHOGGOTH_NAMESPACE}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: web-external-bootstrap-wait
  namespace: ${SHOGGOTH_NAMESPACE}
rules:
- apiGroups:
  - ''
  resources:
  - secrets
  resourceNames:
  - shoggoth-server
  - shoggoth-ca
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: web-external-bootstrap-wait
  namespace: ${SHOGGOTH_NAMESPACE}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: web-external-bootstrap-wait
subjects:
- kind: ServiceAccount
  name: web-external
  namespace: ${SHOGGOTH_NAMESPACE}
