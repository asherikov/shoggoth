---
apiVersion: v1
kind: ConfigMap
metadata:
  name: web-external-config
  namespace: ${SHOGGOTH_NAMESPACE}
data:
  angie.conf: |
    load_module modules/ngx_otel_module.so;

    events {
        worker_connections 1024;
    }

    error_log /dev/stderr debug;

    http {
        resolver ${DNS_IP} valid=30s;
        access_log /dev/stdout;

        map $http_upgrade $connection_upgrade {
            default upgrade;
            ''      close;
        }

        otel_exporter {
            endpoint http://otelcol:4317;
        }
        otel_service_name web-external;

        upstream wireguard {
            zone wireguard 1m;
            server wireguard.${SHOGGOTH_NAMESPACE}.svc.cluster.local:${WG_UI_PORT} resolve;
        }

        server {
            listen ${WEB_EXT_PORT} ssl default_server;

            ssl_certificate /data/certs/shoggoth.crt;
            ssl_certificate_key /data/certs/shoggoth.key;
            ssl_protocols TLSv1.2 TLSv1.3;
            ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
            ssl_prefer_server_ciphers off;

            add_header Strict-Transport-Security "max-age=31536000" always;

            proxy_read_timeout 30m;
            proxy_send_timeout 30m;
            proxy_connect_timeout 60s;

            location = /ca.crt {
                alias /data/certs/shoggoth-ca.crt;
                default_type application/x-x509-ca-cert;
            }

            location = /setup-client.sh {
                default_type application/x-sh;
                alias /data/scripts/setup-client.sh;
            }

            location / {
                proxy_pass http://wireguard;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto https;

                proxy_buffering off;
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection $connection_upgrade;
            }
        }
    }
---
apiVersion: v1
kind: Service
metadata:
  name: web-external
  namespace: ${SHOGGOTH_NAMESPACE}
spec:
  selector:
    app: web-external
  ports:
    - name: https
      port: ${WEB_EXT_PORT}
      targetPort: ${WEB_EXT_PORT}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-external
  namespace: ${SHOGGOTH_NAMESPACE}
spec:
  replicas: 1
  strategy:
    type: Recreate
  progressDeadlineSeconds: 120
  selector:
    matchLabels:
      app: web-external
  template:
    metadata:
      labels:
        app: web-external
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      initContainers:
        - name: wait-bringup
          image: busybox:latest
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c"]
          args:
            - |
              echo "wait-bringup: checking sentinel /shoggoth/rendered/.bringup-done"
              if [ ! -f /shoggoth/rendered/.bringup-done ]; then
                echo "wait-bringup: sentinel not found, dumping diagnostics:" >&2
                echo "wait-bringup: /shoggoth/rendered/ exists: $([ -d /shoggoth/rendered ] && echo yes || echo no)" >&2
                if [ -d /shoggoth/rendered ]; then
                  echo "wait-bringup: contents:" >&2
                  ls -la /shoggoth/rendered/ >&2 || true
                fi
                if [ -f /shoggoth/rendered/bringup.log ]; then
                  echo "wait-bringup: bringup.log tail:" >&2
                  tail -20 /shoggoth/rendered/bringup.log >&2 || true
                fi
                echo "wait-bringup: exiting, bringup may still be in progress" >&2
                exit 1
              fi
              echo "wait-bringup: sentinel found"
          resources:
            requests:
              memory: "32Mi"
              cpu: "50m"
            limits:
              memory: "64Mi"
              cpu: "200m"
          volumeMounts:
            - name: rendered
              mountPath: /shoggoth/rendered
              readOnly: true
      containers:
        - name: angie
          image: docker.angie.software/angie:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: ${WEB_EXT_PORT}
              name: https
          env:
            - name: SHOGGOTH_DOMAIN
              value: "${SHOGGOTH_DOMAIN}"
          volumeMounts:
            - name: config
              mountPath: /etc/angie/angie.conf
              subPath: angie.conf
              readOnly: true
            - name: rendered
              mountPath: /data/certs
              subPath: certs
              readOnly: true
            - name: setup-client
              mountPath: /data/scripts
              readOnly: true
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "500m"
          startupProbe:
            tcpSocket:
              port: ${WEB_EXT_PORT}
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            tcpSocket:
              port: ${WEB_EXT_PORT}
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: ${WEB_EXT_PORT}
            periodSeconds: 10
            failureThreshold: 3
      volumes:
        - name: config
          configMap:
            name: web-external-config
        - name: rendered
          hostPath:
            path: /var/lib/rancher/k3s/storage/${SHOGGOTH_INSTANCE_DIR}/rendered
            type: DirectoryOrCreate
        - name: setup-client
          hostPath:
            path: /var/lib/rancher/k3s/storage/${SHOGGOTH_INSTANCE_DIR}/scripts
            type: DirectoryOrCreate
