apiVersion: v1
kind: ConfigMap
metadata:
  name: web-external-config
  namespace: ${SHOGGOTH_NAMESPACE}
data:
  angie.conf: |
    load_module modules/ngx_otel_module.so;

    events {
        worker_connections 1024;
    }

    error_log /dev/stderr debug;

    http {
        resolver ${SHOGGOTH_DNS_IP} valid=30s;
        access_log /dev/stdout;

        map $http_upgrade $connection_upgrade {
            default upgrade;
            ''      close;
        }

        otel_exporter {
            endpoint http://otelcol:4317;
        }
        otel_service_name web-external;

        upstream wireguard {
            zone wireguard 1m;
            server wireguard.${SHOGGOTH_NAMESPACE}.svc.cluster.local:${SHOGGOTH_WG_UI_PORT} resolve;
        }

        server {
            listen ${SHOGGOTH_WEB_EXT_PORT} ssl default_server;

            ssl_certificate /data/certs/shoggoth.crt;
            ssl_certificate_key /data/certs/shoggoth.key;
            ssl_protocols TLSv1.2 TLSv1.3;
            ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
            ssl_prefer_server_ciphers off;

            add_header Strict-Transport-Security "max-age=31536000" always;

            proxy_read_timeout 30m;
            proxy_send_timeout 30m;
            proxy_connect_timeout 60s;

            location = /ca.crt {
                alias /data/certs/shoggoth-ca.crt;
                default_type application/x-x509-ca-cert;
            }

            location = /setup-client.sh {
                default_type application/x-sh;
                alias /data/scripts/setup-client.sh;
            }

            location / {
                proxy_pass http://wireguard;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto https;

                proxy_buffering off;
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection $connection_upgrade;
            }
        }
    }
---
apiVersion: v1
kind: Service
metadata:
  name: web-external
  namespace: ${SHOGGOTH_NAMESPACE}
spec:
  selector:
    app: web-external
  ports:
  - name: https
    port: ${SHOGGOTH_WEB_EXT_PORT}
    targetPort: ${SHOGGOTH_WEB_EXT_PORT}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-external
  namespace: ${SHOGGOTH_NAMESPACE}
spec:
  replicas: 1
  strategy:
    type: Recreate
  progressDeadlineSeconds: 120
  selector:
    matchLabels:
      app: web-external
  template:
    metadata:
      labels:
        app: web-external
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      initContainers:
      - name: wait-bootstrap
        image: asherikov/shoggoth_tools:alpine
        imagePullPolicy: IfNotPresent
        command:
        - bash
        - -c
        args:
        - |
          set -euo pipefail
          K8S_API="${K8S_API:-https://kubernetes.default.svc}"
          SA_TOKEN="$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)"
          SA_CA="/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
          for i in $(seq 1 120); do
            http_code=$(curl -sS --cacert "${SA_CA}" \
              -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer ${SA_TOKEN}" \
              "${K8S_API}/api/v1/namespaces/${SHOGGOTH_NAMESPACE}/secrets/shoggoth-bootstrap-done" || true)
            if [ "${http_code}" = "200" ]; then
              echo "wait-bootstrap: shoggoth-bootstrap-done Secret found"
              exit 0
            fi
            echo "wait-bootstrap: waiting for shoggoth-bootstrap-done Secret (attempt $i/120, http=${http_code})..."
            if [ $((i % 12)) -eq 0 ] && [ "${http_code}" != "404" ]; then
              curl -sS --cacert "${SA_CA}" \
                -H "Authorization: Bearer ${SA_TOKEN}" \
                "${K8S_API}/api/v1/namespaces/${SHOGGOTH_NAMESPACE}/secrets/shoggoth-bootstrap-done" >&2 || true
            fi
            sleep 5
          done
          echo "wait-bootstrap: FATAL: shoggoth-bootstrap-done Secret not found after 600s"
          echo "wait-bootstrap: openbao-bootstrap may have failed; check:"
          echo "  kubectl logs -n ${SHOGGOTH_NAMESPACE} -l app=openbao -c openbao-bootstrap"
          exit 1
        resources:
          requests:
            memory: 32Mi
            cpu: 50m
          limits:
            memory: 64Mi
            cpu: 200m
        volumeMounts: []
      containers:
      - name: angie
        image: docker.angie.software/angie:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: ${SHOGGOTH_WEB_EXT_PORT}
          name: https
        env:
        - name: SHOGGOTH_DOMAIN
          value: ${SHOGGOTH_DOMAIN}
        volumeMounts:
        - name: config
          mountPath: /etc/angie/angie.conf
          subPath: angie.conf
          readOnly: true
        - name: server-cert
          mountPath: /data/certs/shoggoth.crt
          subPath: shoggoth.crt
          readOnly: true
        - name: server-cert
          mountPath: /data/certs/shoggoth.key
          subPath: shoggoth.key
          readOnly: true
        - name: ca-cert
          mountPath: /data/certs/shoggoth-ca.crt
          subPath: shoggoth-ca.crt
          readOnly: true
        - name: setup-client
          mountPath: /data/scripts
          readOnly: true
        resources:
          requests:
            memory: 64Mi
            cpu: 50m
          limits:
            memory: 128Mi
            cpu: 500m
        startupProbe:
          tcpSocket:
            port: ${SHOGGOTH_WEB_EXT_PORT}
          periodSeconds: 5
          failureThreshold: 24
        readinessProbe:
          tcpSocket:
            port: ${SHOGGOTH_WEB_EXT_PORT}
          periodSeconds: 5
          failureThreshold: 3
        livenessProbe:
          tcpSocket:
            port: ${SHOGGOTH_WEB_EXT_PORT}
          periodSeconds: 10
          failureThreshold: 3
      volumes:
      - name: config
        configMap:
          name: web-external-config
      - name: server-cert
        secret:
          secretName: shoggoth-server
          items:
          - key: tls.crt
            path: shoggoth.crt
          - key: tls.key
            path: shoggoth.key
      - name: ca-cert
        secret:
          secretName: shoggoth-ca
          items:
          - key: ca.crt
            path: shoggoth-ca.crt
      - name: setup-client
        hostPath:
          path: /var/lib/rancher/k3s/storage/${SHOGGOTH_INSTANCE_DIR}/scripts
          type: DirectoryOrCreate
      serviceAccountName: web-external
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: web-external
  namespace: ${SHOGGOTH_NAMESPACE}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: web-external-bootstrap-wait
  namespace: ${SHOGGOTH_NAMESPACE}
rules:
- apiGroups:
  - ''
  resources:
  - secrets
  verbs:
  - get
  resourceNames:
  - shoggoth-bootstrap-done
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: web-external-bootstrap-wait
  namespace: ${SHOGGOTH_NAMESPACE}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: web-external-bootstrap-wait
subjects:
- kind: ServiceAccount
  name: web-external
  namespace: ${SHOGGOTH_NAMESPACE}
