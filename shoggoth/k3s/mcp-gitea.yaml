apiVersion: v1
kind: Service
metadata:
  name: mcp-gitea
  namespace: ${SHOGGOTH_NAMESPACE}
spec:
  selector:
    app: mcp-gitea
  ports:
  - name: http
    port: 80
    targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-gitea
  namespace: ${SHOGGOTH_NAMESPACE}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-gitea
  template:
    metadata:
      labels:
        app: mcp-gitea
    spec:
      dnsPolicy: None
      dnsConfig:
        nameservers:
        - ${SHOGGOTH_DNS_IP}
        searches:
        - ${SHOGGOTH_NAMESPACE}.svc.cluster.local
        - svc.cluster.local
        - cluster.local
      initContainers: []
      containers:
      - name: mcp-gitea
        image: docker.gitea.com/gitea-mcp-server:1.7.0
        imagePullPolicy: IfNotPresent
        command:
        - /app/gitea-mcp
        - --port
        - '80'
        ports:
        - containerPort: 80
          name: http
        env:
        - name: MCP_MODE
          value: http
        - name: GITEA_HOST
          value: http://git:80
        - name: GITEA_INSECURE
          value: 'true'
        - name: OTEL_TRACES_EXPORTER
          value: otlp
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://otelcol:4318
        - name: SHOGGOTH_DOMAIN
          value: ${SHOGGOTH_DOMAIN}
        resources:
          requests:
            memory: 64Mi
            cpu: 50m
          limits:
            memory: 128Mi
            cpu: 200m
        readinessProbe:
          tcpSocket:
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
          failureThreshold: 30
        livenessProbe:
          tcpSocket:
            port: 80
          initialDelaySeconds: 15
          periodSeconds: 30
          failureThreshold: 6
        volumeMounts: []
      volumes: []
