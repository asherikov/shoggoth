---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: registry
  namespace: ${SHOGGOTH_NAMESPACE}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Gi
  storageClassName: local-path
---
apiVersion: v1
kind: Service
metadata:
  name: registry
  namespace: ${SHOGGOTH_NAMESPACE}
spec:
  selector:
    app: registry
  ports:
    - name: registry
      port: ${REGISTRY_PORT}
      targetPort: ${REGISTRY_PORT}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: registry-config
  namespace: ${SHOGGOTH_NAMESPACE}
data:
  config.json: |
    {
      "storage": {
        "rootDirectory": "/var/lib/zot",
        "gc": true,
        "retention": {
          "policies": [
            {
              "repositories": ["**"],
              "deleteUntagged": true
            }
          ]
        }
      },
      "http": {
        "address": "0.0.0.0",
        "port": "${REGISTRY_PORT}",
        "readTimeout": "0s",
        "writeTimeout": "0s",
        "compat": ["docker2s2"]
      },
      "log": {
        "level": "info"
      },
      "extensions": {
        "sync": {
          "registries": [
            { "urls": ["https://registry-1.docker.io"], "onDemand": true },
            { "urls": ["https://ghcr.io"], "onDemand": true },
            { "urls": ["https://gcr.io"], "onDemand": true },
            { "urls": ["https://quay.io"], "onDemand": true },
            { "urls": ["https://mcr.microsoft.com"], "onDemand": true },
            { "urls": ["https://codeberg.org"], "onDemand": true },
            { "urls": ["https://docker.gitea.com"], "onDemand": true },
            { "urls": ["https://docker.angie.software"], "onDemand": true },
            { "urls": ["https://public.ecr.aws"], "onDemand": true }
          ]
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry
  namespace: ${SHOGGOTH_NAMESPACE}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: registry
  template:
    metadata:
      labels:
        app: registry
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: registry
          image: ghcr.io/project-zot/zot:latest
          imagePullPolicy: IfNotPresent
          args: ["serve", "/etc/zot/config.json"]
          ports:
            - containerPort: ${REGISTRY_PORT}
              name: registry
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "1"
          readinessProbe:
            httpGet:
              path: /v2/
              port: ${REGISTRY_PORT}
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /v2/
              port: ${REGISTRY_PORT}
            initialDelaySeconds: 30
            periodSeconds: 30
          volumeMounts:
            - name: data
              mountPath: /var/lib/zot
            - name: config
              mountPath: /etc/zot
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: registry
        - name: config
          configMap:
            name: registry-config
