---
# Read-scoped OpenBao SecretStore used by ExternalSecrets to fetch K8s
# Secrets. Authenticates with a dedicated read-only token (shoggoth-eso-read
# policy: read on secret/data/*) minted by openbao-bootstrap Phase B.5 and
# stored at shoggoth-openbao-eso-read-token. Replaces the unscoped root-token
# reference that previously let any K8s actor with secrets/get pivot to
# sys/policies/acl/* and other admin paths.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: shoggoth-openbao
  namespace: ${SHOGGOTH_NAMESPACE}
spec:
  provider:
    vault:
      server: http://openbao:80
      path: secret
      version: v2
      auth:
        tokenSecretRef:
          name: shoggoth-openbao-eso-read-token
          key: token
