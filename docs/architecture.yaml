    style: hh_diagrams_link
    graphviz:
      color: auto
  - link: [otelcol_service, openobserve_service]
    style: hh_diagrams_link
    graphviz:
      color: auto

  # ============================================
  # Shoggoth -> External Services
  # ============================================
  - link: [apt_cache, apt_repos]
    style: hh_diagrams_link
    graphviz:
      color: auto
  - link: [docker_cache, docker_registries]
    style: hh_diagrams_link
    graphviz:
      color: auto
  - link: [proxpi_service, pypi_index]
    style: hh_diagrams_link
    graphviz:
      color: auto
  - link: [dns_service, external_dns]
    style: hh_diagrams_link
    graphviz:
      color: auto
  - link: [ollama_service, cloud_ollama]
    style: hh_diagrams_link
    graphviz:
      color: auto

views:
  # ============================================
  # Single Unified Architecture View
  # ============================================
  - id: architecture
    style: hh_diagrams_view
    tags: ["default"]
    graphviz:
      graph:
        rankdir: LR
        fontsize: 32
      node:
        fontsize: 32
