edges:
  # ============================================
  # Client -> Shoggoth Services
  # ============================================

  # APT client flow (direct via VPN DNS)
  - link: [client_apt, apt_cache]
    style: use_edge

  # Build cache flow (via proxy)
  - link: [client_ccache, build_cache]
    style: use_edge

  # Git client flow (direct SSH)
  - link: [client_git, git_service]
    style: use_edge

  # AI agent flow (direct via VPN DNS → LiteLLM MCP gateway)
  - link: [ai_agent, litellm_service]
    style: use_edge
  - link: [litellm_service, localai_service]
    style: use_edge

  # Git-pages flow (direct via VPN DNS)
  - link: [client_browser, git_pages_service]
    style: use_edge

  # Browser flow (direct via VPN DNS)
  - link: [client_browser, git_service]
    style: use_edge
  - link: [client_browser, home_page]
    style: use_edge
  - link: [client_host, dns_service]
    style: use_edge
  - link: [client_browser, proxy_slave_term]
    style: use_edge

  # Redmine flow (direct via VPN DNS)
  - link: [client_browser, redmine_service]
    style: use_edge

  # Python cache flow (direct via VPN DNS)
  - link: [client_pip, python_cache]
    style: use_edge
  - link: [python_cache, pypi_index]
    style: use_edge

  # Kestra flow (direct via VPN DNS)
  - link: [client_browser, kestra_service]
    style: use_edge

  # Docker registry flow (direct via VPN DNS)
  - link: [host_docker, docker_registry]
    style: use_edge
    tags: [novpn, default]

  - link: [host_docker, docker_cache]
    style: use_edge
    tags: [novpn, default]

  - link: [client_docker, docker_registry]
    style: use_edge

  # Monitoring flow (direct via VPN DNS)
  - link: [client_browser, grafana_service]
    style: use_edge

  # CDash flow (direct via VPN Docker DNS)
  - link: [client_browser, cdash_service]
    style: use_edge

  # phpLDAPadmin flow (direct via VPN Docker DNS)
  - link: [client_browser, phpldapadmin_service]
    style: use_edge

  # WireGuard flow (via web-external TLS proxy from outside VPN)
  - link: [client_browser, web_external]
    style: use_edge
    tags: ["novpn", "default"]
  - link: [web_external, wireguard_service]
    style: use_edge
    tags: ["novpn", "default"]

  # VPN tunnel: client WireGuard -> shoggoth wireguard service
  - link: [client_vpn, wireguard_service]
    style: use_edge
    tags: ["novpn", "default"]

  # ============================================
