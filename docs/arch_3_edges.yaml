    style: use_edge

  # Docker client flow (direct to docker-cache)
  - link: [client_docker, docker_cache]
    style: use_edge

  # Build cache flow (via proxy)
  - link: [client_ccache, build_cache]
    style: use_edge

  # Git client flow (direct SSH)
  - link: [client_git, git_service]
    style: use_edge

  # AI agent flow (via proxy → LiteLLM MCP gateway)
  - link: [ai_agent, proxy_ai]
    style: use_edge
