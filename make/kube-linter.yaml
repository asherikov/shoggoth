# kube-linter configuration for shoggoth.
#
# Consumed by `make helm_lint_kube_linter` and `make helm_lint_inspektor`
# through `--config $(KUBE_LINTER_CONFIG)`. Everything the target buys
# beyond the 63 built-in checks lives in the five custom checks below: CEL
# is the only extensibility mechanism kube-linter offers, and it turns out
# to be enough for the three chart invariants that used to be shell
# targets in make/lint.mk, plus a schema-validation check the built-in one
# cannot be configured to be.
#
# This file is read from INSIDE a container. kube-linter is not a host
# install: both make targets run it from
# `stackrox/kube-linter:v0.8.3-alpine` with the repo mounted read-only at
# /lint, so every path here is a container path and nothing here may name a
# host directory. There is nothing to get wrong today — schemaLocations are
# URLs and no check reads a file — but a future `cache:` would have to be a
# path that exists inside the image, not on the host.
#
# WHY THE RENDER IS PASSED AS A FILE. kube-linter renders Helm charts
# itself, in-process, with no `helm` binary — and it hardcodes
# chartutil.ReleaseOptions{Name: "test-release", Namespace: "default"} and
# passes no values file. Neither spelling is shoggoth's, so the values that
# decide what renders at all would be lost. The make target therefore
# renders with `helm template` into ${LINT_RENDER} and hands kube-linter the
# FILE: every document lands in ONE lint context, which is what makes the
# cross-object `objects.exists(...)` clauses below mean anything. The cost
# is that `.Release.Name` is `shoggoth-lint` and `.Release.Namespace` is
# `lint`, so no check may compare a rendered name against a literal — each
# one resolves it against the same render instead.
#
# TWO RUNS, NOT ONE. helm_lint_kube_linter lints ${LINT_RENDER} with the
# default checks plus these. helm_lint_inspektor lints the gadget-disabled
# render with --do-not-auto-add-defaults, so ONLY the custom checks run
# there: the built-ins would fire on a partial cluster — dangling-service
# alone would flag every Service whose pods the toggle removed — and none
# of that is a regression.
#
# WHAT IS NOT HERE. Four of the eleven helm_lint_* targets stay in make:
# gates, collision, rollout and embedded. They all compare TWO renders, and
# `objects` is scoped to one context with no way to name a second. The
# release-name trick does not rescue them: shoggoth.fullname derives from
# .Release.Name, so a second release renames every resource and the
# comparison collapses. docs/alternatives.md carries the full comparison.

customChecks:

  # helm_lint_roledef, moved out of make.
  #
  # Kubernetes does not validate a roleRef target at admission: the binding
  # is created, then grants nothing, and the bound ServiceAccount loses
  # every rule the ClusterRole carried. `ClusterRoleBinding.roleRef` is also
  # immutable server-side, so a re-apply cannot repair it — the binding has
  # to be deleted and recreated. The chart's gadget rename moved each
  # ClusterRole and its ClusterRoleBinding together, and nothing pinned the
  # two; this is what pins them.
  #
  # The Kubernetes built-in aggregate roles (admin, edit, view,
  # cluster-admin) and the system: ones are created by the cluster, not by
  # this chart, so a binding to one is not a dangling reference.
  #
  # The scope is ClusterRoleBinding rather than an `object.kind ==` guard:
  # kube-linter filters on the scope BEFORE calling the check, so the
  # expression never runs against the other 268 objects in the render. That
  # also makes `object.roleRef` safe to dereference unconditionally — the
  # field has no omitempty, so every ClusterRoleBinding carries one.
  # ClusterRoleBinding is one of the 25 kinds the registry does hold, which
  # is why this check keeps its scope while the three below cannot.
  - name: dangling-clusterrole-ref
    description: >-
      ClusterRoleBinding whose roleRef names a ClusterRole that the same
      render does not define.
    remediation: >-
      Point roleRef at a ClusterRole this chart renders, or at one of the
      cluster-created aggregate roles.
    scope:
      objectKinds:
        - ClusterRoleBinding
    template: cel-expression
    params:
      check: |
        !(object.roleRef.name in ["admin", "edit", "view", "cluster-admin"])
          && !object.roleRef.name.startsWith("system:")
          && object.roleRef.kind == "ClusterRole"
          && !objects.exists(o, o.kind == "ClusterRole" && o.metadata.name == object.roleRef.name)
          ? "ClusterRoleBinding " + object.metadata.name + " binds ClusterRole "
            + object.roleRef.name + ", which this render does not define"
          : ""

# WHY THREE CHECKS BELOW ARE SCOPED TO `Any`.
#
# `scope.objectKinds` is validated against kube-linter's compiled-in object-kind
# registry (pkg/objectkinds), and a name outside it is a hard error raised
# before a single document is read. The registry holds 25 names: Any,
# ClusterRole, ClusterRoleBinding, CronJob, DaemonSet, Deployment,
# DeploymentConfig, DeploymentLike, HorizontalPodAutoscaler, Ingress, Job,
# JobLike, NetworkPolicy, Pod, PodDisruptionBudget, PersistentVolumeClaim,
# ReplicaSet, ReplicationController, Role, RoleBinding, ScaledObject,
# SecurityContextConstraints, Service, ServiceAccount, StatefulSet.
#
# ConfigMap is not one of them, and neither is Secret: kube-linter registers
# only kinds that carry a pod spec or a workload identity, and the plain config
# kinds were never added. Registering one is a Go change —
# objectkinds.RegisterObjectKind, as the cert-manager example in
# docs/custom_resource_template_test.go does — and the config file has no field
# for it, so a ConfigMap-scoped check is unreachable from YAML. The failure is
# at least loud: "unknown object kind: ConfigMap" at registration, never a
# silently disabled check.
#
# The only config-level escape is `Any`, which matches everything, so the
# filtering moves into the expression. Each of the three checks guards on
# something unique to its object before it dereferences anything, which is what
# keeps the other documents cheap — they return "" on the first or second term
# and never reach `data`. The guards are deliberately kind-independent, a name
# and a label both verified unique against the current render, so the checks do
# not depend on TypeMeta surviving the decode.
#
# The cost is that those three run against every object rather than the 41
# ConfigMaps: roughly 834 evaluations, each of which re-serialises the whole
# context to build the `objects` variable. That 834 was counted on the
# no-values render and has not been recounted since — the object total moves
# with the values file, so treat it as an order of magnitude. Seconds, not
# minutes, and not worth splitting the target over.

  # helm_lint_gadget_scope, first half.
  #
  # The gadget instance's `name` label and its `otel-metrics-name` are one
  # string written out in two places: gadget.yaml renders
  # `tcp:<name>` into the annotation, and the same `name` into the label.
  # Nothing derives one from the other, so a rename in either fails
  # nowhere — the metric is exported under a name the operator does not
  # forward, and the series simply never appear.
  #
  # Every optional field is guarded: 41 ConfigMaps render and most of them
  # carry no labels at all, so an unguarded `.labels.type` would be a CEL
  # error on every one of them, reported as a check failure. Note the two
  # spellings — `has()` for a field, `in` for a map key. They are not
  # interchangeable: `has()` takes a field selection only, and
  # `has(object.data["..."])` is a compile error, not a runtime miss. See
  # the note above.
  #
  # Scoped to `Any` because ConfigMap is not a registrable object kind — see
  # the note above. The label is the filter: `type: gadget-instance` sits on
  # exactly one object in the render (ConfigMap top-tcp-lint), so 277 of the
  # 278 documents return "" on the second term. The guards below matter more
  # now than they did when the scope did the filtering: the expression also
  # runs against Services, Secrets and the three ESO CRDs, and a CRD carries
  # no `data` at all.
  - name: gadget-scope-name-matches-metrics
    description: >-
      gadget-instance ConfigMap whose otel-metrics-name is not `tcp:` plus
      its own name label.
    remediation: >-
      Make the operator.otel-metrics.otel-metrics-name data key match
      `tcp:` + the name label.
    scope:
      objectKinds:
        - Any
    template: cel-expression
    params:
      check: |
        has(object.metadata.labels)
          && has(object.metadata.labels.type)
          && object.metadata.labels.type == "gadget-instance"
          && has(object.metadata.labels.name)
          && has(object.data)
          && "operator.otel-metrics.otel-metrics-name" in object.data
          && object.data["operator.otel-metrics.otel-metrics-name"] != "tcp:" + object.metadata.labels.name
          ? "gadget-instance " + object.metadata.name + ": otel-metrics-name "
            + object.data["operator.otel-metrics.otel-metrics-name"]
            + " does not match the name label " + object.metadata.labels.name
          : ""

  # helm_lint_gadget_scope, second half.
  #
  # otelcol's keep action is the other spelling of the same string: an
  # anchored regex that drops every series whose name is not exactly the
  # gadget instance's. A rename in gadget.yaml leaves the regex matching
  # nothing, the scrape still succeeds, and the series disappear — the
  # failure is invisible until someone looks for the metric.
  #
  # The `objects.exists(...)` guard is what keeps this check non-vacuous:
  # with no gadget-instance ConfigMap in the render (gadget disabled) the
  # whole expression short-circuits to "" rather than firing, because there
  # is then no keep-regex to match.
  #
  # Scoped to `Any` because ConfigMap is not a registrable object kind — see
  # the note above. The filter is the name, and it is unique: exactly one
  # object in the render is called otelcol-config, and it is a ConfigMap.
  # `data["config.yaml"]` is presence-tested with `in`, not `has()` — see the
  # note above — and the key exists on six ConfigMaps (gadget,
  # gitea-runner-templates, litellm-templates, loki-config, otelcol-config,
  # tempo-config), so only this one ever dereferences it. Note this check
  # already depended on `o.kind` below, which is populated: the same TypeMeta
  # drives kube-linter's own scope matching, asserted in
  # pkg/lintcontext/parse_yaml_test.go.
  - name: gadget-scope-keep-regex
    description: >-
      otelcol-config keep-regex that matches no gadget-instance name label
      in the same render.
    remediation: >-
      Point the keep action's anchored regex at the gadget instance's name
      label.
    scope:
      objectKinds:
        - Any
    template: cel-expression
    params:
      check: |
        object.metadata.name == "otelcol-config"
          && has(object.data)
          && "config.yaml" in object.data
          && objects.exists(o, o.kind == "ConfigMap"
              && has(o.metadata.labels) && has(o.metadata.labels.type)
              && o.metadata.labels.type == "gadget-instance")
          && !objects.exists(o, o.kind == "ConfigMap"
              && has(o.metadata.labels) && has(o.metadata.labels.type)
              && o.metadata.labels.type == "gadget-instance"
              && has(o.metadata.labels.name)
              && object.data["config.yaml"].contains("regex: \"^" + o.metadata.labels.name + "$\""))
          ? "otelcol-config keep-regex matches no gadget-instance name label"
          : ""

  # helm_lint_inspektor, moved out of make.
  #
  # The inspektor scrape job targets gadget.<ns>.svc.cluster.local, a
  # Service that exists only while services.gadget.enabled is true.
  # helm_lint_gates cannot see an ungated job: it compares only the
  # kind/name ids of each key's own resources, and otelcol-config renders
  # byte-identically in both renders. This is the check that closes it,
  # and it is why helm_lint_inspektor now runs kube-linter over the
  # gadget-disabled render rather than grepping it.
  #
  # Non-vacuity is the whole problem with this check: evaluated against a
  # render where the job is correctly absent it returns "", which is
  # indistinguishable from a check that never ran. The two `grep -c`
  # assertions in the make target are what prove both halves — the job is
  # present in the full render, and otelcol-config (which is NOT gated on
  # gadget) is still there in the disabled one.
  #
  # Scoped to `Any` because ConfigMap is not a registrable object kind — see
  # the note above. The filter is the name, unique to the one ConfigMap, and
  # `job_name: inspektor` is what the check actually looks for. The guard
  # order matters more than it did under a ConfigMap scope: 277 documents now
  # return "" on the first term, and none of them can reach the `objects`
  # traversal. `data["config.yaml"]` is presence-tested with `in`, not
  # `has()` — see the note above.
  - name: inspektor-job-gated
    description: >-
      otelcol-config still defines the inspektor scrape job while the
      gadget Service is absent from the render.
    remediation: >-
      Gate the inspektor job on services.gadget.enabled the way the rest of
      the gadget resources are gated.
    scope:
      objectKinds:
        - Any
    template: cel-expression
    params:
      check: |
        object.metadata.name == "otelcol-config"
          && has(object.data)
          && "config.yaml" in object.data
          && object.data["config.yaml"].contains("job_name: inspektor")
          && !objects.exists(o, o.kind == "Service" && o.metadata.name == "gadget")
          ? "otelcol-config defines the inspektor scrape job while services.gadget is disabled"
          : ""

  # helm_lint_dupes, absorbed — and then some.
  #
  # A CUSTOM kubeconform check, not the built-in `schema-validation`, for
  # two reasons.
  #
  # First, the name. pkg/command/lint/command.go registers all 63 built-ins
  # into the registry BEFORE the custom checks, and Register() returns
  # "duplicate check name" on a collision — so a custom check cannot be
  # called `schema-validation` at all. Naming it anything else is not a
  # workaround, it is the only option.
  #
  # Second, and the reason to want the name: the built-in has no
  # schemaLocations for the three ESO CRDs the chart emits (ExternalSecret,
  # SecretStore, PushSecret). With no location it would either skip them
  # (ignoreMissingSchemas: true) or fail them (false), and neither is a
  # validation of anything. Adding the datreeio/CRDs-catalog location
  # covers them.
  #
  # `strict: true` is what makes this absorb helm_lint_dupes as well:
  # kubeconform switches from yaml.Unmarshal to yaml.UnmarshalStrict, which
  # is what reports duplicate mapping keys. The `-strict` suffix on the
  # yannh schema path is a second, separate effect — it selects the
  # schema set that also carries additionalProperties: false. The
  # duplicate-key half was verified against a real render; the
  # additionalProperties half was not, because the render available at the
  # time was the no-values one (see the note further down) and it failed
  # this check outright. Dropping strict to false loses the duplicate-key
  # half, and helm_lint_dupes would have to come back.
  #
  # `ignoreMissingSchemas: false` is deliberate. A gate that silently skips
  # a kind it has no schema for is worse than one that fails: the first
  # person to add a kind the schemas do not cover should find out here.
  # Every kind the chart emits was believed covered — 15 in the yannh
  # `default` set under `master-standalone-strict` and the 3 ESO CRDs in
  # CRDs-catalog — so nothing is skipped. That belief was measured against
  # the no-values render and has not been re-checked since; the three null
  # port findings this check produced were real schema errors that render
  # had, and the render was replaced underneath the check. Re-count the
  # kinds in `.tmp/lint/render.yaml` after `make helm_lint_render`. If a
  # new kind lacks a schema, this is the flag to flip, and the comment here
  # is the reminder that flipping it disables the gate for that kind rather
  # than fixing it.
  #
  # No `kubernetesVersion` is set, so kubeconform defaults it to `master`
  # and pulls the moving `master-standalone-strict` schema set. That is the
  # set that carries `additionalProperties: false`, which is what makes
  # `strict` more than a duplicate-key detector — a pinned version would
  # pin the gate to a cluster the chart does not claim to target.
  #
  # No `cache:` is set. A disk cache would make repeat runs fast and
  # offline, but it would also serve a stale schema after an upstream fix
  # at the same URL, which for a validation gate is the wrong trade.
  - name: schema-validation-with-crds
    description: >-
      Every rendered object validated against the Kubernetes JSON schemas,
      strictly, including the three external-secrets CRDs.
    remediation: >-
      Fix the field the schema rejects, or add a schema location for a kind
      the sets do not cover.
    template: kubeconform
    params:
      strict: true
      ignoreMissingSchemas: false
      schemaLocations:
        - default
        - https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json

# Which of the 32 default-on checks run. Two are added — they are off by
# default and are what replaced the forward half of helm_lint_netpol — and
# twelve are removed.
#
# The twelve are removed because they fire on this chart BY DESIGN, not
# because they are wrong. kube-linter's defaults are written for a generic
# multi-tenant cluster; shoggoth is a single-host k3s box running
# third-party images it does not own and mounting host paths on purpose. A
# gate that reports a hundred deliberate choices is a gate nobody reads,
# so each is switched off with the design fact that explains it. Every
# count below is re-measurable: `make helm_lint_render`, then count.
#
#   drop-net-raw-capability          55 of 61 containers. The chart sets no
#                                    capabilities block on any container it
#                                    owns; the images that need raw sockets
#                                    (ping, traceroute, dig) are upstream's
#                                    to harden.
#   env-var-secret                    One env var: redmine's
#                                    REDMINE_SECRET_KEY_BASE_FILE, whose
#                                    VALUE is the path /run/secrets/... and
#                                    not a secret. The check matches on the
#                                    NAME, so a path is reported as one.
#   host-network                      3 Deployments: registry, web-external,
#                                    wireguard. Each binds a host port.
#   job-ttl-seconds-after-finished     The openbao-bootstrap Job. The other
#                                    three set 600. This one is a defect,
#                                    not a decision — see the note below.
#   no-read-only-root-fs              54 of 61 containers. The 7 that do set
#                                    it are the ESO operator trio, gadget,
#                                    headroom, reloader and secret-purge.
#   privilege-escalation-container    55 of 61. The 6 that do set it are the
#                                    ESO trio, headroom, reloader and
#                                    secret-purge.
#   privileged-container               localai, slave-dind, wireguard.
#   run-as-non-root                   55 of 61. The 6 that do set it are the
#                                    argo controller, the ESO trio,
#                                    headroom and reloader.
#   sensitive-host-mounts             gadget and otelcol mount /etc, /usr,
#                                    /proc, / and /sys. Both are host-level
#                                    daemons: Inspektor Gadget reads eBPF and
#                                    cgroup state, the collector reads host
#                                    metrics. That is what they are for.
#   ssh-port                          Service `git` exposes 22 — gitea's SSH.
#   unset-cpu-requirements            11 containers.
#   unset-memory-requirements         The same 11.
#
# The remaining twenty defaults stay on, and they are what earns the target
# its keep: dangling-service, mismatching-selector,
# non-existent-service-account, duplicate-env-var, latest-tag, host-ipc,
# host-pid, unsafe-sysctls, docker-sock, deprecated-service-account-field,
# no-extensions-v1beta, invalid-target-ports, liveness-port,
# readiness-port, startup-port, no-anti-affinity, the two pdb checks and
# pdb-unhealthy-pod-eviction-policy.
#
# They are NOT all clean, and earlier revisions of this file claimed they
# were. That claim was false twice over. First, liveness-port,
# readiness-port and startup-port fired five findings — coredns on 8181,
# cert-controller on 8081, webhook on 8081 — because three containers
# probe a health port they never declared in `ports:`. All three now
# declare it (dns.yaml coredns, external-secrets.yaml cert-controller and
# webhook), so the claim is expected to hold again on the next run.
# Second, every count in this file — the container tallies, the kind count,
# the evaluation counts — was measured against the render produced while
# `SHOGGOTH_HELM_VALUES` was undefined, i.e. with no `--values`. That render
# had `port:` as YAML null on three Services, null containerPorts, null
# clusterIP, hostPaths under /var/lib/rancher/k3s/storage// and seven
# empty-string env values, so it did not describe anything deployable. The
# Makefile fix (SHOGGOTH_HELM_VALUES = --values $(SHOGGOTH_CONFIG)) is what
# makes these counts about the real render; they have not been re-measured
# since. `make helm_lint_render` then count.
#
# no-anti-affinity in particular is a guard rather than noise: it only
# fires at replicas >= 2, and every Deployment and StatefulSet here sets 1.
#
# The openbao-bootstrap gap is left visible rather than papered over. It is
# the one exclusion that is a defect and not a decision: it is excluded so
# the gate is green, and written down so the next person reading this file
# knows to fix templates/openbao-bootstrap.yaml instead of the config.
checks:
  include:
    - dangling-networkpolicy
    - dangling-networkpolicypeer-podselector
  exclude:
    - drop-net-raw-capability
    - env-var-secret
    - host-network
    - job-ttl-seconds-after-finished
    - no-read-only-root-fs
    - privilege-escalation-container
    - privileged-container
    - run-as-non-root
    - sensitive-host-mounts
    - ssh-port
    - unset-cpu-requirements
    - unset-memory-requirements
